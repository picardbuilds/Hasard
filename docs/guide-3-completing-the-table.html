title:"All 157 positions, and proving them",
lede:"Generate every legal place a chip can sit, then write the test that proves not one of them pays the wrong amount.",
blocks:[
{t:'h',x:'Twelve rules produce 157 positions'},
{t:'p',x:'Nothing about the layout is hand-authored. One function walks twelve rules over the grid and produces every position in a fixed order, and that order is the contract &mdash; a position&rsquo;s id is simply its index in the array.'},
{t:'table',head:['Rule','How many','Where the chip sits'],rows:[
['Zero, then every cell','1 + 36','center of a box'],
['Splits within a column','12 x 2 = 24','line between two stacked cells'],
['Splits across columns','11 x 3 = 33','line between two side-by-side cells'],
['Splits with zero','3','line between the zero box and column 0'],
['Streets','12','far edge, at the end of one column'],
['Trios','2','the zero box edge'],
['Corners','11 x 2 = 22','where four cells meet'],
['Basket','1','far corner of the zero box'],
['Six lines','11','far edge, between two columns'],
['Column bets','3','the 2:1 box past the last cell'],
['Dozens','3','near band, four grid columns each'],
['Even money','6','the band beyond the dozens'],
['<b>Total</b>','<b>157</b>','']]},
{t:'chk',q:'There are 12 columns and 11 gaps between them. Why are there 24 splits within a column but 33 across columns?',a:'<b>Because the two directions have different counts of gaps.</b> Within a column there are 3 cells and so 2 gaps, across all 12 columns: 12 x 2 = 24. Across columns there are 11 gaps, and each gap is shared by all 3 rows: 11 x 3 = 33. The asymmetry is the grid being 12 by 3 rather than square, and it is the sort of thing worth counting twice before it becomes 60 array entries.'},

{t:'h',x:'The id is the index, and that is a promise'},
{t:'p',x:'<code>AddPosition</code> stamps <code>PositionId</code> from <code>OutPositions.Num()</code> as it appends. So position 0 is always zero, position 1 is always the number 1, and the six even-money bets are always the last six. Nothing looks a position up by name.'},
{t:'code',x:`void UHasardTableLayout::AddPosition(TArray&lt;FHasardBetPosition&gt;&amp; OutPositions, ...) const
{
	FHasardBetPosition Position;
	Position.PositionId = OutPositions.Num();   // the index is the id, so they cannot drift
	// ...
	OutPositions.Add(MoveTemp(Position));
}`},
{t:'warn',lab:'Reordering the generator changes what old bets mean',x:'<p>Making the id the index is what keeps a bet down to a single <code>int32</code>, and it costs you something in return: <b>the order of the twelve rules is now part of your data format.</b> Insert a new rule in the middle and every position after it shifts by one. Any bet recorded before that change now names a different position &mdash; silently, because an <code>int32</code> has no way to complain.</p><p>Nothing persists a bet yet, so today this costs nothing. The moment guide 4 writes a bet to a save file it becomes real, and the fix then is a version number on the layout, not a promise to be careful. <b>Add new rules at the end, and when you cannot, expect to migrate.</b></p>'},
{t:'aside',lab:'Why generate rather than author',x:'157 rows in a data table would be 157 chances to typo a covered number, and a wrong entry would be a bet that quietly pays the wrong odds &mdash; the exact failure guide 2 module 13 was written to prevent. Generated positions can be wrong too, but they can only be wrong <i>systematically</i>, which is a class of error a test can catch in one run. That is the whole argument, and it is the same one that put the payout table in data.'},

{t:'h',x:'The claim, and the test that checks it'},
{t:'p',x:'Guide 2 put <b>2.70%</b> on screen and then proved the wheel was uniform. That was half the claim. The other half is that <i>every bet on the felt</i> pays that same 2.70% &mdash; and now that there are 157 of them rather than 3, checking by eye is not available.'},
{t:'p',x:'The audit walks every generated position, finds its payout row, and checks three things: that a row exists at all, that the row agrees about how many numbers the bet covers, and that the resulting edge is 1/37. Any one of those failing is a bet that pays the wrong amount.'},
{t:'warn',lab:'Two different things are called CoveredNumbers',x:'<code>FHasardBetPosition::CoveredNumbers</code> is a <code>TArray&lt;int32&gt;</code> holding the actual numbers. <code>FHasardPayoutRule::CoveredNumbers</code> is a plain <code>int32</code> holding how many there are meant to be. They are deliberately compared against each other in the audit &mdash; <code>Position.CoveredNumbers.Num() != Rule-&gt;CoveredNumbers</code> is the line, and it looks like a mistake until you know that. It is the one name collision in the project, it comes from guide 2, and renaming it now would touch the payout table, the betting component and the HUD.'},
{t:'chk',q:'The audit finds a corner position whose payout row says 4 covered numbers, but the position holds 3. Which is wrong?',a:'<b>You cannot tell, and that is why the check exists.</b> Either the generator built a corner at the edge of the grid that only picked up three cells, or the payout row was typed wrong. What the check gives you is the position id and the display name, which is enough to look at both. A test that tells you <i>where</i> to look is worth more than one that only says pass or fail.'},

{t:'build',title:'Generate them, then audit them',file:'Source/Hasard/HasardTableLayout.h + .cpp, HasardGameMode.h + .cpp, DA_HasardPayouts',x:'<p><b>Phase 1 &mdash; Visual Studio.</b> No new classes. Four files change, all shown complete and marked against <b>module 1&rsquo;s</b> version, not guide 2&rsquo;s &mdash; so an unmarked line is one you typed an hour ago and should leave alone.</p> <p><b>1.</b> <code>HasardTableLayout.h</code>, complete. Two declarations join module 1&rsquo;s version &mdash; <code>BuildPositions</code> in <code>public:</code> and the <code>AddPosition</code> helper in <code>private:</code>:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"                       // int32, TArray, FVector2D, the core macros\n#include "Engine/DataAsset.h"                  // UDataAsset, the base class\n~|#include "HasardTypes.h"                       // EHasardBetType, FHasardBetPosition\n#include "HasardTableLayout.generated.h"       // ALWAYS LAST\n\n/**\n * Every measurement of the felt, in one asset.\n *\n * The visible layout and the click detection are both generated from these numbers,\n * so they cannot disagree with each other. Nothing else in the project may hard-code\n * a cell size or a grid origin.\n */\nUCLASS(BlueprintType)\nclass HASARD_API UHasardTableLayout : public UDataAsset\n{\n	GENERATED_BODY()\n\npublic:\n	/** The number at a grid cell. Column 0 row 0 is 1; column 0 row 2 is 3; column 1 row 0 is 4. */\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	int32 GetNumberAt(int32 Column, int32 Row) const;\n\n	/** Grid column holding a number, 0-11. INDEX_NONE for zero or an out-of-range number. */\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	int32 GetColumnOf(int32 Number) const;\n\n	/** Grid row holding a number, 0-2. INDEX_NONE for zero or an out-of-range number. */\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	int32 GetRowOf(int32 Number) const;\n\n	/** Center of one cell, in the felt\'s local 2D space. */\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	FVector2D GetCellCenter(int32 Column, int32 Row) const;\n\n	/** Far corner of the number grid, so callers can size the felt without repeating the sum. */\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	FVector2D GetGridExtent() const;\n\n+|	/** Builds all 157 bet positions. Deterministic: same asset in, same array out, same order. */\n+|	void BuildPositions(TArray&lt;FHasardBetPosition&gt;&amp; OutPositions) const;\n+|\n	/** True for the eighteen red numbers on a single-zero wheel. */\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	bool IsRedNumber(int32 Number) const;\n\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	int32 GetNumberColumns() const { return NumberColumns; }\n\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	int32 GetNumberRows() const { return NumberRows; }\n\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	float GetLineTolerance() const { return LineTolerance; }\n\nprivate:\n+|	/** Adds one position and stamps its PositionId from the array index. */\n+|	void AddPosition(TArray&lt;FHasardBetPosition&gt;&amp; OutPositions, EHasardBetType BetType,\n+|		const TArray&lt;int32&gt;&amp; Covered, const FVector2D&amp; ChipLocation, const FText&amp; DisplayName) const;\n+|\n	/** Twelve columns of three. Editable only because a future variant may differ. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n		meta = (AllowPrivateAccess = "true", ClampMin = "1"))\n	int32 NumberColumns = 12;\n\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n		meta = (AllowPrivateAccess = "true", ClampMin = "1"))\n	int32 NumberRows = 3;\n\n	/** Size of one number cell in centimeters, along the twelve columns. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n		meta = (AllowPrivateAccess = "true", ClampMin = "1.0"))\n	float CellSizeX = 12.0f;\n\n	/** Size of one number cell in centimeters, across the three rows. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n		meta = (AllowPrivateAccess = "true", ClampMin = "1.0"))\n	float CellSizeY = 12.0f;\n\n	/** Felt-local position of the near corner of cell (0,0). Everything is measured from here. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n		meta = (AllowPrivateAccess = "true"))\n	FVector2D GridOrigin = FVector2D::ZeroVector;\n\n	/** Width of the zero box, which sits at negative X of the grid and spans all three rows. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n		meta = (AllowPrivateAccess = "true", ClampMin = "1.0"))\n	float ZeroBoxWidth = 12.0f;\n\n	/** Depth of each outside-bet band. Dozens sit against the grid, even-money beyond them. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n		meta = (AllowPrivateAccess = "true", ClampMin = "1.0"))\n	float OutsideBandDepth = 12.0f;\n\n	/**\n	 * How close to a line counts as being on it, as a fraction of a cell.\n	 * 0.22 means the middle 56% of a cell is a straight up and the rest is a line bet.\n	 */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n		meta = (AllowPrivateAccess = "true", ClampMin = "0.05", ClampMax = "0.45"))\n	float LineTolerance = 0.22f;\n};\n</code></pre><p><code>BuildPositions</code> is not a <code>UFUNCTION</code>, because <code>TArray&lt;FHasardBetPosition&gt;&amp;</code> as an out-parameter is C++ ergonomics rather than something a Blueprint should be doing. <code>AddPosition</code> is <code>private</code> for the guide 2 module 3 reason: it is how the class talks to itself, and letting anything outside append a position would let it append one with the wrong id.</p> <p><b>2.</b> <code>HasardTableLayout.cpp</code>, complete. This is the long one, and it is twelve blocks in the order of the table above:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#include "HasardTableLayout.h"   // the class this file defines\n~|#include "HasardTypes.h"         // EHasardBetType, FHasardBetPosition\n\n#define LOCTEXT_NAMESPACE "Hasard"\n\nint32 UHasardTableLayout::GetNumberAt(int32 Column, int32 Row) const\n{\n	if (Column &lt; 0 || Column &gt;= NumberColumns || Row &lt; 0 || Row &gt;= NumberRows)\n	{\n		return INDEX_NONE;\n	}\n\n	return Column * NumberRows + Row + 1;\n}\n\nint32 UHasardTableLayout::GetColumnOf(int32 Number) const\n{\n	if (Number &lt; 1 || Number &gt; NumberColumns * NumberRows)\n	{\n		return INDEX_NONE;\n	}\n\n	return (Number - 1) / NumberRows;\n}\n\nint32 UHasardTableLayout::GetRowOf(int32 Number) const\n{\n	if (Number &lt; 1 || Number &gt; NumberColumns * NumberRows)\n	{\n		return INDEX_NONE;\n	}\n\n	return (Number - 1) % NumberRows;\n}\n\nFVector2D UHasardTableLayout::GetCellCenter(int32 Column, int32 Row) const\n{\n	return FVector2D(\n		GridOrigin.X + (static_cast&lt;float&gt;(Column) + 0.5f) * CellSizeX,\n		GridOrigin.Y + (static_cast&lt;float&gt;(Row) + 0.5f) * CellSizeY);\n}\n\nFVector2D UHasardTableLayout::GetGridExtent() const\n{\n	return FVector2D(\n		GridOrigin.X + NumberColumns * CellSizeX,\n		GridOrigin.Y + NumberRows * CellSizeY);\n}\n\nbool UHasardTableLayout::IsRedNumber(int32 Number) const\n{\n	// The eighteen reds on a single-zero wheel. Not derivable from the number:\n	// the sequence alternates within each half but breaks at 10/11 and 28/29.\n	static const TSet&lt;int32&gt; RedNumbers = {\n		1, 3, 5, 7, 9, 12, 14, 16, 18,\n		19, 21, 23, 25, 27, 30, 32, 34, 36 };\n\n	return RedNumbers.Contains(Number);\n}\n\n+|void UHasardTableLayout::AddPosition(TArray&lt;FHasardBetPosition&gt;&amp; OutPositions,\n+|	EHasardBetType BetType, const TArray&lt;int32&gt;&amp; Covered,\n+|	const FVector2D&amp; ChipLocation, const FText&amp; DisplayName) const\n+|{\n+|	FHasardBetPosition Position;\n+|	Position.PositionId = OutPositions.Num();   // the index is the id, so they cannot drift\n+|	Position.BetType = BetType;\n+|	Position.CoveredNumbers = Covered;\n+|	Position.CoveredNumbers.Sort();\n+|	Position.ChipLocation = ChipLocation;\n+|	Position.DisplayName = DisplayName;\n+|\n+|	OutPositions.Add(MoveTemp(Position));\n+|}\n+|\n+|void UHasardTableLayout::BuildPositions(TArray&lt;FHasardBetPosition&gt;&amp; OutPositions) const\n+|{\n+|	OutPositions.Reset();\n+|	OutPositions.Reserve(157);\n+|\n+|	const float GridFarY = GridOrigin.Y + NumberRows * CellSizeY;\n+|	const float ZeroCenterX = GridOrigin.X - ZeroBoxWidth * 0.5f;\n+|	const float ZeroCenterY = GridOrigin.Y + NumberRows * CellSizeY * 0.5f;\n+|\n+|	// 1. Zero, then one straight up per cell.\n+|	AddPosition(OutPositions, EHasardBetType::StraightUp, { 0 },\n+|		FVector2D(ZeroCenterX, ZeroCenterY), LOCTEXT("Zero", "0"));\n+|\n+|	for (int32 Column = 0; Column &lt; NumberColumns; ++Column)\n+|	{\n+|		for (int32 Row = 0; Row &lt; NumberRows; ++Row)\n+|		{\n+|			const int32 Number = GetNumberAt(Column, Row);\n+|			AddPosition(OutPositions, EHasardBetType::StraightUp, { Number },\n+|				GetCellCenter(Column, Row), FText::AsNumber(Number));\n+|		}\n+|	}\n+|\n+|	// 2. Splits within a column: the chip sits on the line between two stacked cells.\n+|	for (int32 Column = 0; Column &lt; NumberColumns; ++Column)\n+|	{\n+|		for (int32 Row = 0; Row &lt; NumberRows - 1; ++Row)\n+|		{\n+|			const int32 Low = GetNumberAt(Column, Row);\n+|			const int32 High = GetNumberAt(Column, Row + 1);\n+|			AddPosition(OutPositions, EHasardBetType::Split, { Low, High },\n+|				FVector2D(GetCellCenter(Column, Row).X,\n+|					GridOrigin.Y + (Row + 1) * CellSizeY),\n+|				FText::Format(LOCTEXT("SplitFmt", "{0}/{1}"),\n+|					FText::AsNumber(Low), FText::AsNumber(High)));\n+|		}\n+|	}\n+|\n+|	// 3. Splits across columns: the chip sits on the line between two side-by-side cells.\n+|	for (int32 Column = 0; Column &lt; NumberColumns - 1; ++Column)\n+|	{\n+|		for (int32 Row = 0; Row &lt; NumberRows; ++Row)\n+|		{\n+|			const int32 Left = GetNumberAt(Column, Row);\n+|			const int32 Right = GetNumberAt(Column + 1, Row);\n+|			AddPosition(OutPositions, EHasardBetType::Split, { Left, Right },\n+|				FVector2D(GridOrigin.X + (Column + 1) * CellSizeX,\n+|					GetCellCenter(Column, Row).Y),\n+|				FText::Format(LOCTEXT("SplitFmt", "{0}/{1}"),\n+|					FText::AsNumber(Left), FText::AsNumber(Right)));\n+|		}\n+|	}\n+|\n+|	// 4. The three splits that pair zero with the first column.\n+|	for (int32 Row = 0; Row &lt; NumberRows; ++Row)\n+|	{\n+|		const int32 Number = GetNumberAt(0, Row);\n+|		AddPosition(OutPositions, EHasardBetType::Split, { 0, Number },\n+|			FVector2D(GridOrigin.X, GetCellCenter(0, Row).Y),\n+|			FText::Format(LOCTEXT("ZeroSplitFmt", "0/{0}"), FText::AsNumber(Number)));\n+|	}\n+|\n+|	// 5. Streets: one whole column of three, chip on the far edge.\n+|	for (int32 Column = 0; Column &lt; NumberColumns; ++Column)\n+|	{\n+|		TArray&lt;int32&gt; Covered;\n+|		for (int32 Row = 0; Row &lt; NumberRows; ++Row)\n+|		{\n+|			Covered.Add(GetNumberAt(Column, Row));\n+|		}\n+|\n+|		AddPosition(OutPositions, EHasardBetType::Street, Covered,\n+|			FVector2D(GetCellCenter(Column, 0).X, GridFarY),\n+|			FText::Format(LOCTEXT("StreetFmt", "Street {0}-{1}"),\n+|				FText::AsNumber(Covered[0]), FText::AsNumber(Covered.Last())));\n+|	}\n+|\n+|	// 6. The two trios. Three numbers for 11:1, same as a street, and the only\n+|	//    other way to reach zero with three.\n+|	AddPosition(OutPositions, EHasardBetType::Trio, { 0, 1, 2 },\n+|		FVector2D(GridOrigin.X, GridOrigin.Y + CellSizeY), LOCTEXT("Trio012", "Trio 0/1/2"));\n+|	AddPosition(OutPositions, EHasardBetType::Trio, { 0, 2, 3 },\n+|		FVector2D(GridOrigin.X, GridOrigin.Y + 2 * CellSizeY), LOCTEXT("Trio023", "Trio 0/2/3"));\n+|\n+|	// 7. Corners: the chip sits where four cells meet.\n+|	for (int32 Column = 0; Column &lt; NumberColumns - 1; ++Column)\n+|	{\n+|		for (int32 Row = 0; Row &lt; NumberRows - 1; ++Row)\n+|		{\n+|			const TArray&lt;int32&gt; Covered = {\n+|				GetNumberAt(Column, Row), GetNumberAt(Column, Row + 1),\n+|				GetNumberAt(Column + 1, Row), GetNumberAt(Column + 1, Row + 1) };\n+|\n+|			AddPosition(OutPositions, EHasardBetType::Corner, Covered,\n+|				FVector2D(GridOrigin.X + (Column + 1) * CellSizeX,\n+|					GridOrigin.Y + (Row + 1) * CellSizeY),\n+|				FText::Format(LOCTEXT("CornerFmt", "Corner {0}"),\n+|					FText::AsNumber(GetNumberAt(Column, Row))));\n+|		}\n+|	}\n+|\n+|	// 8. The basket. Four numbers for 8:1 on a single-zero wheel, which is why\n+|	//    the shared-edge audit still passes. The American five-number bet does not.\n+|	AddPosition(OutPositions, EHasardBetType::Basket, { 0, 1, 2, 3 },\n+|		FVector2D(GridOrigin.X, GridFarY), LOCTEXT("Basket", "Basket 0/1/2/3"));\n+|\n+|	// 9. Six lines: two adjacent streets, chip on the far edge between them.\n+|	for (int32 Column = 0; Column &lt; NumberColumns - 1; ++Column)\n+|	{\n+|		TArray&lt;int32&gt; Covered;\n+|		for (int32 Offset = 0; Offset &lt; 2; ++Offset)\n+|		{\n+|			for (int32 Row = 0; Row &lt; NumberRows; ++Row)\n+|			{\n+|				Covered.Add(GetNumberAt(Column + Offset, Row));\n+|			}\n+|		}\n+|\n+|		AddPosition(OutPositions, EHasardBetType::SixLine, Covered,\n+|			FVector2D(GridOrigin.X + (Column + 1) * CellSizeX, GridFarY),\n+|			FText::Format(LOCTEXT("SixLineFmt", "Six line {0}-{1}"),\n+|				FText::AsNumber(Covered[0]), FText::AsNumber(Covered.Last())));\n+|	}\n+|\n+|	// 10. Column bets. A grid row is a 2:1 column: the box sits past the last cell.\n+|	for (int32 Row = 0; Row &lt; NumberRows; ++Row)\n+|	{\n+|		TArray&lt;int32&gt; Covered;\n+|		for (int32 Column = 0; Column &lt; NumberColumns; ++Column)\n+|		{\n+|			Covered.Add(GetNumberAt(Column, Row));\n+|		}\n+|\n+|		AddPosition(OutPositions, EHasardBetType::Column, Covered,\n+|			FVector2D(GridOrigin.X + NumberColumns * CellSizeX + OutsideBandDepth * 0.5f,\n+|				GetCellCenter(0, Row).Y),\n+|			FText::Format(LOCTEXT("ColumnFmt", "Column {0}"), FText::AsNumber(Row + 1)));\n+|	}\n+|\n+|	// 11. Dozens. Four grid columns each, in the band on the near side.\n+|	for (int32 Dozen = 0; Dozen &lt; 3; ++Dozen)\n+|	{\n+|		TArray&lt;int32&gt; Covered;\n+|		for (int32 Number = Dozen * 12 + 1; Number &lt;= Dozen * 12 + 12; ++Number)\n+|		{\n+|			Covered.Add(Number);\n+|		}\n+|\n+|		AddPosition(OutPositions, EHasardBetType::Dozen, Covered,\n+|			FVector2D(GridOrigin.X + (Dozen * 4 + 2) * CellSizeX,\n+|				GridOrigin.Y - OutsideBandDepth * 0.5f),\n+|			FText::Format(LOCTEXT("DozenFmt", "Dozen {0}"), FText::AsNumber(Dozen + 1)));\n+|	}\n+|\n+|	// 12. The six even-money bets, in the band beyond the dozens.\n+|	const float EvenMoneyY = GridOrigin.Y - OutsideBandDepth * 1.5f;\n+|	const float EvenMoneySpan = NumberColumns * CellSizeX / 6.0f;\n+|\n+|	TArray&lt;int32&gt; Low, High, Even, Odd, Red, Black;\n+|	for (int32 Number = 1; Number &lt;= NumberColumns * NumberRows; ++Number)\n+|	{\n+|		(Number &lt;= 18 ? Low : High).Add(Number);\n+|		(Number % 2 == 0 ? Even : Odd).Add(Number);\n+|		(IsRedNumber(Number) ? Red : Black).Add(Number);\n+|	}\n+|\n+|	const TArray&lt;EHasardBetType&gt; EvenMoneyTypes = {\n+|		EHasardBetType::Low, EHasardBetType::Even, EHasardBetType::Red,\n+|		EHasardBetType::Black, EHasardBetType::Odd, EHasardBetType::High };\n+|\n+|	const TArray&lt;TArray&lt;int32&gt;&gt; EvenMoneySets = { Low, Even, Red, Black, Odd, High };\n+|\n+|	const TArray&lt;FText&gt; EvenMoneyNames = {\n+|		LOCTEXT("Low", "1-18"), LOCTEXT("Even", "Even"), LOCTEXT("Red", "Red"),\n+|		LOCTEXT("Black", "Black"), LOCTEXT("Odd", "Odd"), LOCTEXT("High", "19-36") };\n+|\n+|	for (int32 Index = 0; Index &lt; EvenMoneyTypes.Num(); ++Index)\n+|	{\n+|		AddPosition(OutPositions, EvenMoneyTypes[Index], EvenMoneySets[Index],\n+|			FVector2D(GridOrigin.X + (Index + 0.5f) * EvenMoneySpan, EvenMoneyY),\n+|			EvenMoneyNames[Index]);\n+|	}\n+|}\n+|\n#undef LOCTEXT_NAMESPACE\n</code></pre><p><code>LOCTEXT_NAMESPACE</code> at the top and <code>#undef</code> at the bottom are what let <code>LOCTEXT</code> work in a .cpp. Every one of those needs a unique key within the namespace, except that reusing a key with <i>identical</i> text is allowed &mdash; which is why both split loops can share <code>SplitFmt</code>.</p> <p><code>OutPositions.Reserve(157)</code> is not a micro-optimization dressed up as one: without it a <code>TArray</code> growing to 157 reallocates about eight times, and since the reserve number is also documentation of what the function promises, it earns its line.</p> <p><b>3.</b> <code>HasardGameMode.h</code>, complete. One new exec declaration:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"                   // int32, TObjectPtr, the core macros\n#include "GameFramework/GameModeBase.h"    // AGameModeBase, the base class\n#include "HasardGameMode.generated.h"      // ALWAYS LAST\n\nclass AHasardWheel;         // pointer only, so a forward declaration is enough\nclass UHasardPayoutTable;   // pointer only\nclass UHasardTableLayout;   // pointer only\n\nUENUM(BlueprintType)\nenum class EHasardRoundPhase : uint8\n{\n	Betting  UMETA(DisplayName = "Betting"),\n	Spinning UMETA(DisplayName = "Spinning"),\n	Settling UMETA(DisplayName = "Settling")\n};\n\nUCLASS()\nclass HASARD_API AHasardGameMode : public AGameModeBase\n{\n	GENERATED_BODY()\n\npublic:\n	AHasardGameMode();\n\n	/** Console: HasardTestDistribution 370000 */\n	UFUNCTION(Exec)\n	void HasardTestDistribution(int32 SpinCount);\n\n	/** Console: HasardShowCell 17 */\n	UFUNCTION(Exec)\n	void HasardShowCell(int32 Number);\n+|\n+|	/** Console: HasardAuditLayout */\n+|	UFUNCTION(Exec)\n+|	void HasardAuditLayout();\n\n	/** Settles one round against the payout table. */\n	UFUNCTION(BlueprintCallable, Category = "Hasard|Round")\n	void ResolveRound(int32 WinningPocket);\n\n	/** The HUD reads odds through this. Const: nothing may edit the table at runtime. */\n	const UHasardPayoutTable* GetPayoutTable() const { return PayoutTable; }\n\n	/** The felt reads its measurements through this. Const for the same reason. */\n	const UHasardTableLayout* GetTableLayout() const { return TableLayout; }\n\nprotected:\n	virtual void BeginPlay() override;\n	virtual void EndPlay(const EEndPlayReason::Type EndPlayReason) override;\n\nprivate:\n	/** Bound to the wheel delegate in BeginPlay. UFUNCTION is what AddDynamic resolves by name. */\n	UFUNCTION()\n	void HandleBallSettled(int32 WinningPocket);\n\n	/** Cached so EndPlay unbinds from the same wheel BeginPlay bound to. */\n	UPROPERTY()\n	TObjectPtr&lt;AHasardWheel&gt; BoundWheel;\n\n	/** Assigned on BP_HasardGameMode. Payouts never come from a literal. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Round",\n		meta = (AllowPrivateAccess = "true"))\n	TObjectPtr&lt;UHasardPayoutTable&gt; PayoutTable;\n\n	/** Assigned on BP_HasardGameMode. Measurements never come from a literal either. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Round",\n		meta = (AllowPrivateAccess = "true"))\n	TObjectPtr&lt;UHasardTableLayout&gt; TableLayout;\n\n	UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category = "Hasard|Round",\n		meta = (AllowPrivateAccess = "true"))\n	EHasardRoundPhase CurrentPhase = EHasardRoundPhase::Betting;\n\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Round",\n		meta = (AllowPrivateAccess = "true", ClampMin = "1.0"))\n	float BettingWindowSeconds = 30.0f;\n};\n</code></pre><p><b>4.</b> <code>HasardGameMode.cpp</code>, complete:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#include "HasardGameMode.h"           // the class this file defines\n#include "HasardBettingComponent.h"   // SettleRound\n#include "HasardPayoutTable.h"        // PayoutTable-&gt;Rules, FindRule, GetHouseEdge\n#include "HasardPlayerController.h"   // AHasardPlayerController::StaticClass()\n#include "HasardPlayerState.h"        // AHasardPlayerState::StaticClass()\n~|#include "HasardTableLayout.h"        // BuildPositions, GetCellCenter\n~|#include "HasardTypes.h"              // LogHasard, FHasardBetPosition\n#include "HasardWheel.h"              // DetermineWinningPocket, GetPocketCount\n#include "GameFramework/Pawn.h"       // APawn, and FindComponentByClass on it\n#include "Kismet/GameplayStatics.h"   // GetActorOfClass, GetPlayerPawn\n#include "Engine/World.h"             // UWorld, complete for the WorldContextObject parameter\n\nDEFINE_LOG_CATEGORY(LogHasard);\n\nAHasardGameMode::AHasardGameMode()\n{\n	PlayerControllerClass = AHasardPlayerController::StaticClass();\n	PlayerStateClass = AHasardPlayerState::StaticClass();\n}\n\nvoid AHasardGameMode::BeginPlay()\n{\n	Super::BeginPlay();\n\n	UE_LOG(LogHasard, Warning, TEXT("GameMode BeginPlay - phase %s, betting window: %.1fs"),\n		*UEnum::GetValueAsString(CurrentPhase), BettingWindowSeconds);\n\n	AActor* Found = UGameplayStatics::GetActorOfClass(GetWorld(), AHasardWheel::StaticClass());\n\n	if (AHasardWheel* Wheel = Cast&lt;AHasardWheel&gt;(Found))\n	{\n		Wheel-&gt;OnBallSettled.AddDynamic(this, &amp;AHasardGameMode::HandleBallSettled);\n		BoundWheel = Wheel;\n	}\n	else\n	{\n		UE_LOG(LogHasard, Error, TEXT("GameMode: no wheel in the level - rounds will never resolve"));\n	}\n\n	if (!TableLayout)\n	{\n		UE_LOG(LogHasard, Error, TEXT("GameMode: no table layout on BP_HasardGameMode"));\n	}\n\n	if (!PayoutTable)\n	{\n		UE_LOG(LogHasard, Error, TEXT("GameMode: no payout table on BP_HasardGameMode"));\n		return;\n	}\n\n	// The audit. Fifteen rows, one line each, and the edge column is the claim\n	// this project exists to make - so the game states it out loud on every run.\n	for (const FHasardPayoutRule&amp; Rule : PayoutTable-&gt;Rules)\n	{\n		UE_LOG(LogHasard, Warning,\n			TEXT("Payout audit: %s pays %d:1, covers %d/%d, true odds %.2f:1, edge %.2f%%"),\n			*Rule.DisplayName.ToString(), Rule.PayoutRatio, Rule.CoveredNumbers,\n			PayoutTable-&gt;PocketCount, PayoutTable-&gt;GetTrueOdds(Rule),\n			PayoutTable-&gt;GetHouseEdge(Rule) * 100.0f);\n	}\n\n	float SharedEdge = 0.0f;\n	if (!PayoutTable-&gt;TryGetSharedHouseEdge(SharedEdge))\n	{\n		UE_LOG(LogHasard, Error,\n			TEXT("Payout audit: the rows do not share one edge. A row is wrong."));\n	}\n}\n\nvoid AHasardGameMode::EndPlay(const EEndPlayReason::Type EndPlayReason)\n{\n	// The rule the PlayerController already follows: whoever binds, unbinds.\n	if (BoundWheel)\n	{\n		BoundWheel-&gt;OnBallSettled.RemoveDynamic(this, &amp;AHasardGameMode::HandleBallSettled);\n		BoundWheel = nullptr;\n	}\n\n	Super::EndPlay(EndPlayReason);\n}\n\nvoid AHasardGameMode::HandleBallSettled(int32 WinningPocket)\n{\n	UE_LOG(LogHasard, Warning, TEXT("Ball settled in pocket %d"), WinningPocket);\n	ResolveRound(WinningPocket);\n}\n\nvoid AHasardGameMode::ResolveRound(int32 WinningPocket)\n{\n	CurrentPhase = EHasardRoundPhase::Settling;\n\n	APawn* PlayerPawn = UGameplayStatics::GetPlayerPawn(GetWorld(), 0);\n	UHasardBettingComponent* Betting =\n		PlayerPawn ? PlayerPawn-&gt;FindComponentByClass&lt;UHasardBettingComponent&gt;() : nullptr;\n\n	if (!PayoutTable)\n	{\n		UE_LOG(LogHasard, Error, TEXT("ResolveRound: no payout table on BP_HasardGameMode"));\n	}\n	else if (!Betting)\n	{\n		UE_LOG(LogHasard, Warning, TEXT("ResolveRound: no betting component to settle"));\n	}\n	else\n	{\n		Betting-&gt;SettleRound(WinningPocket, PayoutTable);\n	}\n\n	// Whatever happened above, the table reopens. A round that cannot settle must\n	// not strand the game in Settling forever.\n	CurrentPhase = EHasardRoundPhase::Betting;\n}\n\nvoid AHasardGameMode::HasardTestDistribution(int32 SpinCount)\n{\n	if (SpinCount &lt;= 0)\n	{\n		UE_LOG(LogHasard, Error, TEXT("SpinCount must be positive"));\n		return;\n	}\n\n	AHasardWheel* Wheel = Cast&lt;AHasardWheel&gt;(\n		UGameplayStatics::GetActorOfClass(this, AHasardWheel::StaticClass()));\n	if (!Wheel)\n	{\n		UE_LOG(LogHasard, Error, TEXT("No wheel in the level"));\n		return;\n	}\n\n	const int32 PocketCount = Wheel-&gt;GetPocketCount();\n\n	TArray&lt;int32&gt; Counts;\n	Counts.Init(0, PocketCount);\n\n	for (int32 i = 0; i &lt; SpinCount; ++i)\n	{\n		Counts[Wheel-&gt;DetermineWinningPocket()]++;\n	}\n\n	const float Expected = static_cast&lt;float&gt;(SpinCount) / PocketCount;\n\n	for (int32 Pocket = 0; Pocket &lt; PocketCount; ++Pocket)\n	{\n		const float Deviation = (Counts[Pocket] - Expected) / Expected * 100.0f;\n		UE_LOG(LogHasard, Display, TEXT("Pocket %2d: %5d hits (%+.1f%% from expected)"),\n			Pocket, Counts[Pocket], Deviation);\n	}\n}\n\nvoid AHasardGameMode::HasardShowCell(int32 Number)\n{\n	if (!TableLayout)\n	{\n		UE_LOG(LogHasard, Error, TEXT("No table layout on BP_HasardGameMode"));\n		return;\n	}\n\n	if (Number == 0)\n	{\n		UE_LOG(LogHasard, Display, TEXT("0 has its own box beside the grid, so it has no column or row"));\n		return;\n	}\n\n	const int32 Column = TableLayout-&gt;GetColumnOf(Number);\n	const int32 Row = TableLayout-&gt;GetRowOf(Number);\n\n	if (Column == INDEX_NONE || Row == INDEX_NONE)\n	{\n		UE_LOG(LogHasard, Error, TEXT("%d is not a number on this grid"), Number);\n		return;\n	}\n\n	const FVector2D Center = TableLayout-&gt;GetCellCenter(Column, Row);\n\n	UE_LOG(LogHasard, Display, TEXT("%d is column %d, row %d - center (%.1f, %.1f), %s"),\n		Number, Column, Row, Center.X, Center.Y,\n		TableLayout-&gt;IsRedNumber(Number) ? TEXT("red") : TEXT("black"));\n}\n+|\n+|void AHasardGameMode::HasardAuditLayout()\n+|{\n+|	if (!TableLayout || !PayoutTable)\n+|	{\n+|		UE_LOG(LogHasard, Error,\n+|			TEXT("Assign both TableLayout and PayoutTable on BP_HasardGameMode"));\n+|		return;\n+|	}\n+|\n+|	TArray&lt;FHasardBetPosition&gt; Positions;\n+|	TableLayout-&gt;BuildPositions(Positions);\n+|\n+|	// The claim being tested: every position on a single-zero table pays 2.70% to the house.\n+|	const float ExpectedEdge = 1.0f / static_cast&lt;float&gt;(PayoutTable-&gt;PocketCount);\n+|\n+|	TMap&lt;EHasardBetType, int32&gt; CountByType;\n+|	int32 Offenders = 0;\n+|\n+|	for (const FHasardBetPosition&amp; Position : Positions)\n+|	{\n+|		CountByType.FindOrAdd(Position.BetType)++;\n+|\n+|		const FHasardPayoutRule* Rule = PayoutTable-&gt;FindRule(Position.BetType);\n+|		if (!Rule)\n+|		{\n+|			UE_LOG(LogHasard, Error, TEXT("Position %d (%s): no payout row for this bet type"),\n+|				Position.PositionId, *Position.DisplayName.ToString());\n+|			++Offenders;\n+|			continue;\n+|		}\n+|\n+|		// Two different CoveredNumbers: the position holds the actual numbers,\n+|		// the payout row holds how many there are meant to be. They must agree.\n+|		if (Position.CoveredNumbers.Num() != Rule-&gt;CoveredNumbers)\n+|		{\n+|			UE_LOG(LogHasard, Error,\n+|				TEXT("Position %d (%s): covers %d numbers, payout row expects %d"),\n+|				Position.PositionId, *Position.DisplayName.ToString(),\n+|				Position.CoveredNumbers.Num(), Rule-&gt;CoveredNumbers);\n+|			++Offenders;\n+|			continue;\n+|		}\n+|\n+|		if (!FMath::IsNearlyEqual(PayoutTable-&gt;GetHouseEdge(*Rule), ExpectedEdge, 0.0001f))\n+|		{\n+|			UE_LOG(LogHasard, Error, TEXT("Position %d (%s): edge %.2f%%, expected %.2f%%"),\n+|				Position.PositionId, *Position.DisplayName.ToString(),\n+|				PayoutTable-&gt;GetHouseEdge(*Rule) * 100.0f, ExpectedEdge * 100.0f);\n+|			++Offenders;\n+|		}\n+|	}\n+|\n+|	for (const TPair&lt;EHasardBetType, int32&gt;&amp; Pair : CountByType)\n+|	{\n+|		UE_LOG(LogHasard, Display, TEXT("%s: %d positions"),\n+|			*UEnum::GetDisplayValueAsText(Pair.Key).ToString(), Pair.Value);\n+|	}\n+|\n+|	UE_LOG(LogHasard, Display, TEXT("%d positions generated, %d failing the edge check"),\n+|		Positions.Num(), Offenders);\n+|}\n</code></pre><p>The expected edge is computed as <code>1.0f / PayoutTable-&gt;PocketCount</code> rather than typed as <code>0.027</code>. A literal there would be a second place the number 37 lives, and the whole point of this project is that it lives in exactly one.</p> <p><b>Phase 2 &mdash; the payout table needs two new rows.</b></p> <p><b>5.</b> The enum gained <code>Trio</code> and <code>Basket</code> in module 1, and the audit will report both as having no payout row until the asset catches up. Content Browser &rarr; <code>Content/Data</code> &rarr; double-click <code>DA_HasardPayouts</code>. On the <b>Rules</b> array press <b>+</b> twice and fill the two new elements exactly:</p> <table><thead><tr><th>Bet Type</th><th>Display Name</th><th>Payout Ratio</th><th>Covered Numbers</th></tr></thead><tbody> <tr><td><code>Trio</code></td><td>Trio</td><td>11</td><td>3</td></tr> <tr><td><code>Basket</code></td><td>Basket</td><td>8</td><td>4</td></tr> </tbody></table> <p><b>6.</b> While that asset is open, fix the typo: the <b>High 19-36</b> row reads <code>High 19-35</code> in its Display Name. It is one character on the readout whose entire job is being accurate. Press <code>Ctrl+S</code>.</p> <p><b>Phase 3 &mdash; build and audit.</b></p> <p><b>7.</b> Save all, close the editor, <code>Ctrl+Shift+B</code>, confirm <code>Build: 1 succeeded, 0 failed</code>, reopen, open <code>L_RouletteTest</code>.</p> <p><b>8.</b> <b>Window &rarr; Output Log</b>, filter <code>LogHasard</code>. Press <b>Play</b>. Before you touch the console, read the payout audit that <code>BeginPlay</code> prints: it should now be <b>fifteen</b> rows, every one ending <code>edge 2.70%</code>, and no line saying the rows do not share one edge.</p> <p><b>9.</b> Press <code>~</code> and run:</p> <pre><code>HasardAuditLayout</code></pre> <p><b>10.</b> Fifteen summary lines and a total. The order of the type lines is not fixed, because they come from a <code>TMap</code>:</p> <pre><code>LogHasard: Display: Straight Up: 37 positions\nLogHasard: Display: Split: 60 positions\nLogHasard: Display: Street: 12 positions\nLogHasard: Display: Trio: 2 positions\nLogHasard: Display: Corner: 22 positions\nLogHasard: Display: Basket: 1 positions\nLogHasard: Display: Six Line: 11 positions\nLogHasard: Display: Column: 3 positions\nLogHasard: Display: Dozen: 3 positions\nLogHasard: Display: Red: 1 positions\nLogHasard: Display: Black: 1 positions\nLogHasard: Display: Even: 1 positions\nLogHasard: Display: Odd: 1 positions\nLogHasard: Display: Low 1-18: 1 positions\nLogHasard: Display: High 19-36: 1 positions\nLogHasard: Display: 157 positions generated, 0 failing the edge check</code></pre> <p><b>That is the module.</b> <b>157</b> and <b>0</b> are the two numbers that matter. Check the counts against the table at the top of this module as well &mdash; 37, 60, 12, 2, 22, 1, 11, 3, 3 and six ones &mdash; because a total of 157 made of the wrong parts is still wrong.</p> <p><b>The three failures worth recognizing.</b> <code>no payout row for this bet type</code> on two positions means step 5 was skipped or a Bet Type dropdown was left on its default. A <code>covers N numbers, payout row expects M</code> line names the position id, so read that position&rsquo;s rule in <code>BuildPositions</code> and the matching row in the asset side by side. And a count that is close but not equal &mdash; 156, or 158 &mdash; is almost always a loop bound: the across-column loops stop at <code>NumberColumns - 1</code> and the within-column loops at <code>NumberRows - 1</code>, because a gap needs something on both sides of it.</p> <p><b>11.</b> Paste the summary into <code>docs/layout-audit.md</code> with today&rsquo;s date, next to <code>distribution-test.md</code>. Same reason as guide 2: the claim is only as good as the evidence you kept.</p> <p><b>12.</b> Commit.</p> <pre><code>git add -A\ngit commit -m "Generate and audit all 157 bet positions"</code></pre>'},

quiz:[
{q:'A position&rsquo;s <code>PositionId</code> is:',
 opts:['Authored by hand in the data asset','Its index in the generated array','A hash of its covered numbers','Random but stable'],

{q:'Why are there 33 splits across columns but only 24 within a column?',
 opts:['Zero adds nine extra','Across-column splits pay differently','Corners are counted twice','11 gaps shared by 3 rows against 12 columns with 2 gaps each'],
 c:3,why:'11 x 3 = 33 and 12 x 2 = 24. The asymmetry is the grid being 12 by 3. Getting either loop bound wrong gives a total near 157 that is still wrong.'},
{q:'The audit computes the expected edge as <code>1.0f / PocketCount</code> rather than writing 0.027. Why?',
 opts:['So 37 lives in exactly one place in the project','Floats cannot hold 0.027','It is faster','To support a double-zero wheel'],
 c:0,why:'A literal would be a second home for the number 37, and a project whose whole argument is that payouts come from data should not then hard-code the pocket count in its own test.'},

/* ---------------------------------------------------------- 3 */
{
grp:"Part II \u2014 Betting on the Felt",
num:"03",
title:"The felt, and the click that becomes a bet",
lede:"157 positions have existed as data since module 2. This is the module where they become a table you can bet on, and where a bet stops being a number.",
blocks:[
{t:'h',x:'One actor, not 157'},
{t:'p',x:'The felt is a single actor with a single collision box. That is not an optimization, it is forced: <b>83 of the 157 positions are lines and corners</b>, and a line between two cells has no area of its own. There is nothing for it to own a collision volume with. Give every position an actor and the 37 straight ups work, while the splits, corners and six lines have nowhere to live &mdash; so you would add 83 invisible overlapping boxes and spend the rest of the project deciding which one a click hit.'},
{t:'p',x:'So the felt is one surface, and the arithmetic decides what a point on it means. That is also how a real table works: nobody presses a button, the croupier reads where the chip is sitting.'},
{t:'h',x:'A bet stops being a number'},
{t:'p',x:'<code>FHasardBet</code> has carried a <code>BetType</code> and a <code>PrimaryNumber</code> since guide 2. Both go, replaced by a single <code>PositionId</code>.'},
{t:'code',x:`USTRUCT(BlueprintType)
struct FHasardBet
{
	GENERATED_BODY()

	UPROPERTY(BlueprintReadOnly, Category = "Hasard|Bet")
	int32 PositionId = INDEX_NONE;

	UPROPERTY(BlueprintReadOnly, Category = "Hasard|Bet")
	int32 Stake = 0;
};`},
{t:'p',x:'Losing <code>BetType</code> is the part worth pausing on. The bet does not need it, because the <i>position</i> knows what type it is &mdash; and storing a second copy on the bet would let the two disagree. A bet whose <code>BetType</code> says Corner while its position covers three numbers is a bug you can create in one assignment, and it would pay out wrongly forever without a single error line.'},
{t:'rg',lab:'Why this deletes a bug class rather than fixing one',x:'<p>An unsettleable bet is no longer something the code refuses. It is something the data model <b>cannot express</b>. A bet is an index into a generated array, so the only bets that exist are bets the table generated, and every one of those has covered numbers and a payout row that the module 2 audit already checked.</p><p>That is why <code>BetCoversPocket</code> is not rewritten in this module. It is deleted. Ninety lines, including the thirteen-case switch, <code>IsSettleableBetType</code>, and the two refusal cases from module 1.5 &mdash; all replaced by one line:</p><pre><code>if (!Position-&gt;CoveredNumbers.Contains(WinningPocket))</code></pre><p>Zero needs no special case. Trio and Basket need no special case. Nothing does.</p>'},
{t:'chk',q:'Module 1.5 added <code>IsSettleableBetType</code> and two <code>case</code> labels to refuse Trio and Basket. This module deletes all three. Was 1.5 wasted work?',a:'<b>No, and the distinction matters.</b> Between 1.5 and now, the enum had two bet types that <i>could</i> be placed and <i>could not</i> be settled. Refusing them cost nine lines and closed a hole for the two modules the hole was open. The alternative was not \'skip 1.5\' &mdash; it was \'ship a build that takes money for bets that cannot win\'. A guard deleted because the thing it guarded against became impossible is a guard that did its job.'},
{t:'h',x:'The interface has to carry the point'},
{t:'p',x:'<code>TraceForInteractable</code> returned <code>AActor*</code>, and <code>OnPlayerInteract</code> took only the instigating pawn. Between them they threw away the one thing a felt needs: <b>where</b> the trace hit.'},
{t:'p',x:'For a bet spot that was fine, because the actor <i>was</i> the bet. For a felt it is fatal &mdash; every position shares one actor, so an interface that says only \'something was clicked\' cannot express a split. Both signatures change, and the trace now returns the whole <code>FHitResult</code>.'},
{t:'aside',lab:'Why the whole hit result, not just the point',x:'<code>FHitResult</code> already carries the actor, the impact point, the normal and the component. Returning the point alone would mean the caller needs a second out-parameter for the actor, and the next thing that wants the normal &mdash; a chip that lies flat on a tilted table, say &mdash; would need a third. Returning the struct and a <code>bool</code> is the shape that stops growing.'},
{t:'warn',lab:'The sweep that reports a hit at the wrong place',x:'The trace is a sphere sweep, and a sweep that <i>starts</i> already overlapping something reports <code>bStartPenetrating</code> with <code>ImpactPoint</code> left at the trace origin &mdash; the player&rsquo;s eyes. Resolve that and you get a bet nowhere near where anyone was looking. The component refuses those hits rather than passing them on, which is three lines and the difference between a rare wrong bet and none.'},
{t:'h',x:'Reading the felt: five regions, not two'},
{t:'p',x:'<code>ResolvePosition</code> lives on the layout asset, not on the felt actor. It is arithmetic over the asset&rsquo;s own numbers, it needs no world, and putting it here means the felt cannot develop a second opinion about what a point means.'},
{t:'p',x:'The obvious shape is two cases: inside the grid, or outside it. The real shape is five, and the ordering is load-bearing.'},
{t:'table',head:['#','Region','Test','Answers'],rows:[['1','Bands below the grid','<code>y &lt; GridOrigin.Y</code>','dozens, then the six even-money bets'],['2','Past the far column','<code>x &gt; gridFarX</code>','the three column boxes'],['3','<b>The zero seam</b>','<code>|x &minus; GridOrigin.X| &le; tol</code>','a 0/N split, a trio, or the basket'],['4','Inside the zero box','<code>x &lt; GridOrigin.X</code>','straight up on zero'],['5','The number grid','otherwise','far edge &rarr; street or six line; else corner, split or straight up']]},
{t:'warn',lab:'The zero seam is five answers on one line',x:'<p>Region 3 is the one that catches people, and it caught this guide. The natural test is <code>if (x &lt; GridOrigin.X) return zero;</code> &mdash; and it is wrong, because six positions have their <code>ChipLocation</code> at <b>exactly</b> <code>x = GridOrigin.X</code>. That line is not the edge of the zero box, it is the boundary <i>between</i> the zero box and column one, and a chip on it is a bet on both.</p><p>Written the obvious way, all six become grid bets: the three 0/N splits pay as straight ups on 1, 2 and 3, the two trios pay as splits, and the basket pays as street 1/2/3. Every one is the right amount of money on the wrong bet, and nothing reports it.</p>'},
{t:'p',x:'Region 5 has the same shape one level down. Streets and six lines sit <i>on</i> the grid&rsquo;s far edge, so that edge must be answered <b>before</b> the corner test &mdash; there is no fourth cell above the top row, and a chip up there is never a corner.'},
{t:'h',x:'LineTolerance was very nearly a lie'},
{t:'p',x:'There is a much shorter resolver: walk all 157 positions and return the nearest <code>ChipLocation</code>. It is six lines, and it resolves every one of the 157 correctly. It is also wrong, and quietly.'},
{t:'p',x:'Nearest-neighbor puts the boundary between a straight up and a line bet exactly halfway between the cell center and the cell edge &mdash; at 0.25 of a cell, always. Your asset says <code>LineTolerance = 0.22</code>, which documents a boundary at 0.28. They disagree in a band around every cell edge, in both axes:'},
{t:'table',head:['Offset from center','Nearest neighbor','LineTolerance = 0.22'],rows:[['0.20 of a cell','straight up','straight up'],['0.24','straight up','straight up'],['<b>0.26</b>','<b>line bet</b>','<b>straight up</b>'],['<b>0.28</b>','<b>line bet</b>','<b>straight up</b>'],['0.30','line bet','line bet']]},
{t:'rg',lab:'A knob wired to nothing',x:'<p>Write the short version and <code>LineTolerance</code> becomes a property with a tooltip, a <code>ClampMin</code>, a <code>ClampMax</code> and no effect whatsoever. A designer could set it to 0.05 or to 0.45 and the felt would behave identically, and nothing would say so.</p><p>That is the same failure as the two red lists in module 1.5, one step worse: not two sources of truth disagreeing, but a documented control that is not connected. The explicit version is longer, and it is the version where the tooltip is true.</p>'},
{t:'h',x:'157 positions, built once'},
{t:'p',x:'Module 2 generated the positions inside the audit and threw them away. The felt needs them on every click, so the layout now caches them &mdash; and the cache is deliberately <b>not</b> a <code>UPROPERTY</code>.'},
{t:'aside',lab:'Why derived data must not be serialized',x:'Make <code>CachedPositions</code> a <code>UPROPERTY</code> and 157 entries get written into the <code>.uasset</code>. Change <code>CellSizeX</code> afterwards and the asset now contains two contradictory descriptions of the same felt: the measurements you edited, and a saved array generated from the old ones. Whichever the code reads first wins. Keeping it a plain <code>mutable</code> member means the only copy is the one built from the numbers currently in the asset.'},
{t:'p',x:'<code>PostEditChangeProperty</code> clears the cache, because editing any measurement moves every position. Rebuilding 157 entries costs nothing next to a felt that draws itself from numbers it no longer has.'},
{t:'chk',q:'<code>GetPositionById</code> does an <code>IsValidIndex</code> check and an array index, with no search. Why is that safe?',a:'<b>Because <code>AddPosition</code> stamps <code>PositionId</code> from <code>OutPositions.Num()</code>,</b> so the id <i>is</i> the index &mdash; that was the promise module 2 made when it refused to expose <code>AddPosition</code> to Blueprint. Settlement looks up a position for every bet on every spin, and this is why that costs a bounds check rather than a scan of 157 entries.'},
{t:'h',x:'What the drawing proves, and what it does not'},
{t:'p',x:'The debug overlay draws the grid from <code>GetGridOrigin</code> and <code>GetCellSize</code>, and the chip locations from the generated positions. Both come from the one asset, so if a point sits slightly off a line, the arithmetic that placed it and the arithmetic that drew the line disagree &mdash; and you can <i>see</i> it.'},
{t:'p',x:'That is worth having because module 2&rsquo;s audit cannot catch it. The audit checks covered numbers and house edges; it never looks at a coordinate. A position could sit two centimeters off its line, pay out perfectly, pass every check, and send every click near it to the neighboring bet.'},
{t:'warn',lab:'Debug lines do not survive packaging',x:'<code>DrawDebugLine</code> and friends compile out of a Shipping build. This overlay is a verification tool, not the table &mdash; the felt you would ship needs real geometry, and it must be generated from the same two numbers for exactly the reason above. Until then, <code>bDrawDebugLayout</code> is how you see what you are betting on.'},
{t:'srcs',x:[['Traces and sweeps','https://dev.epicgames.com/documentation/en-us/unreal-engine/traces-with-raycasts-in-unreal-engine'],['Interfaces','https://dev.epicgames.com/documentation/en-us/unreal-engine/interfaces-in-unreal-engine'],['Debug drawing','https://dev.epicgames.com/documentation/en-us/unreal-engine/draw-debug-helpers-in-unreal-engine'],['Data Assets','https://dev.epicgames.com/documentation/en-us/unreal-engine/data-assets-in-unreal-engine']]},
{t:'build',title:'The felt, and the click',file:'Source/Hasard/ - ten files, two new, two deleted',x:'<p><b>Phase 1 &mdash; the editor, once.</b></p> <p><b>1.</b> <b>Tools &rarr; New C++ Class</b> &rarr; parent <b>Actor</b> &rarr; name it <code>HasardFelt</code>. Confirm module <b>Hasard (Runtime)</b>. Decline the recompile and close the editor: eight other files are about to change.</p> <p><b>Phase 2 &mdash; Visual Studio.</b> Every file complete, marked against where module 2 left it.</p> <p><b>2.</b> <code>HasardTypes.h</code>. <code>FHasardBet</code> loses both its fields and gains one:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"             // int32, uint8, TArray, FVector2D, the logging macros\n#include "HasardTypes.generated.h"   // ALWAYS LAST\n\n/** One category for the whole project. Defined once, in HasardGameMode.cpp. */\nDECLARE_LOG_CATEGORY_EXTERN(LogHasard, Log, All);\n\nUENUM(BlueprintType)\nenum class EHasardBetType : uint8\n{\n~|	StraightUp  UMETA(DisplayName = "Straight Up"),\n~|	Split       UMETA(DisplayName = "Split"),\n~|	Street      UMETA(DisplayName = "Street"),\n~|	Trio        UMETA(DisplayName = "Trio"),\n~|	Corner      UMETA(DisplayName = "Corner"),\n~|	Basket      UMETA(DisplayName = "Basket"),\n~|	SixLine     UMETA(DisplayName = "Six Line"),\n~|	Column      UMETA(DisplayName = "Column"),\n~|	Dozen       UMETA(DisplayName = "Dozen"),\n~|	Red         UMETA(DisplayName = "Red"),\n	Black       UMETA(DisplayName = "Black"),\n	Even        UMETA(DisplayName = "Even"),\n	Odd         UMETA(DisplayName = "Odd"),\n	Low         UMETA(DisplayName = "Low 1-18"),\n	High        UMETA(DisplayName = "High 19-36")\n};\n\n/**\n * One place a chip can legally sit, and everything that follows from it.\n *\n * Generated from the layout asset, never authored by hand. A bet stores the\n * PositionId and nothing else, so a bet cannot describe a position that does not exist.\n */\nUSTRUCT(BlueprintType)\nstruct FHasardBetPosition\n{\n	GENERATED_BODY()\n\n	/**\n	 * Index into the generated array, stamped from its own position on append.\n	 * The array is append-only for that reason: a sort or a remove leaves every\n	 * id pointing at the wrong position, and nothing would report it.\n	 */\n	UPROPERTY(BlueprintReadOnly, Category = "Hasard|Layout")\n	int32 PositionId = INDEX_NONE;\n\n	UPROPERTY(BlueprintReadOnly, Category = "Hasard|Layout")\n	EHasardBetType BetType = EHasardBetType::StraightUp;\n\n	/** Every pocket this position pays on, ascending. The audit checks this count against the payout rule. */\n	UPROPERTY(BlueprintReadOnly, Category = "Hasard|Layout")\n	TArray&lt;int32&gt; CoveredNumbers;\n\n	/** Where the chip sits, in the felt\'s local 2D space, in centimeters. */\n	UPROPERTY(BlueprintReadOnly, Category = "Hasard|Layout")\n	FVector2D ChipLocation = FVector2D::ZeroVector;\n\n	/** What the hover readout shows the player. FText because a player reads it. */\n	UPROPERTY(BlueprintReadOnly, Category = "Hasard|Layout")\n	FText DisplayName;\n};\n\n+|/**\n+| * A chip on the felt: which position, and how much.\n+| *\n+| * BetType and the covered numbers are not stored here. They belong to the position,\n+| * and duplicating them would let a bet disagree with the table it was placed on.\n+| * Settlement looks the position up by id, so an id that does not exist is a loud\n+| * error rather than a bet that quietly never wins. The stake is already taken by\n+| * then, which is why PlaceBet is where a bad id has to be refused.\n+| */\nUSTRUCT(BlueprintType)\nstruct FHasardBet\n{\n	GENERATED_BODY()\n\n+|	/** Index into the layout\'s generated positions. INDEX_NONE is not a bet. */\n	UPROPERTY(BlueprintReadOnly, Category = "Hasard|Bet")\n-|	EHasardBetType BetType = EHasardBetType::StraightUp;\n+|	int32 PositionId = INDEX_NONE;\n-|\n-|	UPROPERTY(BlueprintReadOnly, Category = "Hasard|Bet")\n-|	int32 PrimaryNumber = 0;\n\n	UPROPERTY(BlueprintReadOnly, Category = "Hasard|Bet")\n	int32 Stake = 0;\n};\n</code></pre><p><b>3.</b> <code>HasardTableLayout.h</code>. The bounds, the cache, and the resolver:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"                       // int32, TArray, FVector2D, the core macros\n#include "Engine/DataAsset.h"                  // UDataAsset, the base class\n#include "HasardTypes.h"                       // EHasardBetType, FHasardBetPosition\n#include "HasardTableLayout.generated.h"       // ALWAYS LAST\n\n/**\n * Every measurement of the felt, in one asset.\n *\n * The visible layout and the click detection are both generated from these numbers,\n * so they cannot disagree with each other. Nothing else in the project may hard-code\n * a cell size or a grid origin.\n */\nUCLASS(BlueprintType)\nclass HASARD_API UHasardTableLayout : public UDataAsset\n{\n	GENERATED_BODY()\n\npublic:\n	/** The number at a grid cell. Column 0 row 0 is 1; column 0 row 2 is 3; column 1 row 0 is 4. */\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	int32 GetNumberAt(int32 Column, int32 Row) const;\n\n	/** Grid column holding a number, 0-11. INDEX_NONE for zero or an out-of-range number. */\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	int32 GetColumnOf(int32 Number) const;\n\n	/** Grid row holding a number, 0-2. INDEX_NONE for zero or an out-of-range number. */\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	int32 GetRowOf(int32 Number) const;\n\n	/** Center of one cell, in the felt\'s local 2D space. */\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	FVector2D GetCellCenter(int32 Column, int32 Row) const;\n\n~|	/** Far corner of the number grid. Not the felt - the zero box and the outside bands extend past it. */\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	FVector2D GetGridExtent() const;\n\n-|	/** Builds all 157 bet positions. Deterministic: same asset in, same array out, same order. */\n+|	/**\n-|	void BuildPositions(TArray&lt;FHasardBetPosition&gt;&amp; OutPositions) const;\n+|	 * The whole felt, including the zero box and both outside bands.\n+|	 *\n+|	 * Every caller that needs a size asks for it here rather than adding the parts up,\n+|	 * because a felt drawn from one sum and traced against another is a felt where\n+|	 * clicks land in the wrong place near the edges.\n+|	 */\n+|	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n+|	void GetFeltBounds(FVector2D&amp; OutMin, FVector2D&amp; OutMax) const;\n+|\n+|	/**\n+|	 * All 157 positions, built once and reused.\n+|	 *\n+|	 * Derived data, so it is deliberately not a UPROPERTY: serializing it would put a\n+|	 * stale copy in the .uasset that could disagree with the numbers above it.\n+|	 */\n+|	const TArray&lt;FHasardBetPosition&gt;&amp; GetPositions() const;\n+|\n+|	/** One position by id, or null. Null means the id was never valid, which is worth logging. */\n+|	const FHasardBetPosition* GetPositionById(int32 PositionId) const;\n+|\n+|	/**\n+|	 * Which position a chip at this felt-local point means, or INDEX_NONE for nowhere.\n+|	 *\n+|	 * This is the croupier reading the felt, and it is the only place that decides what\n+|	 * a click means. LineTolerance is what makes a point near a boundary a line bet.\n+|	 */\n+|	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n+|	int32 ResolvePosition(const FVector2D&amp; LocalPoint) const;\n\n	/** True for the eighteen red numbers on a single-zero wheel. */\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	bool IsRedNumber(int32 Number) const;\n\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	int32 GetNumberColumns() const { return NumberColumns; }\n\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	int32 GetNumberRows() const { return NumberRows; }\n\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	float GetLineTolerance() const { return LineTolerance; }\n\n+|	/** Raw values, exposed so a caller drawing grid lines need not rebuild them from cell centers. */\n+|	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n+|	FVector2D GetGridOrigin() const { return GridOrigin; }\n+|\n+|	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n+|	FVector2D GetCellSize() const { return FVector2D(CellSizeX, CellSizeY); }\n+|\n+|	/** Builds all 157 bet positions. Deterministic: same asset in, same array out, same order. */\n+|	void BuildPositions(TArray&lt;FHasardBetPosition&gt;&amp; OutPositions) const;\n+|\n+|#if WITH_EDITOR\n+|	/** Editing any measurement invalidates the cache, or the felt keeps drawing the old numbers. */\n+|	virtual void PostEditChangeProperty(FPropertyChangedEvent&amp; PropertyChangedEvent) override;\n+|#endif\n+|\nprivate:\n	/** Adds one position and stamps its PositionId from the array index. */\n	void AddPosition(TArray&lt;FHasardBetPosition&gt;&amp; OutPositions, EHasardBetType BetType,\n		const TArray&lt;int32&gt;&amp; Covered, const FVector2D&amp; ChipLocation, const FText&amp; DisplayName) const;\n+|\n+|	/** Finds a generated position by type and covered set. Used only by ResolvePosition. */\n+|	int32 FindPositionId(EHasardBetType BetType, const TArray&lt;int32&gt;&amp; Covered) const;\n+|\n+|	/** Built on first request, cleared when a property changes. Never serialized. */\n+|	mutable TArray&lt;FHasardBetPosition&gt; CachedPositions;\n\n	/** Twelve columns of three. Editable only because a future variant may differ. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n		meta = (AllowPrivateAccess = "true", ClampMin = "1"))\n	int32 NumberColumns = 12;\n\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n		meta = (AllowPrivateAccess = "true", ClampMin = "1"))\n	int32 NumberRows = 3;\n\n	/** Size of one number cell in centimeters, along the twelve columns. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n		meta = (AllowPrivateAccess = "true", ClampMin = "1.0"))\n	float CellSizeX = 12.0f;\n\n	/** Size of one number cell in centimeters, across the three rows. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n		meta = (AllowPrivateAccess = "true", ClampMin = "1.0"))\n	float CellSizeY = 12.0f;\n\n	/** Felt-local position of the near corner of cell (0,0). Everything is measured from here. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n		meta = (AllowPrivateAccess = "true"))\n	FVector2D GridOrigin = FVector2D::ZeroVector;\n\n	/** Width of the zero box, which sits at negative X of the grid and spans all three rows. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n		meta = (AllowPrivateAccess = "true", ClampMin = "1.0"))\n	float ZeroBoxWidth = 12.0f;\n\n	/** Depth of each outside-bet band. Dozens sit against the grid, even-money beyond them. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n		meta = (AllowPrivateAccess = "true", ClampMin = "1.0"))\n	float OutsideBandDepth = 12.0f;\n\n	/**\n	 * How close to a line counts as being on it, as a fraction of a cell.\n	 * 0.22 means the middle 56% of a cell is a straight up and the rest is a line bet.\n	 */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n		meta = (AllowPrivateAccess = "true", ClampMin = "0.05", ClampMax = "0.45"))\n	float LineTolerance = 0.22f;\n};\n</code></pre><p><b>4.</b> <code>HasardTableLayout.cpp</code>. <code>ResolvePosition</code> is the long one, and the five regions are commented in the order they are tested.</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#include "HasardTableLayout.h"   // the class this file defines\n#include "HasardTypes.h"         // EHasardBetType, FHasardBetPosition\n\n#define LOCTEXT_NAMESPACE "Hasard"\n\nint32 UHasardTableLayout::GetNumberAt(int32 Column, int32 Row) const\n{\n	if (Column &lt; 0 || Column &gt;= NumberColumns || Row &lt; 0 || Row &gt;= NumberRows)\n	{\n		return INDEX_NONE;\n	}\n\n	return Column * NumberRows + Row + 1;\n}\n\nint32 UHasardTableLayout::GetColumnOf(int32 Number) const\n{\n	if (Number &lt; 1 || Number &gt; NumberColumns * NumberRows)\n	{\n		return INDEX_NONE;\n	}\n\n	return (Number - 1) / NumberRows;\n}\n\nint32 UHasardTableLayout::GetRowOf(int32 Number) const\n{\n	if (Number &lt; 1 || Number &gt; NumberColumns * NumberRows)\n	{\n		return INDEX_NONE;\n	}\n\n	return (Number - 1) % NumberRows;\n}\n\nFVector2D UHasardTableLayout::GetCellCenter(int32 Column, int32 Row) const\n{\n	return FVector2D(\n		GridOrigin.X + (static_cast&lt;float&gt;(Column) + 0.5f) * CellSizeX,\n		GridOrigin.Y + (static_cast&lt;float&gt;(Row) + 0.5f) * CellSizeY);\n}\n\nFVector2D UHasardTableLayout::GetGridExtent() const\n{\n	return FVector2D(\n		GridOrigin.X + NumberColumns * CellSizeX,\n		GridOrigin.Y + NumberRows * CellSizeY);\n+|}\n+|\n+|void UHasardTableLayout::GetFeltBounds(FVector2D&amp; OutMin, FVector2D&amp; OutMax) const\n+|{\n+|	// Two bands sit below the grid: dozens against it, even-money beyond them.\n+|	OutMin = FVector2D(\n+|		GridOrigin.X - ZeroBoxWidth,\n+|		GridOrigin.Y - OutsideBandDepth * 2.0f);\n+|\n+|	OutMax = FVector2D(\n+|		GridOrigin.X + NumberColumns * CellSizeX + OutsideBandDepth,\n+|		GridOrigin.Y + NumberRows * CellSizeY);\n+|}\n+|\n+|const TArray&lt;FHasardBetPosition&gt;&amp; UHasardTableLayout::GetPositions() const\n+|{\n+|	if (CachedPositions.Num() == 0)\n+|	{\n+|		BuildPositions(CachedPositions);\n+|	}\n+|\n+|	return CachedPositions;\n+|}\n+|\n+|const FHasardBetPosition* UHasardTableLayout::GetPositionById(int32 PositionId) const\n+|{\n+|	// PositionId is the array index by construction, so this is a bounds check, not a search.\n+|	const TArray&lt;FHasardBetPosition&gt;&amp; Positions = GetPositions();\n+|	return Positions.IsValidIndex(PositionId) ? &amp;Positions[PositionId] : nullptr;\n+|}\n+|\n+|int32 UHasardTableLayout::FindPositionId(EHasardBetType BetType, const TArray&lt;int32&gt;&amp; Covered) const\n+|{\n+|	TArray&lt;int32&gt; Wanted = Covered;\n+|	Wanted.Sort();   // AddPosition sorted the stored ones, so compare like with like\n+|\n+|	for (const FHasardBetPosition&amp; Position : GetPositions())\n+|	{\n+|		if (Position.BetType == BetType &amp;&amp; Position.CoveredNumbers == Wanted)\n+|		{\n+|			return Position.PositionId;\n+|		}\n+|	}\n+|\n+|	return INDEX_NONE;\n+|}\n+|\n+|int32 UHasardTableLayout::ResolvePosition(const FVector2D&amp; LocalPoint) const\n+|{\n+|	FVector2D FeltMin, FeltMax;\n+|	GetFeltBounds(FeltMin, FeltMax);\n+|\n+|	if (LocalPoint.X &lt; FeltMin.X || LocalPoint.X &gt; FeltMax.X ||\n+|		LocalPoint.Y &lt; FeltMin.Y || LocalPoint.Y &gt; FeltMax.Y)\n+|	{\n+|		return INDEX_NONE;   // off the felt: not a bet, and not an error either\n+|	}\n+|\n+|	// Nearest chip location among the positions a filter allows. Used only for the\n+|	// outside bets, which are discrete boxes with no lines to sit on.\n+|	const auto NearestWhere = [this, &amp;LocalPoint](auto&amp;&amp; Filter) -&gt; int32\n+|	{\n+|		int32 BestId = INDEX_NONE;\n+|		float BestDistSq = TNumericLimits&lt;float&gt;::Max();\n+|\n+|		for (const FHasardBetPosition&amp; Position : GetPositions())\n+|		{\n+|			if (!Filter(Position))\n+|			{\n+|				continue;\n+|			}\n+|\n+|			const float DistSq = FVector2D::DistSquared(LocalPoint, Position.ChipLocation);\n+|			if (DistSq &lt; BestDistSq)\n+|			{\n+|				BestDistSq = DistSq;\n+|				BestId = Position.PositionId;\n+|			}\n+|		}\n+|\n+|		return BestId;\n+|	};\n+|\n+|	const float GridFarX = GridOrigin.X + NumberColumns * CellSizeX;\n+|\n+|	// Region 1 - the bands below the grid. Dozens against the numbers, even-money beyond.\n+|	if (LocalPoint.Y &lt; GridOrigin.Y)\n+|	{\n+|		const bool bDozenBand = LocalPoint.Y &gt; GridOrigin.Y - OutsideBandDepth;\n+|\n+|		return NearestWhere([bDozenBand](const FHasardBetPosition&amp; Position)\n+|		{\n+|			if (bDozenBand)\n+|			{\n+|				return Position.BetType == EHasardBetType::Dozen;\n+|			}\n+|\n+|			return Position.BetType == EHasardBetType::Low\n+|				|| Position.BetType == EHasardBetType::High\n+|				|| Position.BetType == EHasardBetType::Even\n+|				|| Position.BetType == EHasardBetType::Odd\n+|				|| Position.BetType == EHasardBetType::Red\n+|				|| Position.BetType == EHasardBetType::Black;\n+|		});\n+|	}\n+|\n+|	// Region 2 - the three column boxes, past the last cell.\n+|	if (LocalPoint.X &gt; GridFarX)\n+|	{\n+|		return NearestWhere([](const FHasardBetPosition&amp; Position)\n+|		{\n+|			return Position.BetType == EHasardBetType::Column;\n+|		});\n+|	}\n+|\n+|	const float FracY = (LocalPoint.Y - GridOrigin.Y) / CellSizeY;\n+|	const int32 Row = FMath::Clamp(FMath::FloorToInt(FracY), 0, NumberRows - 1);\n+|	const float OffsetY = FracY - (static_cast&lt;float&gt;(Row) + 0.5f);\n+|\n+|	const bool bNearHorizontal = FMath::Abs(OffsetY) &gt; (0.5f - LineTolerance);\n+|	const bool bFarEdge = bNearHorizontal &amp;&amp; OffsetY &gt; 0.0f &amp;&amp; Row == NumberRows - 1;\n+|\n+|	// Region 3 - the zero seam. A chip on the line x = GridOrigin.X is not a bet on\n+|	// column one: it pairs zero with whatever it is beside. Five different answers\n+|	// share this one line, which is why a plain "is it left of the grid" test is wrong.\n+|	if (FMath::Abs(LocalPoint.X - GridOrigin.X) &lt;= LineTolerance * CellSizeX)\n+|	{\n+|		if (bFarEdge)\n+|		{\n+|			return FindPositionId(EHasardBetType::Basket, { 0, 1, 2, 3 });\n+|		}\n+|\n+|		if (bNearHorizontal)\n+|		{\n+|			const int32 AdjacentRow = Row + (OffsetY &gt; 0.0f ? 1 : -1);\n+|			if (AdjacentRow &gt;= 0 &amp;&amp; AdjacentRow &lt; NumberRows)\n+|			{\n+|				const int32 LowerRow = FMath::Min(Row, AdjacentRow);\n+|				return FindPositionId(EHasardBetType::Trio,\n+|					{ 0, GetNumberAt(0, LowerRow), GetNumberAt(0, LowerRow + 1) });\n+|			}\n+|		}\n+|\n+|		return FindPositionId(EHasardBetType::Split, { 0, GetNumberAt(0, Row) });\n+|	}\n+|\n+|	// Region 4 - inside the zero box itself.\n+|	if (LocalPoint.X &lt; GridOrigin.X)\n+|	{\n+|		return FindPositionId(EHasardBetType::StraightUp, { 0 });\n+|	}\n+|\n+|	// Region 5 - the number grid.\n+|	const float FracX = (LocalPoint.X - GridOrigin.X) / CellSizeX;\n+|	const int32 Column = FMath::Clamp(FMath::FloorToInt(FracX), 0, NumberColumns - 1);\n+|	const float OffsetX = FracX - (static_cast&lt;float&gt;(Column) + 0.5f);\n+|\n+|	const bool bNearVertical = FMath::Abs(OffsetX) &gt; (0.5f - LineTolerance);\n+|\n+|	const int32 AdjacentColumn = Column + (OffsetX &gt; 0.0f ? 1 : -1);\n+|	const int32 AdjacentRow = Row + (OffsetY &gt; 0.0f ? 1 : -1);\n+|	const bool bColumnInRange = AdjacentColumn &gt;= 0 &amp;&amp; AdjacentColumn &lt; NumberColumns;\n+|	const bool bRowInRange = AdjacentRow &gt;= 0 &amp;&amp; AdjacentRow &lt; NumberRows;\n+|\n+|	// The far edge carries the streets and the six lines, so it is answered before the\n+|	// corner test. A chip up there is never a corner - there is no fourth cell above it.\n+|	if (bFarEdge)\n+|	{\n+|		if (bNearVertical &amp;&amp; bColumnInRange)\n+|		{\n+|			const int32 BaseColumn = FMath::Min(Column, AdjacentColumn);\n+|\n+|			TArray&lt;int32&gt; Covered;\n+|			for (int32 Offset = 0; Offset &lt; 2; ++Offset)\n+|			{\n+|				for (int32 CoveredRow = 0; CoveredRow &lt; NumberRows; ++CoveredRow)\n+|				{\n+|					Covered.Add(GetNumberAt(BaseColumn + Offset, CoveredRow));\n+|				}\n+|			}\n+|\n+|			return FindPositionId(EHasardBetType::SixLine, Covered);\n+|		}\n+|\n+|		TArray&lt;int32&gt; Covered;\n+|		for (int32 CoveredRow = 0; CoveredRow &lt; NumberRows; ++CoveredRow)\n+|		{\n+|			Covered.Add(GetNumberAt(Column, CoveredRow));\n+|		}\n+|\n+|		return FindPositionId(EHasardBetType::Street, Covered);\n+|	}\n+|\n+|	if (bNearVertical &amp;&amp; bNearHorizontal &amp;&amp; bColumnInRange &amp;&amp; bRowInRange)\n+|	{\n+|		return FindPositionId(EHasardBetType::Corner, {\n+|			GetNumberAt(Column, Row), GetNumberAt(AdjacentColumn, Row),\n+|			GetNumberAt(Column, AdjacentRow), GetNumberAt(AdjacentColumn, AdjacentRow) });\n+|	}\n+|\n+|	if (bNearVertical &amp;&amp; bColumnInRange)\n+|	{\n+|		return FindPositionId(EHasardBetType::Split,\n+|			{ GetNumberAt(Column, Row), GetNumberAt(AdjacentColumn, Row) });\n+|	}\n+|\n+|	if (bNearHorizontal &amp;&amp; bRowInRange)\n+|	{\n+|		return FindPositionId(EHasardBetType::Split,\n+|			{ GetNumberAt(Column, Row), GetNumberAt(Column, AdjacentRow) });\n+|	}\n+|\n+|	return FindPositionId(EHasardBetType::StraightUp, { GetNumberAt(Column, Row) });\n}\n\nbool UHasardTableLayout::IsRedNumber(int32 Number) const\n{\n	// The eighteen reds on a single-zero wheel. Not derivable from the number:\n	// the sequence alternates within each half but breaks at 10/11 and 28/29.\n	static const TSet&lt;int32&gt; RedNumbers = {\n		1, 3, 5, 7, 9, 12, 14, 16, 18,\n		19, 21, 23, 25, 27, 30, 32, 34, 36 };\n\n	return RedNumbers.Contains(Number);\n}\n\nvoid UHasardTableLayout::AddPosition(TArray&lt;FHasardBetPosition&gt;&amp; OutPositions,\n	EHasardBetType BetType, const TArray&lt;int32&gt;&amp; Covered,\n	const FVector2D&amp; ChipLocation, const FText&amp; DisplayName) const\n{\n	FHasardBetPosition Position;\n	Position.PositionId = OutPositions.Num();   // the index is the id, so they cannot drift\n	Position.BetType = BetType;\n	Position.CoveredNumbers = Covered;\n	Position.CoveredNumbers.Sort();\n	Position.ChipLocation = ChipLocation;\n	Position.DisplayName = DisplayName;\n\n	OutPositions.Add(MoveTemp(Position));\n}\n\nvoid UHasardTableLayout::BuildPositions(TArray&lt;FHasardBetPosition&gt;&amp; OutPositions) const\n{\n	OutPositions.Reset();\n	OutPositions.Reserve(157);\n\n	const float GridFarY = GridOrigin.Y + NumberRows * CellSizeY;\n	const float ZeroCenterX = GridOrigin.X - ZeroBoxWidth * 0.5f;\n	const float ZeroCenterY = GridOrigin.Y + NumberRows * CellSizeY * 0.5f;\n\n	// 1. Zero, then one straight up per cell.\n	AddPosition(OutPositions, EHasardBetType::StraightUp, { 0 },\n		FVector2D(ZeroCenterX, ZeroCenterY), LOCTEXT("Zero", "0"));\n\n	for (int32 Column = 0; Column &lt; NumberColumns; ++Column)\n	{\n		for (int32 Row = 0; Row &lt; NumberRows; ++Row)\n		{\n			const int32 Number = GetNumberAt(Column, Row);\n			AddPosition(OutPositions, EHasardBetType::StraightUp, { Number },\n				GetCellCenter(Column, Row), FText::AsNumber(Number));\n		}\n	}\n\n	// 2. Splits within a column: the chip sits on the line between two stacked cells.\n	for (int32 Column = 0; Column &lt; NumberColumns; ++Column)\n	{\n		for (int32 Row = 0; Row &lt; NumberRows - 1; ++Row)\n		{\n			const int32 Low = GetNumberAt(Column, Row);\n			const int32 High = GetNumberAt(Column, Row + 1);\n			AddPosition(OutPositions, EHasardBetType::Split, { Low, High },\n				FVector2D(GetCellCenter(Column, Row).X,\n					GridOrigin.Y + (Row + 1) * CellSizeY),\n				FText::Format(LOCTEXT("SplitFmt", "{0}/{1}"),\n					FText::AsNumber(Low), FText::AsNumber(High)));\n		}\n	}\n\n	// 3. Splits across columns: the chip sits on the line between two side-by-side cells.\n	for (int32 Column = 0; Column &lt; NumberColumns - 1; ++Column)\n	{\n		for (int32 Row = 0; Row &lt; NumberRows; ++Row)\n		{\n			const int32 Left = GetNumberAt(Column, Row);\n			const int32 Right = GetNumberAt(Column + 1, Row);\n			AddPosition(OutPositions, EHasardBetType::Split, { Left, Right },\n				FVector2D(GridOrigin.X + (Column + 1) * CellSizeX,\n					GetCellCenter(Column, Row).Y),\n				FText::Format(LOCTEXT("SplitFmt", "{0}/{1}"),\n					FText::AsNumber(Left), FText::AsNumber(Right)));\n		}\n	}\n\n	// 4. The three splits that pair zero with the first column.\n	for (int32 Row = 0; Row &lt; NumberRows; ++Row)\n	{\n		const int32 Number = GetNumberAt(0, Row);\n		AddPosition(OutPositions, EHasardBetType::Split, { 0, Number },\n			FVector2D(GridOrigin.X, GetCellCenter(0, Row).Y),\n			FText::Format(LOCTEXT("ZeroSplitFmt", "0/{0}"), FText::AsNumber(Number)));\n	}\n\n	// 5. Streets: one whole column of three, chip on the far edge.\n	for (int32 Column = 0; Column &lt; NumberColumns; ++Column)\n	{\n		TArray&lt;int32&gt; Covered;\n		for (int32 Row = 0; Row &lt; NumberRows; ++Row)\n		{\n			Covered.Add(GetNumberAt(Column, Row));\n		}\n\n		AddPosition(OutPositions, EHasardBetType::Street, Covered,\n			FVector2D(GetCellCenter(Column, 0).X, GridFarY),\n			FText::Format(LOCTEXT("StreetFmt", "Street {0}-{1}"),\n				FText::AsNumber(Covered[0]), FText::AsNumber(Covered.Last())));\n	}\n\n	// 6. The two trios. Three numbers for 11:1, same as a street, and the only\n	//    other way to reach zero with three.\n	AddPosition(OutPositions, EHasardBetType::Trio, { 0, 1, 2 },\n		FVector2D(GridOrigin.X, GridOrigin.Y + CellSizeY), LOCTEXT("Trio012", "Trio 0/1/2"));\n	AddPosition(OutPositions, EHasardBetType::Trio, { 0, 2, 3 },\n		FVector2D(GridOrigin.X, GridOrigin.Y + 2 * CellSizeY), LOCTEXT("Trio023", "Trio 0/2/3"));\n\n	// 7. Corners: the chip sits where four cells meet.\n	for (int32 Column = 0; Column &lt; NumberColumns - 1; ++Column)\n	{\n		for (int32 Row = 0; Row &lt; NumberRows - 1; ++Row)\n		{\n			const TArray&lt;int32&gt; Covered = {\n				GetNumberAt(Column, Row), GetNumberAt(Column, Row + 1),\n				GetNumberAt(Column + 1, Row), GetNumberAt(Column + 1, Row + 1) };\n\n			AddPosition(OutPositions, EHasardBetType::Corner, Covered,\n				FVector2D(GridOrigin.X + (Column + 1) * CellSizeX,\n					GridOrigin.Y + (Row + 1) * CellSizeY),\n				FText::Format(LOCTEXT("CornerFmt", "Corner {0}"),\n					FText::AsNumber(GetNumberAt(Column, Row))));\n		}\n	}\n\n	// 8. The basket. Four numbers for 8:1 on a single-zero wheel, which is why\n	//    the shared-edge audit still passes. The American five-number bet does not.\n	AddPosition(OutPositions, EHasardBetType::Basket, { 0, 1, 2, 3 },\n		FVector2D(GridOrigin.X, GridFarY), LOCTEXT("Basket", "Basket 0/1/2/3"));\n\n	// 9. Six lines: two adjacent streets, chip on the far edge between them.\n	for (int32 Column = 0; Column &lt; NumberColumns - 1; ++Column)\n	{\n		TArray&lt;int32&gt; Covered;\n		for (int32 Offset = 0; Offset &lt; 2; ++Offset)\n		{\n			for (int32 Row = 0; Row &lt; NumberRows; ++Row)\n			{\n				Covered.Add(GetNumberAt(Column + Offset, Row));\n			}\n		}\n\n		AddPosition(OutPositions, EHasardBetType::SixLine, Covered,\n			FVector2D(GridOrigin.X + (Column + 1) * CellSizeX, GridFarY),\n			FText::Format(LOCTEXT("SixLineFmt", "Six line {0}-{1}"),\n				FText::AsNumber(Covered[0]), FText::AsNumber(Covered.Last())));\n	}\n\n	// 10. Column bets. A grid row is a 2:1 column: the box sits past the last cell.\n	for (int32 Row = 0; Row &lt; NumberRows; ++Row)\n	{\n		TArray&lt;int32&gt; Covered;\n		for (int32 Column = 0; Column &lt; NumberColumns; ++Column)\n		{\n			Covered.Add(GetNumberAt(Column, Row));\n		}\n\n		AddPosition(OutPositions, EHasardBetType::Column, Covered,\n			FVector2D(GridOrigin.X + NumberColumns * CellSizeX + OutsideBandDepth * 0.5f,\n				GetCellCenter(0, Row).Y),\n			FText::Format(LOCTEXT("ColumnFmt", "Column {0}"), FText::AsNumber(Row + 1)));\n	}\n\n	// 11. Dozens. Four grid columns each, in the band on the near side.\n	for (int32 Dozen = 0; Dozen &lt; 3; ++Dozen)\n	{\n		TArray&lt;int32&gt; Covered;\n		for (int32 Number = Dozen * 12 + 1; Number &lt;= Dozen * 12 + 12; ++Number)\n		{\n			Covered.Add(Number);\n		}\n\n		AddPosition(OutPositions, EHasardBetType::Dozen, Covered,\n			FVector2D(GridOrigin.X + (Dozen * 4 + 2) * CellSizeX,\n				GridOrigin.Y - OutsideBandDepth * 0.5f),\n			FText::Format(LOCTEXT("DozenFmt", "Dozen {0}"), FText::AsNumber(Dozen + 1)));\n	}\n\n	// 12. The six even-money bets, in the band beyond the dozens.\n	const float EvenMoneyY = GridOrigin.Y - OutsideBandDepth * 1.5f;\n	const float EvenMoneySpan = NumberColumns * CellSizeX / 6.0f;\n\n	TArray&lt;int32&gt; Low, High, Even, Odd, Red, Black;\n	for (int32 Number = 1; Number &lt;= NumberColumns * NumberRows; ++Number)\n	{\n		(Number &lt;= 18 ? Low : High).Add(Number);\n		(Number % 2 == 0 ? Even : Odd).Add(Number);\n		(IsRedNumber(Number) ? Red : Black).Add(Number);\n	}\n\n	const TArray&lt;EHasardBetType&gt; EvenMoneyTypes = {\n		EHasardBetType::Low, EHasardBetType::Even, EHasardBetType::Red,\n		EHasardBetType::Black, EHasardBetType::Odd, EHasardBetType::High };\n\n	const TArray&lt;TArray&lt;int32&gt;&gt; EvenMoneySets = { Low, Even, Red, Black, Odd, High };\n\n	const TArray&lt;FText&gt; EvenMoneyNames = {\n		LOCTEXT("Low", "1-18"), LOCTEXT("Even", "Even"), LOCTEXT("Red", "Red"),\n		LOCTEXT("Black", "Black"), LOCTEXT("Odd", "Odd"), LOCTEXT("High", "19-36") };\n\n	for (int32 Index = 0; Index &lt; EvenMoneyTypes.Num(); ++Index)\n	{\n		AddPosition(OutPositions, EvenMoneyTypes[Index], EvenMoneySets[Index],\n			FVector2D(GridOrigin.X + (Index + 0.5f) * EvenMoneySpan, EvenMoneyY),\n			EvenMoneyNames[Index]);\n	}\n}\n\n+|#if WITH_EDITOR\n+|void UHasardTableLayout::PostEditChangeProperty(FPropertyChangedEvent&amp; PropertyChangedEvent)\n+|{\n+|	Super::PostEditChangeProperty(PropertyChangedEvent);\n+|\n+|	// Any measurement moves every position, so the cache is thrown away rather than\n+|	// patched. Rebuilding 157 entries costs nothing next to getting one of them wrong.\n+|	CachedPositions.Reset();\n+|}\n+|#endif\n+|\n#undef LOCTEXT_NAMESPACE\n</code></pre><p><b>5.</b> <code>HasardInteractable.h</code>. One parameter:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"\n#include "UObject/Interface.h"\n#include "HasardInteractable.generated.h"\n\nclass APawn;\n\nUINTERFACE(MinimalAPI)\nclass UHasardInteractable : public UInterface\n{\n	GENERATED_BODY()\n};\n\nclass HASARD_API IHasardInteractable\n{\n	GENERATED_BODY()\n\npublic:\n+|	/**\n+|	 * The player interacted with this actor at HitLocation, in world space.\n+|	 *\n+|	 * The location is part of the interaction, not a detail of it. On a felt, where the\n+|	 * chip lands *is* the bet, so an interface that only says "something was clicked"\n+|	 * cannot express a split. Implementations free to ignore it are welcome to.\n+|	 */\n	UFUNCTION(BlueprintCallable, BlueprintNativeEvent, Category = "Hasard|Interaction")\n~|	void OnPlayerInteract(APawn* InstigatorPawn, const FVector
