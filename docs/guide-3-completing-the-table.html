unt);\n\n+|	/**\n+|	 * Restores the record, and the balance only if the player chose to continue.\n+|	 *\n+|	 * The two lines below are the whole of the new-session decision, and the asymmetry is\n+|	 * the point: the lifetime figures are read unconditionally, so no choice on the start\n+|	 * screen can make what the player has already spent look smaller.\n+|	 */\n+|	void ApplySave(const UHasardSaveGame&amp; Save, bool bContinuePrevious);\n+|\n	UFUNCTION(BlueprintPure, Category = "Hasard|Bankroll")\n	int32 GetBalance() const { return Balance; }\n	\n+|	/** This sitting only. The HUD shows it beside the lifetime figure, never instead of it. */\n	UFUNCTION(BlueprintPure, Category = "Hasard|Bankroll")\n~|	int32 GetSessionStaked() const { return SessionStaked; }\n\n	UFUNCTION(BlueprintPure, Category = "Hasard|Bankroll")\n~|	int32 GetSessionNetChange() const { return SessionWon - SessionStaked; }\n+|\n+|	/**\n+|	 * Prior sittings plus this one, computed rather than stored.\n+|	 *\n+|	 * A third pair of counters kept in step with these would be the same fact in two\n+|	 * places, and the day they disagreed the smaller pair would be the one on screen.\n+|	 */\n+|	UFUNCTION(BlueprintPure, Category = "Hasard|Bankroll")\n+|	int32 GetLifetimeStaked() const { return PriorStaked + SessionStaked; }\n+|\n+|	UFUNCTION(BlueprintPure, Category = "Hasard|Bankroll")\n+|	int32 GetLifetimeWon() const { return PriorWon + SessionWon; }\n+|\n+|	UFUNCTION(BlueprintPure, Category = "Hasard|Bankroll")\n+|	int32 GetLifetimeNetChange() const { return GetLifetimeWon() - GetLifetimeStaked(); }\n\nprotected:\n	virtual void BeginPlay() override;\n\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Bankroll", meta = (ClampMin = "0"))\n	int32 StartingBalance = 500;\n\n	UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category = "Hasard|Bankroll")\n	int32 Balance = 0;\n\n	UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category = "Hasard|Bankroll")\n~|	int32 SessionStaked = 0;\n\n	UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category = "Hasard|Bankroll")\n~|	int32 SessionWon = 0;\n+|\n+|	/** Carried in from the save and never written by play. Only ApplySave sets these. */\n+|	UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category = "Hasard|Bankroll")\n+|	int32 PriorStaked = 0;\n+|\n+|	UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category = "Hasard|Bankroll")\n+|	int32 PriorWon = 0;\n		\n};</code></pre><p><b>5.</b> <code>HasardBankrollComponent.cpp</code>:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n\n#include "HasardBankrollComponent.h"\n+|#include "HasardSaveGame.h"\n\nUHasardBankrollComponent::UHasardBankrollComponent()\n{\n	PrimaryComponentTick.bCanEverTick = false;\n}\n\nvoid UHasardBankrollComponent::BeginPlay()\n{\n	Super::BeginPlay();\n\n+|	// What a first sitting looks like. The controller overwrites the balance from the\n+|	// save if the player continues, which happens before the start screen comes down.\n	Balance       = StartingBalance;\n~|	SessionStaked = 0;\n~|	SessionWon    = 0;\n+|}\n+|\n+|void UHasardBankrollComponent::ApplySave(const UHasardSaveGame&amp; Save, bool bContinuePrevious)\n+|{\n+|	PriorStaked = Save.LifetimeStaked;\n+|	PriorWon    = Save.LifetimeWon;\n+|\n+|	Balance = bContinuePrevious ? Save.Balance : StartingBalance;\n+|\n+|	// Delta of zero: nothing was staked or won, the figures were restored. The HUD needs\n+|	// the broadcast anyway, because it has been showing the defaults until now.\n+|	OnBankrollChanged.Broadcast(Balance, 0, GetSessionNetChange());\n}\n\nbool UHasardBankrollComponent::TryStake(int32 Amount)\n{\n	// Checks if you can bet\n	if (Amount &lt;= 0 || Amount &gt; Balance)\n	{\n		return false;\n	}\n\n	Balance -= Amount;\n~|	SessionStaked += Amount;\n\n	OnBankrollChanged.Broadcast(Balance, -Amount, GetSessionNetChange());\n	return true;\n}\n\nvoid UHasardBankrollComponent::CreditWinnings(int32 Amount)\n{\n	if (Amount &lt;= 0) \n	{\n		return;\n	}\n\n	Balance  += Amount;\n~|	SessionWon += Amount;\n\n	OnBankrollChanged.Broadcast(Balance, Amount, GetSessionNetChange());\n}</code></pre><p><b>6.</b> <code>HasardPlayerState.h</code>. The clock gains a start it does not choose for itself:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"\n#include "Engine/EngineTypes.h"\n#include "GameFramework/PlayerState.h"\n#include "HasardPlayerState.generated.h"\n\nclass UHasardBankrollComponent;\n\nUCLASS()\nclass HASARD_API AHasardPlayerState : public APlayerState\n{\n	GENERATED_BODY()\n\npublic:\n	AHasardPlayerState();\n\n+|	/**\n+|	 * Starts the clock and the reality check. Called once the player has chosen how this\n+|	 * sitting begins, never from BeginPlay.\n+|	 *\n+|	 * InPriorSeconds is what previous sittings already cost, carried in from the save so\n+|	 * the lifetime figure can be reported without the session clock ever being wound\n+|	 * forward - those are two different claims and only one of them is about right now.\n+|	 */\n+|	void StartSession(float InPriorSeconds);\n+|\n	/** Real seconds elapsed this session. Unaffected by pause or time dilation. */\n	UFUNCTION(BlueprintPure, Category = "Hasard|Session")\n	float GetSessionElapsedSeconds() const;\n+|\n+|	/** Every sitting including this one. What the save records. */\n+|	UFUNCTION(BlueprintPure, Category = "Hasard|Session")\n+|	float GetLifetimeSeconds() const { return PriorSeconds + GetSessionElapsedSeconds(); }\n\nprotected:\n	virtual void BeginPlay() override;\n	virtual void EndPlay(const EEndPlayReason::Type EndPlayReason) override;\n\nprivate:\n	/** The bankroll. UPROPERTY, or the collector cannot see it. */\n	UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category = "Hasard|Bankroll",\n		meta = (AllowPrivateAccess = "true"))\n	TObjectPtr&lt;UHasardBankrollComponent&gt; BankrollComp;\n\n	/** How often the reality check interrupts. 15s for observation; 300s once the UI exists. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Session",\n		meta = (AllowPrivateAccess = "true", ClampMin = "1.0", UIMin = "15.0", UIMax = "600.0"))\n	float RealityCheckIntervalSeconds = 15.0f;\n\n	/** Wall clock at session start. Deliberately not world time - Module 4. */\n	double SessionStartRealTime = 0.0;\n\n+|	/** Seconds carried in from the save. Read only for the lifetime figure. */\n+|	float PriorSeconds = 0.0f;\n+|\n	/** Plain struct, not a UObject: nothing for the collector to track. */\n	FTimerHandle SessionTimerHandle;\n\n	void RealityCheck();\n};</code></pre><p><b>7.</b> <code>HasardPlayerState.cpp</code>:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#include "HasardPlayerState.h"\n#include "HasardBankrollComponent.h"\n#include "HasardTypes.h"\n#include "Engine/World.h"\n#include "TimerManager.h"\n#include "HasardPlayerController.h"\n\nAHasardPlayerState::AHasardPlayerState()\n{\n	BankrollComp = CreateDefaultSubobject&lt;UHasardBankrollComponent&gt;(TEXT("BankrollComp"));\n}\n\nvoid AHasardPlayerState::BeginPlay()\n{\n	Super::BeginPlay();\n+|}\n+|\n+|void AHasardPlayerState::StartSession(float InPriorSeconds)\n+|{\n+|	PriorSeconds = InPriorSeconds;\n\n	SessionStartRealTime = FPlatformTime::Seconds();\n\n	GetWorldTimerManager().SetTimer(\n		SessionTimerHandle, this, &amp;AHasardPlayerState::RealityCheck,\n		RealityCheckIntervalSeconds, true);\n}\n\nvoid AHasardPlayerState::EndPlay(const EEndPlayReason::Type EndPlayReason)\n{\n	GetWorldTimerManager().ClearTimer(SessionTimerHandle);\n	Super::EndPlay(EndPlayReason);\n}\n\nfloat AHasardPlayerState::GetSessionElapsedSeconds() const\n{\n+|	// Before StartSession the stamp is still zero, and FPlatformTime::Seconds() is offset\n+|	// past 2^24 on Windows - so without this the HUD would open on about 194 days played.\n+|	if (SessionStartRealTime == 0.0)\n+|	{\n+|		return 0.0f;\n+|	}\n+|\n	return static_cast&lt;float&gt;(FPlatformTime::Seconds() - SessionStartRealTime);\n}\n\nvoid AHasardPlayerState::RealityCheck()\n{\n	UE_LOG(LogHasard, Warning, TEXT("REALITY CHECK - %.0f seconds this session"),\n		GetSessionElapsedSeconds());\n\n	if (AHasardPlayerController* PC = Cast&lt;AHasardPlayerController&gt;(GetPlayerController()))\n	{\n		PC-&gt;HandleRealityCheck(FMath::FloorToInt(GetSessionElapsedSeconds() / 60.0f));\n	}\n}</code></pre><p><b>8.</b> <code>HasardHUDWidget.h</code>. Two panels, one delegate, one more bound Text Block:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"\n#include "Blueprint/UserWidget.h"\n#include "HasardHUDWidget.generated.h"\n\nclass UTextBlock;\n\n/**\n * Broadcast when the player dismisses the reality check.\n * Non-dynamic: only C++ binds to it, so there is no reason to pay for reflection.\n */\nDECLARE_MULTICAST_DELEGATE(FOnRealityCheckDismissed);\n+|\n+|/** True to continue the last sitting, false to start a new one. Same reasoning: C++ only. */\n+|DECLARE_MULTICAST_DELEGATE_OneParam(FOnSessionStartChosen, bool /*bContinuePrevious*/);\n\n/**\n * The HUD\'s C++ half. Layout and styling are authored in WBP_HUD; this class owns\n * the contract between the controller and those widgets.\n *\n * Abstract, because the BindWidget properties can only be satisfied by a\n * Blueprint subclass. Instantiating this class directly would leave them null.\n */\nUCLASS(Abstract)\nclass HASARD_API UHasardHUDWidget : public UUserWidget\n{\n	GENERATED_BODY()\n\npublic:\n	/** Bound by the controller in BeginPlay, unbound in EndPlay. */\n	FOnRealityCheckDismissed OnRealityCheckDismissed;\n\n-|	void SetBankroll(int32 Balance, int32 TotalStaked, int32 SessionNetChange);\n+|	/** Same. The controller cannot start the session until this says how. */\n+|	FOnSessionStartChosen OnSessionStartChosen;\n+|\n+|	void SetBankroll(int32 Balance, int32 SessionStaked, int32 SessionNetChange);\n\n	void SetSessionTime(float ElapsedSeconds);\n+|\n+|	/**\n+|	 * What every sitting has cost, this one included.\n+|	 *\n+|	 * Beside the session figures rather than replacing them. Either one alone is a true\n+|	 * number that leaves a false impression - the session hides what came before it, and\n+|	 * the lifetime hides what is happening right now.\n+|	 */\n+|	void SetLifetime(int32 LifetimeStaked, int32 LifetimeNetChange);\n\n	/** Blueprint owns the panel entirely - C++ never touches layout. */\n	UFUNCTION(BlueprintImplementableEvent, Category = "Hasard|UI")\n	void ShowRealityCheck(int32 MinutesElapsed, int32 TotalStaked, int32 SessionNetChange);\n\n	/** The panel\'s dismiss button calls this; the controller pops the context. */\n	UFUNCTION(BlueprintCallable, Category = "Hasard|UI")\n	void NotifyRealityCheckDismissed();\n+|\n+|	/**\n+|	 * The start screen, with last sitting\'s figures so the choice is an informed one.\n+|	 *\n+|	 * bHasSave false means there is nothing to continue, and the panel is expected to\n+|	 * offer only a new session rather than a disabled button the player can wonder about.\n+|	 */\n+|	UFUNCTION(BlueprintImplementableEvent, Category = "Hasard|UI")\n+|	void ShowStartScreen(bool bHasSave, int32 SavedBalance, int32 LifetimeStaked,\n+|		int32 LifetimeNetChange);\n+|\n+|	UFUNCTION(BlueprintImplementableEvent, Category = "Hasard|UI")\n+|	void HideStartScreen();\n+|\n+|	/** Both start-screen buttons call this; the bool is which one. */\n+|	UFUNCTION(BlueprintCallable, Category = "Hasard|UI")\n+|	void NotifySessionStartChosen(bool bContinuePrevious);\n\n	/** The one figure that is true of every bet on the table. */\n	void SetHouseEdge(float EdgePercent);\n\n	/** Rows disagree, so no single figure is true. Say that rather than quoting one. */\n	void SetHouseEdgeUnknown();\n\n	/** The bet under the aim, priced. Written every time the aim moves to a new position. */\n	void SetBetPreview(const FText&amp; InPreviewText);\n\n	/** No bet under the aim. Blank, never the last price. */\n	void ClearBetPreview();\n\nprivate:\n	/** Each name must match a Text Block of that name in WBP_HUD, or the Blueprint refuses to compile. */\n	UPROPERTY(meta = (BindWidget))\n	TObjectPtr&lt;UTextBlock&gt; BalanceText;\n\n	UPROPERTY(meta = (BindWidget))\n	TObjectPtr&lt;UTextBlock&gt; StakedText;\n\n	UPROPERTY(meta = (BindWidget))\n	TObjectPtr&lt;UTextBlock&gt; NetText;\n\n	UPROPERTY(meta = (BindWidget))\n	TObjectPtr&lt;UTextBlock&gt; TimeText;\n\n	UPROPERTY(meta = (BindWidget))\n	TObjectPtr&lt;UTextBlock&gt; OddsText;\n\n	UPROPERTY(meta = (BindWidget))\n	TObjectPtr&lt;UTextBlock&gt; PreviewText;\n+|\n+|	UPROPERTY(meta = (BindWidget))\n+|	TObjectPtr&lt;UTextBlock&gt; LifetimeText;\n};</code></pre><p><b>9.</b> <code>HasardHUDWidget.cpp</code>:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#include "HasardHUDWidget.h"\n#include "Components/TextBlock.h"\n\n~|void UHasardHUDWidget::SetBankroll(int32 Balance, int32 SessionStaked, int32 SessionNetChange)\n{\n	// No null checks. BindWidget already made these compile-time guarantees, and a\n	// defensive check here would only hide the Blueprint error you want to see.\n	BalanceText-&gt;SetText(FText::AsNumber(Balance));\n~|	StakedText-&gt;SetText(FText::AsNumber(SessionStaked));\n\n	// Signed, always. "%+d" prints -60 as -60 and 40 as +40, so a losing session\n	// can never read as a balance that merely happens to be smaller.\n	NetText-&gt;SetText(FText::FromString(FString::Printf(TEXT("%+d"), SessionNetChange)));\n+|}\n+|\n+|void UHasardHUDWidget::SetLifetime(int32 LifetimeStaked, int32 LifetimeNetChange)\n+|{\n+|	LifetimeText-&gt;SetText(FText::Format(\n+|		NSLOCTEXT("Hasard", "LifetimeFmt", "All sessions: staked {0}, net {1}"),\n+|		FText::AsNumber(LifetimeStaked),\n+|		FText::FromString(FString::Printf(TEXT("%+d"), LifetimeNetChange))));\n}\n\nvoid UHasardHUDWidget::SetSessionTime(float ElapsedSeconds)\n{\n	const int32 TotalSeconds = FMath::FloorToInt(ElapsedSeconds);\n	const int32 Minutes = TotalSeconds / 60;\n	const int32 Seconds = TotalSeconds % 60;\n\n	TimeText-&gt;SetText(FText::FromString(\n		FString::Printf(TEXT("%02d:%02d"), Minutes, Seconds)));\n}\n\nvoid UHasardHUDWidget::SetHouseEdge(float EdgePercent)\n{\n	FNumberFormattingOptions Opts;\n	Opts.MinimumFractionalDigits = 2;\n	Opts.MaximumFractionalDigits = 2;\n\n	// FText::Format, not Printf: this is the one line on the HUD a player has to\n	// read as a sentence, and a sentence has to survive translation.\n	OddsText-&gt;SetText(FText::Format(\n		NSLOCTEXT("Hasard", "HouseEdge", "Every bet here costs {0}% of what you stake"),\n		FText::AsNumber(EdgePercent, &amp;Opts)));\n}\n\nvoid UHasardHUDWidget::SetHouseEdgeUnknown()\n{\n	OddsText-&gt;SetText(NSLOCTEXT("Hasard", "HouseEdgeUnknown",\n		"House edge unavailable - the payout table is missing or inconsistent"));\n}\n\nvoid UHasardHUDWidget::SetBetPreview(const FText&amp; InPreviewText)\n{\n	PreviewText-&gt;SetText(InPreviewText);\n}\n\nvoid UHasardHUDWidget::ClearBetPreview()\n{\n	// Blank rather than the last bet. A price left standing after the aim moved is a\n	// price for a bet the player is not making.\n	PreviewText-&gt;SetText(FText::GetEmpty());\n}\n\nvoid UHasardHUDWidget::NotifyRealityCheckDismissed()\n{\n	OnRealityCheckDismissed.Broadcast();\n}\n+|\n+|void UHasardHUDWidget::NotifySessionStartChosen(bool bContinuePrevious)\n+|{\n+|	OnSessionStartChosen.Broadcast(bContinuePrevious);\n+|}</code></pre><p><b>10.</b> <code>HasardPlayerController.h</code>:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"\n#include "Engine/EngineTypes.h"\n#include "GameFramework/PlayerController.h"\n#include "HasardPlayerController.generated.h"\n\nclass UHasardBankrollComponent;\nclass UHasardHUDWidget;\n+|class UHasardSaveGame;\nclass UInputMappingContext;\n\nUCLASS()\nclass HASARD_API AHasardPlayerController : public APlayerController\n{\n	GENERATED_BODY()\n\npublic:\n	/** Called by the PlayerState\'s reality-check timer. */\n	void HandleRealityCheck(int32 MinutesElapsed);\n\n	/**\n	 * Called by the felt as the aim enters and leaves a bet position.\n	 *\n	 * The felt does not reach the widget itself. Everything the HUD shows arrives\n	 * through here, so there is one object that decides what the player is told.\n	 */\n	void SetBetPreview(const FText&amp; PreviewText);\n	void ClearBetPreview();\n\nprotected:\n	virtual void BeginPlay() override;\n	virtual void EndPlay(const EEndPlayReason::Type EndPlayReason) override;\n\nprivate:\n	/** Bound to OnBankrollChanged in BeginPlay. AddDynamic resolves this by reflected name. */\n	UFUNCTION()\n	void HandleBankrollChanged(int32 NewBalance, int32 Delta, int32 SessionNetChange);\n\n	/** Bound to the widget\'s OnRealityCheckDismissed. Pops the suppression context. */\n	void HandleRealityCheckDismissed();\n\n+|	/** Reads the slot, then puts the choice on screen with last sitting\'s figures on it. */\n+|	void ShowStartScreen();\n+|\n+|	/** Bound to the widget\'s OnSessionStartChosen. Nothing plays until this has run. */\n+|	void HandleSessionStartChosen(bool bContinuePrevious);\n+|\n	/** Repeating timer callback. One update a second, because that is the resolution shown. */\n	void UpdateSessionTime();\n\n	/** Cached so EndPlay unbinds from the same object BeginPlay bound to. */\n	UPROPERTY()\n	TObjectPtr&lt;UHasardBankrollComponent&gt; BoundBankroll;\n\n	UPROPERTY(EditDefaultsOnly, Category = "Hasard|UI")\n	TSubclassOf&lt;UHasardHUDWidget&gt; HUDWidgetClass;\n\n	UPROPERTY()\n	TObjectPtr&lt;UHasardHUDWidget&gt; HUDWidget;\n\n+|	/** What the slot held, or null on a first run or a version this build will not read. */\n+|	UPROPERTY()\n+|	TObjectPtr&lt;UHasardSaveGame&gt; LoadedSave;\n+|\n	UPROPERTY(EditDefaultsOnly, Category = "Hasard|UI")\n	TObjectPtr&lt;UInputMappingContext&gt; RealityCheckContext;\n\n+|	/**\n+|	 * Pushed above the reality check while the start screen is up.\n+|	 *\n+|	 * The same blocking trick as IMC_RealityCheck, one priority higher, because the two\n+|	 * can overlap: the reality-check timer does not start until the session does, but a\n+|	 * context left at the same priority would be a race worth not having.\n+|	 */\n+|	UPROPERTY(EditDefaultsOnly, Category = "Hasard|UI")\n+|	TObjectPtr&lt;UInputMappingContext&gt; StartScreenContext;\n+|\n	FTimerHandle ClockTimerHandle;\n};</code></pre><p><b>11.</b> <code>HasardPlayerController.cpp</code>. The load, the choice, and what each one is allowed to touch:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#include "HasardPlayerController.h"\n#include "EnhancedInputSubsystems.h"\n#include "Engine/LocalPlayer.h"\n#include "Engine/World.h"\n#include "InputMappingContext.h"\n+|#include "Kismet/GameplayStatics.h"\n#include "TimerManager.h"\n#include "HasardBankrollComponent.h"\n#include "HasardGameMode.h"\n#include "HasardPayoutTable.h"\n#include "HasardHUDWidget.h"\n#include "HasardPlayerState.h"\n+|#include "HasardSaveGame.h"\n#include "HasardTypes.h"\n\nvoid AHasardPlayerController::BeginPlay()\n{\n	Super::BeginPlay();\n\n	if (HUDWidgetClass)\n	{\n		HUDWidget = CreateWidget&lt;UHasardHUDWidget&gt;(this, HUDWidgetClass);\n		if (HUDWidget)\n		{\n			HUDWidget-&gt;AddToViewport();\n			HUDWidget-&gt;OnRealityCheckDismissed.AddUObject(\n				this, &amp;AHasardPlayerController::HandleRealityCheckDismissed);\n+|			HUDWidget-&gt;OnSessionStartChosen.AddUObject(\n+|				this, &amp;AHasardPlayerController::HandleSessionStartChosen);\n		}\n	}\n\n	// The one figure true of every bet, published once because it never changes -\n	// and because it never changing is the entire point of showing it.\n	if (HUDWidget)\n	{\n		const AHasardGameMode* GM = GetWorld()-&gt;GetAuthGameMode&lt;AHasardGameMode&gt;();\n		const UHasardPayoutTable* Table = GM ? GM-&gt;GetPayoutTable() : nullptr;\n\n		float SharedEdge = 0.0f;\n		if (Table &amp;&amp; Table-&gt;TryGetSharedHouseEdge(SharedEdge))\n		{\n			HUDWidget-&gt;SetHouseEdge(SharedEdge * 100.0f);\n		}\n		else\n		{\n			HUDWidget-&gt;SetHouseEdgeUnknown();\n		}\n	}\n+|\n+|	// Before the player state is looked up, so a misconfigured Player State Class leaves\n+|	// the player looking at a start screen rather than at a table that silently does not\n+|	// keep score. The warnings below still say what is wrong.\n+|	ShowStartScreen();\n\n	AHasardPlayerState* PS = GetPlayerState&lt;AHasardPlayerState&gt;();\n	if (!PS)\n	{\n		UE_LOG(LogHasard, Warning,\n			TEXT("Controller: no AHasardPlayerState - check Player State Class"));\n		return;\n	}\n\n	BoundBankroll = PS-&gt;FindComponentByClass&lt;UHasardBankrollComponent&gt;();\n	if (!BoundBankroll)\n	{\n		UE_LOG(LogHasard, Warning, TEXT("Controller: player state has no bankroll component"));\n		return;\n	}\n\n	BoundBankroll-&gt;OnBankrollChanged.AddDynamic(\n		this, &amp;AHasardPlayerController::HandleBankrollChanged);\n\n	if (HUDWidget)\n	{\n		HUDWidget-&gt;SetBankroll(BoundBankroll-&gt;GetBalance(),\n~|			BoundBankroll-&gt;GetSessionStaked(),\n			BoundBankroll-&gt;GetSessionNetChange());\n+|\n+|		HUDWidget-&gt;SetLifetime(BoundBankroll-&gt;GetLifetimeStaked(),\n+|			BoundBankroll-&gt;GetLifetimeNetChange());\n	}\n\n	GetWorldTimerManager().SetTimer(ClockTimerHandle, this,\n		&amp;AHasardPlayerController::UpdateSessionTime, 1.0f, true);\n}\n\nvoid AHasardPlayerController::EndPlay(const EEndPlayReason::Type EndPlayReason)\n{\n	GetWorldTimerManager().ClearTimer(ClockTimerHandle);\n\n	if (HUDWidget)\n	{\n		HUDWidget-&gt;OnRealityCheckDismissed.RemoveAll(this);\n+|		HUDWidget-&gt;OnSessionStartChosen.RemoveAll(this);\n	}\n\n	if (BoundBankroll)\n	{\n		BoundBankroll-&gt;OnBankrollChanged.RemoveDynamic(\n			this, &amp;AHasardPlayerController::HandleBankrollChanged);\n		BoundBankroll = nullptr;\n	}\n\n	Super::EndPlay(EndPlayReason);\n}\n\n+|void AHasardPlayerController::ShowStartScreen()\n+|{\n+|	if (!HUDWidget)\n+|	{\n+|		return;\n+|	}\n+|\n+|	LoadedSave = Cast&lt;UHasardSaveGame&gt;(UGameplayStatics::LoadGameFromSlot(\n+|		UHasardSaveGame::SlotName, UHasardSaveGame::UserIndex));\n+|\n+|	if (LoadedSave &amp;&amp; LoadedSave-&gt;Version != UHasardSaveGame::CurrentVersion)\n+|	{\n+|		// Refused rather than migrated. A field whose meaning changed would make\n+|		// LifetimeStaked a number about something else, and no guess is honest.\n+|		UE_LOG(LogHasard, Warning,\n+|			TEXT("Save is version %d, this build reads %d - ignoring it"),\n+|			LoadedSave-&gt;Version, UHasardSaveGame::CurrentVersion);\n+|\n+|		LoadedSave = nullptr;\n+|	}\n+|\n+|	if (StartScreenContext)\n+|	{\n+|		if (UEnhancedInputLocalPlayerSubsystem* Subsystem =\n+|			ULocalPlayer::GetSubsystem&lt;UEnhancedInputLocalPlayerSubsystem&gt;(GetLocalPlayer()))\n+|		{\n+|			Subsystem-&gt;AddMappingContext(StartScreenContext, 20);\n+|		}\n+|	}\n+|\n+|	SetShowMouseCursor(true);\n+|	SetInputMode(FInputModeGameAndUI()\n+|		.SetLockMouseToViewportBehavior(EMouseLockMode::DoNotLock)\n+|		.SetHideCursorDuringCapture(false));\n+|\n+|	HUDWidget-&gt;ShowStartScreen(LoadedSave != nullptr,\n+|		LoadedSave ? LoadedSave-&gt;Balance : 0,\n+|		LoadedSave ? LoadedSave-&gt;LifetimeStaked : 0,\n+|		LoadedSave ? LoadedSave-&gt;LifetimeWon - LoadedSave-&gt;LifetimeStaked : 0);\n+|}\n+|\n+|void AHasardPlayerController::HandleSessionStartChosen(bool bContinuePrevious)\n+|{\n+|	if (StartScreenContext)\n+|	{\n+|		if (UEnhancedInputLocalPlayerSubsystem* Subsystem =\n+|			ULocalPlayer::GetSubsystem&lt;UEnhancedInputLocalPlayerSubsystem&gt;(GetLocalPlayer()))\n+|		{\n+|			Subsystem-&gt;RemoveMappingContext(StartScreenContext);\n+|		}\n+|	}\n+|\n+|	SetShowMouseCursor(false);\n+|	SetInputMode(FInputModeGameOnly());\n+|\n+|	if (HUDWidget)\n+|	{\n+|		HUDWidget-&gt;HideStartScreen();\n+|	}\n+|\n+|	// No save is not an error. It is a first sitting, and the defaults already describe\n+|	// one - which is why there is no separate branch here for it.\n+|	if (LoadedSave &amp;&amp; BoundBankroll)\n+|	{\n+|		BoundBankroll-&gt;ApplySave(*LoadedSave, bContinuePrevious);\n+|	}\n+|\n+|	if (AHasardPlayerState* PS = GetPlayerState&lt;AHasardPlayerState&gt;())\n+|	{\n+|		PS-&gt;StartSession(LoadedSave ? LoadedSave-&gt;LifetimeSeconds : 0.0f);\n+|	}\n+|\n+|	UE_LOG(LogHasard, Warning, TEXT("Session started - %s"),\n+|		bContinuePrevious ? TEXT("continuing the last one") : TEXT("new"));\n+|}\n+|\nvoid AHasardPlayerController::HandleBankrollChanged(int32 NewBalance, int32 Delta,\n	int32 SessionNetChange)\n{\n	UE_LOG(LogHasard, Warning, TEXT("Bankroll: balance %d (%+d), session net %+d"),\n		NewBalance, Delta, SessionNetChange);\n\n	if (HUDWidget &amp;&amp; BoundBankroll)\n	{\n~|		HUDWidget-&gt;SetBankroll(NewBalance, BoundBankroll-&gt;GetSessionStaked(), SessionNetChange);\n+|\n+|		HUDWidget-&gt;SetLifetime(BoundBankroll-&gt;GetLifetimeStaked(),\n+|			BoundBankroll-&gt;GetLifetimeNetChange());\n	}\n}\n\nvoid AHasardPlayerController::UpdateSessionTime()\n{\n	if (!HUDWidget)\n	{\n		return;\n	}\n\n	// The same accessor the log uses, so the clock and the log cannot disagree.\n	if (const AHasardPlayerState* PS = GetPlayerState&lt;AHasardPlayerState&gt;())\n	{\n		HUDWidget-&gt;SetSessionTime(PS-&gt;GetSessionElapsedSeconds());\n	}\n}\n\nvoid AHasardPlayerController::SetBetPreview(const FText&amp; PreviewText)\n{\n	if (HUDWidget)\n	{\n		HUDWidget-&gt;SetBetPreview(PreviewText);\n	}\n}\n\nvoid AHasardPlayerController::ClearBetPreview()\n{\n	if (HUDWidget)\n	{\n		HUDWidget-&gt;ClearBetPreview();\n	}\n}\n\nvoid AHasardPlayerController::HandleRealityCheck(int32 MinutesElapsed)\n{\n	if (!HUDWidget || !BoundBankroll)\n	{\n		return;\n	}\n\n	if (RealityCheckContext)\n	{\n		// Suppress table input while the check is up - Module 6\'s contexts\n		if (UEnhancedInputLocalPlayerSubsystem* Subsystem =\n			ULocalPlayer::GetSubsystem&lt;UEnhancedInputLocalPlayerSubsystem&gt;(GetLocalPlayer()))\n		{\n			Subsystem-&gt;AddMappingContext(RealityCheckContext, 10);\n		}\n	}\n\n	// The context stops gameplay input; this hands the mouse to Slate so the\n	// dismiss button can actually be clicked. Two different jobs.\n	SetShowMouseCursor(true);\n	SetInputMode(FInputModeGameAndUI()\n		.SetLockMouseToViewportBehavior(EMouseLockMode::DoNotLock)\n		.SetHideCursorDuringCapture(false));\n\n	HUDWidget-&gt;ShowRealityCheck(MinutesElapsed,\n~|		BoundBankroll-&gt;GetSessionStaked(),\n		BoundBankroll-&gt;GetSessionNetChange());\n}\n\nvoid AHasardPlayerController::HandleRealityCheckDismissed()\n{\n	if (RealityCheckContext)\n	{\n		if (UEnhancedInputLocalPlayerSubsystem* Subsystem =\n			ULocalPlayer::GetSubsystem&lt;UEnhancedInputLocalPlayerSubsystem&gt;(GetLocalPlayer()))\n		{\n			Subsystem-&gt;RemoveMappingContext(RealityCheckContext);\n		}\n	}\n\n	SetShowMouseCursor(false);\n	SetInputMode(FInputModeGameOnly());\n}</code></pre><p><b>12.</b> <kbd>Ctrl+Shift+B</kbd> with the editor closed. Expect <b>Build: 1 succeeded, 0 failed</b>.</p><p><b>Phase 3 &mdash; the widgets.</b></p><p><b>13.</b> Open <code>WBP_HUD</code> and add a <b>Text Block</b> named exactly <code>LifetimeText</code>, under the odds line. Case matters and the type matters: <code>BindWidget</code> checks both, and the Blueprint will refuse to compile until it finds one.</p><p><b>14.</b> Still in <code>WBP_HUD</code>, add a panel for the start screen &mdash; a border filling the screen, a title, two buttons. Collapse it by default. Implement the <b>Show Start Screen</b> event: set its visibility to <i>Visible</i>, fill in the last balance and lifetime figures from the pins, and hide the <b>Continue</b> button when <code>bHasSave</code> is false. Implement <b>Hide Start Screen</b> to collapse it again.</p><p><b>15.</b> Wire the two buttons to <b>Notify Session Start Chosen</b> &mdash; <code>Continue</code> passes <b>true</b>, <code>New session</code> passes <b>false</b>. Compile and save.</p><p><b>Phase 4 &mdash; the suppression context.</b></p><p><b>16.</b> In <code>Content/Input</code>, duplicate <code>IMC_RealityCheck</code> and name it <code>IMC_StartScreen</code>. It already maps every table key to <code>IA_Blocked</code> and <code>IA_BlockedLook</code>, which is exactly what is wanted: the table cannot be touched until the choice is made. Save.</p><p><b>17.</b> Open <code>BP_HasardPlayerController</code> &rarr; <b>Class Defaults</b> &rarr; <b>Hasard | UI</b>, set <b>Start Screen Context</b> to <code>IMC_StartScreen</code>. Compile and save.</p><p><b>Phase 5 &mdash; two launches.</b></p><p><b>18.</b> Press Play. The start screen is up, the table does not respond, the clock reads <b>00:00</b> and stays there. There is no save yet, so only <b>New session</b> is offered. Choose it; the clock starts and the table answers.</p><p><b>19.</b> Place a few bets, spin, settle. The HUD now carries a second line: <i>All sessions: staked 40, net -15</i>. It matches the session figures exactly, because this is the first sitting.</p><p><b>20.</b> Stop, and press Play again. Nothing was written yet &mdash; the save happens in the next module, on the way out &mdash; so the start screen still offers only a new session. That is the module working: the record exists and is read, and module 10 is what writes it.</p>'},
],
quiz:[
{q:'<code>StartSession</code> exists as a separate function rather than staying in <code>BeginPlay</code> because:',
 opts:['BeginPlay cannot start timers','It needs the save, which loads later','A clock started at level load counts the time the player spent on the start screen as time spent playing','PlayerState BeginPlay runs before the controller exists'],
 c:2,why:'The same argument as world time in guide 2, pointing the other way. World time understates the sitting; a stamp taken at level load overstates it. Either way the number stops measuring playing.'},
{q:'Without the guard in <code>GetSessionElapsedSeconds</code>, the HUD would open showing:',
 opts:['About 194 days, because the platform stamp is offset past 2^24 and the start stamp is still zero','00:00, which is correct anyway','A negative time','Whatever the last session ended on'],
 c:0,why:'Windows adds the offset deliberately so that storing the value in a float breaks visibly. Subtracting zero from it hands you the raw stamp.'},
{q:'<code>GetLifetimeStaked()</code> is computed from two fields rather than stored as a third because:',
 opts:['Computing it is faster','int32 would overflow','UPROPERTY cannot hold a total','A stored third total is the same fact in two places, and the day they disagree the smaller one is the one on the HUD'],
 c:3,why:'The recurring bug of this repo. FHasardBet dropped BetType for the same reason, and the chip carries its own stake for the same reason.'},
{q:'In <code>ApplySave</code>, the two <code>Prior</code> assignments sit above the conditional. Moving them inside it would:',
 opts:['Break the compile','Make Start new session erase what previous sittings cost, which is the hidden-spend pattern CLAUDE.md forbids','Have no effect, since they are overwritten anyway','Only affect the first launch'],
 c:1,why:'Nothing false would be displayed. The true figure would simply be discarded somewhere the player cannot watch it happen, which is the whole of that anti-pattern.'},
{q:'A save whose <code>Version</code> does not match is:',
 opts:['Migrated field by field','Deleted','Read anyway, since the bytes still load','Ignored, and the sitting starts as though there were no save'],
 c:3,why:'The bytes loading is exactly the problem: a field whose meaning changed is still readable, and reading it puts a number about something else under a label the player trusts.'},
{q:'<code>IMC_StartScreen</code> is pushed at priority 20 rather than 10 because:',
 opts:['Its priority must sit above the reality check\'s, so that if the two ever overlap the choice screen is the one that wins','Higher numbers are processed first by Enhanced Input','10 is reserved by the engine','It maps more actions'],
 c:0,why:'The reality-check timer does not start until the session does, so today they cannot overlap. Relying on that ordering rather than stating the precedence would be a race waiting for a future module to introduce.'},
]
},

/* --------------------------------------------------------- 10 */
{
grp:"Part IV \u2014 The Session",
num:"10",
title:"Writing it down",
lede:"Module 9 read a record that nothing had written. This module writes it, and decides how much of a sitting a crash is allowed to erase.",
blocks:[
{t:'h',x:'The half that was missing'},
{t:'p',x:'Module 9 built an entire read path. The slot is loaded, the version is checked, a mismatch is refused rather than migrated, and the figures land on a start screen that lets the player choose what to do with them. Every one of those is finished work.'},
{t:'p',x:'And nothing writes. <code>SaveGameToSlot</code> does not appear anywhere in <code>Source/Hasard/</code>. <code>SessionsPlayed</code> has been sitting in <code>HasardSaveGame.h</code> since module 9 without a single line reading it or setting it. Step 20 of that module said so out loud &mdash; stop, press Play again, and the start screen still offers only a new sitting, because the record it is looking for was never created.'},
{t:'p',x:'So every value the record needs already has somewhere to come from. What is missing is the call, and the interesting part of this module is not the call &mdash; it is deciding <b>when</b> to make it.'},
{t:'table',head:['Field','Where the value comes from','Already exists?'],rows:[['<code>Version</code>','<code>UHasardSaveGame::CurrentVersion</code>','yes'],['<code>Balance</code>','<code>BoundBankroll-&gt;GetBalance()</code>','yes'],['<code>LifetimeStaked</code>','<code>BoundBankroll-&gt;GetLifetimeStaked()</code>','yes'],['<code>LifetimeWon</code>','<code>BoundBankroll-&gt;GetLifetimeWon()</code>','yes'],['<code>LifetimeSeconds</code>','<code>PS-&gt;GetLifeTimeSeconds()</code>','yes'],['<code>SessionsPlayed</code>','the save that was read, plus one','the field, not the sum']]},
{t:'p',x:'One function, four call sites, one guard. That is the whole of the code, and the rest of this module is why each of those is where it is.'},
{t:'h',x:'When to write, and which way to be wrong'},
{t:'p',x:'The obvious answer is <code>EndPlay</code>. It is one call site, it runs when the player stops, and it is the last moment at which the session clock has a final value. Module 9 assumed it: <i>the save happens in the next module, on the way out</i>.'},
{t:'p',x:'The problem with it is not that it fails often. It is what happens when it does. <code>EndPlay</code> does not run on a crash, on a process kill, on a power cut, or on the editor being closed hard while a sitting is in progress. Every one of those loses the sitting entirely.'},
{t:'rg',lab:'A lost record is never neutral',x:'<p>Ask which way the loss points. If a sitting is lost, <code>LifetimeStaked</code> goes back to whatever the last successful write said &mdash; a <b>smaller</b> number than the truth. The player returns to a game that has forgotten some of what they spent, and the figure on the HUD understates their own history.</p><p>That is the direction that flatters the house. It is the same shape as every anti-pattern in <code>CLAUDE.md</code>: nothing false is displayed, a true figure is simply discarded somewhere the player cannot watch it happen. A save system whose failure mode understates spend is not a neutral piece of plumbing, and &ldquo;crashes are rare&rdquo; is not an argument, because the sittings most worth recording are the long ones.</p>'},
{t:'p',x:'So the record is committed whenever it goes stale, not only on the way out. Four moments, and each earns its line:'},
{t:'table',head:['Call site','Why there'],rows:[['<code>HandleSessionStartChosen</code>','The sitting is counted the instant it begins, so a player who starts and immediately crashes is still a player who played.'],['<code>HandleBankrollChanged</code>','Every stake and every credit. The record is never more than one money movement behind the HUD.'],['<code>HandleRealityCheck</code>','The clock advances while the money does not. This is the one call site that commits elapsed time on its own.'],['<code>EndPlay</code>','The clean exit, and the only place the final clock value exists.']]},
{t:'chk',q:'A four-bet round writes the file four times, and a long sitting writes it hundreds. Why is that not worth optimising away?',a:'<p><b>Because the thing you would be trading is not symmetric.</b> The record is five <code>int32</code>s and a <code>float</code> &mdash; a few hundred bytes with the header, buffered by the OS, on a write that happens at human speed rather than per frame. Batching it would exchange a cost you can measure for a risk you cannot: every write you skip is a window in which a crash understates what playing cost.</p><p>Optimise it when a profiler names it, and not before. If it ever does need batching, the honest version flushes on a timer as well, so the window has a stated maximum rather than an unstated one.</p>'},
{t:'h',x:'The guard that stops this destroying the record'},
{t:'p',x:'There is one order of events that turns this module from a feature into data loss, and it is the most ordinary thing a player can do: open the game, look at the start screen, and quit without choosing.'},
{t:'p',x:'Follow what is in memory at that moment. <code>UHasardBankrollComponent::BeginPlay</code> has already run, so <code>Balance</code> is <code>StartingBalance</code> &mdash; 500 &mdash; and <code>PriorStaked</code> and <code>PriorWon</code> are zero, because <code>ApplySave</code> only runs once a choice is made. An unguarded <code>CommitSave</code> in <code>EndPlay</code> would write exactly that: balance 500, nothing ever staked, nothing ever won.'},
{t:'warn',lab:'The most important line in this module is the one that returns early',x:'<p>Without the guard, closing the game at the start screen <b>overwrites the real record with the defaults</b>. Not corrupts &mdash; overwrites, cleanly, with a perfectly valid save that says the player has never played. They come back to a game that has forgotten them, and there is no error, no warning, and nothing in the log.</p><p>It is worth sitting with how invisible that is. The write succeeds. The file is well formed. The version matches. Every test that asks &ldquo;does saving work&rdquo; passes. The only test that catches it is the one that asks what the record says <i>after</i> a launch in which nobody played.</p>'},
{t:'p',x:'So the guard asks whether the sitting has begun. And the fact that answers that already exists: <code>SessionStartRealTime</code> is zero until <code>StartSession</code> stamps it. Module 9 already refused to keep a <code>bool bSessionStarted</code> beside that stamp, on the grounds that two copies of one fact can disagree. The refusal has not expired, so this module adds an accessor that reads the stamp rather than a bool that shadows it.'},
{t:'chk',q:'Why does <code>IsSessionStarted()</code> live on the PlayerState rather than as a <code>bool</code> on the controller, given the controller is the only caller?',a:'<p><b>Because the controller does not own the fact.</b> The clock is the PlayerState’s, <code>StartSession</code> is the PlayerState’s, and <code>SessionStartRealTime</code> is private to it. A bool on the controller would be a second answer to a question the PlayerState already answers, kept in step by hand, and the day the two disagreed the controller would be the one deciding whether to write a record.</p><p>The accessor stores nothing. It is three words in a header and it cannot drift, because there is nothing for it to drift from.</p>'},
{t:'h',x:'Two orderings that are not cosmetic'},
{t:'warn',lab:'<code>CommitSave</code> is the first line of <code>EndPlay</code>, not the last',x:'<p><code>EndPlay</code> exists to release things, and one of the things it releases is <code>BoundBankroll</code>, which it sets to <code>nullptr</code>. <code>CommitSave</code> reads the bankroll for four of the six fields it writes.</p><p>Put the commit at the bottom of that function and it still compiles, still runs, and <b>refuses every time</b> &mdash; logging <code>no bankroll - nothing written</code> on every single exit. You would have a save system that works during play and never once records the end of a sitting, and the only evidence would be one error line in a log full of them.</p>'},
{t:'p',x:'The second ordering is in <code>HandleSessionStartChosen</code>. <code>CommitSave</code> goes <i>after</i> <code>PS-&gt;StartSession(...)</code>, because until that stamp exists the guard above refuses. Swap the two lines and the first commit of the sitting silently does not happen &mdash; which matters most in exactly the case that call site was added for, the player who crashes a few seconds in.'},
{t:'chk',q:'A save whose <code>Version</code> did not match was refused at load, so <code>LoadedSave</code> is null. The next write therefore records <code>SessionsPlayed</code> as 1, discarding a count that may have said 40. Is that wrong?',a:'<p><b>No, and the alternative is worse.</b> The version was refused because this build cannot say what the fields mean. Reaching into that same file to salvage one number is claiming that <code>SessionsPlayed</code> definitely still means sessions played &mdash; which is the exact assumption the version check exists to refuse.</p><p>A count of 1 is honest: it is what this build can vouch for. Silently carrying a number forward out of a record you have declared unreadable is how a save system starts telling small lies. If preserving it matters, the answer is a migration written on purpose, with the version bumped to say so.</p>'},
{t:'aside',lab:'Why the controller and not a save subsystem',x:'The controller already holds all three things a write needs: <code>LoadedSave</code>, <code>BoundBankroll</code>, and the moment the player chose how the sitting begins. A <code>UGameInstanceSubsystem</code> would have to be handed every one of them, which means the controller would still decide when to write and would now also decide what to send &mdash; the same coupling, one indirection further away. Subsystems earn their keep when something outside the controller’s lifetime needs the data. Nothing does yet. Guide 4 packaging a build and adding a main menu is when that changes, and it is a move worth making then rather than now.'},
{t:'h',x:'What you will be able to see'},
{t:'p',x:'This is the first module in the guide whose result is a file on disk. Not a log line about a file &mdash; the file. <code>Hasard/Saved/SaveGames/HasardSession.sav</code> appears the moment the first bet is paid for, and it is still there after the editor closes.'},
{t:'p',x:'It also makes module 9’s central claim observable for the first time. Choosing <b>New session</b> resets the balance to 500 and leaves the lifetime figures untouched, and until now you had to take that on trust from a comment in <code>ApplySave</code>. After this module you can watch it: play a sitting, stop, relaunch, start fresh, and the HUD still shows every chip the earlier sitting cost.'},
{t:'build',title:'The record, written',file:'Source/Hasard/HasardPlayerState.h, HasardPlayerController.h + .cpp',x:'<p><b>Phase 1 &mdash; Visual Studio.</b> No new classes. Three files change, all shown complete and marked against where module 9 left them: <b>+</b> new. Replace what is on disk rather than merging by eye.</p> <p><b>1.</b> <code>HasardPlayerState.h</code>, complete. One accessor, and the <code>.cpp</code> does not change:</p> <pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"\n#include "Engine/EngineTypes.h"\n#include "GameFramework/PlayerState.h"\n#include "HasardPlayerState.generated.h"\n\nclass UHasardBankrollComponent;\n\nUCLASS()\nclass HASARD_API AHasardPlayerState : public APlayerState\n{\n\tGENERATED_BODY()\n\npublic:\n\tAHasardPlayerState();\n\n\t/**\n\t * Starts the clock and the reality check. Called once the player has chosen how this\n\t * sitting begins, never from BeginPlay.\n\t *\n\t * InPriorSeconds is what previous sittings already cost, carried in from the save so\n\t * the lifetime figure can be reported without the session clock ever being wound\n\t * forward - those are two different claims and only one of them is about right now.\n\t */\n\tvoid StartSession(float InPriorSeconds);\n\n\t/** Real seconds elapsed this session. Unaffected by pause or time dilation. */\n\tUFUNCTION(BlueprintPure, Category = "Hasard|Session")\n\tfloat GetSessionElapsedSeconds() const;\n\n\t/** Every sitting including this one. What the save records. */\n\tUFUNCTION(BlueprintPure, Category = "Hasard|Session")\n\tfloat GetLifeTimeSeconds() const { return PriorSeconds + GetSessionElapsedSeconds(); }\n\n+|\t/**\n+|\t * True once StartSession has stamped the clock.\n+|\t *\n+|\t * Reads the stamp rather than keeping a bool beside it. Module 9 declined that bool\n+|\t * for the guard inside GetSessionElapsedSeconds, and the reason is unchanged: the\n+|\t * stamp already answers this question, and two answers can disagree.\n+|\t */\n+|\tUFUNCTION(BlueprintPure, Category = "Hasard|Session")\n+|\tbool IsSessionStarted() const { return SessionStartRealTime != 0.0; }\n+|\nprotected:\n\tvirtual void BeginPlay() override;\n\tvirtual void EndPlay(const EEndPlayReason::Type EndPlayReason) override;\n\nprivate:\n\t/** The bankroll. UPROPERTY, or the collector cannot see it. */\n\tUPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category = "Hasard|Bankroll",\n\t\tmeta = (AllowPrivateAccess = "true"))\n\tTObjectPtr&lt;UHasardBankrollComponent&gt; BankrollComp;\n\n\t/** How often the reality check interrupts. 15s for observation; 300s once the UI exists. */\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Session",\n\t\tmeta = (AllowPrivateAccess = "true", ClampMin = "1.0", UIMin = "15.0", UIMax = "600.0"))\n\tfloat RealityCheckIntervalSeconds = 15.0f;\n\n\t/** Wall clock at session start. Deliberately not world time - Module 4. */\n\tdouble SessionStartRealTime = 0.0;\n\n\t/** Seconds carried in from the save. Read only for the lifetime figure. */\n\tfloat PriorSeconds = 0.0f;\n\n\t/** Plain struct, not a UObject: nothing for the collector to track. */\n\tFTimerHandle SessionTimerHandle;\n\n\tvoid RealityCheck();\n};\n</code></pre> <p>Inline in the header because it is one comparison and every caller wants it inlined. <code>BlueprintPure</code> for consistency with the two accessors above it &mdash; nothing in Blueprint calls it today, and the cost of exposing a getter that reads one <code>double</code> is nothing.</p> <p><b>2.</b> <code>HasardPlayerController.h</code>, complete. One declaration, in the existing <code>private:</code> block:</p> <pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"\n#include "Engine/EngineTypes.h"\n#include "GameFramework/PlayerController.h"\n#include "HasardPlayerController.generated.h"\n\nclass UHasardBankrollComponent;\nclass UHasardHUDWidget;\nclass UHasardSaveGame;\nclass UInputMappingContext;\n\nUCLASS()\nclass HASARD_API AHasardPlayerController : public APlayerController\n{\n\tGENERATED_BODY()\n\npublic:\n\t/** Called by the PlayerState\'s reality-check timer. */\n\tvoid HandleRealityCheck(int32 MinutesElapsed);\n\n\t/**\n\t * Called by the felt as the aim enters and leaves a bet position.\n\t *\n\t * The felt does not reach the widget itself. Everything the HUD shows arrives\n\t * through here, so there is one object that decides what the player is told.\n\t */\n\tvoid SetBetPreview(const FText&amp; PreviewText);\n\n\tvoid ClearBetPreview();\n\nprotected:\n\tvirtual void BeginPlay() override;\n\tvirtual void EndPlay(const EEndPlayReason::Type EndPlayReason) override;\n\nprivate:\n\t/** Bound to OnBankrollChanged in BeginPlay. AddDynamic resolves this by reflected name. */\n\tUFUNCTION()\n\tvoid HandleBankrollChanged(int32 NewBalance, int32 Delta, int32 SessionNetChange);\n\n\t/** Bound to the widget\'s OnRealityCheckDismissed. Pops the suppression context. */\n\tvoid HandleRealityCheckDismissed();\n\n\t/** Reads the slot, then puts the choice on screen with last sitting\'s figures on it. */\n\tvoid ShowStartScreen();\n\n\t/** Bound to the widget\'s OnSessionStartChosen. Nothing plays until this has run. */\n\tvoid HandleSessionStartChosen(bool bContinuePrevious);\n\n\t/** Repeating timer callback. One update a second, because that is the resolution shown. */\n\tvoid UpdateSessionTime();\n\n+|\t/**\n+|\t * Writes the record to the slot.\n+|\t *\n+|\t * Cheap and safe to call often - four places do. It refuses rather than writing a\n+|\t * record with a hole in it, and it writes nothing at all before the player has\n+|\t * chosen how the sitting begins.\n+|\t */\n+|\tvoid CommitSave();\n+|\n\t/** Cached so EndPlay unbinds from the same object BeginPlay bound to. */\n\tUPROPERTY()\n\tTObjectPtr&lt;UHasardBankrollComponent&gt; BoundBankroll;\n\n\tUPROPERTY(EditDefaultsOnly, Category = "Hasard|UI")\n\tTSubclassOf&lt;UHasardHUDWidget&gt; HUDWidgetClass;\n\n\tUPROPERTY()\n\tTObjectPtr&lt;UHasardHUDWidget&gt; HUDWidget;\n\n\t/** What the slot held, or null on a first run or a version this build will not read. */\n\tUPROPERTY()\n\tTObjectPtr&lt;UHasardSaveGame&gt; LoadedSave;\n\n\tUPROPERTY(EditDefaultsOnly, Category = "Hasard|UI")\n\tTObjectPtr&lt;UInputMappingContext&gt; RealityCheckContext;\n\n\t/**\n\t * Pushed above the reality check while the start screen is up.\n\t *\n\t * The same blocking trick as IMC_RealityCheck, one priority higher, because the two\n\t * can overlap: the reality-check timer does not start until the session does, but a\n\t * context left at the same priority would be a race worth not having.\n\t */\n\tUPROPERTY(EditDefaultsOnly, Category = "Hasard|UI")\n\tTObjectPtr&lt;UInputMappingContext&gt; StartScreenContext;\n\n\tFTimerHandle ClockTimerHandle;\n};\n</code></pre> <p>Not a <code>UFUNCTION</code>, and <code>private</code>. Four call sites, all of them inside this class. Exposing it would let a Blueprint write the record at a moment nobody reasoned about, which is precisely the decision this module spent its length making.</p> <p><b>3.</b> <code>HasardPlayerController.cpp</code>, complete. Four call sites, one new function, and one new log line on the read path:</p> <pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#include "HasardPlayerController.h"\n#include "EnhancedInputSubsystems.h"\n#include "Engine/LocalPlayer.h"\n#include "Engine/World.h"\n#include "InputMappingContext.h"\n#include "Kismet/GameplayStatics.h"\n#include "TimerManager.h"\n#include "HasardBankrollComponent.h"\n#include "HasardGameMode.h"\n#include "HasardPayoutTable.h"\n#include "HasardHUDWidget.h"\n#include "HasardPlayerState.h"\n#include "HasardSaveGame.h"\n#include "HasardTypes.h"\n\nvoid AHasardPlayerController::BeginPlay()\n{\n\tSuper::BeginPlay();\n\n\tif (HUDWidgetClass)\n\t{\n\t\tHUDWidget = CreateWidget&lt;UHasardHUDWidget&gt;(this, HUDWidgetClass);\n\t\tif (HUDWidget)\n\t\t{\n\t\t\tHUDWidget-&gt;AddToViewport();\n\t\t\tHUDWidget-&gt;OnRealityCheckDismissed.AddUObject(\n\t\t\t\tthis, &amp;AHasardPlayerController::HandleRealityCheckDismissed);\n\t\t\tHUDWidget-&gt;OnSessionStartChosen.AddUObject(\n\t\t\t\tthis, &amp;AHasardPlayerController::HandleSessionStartChosen);\n\t\t}\n\t}\n\n\t// The one figure true of every bet, published once because it never changes -\n\t// and because it never changing is the entire point of showing it.\n\tif (HUDWidget)\n\t{\n\t\tconst AHasardGameMode* GM = GetWorld()-&gt;GetAuthGameMode&lt;AHasardGameMode&gt;();\n\t\tconst UHasardPayoutTable* Table = GM ? GM-&gt;GetPayoutTable() : nullptr;\n\n\t\tfloat SharedEdge = 0.0f;\n\t\tif (Table &amp;&amp; Table-&gt;TryGetSharedHouseEdge(SharedEdge))\n\t\t{\n\t\t\tHUDWidget-&gt;SetHouseEdge(SharedEdge * 100.0f);\n\t\t}\n\t\telse\n\t\t{\n\t\t\tHUDWidget-&gt;SetHouseEdgeUnknown();\n\t\t}\n\t}\n\n\t// Before the player state is looked up, so a misconfigured Player State Class leaves\n\t// the player looking at a start screen rather than at a table that silently does not\n\t// keep score. The warnings below still say what is wrong.\n\tShowStartScreen();\n\n\tAHasardPlayerState* PS = GetPlayerState&lt;AHasardPlayerState&gt;();\n\tif (!PS)\n\t{\n\t\tUE_LOG(LogHasard, Warning,\n\t\t\tTEXT("Controller: no AHasardPlayerState - check Player State Class"));\n\t\treturn;\n\t}\n\n\tBoundBankroll = PS-&gt;FindComponentByClass&lt;UHasardBankrollComponent&gt;();\n\tif (!BoundBankroll)\n\t{\n\t\tUE_LOG(LogHasard, Warning, TEXT("Controller: player state has no bankroll component"));\n\t\treturn;\n\t}\n\n\tBoundBankroll-&gt;OnBankrollChanged.AddDynamic(\n\t\tthis, &amp;AHasardPlayerController::HandleBankrollChanged);\n\n\tif (HUDWidget)\n\t{\n\t\tHUDWidget-&gt;SetBankroll(BoundBankroll-&gt;GetBalance(),\n\t\t\tBoundBankroll-&gt;GetSessionStaked(),\n\t\t\tBoundBankroll-&gt;GetSessionNetChange());\n\n\t\tHUDWidget-&gt;SetLifetime(BoundBankroll-&gt;GetLifetimeStaked(),\n\t\t\tBoundBankroll-&gt;GetLifetimeNetChange());\n\t}\n\n\tGetWorldTimerManager().SetTimer(ClockTimerHandle, this,\n\t\t&amp;AHasardPlayerController::UpdateSessionTime, 1.0f, true);\n}\n\nvoid AHasardPlayerController::EndPlay(const EEndPlayReason::Type EndPlayReason)\n{\n+|\t// First line of the function, and it has to be. Everything below releases something\n+|\t// CommitSave reads - the bankroll pointer is nulled twenty lines down - so a commit\n+|\t// placed at the end of this function would find nothing and refuse, silently.\n+|\tCommitSave();\n+|\n\tGetWorldTimerManager().ClearTimer(ClockTimerHandle);\n\n\tif (HUDWidget)\n\t{\n\t\tHUDWidget-&gt;OnRealityCheckDismissed.RemoveAll(this);\n\t\tHUDWidget-&gt;OnSessionStartChosen.RemoveAll(this);\n\t}\n\n\tif (BoundBankroll)\n\t{\n\t\tBoundBankroll-&gt;OnBankrollChanged.RemoveDynamic(\n\t\t\tthis, &amp;AHasardPlayerController::HandleBankrollChanged);\n\t\tBoundBankroll = nullptr;\n\t}\n\n\tSuper::EndPlay(EndPlayReason);\n}\n\nvoid AHasardPlayerController::ShowStartScreen()\n{\n\tif (!HUDWidget)\n\t{\n\t\treturn;\n\t}\n\n\tLoadedSave = Cast&lt;UHasardSaveGame&gt;(UGameplayStatics::LoadGameFromSlot(\n\t\tUHasardSaveGame::SlotName, UHasardSaveGame::UserIndex));\n\n\tif (LoadedSave &amp;&amp; LoadedSave-&gt;Version != UHasardSaveGame::CurrentVersion)\n\t{\n\t\t// Refused rather than migrated. A field whose meaning changed would make\n\t\t// LifetimeStaked a number about something else, and no guess is honest.\n\t\tUE_LOG(LogHasard, Warning,\n\t\t\tTEXT("Save is a version of %d, this build reads %d - ignoring it"),\n\t\t\tLoadedSave-&gt;Version, UHasardSaveGame::CurrentVersion);\n\n\t\tLoadedSave = nullptr;\n\t}\n\n+|\t// Said out loud on every launch, because until now the read path had nothing to read\n+|\t// and no way to tell you so. The figures here are the ones the start screen is about\n+|\t// to show, from the same object, so the two cannot disagree.\n+|\tif (LoadedSave)\n+|\t{\n+|\t\tUE_LOG(LogHasard, Warning,\n+|\t\t\tTEXT("Save read: sessions %d, staked %d, seconds %.0f, balance %d"),\n+|\t\t\tLoadedSave-&gt;SessionsPlayed, LoadedSave-&gt;LifetimeStaked,\n+|\t\t\tLoadedSave-&gt;LifetimeSeconds, LoadedSave-&gt;Balance);\n+|\t}\n+|\telse\n+|\t{\n+|\t\tUE_LOG(LogHasard, Warning, TEXT("No usable save - this is a first sitting"));\n+|\t}\n+|\n\tif (StartScreenContext)\n\t{\n\t\tif (UEnhancedInputLocalPlayerSubsystem* Subsystem = \n\t\t\tULocalPlayer::GetSubsystem&lt;UEnhancedInputLocalPlayerSubsystem&gt;(GetLocalPlayer()))\n\t\t{\n\t\t\tSubsystem-&gt;AddMappingContext(StartScreenContext, 20);\n\t\t}\n\t}\n\n\tSetShowMouseCursor(true);\n\tSetInputMode(FInputModeGameAndUI()\n\t\t.SetLockMouseToViewportBehavior(EMouseLockMode::DoNotLock)\n\t\t.SetHideCursorDuringCapture(false));\n\n\tHUDWidget-&gt;ShowStartScreen(LoadedSave != nullptr,\n\t\tLoadedSave ? LoadedSave-&gt;Balance : 0,\n\t\tLoadedSave ? LoadedSave-&gt;LifetimeStaked : 0,\n\t\tLoadedSave ? LoadedSave-&gt;LifetimeWon - LoadedSave-&gt;LifetimeStaked : 0);\n\n}\n\nvoid AHasardPlayerController::HandleSessionStartChosen(bool bContinuePrevious)\n{\n\tif (StartScreenContext)\n\t{\n\t\tif (UEnhancedInputLocalPlayerSubsystem* Subsystem =\n\t\t\tULocalPlayer::GetSubsystem&lt;UEnhancedInputLocalPlayerSubsystem&gt;(GetLocalPlayer()))\n\t\t{\n\t\t\tSubsystem-&gt;RemoveMappingContext(StartScreenContext);\n\t\t}\n\t}\n\n\tSetShowMouseCursor(false);\n\tSetInputMode(FInputModeGameOnly());\n\n\tif (HUDWidget)\n\t{\n\t\tHUDWidget-&gt;HideStartScreen();\n\t}\n\n\t// No save is not an error. It is a first sitting, and the defaults already describe\n\t// one - which is why there is no separate branch here for it.\n\tif (LoadedSave &amp;&amp; BoundBankroll)\n\t{\n\t\tBoundBankroll-&gt;ApplySave(*LoadedSave, bContinuePrevious);\n\t}\n\n\tif (AHasardPlayerState* PS = GetPlayerState&lt;AHasardPlayerState&gt;())\n\t{\n\t\tPS-&gt;StartSession(LoadedSave ? LoadedSave-&gt;LifetimeSeconds : 0.0f);\n\t}\n\n\tUE_LOG(LogHasard, Warning, TEXT("Session started -%s"),\n\t\tbContinuePrevious ? TEXT("continuing the last one") : TEXT("new"));\n+|\n+|\t// After StartSession, never before it: CommitSave refuses to write until the clock\n+|\t// has been stamped, so the order of these two lines is the difference between the\n+|\t// sitting being counted and the sitting being lost.\n+|\tCommitSave();\n}\n\nvoid AHasardPlayerController::HandleBankrollChanged(int32 NewBalance, int32 Delta,\n\tint32 SessionNetChange)\n{\n\tUE_LOG(LogHasard, Warning, TEXT("Bankroll: balance %d (%+d), session net %+d"),\n\t\tNewBalance, Delta, SessionNetChange);\n\n\tif (HUDWidget &amp;&amp; BoundBankroll)\n\t{\n\t\tHUDWidget-&gt;SetBankroll(NewBalance, BoundBankroll-&gt;GetSessionStaked(), SessionNetChange);\n\n\t\tHUDWidget-&gt;SetLifetime(BoundBankroll-&gt;GetLifetimeStaked(),\n\t\t\tBoundBankroll-&gt;GetLifetimeNetChange());\n\t}\n+|\n+|\t// Every stake and every credit. The record is never more than one money movement\n+|\t// behind what the HUD is showing, which is the only relationship between them worth\n+|\t// guaranteeing.\n+|\tCommitSave();\n}\n\nvoid AHasardPlayerController::UpdateSessionTime()\n{\n\tif (!HUDWidget)\n\t{\n\t\treturn;\n\t}\n\n\t// The same accessor the log uses, so the clock and the log cannot disagree.\n\tif (const AHasardPlayerState* PS = GetPlayerState&lt;AHasardPlayerState&gt;())\n\t{\n\t\tHUDWidget-&gt;SetSessionTime(PS-&gt;GetSessionElapsedSeconds());\n\t}\n}\n\n+|void AHasardPlayerController::CommitSave()\n+|{\n+|\tconst AHasardPlayerState* PS = GetPlayerState&lt;AHasardPlayerState&gt;();\n+|\n+|\t// Nothing is written before the player has chosen. Until that choice the bankroll\n+|\t// holds StartingBalance rather than the record, so a write here would replace a real\n+|\t// saved balance with 500 for somebody who opened the game and read the start screen.\n+|\tif (!PS || !PS-&gt;IsSessionStarted())\n+|\t{\n+|\t\treturn;\n+|\t}\n+|\n+|\tif (!BoundBankroll)\n+|\t{\n+|\t\t// Refused rather than written short. A stale record is merely old; a record with\n+|\t\t// a zero in it is a false statement about what playing cost.\n+|\t\tUE_LOG(LogHasard, Error, TEXT("CommitSave: no bankroll - nothing written"));\n+|\t\treturn;\n+|\t}\n+|\n+|\tUHasardSaveGame* Save = Cast&lt;UHasardSaveGame&gt;(\n+|\t\tUGameplayStatics::CreateSaveGameObject(UHasardSaveGame::StaticClass()));\n+|\n+|\tif (!Save)\n+|\t{\n+|\t\tUE_LOG(LogHasard, Error, TEXT("CommitSave: could not create the save object"));\n+|\t\treturn;\n+|\t}\n+|\n+|\tSave-&gt;Version         = UHasardSaveGame::CurrentVersion;\n+|\tSave-&gt;Balance         = BoundBankroll-&gt;GetBalance();\n+|\tSave-&gt;LifetimeStaked  = BoundBankroll-&gt;GetLifetimeStaked();\n+|\tSave-&gt;LifetimeWon     = BoundBankroll-&gt;GetLifetimeWon();\n+|\tSave-&gt;LifetimeSeconds = PS-&gt;GetLifeTimeSeconds();\n+|\n+|\t// Counted from what was read, not from what was last written, so the value is stable\n+|\t// however many times this function runs in one sitting. A sitting the player started\n+|\t// fresh is still a sitting, so nothing here ever counts down.\n+|\tSave-&gt;SessionsPlayed = (LoadedSave ? LoadedSave-&gt;SessionsPlayed : 0) + 1;\n+|\n+|\tif (!UGameplayStatics::SaveGameToSlot(Save, UHasardSaveGame::SlotName,\n+|\t\tUHasardSaveGame::UserIndex))\n+|\t{\n+|\t\tUE_LOG(LogHasard, Error, TEXT("CommitSave: SaveGameToSlot refused the write"));\n+|\t}\n+|}\n+|\nvoid AHasardPlayerController::SetBetPreview(const FText&amp; PreviewText)\n{\n\tif (HUDWidget)\n\t{\n\t\tHUDWidget-&gt;SetBetPreview(PreviewText);\n\t}\n}\n\nvoid AHasardPlayerController::ClearBetPreview()\n{\n\tif (HUDWidget)\n\t{\n\t\tHUDWidget-&gt;ClearBetPreview();\n\t}\n}\n\nvoid AHasardPlayerController::HandleRealityCheck(int32 MinutesElapsed)\n{\n+|\t// First, and above the guard below. The clock advances whether or not the money does,\n+|\t// and whether or not the widget exists - so the one call site that commits elapsed\n+|\t// time must not be behind a check for a HUD.\n+|\tCommitSave();\n+|\n\tif (!HUDWidget || !BoundBankroll)\n\t{\n\t\treturn;\n\t}\n\n\tif (RealityCheckContext)\n\t{\n\t\t// Suppress table input while the check is up - Module 6\'s contexts\n\t\tif (UEnhancedInputLocalPlayerSubsystem* Subsystem =\n\t\t\tULocalPlayer::GetSubsystem&lt;UEnhancedInputLocalPlayerSubsystem&gt;(GetLocalPlayer()))\n\t\t{\n\t\t\tSubsystem-&gt;AddMappingContext(RealityCheckContext, 10);\n\t\t}\n\t}\n\n\t// The context stops gameplay input; this hands the mouse to Slate so the\n\t// dismiss button can actually be clicked. Two different jobs.\n\tSetShowMouseCursor(true);\n\tSetInputMode(FInputModeGameAndUI()\n\t\t.SetLockMouseToViewportBehavior(EMouseLockMode::DoNotLock)\n\t\t.SetHideCursorDuringCapture(false));\n\n\tHUDWidget-&gt;ShowRealityCheck(MinutesElapsed,\n\t\tBoundBankroll-&gt;GetSessionStaked(),\n\t\tBoundBankroll-&gt;GetSessionNetChange());\n}\n\nvoid AHasardPlayerController::HandleRealityCheckDismissed()\n{\n\tif (RealityCheckContext)\n\t{\n\t\tif (UEnhancedInputLocalPlayerSubsystem* Subsystem =\n\t\t\tULocalPlayer::GetSubsystem&lt;UEnhancedInputLocalPlayerSubsystem&gt;(GetLocalPlayer()))\n\t\t{\n\t\t\tSubsystem-&gt;RemoveMappingContext(RealityCheckContext);\n\t\t}\n\t}\n\n\tSetShowMouseCursor(false);\n\tSetInputMode(FInputModeGameOnly());\n}\n</code></pre> <p><code>CreateSaveGameObject</code> rather than <code>NewObject</code>: it is the documented entry point and it takes the class, which keeps <code>UHasardSaveGame</code> named once in the call. The returned pointer lives in a local for the three statements between creation and <code>SaveGameToSlot</code>, with nothing latent in between, so there is no window for the collector to take it.</p> <p>Notice also the log string at the foot of <code>HandleSessionStartChosen</code>: <code>Session started</code>, singular. It read <code>Sessions started</code> before this module, which is one letter and was wrong on every launch.</p> <p><b>Phase 2 &mdash; build.</b></p> <p><b>4.</b> Save everything with <code>Ctrl+Shift+S</code>. Two headers changed, so <b>close the editor</b> &mdash; Live Coding cannot take these. Build with <code>Ctrl+Shift+B</code> and confirm the Output window ends with <code>Build: 1 succeeded, 0 failed</code>.</p> <p><b>5.</b> Before reopening, start from nothing. In Explorer open <code>Hasard\\Saved\\SaveGames\\</code>. If a <code>HasardSession.sav</code> is there from an earlier experiment, delete it. Leave the window open where you can see it.</p> <p><b>Phase 3 &mdash; four launches.</b></p> <p><b>6.</b> Reopen the editor, open <code>L_RouletteTest</code>, <b>Window &rarr; Output Log</b>, filter on <code>LogHasard</code>. Press <b>Play</b>. The first new line is the read path finally saying what it found:</p> <pre><code>LogHasard: Warning: No usable save - this is a first sitting</code></pre> <p>The start screen offers only <b>New session</b>, exactly as it did in module 9. Choose it.</p> <p><b>7.</b> Place three or four bets, spin, and let the round settle. Now look at the Explorer window: <code>HasardSession.sav</code> is there. Check its timestamp &mdash; it was written when the <i>first bet was paid for</i>, not when the round finished and not when you stopped. That is <code>HandleBankrollChanged</code>.</p> <p><b>8.</b> Press <b>Stop</b>, then <b>Play</b> again. Both buttons are on the start screen, and the log states what it read. Your figures will differ:</p> <pre><code>LogHasard: Warning: Save read: sessions 1, staked 40, seconds 73, balance 475</code></pre> <p>Check the four figures against what you actually did before going further. <code>staked</code> is every chip you committed, not your losses. <code>balance</code> is what was left. <code>seconds</code> is the sitting, and it should be roughly how long you spent after choosing rather than how long the editor was open &mdash; that is module 9&rsquo;s clock, surviving a launch for the first time.</p> <p><b>9.</b> Choose <b>Continue last session</b>. The balance is what you left, and the lifetime line carries. Stop.</p> <p><b>10.</b> Press <b>Play</b> and this time choose <b>New session</b>. <b>This is the module.</b> The balance is 500 again &mdash; and the lifetime line still reports every chip of both earlier sittings. Nothing on that screen let the player make what they have spent look smaller, and you can now watch that rather than read it in a comment.</p> <p><b>11.</b> Stop and Play once more, and read the count climb: <code>sessions 3</code>. It counted the fresh start, because a sitting the player chose to begin from scratch is still a sitting.</p> <p><b>12. The test the design exists for &mdash; optional, but do it once.</b> Start a sitting, place a couple of bets, then kill the editor from Task Manager rather than stopping it. <code>EndPlay</code> never runs. Relaunch and read the log: the record is intact to the last money movement. The other three call sites exist for this, and this is the only way to watch them work.</p> <p><b>13.</b> Paste the <code>Save read:</code> lines from steps 8 and 11 into <code>docs/save-test.md</code> with today&rsquo;s date, beside <code>distribution-test.md</code> and <code>layout-audit.md</code>. Same reason as both of those: the claim is only as good as the evidence you kept.</p> <p><b>14.</b> Commit.</p> <pre><code>git add -A\ngit commit -m "Write the session record on every money movement and on exit"</code></pre> <p><b>The two failures worth recognising.</b> <code>CommitSave: no bankroll - nothing written</code> on every Stop and never during play means the commit in <code>EndPlay</code> drifted below the teardown. And a <code>.sav</code> that exists but always reports <code>staked 0, balance 500</code> means the guard is not holding &mdash; check that <code>CommitSave</code> in <code>HandleSessionStartChosen</code> sits after <code>StartSession</code> rather than before it.</p>'},

/* ============================================================
   RENDER ENGINE
   ============================================================ */
const done = new Set();
let cur = 0;
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const TOKENS = new RegExp([
  '(\\/\\*[\\s\\S]*?\\*\\/|\\/\\/[^\\n]*)',
  '("[^"\\n]*")',
  '\\b(UPROPERTY|UFUNCTION|UCLASS|USTRUCT|UENUM|UINTERFACE|UMETA|GENERATED_BODY|UE_LOG|' +
    'DEFINE_LOG_CATEGORY_STATIC|DEFINE_LOG_CATEGORY|DECLARE_LOG_CATEGORY_EXTERN|' +
    'DECLARE_DYNAMIC_MULTICAST_DELEGATE(?:_\\w+)?|DECLARE_DELEGATE(?:_\\w+)?|TEXT|' +
    'check|ensure(?:Always)?)\\b',
  '\\b(class|struct|enum|void|float|double|bool|const|public|private|protected|if|else|' +
    'for|while|return|new|static|virtual|override|template|namespace|true|false|nullptr|' +
    'this|int32|uint8|int16|uint16|string)\\b',
  '\\b([UAFTIEG][A-Z]\\w*)\\b'
].join('|'), 'g');

function hi(code){
  return esc(code).replace(TOKENS, (m, cm, st, mc, kw, ty) => {
    const cls = cm ? 'cm' : st ? 'st' : mc ? 'mc' : kw ? 'kw' : ty ? 'ty' : null;
    return cls ? '<span class="' + cls + '">' + m + '</span>' : m;
  });
}

/* ---- line-level diff markers -------------------------------------------
   Inside a <pre><code> block a line may open with one of three two-character
   markers: "+|" added, "~|" changed, "-|" deleted (shown for context only).
   A line with no marker is unchanged. C++ never legitimately opens a line
   with one of these tokens, so there is no ambiguity.                      */
const LNCLASS = {'+|':'add', '~|':'chg', '-|':'del'};

/* hi() now runs per line rather than over the whole block, which would break a
   C-style comment token spanning several lines. An unmarked block containing
   one falls back to whole-string highlighting. */
const MULTILINE_COMMENT = /\/\*[^]*?\n[^]*?\*\//;

function hiLines(code, preEscaped){
  const lines = code.split('\n');
  const hasMarkers = lines.some(l => LNCLASS[l.substring(0,2)] !== undefined);
  if(!hasMarkers && !preEscaped && MULTILINE_COMMENT.test(code)) return hi(code);
  let out = '';
  for(let i = 0; i < lines.length; i++){
    const cls  = LNCLASS[lines[i].substring(0,2)];
    const body = cls ? lines[i].substring(2) : lines[i];
    out += '<span class="ln' + (cls ? ' ' + cls : '') + '">' +
           (preEscaped ? body : hi(body)) + '</span>';
  }
  return out;
}

/* Panels carry their code as already-escaped HTML, so mark the lines without
   re-escaping or re-highlighting them. */
function markCode(html){
  return html.replace(/<pre><code>([\s\S]*?)<\/code><\/pre>/g,
    (m, body) => '<pre><code>' + hiLines(body, true) + '</code></pre>');
}

function buildNav(){
  const nav = document.getElementById('nav');
  let html = '', lastGrp = '';
  COURSE.forEach((m,i)=>{
    if(m.grp !== lastGrp){ html += '<div class="grp">'+m.grp+'</div>'; lastGrp = m.grp; }
    html += '<button data-i="'+i+'"><span class="n">'+(m.num||String(i).padStart(2,'0'))+'</span>'+m.title+'<span class="dot">&#10003;</span></button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
}

function refreshNav(){
  document.querySelectorAll('#nav button').forEach(b=>{
    const i = +b.dataset.i;
    b.classList.toggle('on', i===cur);
    b.classList.toggle('done', done.has(i));
  });
  const pct = Math.round(done.size/COURSE.length*100);
  document.querySelector('#prog>i').style.width = pct+'%';
  document.getElementById('progtxt').textContent =
    done.size+' of '+COURSE.length+' modules complete'+(done.size===COURSE.length?'  — course finished':'');
}

function renderBlocks(bl){
  return bl.map(b=>{
    switch(b.t){
      case 'h': return '<h3>'+b.x+'</h3>';
      case 'p': return '<p>'+b.x+'</p>';
      case 'code': return '<pre><code>'+hiLines(b.x,false)+'</code></pre>';
      case 'aside': return '<div class="aside"><div class="lab">'+(b.lab||'Why it works')+'</div>'+markCode(b.x.trim().startsWith('<p')?b.x:'<p>'+b.x+'</p>')+'</div>';
      case 'warn': return '<div class="warn"><div class="lab">'+(b.lab||'Careful')+'</div>'+markCode(b.x.trim().startsWith('<p')?b.x:'<p>'+b.x+'</p>')+'</div>';
      case 'rg': return '<div class="rg"><div class="lab">'+(b.lab||'Responsible gaming')+'</div>'+markCode(b.x.trim().startsWith('<p')?b.x:'<p>'+b.x+'</p>')+'</div>';
      case 'build': return '<div class="build"><div class="lab">&#9654; Build &mdash; '+b.title+'</div>'+
        (b.file?'<div class="file">'+b.file+'</div>':'')+markCode(b.x.trim().startsWith('<p')?b.x:'<p>'+b.x+'</p>')+'</div>';
      case 'srcs': return '<div class="srcs"><div class="lab">Epic documentation for this module</div>'+
        b.x.map(s=>'<a href="'+s[1]+'" target="_blank" rel="noopener">'+s[0]+'</a>').join('')+'</div>';
      case 'list': return '<ul>'+b.x.map(li=>'<li>'+li+'</li>').join('')+'</ul>';
      case 'table': return '<table><thead><tr>'+b.head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+
        b.rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
      case 'chk': return '<div class="chk"><div class="lab">Check yourself</div><p class="q">'+b.q+'</p>'+
        '<button onclick="this.parentNode.classList.add(\'open\')">Reveal answer</button>'+
        '<div class="ans">'+b.a+'</div></div>';
    }
    return '';
  }).join('');
}

function renderQuiz(m, idx){
  const isExam = COURSE[idx].grp === 'Assessment';
  let h = '<div class="quiz"><h4>'+(isExam?'Final Examination':'Module '+idx+' Quiz')+'</h4>'+
    '<p class="hint">'+m.quiz.length+' questions. Pick one answer per question; reasoning appears immediately.</p>';
  m.quiz.forEach((q,qi)=>{
    h += '<div class="qi" data-q="'+qi+'"><p class="qt"><span class="num">Q'+(qi+1)+'</span>'+q.q+'</p>';
    q.opts.forEach((o,oi)=>{ h += '<button class="opt" data-q="'+qi+'" data-o="'+oi+'">'+o+'</button>'; });
    h += '<div class="why" data-why="'+qi+'"></div></div>';
  });
  h += '<div class="score" id="score"></div></div>';
  return h;
}

function go(i){
  cur = i;
  const m = COURSE[i];
  const isExam = COURSE[i].grp === 'Assessment';
  const main = document.getElementById('main');
  main.innerHTML =
    '<div class="kicker">'+(isExam?'Assessment':'Module '+(m.num?m.num.replace(/^0/,''):i))+' &middot; '+m.grp+'</div>'+
    '<h2 class="title">'+m.title+'</h2>'+
    '<p class="lede">'+m.lede+'</p>'+
    renderBlocks(m.blocks)+
    renderQuiz(m,i)+
    '<div class="pager">'+
      '<button id="prev" '+(i===0?'disabled':'')+'>&larr; Previous</button>'+
      '<button id="next" class="primary" '+(i===COURSE.length-1?'disabled':'')+'>Next module &rarr;</button>'+
    '</div>';
  window.scrollTo(0,0);

  const answered = {}; let correct = 0;
  main.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick = ()=>{
      const qi = +btn.dataset.q, oi = +btn.dataset.o;
      if(answered[qi]!==undefined) return;
      answered[qi] = oi;
      const q = m.quiz[qi];
      main.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(b=>{
        b.disabled = true;
        if(+b.dataset.o === q.c) b.classList.add('right');
        else if(+b.dataset.o === oi) b.classList.add('wrong');
      });
      if(oi === q.c) correct++;
      const why = main.querySelector('.why[data-why="'+qi+'"]');
      why.innerHTML = (oi===q.c?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q.why;
      why.classList.add('show');
      if(Object.keys(answered).length === m.quiz.length){
        const sc = document.getElementById('score');
        const pct = Math.round(correct/m.quiz.length*100);
        let verdict;
        if(isExam) verdict = correct>=12 ? ' — pass. Go package the build.' : ' — below the pass mark of 12. Revisit the modules named above.';
        else verdict = pct===100 ? ' — clean sweep.' : pct>=60 ? ' — solid. Reread what you missed, then do the Build step.' : ' — reread this module before building.';
        sc.innerHTML = '<b>Score: '+correct+' / '+m.quiz.length+' ('+pct+'%)</b>'+verdict;
        sc.classList.add('show');
        done.add(i); refreshNav();
      }
    };
  });
  const p = document.getElementById('prev'), n = document.getElementById('next');
  if(p) p.onclick = ()=>go(i-1);
  if(n) n.onclick = ()=>go(i+1);
  refreshNav();
}

buildNav(); go(0);
</script>
