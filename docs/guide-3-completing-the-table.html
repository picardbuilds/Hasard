		return false;\n	}\n\n	const UWorld* World = GetWorld();\n	if (!World)\n	{\n~|		return false;\n	}\n\n	FVector EyeLocation;\n	FRotator EyeRotation;\n	OwnerPawn-&gt;GetActorEyesViewPoint(EyeLocation, EyeRotation);\n\n	const FVector End = EyeLocation + (EyeRotation.Vector() * TraceDistance);\n\n	FCollisionQueryParams Params;\n	Params.AddIgnoredActor(OwnerPawn);\n\n-|	FHitResult Hit;\n	const bool bHit = World-&gt;SweepSingleByChannel(\n~|		OutHit, EyeLocation, End, FQuat::Identity, ECC_Visibility,\n		FCollisionShape::MakeSphere(TraceRadius), Params);\n\n	DrawDebugLine(World, EyeLocation, End,\n		bHit ? FColor::Green : FColor::Red, false, 1.0f, 0, 1.5f);\n\n-|	return bHit ? Hit.GetActor() : nullptr;\n+|	// A sphere sweep that starts already overlapping reports bStartPenetrating and\n+|	// leaves ImpactPoint at the trace start, which would resolve to a bet nowhere near\n+|	// where the player was looking. Refuse it rather than guess.\n+|	if (bHit &amp;&amp; OutHit.bStartPenetrating)\n+|	{\n+|		OutHit = FHitResult();\n+|		return false;\n~|	}\n+|\n+|	return bHit;\n+|}\n</code></pre><p><b>8.</b> <code>HasardFelt.h</code>, new:</p><pre><code>+|// Copyright Picardbuilds. All Rights Reserved.\n+|\n+|#pragma once\n+|\n+|#include "CoreMinimal.h"\n+|#include "GameFramework/Actor.h"\n+|#include "HasardInteractable.h"\n+|#include "HasardFelt.generated.h"\n+|\n+|class UBoxComponent;\n+|class UHasardTableLayout;\n+|\n+|/**\n+| * The betting surface. One actor for all 157 positions.\n+| *\n+| * There is deliberately no actor per bet: 83 of the 157 positions are lines and corners\n+| * between cells, so they have no area of their own and nothing to own a collision volume.\n+| * Instead this is a single box the trace can hit, and the layout asset turns the impact\n+| * point into a position id. The felt draws itself from the same numbers, so the picture\n+| * and the hit test cannot disagree.\n+| */\n+|UCLASS()\n+|class HASARD_API AHasardFelt : public AActor, public IHasardInteractable\ ueprintReadOnly, Category = "Hasard|Felt",\n+|		meta = (AllowPrivateAccess = "true", ClampMin = "1"))\n+|	int32 StakePerClick = 5;\n+|\n+|	/** Draws the grid and all 157 chip locations on BeginPlay. Debug builds only. */\n+|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Felt",\n+|		meta = (AllowPrivateAccess = "true"))\n+|	bool bDrawDebugLayout = true;\n+|\n+|	/** Height of the collision box. The felt is flat; this is just enough to trace against. */\n+|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Felt",\n+|		meta = (AllowPrivateAccess = "true", ClampMin = "0.1"))\n+|	float SurfaceThickness = 2.0f;\n+|};\n</code></pre><p><b>9.</b> <code>HasardFelt.cpp</code>, new:</p><pre><code>+|// Copyright Picardbuilds. All Rights Reserved.\n+|\n+|#include "HasardFelt.h"\n+|#include "HasardBettingComponent.h"\n+|#include "HasardTableLayout.h"\n+|#include "HasardTypes.h"\n+|#include "Components/BoxComponent.h"\n+|#include "Components/SceneComponent.h"\n+|#include "DrawDebugHelpers.h"\n+|#include "Engine/World.h"\n+|#include "GameFramework/Pawn.h"\n+|\n+|AHasardFelt::AHasardFelt()\n+|{\n+|	PrimaryActorTick.bCanEverTick = false;\n+|\n+|	Root = CreateDefaultSubobject&lt;USceneComponent&gt;(TEXT("Root"));\n+|	SetRootComponent(Root);\n+|\n+|	Surface = CreateDefaultSubobject&lt;UBoxComponent&gt;(TEXT("Surface"));\n+|	Surface-&gt;SetupAttachment(Root);\n+|\n+|	// Visibility is the channel the interaction trace sweeps on.\n+|	Surface-&gt;SetCollisionEnabled(ECollisionEnabled::QueryOnly);\n+|	Surface-&gt;SetCollisionResponseToAllChannels(ECR_Ignore);\n+|	Surface-&gt;SetCollisionResponseToChannel(ECC_Visibility, ECR_Block);\n+|}\n+|\n+|void AHasardFelt::OnConstruction(const FTransform&amp; Transform)\n+|{\n+|	Super::OnConstruction(Transform);\n+|\n+|	// Resized here as well as in BeginPlay, so assigning the asset in the editor\n+|	// shows the right box immediately rather than after the next Play.\n+|	SyncBoxToLayout();\n+|}\n+|\n+|void AHasardFelt::BeginPlay()\n+|{\n+|	Super::BeginPlay();\n+|\n+|	if (!TableLayout)\n+|	{\n+|		UE_LOG(LogHasard, Error, TEXT("Felt: no table layout on BP_Felt - clicks cannot resolve"));\n+|		return;\n+|	}\n+|\n+|	SyncBoxToLayout();\n+|\n+|	const int32 Count = TableLayout-&gt;GetPositions().Num();\n+|	UE_LOG(LogHasard, Warning, TEXT("Felt: %d positions, stake %d per click"),\n+|		Count, StakePerClick);\n+|\n+|	if (bDrawDebugLayout)\n+|	{\n+|		DrawDebugLayout();\n+|	}\n+|}\n+|\n+|void AHasardFelt::SyncBoxToLayout()\n+|{\n+|	if (!TableLayout || !Surface)\n+|	{\n+|		return;\n+|	}\n+|\n+|	FVector2D Min, Max;\n+|	TableLayout-&gt;GetFeltBounds(Min, Max);\n+|\n+|	const FVector2D Size = Max - Min;\n+|	const FVector2D Center = (Max + Min) * 0.5f;\n+|\n+|	// Offset against Root, never against the actor. If Surface were the root component,\n+|	// setting its relative location would move the actor and shift every coordinate.\n+|	Surface-&gt;SetBoxExtent(FVector(Size.X * 0.5f, Size.Y * 0.5f, SurfaceThickness * 0.5f));\n+|	Surface-&gt;SetRelativeLocation(FVector(Center.X, Center.Y, 0.0f));\n+|}\n+|\n+|FVector2D AHasardFelt::WorldToFeltLocal(const FVector&amp; WorldPoint) const\n+|{\n+|	// Relative to the actor, not to the box: the box moves with GridOrigin, and the\n+|	// layout\'s coordinates are measured from the actor\'s own origin.\n+|	const FVector Local = GetActorTransform().InverseTransformPosition(WorldPoint);\n+|	return FVector2D(Local.X, Local.Y);\n+|}\n+|\n+|FVector AHasardFelt::FeltLocalToWorld(const FVector2D&amp; LocalPoint) const\n+|{\n+|	return GetActorTransform().TransformPosition(FVector(LocalPoint.X, LocalPoint.Y, 0.0f));\n+|}\n+|\n+|void AHasardFelt::OnPlayerInteract_Implementation(APawn* InstigatorPawn,\n+|	const FVector&amp; HitLocation)\n+|{\n+|	if (!InstigatorPawn || !TableLayout)\n+|	{\n+|		return;\n+|	}\n+|\n+|	UHasardBettingComponent* Betting =\n+|		InstigatorPawn-&gt;FindComponentByClass&lt;UHasardBettingComponent&gt;();\n+|	if (!Betting)\n+|	{\n+|		UE_LOG(LogHasard, Warning, TEXT("Felt: %s has no betting component"),\n+|			*GetNameSafe(InstigatorPawn));\n+|		return;\n+|	}\n+|\n+|	const FVector2D Local = WorldToFeltLocal(HitLocation);\n+|	const int32 PositionId = TableLayout-&gt;ResolvePosition(Local);\n+|\n+|	if (PositionId == INDEX_NONE)\n+|	{\n+|		// A miss is not an error, but it is not silent either: the coordinate is the\n+|		// only way to tell "clicked the margin" from "the resolver is wrong".\n+|		UE_LOG(LogHasard, Warning, TEXT("Felt: (%.1f, %.1f) is not a bet position"),\n+|			Local.X, Local.Y);\n+|		return;\n+|	}\n+|\n+|	const FHasardBetPosition* Position = TableLayout-&gt;GetPositionById(PositionId);\n+|	if (!Position)\n+|	{\n+|		UE_LOG(LogHasard, Error, TEXT("Felt: resolved id %d has no position"), PositionId);\n+|		return;\n+|	}\n+|\n+|	UE_LOG(LogHasard, Warning, TEXT("Felt: (%.1f, %.1f) -&gt; id %d, %s"),\n+|		Local.X, Local.Y, PositionId, *Position-&gt;DisplayName.ToString());\n+|\n+|	if (!Betting-&gt;PlaceBet(PositionId, StakePerClick))\n+|	{\n+|		// Refused, so no stake was taken. Nothing may be drawn as though one was.\n+|		return;\n+|	}\n+|\n+|	// Where the chip actually went, not where the player clicked. If these two are ever\n+|	// far apart the resolver picked a neighbor, and seeing it is how you notice.\n+|	if (const UWorld* World = GetWorld())\n+|	{\n+|		DrawDebugSphere(World, FeltLocalToWorld(Position-&gt;ChipLocation),\n+|			2.0f, 8, FColor::Yellow, false, 4.0f);\n+|	}\n+|}\n+|\n+|void AHasardFelt::DrawFelt()\n+|{\n+|	if (!TableLayout)\n+|	{\n+|		UE_LOG(LogHasard, Error, TEXT("Felt: no table layout on BP_Felt"));\n+|		return;\n+|	}\n+|\n+|	DrawDebugLayout();\n+|}\n+|\n+|void AHasardFelt::DrawDebugLayout() const\n+|{\n+|	const UWorld* World = GetWorld();\n+|	if (!World || !TableLayout)\n+|	{\n+|		return;\n+|	}\n+|\n+|	FlushPersistentDebugLines(World);\n+|\n+|	FVector2D Min, Max;\n+|	TableLayout-&gt;GetFeltBounds(Min, Max);\n+|\n+|	const int32 Columns = TableLayout-&gt;GetNumberColumns();\n+|	const int32 Rows = TableLayout-&gt;GetNumberRows();\n+|\n+|	// Outline of the whole felt, including the zero box and both outside bands.\n+|	const FVector2D Corners[4] = {\n+|		FVector2D(Min.X, Min.Y), FVector2D(Max.X, Min.Y),\n+|		FVector2D(Max.X, Max.Y), FVector2D(Min.X, Max.Y) };\n+|\n+|	for (int32 Index = 0; Index &lt; 4; ++Index)\n+|	{\n+|		DrawDebugLine(World, FeltLocalToWorld(Corners[Index]),\n+|			FeltLocalToWorld(Corners[(Index + 1) % 4]),\n+|			FColor::White, true, -1.0f, 0, 0.6f);\n+|	}\n+|\n+|	// Cell boundaries, drawn from the layout\'s own origin and cell size. The grid and the\n+|	// resolver therefore read the same two numbers - a grid drawn from a second copy of\n+|	// the arithmetic would look correct and still send clicks to the wrong cell.\n+|	const FVector2D Origin = TableLayout-&gt;GetGridOrigin();\n+|	const FVector2D Cell = TableLayout-&gt;GetCellSize();\n+|	const float GridFarX = Origin.X + Columns * Cell.X;\n+|	const float GridFarY = Origin.Y + Rows * Cell.Y;\n+|\n+|	for (int32 Column = 0; Column &lt;= Columns; ++Column)\n+|	{\n+|		const float LineX = Origin.X + Column * Cell.X;\n+|		DrawDebugLine(World, FeltLocalToWorld(FVector2D(LineX, Origin.Y)),\n+|			FeltLocalToWorld(FVector2D(LineX, GridFarY)),\n+|			FColor(90, 90, 90), true, -1.0f, 0, 0.3f);\n+|	}\n+|\n+|	for (int32 Row = 0; Row &lt;= Rows; ++Row)\n+|	{\n+|		const float LineY = Origin.Y + Row * Cell.Y;\n+|		DrawDebugLine(World, FeltLocalToWorld(FVector2D(Origin.X, LineY)),\n+|			FeltLocalToWorld(FVector2D(GridFarX, LineY)),\n+|			FColor(90, 90, 90), true, -1.0f, 0, 0.3f);\n+|	}\n+|\n+|	// The zero box, which is the one cell that is not part of the grid.\n+|	DrawDebugLine(World, FeltLocalToWorld(FVector2D(Min.X, Origin.Y)),\n+|		FeltLocalToWorld(FVector2D(Min.X, GridFarY)), FColor(90, 90, 90), true, -1.0f, 0, 0.3f);\n+|	DrawDebugLine(World, FeltLocalToWorld(FVector2D(Min.X, GridFarY)),\n+|		FeltLocalToWorld(FVector2D(Origin.X, GridFarY)), FColor(90, 90, 90), true, -1.0f, 0, 0.3f);\n+|	DrawDebugLine(World, FeltLocalToWorld(FVector2D(Min.X, Origin.Y)),\n+|		FeltLocalToWorld(FVector2D(Origin.X, Origin.Y)), FColor(90, 90, 90), true, -1.0f, 0, 0.3f);\n+|\n+|	// Every chip location. Color carries the type only as a hint; the log is the record.\n+|	for (const FHasardBetPosition&amp; Position : TableLayout-&gt;GetPositions())\n+|	{\n+|		const bool bInside = Position.CoveredNumbers.Num() &lt;= 6;\n+|		DrawDebugPoint(World, FeltLocalToWorld(Position.ChipLocation), 6.0f,\n+|			bInside ? FColor::Cyan : FColor::Orange, true, -1.0f);\n+|	}\n+|\n+|	UE_LOG(LogHasard, Warning, TEXT("Felt: drew %d chip locations, felt is %.0f x %.0f cm"),\n+|		TableLayout-&gt;GetPositions().Num(), Max.X - Min.X, Max.Y - Min.Y);\n+|}\n</code></pre><p><b>10.</b> <code>HasardBettingComponent.h</code>:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"\n#include "Components/ActorComponent.h"\n#include "HasardTypes.h"\n#include "HasardBettingComponent.generated.h"\n\nclass UHasardPayoutTable;\nclass UHasardTableLayout;\n\nUCLASS(ClassGroup=(Hasard), meta=(BlueprintSpawnableComponent))\nclass HASARD_API UHasardBettingComponent : public UActorComponent\n{\n	GENERATED_BODY()\n\npublic:\n	UHasardBettingComponent();\n\n-|	/** Records a bet. Returns false if the stake is not positive, or the type unsettleable. */\n+|	/**\n+|	 * Records a bet on one generated position. Returns false if the stake is not\n+|	 * positive, the id is INDEX_NONE, or the bankroll cannot cover it. It cannot\n+|	 * check that the id exists - it holds no layout - so callers pass what\n+|	 * ResolvePosition gave them and nothing else.\n+|	 *\n+|	 * No bet type and no numbers: the position owns those. That is what makes an\n+|	 * unsettleable bet impossible to express rather than merely discouraged.\n+|	 */\n	UFUNCTION(BlueprintCallable, Category = "Hasard|Betting")\n~|	bool PlaceBet(int32 PositionId, int32 Stake);\n\n	/** Drops every active bet. Called between rounds. */\n	U ryNumber cannot say which trio a\n+| * neither of those is checked by the compiler. This assert is what turns adding an\n-| * are red is a fact about the physical wheel, so it is a table, not arithmetic.\n+| * enumerator into a build failure rather than a bet that quietly never pays.\n-| * chip on 0/1/2 means as against one on 0/2/3. Neither is settleable from this\n+| *\n-| * struct, so neither may be accepted. Module 2 replaces PrimaryNumber with a\n+| * It fires on an insertion anywhere before High, which is how Trio and Basket arrived.\n-| * position id and both become ordinary.\n+| * It does not fire on an append after High, so keep High last.\n-| */\n-|static bool IsSettleableBetType(EHasardBetType BetType)\n-|{\n-|	static const TSet&lt;int32&gt; RedPockets = {\n-|	return BetType != EHasardBetType::Trio &amp;&amp; BetType != EHasardBetType::Basket;\n-|		1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36 };\n-|	return RedPockets.Contains(Pocket);\n-|}\n-|\n-|/**\n-| * Inserting an enumerator into EHasardBetType without adding a case below produces\n-| * a bet that takes the stake and can never win, and nothing reports it - no compiler\n-| * warning, no log line, no failed test. This assert is what turns that into a build\n-| * failure. It catches an insertion anywhere before High, which is how Trio and Basket\n-| * arrived; it does not catch an append after High, so keep High last.\n */\nstatic_assert(static_cast&lt;uint8&gt;(EHasardBetType::High) == 14,\n~|	"EHasardBetType changed. Add a rule to DA_EuropeanPayouts, add a block to "\n~|	"UHasardTableLayout::BuildPositions, then update this count.");\n-|\n-|/**\n-| * Does this bet cover the winning pocket?\n-| *\n-| * PrimaryNumber is the lowest number of the group, and the groups follow the felt\'s\n-| * three-column layout: a street is P, P+1, P+2 along a row; a corner is P, P+1, P+3,\n-| * P+4; a six line is P through P+5. Splits are the horizontal kind only, because\n-| * FHasardBet carries a single number and a vertical split cannot be expressed in one.\n-| *\n-| * Zero is deliberately excluded from every outside bet. That one pocket is the entire\n-| * house edge, and writing it as a special case is more honest than hiding it in a range.\n-| *\n-| * Layout is a reference, not a pointer: SettleRound has already refused the round if\n-| * the asset is missing, so there is nothing to check for here.\n-| */\n-|static bool BetCoversPocket(const FHasardBet&amp; Bet, int32 Pocket,\n-|	const UHasardTableLayout&amp; Layout)\n-|{\n-|	const int32 P = Bet.PrimaryNumber;\n-|\n-|	switch (Bet.BetType)\n-|	{\n-|	case EHasardBetType::StraightUp: return Pocket == P;\n-|	case EHasardBetType::Split:      return Pocket == P || Pocket == P + 1;\n-|	case EHasardBetType::Street:     return Pocket &gt;= P &amp;&amp; Pocket &lt;= P + 2;\n-|	case EHasardBetType::Corner:     return Pocket == P || Pocket == P + 1\n-|		                                 || Pocket == P + 3 || Pocket == P + 4;\n-|	case EHasardBetType::SixLine:    return Pocket &gt;= P &amp;&amp; Pocket &lt;= P + 5;\n-|	case EHasardBetType::Column:     return Pocket != 0 &amp;&amp; (Pocket % 3) == (P % 3);\n-|	case EHasardBetType::Dozen:      return Pocket &gt;= P &amp;&amp; Pocket &lt;= P + 11;\n-|	case EHasardBetType::Red:        return Pocket != 0 &amp;&amp; Layout.IsRedNumber(Pocket);\n-|	case EHasardBetType::Black:      return Pocket != 0 &amp;&amp; !Layout.IsRedNumber(Pocket);\n-|	case EHasardBetType::Even:       return Pocket != 0 &amp;&amp; (Pocket % 2) == 0;\n-|	case EHasardBetType::Odd:        return Pocket != 0 &amp;&amp; (Pocket % 2) == 1;\n-|	case EHasardBetType::Low:        return Pocket &gt;= 1 &amp;&amp; Pocket &lt;= 18;\n-|	case EHasardBetType::High:       return Pocket &gt;= 19 &amp;&amp; Pocket &lt;= 36;\n-|\n-|	case EHasardBetType::Trio:\n-|	case EHasardBetType::Basket:\n-|		// PlaceBet refuses these, so arriving here means one got in another way.\n-|		// Say so rather than returning a quiet no.\n-|		UE_LOG(LogHasard, Error, TEXT("BetCoversPocket: %s cannot be settled from PrimaryNumber"),\n-|			*UEnum::GetValueAsString(Bet.BetType));\n-|		return false;\n-|	}\n-|\n-|	// Unreachable while the assert above holds. Kept because the compiler requires a\n-|	// return, and it is the line a missing case would fall through to.\n-|	return false;\n-|}\n\nUHasardBettingComponent::UHasardBettingComponent()\n{\n	PrimaryComponentTick.bCanEverTick = false;\n}\n\n~|bool UHasardBettingComponent::PlaceBet(int32 PositionId, int32 Stake)\n{\n~|	if (Stake &lt;= 0 || PositionId == INDEX_NONE)\n	{\n-|		return false;\n-|	}\n-|\n-|	// Refuse before the money moves. A stake taken for a bet that cannot win is the\n-|	// worst failure this component has, and it is the one that reports nothing.\n-|	if (!IsSettleableBetType(BetType))\n-|	{\n-|		UE_LOG(LogHasard, Error,\n-|			TEXT("PlaceBet refused: %s needs a bet position, which arrives in module 2"),\n-|			*UEnum::GetValueAsString(BetType));\n		return false;\n	}\n\n	UHasardBankrollComponent* Bank = FindBankroll(this);\n\n	// Take the money FIRST. A bet that was never paid for must never enter the array.\n	if (!Bank || !Bank-&gt;TryStake(Stake))\n	{\n		UE_LOG(LogHasard, Warning, TEXT("PlaceBet refused: stake of %d not available"), Stake);\n		return false;\n	}\n\n	// Named fields, not FHasardBet{ ... } - the Module 9 warning still applies.\n	FHasardBet Bet;\n~|	Bet.PositionId = PositionId;\n-|	Bet.PrimaryNumber = PrimaryNumber;\n~|	Bet.Stake      = Stake;\n\n	ActiveBets.Add(Bet);\n\n	UE_LOG(LogHasard, Warning, TEXT("Bets: %d, total staked: %d"),\n		ActiveBets.Num(), GetTotalStaked());\n\n	return true;\n-|}\n-|\n-|void UHasardBettingComponent::ClearAllBets() \n-|{\n-|	ActiveBets.Empty();\n-|	UE_LOG(LogHasard, Warning, TEXT("ClearAllBets"));\n}\n\nvoid UHasardBettingComponent::SettleRound(int32 WinningPocket,\n	const UHasardPayoutTable* PayoutTable, const UHasardTableLayout* TableLayout)\n{\n	const int32 Placed = ActiveBets.Num();\n	int32 Won = 0;\n	int32 Returned = 0;\n\n	if (!PayoutTable)\n	{\n		// Refuse to guess. Paying from a literal is the thing this module removes.\n		UE_LOG(LogHasard, Error, TEXT("SettleRound: no payout table, paying nobody"));\n		ActiveBets.Empty();\n		return;\n	}\n\n	if (!TableLayout)\n	{\n~|		// Without the layout a stored id means nothing, so no bet can be evaluated.\n-|		// would settle as black - silently, and only on half the spins.\n		UE_LOG(LogHasard, Error, TEXT("SettleRound: no table layout, paying nobody"));\n		ActiveBets.Empty();\n		return;\n	}\n\n	UHasardBankrollComponent* Bank = FindBankroll(this);\n\n	if (!Bank)\n	{\n		// The same refusal as the missing table. A summary line reporting money\n		// returned when nothing was credited is worse than no summary at all.\n		UE_LOG(LogHasard, Error, TEXT("SettleRound: no bankroll, paying nobody"));\n		ActiveBets.Empty();\n		return;\n	}\n\n	for (const FHasardBet&amp; Bet : ActiveBets)\n	{\n-|		if (!BetCoversPocket(Bet, WinningPocket, *TableLayout))\n+|		const FHasardBetPosition* Position = TableLayout-&gt;GetPositionById(Bet.PositionId);\n+|		if (!Position)\n+|		{\n+|			// A stored id with no position means the layout changed under a live bet.\n+|			UE_LOG(LogHasard, Error, TEXT("SettleRound: bet on id %d, which is not a position"),\n+|				Bet.PositionId);\n+|			continue;\n+|		}\n+|\n+|		// The whole of what used to be a thirteen-case switch. A position knows the\n+|		// numbers it covers, so zero needs no special case and no bet type does either.\n+|		if (!Position-&gt;CoveredNumbers.Contains(WinningPocket))\n		{\n			continue;\n		}\n\n~|		const FHasardPayoutRule* Rule = PayoutTable-&gt;FindRule(Position-&gt;BetType);\n		if (!Rule)\n		{\n			UE_LOG(LogHasard, Error, TEXT("SettleRound: no rule for %s, bet not paid"),\n~|				*UEnum::GetValueAsString(Position-&gt;BetType));\n			continue;\n		}\n\n		// Stake back plus winnings: TryStake already took the stake when the bet\n		// was placed, so a 35:1 winner returns 36 times it, not 35.\n		const int32 Payout = Bet.Stake * (Rule-&gt;PayoutRatio + 1);\n		Bank-&gt;CreditWinnings(Payout);\n\n		++Won;\n		Returned += Payout;\n	}\n\n	ActiveBets.Empty();\n\n	UE_LOG(LogHasard, Warning, TEXT("SettleRound on %d: %d placed, %d won, %d returned"),\n		WinningPocket, Placed, Won, Returned);\n}\n\nvoid UHasardBettingComponent::ClearAllBets()\n{\n	ActiveBets.Empty();\n	UE_LOG(LogHasard, Warning, TEXT("ClearAllBets"));\n}\n\nint32 UHasardBettingComponent::GetTotalStaked() const\n{\n	int32 Total = 0;\n	for (const FHasardBet&amp; Bet : ActiveBets)\n	{\n		Total += Bet.Stake;\n	}\n	return Total;\n}\n</code></pre><p><b>12.</b> <code>HasardPlayerPawn.cpp</code> &mdash; <code>PlaceBet</code> only, the rest of the file is unchanged:</p><pre><code>void AHasardPlayerPawn::PlaceBet()\n{\n	if (!InteractionComp)\n	{\n		return;\n	}\n\n-|	AActor* Hit = InteractionComp-&gt;TraceForInteractable();\n+|	FHitResult Hit;\n~|	if (!InteractionComp-&gt;TraceForInteractable(Hit))\n	{\n-|		IHasardInteractable::Execute_OnPlayerInteract(Hit, this);\n+|		return;\n+|	}\n+|\n+|	AActor* HitActor = Hit.GetActor();\n+|	if (HitActor &amp;&amp; HitActor-&gt;Implements&lt;UHasardInteractable&gt;())\n+|	{\n+|		// ImpactPoint, not the actor location: on the felt the point is the bet.\n+|		IHasardInteractable::Execute_OnPlayerInteract(HitActor, this, Hit.ImpactPoint);\n	}\n}\n</code></pre><p><b>13.</b> <b>Delete <code>HasardBetSpot.h</code> and <code>HasardBetSpot.cpp</code>.</b> Right-click each in the Solution Explorer &rarr; <b>Delete</b>, and confirm they are gone from disk rather than just excluded from the project. Nothing else in the module references them &mdash; the felt is the only interactable now.</p> <p><b>Phase 3 &mdash; build.</b></p> <p><b>14.</b> <code>Ctrl+Shift+B</code> with the editor closed. Expect <code>Build: 1 succeeded, 0 failed</code>. Reopen the editor. It will complain that <code>BP_BetSpot</code> has no parent class; that is expected and step 17 clears it.</p> <p><b>Phase 4 &mdash; put the felt in the level.</b></p> <p><b>15.</b> Content Browser &rarr; <code>Content/Blueprints</code> &rarr; right-click &rarr; <b>Blueprint Class</b> &rarr; expand <b>All Classes</b> &rarr; <code>HasardFelt</code>. Name it <code>BP_Felt</code>.</p> <p><b>16.</b> Open <code>BP_Felt</code> &rarr; Class Defaults. Set <b>Table Layout</b> to <code>DA_HasardTableLayout</code> &mdash; <b>the same asset the GameMode holds</b>. Leave <b>Stake Per Click</b> at 5 and <b>Draw Debug Layout</b> ticked. Compile, Save.</p> <p><b>17.</b> Open <code>L_RouletteTest</code>. <b>Delete all four <code>BP_BetSpot</code> actors</b>, then delete the <code>BP_BetSpot</code> Blueprint asset itself. Drag <code>BP_Felt</code> into the level in front of the Player Start, flat on the table surface.</p> <p>With the default asset the felt measures <b>336 by 120 centimeters</b>: 12 columns of 24cm, plus a 24cm zero box at negative X and a 24cm column band at the far end, plus two 24cm bands below for the dozens and the even-money bets. Its local origin is the near corner of cell <b>(0,0)</b>, not the middle of the felt, so the actor gizmo sits at the corner of the number grid.</p> <p><b>Phase 5 &mdash; verify the geometry before trusting a click.</b></p> <p><b>18.</b> Press Play. The log should read <code>Felt: 157 positions, stake 5 per click</code> and then <code>Felt: drew 157 chip locations, felt is 336 x 120 cm</code>.</p> <p><b>19.</b> <b>Look at the drawing before you click anything.</b> You should see one white outline, the grid lines inside it, and 157 points. Cyan points are the inside bets, orange the outside ones. Check three things: every cyan point sits either in the middle of a cell, exactly on a line, or exactly on a corner &mdash; never slightly off one; the orange points sit in the bands, not on the numbers; and the three column boxes are past the far end, not on top of the grid.</p> <p><b>A point that is nearly on a line is the failure to look for.</b> It means a <code>ChipLocation</code> is computed from a different sum than the grid line beside it, and every click near it will resolve to the wrong bet. The audit in module 2 could not have caught this: it checks covered numbers and payouts, never coordinates.</p> <p><b>Phase 6 &mdash; click it.</b></p> <p><b>20.</b> Aim at the <b>middle</b> of the cell for 17 and click. Expect <code>Felt: (66.0, 18.0) -&gt; id 17, 17</code> and a yellow sphere where the chip landed. Compare that coordinate with module 1 step 13 &mdash; it is the same point, arrived at from the opposite direction.</p> <p><b>21.</b> Aim at the <b>line between</b> 17 and 20 and click. The readout should name a split, and the yellow sphere should sit on the line rather than in either box.</p> <p><b>22.</b> Aim at a <b>corner</b> where four numbers meet. Four numbers in the name, and the sphere on the corner.</p> <p><b>23.</b> <b>The one that would have been wrong.</b> Aim at the line between the zero box and column one, level with the boundary between the 1 and the 2, and click. Expect <code>Trio 0/1/2</code>. The obvious implementation &mdash; treat anything left of the grid as the zero box &mdash; gives you a straight up on 1 instead: right money, wrong bet, no error. Five different bets share that one line.</p> <p><b>24.</b> Aim at the felt <b>margin</b>, inside the white outline but in no band, and click. Expect <code>Felt: (x, y) is not a bet position</code> and <b>no change to the balance</b>. Watch the balance, not the log.</p> <p><b>25.</b> Aim <b>off the felt entirely</b> and click. Nothing at all: the trace misses, so no interaction happens.</p> <p><b>Phase 7 &mdash; settle a trio.</b></p> <p><b>26.</b> Back a trio, then spin until zero, 1 or 2 comes up. <b>It pays 11:1.</b> That bet was refused two modules ago and could not be expressed one module ago. Nothing in the settlement code knows it is special.</p> <p><b>27.</b> Run <code>HasardAuditLayout</code> once more. Still 157, still zero failures &mdash; the data did not change, only what can be done with it.</p> <p><b>28.</b> Commit.</p><pre><code>git add -A\ngit commit -m "Add the felt; a bet is a position id" -m "One actor for 157 positions, because 83 of them are lines and corners with no area to own a collision volume. FHasardBet drops BetType and PrimaryNumber for a PositionId, which deletes BetCoversPocket outright and makes an unsettleable bet impossible to express."</code></pre>'},
],
quiz:[
{q:'Why can the felt not be one actor per bet position?',
 opts:['157 actors is too slow','83 of the positions are lines and corners, which have no area to own a collision volume','Unreal caps actors per level','Blueprint cannot handle it'],
 c:1,why:'A split is the border between two cells. There is nothing there to give a collision box to.'},
{q:'<code>FHasardBet</code> no longer stores <code>BetType</code>. Why not?',
 opts:['To save memory','The position owns it, and a second copy could disagree with the table','BetType is deprecated','Blueprint cannot read enums'],
 c:1,why:'A bet claiming Corner while its position covers three numbers is one assignment away, and it would pay wrongly with no error.'},
{q:'Six positions sit at exactly <code>x = GridOrigin.X</code>. Writing <code>if (x &lt; GridOrigin.X) return zero;</code> would:',
 opts:['Crash','Return INDEX_NONE for all six','Refuse the click','Silently resolve all six as grid bets - wrong bet, right money'],
 c:3,why:'The three 0/N splits become straight ups, the trios become splits, the basket becomes street 1/2/3. No error anywhere.'},
{q:'A nearest-<code>ChipLocation</code> resolver resolves all 157 correctly. Its real problem is:',
 opts:['Too slow at 157 entries','It ignores LineTolerance, making a clamped, tooltipped designer property do nothing','It cannot handle zero','It needs a world'],
 c:1,why:'Nearest neighbor fixes the boundary at 0.25 of a cell. The asset documents 0.35 and offers a range from 0.05 to 0.45.'},
{q:'Why must the far edge of the grid be tested before the corner case?',

{q:'<code>CachedPositions</code> is deliberately not a <code>UPROPERTY</code> because:',

{q:'The debug overlay can catch a bug that module 2&rsquo;s audit cannot. Which?',

]
