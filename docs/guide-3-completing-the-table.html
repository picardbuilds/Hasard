a = (AllowPrivateAccess = "true"))\n-|	FVector2D ReadoutLocation = FVector2D(144.0f, -62.0f);\n-|\n-|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Preview",\n-|		meta = (AllowPrivateAccess = "true", ClampMin = "0.5"))\n-|	float ReadoutTextSize = 7.0f;\n-|\n-|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Preview",\n-|		meta = (AllowPrivateAccess = "true"))\n-|	FColor ReadoutColor = FColor(250, 240, 200);\n-|\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Labels",\n		meta = (AllowPrivateAccess = "true"))\n	bool bShowLabels = true;\n\n	/** Cap height in centimeters. A 24 cm cell takes about 8 before it crowds the lines. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Labels",\n		meta = (AllowPrivateAccess = "true", ClampMin = "0.5"))\n	float LabelTextSize = 8.0f;\n\n	/** Lifts the text off the felt so it does not z-fight with the surface. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Labels",\n		meta = (AllowPrivateAccess = "true", ClampMin = "0.0"))\n	float LabelZOffset = 0.2f;\n\n	/**\n	 * Lays the text flat and decides which side of the table it reads from.\n	 * If the numbers come out mirrored, add 180 to Yaw - that is the only axis at issue.\n	 */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Labels",\n		meta = (AllowPrivateAccess = "true"))\n	FRotator LabelRotation = FRotator(90.0f, 180.0f, 0.0f);\n\n	/**\n	 * The rotation for labels that read from the end of the table rather than the side.\n	 *\n	 * Only the three "2 to 1" boxes use it, because only they sit at the end of the\n	 * grid. A separate property rather than LabelRotation with 90 added to Yaw: the\n	 * working values for the main rotation are still being found by eye, and deriving\n	 * one from the other would make every correction move both groups at once.\n	 */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Labels",\n		meta = (AllowPrivateAccess = "true"))\n-|	FRotator LabelRotationTurned = FRotator(90.0f, 90.0f, 0.0f);\n+|	FRotator LabelRotationTurned = FRotator(90.0f, 270.0f, 0.0f);\n\n	/**\n	 * One ink for every numeral and every word on the felt.\n	 *\n	 * A real layout prints white on the colored box, so the box carries the red/black\n	 * distinction and the text does not repeat it. Colored numerals plus colored boxes\n	 * would be two sources for one fact, and the day they disagree the felt is lying\n	 * about which pocket a cell belongs to.\n	 */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Labels",\n		meta = (AllowPrivateAccess = "true"))\n	FColor NumeralColor = FColor(245, 245, 240);\n\n	/** Whether to print the cloth, lines and boxes at all. Off leaves the debug view. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Surface",\n		meta = (AllowPrivateAccess = "true"))\n	bool bShowSurface = true;\n\n	/** The unit quad every box is an instance of. /Engine/BasicShapes/Plane is 100 cm square. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Surface",\n		meta = (AllowPrivateAccess = "true"))\n	TObjectPtr&lt;UStaticMesh&gt; BoxMesh;\n\n	/**\n	 * The material every printed surface uses, with one vector parameter for its color.\n	 *\n	 * The same asset five times over with five dynamic instances, rather than five\n	 * authored materials: the colors below are the tunable thing, and an artist changing\n	 * a felt green should not have to open a material graph to do it.\n	 */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Surface",\n		meta = (AllowPrivateAccess = "true"))\n	TObjectPtr&lt;UMaterialInterface&gt; SurfaceMaterial;\n\n	/** The vector parameter each color is written into. Matches AHasardChip\'s default. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Surface",\n		meta = (AllowPrivateAccess = "true"))\n	FName ColorParameterName = TEXT("Color");\n\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Surface",\n		meta = (AllowPrivateAccess = "true"))\n	FColor ClothColor = FColor(12, 82, 48);\n\n	/** The printed lines. Not pure white: cloth takes ink slightly off, and it reads better. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Surface",\n		meta = (AllowPrivateAccess = "true"))\n	FColor LineColor = FColor(235, 235, 228);\n\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Surface",\n		meta = (AllowPrivateAccess = "true"))\n	FColor RedBoxColor = FColor(178, 26, 30);\n\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Surface",\n		meta = (AllowPrivateAccess = "true"))\n	FColor BlackBoxColor = FColor(22, 22, 24);\n\n	/**\n	 * Zero gets its own color because zero is the entire house edge. It is not one of\n	 * the blacks and must never be printed as though it were.\n	 *\n	 * This rule moved from the numeral to the box and did not soften on the way. A green\n	 * zero is the one visual cue that the wheel is not an even bet, and CLAUDE.md\'s\n	 * anti-patterns forbid removing it as surely as they forbid misstating the odds.\n	 */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Surface",\n		meta = (AllowPrivateAccess = "true"))\n	FColor ZeroBoxColor = FColor(20, 130, 60);\n\n	/** Dozens, columns and the even-money boxes. Cloth-colored on a real table. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Surface",\n		meta = (AllowPrivateAccess = "true"))\n	FColor OutsideBoxColor = FColor(14, 92, 54);\n\n	/**\n	 * How far each colored box is inset from its white plate, in centimeters.\n	 *\n	 * This is the line width, and it is a width rather than a line because the lines are\n	 * not drawn: they are the plate showing through. Between two neighboring boxes the\n	 * player sees twice this, which is why 0.6 reads as a normal printed rule on a 24 cm\n	 * cell rather than as a gap.\n	 */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Surface",\n		meta = (AllowPrivateAccess = "true", ClampMin = "0.0"))\n	float BorderWidth = 0.6f;\n\n	/** How far the cloth extends past the printed area on every side. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Surface",\n		meta = (AllowPrivateAccess = "true", ClampMin = "0.0"))\n	float ClothMargin = 14.0f;\n\n	/**\n	 * Gap between the cloth, the plate and the color, in centimeters.\n	 *\n	 * Three coplanar quads z-fight, and the artifact is view-dependent flicker rather\n	 * than a static error - the sort of thing that looks fine on the machine it was built\n	 * on. LabelZOffset must stay larger than twice this, or the numerals sink into the box.\n	 */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Surface",\n		meta = (AllowPrivateAccess = "true", ClampMin = "0.001"))\n	float SurfaceZStep = 0.03f;\n};</code></pre><p><b>5.</b> <code>HasardFelt.cpp</code>. <code>BuildSurface</code> and its three helpers; <code>LabelColorFor</code> is gone:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#include "HasardFelt.h"\n#include "HasardBettingComponent.h"\n#include "HasardChip.h"\n-|#include "HasardPayoutTable.h"\n#include "HasardTableLayout.h"\n#include "HasardTypes.h"\n#include "Components/BoxComponent.h"\n#include "Components/InstancedStaticMeshComponent.h"\n#include "Components/SceneComponent.h"\n#include "Components/StaticMeshComponent.h"\n#include "Components/TextRenderComponent.h"\n#include "DrawDebugHelpers.h"\n#include "Engine/StaticMesh.h"\n#include "Engine/World.h"\n#include "GameFramework/Pawn.h"\n#include "Materials/MaterialInstanceDynamic.h"\n#include "Materials/MaterialInterface.h"\n\n/**\n * Which bets get their name printed on the felt.\n *\n * The line bets do not, and that is not an omission: a split has no box of its own, so\n * "17/18" would have to be printed on the line between two numbers. A real layout leaves\n * those unlabeled too - the preview names them instead.\n *\n * No default case, deliberately. Adding an enumerator without deciding whether it is\n * named on the felt then fails the build rather than shipping a bet nobody can read.\n */\nstatic bool IsNamedOnFelt(EHasardBetType BetType)\n{\n	switch (BetType)\n	{\n	case EHasardBetType::StraightUp:\n	case EHasardBetType::Dozen:\n	case EHasardBetType::Column:\n	case EHasardBetType::Red:\n	case EHasardBetType::Black:\n	case EHasardBetType::Even:\n	case EHasardBetType::Odd:\n	case EHasardBetType::Low:\n	case EHasardBetType::High:\n		return true;\n\n	case EHasardBetType::Split:\n	case EHasardBetType::Street:\n	case EHasardBetType::Trio:\n	case EHasardBetType::Corner:\n	case EHasardBetType::Basket:\n	case EHasardBetType::SixLine:\n		return false;\n	}\n	// Unreachable while every enumerator is listed above. Kept because the compiler\n	// requires a return, and it is the line a missing case would fall through to.\n	return false;\n}\n\n/**\n * The zero pocket\'s own straight up.\n *\n * Asked of the covered numbers rather than the position id, because the id is an index\n * into a generated array and "zero happens to be built first" is not a fact worth\n * depending on. What makes this position zero is that it covers pocket zero and nothing\n * else, which stays true however BuildPositions is reordered.\n */\nstatic bool IsZeroPosition(const FHasardBetPosition&amp; Position)\n{\n	return Position.BetType == EHasardBetType::StraightUp\n		&amp;&amp; Position.CoveredNumbers.Num() == 1\n		&amp;&amp; Position.CoveredNumbers[0] == 0;\n}\n\nAHasardFelt::AHasardFelt()\n{\n	PrimaryActorTick.bCanEverTick = false;\n\n	Root = CreateDefaultSubobject&lt;USceneComponent&gt;(TEXT("Root"));\n	SetRootComponent(Root);\n\n	Surface = CreateDefaultSubobject&lt;UBoxComponent&gt;(TEXT("Surface"));\n	Surface-&gt;SetupAttachment(Root);\n\n	// Visibility is the channel the interaction trace sweeps on.\n	Surface-&gt;SetCollisionEnabled(ECollisionEnabled::QueryOnly);\n	Surface-&gt;SetCollisionResponseToAllChannels(ECR_Ignore);\n	Surface-&gt;SetCollisionResponseToChannel(ECC_Visibility, ECR_Block);\n\n	Cloth = CreateDefaultSubobject&lt;UStaticMeshComponent&gt;(TEXT("Cloth"));\n	Cloth-&gt;SetupAttachment(Root);\n\n	Lines = CreateDefaultSubobject&lt;UInstancedStaticMeshComponent&gt;(TEXT("Lines"));\n	Lines-&gt;SetupAttachment(Root);\n\n	RedBoxes = CreateDefaultSubobject&lt;UInstancedStaticMeshComponent&gt;(TEXT("RedBoxes"));\n	RedBoxes-&gt;SetupAttachment(Root);\n\n	BlackBoxes = CreateDefaultSubobject&lt;UInstancedStaticMeshComponent&gt;(TEXT("BlackBoxes"));\n	BlackBoxes-&gt;SetupAttachment(Root);\n\n	GreenBoxes = CreateDefaultSubobject&lt;UInstancedStaticMeshComponent&gt;(TEXT("GreenBoxes"));\n	GreenBoxes-&gt;SetupAttachment(Root);\n\n	ZeroBox = CreateDefaultSubobject&lt;UStaticMeshComponent&gt;(TEXT("ZeroBox"));\n	ZeroBox-&gt;SetupAttachment(Root);\n\n~|	// Every printed surface is scenery, and Surface above is the only thing the trace may\n~|	// hit. A quad that blocked Visibility would be found instead of the box underneath it,\n~|	// and every click on the felt would resolve against the wrong actor - the same failure\n-|	Readout = CreateDefaultSubobject&lt;UTextRenderComponent&gt;(TEXT("Readout"));\n-|	Readout-&gt;SetupAttachment(Root);\n-|	Readout-&gt;SetHorizontalAlignment(EHTA_Center);\n-|	Readout-&gt;SetVerticalAlignment(EVRTA_TextCenter);\n-|	Readout-&gt;SetVisibility(false);\n-|\n-|	// Every printed surface is scenery, and Surface above is the only thing the trace may\n-|	// hit. A quad that blocked Visibility would be found instead of the box underneath it,\n-|	// and every click on the felt would resolve against the wrong actor - the same failure\n	// the chips avoid, arriving from the other direction.\n	UStaticMeshComponent* const Printed[] = {\n		Cloth, ZeroBox, Lines, RedBoxes, BlackBoxes, GreenBoxes };\n\n	for (UStaticMeshComponent* Component : Printed)\n	{\n		Component-&gt;SetCollisionEnabled(ECollisionEnabled::NoCollision);\n		Component-&gt;SetCollisionResponseToAllChannels(ECR_Ignore);\n		Component-&gt;SetCastShadow(false);\n	}\n}\n\nvoid AHasardFelt::OnConstruction(const FTransform&amp; Transform)\n{\n	Super::OnConstruction(Transform);\n\n	// Resized here as well as in BeginPlay, so assigning the asset in the editor\n	// shows the right box immediately rather than after the next Play.\n	SyncBoxToLayout();\n+|\n+|	// And printed here too. BoxMesh and SurfaceMaterial are EditDefaultsOnly, so they do\n+|	// not exist until the Blueprint has written its defaults - which happens after the\n+|	// constructor and before this. Printing from BeginPlay instead left the instanced\n+|	// components registered with no mesh, and a material assigned to them afterwards was\n+|	// stored on the component but never reached the renderer: the felt drew WorldGridMaterial.\n+|	BuildSurface();\n}\n\nvoid AHasardFelt::BeginPlay()\n{\n	Super::BeginPlay();\n\n	if (!TableLayout)\n	{\n		UE_LOG(LogHasard, Error, TEXT("Felt: no table layout on BP_Felt - clicks cannot resolve"));\n		return;\n	}\n\n	SyncBoxToLayout();\n\n	// Surface before labels: both read the same positions, and printing the boxes first\n	// means a numeral is never briefly visible over bare cloth.\n	BuildSurface();\n\n	BuildLabels();\n-|\n-|	if (Readout)\n-|	{\n-|		Readout-&gt;SetRelativeLocation(\n-|			FVector(ReadoutLocation.X, ReadoutLocation.Y, LabelZOffset));\n-|		Readout-&gt;SetRelativeRotation(LabelRotation);\n-|		Readout-&gt;SetWorldSize(ReadoutTextSize);\n-|		Readout-&gt;SetTextRenderColor(ReadoutColor);\n-|	}\n-|\n-|	if (!PayoutTable)\n-|	{\n-|		// Not fatal - the ghost chip still shows where a bet would land. Loud anyway,\n-|		// because a preview that cannot say what a bet pays is the half of this feature\n-|		// that was worth building.\n-|		UE_LOG(LogHasard, Error,\n-|			TEXT("Felt: no payout table on BP_Felt - the readout cannot state a payout"));\n-|	}\n\n	const AHasardChip* Chip = GetChipDefault();\n\n	const int32 Count = TableLayout-&gt;GetPositions().Num();\n	UE_LOG(LogHasard, Warning, TEXT("Felt: %d positions, %d labels, %d per click"),\n		Count, Labels.Num(), Chip ? Chip-&gt;GetChipValue() : 0);\n\n	if (bDrawDebugLayout)\n	{\n		DrawDebugLayout();\n	}\n}\n\nvoid AHasardFelt::EndPlay(const EEndPlayReason::Type EndPlayReason)\n{\n	// Unbind before the component goes. RemoveAll on a weak pointer that has already\n	// gone is a no-op, which is the whole reason it is weak.\n	if (UHasardBettingComponent* Betting = BoundBetting.Get())\n	{\n		Betting-&gt;OnBetsCleared.RemoveAll(this);\n	}\n\n-|	HidePreview();\n	ClearChips();\n\n	Super::EndPlay(EndPlayReason);\n}\n\nvoid AHasardFelt::SyncBoxToLayout()\n{\n	if (!TableLayout || !Surface)\n	{\n		return;\n	}\n\n	FVector2D Min, Max;\n	TableLayout-&gt;GetFeltBounds(Min, Max);\n\n	const FVector2D Size = Max - Min;\n	const FVector2D Center = (Max + Min) * 0.5f;\n\n	// Offset against Root, never against the actor. If Surface were the root component,\n	// setting its relative location would move the actor and shift every coordinate.\n	Surface-&gt;SetBoxExtent(FVector(Size.X * 0.5f, Size.Y * 0.5f, SurfaceThickness * 0.5f));\n	Surface-&gt;SetRelativeLocation(FVector(Center.X, Center.Y, 0.0f));\n}\n\nFVector2D AHasardFelt::WorldToFeltLocal(const FVector&amp; WorldPoint) const\n{\n	// Relative to the actor, not to the box: the box moves with GridOrigin, and the\n	// layout\'s coordinates are measured from the actor\'s own origin.\n	const FVector Local = GetActorTransform().InverseTransformPosition(WorldPoint);\n	return FVector2D(Local.X, Local.Y);\n}\n\nFVector AHasardFelt::FeltLocalToWorld(const FVector2D&amp; LocalPoint) const\n{\n	return GetActorTransform().TransformPosition(FVector(LocalPoint.X, LocalPoint.Y, 0.0f));\n}\n\nvoid AHasardFelt::OnPlayerInteract_Implementation(APawn* InstigatorPawn,\n	const FVector&amp; HitLocation)\n{\n	if (!InstigatorPawn || !TableLayout)\n	{\n		return;\n	}\n\n	UHasardBettingComponent* Betting =\n		InstigatorPawn-&gt;FindComponentByClass&lt;UHasardBettingComponent&gt;();\n	if (!Betting)\n	{\n		UE_LOG(LogHasard, Warning, TEXT("Felt: %s has no betting component"),\n			*GetNameSafe(InstigatorPawn));\n		return;\n	}\n\n	// Bound here rather than in BeginPlay: the component lives on the pawn, and the\n	// pawn is not reliably around when the felt starts. The first bet is the first\n	// moment it certainly is.\n	if (BoundBetting.Get() != Betting)\n	{\n		if (UHasardBettingComponent* Previous = BoundBetting.Get())\n		{\n			Previous-&gt;OnBetsCleared.RemoveAll(this);\n		}\n\n		Betting-&gt;OnBetsCleared.AddUObject(this, &amp;AHasardFelt::HandleBetsCleared);\n		BoundBetting = Betting;\n	}\n\n	const FVector2D Local = WorldToFeltLocal(HitLocation);\n	const int32 PositionId = TableLayout-&gt;ResolvePosition(Local);\n\n	if (PositionId == INDEX_NONE)\n	{\n		// A miss is not an error, but it is not silent either: the coordinate is the\n		// only way to tell "clicked the margin" from "the resolver is wrong".\n		UE_LOG(LogHasard, Warning, TEXT("Felt: (%.1f, %.1f) is not a bet position"),\n			Local.X, Local.Y);\n		return;\n	}\n\n	const FHasardBetPosition* Position = TableLayout-&gt;GetPositionById(PositionId);\n	if (!Position)\n	{\n		UE_LOG(LogHasard, Error, TEXT("Felt: resolved id %d has no position"), PositionId);\n		return;\n	}\n\n	UE_LOG(LogHasard, Warning, TEXT("Felt: (%.1f, %.1f) -&gt; id %d, %s"),\n		Local.X, Local.Y, PositionId, *Position-&gt;DisplayName.ToString());\n\n	const AHasardChip* Chip = GetChipDefault();\n	if (!Chip)\n	{\n		// No chip class means no stake, because the chip is where the stake lives.\n		// Refusing here is the only way to avoid inventing a number.\n		UE_LOG(LogHasard, Error, TEXT("Felt: no chip class on BP_Felt, so a click has no stake"));\n		return;\n	}\n\n	if (!Betting-&gt;PlaceBet(PositionId, Chip-&gt;GetChipValue()))\n	{\n		// Refused, so no stake was taken. Nothing may be drawn as though one was.\n		return;\n	}\n\n	// The debug sphere that used to mark this spot is gone: a real chip lands here now,\n	// and two markers for one event is one of them lying eventually.\n	SpawnChip(*Position);\n}\n\nconst AHasardChip* AHasardFelt::GetChipDefault() const\n{\n	return ChipClass ? ChipClass-&gt;GetDefaultObject&lt;AHasardChip&gt;() : nullptr;\n-|}\n-|\n-|void AHasardFelt::OnPlayerHover_Implementation(APawn* InstigatorPawn,\n-|	const FVector&amp; HitLocation)\n-|{\n-|	if (!TableLayout)\n-|	{\n-|		return;\n-|	}\n-|\n-|	// The same two calls OnPlayerInteract makes, on the same point, one frame earlier.\n-|	// That is the guarantee: the preview and the bet cannot resolve differently because\n-|	// they are the same question asked of the same resolver.\n-|	const FVector2D Local = WorldToFeltLocal(HitLocation);\n-|	const int32 PositionId = TableLayout-&gt;ResolvePosition(Local);\n-|\n-|	const FHasardBetPosition* Position = PositionId != INDEX_NONE\n-|		? TableLayout-&gt;GetPositionById(PositionId) : nullptr;\n-|\n-|	if (!Position)\n-|	{\n-|		// Aiming at the margin is not a bet, so it must not look like one.\n-|		HidePreview();\n-|		return;\n-|	}\n-|\n-|	ShowPreview(*Position);\n-|}\n-|\n-|void AHasardFelt::OnPlayerEndHover_Implementation(APawn* InstigatorPawn)\n-|{\n-|	HidePreview();\n-|}\n-|\n-|void AHasardFelt::ShowPreview(const FHasardBetPosition&amp; Position)\n-|{\n-|	const AHasardChip* Default = GetChipDefault();\n-|	UWorld* World = GetWorld();\n-|\n-|	if (!World || !Default || !PreviewMaterial)\n-|	{\n-|		HidePreview();\n-|		return;\n-|	}\n-|\n-|	if (!PreviewChip)\n-|	{\n-|		FActorSpawnParameters Params;\n-|		Params.Owner = this;\n-|\n-|		PreviewChip = World-&gt;SpawnActor&lt;AHasardChip&gt;(\n-|			ChipClass, FVector::ZeroVector, GetActorRotation(), Params);\n-|\n-|		if (!PreviewChip)\n-|		{\n-|			return;\n-|		}\n-|\n-|		// The material is the only thing separating this from a placed bet, so it is\n-|		// applied before the chip is ever made visible.\n-|		PreviewChip-&gt;SetPreviewMaterial(PreviewMaterial);\n-|	}\n-|\n-|	// On top of the stack that is already there, so the preview shows where this chip\n-|	// would land rather than where the first one did.\n-|	const int32* Count = StackCounts.Find(Position.PositionId);\n-|	const float Height = ((Count ? *Count : 0) + 0.5f) * Default-&gt;GetChipHeight();\n-|\n-|	PreviewChip-&gt;SetActorLocation(\n-|		FeltLocalToWorld(Position.ChipLocation) + GetActorUpVector() * Height);\n-|	PreviewChip-&gt;SetActorHiddenInGame(false);\n-|\n-|	// Rebuilt only when the aim moves to a different position. This runs every frame,\n-|	// and formatting text sixty times a second to produce the same string is waste.\n-|	if (PreviewPositionId != Position.PositionId)\n-|	{\n-|		PreviewPositionId = Position.PositionId;\n-|\n-|		if (Readout)\n-|		{\n-|			Readout-&gt;SetText(ReadoutTextFor(Position, *Default));\n-|			Readout-&gt;SetVisibility(true);\n-|		}\n-|	}\n-|}\n-|\n-|void AHasardFelt::HidePreview()\n-|{\n-|	if (PreviewChip)\n-|	{\n-|		PreviewChip-&gt;SetActorHiddenInGame(true);\n-|	}\n-|\n-|	if (Readout)\n-|	{\n-|		Readout-&gt;SetVisibility(false);\n-|	}\n-|\n-|	PreviewPositionId = INDEX_NONE;\n-|}\n-|\n-|FText AHasardFelt::ReadoutTextFor(const FHasardBetPosition&amp; Position,\n-|	const AHasardChip&amp; Chip) const\n-|{\n-|	const int32 Stake = Chip.GetChipValue();\n-|\n-|	const FHasardPayoutRule* Rule = PayoutTable\n-|		? PayoutTable-&gt;FindRule(Position.BetType) : nullptr;\n-|\n-|	if (!Rule)\n-|	{\n-|		// Say so plainly. A bet with no rule is one settlement will take the stake for\n-|		// and never pay, so the player is owed the warning while they can still not make\n-|		// it - this is the DA_AmericanPayouts gap, made visible instead of silent.\n-|		return FText::Format(\n-|			NSLOCTEXT("Hasard", "ReadoutNoRule", "{0}  -  this table cannot pay this bet"),\n-|			Position.DisplayName);\n-|	}\n-|\n-|	// The same arithmetic SettleRound uses. TryStake already took the stake, so a 35:1\n-|	// winner returns 36 times it.\n-|	const int32 Returns = Stake * (Rule-&gt;PayoutRatio + 1);\n-|\n-|	return FText::Format(\n-|		NSLOCTEXT("Hasard", "ReadoutFmt", "{0}  -  stake {1}, returns {2}   ({3}:1)"),\n-|		Position.DisplayName, FText::AsNumber(Stake),\n-|		FText::AsNumber(Returns), FText::AsNumber(Rule-&gt;PayoutRatio));\n}\n\nvoid AHasardFelt::SpawnChip(const FHasardBetPosition&amp; Position)\n{\n	UWorld* World = GetWorld();\n	const AHasardChip* Default = GetChipDefault();\n\n	if (!World || !Default)\n	{\n		return;\n	}\n\n	int32&amp; Count = StackCounts.FindOrAdd(Position.PositionId);\n\n	// Height from the class default, not from the mesh: the felt asks the chip how tall\n	// a chip is and does not look at how it was built.\n	const float ChipHeight = Default-&gt;GetChipHeight();\n\n	// Half a chip up for the first one, so the disc rests on the felt rather than half\n	// sunk into it. Up vector rather than +Z, so a tilted table still stacks upwards.\n	const FVector Base = FeltLocalToWorld(Position.ChipLocation);\n	const FVector Lift = GetActorUpVector() * ((Count + 0.5f) * ChipHeight);\n\n	FActorSpawnParameters Params;\n	Params.Owner = this;\n\n	if (AHasardChip* Chip = World-&gt;SpawnActor&lt;AHasardChip&gt;(\n		ChipClass, Base + Lift, GetActorRotation(), Params))\n	{\n		Chips.Add(Chip);\n		++Count;\n	}\n}\n\nvoid AHasardFelt::ClearChips()\n{\n	for (const TObjectPtr&lt;AHasardChip&gt;&amp; Chip : Chips)\n	{\n		if (Chip)\n		{\n			Chip-&gt;Destroy();\n		}\n	}\n\n	Chips.Reset();\n\n	// The counts go too. Keeping them would stack the next round\'s first chip on top of\n	// a pile that is no longer there.\n	StackCounts.Reset();\n}\n\nvoid AHasardFelt::HandleBetsCleared()\n{\n	const int32 Removed = Chips.Num();\n	ClearChips();\n\n	UE_LOG(LogHasard, Warning, TEXT("Felt: cleared %d chips"), Removed);\n}\n\nvoid AHasardFelt::DrawFelt()\n{\n	if (!TableLayout)\n	{\n		UE_LOG(LogHasard, Error, TEXT("Felt: no table layout on BP_Felt"));\n		return;\n	}\n\n	DrawDebugLayout();\n}\n\nvoid AHasardFelt::RebuildLabels()\n{\n	if (!TableLayout)\n	{\n		UE_LOG(LogHasard, Error, TEXT("Felt: no table layout on BP_Felt"));\n		return;\n	}\n\n	BuildLabels();\n	UE_LOG(LogHasard, Warning, TEXT("Felt: built %d labels"), Labels.Num());\n}\n\nvoid AHasardFelt::RebuildSurface()\n{\n	if (!TableLayout)\n	{\n		UE_LOG(LogHasard, Error, TEXT("Felt: no table layout on BP_Felt"));\n		return;\n	}\n\n	SyncBoxToLayout();\n	BuildSurface();\n}\n\nvoid AHasardFelt::BuildLabels()\n{\n	// Destroy first, unconditionally. BeginPlay and the button can both land here, and a\n	// pass that only added would print every number twice at the same spot.\n	for (const TObjectPtr&lt;UTextRenderComponent&gt;&amp; Existing : Labels)\n	{\n		if (Existing)\n		{\n			Existing-&gt;DestroyComponent();\n		}\n	}\n	Labels.Reset();\n\n	if (!TableLayout || !Root || !bShowLabels)\n	{\n		return;\n	}\n\n	// One pass over the generated positions, so a label cannot sit anywhere the resolver\n	// disagrees with. There is no second list of numbers and no second set of coordinates.\n	for (const FHasardBetPosition&amp; Position : TableLayout-&gt;GetPositions())\n	{\n		if (!IsNamedOnFelt(Position.BetType))\n		{\n			continue;\n		}\n\n		UTextRenderComponent* Label = NewObject&lt;UTextRenderComponent&gt;(this);\n\n		// Movable before registering, or setting the transform afterwards warns and is\n		// ignored: a component created at runtime defaults to static.\n		Label-&gt;SetMobility(EComponentMobility::Movable);\n		Label-&gt;RegisterComponent();\n		Label-&gt;AttachToComponent(Root, FAttachmentTransformRules::KeepRelativeTransform);\n		Label-&gt;SetRelativeLocation(\n			FVector(Position.ChipLocation.X, Position.ChipLocation.Y, LabelZOffset));\n		Label-&gt;SetRelativeRotation(LabelRotationFor(Position));\n		Label-&gt;SetText(LabelTextFor(Position));\n		Label-&gt;SetWorldSize(LabelTextSize);\n		Label-&gt;SetHorizontalAlignment(EHTA_Center);\n		Label-&gt;SetVerticalAlignment(EVRTA_TextCenter);\n		Label-&gt;SetTextRenderColor(NumeralColor);\n		Labels.Add(Label);\n	}\n}\n\nFTransform AHasardFelt::BoxTransform(const FVector2D&amp; Center, const FVector2D&amp; Size,\n	float Height) const\n{\n	// BoxMesh is a unit quad measured in centimeters, so the scale is the size in\n	// centimeters over the mesh\'s own. Read from the asset rather than assuming 100:\n	// swapping in a differently sized plane should change nothing the player sees.\n	const FVector MeshSize = BoxMesh ? BoxMesh-&gt;GetBounds().BoxExtent * 2.0f : FVector::OneVector;\n	const float MeshX = FMath::IsNearlyZero(MeshSize.X) ? 1.0f : MeshSize.X;\n	const float MeshY = FMath::IsNearlyZero(MeshSize.Y) ? 1.0f : MeshSize.Y;\n\n	return FTransform(\n		FRotator::ZeroRotator,\n		FVector(Center.X, Center.Y, Height),\n		FVector(Size.X / MeshX, Size.Y / MeshY, 1.0f));\n}\n\nUMaterialInstanceDynamic* AHasardFelt::PrepareSurface(UStaticMeshComponent* Component,\n	const FColor&amp; Color) const\n{\n	if (!Component || !BoxMesh || !SurfaceMaterial)\n	{\n		return nullptr;\n	}\n\n	Component-&gt;SetStaticMesh(BoxMesh);\n\n	UMaterialInstanceDynamic* Instance = Component-&gt;CreateDynamicMaterialInstance(0, SurfaceMaterial);\n	if (Instance &amp;&amp; !ColorParameterName.IsNone())\n	{\n		// FromColor, not the FLinearColor constructor: these are authored as sRGB in the\n		// details panel, and treating those bytes as linear washes every one of them out.\n		Instance-&gt;SetVectorParameterValue(ColorParameterName, FLinearColor::FromSRGBColor(Color));\n	}\n\n	return Instance;\n}\n\nvoid AHasardFelt::BuildSurface()\n{\n	// Clear first, unconditionally. BeginPlay and the button can both land here, and a\n	// pass that only added would stack a second felt on the first.\n	Lines-&gt;ClearInstances();\n	RedBoxes-&gt;ClearInstances();\n	BlackBoxes-&gt;ClearInstances();\n	GreenBoxes-&gt;ClearInstances();\n\n	UStaticMeshComponent* const Surfaces[] = {\n		Cloth, ZeroBox, Lines, RedBoxes, BlackBoxes, GreenBoxes };\n\n	for (UStaticMeshComponent* Component : Surfaces)\n	{\n		Component-&gt;SetVisibility(bShowSurface);\n	}\n\n	if (!TableLayout || !bShowSurface)\n	{\n		return;\n	}\n\n	if (!BoxMesh || !SurfaceMaterial)\n	{\n		// Loud, because the alternative is an invisible felt that still takes bets - the\n		// table would look broken while the money kept moving.\n		UE_LOG(LogHasard, Error,\n			TEXT("Felt: BP_Felt needs both Box Mesh and Surface Material to print itself"));\n		return;\n	}\n\n	PrepareSurface(Cloth, ClothColor);\n	PrepareSurface(Lines, LineColor);\n	PrepareSurface(RedBoxes, RedBoxColor);\n	PrepareSurface(BlackBoxes, BlackBoxColor);\n	PrepareSurface(GreenBoxes, OutsideBoxColor);\n	PrepareSurface(ZeroBox, ZeroBoxColor);\n\n	FVector2D Min, Max;\n	TableLayout-&gt;GetFeltBounds(Min, Max);\n\n	const FVector2D ClothSize = (Max - Min) + FVector2D(ClothMargin * 2.0f, ClothMargin * 2.0f);\n	Cloth-&gt;SetRelativeTransform(BoxTransform((Max + Min) * 0.5f, ClothSize, 0.0f));\n\n	int32 Printed = 0;\n\n	for (const FHasardBetPosition&amp; Position : TableLayout-&gt;GetPositions())\n	{\n		// The 83 line bets sit on boundaries and own no area. This is the same test the\n		// layout answered when it generated them, asked once rather than restated here.\n		if (Position.BoxSize.IsNearlyZero())\n		{\n			continue;\n		}\n\n		// Full size on the plate, inset on the color. The difference is the printed line,\n		// so a box smaller than two borders would invert - clamp rather than let it.\n		const FVector2D Inset(\n			FMath::Max(Position.BoxSize.X - BorderWidth * 2.0f, 0.0f),\n			FMath::Max(Position.BoxSize.Y - BorderWidth * 2.0f, 0.0f));\n\n		Lines-&gt;AddInstance(\n			BoxTransform(Position.ChipLocation, Position.BoxSize, SurfaceZStep));\n\n		const FTransform Face =\n			BoxTransform(Position.ChipLocation, Inset, SurfaceZStep * 2.0f);\n\n		if (IsZeroPosition(Position))\n		{\n			ZeroBox-&gt;SetRelativeTransform(Face);\n		}\n		else\n		{\n			BoxesFor(Position, *TableLayout)-&gt;AddInstance(Face);\n		}\n\n		++Printed;\n	}\n\n	UE_LOG(LogHasard, Warning, TEXT("Felt: printed %d boxes - %d red, %d black, %d outside"),\n		Printed, RedBoxes-&gt;GetInstanceCount(), BlackBoxes-&gt;GetInstanceCount(),\n		GreenBoxes-&gt;GetInstanceCount());\n}\n\nUInstancedStaticMeshComponent* AHasardFelt::BoxesFor(const FHasardBetPosition&amp; Position,\n	const UHasardTableLayout&amp; Layout) const\n{\n	// An outside bet covers many pockets of both colors, so it has no color of its own\n	// and takes the cloth\'s. Only a straight up is one pocket, and only one pocket has\n	// a color to state. Zero never reaches here - BuildSurface routes it out first.\n	if (Position.BetType != EHasardBetType::StraightUp)\n	{\n		return GreenBoxes;\n	}\n\n	const int32 Number = Position.CoveredNumbers.Num() == 1\n		? Position.CoveredNumbers[0] : INDEX_NONE;\n\n	return Layout.IsRedNumber(Number) ? RedBoxes : BlackBoxes;\n}\n\nFText AHasardFelt::LabelTextFor(const FHasardBetPosition&amp; Position) const\n{\n	if (Position.BetType == EHasardBetType::Column)\n	{\n		// All three boxes print the same thing on a real layout, which is why the name\n		// stays on the position: the log and the readout still have to say which column.\n		return NSLOCTEXT("Hasard", "ColumnPays", "2 to 1");\n	}\n\n	return Position.DisplayName;\n}\n\nFRotator AHasardFelt::LabelRotationFor(const FHasardBetPosition&amp; Position) const\n{\n~|	// Only a straight up sits in a square box. Every outside bet - dozens, even money and\n~|	// the column boxes - is wider than it is deep, so its name runs along the long axis or\n-|	return Position.BetType == EHasardBetType::Column ? LabelRotationTurned : LabelRotation;\n+|	// it is printed across the narrow dimension and crowds both rules.\n+|	return Position.BetType == EHasardBetType::StraightUp ? LabelRotation : LabelRotationTurned;\n}\n\nvoid AHasardFelt::DrawDebugLayout() const\n{\n	const UWorld* World = GetWorld();\n	if (!World || !TableLayout)\n	{\n		return;\n	}\n\n	FlushPersistentDebugLines(World);\n\n	FVector2D Min, Max;\n	TableLayout-&gt;GetFeltBounds(Min, Max);\n\n	const int32 Columns = TableLayout-&gt;GetNumberColumns();\n	const int32 Rows = TableLayout-&gt;GetNumberRows();\n\n	// Outline of the whole felt, including the zero box and both outside bands.\n	const FVector2D Corners[4] = {\n		FVector2D(Min.X, Min.Y), FVector2D(Max.X, Min.Y),\n		FVector2D(Max.X, Max.Y), FVector2D(Min.X, Max.Y) };\n\n	for (int32 Index = 0; Index &lt; 4; ++Index)\n	{\n		DrawDebugLine(World, FeltLocalToWorld(Corners[Index]),\n			FeltLocalToWorld(Corners[(Index + 1) % 4]),\n			FColor::White, true, -1.0f, 0, 0.6f);\n	}\n\n	// Cell boundaries, drawn from the layout\'s own origin and cell size. The grid and the\n	// resolver therefore read the same two numbers - a grid drawn from a second copy of\n	// the arithmetic would look correct and still send clicks to the wrong cell.\n	const FVector2D Origin = TableLayout-&gt;GetGridOrigin();\n	const FVector2D Cell = TableLayout-&gt;GetCellSize();\n	const float GridFarX = Origin.X + Columns * Cell.X;\n	const float GridFarY = Origin.Y + Rows * Cell.Y;\n\n	for (int32 Column = 0; Column &lt;= Columns; ++Column)\n	{\n		const float LineX = Origin.X + Column * Cell.X;\n		DrawDebugLine(World, FeltLocalToWorld(FVector2D(LineX, Origin.Y)),\n			FeltLocalToWorld(FVector2D(LineX, GridFarY)),\n			FColor(90, 90, 90), true, -1.0f, 0, 0.3f);\n	}\n\n	for (int32 Row = 0; Row &lt;= Rows; ++Row)\n	{\n		const float LineY = Origin.Y + Row * Cell.Y;\n		DrawDebugLine(World, FeltLocalToWorld(FVector2D(Origin.X, LineY)),\n			FeltLocalToWorld(FVector2D(GridFarX, LineY)),\n			FColor(90, 90, 90), true, -1.0f, 0, 0.3f);\n	}\n\n	// The zero box, which is the one cell that is not part of the grid.\n	DrawDebugLine(World, FeltLocalToWorld(FVector2D(Min.X, Origin.Y)),\n		FeltLocalToWorld(FVector2D(Min.X, GridFarY)), FColor(90, 90, 90), true, -1.0f, 0, 0.3f);\n	DrawDebugLine(World, FeltLocalToWorld(FVector2D(Min.X, GridFarY)),\n		FeltLocalToWorld(FVector2D(Origin.X, GridFarY)), FColor(90, 90, 90), true, -1.0f, 0, 0.3f);\n	DrawDebugLine(World, FeltLocalToWorld(FVector2D(Min.X, Origin.Y)),\n		FeltLocalToWorld(FVector2D(Origin.X, Origin.Y)), FColor(90, 90, 90), true, -1.0f, 0, 0.3f);\n\n	// Every chip location. Color carries the type only as a hint; the log is the record.\n	for (const FHasardBetPosition&amp; Position : TableLayout-&gt;GetPositions())\n	{\n		const bool bInside = Position.CoveredNumbers.Num() &lt;= 6;\n		DrawDebugPoint(World, FeltLocalToWorld(Position.ChipLocation), 6.0f,\n			bInside ? FColor::Cyan : FColor::Orange, true, -1.0f);\n	}\n\n	UE_LOG(LogHasard, Warning, TEXT("Felt: drew %d chip locations, felt is %.0f x %.0f cm"),\n		TableLayout-&gt;GetPositions().Num(), Max.X - Min.X, Max.Y - Min.Y);\n}</code></pre><p><b>6.</b> <code>HasardGameMode.cpp</code>. The audit learns about boxes:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#include "HasardGameMode.h"           // the class this file defines\n#include "HasardBettingComponent.h"   // SettleRound\n#include "HasardPayoutTable.h"        // PayoutTable-&gt;Rules, FindRule, GetHouseEdge\n#include "HasardPlayerController.h"   // AHasardPlayerController::StaticClass()\n#include "HasardPlayerState.h"        // AHasardPlayerState::StaticClass()\n#include "HasardTableLayout.h"        // BuildPositions, GetCellCenter\n#include "HasardTypes.h"              // LogHasard, FHasardBetPosition\n#include "HasardWheel.h"              // DetermineWinningPocket, GetPocketCount\n#include "GameFramework/Pawn.h"       // APawn, and FindComponentByClass on it\n#include "Kismet/GameplayStatics.h"   // GetActorOfClass, GetPlayerPawn\n#include "Engine/World.h"             // UWorld, complete for the WorldContextObject parameter\n\nDEFINE_LOG_CATEGORY(LogHasard);\n\nAHasardGameMode::AHasardGameMode()\n{\n	PlayerControllerClass = AHasardPlayerController::StaticClass();\n	PlayerStateClass = AHasardPlayerState::StaticClass();\n}\n\nvoid AHasardGameMode::BeginPlay()\n{\n	Super::BeginPlay();\n\n	UE_LOG(LogHasard, Warning, TEXT("GameMode BeginPlay - phase %s, betting window: %.1fs"),\n		*UEnum::GetValueAsString(CurrentPhase), BettingWindowSeconds);\n\n	AActor* Found = UGameplayStatics::GetActorOfClass(GetWorld(), AHasardWheel::StaticClass());\n\n	if (AHasardWheel* Wheel = Cast&lt;AHasardWheel&gt;(Found))\n	{\n		Wheel-&gt;OnBallSettled.AddDynamic(this, &amp;AHasardGameMode::HandleBallSettled);\n		BoundWheel = Wheel;\n	}\n	else\n	{\n		UE_LOG(LogHasard, Error, TEXT("GameMode: no wheel in the level - rounds will never resolve"));\n	}\n\n	if (!TableLayout)\n	{\n		UE_LOG(LogHasard, Error, TEXT("GameMode: no table layout on BP_HasardGameMode"));\n	}\n\n	if (!PayoutTable)\n	{\n		UE_LOG(LogHasard, Error, TEXT("GameMode: no payout table on BP_HasardGameMode"));\n		return;\n	}\n\n	// The audit. Fifteen rows, one line each, and the edge column is the claim\n	// this project exists to make - so the game states it out loud on every run.\n	for (const FHasardPayoutRule&amp; Rule : PayoutTable-&gt;Rules)\n	{\n		UE_LOG(LogHasard, Warning,\n			TEXT("Payout audit: %s pays %d:1, covers %d/%d, true odds %.2f:1, edge %.2f%%"),\n			*Rule.DisplayName.ToString(), Rule.PayoutRatio, Rule.CoveredNumbers,\n			PayoutTable-&gt;PocketCount, PayoutTable-&gt;GetTrueOdds(Rule),\n			PayoutTable-&gt;GetHouseEdge(Rule) * 100.0f);\n	}\n\n	float SharedEdge = 0.0f;\n	if (!PayoutTable-&gt;TryGetSharedHouseEdge(SharedEdge))\n	{\n		UE_LOG(LogHasard, Error,\n			TEXT("Payout audit: the rows do not share one edge. A row is wrong."));\n	}\n}\n\nvoid AHasardGameMode::EndPlay(const EEndPlayReason::Type EndPlayReason)\n{\n	// The rule the PlayerController already follows: whoever binds, unbinds.\n	if (BoundWheel)\n	{\n		BoundWheel-&gt;OnBallSettled.RemoveDynamic(this, &amp;AHasardGameMode::HandleBallSettled);\n		BoundWheel = nullptr;\n	}\n\n	Super::EndPlay(EndPlayReason);\n}\n\nvoid AHasardGameMode::HandleBallSettled(int32 WinningPocket)\n{\n	UE_LOG(LogHasard, Warning, TEXT("Ball settled in pocket %d"), WinningPocket);\n	ResolveRound(WinningPocket);\n}\n\nvoid AHasardGameMode::ResolveRound(int32 WinningPocket)\n{\n	CurrentPhase = EHasardRoundPhase::Settling;\n\n	APawn* PlayerPawn = UGameplayStatics::GetPlayerPawn(GetWorld(), 0);\n	UHasardBettingComponent* Betting =\n		PlayerPawn ? PlayerPawn-&gt;FindComponentByClass&lt;UHasardBettingComponent&gt;() : nullptr;\n\n	if (!PayoutTable)\n	{\n		UE_LOG(LogHasard, Error, TEXT("ResolveRound: no payout table on BP_HasardGameMode"));\n	}\n	else if (!TableLayout)\n	{\n		UE_LOG(LogHasard, Error, TEXT("ResolveRound: no table layout on BP_HasardGameMode"));\n	}\n	else if (!Betting)\n	{\n		UE_LOG(LogHasard, Warning, TEXT("ResolveRound: no betting component to settle"));\n	}\n	else\n	{\n		Betting-&gt;SettleRound(WinningPocket, PayoutTable, TableLayout);\n	}\n\n	// Whatever happened above, the table reopens. A round that cannot settle must\n	// not strand the game in Settling forever.\n	CurrentPhase = EHasardRoundPhase::Betting;\n}\n\nvoid AHasardGameMode::HasardTestDistribution(int32 SpinCount)\n{\n	if (SpinCount &lt;= 0)\n	{\n		UE_LOG(LogHasard, Error, TEXT("SpinCount must be positive"));\n		return;\n	}\n\n	AHasardWheel* Wheel = Cast&lt;AHasardWheel&gt;(\n		UGameplayStatics::GetActorOfClass(this, AHasardWheel::StaticClass()));\n	if (!Wheel)\n	{\n		UE_LOG(LogHasard, Error, TEXT("No wheel in the level"));\n		return;\n	}\n\n	const int32 PocketCount = Wheel-&gt;GetPocketCount();\n\n	TArray&lt;int32&gt; Counts;\n	Counts.Init(0, PocketCount);\n\n	for (int32 i = 0; i &lt; SpinCount; ++i)\n	{\n		Counts[Wheel-&gt;DetermineWinningPocket()]++;\n	}\n\n	const float Expected = static_cast&lt;float&gt;(SpinCount) / PocketCount;\n\n	for (int32 Pocket = 0; Pocket &lt; PocketCount; ++Pocket)\n	{\n		const float Deviation = (Counts[Pocket] - Expected) / Expected * 100.0f;\n		UE_LOG(LogHasard, Display, TEXT("Pocket %2d: %5d hits (%+.1f%% from expected)"),\n			Pocket, Counts[Pocket], Deviation);\n	}\n}\n\nvoid AHasardGameMode::HasardShowCell(int32 Number)\n{\n	if (!TableLayout)\n	{\n		UE_LOG(LogHasard, Error, TEXT("No table layout on BP_HasardGameMode"));\n		return;\n	}\n\n	if (Number == 0)\n	{\n		UE_LOG(LogHasard, Display, TEXT("0 has its own box beside the grid, so it has no column or row"));\n		return;\n	}\n\n	const int32 Column = TableLayout-&gt;GetColumnOf(Number);\n	const int32 Row = TableLayout-&gt;GetRowOf(Number);\n\n	if (Column == INDEX_NONE || Row == INDEX_NONE)\n	{\n		UE_LOG(LogHasard, Error, TEXT("%d is not a number on this grid"), Number);\n		return;\n	}\n\n	const FVector2D Center = TableLayout-&gt;GetCellCenter(Column, Row);\n\n	UE_LOG(LogHasard, Display, TEXT("%d is column %d, row %d - center (%.1f, %.1f), %s"),\n		Number, Column, Row, Center.X, Center.Y,\n		TableLayout-&gt;IsRedNumber(Number) ? TEXT("red") : TEXT("black"));\n}\n\nvoid AHasardGameMode::HasardAuditLayout()\n{\n	if (!TableLayout || !PayoutTable)\n	{\n		UE_LOG(LogHasard, Error,\n			TEXT("Assign both TableLayout and PayoutTable on BP_HasardGameMode"));\n		return;\n	}\n\n	TArray&lt;FHasardBetPosition&gt; Positions;\n	TableLayout-&gt;BuildPositions(Positions);\n\n	// The claim being tested: every position on a single-zero table pays 2.70% to the house.\n	const float ExpectedEdge = 1.0f / static_cast&lt;float&gt;(PayoutTable-&gt;PocketCount);\n\n	TMap&lt;EHasardBetType, int32&gt; CountByType;\n	int32 Offenders = 0;\n\n	for (const FHasardBetPosition&amp; Position : Positions)\n	{\n		CountByType.FindOrAdd(Position.BetType)++;\n\n		const FHasardPayoutRule* Rule = PayoutTable-&gt;FindRule(Position.BetType);\n		if (!Rule)\n		{\n			UE_LOG(LogHasard, Error, TEXT("Position %d (%s): no payout row for this bet type"),\n				Position.PositionId, *Position.DisplayName.ToString());\n			++Offenders;\n			continue;\n		}\n\n		// Two different CoveredNumbers: the position holds the actual numbers,\n		// the payout row holds how many there are meant to be. They must agree.\n		if (Position.CoveredNumbers.Num() != Rule-&gt;CoveredNumbers)\n		{\n			UE_LOG(LogHasard, Error,\n				TEXT("Position %d (%s): covers %d numbers, payout row expects %d"),\n				Position.PositionId, *Position.DisplayName.ToString(),\n				Position.CoveredNumbers.Num(), Rule-&gt;CoveredNumbers);\n			++Offenders;\n			continue;\n		}\n\n		if (!FMath::IsNearlyEqual(PayoutTable-&gt;GetHouseEdge(*Rule), ExpectedEdge, 0.0001f))\n		{\n			UE_LOG(LogHasard, Error, TEXT("Position %d (%s): edge %.2f%%, expected %.2f%%"),\n				Position.PositionId, *Position.DisplayName.ToString(),\n				PayoutTable-&gt;GetHouseEdge(*Rule) * 100.0f, ExpectedEdge * 100.0f);\n			++Offenders;\n		}\n	}\n\n	// The printed felt is generated from BoxSize, so a layout that overlaps two boxes\n	// draws one over the other and looks merely odd. The same numbers feed ResolvePosition,\n	// which means the odd-looking cell is also the cell whose clicks land somewhere else -\n	// and that failure is silent. Checked here rather than in the felt because it is a\n	// property of the layout asset, true or false before anything is drawn.\n	FVector2D FeltMin, FeltMax;\n	TableLayout-&gt;GetFeltBounds(FeltMin, FeltMax);\n\n	// Neighboring boxes share an edge exactly. Shrink both sides of every comparison so\n	// touching is not reported as overlapping - only a real intersection is.\n	const float Shrink = 0.01f;\n	int32 Boxes = 0;\n	int32 BoxOffenders = 0;\n\n	for (const FHasardBetPosition&amp; Position : Positions)\n	{\n		if (Position.BoxSize.IsNearlyZero())\n		{\n			continue;\n		}\n\n		++Boxes;\n\n		const FVector2D Min = Position.ChipLocation - Position.BoxSize * 0.5f;\n		const FVector2D Max = Position.ChipLocation + Position.BoxSize * 0.5f;\n\n		if (Min.X &lt; FeltMin.X - Shrink || Min.Y &lt; FeltMin.Y - Shrink\n			|| Max.X &gt; FeltMax.X + Shrink || Max.Y &gt; FeltMax.Y + Shrink)\n		{\n			UE_LOG(LogHasard, Error,\n				TEXT("Position %d (%s): box runs outside the felt bounds"),\n				Position.PositionId, *Position.DisplayName.ToString());\n			++BoxOffenders;\n		}\n\n		for (const FHasardBetPosition&amp; Other : Positions)\n		{\n			// Ids ascend with the array, so the pair is only ever tested once.\n			if (Other.PositionId &lt;= Position.PositionId || Other.BoxSize.IsNearlyZero())\n			{\n				continue;\n			}\n\n			const FVector2D OtherMin = Other.ChipLocation - Other.BoxSize * 0.5f;\n			const FVector2D OtherMax = Other.ChipLocation + Other.BoxSize * 0.5f;\n\n			const bool bOverlaps =\n				Min.X &lt; OtherMax.X - Shrink &amp;&amp; Max.X &gt; OtherMin.X + Shrink &amp;&amp;\n				Min.Y &lt; OtherMax.Y - Shrink &amp;&amp; Max.Y &gt; OtherMin.Y + Shrink;\n\n			if (bOverlaps)\n			{\n				UE_LOG(LogHasard, Error, TEXT("Positions %d (%s) and %d (%s): boxes overlap"),\n					Position.PositionId, *Position.DisplayName.ToString(),\n					Other.PositionId, *Other.DisplayName.ToString());\n				++BoxOffenders;\n			}\n		}\n	}\n\n	for (const TPair&lt;EHasardBetType, int32&gt;&amp; Pair : CountByType)\n	{\n		UE_LOG(LogHasard, Display, TEXT("%s: %d positions"),\n			*UEnum::GetDisplayValueAsText(Pair.Key).ToString(), Pair.Value);\n	}\n\n	UE_LOG(LogHasard, Display, TEXT("%d positions generated, %d failing the edge check"),\n		Positions.Num(), Offenders);\n\n	UE_LOG(LogHasard, Display, TEXT("%d of them are printed boxes, %d failing the box check"),\n		Boxes, BoxOffenders);\n}</code></pre><p><b>7.</b> <kbd>Ctrl+Shift+B</kbd> with the editor closed. Expect <b>Build: 1 succeeded, 0 failed</b>. Reopen the editor.</p><p><b>Phase 2 &mdash; a material the felt can tint.</b></p><p><b>8.</b> In <code>Content/Material</code>, right-click <code>M_Chip</code> &rarr; <b>Duplicate</b>, name it <code>M_Felt</code>. Open it, set <b>Roughness</b> to <b>1.0</b> and <b>Specular</b> to <b>0.0</b>, and leave the <b>Color</b> vector parameter exactly as it is &mdash; the felt writes into it by name, the same way a chip does.</p><p>Cloth does not shine. Skip this and the table reads as painted plastic under the directional light, which is the single biggest tell in a screenshot.</p><p><b>9.</b> Still in <code>M_Felt</code>, find <b>Usage</b> in the details panel and tick <b>Used with Instanced Static Meshes</b>. Then <b>save the material</b>.</p><p>This one is not optional and it fails in a way that wastes an evening. A material without that flag cannot be used on an instanced component, so Unreal silently substitutes <code>WorldGridMaterial</code> &mdash; the grey checkerboard &mdash; and your felt renders as a chessboard. The editor auto-enables the flag the first time it sees the material used this way and marks the asset dirty, so the box looks ticked while the file on disk still lacks it. <b>The tick only counts once the asset is saved.</b></p><p><b>Phase 3 &mdash; point the felt at its assets.</b></p><p><b>10.</b> Open <code>BP_HasardFelt</code> &rarr; <b>Class Defaults</b> &rarr; <b>Hasard | Surface</b>. Set <b>Box Mesh</b> to <code>/Engine/BasicShapes/Plane</code> and <b>Surface Material</b> to <code>M_Felt</code>. Leave every colour at its default.</p><p><b>11.</b> Under <b>Hasard | Felt</b>, <b>uncheck Draw Debug Layout</b>. The C++ default changed to false this module, but a value already saved on the Blueprint wins over a changed default &mdash; that is what an override is for, and it is also why it will not go away on its own.</p><p><b>12.</b> Compile and save.</p><p><b>Phase 4 &mdash; print it.</b></p><p><b>13.</b> Select the felt in the level and press <b>Rebuild Surface</b> in the details panel. The table appears <b>in the editor viewport without pressing Play</b> &mdash; that is the point of building the surface from <code>OnConstruction</code>, and it is the quickest signal that the material and mesh are wired up. The log reads <code>Felt: printed 49 boxes - 18 red, 18 black, 12 outside</code>.</p><p>18 and 18 is the number worth reading. There are 37 straight ups: 18 red, 18 black, and zero on its own component. If those two are not equal the red list is wrong &mdash; and it is the same list settlement pays from.</p><p><b>14.</b> Press <b>Play</b>. Count the rules between two neighbouring numbers: there is one, and it is twice <b>Border Width</b>, because both boxes inset away from the edge they share. Then look at the two corners, below the zero box and below the <code>2 to 1</code> column &mdash; bare cloth, no white. Nothing can be bet there, so nothing is printed there.</p><p><b>15.</b> Read the outside bets. <code>1st 12</code>, <code>Red</code>, <code>Odd</code> and the rest run along their boxes, across the numbers, because every outside box is wider than it is deep and only a straight up is square. The three <code>2 to 1</code> boxes read the same way. If any of them come out mirrored, <b>Label Rotation Turned</b>&rsquo;s Yaw is 90 rather than 270.</p><p><b>16.</b> <b>Click the middle of 17.</b> A chip lands and the bankroll drops. Every printed quad has collision off, so the sweep still finds the <code>Surface</code> box through all of them. If clicks stop resolving after this module, that is the first thing to check.</p><p><b>Phase 5 &mdash; prove the layout, not the picture.</b></p><p><b>17.</b> With the game running, press <kbd>`</kbd> and run <code>HasardAuditLayout</code>. The last two lines are:</p><pre><code>LogHasard: Display: 157 positions generated, 0 failing the edge check\nLogHasard: Display: 49 of them are printed boxes, 0 failing the box check</code></pre><p><b>18.</b> Now watch one number move everything. Open <code>DA_HasardTableLayout</code>, change <b>Cell Size X</b> from <b>24</b> to <b>30</b>, and press <b>Rebuild Surface</b>. Every box, every white rule, every numeral and every chip location moves together, and the audit still reports <code>0 failing the box check</code> &mdash; because the boxes, the labels and <code>ResolvePosition</code> all read that one property. Set it back to <b>24</b>.</p><p>That is the whole argument for <code>BoxSize</code> living on the position rather than being derived in the felt, and you can see it in one edit: there is no second copy of the arithmetic to fall out of step.</p><p><b>19.</b> Commit.</p><pre><code>git add -A\ngit commit -m "Print the felt from the layout" -m "Boxes are generated from BoxSize on the position, so the picture and the\nhit test read one set of measurements. There is no line geometry: each box is\ninset from a white plate, and the plate showing through is the rule."</code></pre>'}
],
quiz:[
{q:'The white rules between cells are drawn by:',
 opts:['A quad per grid line, positioned from CellSizeX','A texture on the cloth material','Insetting each coloured box from a white plate of the same size, so the plate shows round its edge','DrawDebugLine, kept out of the packaged build'],
 c:2,why:'There is no line geometry. Because a rule is only ever the gap between a box and its plate, a line cannot be drawn anywhere a box is not.'},
{q:'<code>BoxSize</code> is zero on 108 of the 157 positions because:',
 opts:['Those positions are drawn by a different component','Splits, corners, streets and six lines sit on boundaries and own no area, so zero is also the test for whether a position is printed','They are outside bets and the felt does not label them','The layout has not generated them yet'],
 c:1,why:'A boundary bet has no rectangle. Storing the size and nothing else means \\\'has a box\\\' and \\\'is drawn\\\' cannot disagree, the same argument that removed BetType from FHasardBet.'},
{q:'Chips are an actor each, but printed boxes are instanced. The difference is:',
 opts:['Chips are larger','Boxes are static and chips move','Chips need materials and boxes do not','A chip is spawned, stacked and destroyed individually, so a reference to one is worth keeping; a box is drawn once and never touched again'],
 c:3,why:'Module 6 rejected instancing for chips because it costs the ability to hold a reference to one. A box needs no reference, so instancing costs nothing and saves ninety-odd draw calls.'},
{q:'Zero is on its own component rather than an instance on the outside-bet component because:',
 opts:['Sharing it would make zero the same colour as a dozen box by construction, quietly removing the one cue that says zero is the house edge','Instanced components cannot hold a single instance','Zero is a different size from the other boxes','The zero box is drawn before the others'],
 c:0,why:'The green is a responsible-gaming guarantee, not decoration. Putting it where a refactor could delete it as a side effect is the failure this avoids.'},
{q:'<code>bDrawDebugLayout</code>’s C++ default changed to false, but your table still draws debug lines. Why?',
 opts:['The Blueprint needs recompiling','The property was renamed and the redirect is missing','A value already saved on BP_Felt is an override, and an override beats a changed default','BuildSurface re-enables it'],
 c:2,why:'Changing a default only affects instances that never saved one. Uncheck it on BP_Felt by hand \\u2014 the same trap as any tuned property whose default moves under it.'},
{q:'The audit’s new overlap check matters mainly because:',
 opts:['Overlapping boxes render with z-fighting','It counts the boxes so the log line is right','It runs before the felt is drawn','BoxSize and ResolvePosition read the same numbers, so overlapping boxes are also regions whose clicks resolve to the wrong bet \\u2014 and that half is silent'],
 c:3,why:'The ugly half is obvious and harmless. The silent half takes a stake for a bet the player did not aim at.'},
]
},

/* ---------------------------------------------------------- 8 */
{
grp:"Part III \u2014 The Table the Player Sees",
num:"08",
title:"Know the bet before you place it",
lede:"The felt takes the stake and then tells you what you bought. This module puts a translucent chip under the aim and the price of the bet on the cloth \u2014 and makes the click read the same hit the preview did, so the two can never disagree.",
blocks:[
{t:'h',x:'The player is told the price after they have paid it'},
{t:'p',x:'Every module so far has made betting work. Click, the stake goes, a chip lands, the log says what happened. Read that sequence again: <b>the first thing that tells the player what they just backed is the receipt.</b> Aim at the line between 17 and 20 meaning to back 17, and you find out you bought a split when the money has already gone.'},
{t:'p',x:'That is not a missing convenience. Guide 3 has spent six modules making sure the felt resolves a click honestly, and none of them addressed whether the player knew what they were about to buy. This module closes that: a translucent chip under the aim, and a line naming the bet and what it returns, both present before anything is spent.'},
{t:'rg',lab:'Naming the price before the money moves',x:'<p>CLAUDE.md requires true odds and the house edge to be visible and honest. The HUD has carried <i>&ldquo;every bet here costs 2.70% of what you stake&rdquo;</i> since guide 2, which is true and constant and, on its own, not enough &mdash; it says what the table takes in general and nothing about the bet the player is looking at.</p><p>So the readout is the second half of the same requirement: <b>this</b> bet, <b>this</b> stake, <b>this</b> return, stated while declining is still free. A commercial product would ship the ghost chip on its own, because a preview makes betting feel smoother and faster and says nothing inconvenient. The chip without the readout is the version that is purely an aid to spending.</p><p>It is worth being precise about which half is the feature. The ghost chip answers <i>where</i>. The readout answers <i>what</i> and <i>what it costs</i>. Only the second one is load-bearing, which is why they ship together and why <code>OnPlayerHover</code> was not worth adding for the chip alone.</p>'},
{t:'h',x:'The crosshair has never agreed with the trace'},
{t:'p',x:'Before any of that, a bug that has been in the project since guide 2 module 7 and has been invisible because nothing drew anything where the ray landed.'},
{t:'code',x:'OwnerPawn->GetActorEyesViewPoint(EyeLocation, EyeRotation);'},
{t:'p',x:'<code>APawn</code>&rsquo;s override of that returns <code>GetPawnViewLocation()</code> &mdash; the actor&rsquo;s location lifted by <code>BaseEyeHeight</code>, 64&nbsp;cm by default &mdash; together with the control rotation. So the ray points where you are looking and <i>starts somewhere you are not</i>. The camera is on a spring arm at <code>CameraDistance</code>, and the eye height lifts the origin off the boom besides.'},
{t:'p',x:'A centred crosshair therefore cannot agree with where the trace lands, and the error grows with <code>CameraDistance</code>. It was survivable while a click was the only consumer &mdash; you aimed by trial and error and adjusted. A ghost chip makes it intolerable, because the whole point of a preview is that it appears where you are pointing.'},
{t:'code',x:'if (const APlayerController* PC = Cast<APlayerController>(OwnerPawn->GetController()))\n{\n	PC->GetPlayerViewPoint(EyeLocation, EyeRotation);\n}\nelse\n{\n	OwnerPawn->GetActorEyesViewPoint(EyeLocation, EyeRotation);\n}'},
{t:'p',x:'<code>GetPlayerViewPoint</code> returns the active camera&rsquo;s location and rotation, so the ray <i>is</i> the centre of the screen by construction rather than by being kept in step with it. The fallback is for a pawn with no player controller &mdash; there is none today, and a silent no-trace would be worse than the old behaviour.'},
{t:'aside',lab:'Not a VR decision, and never was',x:'<p>It is tempting to read the old origin as forward planning: a ray from the head is what VR wants, surely. It is not. It was the engine&rsquo;s default answer for a pawn, inherited without a decision, and VR does not want it either &mdash; there the origin is the HMD or, far more likely, a motion controller, and neither of those is the pawn&rsquo;s actor origin.</p><p>What VR actually wants is for the origin to be something the component is <i>told</i> rather than something it assumes, and moving to <code>GetPlayerViewPoint</code> creates exactly that seam. Flat screen asks the controller for the camera; VR will ask something else. Keeping the old code would not have been a head start, it would have been a third wrong answer.</p>'},
{t:'warn',lab:'TraceRadius was wider than the thing it aims at',x:'<p>The sweep shape drops from 5&nbsp;cm to <b>0</b>, which <code>SweepSingleByChannel</code> turns into a plain line trace.</p><p>A swept sphere reports <code>ImpactPoint</code> where the sphere <i>first touched</i>, which on an angled view sits up to the radius away from your line of sight. The line-bet band is <code>LineTolerance &times; CellSizeX</code> &mdash; 3.6&nbsp;cm at the defaults &mdash; so a 5&nbsp;cm sphere was a wider shape than the feature it was trying to land on. Aiming at a split was partly luck and there was no way to tell.</p>'},
{t:'h',x:'Hover needs a tick, and it is the only thing that does'},
{t:'p',x:'Nothing else in this project ticks. Bets are events, the wheel is a timer, the reality check is a timer, and the felt rebuilds when something asks it to. Aim is the one thing that genuinely cannot be event-driven: <b>there is no notification for &ldquo;the player is now looking somewhere else&rdquo;.</b> So <code>UHasardInteractionComponent</code> gets <code>PrimaryComponentTick.bCanEverTick = true</code> and traces once a frame.'},
{t:'p',x:'That makes the component a small state machine, and the interesting part is not the entering, it is the leaving:'},
{t:'list',x:['<b>The aim moves to a different interactable.</b> The old one is told to stop before the new one is told to start, so nothing ever sees itself hovered twice with no end in between.','<b>The aim moves to nothing.</b> The margin of the felt, the floor, the sky. Ends the hover.','<b>The aim moves to something that is not interactable.</b> Same as nothing.','<b>The pawn is destroyed.</b> <code>EndPlay</code> ends the hover, because the felt outlives the pawn on teardown and would otherwise keep a ghost chip for a player who has gone.']},
{t:'p',x:'Every one of those funnels through a single <code>ClearHover</code>, for the same reason module 6 gave every exit of <code>SettleRound</code> a single <code>DropAllBets</code>: an implementation shows something on hover, and the only thing that will ever hide it is the matching end. Miss one path and a translucent chip stays on the felt forever, over a bet nobody is making.'},
{t:'chk',q:'<code>OnPlayerHover</code> fires every frame the aim stays put, not once on entry. Why not just fire it once?',a:'<p><b>Because the position under the aim changes without the actor changing.</b> The felt is one actor covering all 157 positions, so sliding from 17 to the line beside it is the same interactable at a different point. An enter-only event would have to be paired with a second per-frame call carrying the location, and that is two mechanisms for one fact.</p><p>The cost is that implementations must be cheap and idempotent. <code>ShowPreview</code> pays that by rebuilding the readout text only when <code>PreviewPositionId</code> actually changes &mdash; formatting an <code>FText</code> sixty times a second to produce the same string is the kind of waste that never shows up in a profile until the frame budget halves for VR.</p>'},
{t:'h',x:'The bet you place is the bet you were shown'},
{t:'p',x:'<code>PlaceBet</code> used to trace. It now reads the hover the component already has:'},
{t:'code',x:'FHitResult Hit;\nif (!InteractionComp->GetHoveredHit(Hit))\n{\n	return;\n}'},
{t:'p',x:'Five lines, and they are the reason this module is not just a cosmetic one. Two traces taken a frame apart can resolve to two different positions &mdash; the aim drifts, the pawn is still decelerating, the mouse moved 3&nbsp;cm of felt between the preview and the button going down. Tracing again would let the player be shown a straight up and charged for a split.'},
{t:'rg',lab:'The failure that reports nothing',x:'<p>Worth being clear about how this one hides. If the click re-traced and landed one position over, everything downstream would be <i>correct</i>: the right stake for the bet that was actually resolved, a chip drawn in the right cell for it, a log line faithfully naming it, and a settlement that pays it properly. Nothing is broken. The only thing that is wrong is that the player was shown one price and charged for another, and there is no line anywhere in the codebase that could say so.</p><p>Reading the cached hit does not make that unlikely, it makes it <b>unrepresentable</b>. The preview and the bet are the same <code>FHitResult</code>, so there is no arrangement of frames in which they differ.</p>'},
{t:'h',x:'A preview is the same chip in a different material'},
{t:'p',x:'The obvious way to build a ghost chip is a second Blueprint &mdash; <code>BP_ChipPreview</code>, duplicated from <code>BP_Chip5</code>, with a translucent material on it. Do not.'},
{t:'p',x:'Module 6 put the stake on the chip class specifically so that what a chip is worth and what it looks like could never disagree, because they are properties of one asset. A preview class reintroduces the disagreement in a worse place: <code>BP_ChipPreview</code> would carry its own <code>ChipValue</code> and <code>ChipHeight</code>, and a preview showing a five while the real chip costs ten is a lie told at the exact moment it does the most damage.'},
{t:'p',x:'So the preview is spawned from <code>ChipClass</code> &mdash; the same class a click places &mdash; and the felt swaps its material afterwards:'},
{t:'code',x:'PreviewChip = World->SpawnActor&lt;AHasardChip&gt;(\n	ChipClass, FVector::ZeroVector, GetActorRotation(), Params);\n\nPreviewChip->SetPreviewMaterial(PreviewMaterial);'},
{t:'p',x:'Size, thickness, colour and value are the real thing by construction. Only the material differs, and <code>SetPreviewMaterial</code> re-applies <code>ChipColor</code> afterwards because <code>SetMaterial</code> throws away the dynamic instance the colour was written into.'},
{t:'warn',lab:'The preview chip is not in Chips, and must not be',x:'<p><code>Chips</code> is the array <code>ClearChips</code> destroys and <code>HandleBetsCleared</code> empties on settlement. The preview belongs to neither, because it was never bet.</p><p>Put it in the array and it is destroyed the first time a round settles, leaving <code>PreviewChip</code> dangling and the next hover crashing on it. It is also spawned once and moved rather than respawned per frame &mdash; sixty actor spawns a second would be visible in the profile and pointless besides.</p>'},
{t:'p',x:'It needs no collision handling, and that is not luck. <code>AHasardChip</code> has disabled collision in its constructor since module 6, so the ghost cannot block the very trace that is positioning it &mdash; a bug that would have been genuinely confusing to diagnose, since the preview would vanish the instant it appeared.'},
{t:'h',x:'What the readout says, and where it says it'},
{t:'p',x:'The line names the position, the stake, and what the bet returns if it wins:'},
{t:'code',x:'17  -  stake 5, returns 180   (35:1)'},
{t:'p',x:'<code>DisplayName</code> has existed on <code>FHasardBetPosition</code> since module 2 and this is what it was for. Note that it says <code>Corner 17</code> and <code>Trio 0/1/2</code> rather than what the felt prints &mdash; module 7 made the three column boxes print <code>2 to 1</code>, and a readout saying <i>&ldquo;2 to 1 &mdash; stake 5, returns 15&rdquo;</i> would not tell the player <b>which</b> column they were about to back. The printed name and the bet&rsquo;s name are different jobs, which is why module 7 kept both.'},
{t:'p',x:'The return uses settlement&rsquo;s own arithmetic:'},
{t:'code',x:'const int32 Returns = Stake * (Rule->PayoutRatio + 1);'},
{t:'p',x:'Not a second expression that happens to agree. <code>TryStake</code> has already taken the stake by the time <code>SettleRound</code> pays, so a 35:1 winner returns 36 times it &mdash; and a readout that quoted 175 while the bankroll credited 180 would be wrong in the player&rsquo;s favour, which is still wrong.'},
{t:'table',head:['Decision','Choice','Why'],rows:[['Where the readout sits','A fixed spot on the player&rsquo;s edge of the felt','A caption that follows the cursor has to be re-found every time it moves, and it is read at the moment of deciding'],['In-world or HUD','In-world text on the felt','CLAUDE.md wants the reality check present in the scene the player is in. The same argument applies to the price of a bet'],['Payout source','The GameMode&rsquo;s own payout asset, assigned on BP_Felt','A second asset would let the readout quote one price and settlement pay another'],['No rule for the bet type','Say so, plainly, in the readout','That is the DA_AmericanPayouts gap. It has been silent since module 3']]},
{t:'rg',lab:'The readout makes an old bug audible',x:'<p><code>DA_AmericanPayouts</code> has 13 rules and no Trio or Basket row, and module 3 deleted the guard that made those types unreachable. Point the GameMode at it and a trio can be placed: <code>TryStake</code> takes the money, the position covers the pocket, <code>FindRule</code> returns null, and settlement logs <i>&ldquo;no rule for Trio, bet not paid&rdquo;</i> &mdash; after the stake is gone.</p><p>This module does not fix that. It makes it <b>say so before the money moves</b>: aim at the trio and the readout reads <code>this table cannot pay this bet</code>. That is worth doing on its own, and it is a good demonstration of why a preview belongs to the honesty requirements rather than to the polish list &mdash; a feature that tells the player the truth earlier catches bugs that a feature which merely looks nice does not.</p><p>Fixing the asset is still owed. It is in <code>toUpdate.md</code>.</p>'},
{t:'chk',q:'The felt now holds the payout table. What is it forbidden from doing with it?',a:'<p><b>Paying anybody.</b> The felt reads the table to quote a price; the betting component settles. Splitting that is not ceremony &mdash; two things that can credit the bankroll is two places a double payout can come from, and the felt has no idea whether a round has settled.</p><p>The header comment says so explicitly, and that is the sort of comment CONVENTIONS.md &sect;5 exists for: it is not describing the code, it is fencing off a change a reasonable person would otherwise make.</p>'},
{t:'srcs',x:[['Actor Ticking','https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-ticking-in-unreal-engine'],['Interfaces in Unreal Engine','https://dev.epicgames.com/documentation/en-us/unreal-engine/interfaces-in-unreal-engine'],['APlayerController::GetPlayerViewPoint','https://dev.epicgames.com/documentation/en-us/unreal-engine/API/Runtime/Engine/GameFramework/AController/GetPlayerViewPoint'],['Traces and sweeps','https://dev.epicgames.com/documentation/en-us/unreal-engine/traces-with-raycasts-in-unreal-engine'],['Translucent materials','https://dev.epicgames.com/documentation/en-us/unreal-engine/using-transparency-in-unreal-engine-materials']]},
{t:'build',title:'Preview the bet',file:'Source/Hasard/ - eight files, none new',x:'<p><b>Phase 1 &mdash; Visual Studio.</b> Eight files, none new. Marked against modules 3, 5, 6 and 7.</p><p><b>1.</b> <code>HasardInteractable.h</code>. Two more questions the interface can ask:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"\n#include "UObject/Interface.h"\n#include "HasardInteractable.generated.h"\n\nclass APawn;\n\nUINTERFACE(MinimalAPI)\nclass UHasardInteractable : public UInterface\n{\n	GENERATED_BODY()\n};\n\nclass HASARD_API IHasardInteractable\n{\n	GENERATED_BODY()\n\npublic:\n	/**\n	 * The player interacted with this actor at HitLocation, in world space.\n	 *\n	 * The location is part of the interaction, not a detail of it. On a felt, where the\n	 * chip lands *is* the bet, so an interface that only says "something was clicked"\n	 * cannot express a split. Implementations free to ignore it are welcome to.\n	 */\n	UFUNCTION(BlueprintCallable, BlueprintNativeEvent, Category = "Hasard|Interaction")\n	void OnPlayerInteract(APawn* InstigatorPawn, const FVector&amp; HitLocation);\n+|\n+|	/**\n+|	 * The player is aiming at this actor, at HitLocation, this frame.\n+|	 *\n+|	 * Called every frame the aim stays here, so an implementation must be cheap and must\n+|	 * tolerate being told the same thing repeatedly. It is a question about intent and\n+|	 * not a commitment: nothing may be spent, taken or recorded from inside it.\n+|	 */\n+|	UFUNCTION(BlueprintCallable, BlueprintNativeEvent, Category = "Hasard|Interaction")\n+|	void OnPlayerHover(APawn* InstigatorPawn, const FVector&amp; HitLocation);\n+|\n+|	/**\n+|	 * The aim left this actor, or the player did.\n+|	 *\n+|	 * Guaranteed for every hover that started: on looking away, on looking at a different\n+|	 * interactable, and on the pawn being torn down. Anything shown during hover is hidden\n+|	 * here, because this is the only notification an implementation gets - and a preview\n+|	 * left on screen after the aim moved is a preview of a bet the player is not making.\n+|	 */\n+|	UFUNCTION(BlueprintCallable, BlueprintNativeEvent, Category = "Hasard|Interaction")\n+|	void OnPlayerEndHover(APawn* InstigatorPawn);\n};</code></pre><p><b>2.</b> <code>HasardInteractionComponent.h</code>. It ticks now, and it remembers:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"\n#include "Components/ActorComponent.h"\n#include "Engine/HitResult.h"\n#include "HasardInteractionComponent.generated.h"\n\nUCLASS( ClassGroup=(Hasard), meta=(BlueprintSpawnableComponent) )\nclass HASARD_API UHasardInteractionComponent : public UActorComponent\n{\n	GENERATED_BODY()\n\npublic:	\n	UHasardInteractionComponent();\n\n+|	virtual void TickComponent(float DeltaTime, ELevelTick TickType,\n+|		FActorComponentTickFunction* ThisTickFunction) override;\n+|\n+|	virtual void EndPlay(const EEndPlayReason::Type EndPlayReason) override;\n+|\n	/**\n-|	 * Traces from the owning pawn\'s eyes and reports the whole hit.\n+|	 * Traces from the player\'s viewpoint and reports the whole hit.\n	 *\n	 * Returns the FHitResult rather than the actor, because the impact point is what\n	 * turns a click on the felt into one of 157 bets. Check bBlockingHit on the way out.\n	 */\n	UFUNCTION(BlueprintCallable, Category = "Hasard|Interaction")\n	bool TraceForInteractable(FHitResult&amp; OutHit) const;\n\n+|	/**\n+|	 * This frame\'s aim, already traced, or false when it is on nothing.\n+|	 *\n+|	 * The click path reads this instead of tracing again, and that is the point of it\n+|	 * existing. Two traces one frame apart can land on two different positions, which\n+|	 * would let the player be charged for a bet other than the one they were shown.\n+|	 */\n+|	bool GetHoveredHit(FHitResult&amp; OutHit) const;\n+|\nprotected:\n	UPROPERTY(EditDefaultsOnly, Category = "Hasard|Interaction", meta = (ClampMin = "1.0"))\n	float TraceDistance = 500.0f;\n\n-|	/** Sphere radius for the sweep. Zero gives a plain line trace. */\n+|	/**\n+|	 * Sphere radius for the sweep. Zero gives a plain line trace, which is what this\n+|	 * wants.\n+|	 *\n+|	 * A swept sphere reports where the sphere first touched, and on an angled view that\n+|	 * is displaced from the line of sight by up to the radius. The line-bet band is\n+|	 * LineTolerance x CellSizeX - 3.6 cm at the defaults - so a 5 cm sphere was wider\n+|	 * than the feature it was trying to land on.\n+|	 */\n	UPROPERTY(EditDefaultsOnly, Category = "Hasard|Interaction", meta = (ClampMin = "0.0"))\n-|	float TraceRadius = 5.0f;\n+|	float TraceRadius = 0.0f;\n+|\n+|	/** Draws the aim ray. Off by default: this now traces every frame, not every click. */\n+|	UPROPERTY(EditDefaultsOnly, Category = "Hasard|Interaction")\n+|	bool bDrawDebugTrace = false;\n+|\n+|private:\n+|	/** Traces, then moves the hover from whatever held it to whatever holds it now. */\n+|	void UpdateHover();\n+|\n+|	/** Ends the current hover, if there is one. Every way out of hovering comes here. */\n+|	void ClearHover();\n+|\n+|	/** What this frame\'s trace hit. Only meaningful while HoveredActor is valid. */\n+|	FHitResult HoveredHit;\n+|\n+|	/**\n+|	 * The interactable under the aim right now.\n+|	 *\n+|	 * Weak, because this is scenery the component does not own. A felt destroyed while\n+|	 * hovered would leave a raw pointer that ClearHover then calls OnPlayerEndHover on.\n+|	 */\n+|	TWeakObjectPtr&lt;AActor&gt; HoveredActor;\n};</code></pre><p><b>3.</b> <code>HasardInteractionComponent.cpp</code>. The viewpoint fix and the hover state machine:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n\n#include "HasardInteractionComponent.h"\n#include "Engine/World.h"\n#include "Engine/EngineTypes.h"\n#include "CollisionQueryParams.h"\n#include "DrawDebugHelpers.h"\n#include "GameFramework/Pawn.h"\n+|#include "GameFramework/PlayerController.h"\n+|#include "HasardInteractable.h"\n+|#include "HasardTypes.h"\n\nUHasardInteractionComponent::UHasardInteractionComponent()\n{\n-|	PrimaryComponentTick.bCanEverTick = false;\n+|	// The aim has to be known before the click, not because of it. Nothing else in this\n+|	// project ticks, and this is the one thing that genuinely cannot be event-driven:\n+|	// there is no notification for "the player is now looking somewhere else".\n+|	PrimaryComponentTick.bCanEverTick = true;\n+|}\n+|\n+|void UHasardInteractionComponent::TickComponent(float DeltaTime, ELevelTick TickType,\n+|	FActorComponentTickFunction* ThisTickFunction)\n+|{\n+|	Super::TickComponent(DeltaTime, TickType, ThisTickFunction);\n+|\n+|	UpdateHover();\n+|}\n+|\n+|void UHasardInteractionComponent::EndPlay(const EEndPlayReason::Type EndPlayReason)\n+|{\n+|	// The felt outlives the pawn on level teardown, so without this it keeps a ghost\n+|	// chip and a readout for a player that no longer exists.\n+|	ClearHover();\n+|\n+|	Super::EndPlay(EndPlayReason);\n+|}\n+|\n+|void UHasardInteractionComponent::UpdateHover()\n+|{\n+|	APawn* OwnerPawn = Cast&lt;APawn&gt;(GetOwner());\n+|	if (!OwnerPawn)\n+|	{\n+|		return;\n+|	}\n+|\n+|	FHitResult Hit;\n+|	AActor* HitActor = TraceForInteractable(Hit) ? Hit.GetActor() : nullptr;\n+|\n+|	if (HitActor &amp;&amp; !HitActor-&gt;Implements&lt;UHasardInteractable&gt;())\n+|	{\n+|		HitActor = nullptr;\n+|	}\n+|\n+|	if (!HitActor)\n+|	{\n+|		ClearHover();\n+|		return;\n+|	}\n+|\n+|	// Ending the old hover before starting the new one, so an implementation that is\n+|	// both never sees itself hovered twice with no end in between.\n+|	if (HoveredActor.Get() != HitActor)\n+|	{\n+|		ClearHover();\n+|		HoveredActor = HitActor;\n+|	}\n+|\n+|	HoveredHit = Hit;\n+|\n+|	IHasardInteractable::Execute_OnPlayerHover(HitActor, OwnerPawn, Hit.ImpactPoint);\n+|}\n+|\n+|void UHasardInteractionComponent::ClearHover()\n+|{\n+|	if (AActor* Previous = HoveredActor.Get())\n+|	{\n+|		IHasardInteractable::Execute_OnPlayerEndHover(Previous, Cast&lt;APawn&gt;(GetOwner()));\n+|	}\n+|\n+|	HoveredActor = nullptr;\n+|	HoveredHit = FHitResult();\n+|}\n+|\n+|bool UHasardInteractionComponent::GetHoveredHit(FHitResult&amp; OutHit) const\n+|{\n+|	OutHit = HoveredHit;\n+|	return HoveredActor.IsValid() &amp;&amp; HoveredHit.bBlockingHit;\n}\n\n~|bool UHasardInteractionComponent::TraceForInteractable(FHitResult&amp; OutHit) const \n{\n	OutHit = FHitResult();\n\n	const APawn* OwnerPawn = Cast&lt;APawn&gt;(GetOwner());\n	if (!OwnerPawn)\n	{\n		return false;\n	}\n~|	\n	const UWorld* World = GetWorld();\n	if (!World)\n	{\n		return false;\n	}\n\n	FVector EyeLocation;\n	FRotator EyeRotation;\n+|\n+|	// The camera, not the pawn. GetActorEyesViewPoint returns the pawn\'s location lifted\n+|	// by BaseEyeHeight, and the camera sits at the far end of a spring arm - so the ray\n+|	// matched the view direction while starting somewhere else entirely, and the\n+|	// crosshair could not agree with where the trace landed.\n+|	if (const APlayerController* PC = Cast&lt;APlayerController&gt;(OwnerPawn-&gt;GetController()))\n+|	{\n+|		PC-&gt;GetPlayerViewPoint(EyeLocation, EyeRotation);\n+|	}\n+|	else\n+|	{\n~|		OwnerPawn-&gt;GetActorEyesViewPoint(EyeLocation, EyeRotation);\n+|	}\n\n	const FVector End = EyeLocation + (EyeRotation.Vector() * TraceDistance);\n\n	FCollisionQueryParams Params;\n	Params.AddIgnoredActor(OwnerPawn);\n\n	const bool bHit = World-&gt;SweepSingleByChannel(\n		OutHit, EyeLocation, End, FQuat::Identity, ECC_Visibility,\n		FCollisionShape::MakeSphere(TraceRadius), Params);\n\n+|	if (bDrawDebugTrace)\n+|	{\n+|		// Lifetime of one frame, because this runs every frame now. The old 1.0 second\n+|		// would draw sixty overlapping lines and read as a solid bar.\n~|		DrawDebugLine(World, EyeLocation, End,\n-|		bHit ? FColor::Green : FColor::Red, false, 1.0f, 0, 1.5f);\n+|			bHit ? FColor::Green : FColor::Red, false, -1.0f, 0, 1.0f);\n+|	}\n\n	// A sphere sweep that starts already overlapping reports bStartPenetrating an
