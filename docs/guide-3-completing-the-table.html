d\n	// leaves ImpactPoint at the trace start, which would resolve to a bet nowhere near\n	// where the player was looking. Refuse it rather than guess.\n	if (bHit &amp;&amp; OutHit.bStartPenetrating)\n	{\n		OutHit = FHitResult();\n		return false;\n	}\n\n	return bHit;\n}</code></pre><p><b>4.</b> <code>HasardChip.h</code>. One public function:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"\n#include "GameFramework/Actor.h"\n#include "HasardChip.generated.h"\n\n+|class UMaterialInterface;\nclass UStaticMeshComponent;\n\n/**\n * One chip on the felt, and the denomination it represents.\n *\n * An actor per chip rather than instances of one mesh: a player reaches a handful of\n * positions by hand, so the count never grows enough to justify losing the ability to\n * hold a reference to a single chip. The felt owns them and destroys them on settle.\n *\n * The class is the denomination. A five and a ten are two Blueprint subclasses, each\n * carrying its own value, color and mesh, so what a chip is worth and what it looks\n * like can never disagree - they are properties of the same asset.\n */\nUCLASS()\nclass HASARD_API AHasardChip : public AActor\n{\n	GENERATED_BODY()\n\npublic:\n	AHasardChip();\n\n	virtual void OnConstruction(const FTransform&amp; Transform) override;\n\n	/** Thickness of one chip, so the felt can stack them without measuring the mesh. */\n	UFUNCTION(BlueprintPure, Category = "Hasard|Chip")\n	float GetChipHeight() const { return ChipHeight; }\n\n	/**\n	 * What placing this chip stakes.\n	 *\n	 * The chip carries the number, not the felt. A felt that knew the stake and a chip\n	 * that knew its appearance would be one value in two places, and the pair could\n	 * drift into a chip reading 25 that costs 5.\n	 */\n	UFUNCTION(BlueprintPure, Category = "Hasard|Chip")\n	int32 GetChipValue() const { return ChipValue; }\n\n+|	/**\n+|	 * Repaints this chip with a see-through material, for use as an aim preview.\n+|	 *\n+|	 * Deliberately not a second Blueprint class. A BP_ChipPreview would carry its own\n+|	 * ChipValue and ChipHeight, and a preview that showed 5 while the real chip cost 10\n+|	 * is precisely the disagreement this class was built to make impossible. A preview\n+|	 * is the same denomination wearing a different material, and nothing else.\n+|	 */\n+|	void SetPreviewMaterial(UMaterialInterface* PreviewMaterial);\n+|\nprivate:\n	/** Pushes ChipColor into the mesh material. Called from OnConstruction, so the editor shows it. */\n	void ApplyChipColor();\n\n	UPROPERTY(VisibleAnywhere, Category = "Hasard|Chip")\n	TObjectPtr&lt;UStaticMeshComponent&gt; Mesh;\n\n	/**\n	 * How far up the next chip in a stack sits, in centimeters.\n	 *\n	 * A property rather than the mesh bounds: the mesh is a scaled cylinder and its\n	 * bounds are a rendering detail, while stack spacing is a decision about how a\n	 * stack reads. Reading it off the bounds would tie one to the other for no gain.\n	 */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Chip",\n		meta = (AllowPrivateAccess = "true", ClampMin = "0.1"))\n	float ChipHeight = 1.0f;\n\n	/** The stake one of these places. ClampMin 1: a chip worth nothing is not a chip. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Chip",\n		meta = (AllowPrivateAccess = "true", ClampMin = "1"))\n	int32 ChipValue = 5;\n\n	/** How this denomination reads at a glance. Real tables color by value for exactly this reason. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Chip",\n		meta = (AllowPrivateAccess = "true"))\n	FLinearColor ChipColor = FLinearColor(0.10f, 0.35f, 0.75f);\n\n	/**\n	 * The vector parameter ChipColor is written into. A name rather than a hard-coded\n	 * "Color" so a later material can call it whatever it likes without a code change.\n	 */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Chip",\n		meta = (AllowPrivateAccess = "true"))\n	FName ColorParameterName = TEXT("Color");\n};</code></pre><p><b>5.</b> <code>HasardChip.cpp</code>:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#include "HasardChip.h"\n#include "HasardTypes.h"\n#include "Components/StaticMeshComponent.h"\n+|#include "Materials/MaterialInterface.h"\n\nAHasardChip::AHasardChip()\n{\n	PrimaryActorTick.bCanEverTick = false;\n\n	Mesh = CreateDefaultSubobject&lt;UStaticMeshComponent&gt;(TEXT("Mesh"));\n	SetRootComponent(Mesh);\n\n	// No collision, and this one is load bearing. The felt is found by a Visibility\n	// sweep; a chip that blocked that sweep would make the position underneath it\n	// unclickable, so the second chip on any bet could never be placed.\n	Mesh-&gt;SetCollisionEnabled(ECollisionEnabled::NoCollision);\n	Mesh-&gt;SetCollisionResponseToAllChannels(ECR_Ignore);\n\n	// A 1 cm disc casting a shadow is cost with no picture to show for it, and there\n	// will be a lot of them.\n	Mesh-&gt;SetCastShadow(false);\n}\n\nvoid AHasardChip::OnConstruction(const FTransform&amp; Transform)\n{\n	Super::OnConstruction(Transform);\n\n	// Here rather than BeginPlay, so a denomination reads correctly in the editor and\n	// in the Blueprint preview rather than only once the game is running.\n	ApplyChipColor();\n}\n\n+|void AHasardChip::SetPreviewMaterial(UMaterialInterface* PreviewMaterial)\n+|{\n+|	if (!Mesh || !PreviewMaterial)\n+|	{\n+|		return;\n+|	}\n+|\n+|	Mesh-&gt;SetMaterial(0, PreviewMaterial);\n+|\n+|	// Re-apply, because the material just changed underneath it. SetMaterial discards\n+|	// the dynamic instance ChipColor was written into, so without this a preview would\n+|	// come out whatever colour the preview material ships with - and a preview in the\n+|	// wrong denomination\'s colour is worse than no preview.\n+|	ApplyChipColor();\n+|}\n+|\nvoid AHasardChip::ApplyChipColor()\n{\n	if (!Mesh || ColorParameterName.IsNone())\n	{\n		return;\n	}\n\n	if (!Mesh-&gt;GetMaterial(0))\n	{\n		// Loud, because a chip with no material is a chip the player cannot tell apart\n		// from any other denomination.\n		UE_LOG(LogHasard, Warning, TEXT("Chip %s has no material, so ChipColor shows nothing"),\n			*GetNameSafe(this));\n		return;\n	}\n\n	// Creates the dynamic instances it needs. Quiet when the material has no parameter\n	// of that name: a chip painted by a texture instead is a decision, not a fault.\n	Mesh-&gt;SetVectorParameterValueOnMaterials(ColorParameterName, FVector(ChipColor));\n}</code></pre><p><b>6.</b> <code>HasardFelt.h</code>. The payout table, the ghost chip and the readout:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"\n#include "GameFramework/Actor.h"\n#include "HasardInteractable.h"\n#include "HasardFelt.generated.h"\n\nclass AHasardChip;\nclass UBoxComponent;\nclass UHasardBettingComponent;\n+|class UHasardPayoutTable;\nclass UHasardTableLayout;\nclass UInstancedStaticMeshComponent;\nclass UMaterialInstanceDynamic;\nclass UMaterialInterface;\nclass UStaticMesh;\nclass UStaticMeshComponent;\nclass UTextRenderComponent;\nstruct FHasardBetPosition;\n\n/**\n * The betting surface. One actor for all 157 positions.\n *\n * There is deliberately no actor per bet: 83 of the 157 positions are lines and corners\n * between cells, so they have no area of their own and nothing to own a collision volume.\n * Instead this is a single box the trace can hit, and the layout asset turns the impact\n * point into a position id. The felt draws itself from the same numbers, so the picture\n * and the hit test cannot disagree.\n */\nUCLASS()\nclass HASARD_API AHasardFelt : public AActor, public IHasardInteractable\n{\n	GENERATED_BODY()\n	\npublic:	\n	AHasardFelt();\n\n	virtual void OnPlayerInteract_Implementation(APawn* InstigatorPawn,\n		const FVector&amp; HitLocation) override;\n+|\n+|	virtual void OnPlayerHover_Implementation(APawn* InstigatorPawn,\n+|		const FVector&amp; HitLocation) override;\n+|\n+|	virtual void OnPlayerEndHover_Implementation(APawn* InstigatorPawn) override;\n\n	/** Redraws the debug overlay. A details-panel button: an actor gets no exec routing. */\n	UFUNCTION(CallInEditor, Category = "Hasard|Felt")\n	void DrawFelt();\n\n	/** Rebuilds the felt labels after editing the layout or a color. Same button treatment. */\n	UFUNCTION(CallInEditor, Category = "Hasard|Felt")\n	void RebuildLabels();\n\n	/** Reprints the cloth, the lines and every colored box. Same button treatment. */\n	UFUNCTION(CallInEditor, Category = "Hasard|Felt")\n	void RebuildSurface();\n\nprotected:\n	virtual void BeginPlay() override;\n	virtual void EndPlay(const EEndPlayReason::Type EndPlayReason) override;\n	virtual void OnConstruction(const FTransform&amp; Transform) override;\n\nprivate:	\n	/** World point to the felt\'s local 2D space, in centimeters. Z is discarded. */\n	FVector2D WorldToFeltLocal(const FVector&amp; WorldPoint) const;\n\n	/** Felt-local 2D back to world, on the surface. The inverse of the above. */\n	FVector FeltLocalToWorld(const FVector2D&amp; LocalPoint) const;\n\n	/** Resizes the collision box to whatever the layout says the felt measures. */\n	void SyncBoxToLayout();\n\n	/** Persistent debug lines for the grid, the bands, and every chip location. */\n	void DrawDebugLayout() const;\n\n	/**\n	 * Destroys every existing label, then makes one per bet the player reads by name.\n	 *\n	 * Called from BeginPlay rather than OnConstruction: OnConstruction runs on every\n	 * property edit and on every level load, and creating components there means\n	 * managing their destruction against a construction script that may not have run.\n	 */\n	void BuildLabels();\n\n	/**\n	 * Prints the whole felt: cloth, then a white plate per box, then the color inset on it.\n	 *\n	 * Called from OnConstruction as well as BeginPlay, and it has to be. An instanced\n	 * component builds its render state when it registers, and one registered without a\n	 * mesh does not pick up a mesh or a material assigned later - the values are stored\n	 * and the renderer keeps drawing the default. The cost is a dynamic material instance\n	 * per property edit in the editor, which is churn worth paying to have the felt draw.\n	 */\n	void BuildSurface();\n\n	/** Points a component at BoxMesh and SurfaceMaterial, and returns its color instance. */\n	UMaterialInstanceDynamic* PrepareSurface(UStaticMeshComponent* Component,\n		const FColor&amp; Color) const;\n\n	/**\n	 * Which instanced component prints this box, which is the same question as what color\n	 * it is: the components are split by color, so routing and coloring cannot disagree.\n	 *\n	 * Zero is not routed here. It is one quad with its own component, because it is the\n	 * one box whose color is a statement about the odds rather than a decoration.\n	 */\n	UInstancedStaticMeshComponent* BoxesFor(const FHasardBetPosition&amp; Position,\n		const UHasardTableLayout&amp; Layout) const;\n\n	/** A box centered on a felt-local point, laid flat at the given height. */\n	FTransform BoxTransform(const FVector2D&amp; Center, const FVector2D&amp; Size, float Height) const;\n\n	/**\n	 * What a position is printed as, which is not always what it is called.\n	 *\n	 * A real layout prints the three column boxes as "2 to 1" rather than naming them,\n	 * so the felt says that. DisplayName still says "Column 2", because a click log and\n	 * the bet readout have to name which one - "2 to 1" identifies a payout, not a bet.\n	 */\n	FText LabelTextFor(const FHasardBetPosition&amp; Position) const;\n\n	/** Which of the two rotations a position reads at. See LabelRotationTurned. */\n	FRotator LabelRotationFor(const FHasardBetPosition&amp; Position) const;\n\n	/** Puts one chip on a position, on top of whatever is already there. */\n	void SpawnChip(const FHasardBetPosition&amp; Position);\n\n	/** Destroys every chip and forgets every stack height. */\n	void ClearChips();\n\n	/** Bound to the betting component\'s OnBetsCleared. No UFUNCTION: not a dynamic delegate. */\n	void HandleBetsCleared();\n\n	/** The chip a click would place, or null. Its value is what a click costs. */\n	const AHasardChip* GetChipDefault() const;\n\n+|	/**\n+|	 * Puts the ghost chip and the readout on a position. Safe to call every frame with\n+|	 * the same position: it only rebuilds the text when the position actually changed.\n+|	 */\n+|	void ShowPreview(const FHasardBetPosition&amp; Position);\n+|\n+|	/** Hides both. Every path that stops previewing goes through here. */\n+|	void HidePreview();\n+|\n+|	/**\n+|	 * What the readout says: the bet, what it costs, and what it returns if it wins.\n+|	 *\n+|	 * The return is computed with the same expression settlement uses,\n+|	 * Stake * (PayoutRatio + 1), rather than a second one that means the same thing.\n+|	 * A readout that promised a different number than the bankroll pays would be a lie\n+|	 * told at exactly the moment the player is deciding.\n+|	 */\n+|	FText ReadoutTextFor(const FHasardBetPosition&amp; Position, const AHasardChip&amp; Chip) const;\n+|\n	/** Fixed origin. Everything else is measured and offset from here. */\n	UPROPERTY(VisibleAnywhere, Category = "Hasard|Felt")\n	TObjectPtr&lt;USceneComponent&gt; Root;\n\n	/** The trace target. Sized from the layout, never authored by hand. */\n	UPROPERTY(VisibleAnywhere, Category = "Hasard|Felt")\n	TObjectPtr&lt;UBoxComponent&gt; Surface;\n\n	/** The green cloth the whole layout is printed on. One quad, sized from the bounds. */\n	UPROPERTY(VisibleAnywhere, Category = "Hasard|Surface")\n	TObjectPtr&lt;UStaticMeshComponent&gt; Cloth;\n\n	/**\n	 * The white plate behind every box, one instance per box at full size.\n	 *\n	 * There is no separate line geometry. Each colored box is inset by BorderWidth on\n	 * every side, so the plate showing round its edge *is* the printed line - which means\n	 * a line can never be drawn somewhere a box is not, and the two cannot drift apart.\n	 */\n	UPROPERTY(VisibleAnywhere, Category = "Hasard|Surface")\n	TObjectPtr&lt;UInstancedStaticMeshComponent&gt; Lines;\n\n	/**\n	 * The colored faces, split by color rather than by bet type.\n	 *\n	 * Three components and about 120 instances for the whole felt, against one component\n	 * per box. That is a draw-call decision made now because it is nearly free now: at\n	 * VR framerates the same table has to render twice per frame, and sixty-odd separate\n	 * primitives is the kind of thing that is painful to unpick after the fact.\n	 */\n	UPROPERTY(VisibleAnywhere, Category = "Hasard|Surface")\n	TObjectPtr&lt;UInstancedStaticMeshComponent&gt; RedBoxes;\n\n	UPROPERTY(VisibleAnywhere, Category = "Hasard|Surface")\n	TObjectPtr&lt;UInstancedStaticMeshComponent&gt; BlackBoxes;\n\n	/** Every outside bet. Green is the table\'s own color, not an absence of one. */\n	UPROPERTY(VisibleAnywhere, Category = "Hasard|Surface")\n	TObjectPtr&lt;UInstancedStaticMeshComponent&gt; GreenBoxes;\n\n	/**\n	 * Zero, alone, on its own component.\n	 *\n	 * One quad does not need instancing, and putting it on the outside-bet component\n	 * would have made zero the same color as a dozen box by construction. It is a single\n	 * pocket with a color that means something, so it gets a mesh that can only be it.\n	 */\n	UPROPERTY(VisibleAnywhere, Category = "Hasard|Surface")\n	TObjectPtr&lt;UStaticMeshComponent&gt; ZeroBox;\n\n	/**\n	 * Assigned on BP_Felt, and it must be the same asset the GameMode holds.\n	 * Two different layouts would put the chip somewhere the settlement does not expect.\n	 */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Felt",\n		meta = (AllowPrivateAccess = "true"))\n	TObjectPtr&lt;UHasardTableLayout&gt; TableLayout;\n\n	/**\n+|	 * The same payout asset the GameMode settles with. Read only to state what a bet\n+|	 * pays before it is placed.\n+|	 *\n+|	 * The felt does not pay anyone and must never start. It holds this so the player can\n+|	 * be told the price of a bet while they can still decline it - which is the whole\n+|	 * reason this module exists, and the reason a ghost chip on its own would have been\n+|	 * the wrong feature.\n+|	 */\n+|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Felt",\n+|		meta = (AllowPrivateAccess = "true"))\n+|	TObjectPtr&lt;UHasardPayoutTable&gt; PayoutTable;\n+|\n+|	/**\n	 * Draws the grid and all 157 chip locations on BeginPlay. Debug builds only.\n	 *\n	 * Off by default since the felt prints itself: the debug lines and the printed lines\n	 * are drawn from the same numbers, so leaving both on shows one picture twice and\n	 * makes a real disagreement harder to see rather than easier.\n	 */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Felt",\n		meta = (AllowPrivateAccess = "true"))\n	bool bDrawDebugLayout = false;\n\n	/** Height of the collision box. The felt is flat; this is just enough to trace against. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Felt",\n		meta = (AllowPrivateAccess = "true", ClampMin = "0.1"))\n	float SurfaceThickness = 2.0f;\n\n	/** Every label this actor made. UPROPERTY so the collector can see them. */\n	UPROPERTY()\n	TArray&lt;TObjectPtr&lt;UTextRenderComponent&gt;&gt; Labels;\n\n	/**\n	 * The chip a click places. Assigned on BP_Felt.\n	 *\n	 * The class carries the stake, the mesh, the scale and the color together, so the\n	 * felt never holds a stake of its own to disagree with. Swapping this for a ten\n	 * changes what a click costs and what it looks like in one edit.\n	 */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Chips",\n		meta = (AllowPrivateAccess = "true"))\n	TSubclassOf&lt;AHasardChip&gt; ChipClass;\n\n	/** Every chip currently on the felt. UPROPERTY so the collector can see them. */\n	UPROPERTY()\n	TArray&lt;TObjectPtr&lt;AHasardChip&gt;&gt; Chips;\n\n	/**\n	 * How many chips already sit on each position, keyed by PositionId.\n	 *\n	 * Not a UPROPERTY: two ints per entry and no UObject in sight, so there is nothing\n	 * for the collector to track and nothing worth serializing into the map.\n	 */\n	TMap&lt;int32, int32&gt; StackCounts;\n\n	/**\n	 * The component this felt is listening to. Weak, because the pawn owns it and can\n	 * be destroyed first - a raw pointer here would be a dangling unbind in EndPlay.\n	 */\n	TWeakObjectPtr&lt;UHasardBettingComponent&gt; BoundBetting;\n+|\n+|	/**\n+|	 * The ghost chip under the aim. Spawned once and moved, never once bet with.\n+|	 *\n+|	 * It is an AHasardChip of the same ChipClass a click would place, so its size,\n+|	 * height and colour are the real thing by construction rather than by being kept\n+|	 * in step. Only its material differs.\n+|	 */\n+|	UPROPERTY()\n+|	TObjectPtr&lt;AHasardChip&gt; PreviewChip;\n+|\n+|	/** Which position the preview is showing, or INDEX_NONE when it is hidden. */\n+|	int32 PreviewPositionId = INDEX_NONE;\n+|\n+|	/** Names the bet under the aim and what it pays. Positioned on the player\'s edge. */\n+|	UPROPERTY(VisibleAnywhere, Category = "Hasard|Preview")\n+|	TObjectPtr&lt;UTextRenderComponent&gt; Readout;\n+|\n+|	/**\n+|	 * The see-through material the ghost chip wears. Assigned on BP_Felt.\n+|	 *\n+|	 * Without one the preview is a solid chip indistinguishable from a placed bet, so\n+|	 * the felt refuses to preview at all rather than show a chip that looks paid for.\n+|	 */\n+|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Preview",\n+|		meta = (AllowPrivateAccess = "true"))\n+|	TObjectPtr&lt;UMaterialInterface&gt; PreviewMaterial;\n+|\n+|	/**\n+|	 * Where the readout sits, in the felt\'s local 2D space.\n+|	 *\n+|	 * A fixed spot rather than following the aim. A caption that moves with the cursor\n+|	 * has to be re-found every time it changes, and the player is reading it at the\n+|	 * moment they are deciding whether to spend - so it goes in one place they learn.\n+|	 */\n+|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Preview",\n+|		meta = (AllowPrivateAccess = "true"))\n+|	FVector2D ReadoutLocation = FVector2D(144.0f, -62.0f);\n+|\n+|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Preview",\n+|		meta = (AllowPrivateAccess = "true", ClampMin = "0.5"))\n+|	float ReadoutTextSize = 7.0f;\n+|\n+|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Preview",\n+|		meta = (AllowPrivateAccess = "true"))\n+|	FColor ReadoutColor = FColor(250, 240, 200);\n\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Labels",\n		meta = (AllowPrivateAccess = "true"))\n	bool bShowLabels = true;\n\n	/** Cap height in centimeters. A 24 cm cell takes about 8 before it crowds the lines. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Labels",\n		meta = (AllowPrivateAccess = "true", ClampMin = "0.5"))\n	float LabelTextSize = 8.0f;\n\n	/** Lifts the text off the felt so it does not z-fight with the surface. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Labels",\n		meta = (AllowPrivateAccess = "true", ClampMin = "0.0"))\n	float LabelZOffset = 0.2f;\n\n	/**\n	 * Lays the text flat and decides which side of the table it reads from.\n	 * If the numbers come out mirrored, add 180 to Yaw - that is the only axis at issue.\n	 */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Labels",\n		meta = (AllowPrivateAccess = "true"))\n	FRotator LabelRotation = FRotator(90.0f, 180.0f, 0.0f);\n\n	/**\n	 * The rotation for labels that read from the end of the table rather than the side.\n	 *\n	 * Only the three "2 to 1" boxes use it, because only they sit at the end of the\n	 * grid. A separate property rather than LabelRotation with 90 added to Yaw: the\n	 * working values for the main rotation are still being found by eye, and deriving\n	 * one from the other would make every correction move both groups at once.\n	 */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Labels",\n		meta = (AllowPrivateAccess = "true"))\n	FRotator LabelRotationTurned = FRotator(90.0f, 270.0f, 0.0f);\n\n	/**\n	 * One ink for every numeral and every word on the felt.\n	 *\n	 * A real layout prints white on the colored box, so the box carries the red/black\n	 * distinction and the text does not repeat it. Colored numerals plus colored boxes\n	 * would be two sources for one fact, and the day they disagree the felt is lying\n	 * about which pocket a cell belongs to.\n	 */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Labels",\n		meta = (AllowPrivateAccess = "true"))\n	FColor NumeralColor = FColor(245, 245, 240);\n\n	/** Whether to print the cloth, lines and boxes at all. Off leaves the debug view. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Surface",\n		meta = (AllowPrivateAccess = "true"))\n	bool bShowSurface = true;\n\n	/** The unit quad every box is an instance of. /Engine/BasicShapes/Plane is 100 cm square. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Surface",\n		meta = (AllowPrivateAccess = "true"))\n	TObjectPtr&lt;UStaticMesh&gt; BoxMesh;\n\n	/**\n	 * The material every printed surface uses, with one vector parameter for its color.\n	 *\n	 * The same asset five times over with five dynamic instances, rather than five\n	 * authored materials: the colors below are the tunable thing, and an artist changing\n	 * a felt green should not have to open a material graph to do it.\n	 */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Surface",\n		meta = (AllowPrivateAccess = "true"))\n	TObjectPtr&lt;UMaterialInterface&gt; SurfaceMaterial;\n\n	/** The vector parameter each color is written into. Matches AHasardChip\'s default. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Surface",\n		meta = (AllowPrivateAccess = "true"))\n	FName ColorParameterName = TEXT("Color");\n\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Surface",\n		meta = (AllowPrivateAccess = "true"))\n	FColor ClothColor = FColor(12, 82, 48);\n\n	/** The printed lines. Not pure white: cloth takes ink slightly off, and it reads better. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Surface",\n		meta = (AllowPrivateAccess = "true"))\n	FColor LineColor = FColor(235, 235, 228);\n\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Surface",\n		meta = (AllowPrivateAccess = "true"))\n	FColor RedBoxColor = FColor(178, 26, 30);\n\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Surface",\n		meta = (AllowPrivateAccess = "true"))\n	FColor BlackBoxColor = FColor(22, 22, 24);\n\n	/**\n	 * Zero gets its own color because zero is the entire house edge. It is not one of\n	 * the blacks and must never be printed as though it were.\n	 *\n	 * This rule moved from the numeral to the box and did not soften on the way. A green\n	 * zero is the one visual cue that the wheel is not an even bet, and CLAUDE.md\'s\n	 * anti-patterns forbid removing it as surely as they forbid misstating the odds.\n	 */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Surface",\n		meta = (AllowPrivateAccess = "true"))\n	FColor ZeroBoxColor = FColor(20, 130, 60);\n\n	/** Dozens, columns and the even-money boxes. Cloth-colored on a real table. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Surface",\n		meta = (AllowPrivateAccess = "true"))\n	FColor OutsideBoxColor = FColor(14, 92, 54);\n\n	/**\n	 * How far each colored box is inset from its white plate, in centimeters.\n	 *\n	 * This is the line width, and it is a width rather than a line because the lines are\n	 * not drawn: they are the plate showing through. Between two neighboring boxes the\n	 * player sees twice this, which is why 0.6 reads as a normal printed rule on a 24 cm\n	 * cell rather than as a gap.\n	 */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Surface",\n		meta = (AllowPrivateAccess = "true", ClampMin = "0.0"))\n	float BorderWidth = 0.6f;\n\n	/** How far the cloth extends past the printed area on every side. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Surface",\n		meta = (AllowPrivateAccess = "true", ClampMin = "0.0"))\n	float ClothMargin = 14.0f;\n\n	/**\n	 * Gap between the cloth, the plate and the color, in centimeters.\n	 *\n	 * Three coplanar quads z-fight, and the artifact is view-dependent flicker rather\n	 * than a static error - the sort of thing that looks fine on the machine it was built\n	 * on. LabelZOffset must stay larger than twice this, or the numerals sink into the box.\n	 */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Surface",\n		meta = (AllowPrivateAccess = "true", ClampMin = "0.001"))\n	float SurfaceZStep = 0.03f;\n};</code></pre><p><b>7.</b> <code>HasardFelt.cpp</code>:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#include "HasardFelt.h"\n#include "HasardBettingComponent.h"\n#include "HasardChip.h"\n+|#include "HasardPayoutTable.h"\n#include "HasardTableLayout.h"\n#include "HasardTypes.h"\n#include "Components/BoxComponent.h"\n#include "Components/InstancedStaticMeshComponent.h"\n#include "Components/SceneComponent.h"\n#include "Components/StaticMeshComponent.h"\n#include "Components/TextRenderComponent.h"\n#include "DrawDebugHelpers.h"\n#include "Engine/StaticMesh.h"\n#include "Engine/World.h"\n#include "GameFramework/Pawn.h"\n#include "Materials/MaterialInstanceDynamic.h"\n#include "Materials/MaterialInterface.h"\n\n/**\n * Which bets get their name printed on the felt.\n *\n * The line bets do not, and that is not an omission: a split has no box of its own, so\n * "17/18" would have to be printed on the line between two numbers. A real layout leaves\n * those unlabeled too - the preview names them instead.\n *\n * No default case, deliberately. Adding an enumerator without deciding whether it is\n * named on the felt then fails the build rather than shipping a bet nobody can read.\n */\nstatic bool IsNamedOnFelt(EHasardBetType BetType)\n{\n	switch (BetType)\n	{\n	case EHasardBetType::StraightUp:\n	case EHasardBetType::Dozen:\n	case EHasardBetType::Column:\n	case EHasardBetType::Red:\n	case EHasardBetType::Black:\n	case EHasardBetType::Even:\n	case EHasardBetType::Odd:\n	case EHasardBetType::Low:\n	case EHasardBetType::High:\n		return true;\n\n	case EHasardBetType::Split:\n	case EHasardBetType::Street:\n	case EHasardBetType::Trio:\n	case EHasardBetType::Corner:\n	case EHasardBetType::Basket:\n	case EHasardBetType::SixLine:\n		return false;\n	}\n	// Unreachable while every enumerator is listed above. Kept because the compiler\n	// requires a return, and it is the line a missing case would fall through to.\n	return false;\n}\n\n/**\n * The zero pocket\'s own straight up.\n *\n * Asked of the covered numbers rather than the position id, because the id is an index\n * into a generated array and "zero happens to be built first" is not a fact worth\n * depending on. What makes this position zero is that it covers pocket zero and nothing\n * else, which stays true however BuildPositions is reordered.\n */\nstatic bool IsZeroPosition(const FHasardBetPosition&amp; Position)\n{\n	return Position.BetType == EHasardBetType::StraightUp\n		&amp;&amp; Position.CoveredNumbers.Num() == 1\n		&amp;&amp; Position.CoveredNumbers[0] == 0;\n}\n\nAHasardFelt::AHasardFelt()\n{\n	PrimaryActorTick.bCanEverTick = false;\n\n	Root = CreateDefaultSubobject&lt;USceneComponent&gt;(TEXT("Root"));\n	SetRootComponent(Root);\n\n	Surface = CreateDefaultSubobject&lt;UBoxComponent&gt;(TEXT("Surface"));\n	Surface-&gt;SetupAttachment(Root);\n\n	// Visibility is the channel the interaction trace sweeps on.\n	Surface-&gt;SetCollisionEnabled(ECollisionEnabled::QueryOnly);\n	Surface-&gt;SetCollisionResponseToAllChannels(ECR_Ignore);\n	Surface-&gt;SetCollisionResponseToChannel(ECC_Visibility, ECR_Block);\n\n	Cloth = CreateDefaultSubobject&lt;UStaticMeshComponent&gt;(TEXT("Cloth"));\n	Cloth-&gt;SetupAttachment(Root);\n\n	Lines = CreateDefaultSubobject&lt;UInstancedStaticMeshComponent&gt;(TEXT("Lines"));\n	Lines-&gt;SetupAttachment(Root);\n\n	RedBoxes = CreateDefaultSubobject&lt;UInstancedStaticMeshComponent&gt;(TEXT("RedBoxes"));\n	RedBoxes-&gt;SetupAttachment(Root);\n\n	BlackBoxes = CreateDefaultSubobject&lt;UInstancedStaticMeshComponent&gt;(TEXT("BlackBoxes"));\n	BlackBoxes-&gt;SetupAttachment(Root);\n\n	GreenBoxes = CreateDefaultSubobject&lt;UInstancedStaticMeshComponent&gt;(TEXT("GreenBoxes"));\n	GreenBoxes-&gt;SetupAttachment(Root);\n\n	ZeroBox = CreateDefaultSubobject&lt;UStaticMeshComponent&gt;(TEXT("ZeroBox"));\n	ZeroBox-&gt;SetupAttachment(Root);\n\n~|	// In the constructor rather than made at runtime like the 49 labels: there is exactly\n~|	// one of these and it exists for the whole life of the felt, so none of module 4\'s\n~|	// reasons for NewObject apply.\n+|	Readout = CreateDefaultSubobject&lt;UTextRenderComponent&gt;(TEXT("Readout"));\n+|	Readout-&gt;SetupAttachment(Root);\n+|	Readout-&gt;SetHorizontalAlignment(EHTA_Center);\n+|	Readout-&gt;SetVerticalAlignment(EVRTA_TextCenter);\n+|	Readout-&gt;SetVisibility(false);\n+|\n+|	// Every printed surface is scenery, and Surface above is the only thing the trace may\n+|	// hit. A quad that blocked Visibility would be found instead of the box underneath it,\n+|	// and every click on the felt would resolve against the wrong actor - the same failure\n	// the chips avoid, arriving from the other direction.\n	UStaticMeshComponent* const Printed[] = {\n		Cloth, ZeroBox, Lines, RedBoxes, BlackBoxes, GreenBoxes };\n\n	for (UStaticMeshComponent* Component : Printed)\n	{\n		Component-&gt;SetCollisionEnabled(ECollisionEnabled::NoCollision);\n		Component-&gt;SetCollisionResponseToAllChannels(ECR_Ignore);\n		Component-&gt;SetCastShadow(false);\n	}\n}\n\nvoid AHasardFelt::OnConstruction(const FTransform&amp; Transform)\n{\n	Super::OnConstruction(Transform);\n\n	// Resized here as well as in BeginPlay, so assigning the asset in the editor\n	// shows the right box immediately rather than after the next Play.\n	SyncBoxToLayout();\n\n	// And printed here too. BoxMesh and SurfaceMaterial are EditDefaultsOnly, so they do\n	// not exist until the Blueprint has written its defaults - which happens after the\n	// constructor and before this. Printing from BeginPlay instead left the instanced\n	// components registered with no mesh, and a material assigned to them afterwards was\n	// stored on the component but never reached the renderer: the felt drew WorldGridMaterial.\n	BuildSurface();\n}\n\nvoid AHasardFelt::BeginPlay()\n{\n	Super::BeginPlay();\n\n	if (!TableLayout)\n	{\n		UE_LOG(LogHasard, Error, TEXT("Felt: no table layout on BP_Felt - clicks cannot resolve"));\n		return;\n	}\n\n	SyncBoxToLayout();\n\n	// Surface before labels: both read the same positions, and printing the boxes first\n	// means a numeral is never briefly visible over bare cloth.\n	BuildSurface();\n\n	BuildLabels();\n\n+|	if (Readout)\n+|	{\n+|		Readout-&gt;SetRelativeLocation(\n+|			FVector(ReadoutLocation.X, ReadoutLocation.Y, LabelZOffset));\n+|		Readout-&gt;SetRelativeRotation(LabelRotation);\n+|		Readout-&gt;SetWorldSize(ReadoutTextSize);\n+|		Readout-&gt;SetTextRenderColor(ReadoutColor);\n+|	}\n+|\n+|	if (!PayoutTable)\n+|	{\n+|		// Not fatal - the ghost chip still shows where a bet would land. Loud anyway,\n+|		// because a preview that cannot say what a bet pays is the half of this feature\n+|		// that was worth building.\n+|		UE_LOG(LogHasard, Error,\n+|			TEXT("Felt: no payout table on BP_Felt - the readout cannot state a payout"));\n+|	}\n+|\n	const AHasardChip* Chip = GetChipDefault();\n\n	const int32 Count = TableLayout-&gt;GetPositions().Num();\n	UE_LOG(LogHasard, Warning, TEXT("Felt: %d positions, %d labels, %d per click"),\n		Count, Labels.Num(), Chip ? Chip-&gt;GetChipValue() : 0);\n\n	if (bDrawDebugLayout)\n	{\n		DrawDebugLayout();\n	}\n}\n\nvoid AHasardFelt::EndPlay(const EEndPlayReason::Type EndPlayReason)\n{\n	// Unbind before the component goes. RemoveAll on a weak pointer that has already\n	// gone is a no-op, which is the whole reason it is weak.\n	if (UHasardBettingComponent* Betting = BoundBetting.Get())\n	{\n		Betting-&gt;OnBetsCleared.RemoveAll(this);\n	}\n\n+|	HidePreview();\n	ClearChips();\n\n	Super::EndPlay(EndPlayReason);\n}\n\nvoid AHasardFelt::SyncBoxToLayout()\n{\n	if (!TableLayout || !Surface)\n	{\n		return;\n	}\n\n	FVector2D Min, Max;\n	TableLayout-&gt;GetFeltBounds(Min, Max);\n\n	const FVector2D Size = Max - Min;\n	const FVector2D Center = (Max + Min) * 0.5f;\n\n	// Offset against Root, never against the actor. If Surface were the root component,\n	// setting its relative location would move the actor and shift every coordinate.\n	Surface-&gt;SetBoxExtent(FVector(Size.X * 0.5f, Size.Y * 0.5f, SurfaceThickness * 0.5f));\n	Surface-&gt;SetRelativeLocation(FVector(Center.X, Center.Y, 0.0f));\n}\n\nFVector2D AHasardFelt::WorldToFeltLocal(const FVector&amp; WorldPoint) const\n{\n	// Relative to the actor, not to the box: the box moves with GridOrigin, and the\n	// layout\'s coordinates are measured from the actor\'s own origin.\n	const FVector Local = GetActorTransform().InverseTransformPosition(WorldPoint);\n	return FVector2D(Local.X, Local.Y);\n}\n\nFVector AHasardFelt::FeltLocalToWorld(const FVector2D&amp; LocalPoint) const\n{\n	return GetActorTransform().TransformPosition(FVector(LocalPoint.X, LocalPoint.Y, 0.0f));\n}\n\nvoid AHasardFelt::OnPlayerInteract_Implementation(APawn* InstigatorPawn,\n	const FVector&amp; HitLocation)\n{\n	if (!InstigatorPawn || !TableLayout)\n	{\n		return;\n	}\n\n	UHasardBettingComponent* Betting =\n		InstigatorPawn-&gt;FindComponentByClass&lt;UHasardBettingComponent&gt;();\n	if (!Betting)\n	{\n		UE_LOG(LogHasard, Warning, TEXT("Felt: %s has no betting component"),\n			*GetNameSafe(InstigatorPawn));\n		return;\n	}\n\n	// Bound here rather than in BeginPlay: the component lives on the pawn, and the\n	// pawn is not reliably around when the felt starts. The first bet is the first\n	// moment it certainly is.\n	if (BoundBetting.Get() != Betting)\n	{\n		if (UHasardBettingComponent* Previous = BoundBetting.Get())\n		{\n			Previous-&gt;OnBetsCleared.RemoveAll(this);\n		}\n\n		Betting-&gt;OnBetsCleared.AddUObject(this, &amp;AHasardFelt::HandleBetsCleared);\n		BoundBetting = Betting;\n	}\n\n	const FVector2D Local = WorldToFeltLocal(HitLocation);\n	const int32 PositionId = TableLayout-&gt;ResolvePosition(Local);\n\n	if (PositionId == INDEX_NONE)\n	{\n		// A miss is not an error, but it is not silent either: the coordinate is the\n		// only way to tell "clicked the margin" from "the resolver is wrong".\n		UE_LOG(LogHasard, Warning, TEXT("Felt: (%.1f, %.1f) is not a bet position"),\n			Local.X, Local.Y);\n		return;\n	}\n\n	const FHasardBetPosition* Position = TableLayout-&gt;GetPositionById(PositionId);\n	if (!Position)\n	{\n		UE_LOG(LogHasard, Error, TEXT("Felt: resolved id %d has no position"), PositionId);\n		return;\n	}\n\n	UE_LOG(LogHasard, Warning, TEXT("Felt: (%.1f, %.1f) -&gt; id %d, %s"),\n		Local.X, Local.Y, PositionId, *Position-&gt;DisplayName.ToString());\n\n	const AHasardChip* Chip = GetChipDefault();\n	if (!Chip)\n	{\n		// No chip class means no stake, because the chip is where the stake lives.\n		// Refusing here is the only way to avoid inventing a number.\n		UE_LOG(LogHasard, Error, TEXT("Felt: no chip class on BP_Felt, so a click has no stake"));\n		return;\n	}\n\n	if (!Betting-&gt;PlaceBet(PositionId, Chip-&gt;GetChipValue()))\n	{\n		// Refused, so no stake was taken. Nothing may be drawn as though one was.\n		return;\n	}\n\n	// The debug sphere that used to mark this spot is gone: a real chip lands here now,\n	// and two markers for one event is one of them lying eventually.\n	SpawnChip(*Position);\n}\n\nconst AHasardChip* AHasardFelt::GetChipDefault() const\n{\n	return ChipClass ? ChipClass-&gt;GetDefaultObject&lt;AHasardChip&gt;() : nullptr;\n+|}\n+|\n+|void AHasardFelt::OnPlayerHover_Implementation(APawn* InstigatorPawn,\n+|	const FVector&amp; HitLocation)\n+|{\n+|	if (!TableLayout)\n+|	{\n+|		return;\n+|	}\n+|\n+|	// The same two calls OnPlayerInteract makes, on the same point, one frame earlier.\n+|	// That is the guarantee: the preview and the bet cannot resolve differently because\n+|	// they are the same question asked of the same resolver.\n+|	const FVector2D Local = WorldToFeltLocal(HitLocation);\n+|	const int32 PositionId = TableLayout-&gt;ResolvePosition(Local);\n+|\n+|	const FHasardBetPosition* Position = PositionId != INDEX_NONE\n+|		? TableLayout-&gt;GetPositionById(PositionId) : nullptr;\n+|\n+|	if (!Position)\n+|	{\n+|		// Aiming at the margin is not a bet, so it must not look like one.\n+|		HidePreview();\n+|		return;\n+|	}\n+|\n+|	ShowPreview(*Position);\n+|}\n+|\n+|void AHasardFelt::OnPlayerEndHover_Implementation(APawn* InstigatorPawn)\n+|{\n+|	HidePreview();\n+|}\n+|\n+|void AHasardFelt::ShowPreview(const FHasardBetPosition&amp; Position)\n+|{\n+|	const AHasardChip* Default = GetChipDefault();\n+|	UWorld* World = GetWorld();\n+|\n+|	if (!World || !Default || !PreviewMaterial)\n+|	{\n+|		HidePreview();\n+|		return;\n+|	}\n+|\n+|	if (!PreviewChip)\n+|	{\n+|		FActorSpawnParameters Params;\n+|		Params.Owner = this;\n+|\n+|		PreviewChip = World-&gt;SpawnActor&lt;AHasardChip&gt;(\n+|			ChipClass, FVector::ZeroVector, GetActorRotation(), Params);\n+|\n+|		if (!PreviewChip)\n+|		{\n+|			return;\n+|		}\n+|\n+|		// The material is the only thing separating this from a placed bet, so it is\n+|		// applied before the chip is ever made visible.\n+|		PreviewChip-&gt;SetPreviewMaterial(PreviewMaterial);\n+|	}\n+|\n+|	// On top of the stack that is already there, so the preview shows where this chip\n+|	// would land rather than where the first one did.\n+|	const int32* Count = StackCounts.Find(Position.PositionId);\n+|	const float Height = ((Count ? *Count : 0) + 0.5f) * Default-&gt;GetChipHeight();\n+|\n+|	PreviewChip-&gt;SetActorLocation(\n+|		FeltLocalToWorld(Position.ChipLocation) + GetActorUpVector() * Height);\n+|	PreviewChip-&gt;SetActorHiddenInGame(false);\n+|\n+|	// Rebuilt only when the aim moves to a different position. This runs every frame,\n+|	// and formatting text sixty times a second to produce the same string is waste.\n+|	if (PreviewPositionId != Position.PositionId)\n+|	{\n+|		PreviewPositionId = Position.PositionId;\n+|\n+|		if (Readout)\n+|		{\n+|			Readout-&gt;SetText(ReadoutTextFor(Position, *Default));\n+|			Readout-&gt;SetVisibility(true);\n+|		}\n+|	}\n+|}\n+|\n+|void AHasardFelt::HidePreview()\n+|{\n+|	if (PreviewChip)\n+|	{\n+|		PreviewChip-&gt;SetActorHiddenInGame(true);\n+|	}\n+|\n+|	if (Readout)\n+|	{\n+|		Readout-&gt;SetVisibility(false);\n+|	}\n+|\n+|	PreviewPositionId = INDEX_NONE;\n+|}\n+|\n+|FText AHasardFelt::ReadoutTextFor(const FHasardBetPosition&amp; Position,\n+|	const AHasardChip&amp; Chip) const\n+|{\n+|	const int32 Stake = Chip.GetChipValue();\n+|\n+|	const FHasardPayoutRule* Rule = PayoutTable\n+|		? PayoutTable-&gt;FindRule(Position.BetType) : nullptr;\n+|\n+|	if (!Rule)\n+|	{\n+|		// Say so plainly. A bet with no rule is one settlement will take the stake for\n+|		// and never pay, so the player is owed the warning while they can still not make\n+|		// it - this is the DA_AmericanPayouts gap, made visible instead of silent.\n+|		return FText::Format(\n+|			NSLOCTEXT("Hasard", "ReadoutNoRule", "{0}  -  this table cannot pay this bet"),\n+|			Position.DisplayName);\n+|	}\n+|\n+|	// The same arithmetic SettleRound uses. TryStake already took the stake, so a 35:1\n+|	// winner returns 36 times it.\n+|	const int32 Returns = Stake * (Rule-&gt;PayoutRatio + 1);\n+|\n+|	return FText::Format(\n+|		NSLOCTEXT("Hasard", "ReadoutFmt", "{0}  -  stake {1}, returns {2}   ({3}:1)"),\n+|		Position.DisplayName, FText::AsNumber(Stake),\n+|		FText::AsNumber(Returns), FText::AsNumber(Rule-&gt;PayoutRatio));\n}\n\nvoid AHasardFelt::SpawnChip(const FHasardBetPosition&amp; Position)\n{\n	UWorld* World = GetWorld();\n	const AHasardChip* Default = GetChipDefault();\n\n	if (!World || !Default)\n	{\n		return;\n	}\n\n	int32&amp; Count = StackCounts.FindOrAdd(Position.PositionId);\n\n	// Height from the class default, not from the mesh: the felt asks the chip how tall\n	// a chip is and does not look at how it was built.\n	const float ChipHeight = Default-&gt;GetChipHeight();\n\n	// Half a chip up for the first one, so the disc rests on the felt rather than half\n	// sunk into it. Up vector rather than +Z, so a tilted table still stacks upwards.\n	const FVector Base = FeltLocalToWorld(Position.ChipLocation);\n	const FVector Lift = GetActorUpVector() * ((Count + 0.5f) * ChipHeight);\n\n	FActorSpawnParameters Params;\n	Params.Owner = this;\n\n	if (AHasardChip* Chip = World-&gt;SpawnActor&lt;AHasardChip&gt;(\n		ChipClass, Base + Lift, GetActorRotation(), Params))\n	{\n		Chips.Add(Chip);\n		++Count;\n	}\n}\n\nvoid AHasardFelt::ClearChips()\n{\n	for (const TObjectPtr&lt;AHasardChip&gt;&amp; Chip : Chips)\n	{\n		if (Chip)\n		{\n			Chip-&gt;Destroy();\n		}\n	}\n\n	Chips.Reset();\n\n	// The counts go too. Keeping them would stack the next round\'s first chip on top of\n	// a pile that is no longer there.\n	StackCounts.Reset();\n}\n\nvoid AHasardFelt::HandleBetsCleared()\n{\n	const int32 Removed = Chips.Num();\n	ClearChips();\n\n	UE_LOG(LogHasard, Warning, TEXT("Felt: cleared %d chips"), Removed);\n}\n\nvoid AHasardFelt::DrawFelt()\n{\n	if (!TableLayout)\n	{\n		UE_LOG(LogHasard, Error, TEXT("Felt: no table layout on BP_Felt"));\n		return;\n	}\n\n	DrawDebugLayout();\n}\n\nvoid AHasardFelt::RebuildLabels()\n{\n	if (!TableLayout)\n	{\n		UE_LOG(LogHasard, Error, TEXT("Felt: no table layout on BP_Felt"));\n		return;\n	}\n\n	BuildLabels();\n	UE_LOG(LogHasard, Warning, TEXT("Felt: built %d labels"), Labels.Num());\n}\n\nvoid AHasardFelt::RebuildSurface()\n{\n	if (!TableLayout)\n	{\n		UE_LOG(LogHasard, Error, TEXT("Felt: ng in a differently sized plane should change nothing the player sees.\n	const FVector MeshSize = BoxMesh ? BoxMesh-&gt;GetBounds().BoxExtent * 2.0f : FVector::OneVector;\n	const float MeshX = FMath::IsNearlyZero(MeshSize.X) ? 1.0f : MeshSize.X;\n	const float MeshY = FMath::IsNearlyZero(MeshSize.Y) ? 1.0f : MeshSize.Y;\n\n	return FTransform(\n		FRotator::ZeroRotator,\n		FVector(Center.X, Center.Y, Height),\n		FVector(Size.X / MeshX, Size.Y / MeshY, 1.0f));\n}\n\nUMaterialInstanceDynamic* AHasardFelt::PrepareSurface(UStaticMeshComponent* Component,\n	const FColor&amp; Color) const\n{\n	if (!Component || !BoxMesh || !SurfaceMaterial)\n	{\n		return nullptr;\n	}\n\n	Component-&gt;SetStaticMesh(BoxMesh);\n\n	UMaterialInstanceDynamic* Instance = Component-&gt;CreateDynamicMaterialInstance(0, SurfaceMaterial);\n	if (Instance &amp;&amp; !ColorParameterName.IsNone())\n	{\n		// FromColor, not the FLinearColor constructor: these are authored as sRGB in the\n		// details panel, and treating those bytes as linear washes every one of them out.\n		Instance-&gt;SetVectorParameterValue(ColorParameterName, FLinearColor::FromSRGBColor(Color));\n	}\n\n	return Instance;\n}\n\nvoid AHasardFelt::BuildSurface()\n{\n	// Clear first, unconditionally. BeginPlay and the button can both land here, and a\n	// pass that only added would stack a second felt on the first.\n	Lines-&gt;ClearInstances();\n	RedBoxes-&gt;ClearInstances();\n	BlackBoxes-&gt;ClearInstances();\n	GreenBoxes-&gt;ClearInstances();\n\n	UStaticMeshComponent* const Surfaces[] = {\n		Cloth, ZeroBox, Lines, RedBoxes, BlackBoxes, GreenBoxes };\n\n	for (UStaticMeshComponent* Component : Surfaces)\n	{\n		Component-&gt;SetVisibility(bShowSurface);\n	}\n\n	if (!TableLayout || !bShowSurface)\n	{\n		return;\n	}\n\n	if (!BoxMesh || !SurfaceMaterial)\n	{\n		// Loud, because the alternative is an invisible felt that still takes bets - the\n		// table would look broken while the money kept moving.\n		UE_LOG(LogHasard, Error,\n			TEXT("Felt: BP_Felt needs both Box Mesh and Surface Material to print itself"));\n		return;\n	}\n\n	PrepareSurface(Cloth, ClothColor);\n	PrepareSurface(Lines, LineColor);\n	PrepareSurface(RedBoxes, RedBoxColor);\n	PrepareSurface(BlackBoxes, BlackBoxColor);\n	PrepareSurface(GreenBoxes, OutsideBoxColor);\n	PrepareSurface(ZeroBox, ZeroBoxColor);\n\n	FVector2D Min, Max;\n	TableLayout-&gt;GetFeltBounds(Min, Max);\n\n	const FVector2D ClothSize = (Max - Min) + FVector2D(ClothMargin * 2.0f, ClothMargin * 2.0f);\n	Cloth-&gt;SetRelativeTransform(BoxTransform((Max + Min) * 0.5f, ClothSize, 0.0f));\n\n	int32 Printed = 0;\n\n	for (const FHasardBetPosition&amp; Position : TableLayout-&gt;GetPositions())\n	{\n		// The 83 line bets sit on boundaries and own no area. This is the same test the\n		// layout answered when it generated them, asked once rather than restated here.\n		if (Position.BoxSize.IsNearlyZero())\n		{\n			continue;\n		}\n\n		// Full size on the plate, inset on the color. The difference is the printed line,\n		// so a box smaller than two borders would invert - clamp rather than let it.\n		const FVector2D Inset(\n			FMath::Max(Position.BoxSize.X - BorderWidth * 2.0f, 0.0f),\n			FMath::Max(Position.BoxSize.Y - BorderWidth * 2.0f, 0.0f));\n\n		Lines-&gt;AddInstance(\n			BoxTransform(Position.ChipLocation, Position.BoxSize, SurfaceZStep));\n\n		const FTransform Face =\n			BoxTransform(Position.ChipLocation, Inset, SurfaceZStep * 2.0f);\n\n		if (IsZeroPosition(Position))\n		{\n			ZeroBox-&gt;SetRelativeTransform(Face);\n		}\n		else\n		{\n			BoxesFor(Position, *TableLayout)-&gt;AddInstance(Face);\n		}\n\n		++Printed;\n	}\n\n	UE_LOG(LogHasard, Warning, TEXT("Felt: printed %d boxes - %d red, %d black, %d outside"),\n		Printed, RedBoxes-&gt;GetInstanceCount(), BlackBoxes-&gt;GetInstanceCount(),\n		GreenBoxes-&gt;GetInstanceCount());\n}\n\nUInstancedStaticMeshComponent* AHasardFelt::BoxesFor(const FHasardBetPosition&amp; Position,\n	const UHasardTableLayout&amp; Layout) const\n{\n	// An outside bet covers many pockets of both colors, so it has no color of its own\n	// and takes the cloth\'s. Only a straight up is one pocket, and only one pocket has\n	// a color to state. Zero never reaches here - BuildSurface routes it out first.\n	if (Position.BetType != EHasardBetType::StraightUp)\n	{\n		return GreenBoxes;\n	}\n\n	const int32 Number = Position.CoveredNumbers.Num() == 1\n		? Position.CoveredNumbers[0] : INDEX_NONE;\n\n	return Layout.IsRedNumber(Number) ? RedBoxes : BlackBoxes;\n}\n\nFText AHasardFelt::LabelTextFor(const FHasardBetPosition&amp; Position) const\n{\n	if (Position.BetType == EHasardBetType::Column)\n	{\n		// All three boxes print the same thing on a real layout, which is why the name\n		// stays on the position: the log and the readout still have to say which column.\n		return NSLOCTEXT("Hasard", "ColumnPays", "2 to 1");\n	}\n\n	return Position.DisplayName;\n}\n\nFRotator AHasardFelt::LabelRotationFor(const FHasardBetPosition&amp; Position) const\n{\n	// Only a straight up sits in a square box. Every outside bet - dozens, even money and\n	// the column boxes - is wider than it is deep, so its name runs along the long axis or\n	// it is printed across the narrow dimension and crowds both rules.\n	return Position.BetType == EHasardBetType::StraightUp ? LabelRotation : LabelRotationTurned;\n}\n\nvoid AHasardFelt::DrawDebugLayout() const\n{\n	const UWorld* World = GetWorld();\n	if (!World || !TableLayout)\n	{\n		return;\n	}\n\n	FlushPersistentDebugLines(World);\n\n	FVector2D Min, Max;\n	TableLayout-&gt;GetFeltBounds(Min, Max);\n\n	const int32 Columns = TableLayout-&gt;GetNumberColumns();\n	const int32 Rows = TableLayout-&gt;GetNumberRows();\n\n	// Outline of the whole felt, including the zero box and both outside bands.\n	const FVector2D Corners[4] = {\n		FVector2D(Min.X, Min.Y), FVector2D(Max.X, Min.Y),\n		FVector2D(Max.X, Max.Y), FVector2D(Min.X, Max.Y) };\n\n	for (int32 Index = 0; Index &lt; 4; ++Index)\n	{\n		DrawDebugLine(World, FeltLocalToWorld(Corners[Index]),\n			FeltLocalToWorld(Corners[(Index + 1) % 4]),\n			FColor::White, true, -1.0f, 0, 0.6f);\n	}\n\n	// Cell boundaries, drawn from the layout\'s own origin and cell size. The grid and the\n	// resolver therefore read the same two numbers - a grid drawn from a second copy of\n	// the arithmetic would look correct and still send clicks to the wrong cell.\n	const FVector2D Origin = TableLayout-&gt;GetGridOrigin();\n	const FVector2D Cell = TableLayout-&gt;GetCellSize();\n	const float GridFarX = Origin.X + Columns * Cell.X;\n	const float GridFarY = Origin.Y + Rows * Cell.Y;\n\n	for (int32 Column = 0; Column &lt;= Columns; ++Column)\n	{\n		const float LineX = Origin.X + Column * Cell.X;\n		DrawDebugLine(World, FeltLocalToWorld(FVector2D(LineX, Origin.Y)),\n			FeltLocalToWorld(FVector2D(LineX, GridFarY)),\n			FColor(90, 90, 90), true, -1.0f, 0, 0.3f);\n	}\n\n	for (int32 Row = 0; Row &lt;= Rows; ++Row)\n	{\n		const float LineY = Origin.Y + Row * Cell.Y;\n		DrawDebugLine(World, FeltLocalToWorld(FVector2D(Origin.X, LineY)),\n			FeltLocalToWorld(FVector2D(GridFarX, LineY)),\n			FColor(90, 90, 90), true, -1.0f, 0, 0.3f);\n	}\n\n	// The zero box, which is the one cell that is not part of the grid.\n	DrawDebugLine(World, FeltLocalToWorld(FVector2D(Min.X, Origin.Y)),\n		FeltLocalToWorld(FVector2D(Min.X, GridFarY)), FColor(90, 90, 90), true, -1.0f, 0, 0.3f);\n	DrawDebugLine(World, FeltLocalToWorld(FVector2D(Min.X, GridFarY)),\n		FeltLocalToWorld(FVector2D(Origin.X, GridFarY)), FColor(90, 90, 90), true, -1.0f, 0, 0.3f);\n	DrawDebugLine(World, FeltLocalToWorld(FVector2D(Min.X, Origin.Y)),\n		FeltLocalToWorld(FVector2D(Origin.X, Origin.Y)), FColor(90, 90, 90), true, -1.0f, 0, 0.3f);\n\n	// Every chip location. Color carries the type only as a hint; the log is the record.\n	for (const FHasardBetPosition&amp; Position : TableLayout-&gt;GetPositions())\n	{\n		const bool bInside = Position.CoveredNumbers.Num() &lt;= 6;\n		DrawDebugPoint(World, FeltLocalToWorld(Position.ChipLocation), 6.0f,\n			bInside ? FColor::Cyan : FColor::Orange, true, -1.0f);\n	}\n\n	UE_LOG(LogHasard, Warning, TEXT("Felt: drew %d chip locations, felt is %.0f x %.0f cm"),\n		TableLayout-&gt;GetPositions().Num(), Max.X - Min.X, Max.Y - Min.Y);\n}</code></pre><p><b>8.</b> <code>HasardPlayerPawn.cpp</code>. Five lines, and they are the point of the module:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#include "HasardPlayerPawn.h"\n#include "Camera/CameraComponent.h"\n#include "Components/SceneComponent.h"\n#include "Engine/LocalPlayer.h"\n#include "Engine/World.h"\n#include "EnhancedInputComponent.h"\n#include "EnhancedInputSubsystems.h"\n#include "GameFramework/PlayerController.h"\n#include "GameFramework/FloatingPawnMovement.h"\n#include "GameFramework/SpringArmComponent.h"\n#include "HasardBettingComponent.h"\n#include "InputActionValue.h"\n#include "InputMappingContext.h"\n#include "HasardGameMode.h"\n#include "HasardInteractionComponent.h"\n#include "HasardInteractable.h"\n#include "HasardWheel.h"\n#include "HasardTypes.h"\n#include "Kismet/GameplayStatics.h"\n\nAHasardPlayerPawn::AHasardPlayerPawn()\n{\n	PrimaryActorTick.bCanEverTick = false;\n\n	ViewRoot = CreateDefaultSubobject&lt;USceneComponent&gt;(TEXT("ViewRoot"));\n	RootComponent = ViewRoot;\n\n	CameraBoom = CreateDefaultSubobject&lt;USpringArmComponent&gt;(TEXT("CameraBoom"));\n	CameraBoom-&gt;SetupAttachment(ViewRoot);\n	CameraBoom-&gt;bUsePawnControlRotation = true;\n	CameraBoom-&gt;bDoCollisionTest = false;\n\n	TableCamera = CreateDefaultSubobject&lt;UCameraComponent&gt;(TEXT("TableCamera"));\n	TableCamera-&gt;SetupAttachment(CameraBoom, USpringArmComponent::SocketName);\n	TableCamera-&gt;bUsePawnControlRotation = false;\n\n	Movement = CreateDefaultSubobject&lt;UFloatingPawnMovement&gt;(TEXT("Movement"));\n\n	// A walk, not a sprint. The defaults are 1200 uu/s, which crosses the whole felt in\n	// under a second and makes aiming at a 24 cm cell a matter of luck.\n	Movement-&gt;MaxSpeed = 250.0f;\n	Movement-&gt;Acceleration = 1200.0f;\n	Movement-&gt;Deceleration = 2400.0f;\n\n	BettingComp = CreateDefaultSubobject&lt;UHasardBettingComponent&gt;(TEXT("BettingComp"));\n\n	InteractionComp =\n		CreateDefaultSubobject&lt;UHasardInteractionComponent&gt;(TEXT("InteractionComp"));\n}\n\nvoid AHasardPlayerPawn::OnConstruction(const FTransform&amp; Transform)\n{\n	Super::OnConstruction(Transform);\n\n	// HERE, not in the constructor: Blueprint overrides land afterwards.\n	if (CameraBoom)\n	{\n		CameraBoom-&gt;TargetArmLength = CameraDistance;\n	}\n}\n\nvoid AHasardPlayerPawn::BeginPlay()\n{\n	Super::BeginPlay();\n}\n\nvoid AHasardPlayerPawn::SetupPlayerInputComponent(UInputComponent* PlayerInputComponent)\n{\n	Super::SetupPlayerInputComponent(PlayerInputComponent);\n\n	if (const APlayerController* PC = Cast&lt;APlayerController&gt;(Controller))\n	{\n		if (UEnhancedInputLocalPlayerSubsystem* Subsystem =\n			ULocalPlayer::GetSubsystem&lt;UEnhancedInputLocalPlayerSubsystem&gt;(PC-&gt;GetLocalPlayer()))\n		{\n			if (TableMappingContext)\n			{\n				Subsystem-&gt;AddMappingContext(TableMappingContext, 0);\n			}\n		}\n	}\n\n	if (UEnhancedInputComponent* EIC = Cast&lt;UEnhancedInputComponent&gt;(PlayerInputComponent))\n	{\n		EIC-&gt;BindAction(LookAction,     ETriggerEvent::Triggered, this, &amp;AHasardPlayerPawn::Look);\n		EIC-&gt;BindAction(MoveAction,     ETriggerEvent::Triggered, this, &amp;AHasardPlayerPawn::Move);\n		EIC-&gt;BindAction(PlaceBetAction, ETriggerEvent::Started,   this, &amp;AHasardPlayerPawn::PlaceBet);\n		EIC-&gt;BindAction(SpinAction,     ETriggerEvent::Started,   this, &amp;AHasardPlayerPawn::RequestSpin);\n	}\n	else\n	{\n		UE_LOG(LogHasard, Error, TEXT("Not on EnhancedInputComponent"));\n	}\n}\n\nvoid AHasardPlayerPawn::Look(const FInputActionValue&amp; Value)\n{\n	const FVector2D Input = Value.Get&lt;FVector2D&gt;();\n	AddControllerYawInput(Input.X);\n	AddControllerPitchInput(Input.Y);\n}\n\nvoid AHasardPlayerPawn::Move(const FInputActionValue&amp; Value)\n{\n	const FVector2D Input = Value.Get&lt;FVector2D&gt;();\n\n	// Yaw only. Pitch belongs to the camera: looking down at the felt must not mean\n	// walking into the floor, and looking up must not lift you off it.\n	const FRotator YawOnly(0.0f, GetControlRotation().Yaw, 0.0f);\n\n	AddMovementInput(YawOnly.RotateVector(FVector::ForwardVector), Input.Y);\n	AddMovementInput(YawOnly.RotateVector(FVector::RightVector), Input.X);\n}\n\nvoid AHasardPlayerPawn::PlaceBet()\n{\n	if (!InteractionComp)\n	{\n		return;\n	}\n\n+|	// This frame\'s hover, not a fresh trace. The two would almost always agree, and the\n+|	// times they would not are the times it matters: a trace taken a frame after the one\n+|	// that drew the preview can resolve to the neighbouring position, and the player\n+|	// would be charged for a bet other than the one they were looking at.\n	FHitResult Hit;\n-|	if (!InteractionComp-&gt;TraceForInteractable(Hit))\n+|	if (!InteractionComp-&gt;GetHoveredHit(Hit))\n	{\n		return;\n	}\n\n	AActor* HitActor = Hit.GetActor();\n	if (HitActor &amp;&amp; HitActor-&gt;Implements&lt;UHasardInteractable&gt;())\n	{\n		// ImpactPoint, not the actor location: on the felt the point is the bet.\n		IHasardInteractable::Execute_OnPlayerInteract(HitActor, this, Hit.ImpactPoint);\n	}\n}\n\nvoid AHasardPlayerPawn::RequestSpin()\n{\n	AActor* Found = UGameplayStatics::GetActorOfClass(GetWorld(), AHasardWheel::StaticClass());\n	if (AHasardWheel* Wheel = Cast&lt;AHasardWheel&gt;(Found))\n	{\n		Wheel-&gt;StartSpin();\n	}\n	else\n	{\n		UE_LOG(LogHasard, Warning, TEXT("Spin requested, but there is no wheel in the level"));\n	}\n}\n\nvoid AHasardPlayerPawn::SettleRound(int32 WinningPocket)\n{\n	// Through the GameMode now, because the GameMode owns the payout table. The\n	// console test and the wheel therefore travel the same path.\n	if (AHasardGameMode* GM = GetWorld()-&gt;GetAuthGameMode&lt;AHasardGameMode&gt;())\n	{\n		GM-&gt;ResolveRound(WinningPocket);\n	}\n}</code></pre><p><b>9.</b> <kbd>Ctrl+Shift+B</kbd> with the editor closed. Expect <b>Build: 1 succeeded, 0 failed</b>.</p><p><b>Phase 2 &mdash; a material you can see through.</b></p><p><b>10.</b> In <code>Content/Materials</code>, duplicate <code>M_Chip</code> and name it <code>M_ChipPreview</code>. Open it and set <b>Blend Mode</b> to <b>Translucent</b> in the details panel, then drag a <b>Constant</b> of <b>0.35</b> into <b>Opacity</b>. Leave the <b>Color</b> parameter alone &mdash; the chip writes its denomination into it exactly as before. Save.</p><p>0.35 is low enough that a placed chip and a ghost chip are never mistaken for each other at a glance. That is the only thing this material has to achieve, and it is worth checking on the table rather than in the material editor.</p><p><b>Phase 3 &mdash; wire it up.</b></p><p><b>11.</b> Open <code>BP_Felt</code> &rarr; <b>Class Defaults</b>. Under <b>Hasard | Felt</b> set <b>Payout Table</b> to <code>DA_EuropeanPayouts</code> &mdash; <b>the same asset <code>BP_HasardGameMode</code> holds.</b> Two different payout assets would mean the readout quotes one price and settlement pays another.</p><p><b>12.</b> Under <b>Hasard | Preview</b>, set <b>Preview Material</b> to <code>M_ChipPreview</code>. Leave <b>Readout Location</b>, <b>Readout Text Size</b> and <b>Readout Color</b> at their defaults for now. Compile and save.</p><p><b>13.</b> Open <code>BP_PlayerPawn</code> &rarr; select <b>InteractionComp</b> &rarr; <b>Hasard | Interaction</b>. Set <b>Trace Radius</b> to <b>0</b> if it is not already &mdash; the C++ default changed this module, but a value you saved by hand is an override and wins. Compile and save.</p><p><b>Phase 4 &mdash; aim before you spend.</b></p><p><b>14.</b> Press <b>Play</b> and look at the felt without clicking. A translucent chip follows your aim, and the readout on the near edge names the bet: <code>17 - stake 5, returns 180 (35:1)</code>. Move onto a line and it becomes a split at 17:1; onto <code>RED</code> and it is 1:1.</p><p><b>15.</b> <b>The check that matters.</b> Aim at the very centre of a number. The ghost chip should sit under the crosshair, not off to one side. Before this module the trace started at the pawn rather than the camera, so it could not &mdash; and the further you set <b>Camera Distance</b>, the further off it was. Walk backwards and forwards and confirm it stays put.</p><p><b>16.</b> Look off the table entirely. The chip and the readout both disappear. Look at the margin of the felt &mdash; inside the collision box but not on any position &mdash; and they disappear there too, because aiming at nothing must not look like aiming at something.</p><p><b>17.</b> Now click. The chip that lands is in the same place the ghost was, and the log reads:</p><pre><code>LogHasard: Warning: Felt: (164.3, 55.5) -&gt; id 21, 21\nLogHasard: Warning: Bankroll: balance 495 (-5), session net -5\nLogHasard: Warning: Bets: 1, total staked: 5</code></pre><p><b>18.</b> Click the same cell four more times. The ghost chip rises with the stack, always showing where the <i>next</i> one goes rather than where the first one went.</p><p><b>19.</b> Point <code>BP_Felt</code>&rsquo;s <b>Payout Table</b> at <code>DA_AmericanPayouts</code> and aim at the line between 0 and 1. The readout says <code>Trio 0/1/2 - this table cannot pay this bet</code>, because that asset has no Trio row. Set it back to <code>DA_EuropeanPayouts</code>. You have just seen a bug that has been in the project since module 3 say so out loud instead of taking the stake quietly.</p><p><b>20.</b> Commit.</p><pre><code>git add -A\ngit commit -m "Preview the bet before the stake is taken" -m "The aim is traced every frame and the click reads that cached hit rather than\ntracing again, so the bet placed is the bet that was previewed. The readout\nnames the position and what it returns, using settlement\'s own arithmetic."</code></pre>'}
],
quiz:[
{q:'The trace started at <code>GetActorEyesViewPoint</code> rather than the camera. That was:',
 opts:['A deliberate choice for VR, where the ray should come from the head','The engine\'s default answer for a pawn, inherited without a decision - and wrong for VR too, where the origin is the HMD or a controller','Required because the camera is on a spring arm','Correct until CameraDistance was introduced'],
 c:1,why:'APawn returns its own location plus BaseEyeHeight. VR wants the origin to be something the component is told, which is exactly what moving to GetPlayerViewPoint makes possible.'},
{q:'<code>PlaceBet</code> reads the cached hover hit instead of tracing again because:',
 opts:['Tracing twice a frame is expensive','The hover trace is more accurate','TraceForInteractable is now private','Two traces a frame apart can resolve to different positions, so the player could be charged for a bet other than the one they were shown - and nothing downstream would report it'],
 c:3,why:'Every downstream system would be correct about the bet that was actually resolved. The only wrong thing is unrepresentable in the logs, which is why it is closed structurally.'},
{q:'A ghost chip is spawned from <code>ChipClass</code> rather than a separate <code>BP_ChipPreview</code> because:',
 opts:['A preview class would carry its own ChipValue and ChipHeight, so it could show a five while the real chip costs ten','Spawning is faster','TSubclassOf cannot hold two classes','The preview needs collision and BP_ChipPreview would not have it'],
 c:0,why:'Module 6 put the stake on the chip class so value and appearance could not disagree. A preview class puts the disagreement back, at the moment it does the most damage.'},
{q:'<code>ClearHover</code> is called from four places. Missing one would mean:',
 opts:['The hover fires twice per frame','The trace origin drifts','A translucent chip and a readout left on the felt for a bet nobody is making','The click would resolve to the wrong position'],
 c:2,why:'Anything shown on hover is hidden only by the matching end. Same argument as DropAllBets covering all four exits of SettleRound in module 6.'},
{q:'The readout computes the return as <code>Stake * (PayoutRatio + 1)</code> rather than <code>Stake * PayoutRatio</code> because:',
 opts:['The extra 1 is the house edge','PayoutRatio is stored one lower than the real ratio','It rounds better','TryStake already took the stake when the bet was placed, so a 35:1 winner gets 36 times it back - and it is settlement\'s own expression, not a second one that agrees'],
 c:3,why:'Quoting 175 while the bankroll credits 180 would be wrong in the player\'s favour, which is still a readout that does not match what happens.'},
{q:'Aiming at a trio with <code>DA_AmericanPayouts</code> assigned makes the readout say the table cannot pay it. That is:',
 opts:['A new bug introduced by the readout','A bug that has existed since module 3 finally becoming audible before the stake is taken, rather than after','The payout table being fixed by this module','Only a problem on the American wheel, so not worth reporting'],
 c:1,why:'The asset has 13 rules and no Trio row. This module does not fix it - it moves the moment the player finds out from after the money has gone to before.'},
]
},


/* ---------------------------------------------------------- 9 */
{
grp:"Part IV \u2014 The Session",
num:"09",
title:"A sitting that starts, and is remembered",
lede:"Every launch hands the player 500 and forgets what the last one cost. This module gives the sitting a beginning the player chooses, and a record that nothing on that screen can shrink.",
blocks:[
{t:'h',x:'Three things a launch currently forgets'},
{t:'p',x:'Press Play and the map loads, the balance is 500, and the session clock is already running. Read that again as three separate claims. The bankroll says this is a fresh start; the clock says the sitting began when the level did; and everything the previous sitting cost is gone without anything having been said about it.'},
{t:'p',x:'None of the three is a bug in the sense of something behaving other than as written. They are all defaults nobody chose, which is the same shape as the trace origin in module 8 &mdash; inherited rather than decided, and wrong once you look at it.'},
{t:'rg',lab:'A total that resets is a hidden total',x:'<p>CLAUDE.md requires running spend to be visible in the play space rather than buried in a menu. It does not say <i>per launch</i>, and the reason is that the distinction does not exist for the player. Somebody who plays for twenty minutes on four evenings has spent four evenings\' worth, and a game that greets them each time with a clean slate has told them a smaller number four times.</p><p>So the record survives the process, and the only figure a new session is allowed to reset is the balance in front of them.</p>'},
{t:'h',x:'The clock must not start before the player does'},
{t:'p',x:'<code>SessionStartRealTime</code> is stamped in <code>BeginPlay</code> today. Put a start screen in front of the table and that stamp now includes however long the player spent reading it &mdash; and the reality check, which fires on the same clock, arrives that much sooner.'},
{t:'p',x:'It is the mirror of the decision guide 2 already made. World time was refused because a paused game understates the sitting; a clock started at level load overstates it. Both are wrong in the same way: the number stops being a measurement of playing.'},
{t:'p',x:'So <code>StartSession</code> is a function the controller calls, and the only thing that calls it is the player choosing how the sitting begins.'},
{t:'warn',lab:'Zero is not a small number here',x:'<p><code>FPlatformTime::Seconds()</code> is offset past 2<sup>24</sup> on Windows, deliberately, so that storing it in a <code>float</code> breaks visibly. Until <code>StartSession</code> runs, <code>SessionStartRealTime</code> is <code>0.0</code> &mdash; so the subtraction returns the raw platform stamp and the HUD opens on roughly <b>194 days played</b>.</p><p>That is why <code>GetSessionElapsedSeconds</code> gains a guard rather than being left to sort itself out. The guard is not defensive coding; it is the answer to a question the function is now being asked before it has one.</p>'},
{t:'chk',q:'The guard tests <code>SessionStartRealTime == 0.0</code> rather than a <code>bool bSessionStarted</code>. Why is that the better test?',a:'<p><b>Because a bool would be the same fact stored twice.</b> The stamp already answers &ldquo;has the session started&rdquo; &mdash; it is zero until it is set, and it is set exactly once, in the one function that starts the session. A bool alongside it is a second thing to keep in step, and the day the two disagree the clock reports a session that never began or hides one that did.</p><p>This is the recurring shape in this project: <code>BoxSize</code> is both the extent and the &ldquo;is it drawn&rdquo; test, the chip carries its own stake, and a bet is an id rather than an id plus a type.</p>'},
{t:'h',x:'Prior and session, and no third pair'},
{t:'p',x:'The bankroll has carried <code>TotalStaked</code> and <code>TotalWon</code> since guide 2, and their names have quietly meant <i>this session</i> the whole time. Now that a second span exists they have to say so, so they become <code>SessionStaked</code> and <code>SessionWon</code>, and the figures loaded from the save sit beside them as <code>PriorStaked</code> and <code>PriorWon</code>.'},
{t:'table',head:['Figure','Where it comes from','What resets it'],rows:[
['<code>Balance</code>','Play, or the save on continue','A new session'],
['<code>SessionStaked</code> / <code>SessionWon</code>','This sitting only','Every launch, by construction'],
['<code>PriorStaked</code> / <code>PriorWon</code>','<code>ApplySave</code>, and nothing else','Nothing in this project'],
['<code>GetLifetimeStaked()</code>','Computed: prior plus session','Not stored, so not resettable']]},
{t:'p',x:'The lifetime figures are deliberately not fields. A third pair kept in step with the other two would be the same fact in two places, and this repo has met that failure enough times to name it &mdash; the day they disagreed, the smaller pair would be the one on screen.'},
{t:'aside',lab:'The rename is the risky part of this module',x:'<p>Renaming a <code>UPROPERTY</code> silently drops whatever an asset had saved under the old name: no error, no warning, just the default back on the next load. Here it costs nothing, because <code>TotalStaked</code> and <code>TotalWon</code> are <code>VisibleAnywhere</code> runtime state that no Blueprint overrides &mdash; they are zero at <code>BeginPlay</code> either way.</p><p>Worth knowing before the day it is a tuning value somebody spent an afternoon on. The safe order is: rename in C++, build, then check the Blueprint still shows what you expect rather than assuming it does.</p>'},
{t:'h',x:'One function holds the whole of the new-session decision'},
{t:'p',x:'Everything the start screen decides lands in three lines, and the asymmetry between them is the design:'},
{t:'code',x:'PriorStaked = Save.LifetimeStaked;\nPriorWon    = Save.LifetimeWon;\n\nBalance = bContinuePrevious ? Save.Balance : StartingBalance;'},
{t:'rg',lab:'There is no branch that clears the record',x:'<p>The two lifetime reads sit <b>above</b> the conditional and are not part of it. Whatever the player picks, what they have already staked is restored &mdash; a new session hands them a fresh 500 and keeps saying, on the HUD, what every session before it cost.</p><p>Written the obvious way, <code>bContinuePrevious</code> would guard all three lines and &ldquo;Start new session&rdquo; would zero the record. That is the commercial default, and it is the specific pattern the anti-patterns list means by a hidden spend total: nothing false is ever displayed, the true number is simply thrown away where the player cannot see it happen.</p>'},
{t:'h',x:'Refusing a save this build cannot read'},
{t:'p',x:'<code>Version</code> is stamped into the file and checked on load. A mismatch is refused rather than migrated, and the sitting starts as though there were no save at all.'},
{t:'p',x:'That looks harsh for a prototype, and it is the same argument as everything else here. Fields get added over time; occasionally one changes meaning, and a <code>LifetimeStaked</code> read under the old meaning is a number about something else printed under a label the player trusts. There is no honest guess available, so the code does not make one.'},
{t:'chk',q:'The version check is on <i>meaning</i>, not on the field list. What does that let you do without bumping it?',a:'<p><b>Add a field.</b> An older save simply has no value for it, and Unreal leaves it at its declared default &mdash; which is what a save that predates the feature honestly implies. <code>SessionsPlayed</code> arriving in a later version reads as zero on an old save, and zero is true of a record that was never counting.</p><p>What forces a bump is a field whose stored numbers stop meaning what they used to: <code>LifetimeSeconds</code> switching from seconds to minutes, or <code>LifetimeWon</code> starting to include returned stakes. The bytes still load, which is exactly why the check has to be explicit.</p>'},
{t:'h',x:'What the start screen is not allowed to be'},
{t:'p',x:'It shows the last balance and the lifetime figures, because a choice between continuing and starting fresh is not a choice at all if you cannot see what continuing means. Beyond that it does two things, both of which are refusals.'},
{t:'list',x:['<b>No default and no timer.</b> Neither button is pre-selected and nothing happens if the player walks away. A screen that starts playing on its own has made the decision for them.','<b>No persuasion.</b> Neither option is framed as the better one, and the last balance is stated rather than sold. &ldquo;You still have 340 waiting&rdquo; is a nudge; <i>Balance: 340</i> is a fact.']},
{t:'p',x:'The suppression is the same trick guide 2 module 6 built for the reality check &mdash; a mapping context that maps every table key to <code>IA_Blocked</code> &mdash; pushed one priority higher. Nothing on the table can be touched before the sitting has a beginning.'},
{t:'srcs',x:[['Saving and loading','https://dev.epicgames.com/documentation/en-us/unreal-engine/saving-and-loading-your-game-in-unreal-engine'],['UserWidget','https://dev.epicgames.com/documentation/en-us/unreal-engine/umg-ui-designer-quick-start-guide-in-unreal-engine'],['Enhanced Input','https://dev.epicgames.com/documentation/en-us/unreal-engine/enhanced-input-in-unreal-engine']]},
{t:'build',title:'A sitting with a beginning',file:'Source/Hasard/ - ten files, two new',x:'<p><b>1.</b> <b>Tools &rarr; New C++ Class</b>. Tick <b>Show All Classes</b>, search <b>SaveGame</b>, pick it as the parent and name the class <code>HasardSaveGame</code>. Confirm module <b>Hasard (Runtime)</b>. Decline the offer to open it.</p><p><b>Phase 2 &mdash; Visual Studio.</b> Ten files, two of them new. The other eight are complete and marked against what is on disk, which is where guide 2 left them.</p><p><b>2.</b> <code>HasardSaveGame.h</code>. The record, and nothing that is not part of it:</p><pre><code>+|// Copyright Picardbuilds. All Rights Reserved.\n+|\n+|#pragma once\n+|\n+|#include "CoreMinimal.h"\n+|#include "GameFramework/SaveGame.h"\n+|#include "HasardSaveGame.generated.h"\n+|\n+|/**\n+| * Everything that outlives a sitting.\n+| *\n+| * Deliberately not just a balance. What has to survive a launch is the record of what\n+| * playing has cost, and the balance is one line of it - a game that restores your money\n+| * and forgets your losses shows you a smaller number every time you open it.\n+| */\n+|UCLASS()\n+|class HASARD_API UHasardSaveGame : public USaveGame\n+|{\n+|	GENERATED_BODY()\n+|\n+|public:\n+|	/** The one slot this game ever writes. One player, one record. */\n+|	static const TCHAR* SlotName;\n+|\n+|	/** No profiles and no split screen, so this is a constant rather than a parameter. */\n+|	static constexpr int32 UserIndex = 0;\n+|\n+|	/**\n+|	 * Bumped when a field below changes meaning, not when one is added.\n+|	 *\n+|	 * A save written by an older version is refused rather than read. A misread\n+|	 * LifetimeStaked is a false statement about spend, and there is no safe guess.\n+|	 */\n+|	static constexpr int32 CurrentVersion = 1;\n+|\n+|	UPROPERTY()\n+|	int32 Version = CurrentVersion;\n+|\n+|	/** What was left when the last sitting ended. The only field a new session ignores. */\n+|	UPROPERTY()\n+|	int32 Balance = 0;\n+|\n+|	/** Across every sitting. Nothing in this project ever writes a smaller value here. */\n+|	UPROPERTY()\n+|	int32 LifetimeStaked = 0;\n+|\n+|	UPROPERTY()\n+|	int32 LifetimeWon = 0;\n+|\n+|	/** Wall-clock seconds across every sitting, on the same terms as the session clock. */\n+|	UPROPERTY()\n+|	float LifetimeSeconds = 0.0f;\n+|\n+|	UPROPERTY()\n+|	int32 SessionsPlayed = 0;\n+|};</code></pre><p><b>3.</b> <code>HasardSaveGame.cpp</code>. One line, because the slot name is the only thing that cannot live in the header:</p><pre><code>+|// Copyright Picardbuilds. All Rights Reserved.\n+|\n+|#include "HasardSaveGame.h"\n+|\n+|// Named for the game rather than something generic: slots live in a shared folder per\n+|// user, so "Session" alone would be a collision waiting for the second project.\n+|const TCHAR* UHasardSaveGame::SlotName = TEXT("HasardSession");</code></pre><p><b>4.</b> <code>HasardBankrollComponent.h</code>. Session and prior, kept apart by their names:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"\n#include "Components/ActorComponent.h"\n#include "HasardBankrollComponent.generated.h"\n+|\n+|class UHasardSaveGame;\n\nDECLARE_DYNAMIC_MULTICAST_DELEGATE_ThreeParams(FOnBankrollChanged,\n	int32, NewBalance, int32, Delta, int32, SessionNetChange);\n\nUCLASS( ClassGroup=(Hasard), meta=(BlueprintSpawnableComponent) )\nclass HASARD_API UHasardBankrollComponent : public UActorComponent\n{\n	GENERATED_BODY()\n\npublic:	\n	UHasardBankrollComponent();\n\n	/** BlueprintAssignable requires a dynamic multicast delegate. Nothing else qualifies. */\n	UPROPERTY(BlueprintAssignable, Category = "Hasard|Bankroll")\n	FOnBankrollChanged OnBankrollChanged;\n\n	/** Deducts Amount and broadcasts. Returns false and changes nothing if it will not cover. */\n	UFUNCTION(BlueprintCallable, Category = "Hasard|Bankroll")\n	bool TryStake(int32 Amount);\n\n	UFUNCTION(BlueprintCallable, Category = "Hasard|Bankroll")\n	void CreditWinnings(int32 Amo
