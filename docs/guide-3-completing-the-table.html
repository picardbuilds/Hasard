d must never be printed as though it were.\n	 */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Labels",\n		meta = (AllowPrivateAccess = "true"))\n	FColor ZeroLabelColor = FColor(20, 130, 60);\n\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Labels",\n		meta = (AllowPrivateAccess = "true"))\n	FColor OutsideLabelColor = FColor(40, 40, 40);\n};\n</code></pre><p><b>7.</b> <code>HasardFelt.cpp</code>. The debug sphere comes out and a chip goes in:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#include "HasardFelt.h"\n#include "HasardBettingComponent.h"\n+|#include "HasardChip.h"\n#include "HasardTableLayout.h"\n#include "HasardTypes.h"\n#include "Components/BoxComponent.h"\n#include "Components/SceneComponent.h"\n#include "Components/TextRenderComponent.h"\n#include "DrawDebugHelpers.h"\n#include "Engine/World.h"\n#include "GameFramework/Pawn.h"\n\n/**\n * Which bets get their name printed on the felt.\n *\n * The line bets do not, and that is not an omission: a split has no box of its own, so\n * "17/18" would have to be printed on the line between two numbers. A real layout leaves\n * those unlabeled too - the preview names them instead.\n *\n * No default case, deliberately. Adding an enumerator without deciding whether it is\n * named on the felt then fails the build rather than shipping a bet nobody can read.\n */\nstatic bool IsNamedOnFelt(EHasardBetType BetType)\n{\n	switch (BetType)\n	{\n	case EHasardBetType::StraightUp:\n	case EHasardBetType::Dozen:\n	case EHasardBetType::Column:\n	case EHasardBetType::Red:\n	case EHasardBetType::Black:\n	case EHasardBetType::Even:\n	case EHasardBetType::Odd:\n	case EHasardBetType::Low:\n	case EHasardBetType::High:\n		return true;\n\n	case EHasardBetType::Split:\n	case EHasardBetType::Street:\n	case EHasardBetType::Trio:\n	case EHasardBetType::Corner:\n	case EHasardBetType::Basket:\n	case EHasardBetType::SixLine:\n		return false;\n	}\n\n	// Unreachable while every enumerator is listed above. Kept because the compiler\n	// requires a return, and it is the line a missing case would fall through to.\n	return false;\n}\n\nAHasardFelt::AHasardFelt()\n{\n	PrimaryActorTick.bCanEverTick = false;\n\n	Root = CreateDefaultSubobject&lt;USceneComponent&gt;(TEXT("Root"));\n	SetRootComponent(Root);\n\n	Surface = CreateDefaultSubobject&lt;UBoxComponent&gt;(TEXT("Surface"));\n	Surface-&gt;SetupAttachment(Root);\n\n	// Visibility is the channel the interaction trace sweeps on.\n	Surface-&gt;SetCollisionEnabled(ECollisionEnabled::QueryOnly);\n	Surface-&gt;SetCollisionResponseToAllChannels(ECR_Ignore);\n	Surface-&gt;SetCollisionResponseToChannel(ECC_Visibility, ECR_Block);\n}\n\nvoid AHasardFelt::OnConstruction(const FTransform&amp; Transform)\n{\n	Super::OnConstruction(Transform);\n\n	// Resized here as well as in BeginPlay, so assigning the asset in the editor\n	// shows the right box immediately rather than after the next Play.\n	SyncBoxToLayout();\n}\n\nvoid AHasardFelt::BeginPlay()\n{\n	Super::BeginPlay();\n\n	if (!TableLayout)\n	{\n		UE_LOG(LogHasard, Error, TEXT("Felt: no table layout on BP_Felt - clicks cannot resolve"));\n		return;\n	}\n\n	SyncBoxToLayout();\n\n	BuildLabels();\n\n+|	const AHasardChip* Chip = GetChipDefault();\n+|\n	const int32 Count = TableLayout-&gt;GetPositions().Num();\n-|	UE_LOG(LogHasard, Warning, TEXT("Felt: %d positions, %d labels, stake %d per click"),\n-|		Count, Labels.Num(), StakePerClick);\n+|	UE_LOG(LogHasard, Warning, TEXT("Felt: %d positions, %d labels, %d per click"),\n+|		Count, Labels.Num(), Chip ? Chip-&gt;GetChipValue() : 0);\n\n	if (bDrawDebugLayout)\n	{\n		DrawDebugLayout();\n	}\n+|}\n+|\n+|void AHasardFelt::EndPlay(const EEndPlayReason::Type EndPlayReason)\n+|{\n+|	// Unbind before the component goes. RemoveAll on a weak pointer that has already\n+|	// gone is a no-op, which is the whole reason it is weak.\n+|	if (UHasardBettingComponent* Betting = BoundBetting.Get())\n+|	{\n+|		Betting-&gt;OnBetsCleared.RemoveAll(this);\n+|	}\n+|\n+|	ClearChips();\n+|\n+|	Super::EndPlay(EndPlayReason);\n}\n\nvoid AHasardFelt::SyncBoxToLayout()\n{\n	if (!TableLayout || !Surface)\n	{\n		return;\n	}\n\n	FVector2D Min, Max;\n	TableLayout-&gt;GetFeltBounds(Min, Max);\n\n	const FVector2D Size = Max - Min;\n	const FVector2D Center = (Max + Min) * 0.5f;\n\n	// Offset against Root, never against the actor. If Surface were the root component,\n	// setting its relative location would move the actor and shift every coordinate.\n	Surface-&gt;SetBoxExtent(FVector(Size.X * 0.5f, Size.Y * 0.5f, SurfaceThickness * 0.5f));\n	Surface-&gt;SetRelativeLocation(FVector(Center.X, Center.Y, 0.0f));\n}\n\nFVector2D AHasardFelt::WorldToFeltLocal(const FVector&amp; WorldPoint) const\n{\n	// Relative to the actor, not to the box: the box moves with GridOrigin, and the\n	// layout\'s coordinates are measured from the actor\'s own origin.\n	const FVector Local = GetActorTransform().InverseTransformPosition(WorldPoint);\n	return FVector2D(Local.X, Local.Y);\n}\n\nFVector AHasardFelt::FeltLocalToWorld(const FVector2D&amp; LocalPoint) const\n{\n	return GetActorTransform().TransformPosition(FVector(LocalPoint.X, LocalPoint.Y, 0.0f));\n}\n\nvoid AHasardFelt::OnPlayerInteract_Implementation(APawn* InstigatorPawn,\n	const FVector&amp; HitLocation)\n{\n	if (!InstigatorPawn || !TableLayout)\n	{\n		return;\n	}\n\n	UHasardBettingComponent* Betting =\n		InstigatorPawn-&gt;FindComponentByClass&lt;UHasardBettingComponent&gt;();\n	if (!Betting)\n	{\n		UE_LOG(LogHasard, Warning, TEXT("Felt: %s has no betting component"),\n			*GetNameSafe(InstigatorPawn));\n		return;\n	}\n\n+|	// Bound here rather than in BeginPlay: the component lives on the pawn, and the\n+|	// pawn is not reliably around when the felt starts. The first bet is the first\n+|	// moment it certainly is.\n+|	if (BoundBetting.Get() != Betting)\n+|	{\n+|		if (UHasardBettingComponent* Previous = BoundBetting.Get())\n+|		{\n+|			Previous-&gt;OnBetsCleared.RemoveAll(this);\n+|		}\n+|\n+|		Betting-&gt;OnBetsCleared.AddUObject(this, &amp;AHasardFelt::HandleBetsCleared);\n+|		BoundBetting = Betting;\n+|	}\n+|\n	const FVector2D Local = WorldToFeltLocal(HitLocation);\n	const int32 PositionId = TableLayout-&gt;ResolvePosition(Local);\n\n	if (PositionId == INDEX_NONE)\n	{\n		// A miss is not an error, but it is not silent either: the coordinate is the\n		// only way to tell "clicked the margin" from "the resolver is wrong".\n		UE_LOG(LogHasard, Warning, TEXT("Felt: (%.1f, %.1f) is not a bet position"),\n			Local.X, Local.Y);\n		return;\n	}\n\n	const FHasardBetPosition* Position = TableLayout-&gt;GetPositionById(PositionId);\n	if (!Position)\n	{\n		UE_LOG(LogHasard, Error, TEXT("Felt: resolved id %d has no position"), PositionId);\n		return;\n	}\n\n	UE_LOG(LogHasard, Warning, TEXT("Felt: (%.1f, %.1f) -&gt; id %d, %s"),\n		Local.X, Local.Y, PositionId, *Position-&gt;DisplayName.ToString());\n\n-|	if (!Betting-&gt;PlaceBet(PositionId, StakePerClick))\n+|	const AHasardChip* Chip = GetChipDefault();\n+|	if (!Chip)\n+|	{\n+|		// No chip class means no stake, because the chip is where the stake lives.\n+|		// Refusing here is the only way to avoid inventing a number.\n+|		UE_LOG(LogHasard, Error, TEXT("Felt: no chip class on BP_Felt, so a click has no stake"));\n+|		return;\n+|	}\n+|\n+|	if (!Betting-&gt;PlaceBet(PositionId, Chip-&gt;GetChipValue()))\n	{\n		// Refused, so no stake was taken. Nothing may be drawn as though one was.\n		return;\n	}\n\n~|	// The debug sphere that used to mark this spot is gone: a real chip lands here now,\n~|	// and two markers for one event is one of them lying eventually.\n-|	if (const UWorld* World = GetWorld())\n+|	SpawnChip(*Position);\n+|}\n+|\n+|const AHasardChip* AHasardFelt::GetChipDefault() const\n~|{\n-|		DrawDebugSphere(World, FeltLocalToWorld(Position-&gt;ChipLocation),\n-|			2.0f, 8, FColor::Yellow, false, 4.0f);\n+|	return ChipClass ? ChipClass-&gt;GetDefaultObject&lt;AHasardChip&gt;() : nullptr;\n~|}\n+|\n+|void AHasardFelt::SpawnChip(const FHasardBetPosition&amp; Position)\n+|{\n+|	UWorld* World = GetWorld();\n+|	const AHasardChip* Default = GetChipDefault();\n+|\n+|	if (!World || !Default)\n+|	{\n+|		return;\n+|	}\n+|\n+|	int32&amp; Count = StackCounts.FindOrAdd(Position.PositionId);\n+|\n+|	// Height from the class default, not from the mesh: the felt asks the chip how tall\n+|	// a chip is and does not look at how it was built.\n+|	const float ChipHeight = Default-&gt;GetChipHeight();\n+|\n+|	// Half a chip up for the first one, so the disc rests on the felt rather than half\n+|	// sunk into it. Up vector rather than +Z, so a tilted table still stacks upwards.\n+|	const FVector Base = FeltLocalToWorld(Position.ChipLocation);\n+|	const FVector Lift = GetActorUpVector() * ((Count + 0.5f) * ChipHeight);\n+|\n+|	FActorSpawnParameters Params;\n+|	Params.Owner = this;\n+|\n+|	if (AHasardChip* Chip = World-&gt;SpawnActor&lt;AHasardChip&gt;(\n+|			ChipClass, Base + Lift, GetActorRotation(), Params))\n+|	{\n+|		Chips.Add(Chip);\n+|		++Count;\n+|	}\n+|}\n+|\n+|void AHasardFelt::ClearChips()\n+|{\n+|	for (const TObjectPtr&lt;AHasardChip&gt;&amp; Chip : Chips)\n+|	{\n+|		if (Chip)\n+|		{\n+|			Chip-&gt;Destroy();\n+|		}\n+|	}\n+|\n+|	Chips.Reset();\n+|\n+|	// The counts go too. Keeping them would stack the next round\'s first chip on top of\n+|	// a pile that is no longer there.\n+|	StackCounts.Reset();\n+|}\n+|\n+|void AHasardFelt::HandleBetsCleared()\n+|{\n+|	const int32 Removed = Chips.Num();\n+|	ClearChips();\n+|\n+|	UE_LOG(LogHasard, Warning, TEXT("Felt: cleared %d chips"), Removed);\n}\n\nvoid AHasardFelt::DrawFelt()\n{\n	if (!TableLayout)\n	{\n		UE_LOG(LogHasard, Error, TEXT("Felt: no table layout on BP_Felt"));\n		return;\n	}\n\n	DrawDebugLayout();\n}\n\nvoid AHasardFelt::RebuildLabels()\n{\n	if (!TableLayout)\n	{\n		UE_LOG(LogHasard, Error, TEXT("Felt: no table layout on BP_Felt"));\n		return;\n	}\n\n	BuildLabels();\n	UE_LOG(LogHasard, Warning, TEXT("Felt: built %d labels"), Labels.Num());\n}\n\nvoid AHasardFelt::BuildLabels()\n{\n	// Destroy first, unconditionally. BeginPlay and the button can both land here, and a\n	// pass that only added would print every number twice at the same spot.\n	for (const TObjectPtr&lt;UTextRenderComponent&gt;&amp; Existing : Labels)\n	{\n		if (Existing)\n		{\n			Existing-&gt;DestroyComponent();\n		}\n	}\n	Labels.Reset();\n\n	if (!TableLayout || !Root || !bShowLabels)\n	{\n		return;\n	}\n\n	// One pass over the generated positions, so a label cannot sit anywhere the resolver\n	// disagrees with. There is no second list of numbers and no second set of coordinates.\n	for (const FHasardBetPosition&amp; Position : TableLayout-&gt;GetPositions())\n	{\n		if (!IsNamedOnFelt(Position.BetType))\n		{\n			continue;\n		}\n\n		UTextRenderComponent* Label = NewObject&lt;UTextRenderComponent&gt;(this);\n\n		// Movable before registering, or setting the transform afterwards warns and is\n		// ignored: a component created at runtime defaults to static.\n		Label-&gt;SetMobility(EComponentMobility::Movable);\n		Label-&gt;RegisterComponent();\n		Label-&gt;AttachToComponent(Root, FAttachmentTransformRules::KeepRelativeTransform);\n\n		Label-&gt;SetRelativeLocation(\n			FVector(Position.ChipLocation.X, Position.ChipLocation.Y, LabelZOffset));\n		Label-&gt;SetRelativeRotation(LabelRotation);\n\n		Label-&gt;SetText(Position.DisplayName);\n		Label-&gt;SetWorldSize(LabelTextSize);\n		Label-&gt;SetHorizontalAlignment(EHTA_Center);\n		Label-&gt;SetVerticalAlignment(EVRTA_TextCenter);\n		Label-&gt;SetTextRenderColor(LabelColorFor(Position, *TableLayout));\n\n		Labels.Add(Label);\n	}\n}\n\nFColor AHasardFelt::LabelColorFor(const FHasardBetPosition&amp; Position,\n	const UHasardTableLayout&amp; Layout) const\n{\n	if (Position.BetType != EHasardBetType::StraightUp)\n	{\n		return OutsideLabelColor;\n	}\n\n	// A straight up covers exactly one pocket. Reading past that would be reading a\n	// position this function was not given.\n	const int32 Number = Position.CoveredNumbers.Num() == 1\n		? Position.CoveredNumbers[0] : INDEX_NONE;\n\n	if (Number == 0)\n	{\n		return ZeroLabelColor;\n	}\n\n	return Layout.IsRedNumber(Number) ? RedNumberColor : BlackNumberColor;\n}\n\nvoid AHasardFelt::DrawDebugLayout() const\n{\n	const UWorld* World = GetWorld();\n	if (!World || !TableLayout)\n	{\n		return;\n	}\n\n	FlushPersistentDebugLines(World);\n\n	FVector2D Min, Max;\n	TableLayout-&gt;GetFeltBounds(Min, Max);\n\n	const int32 Columns = TableLayout-&gt;GetNumberColumns();\n	const int32 Rows = TableLayout-&gt;GetNumberRows();\n\n	// Outline of the whole felt, including the zero box and both outside bands.\n	const FVector2D Corners[4] = {\n		FVector2D(Min.X, Min.Y), FVector2D(Max.X, Min.Y),\n		FVector2D(Max.X, Max.Y), FVector2D(Min.X, Max.Y) };\n\n	for (int32 Index = 0; Index &lt; 4; ++Index)\n	{\n		DrawDebugLine(World, FeltLocalToWorld(Corners[Index]),\n			FeltLocalToWorld(Corners[(Index + 1) % 4]),\n			FColor::White, true, -1.0f, 0, 0.6f);\n	}\n\n	// Cell boundaries, drawn from the layout\'s own origin and cell size. The grid and the\n	// resolver therefore read the same two numbers - a grid drawn from a second copy of\n	// the arithmetic would look correct and still send clicks to the wrong cell.\n	const FVector2D Origin = TableLayout-&gt;GetGridOrigin();\n	const FVector2D Cell = TableLayout-&gt;GetCellSize();\n	const float GridFarX = Origin.X + Columns * Cell.X;\n	const float GridFarY = Origin.Y + Rows * Cell.Y;\n\n	for (int32 Column = 0; Column &lt;= Columns; ++Column)\n	{\n		const float LineX = Origin.X + Column * Cell.X;\n		DrawDebugLine(World, FeltLocalToWorld(FVector2D(LineX, Origin.Y)),\n			FeltLocalToWorld(FVector2D(LineX, GridFarY)),\n			FColor(90, 90, 90), true, -1.0f, 0, 0.3f);\n	}\n\n	for (int32 Row = 0; Row &lt;= Rows; ++Row)\n	{\n		const float LineY = Origin.Y + Row * Cell.Y;\n		DrawDebugLine(World, FeltLocalToWorld(FVector2D(Origin.X, LineY)),\n			FeltLocalToWorld(FVector2D(GridFarX, LineY)),\n			FColor(90, 90, 90), true, -1.0f, 0, 0.3f);\n	}\n\n	// The zero box, which is the one cell that is not part of the grid.\n	DrawDebugLine(World, FeltLocalToWorld(FVector2D(Min.X, Origin.Y)),\n		FeltLocalToWorld(FVector2D(Min.X, GridFarY)), FColor(90, 90, 90), true, -1.0f, 0, 0.3f);\n	DrawDebugLine(World, FeltLocalToWorld(FVector2D(Min.X, GridFarY)),\n		FeltLocalToWorld(FVector2D(Origin.X, GridFarY)), FColor(90, 90, 90), true, -1.0f, 0, 0.3f);\n	DrawDebugLine(World, FeltLocalToWorld(FVector2D(Min.X, Origin.Y)),\n		FeltLocalToWorld(FVector2D(Origin.X, Origin.Y)), FColor(90, 90, 90), true, -1.0f, 0, 0.3f);\n\n	// Every chip location. Color carries the type only as a hint; the log is the record.\n	for (const FHasardBetPosition&amp; Position : TableLayout-&gt;GetPositions())\n	{\n		const bool bInside = Position.CoveredNumbers.Num() &lt;= 6;\n		DrawDebugPoint(World, FeltLocalToWorld(Position.ChipLocation), 6.0f,\n			bInside ? FColor::Cyan : FColor::Orange, true, -1.0f);\n	}\n\n	UE_LOG(LogHasard, Warning, TEXT("Felt: drew %d chip locations, felt is %.0f x %.0f cm"),\n		TableLayout-&gt;GetPositions().Num(), Max.X - Min.X, Max.Y - Min.Y);\n}\n</code></pre><p><b>8.</b> <kbd>Ctrl+Shift+B</kbd> with the editor closed. Expect <b>Build: 1 succeeded, 0 failed</b>. Reopen the editor.</p><p><b>Phase 3 &mdash; a material that takes a color.</b></p><p><b>9.</b> In <code>Content/Materials</code> (make the folder), right-click &rarr; <b>Material</b>, name it <code>M_Chip</code>. Open it, right-click in the graph &rarr; <b>Vector Parameter</b>, name it exactly <b>Color</b>, and connect it to <b>Base Color</b>. Set its default to something obvious. Save.</p><p>The name has to match <code>ColorParameterName</code> on the chip, which defaults to <code>Color</code>. That is the one string tying the code to the asset, and it is a property rather than a literal precisely so a later material can be called something else without a rebuild.</p><p><b>Phase 4 &mdash; the five.</b></p><p><b>10.</b> In <code>Content/Blueprints</code>, right-click &rarr; <b>Blueprint Class</b> &rarr; expand <b>All Classes</b> &rarr; pick <code>HasardChip</code>. Name it <code>BP_Chip5</code>. Not <code>BP_Chip</code> &mdash; the class is the denomination, and a name without a number will be wrong the moment there are two.</p><p><b>11.</b> Open it, select the <b>Mesh</b> component, set <b>Static Mesh</b> to <code>/Engine/BasicShapes/Cylinder</code> and <b>Element 0</b> material to <code>M_Chip</code>. The engine cylinder is 100 cm in every direction, so set <b>Scale</b> to <b>0.08, 0.08, 0.01</b> &mdash; an 8 cm disc, 1 cm thick. That is a third of a 24 cm cell, which reads as a chip rather than a tile.</p><p><b>12.</b> Under <b>Hasard | Chip</b>: <b>Chip Height</b> <b>1.0</b>, <b>Chip Value</b> <b>5</b>, <b>Chip Color</b> a blue. The height has to match the 1 cm you just scaled the mesh to and nothing checks that it does &mdash; get it wrong and the stack either floats apart or intersects itself. Compile and save; the viewport disc should turn blue, because <code>OnConstruction</code> applies the color in the editor.</p><p><b>13.</b> Open <code>BP_Felt</code> &rarr; <b>Class Defaults</b> &rarr; <b>Hasard | Chips</b> and set <b>Chip Class</b> to <code>BP_Chip5</code>. Compile and save.</p><p><b>Phase 5 &mdash; stack them.</b></p><p><b>14.</b> Press <b>Play</b>. The log reads <code>Felt: 157 positions, 49 labels, 5 per click</code> &mdash; and that 5 came from the chip, not from the felt. Click the middle of a number: a blue chip lands in the cell.</p><p><b>15.</b> <b>Click the same cell four more times.</b> Five chips, stacked, each 1 cm above the last. The bankroll drops 5 each time and <code>Bets: 5, total staked: 25</code>.</p><p><b>16.</b> Now the check that matters: <b>click that same stack again.</b> It must still resolve to the same number and add a sixth chip. If nothing happens, <code>BP_Chip5</code> has collision on and the chips are blocking the sweep that finds the felt &mdash; see the panel above.</p><p><b>17.</b> Click a line between two numbers. The chip straddles it, because it spawns at the position\'s <code>ChipLocation</code> rather than where you clicked. Click a corner where four meet &mdash; same.</p><p><b>18.</b> Back a number, then press <b>Spin</b> and let it settle. <b>Every chip disappears</b> and the log reads <code>Felt: cleared N chips</code> immediately <i>before</i> the settlement summary &mdash; the broadcast happens on the line above that <code>UE_LOG</code>, which is what "every exit path goes through <code>DropAllBets</code>" buys you.</p><p><b>19.</b> Place bets until the bankroll refuses one. <code>PlaceBet refused: stake of 5 not available</code> and <b>no chip appears</b> &mdash; module 3 made the felt honour the return value, and this is the first module where you can see it rather than infer it.</p><p><b>Phase 6 &mdash; prove the denomination is the class.</b></p><p><b>20.</b> Right-click <code>BP_Chip5</code> &rarr; <b>Duplicate</b> &rarr; name it <code>BP_Chip10</code>. Change only two values: <b>Chip Value</b> to <b>10</b> and <b>Chip Color</b> to a red. Compile and save.</p><p><b>21.</b> On <code>BP_Felt</code>, swap <b>Chip Class</b> to <code>BP_Chip10</code>. Play. The log now reads <code>10 per click</code>, the bankroll drops 10 a bet, and the chips are red. <b>You changed one reference and both the money and the picture followed</b> &mdash; that is the whole argument for the value living on the chip. Swap back to <code>BP_Chip5</code>.</p><p><b>22.</b> Commit.</p><pre><code>git add -A\ngit commit -m "Stack real chips on the felt" -m "A chip is an actor with no collision, so a stack never blocks the sweep that\nfinds the felt underneath it. The class is the denomination - value, color and\nmesh on one asset - and clearing goes through OnBetsCleared from the one place\nActiveBets is emptied, because SettleRound has four exits."</code></pre>'}
],
quiz:[
{q:'Why does <code>AHasardChip</code> disable collision in the constructor rather than on the Blueprint?',

{q:'The stake moved from <code>AHasardFelt</code> onto <code>AHasardChip</code> because:',

{q:'<code>DropAllBets()</code> exists rather than broadcasting from the paying path because:',

{q:'<code>HandleBetsCleared</code> needs no <code>UFUNCTION()</code> because:',

{t:'p',x:'Module 4 printed 49 labels and module 6 stacked chips on them, and the thing underneath is still a grey collision box. Every number resolves, every payout is right, and it does not look like a roulette table. That gap matters more than it sounds: this is a portfolio piece, and the first thirty seconds of anyone looking at it are spent deciding whether the rest is worth reading.'},
{t:'p',x:'A real layout is <b>printed cloth</b>. Flat green, flat red and black boxes, white rules, white numerals. No gradients, no bevels, no lighting tricks. That is a lucky brief, because flat colour generated from measurements is exactly what this project already has.'},
{t:'h',x:'The lines are not drawn'},
{t:'p',x:'The obvious way to print a grid is to draw the grid: a thin white quad along every boundary. 12 columns, 3 rows, two outside bands, the zero box and the column band &mdash; call it fifty line segments, each one positioned by its own bit of arithmetic.'},
{t:'p',x:'That arithmetic is the problem, not the fifty quads. It would be a <i>second</i> copy of the layout maths, sitting next to <code>ChipLocation</code> and <code>ResolvePosition</code> and free to disagree with them. A line drawn 2 cm off is a line the player aims at that resolves to the cell next door, and nothing reports it. Guide 3 has refused that shape twice already &mdash; in module 3 for the resolver, in module 4 for the labels &mdash; and the answer is the same here.'},
{t:'p',x:'So the lines are not drawn at all. Every box gets <b>two</b> quads: a white one at its full size, and a coloured one on top inset by <code>BorderWidth</code> on every side. The white showing round the edge <i>is</i> the printed rule.'},
{t:'code',x:'const FVector2D Inset(\n	FMath::Max(Position.BoxSize.X - BorderWidth * 2.0f, 0.0f),\n	FMath::Max(Position.BoxSize.Y - BorderWidth * 2.0f, 0.0f));\n\nLines->AddInstance(BoxTransform(Position.ChipLocation, Position.BoxSize, SurfaceZStep));\nBoxesFor(Position, *TableLayout)->AddInstance(\n	BoxTransform(Position.ChipLocation, Inset, SurfaceZStep * 2.0f));'},
{t:'list',x:['<b>A line cannot exist where a box does not.</b> There is no code path that draws one, so the failure mode is structurally unavailable rather than merely avoided.','<b>Between two neighbours the rule is twice <code>BorderWidth</code></b>, because both boxes inset away from the shared edge. At the outer edge of the felt it is a single width. That is how printed cloth actually looks.','<b>Change <code>CellSizeX</code> and everything moves together</b> &mdash; the box, the rule, the chip location and the click test, because all four are the same number.']},
{t:'aside',lab:'Why the borders double, and why that is right',x:'<p>It looks like an off-by-one until you look at a real felt. The rule between 17 and 20 is drawn once and belongs to neither cell, so each cell stops short of it by half. Insetting both boxes by the full width and letting them share reproduces that exactly.</p><p>The consequence to keep in mind is that <code>BorderWidth</code> is a <i>half</i>-rule. 0.6 cm gives a 1.2 cm line between cells, which on a 24 cm cell is about right. Set it to what you want the line to look like and you will get a line twice that.</p>'},
{t:'h',x:'A position has to know how big it is'},
{t:'p',x:'<code>FHasardBetPosition</code> has carried <code>ChipLocation</code> since module 2 &mdash; the point a chip sits on. It has never carried an extent, because until now nothing needed one. <code>BoxSize</code> is that extent, centred on <code>ChipLocation</code>, and it is generated in <code>BuildPositions</code> beside everything else.'},
{t:'p',x:'49 of the 157 positions get one. The other 108 are splits, streets, corners, trios, baskets and six lines &mdash; bets that sit <i>on</i> a boundary and own no area at all. Their <code>BoxSize</code> stays zero, and that zero is the test:'},
{t:'code',x:'if (Position.BoxSize.IsNearlyZero())\n{\n	continue;\n}'},
{t:'p',x:'No <code>bHasBox</code>, no second switch over the bet type. A position that owns no area cannot be printed, and asking its size is the same question as asking whether it is drawn.'},
{t:'table',head:['Family','How many','Box'],rows:[['Zero','1','<code>ZeroBoxWidth</code> &times; all three rows &mdash; the one straight up that is not a cell'],['Straight up','36','<code>CellSizeX</code> &times; <code>CellSizeY</code>'],['Column &mdash; <code>2 to 1</code>','3','<code>OutsideBandDepth</code> &times; <code>CellSizeY</code>, past the far end'],['Dozen','3','Four cells wide &times; <code>OutsideBandDepth</code>'],['Even money','6','A sixth of the grid &times; <code>OutsideBandDepth</code>'],['Splits, streets, corners, trios, baskets, six lines','108','None. They are boundaries.']]},
{t:'chk',q:'Why is a zero <code>BoxSize</code> a better test than adding a <code>bool bHasBox</code> to the position?',a:'<p><b>Because the two could disagree and nothing would notice.</b> A bool is a second statement of a fact the size already carries. Set <code>bHasBox = true</code> on a split and you get a zero-sized quad; set it false on a cell and the cell vanishes while its click still resolves.</p><p>This is the same argument as <code>FHasardBet</code> dropping <code>BetType</code> in module 3. The cheapest way to keep two facts consistent is to only ever store one of them.</p>'},
{t:'h',x:'One component per colour, not one per box'},
{t:'p',x:'49 boxes plus 49 white plates is 98 quads. The reflex from module 4 &mdash; which made 49 <code>TextRenderComponent</code>s, one per label &mdash; would be 98 more components on one actor.'},
{t:'p',x:'That was defensible for text, which has no cheaper form. It is not defensible for flat quads, because Unreal has a purpose-built answer: <code>UInstancedStaticMeshComponent</code> draws any number of copies of one mesh in one call. Splitting by <b>colour</b> rather than by bet type gives three components &mdash; red, black, outside &mdash; plus the white plates, plus the cloth.'},
{t:'table',head:['','Component per box','Instanced per colour'],rows:[['Components on the actor','98','5'],['Draw calls, roughly','98','5'],['Cost in VR','Doubled &mdash; the table renders once per eye','Doubled, from a much smaller number'],['Can you hold a reference to one box?','Yes','No, only an instance index'],['Do you need to?','&mdash;','No. A box is never picked, moved or destroyed.']]},
{t:'p',x:'The last row is what makes this the opposite of module 6’s chip decision. A chip is spawned, stacked and destroyed individually, so losing the ability to hold a reference to one would have cost something real. A printed box is inert. It is drawn once and never touched again, so instancing costs nothing and buys back ninety-odd draw calls.'},
{t:'aside',lab:'Deciding this now rather than when VR hurts',x:'<p>Nothing in this project is close to a frame budget on a desktop. The reason to instance now is that the felt is about to acquire a table body, a wheel surround and a room, and VR renders all of it twice per frame at 90 Hz.</p><p>Unpicking one-component-per-box later means touching every place that holds a component pointer. Doing it while the only caller is <code>BuildSurface</code> costs one afternoon and the code is no harder to read. That asymmetry &mdash; cheap now, expensive later, same result &mdash; is most of what architecture decisions are.</p>'},
{t:'p',x:'Zero is the exception, and deliberately so. It is one quad on its own <code>UStaticMeshComponent</code>, not an instance on the outside-bet component, because putting it there would have made zero the same colour as a dozen box <i>by construction</i>. A single draw call is a small price for making one wrong state unreachable.'},
{t:'h',x:'The colour moves off the numeral'},
{t:'p',x:'Module 4 printed the numerals in red, black and green and left the felt underneath grey. <code>LabelColorFor</code> did that work, and it is deleted this module.'},
{t:'p',x:'On a printed layout the box carries the colour and the numeral is white on top of it. Keeping both coloured would be two sources for one fact: a red 17 on a black box is a felt telling the player two different things about the same pocket, and the settlement only agrees with one of them. So <code>NumeralColor</code> is a single ink for all 49 labels, and the red/black/zero rule moves intact into <code>BoxesFor</code>.'},
{t:'rg',lab:'The green did not soften on the way across',x:'<p>Zero is the entire house edge. It is the one pocket that pays nobody on the outside bets, and its colour is the only thing on the felt that says so at a glance. Module 4 gave it its own colour for that reason and this module had to move that decision, not quietly drop it.</p><p>Which is why zero is a separate component rather than an instance. Routing it through the outside-bet component would have worked, looked fine, and made the green unreachable &mdash; a refactor that removes a responsible-gaming guarantee as a side effect, with no diff line saying so. CLAUDE.md forbids printing zero as though it were one of the blacks; being printed as though it were a dozen box is the same failure wearing a different colour.</p><p>The general shape is worth keeping: <b>when a rule about honesty moves house, make its new home the one place it cannot be deleted by accident.</b></p>'},
{t:'warn',lab:'Four properties are deleted, not renamed',x:'<p><code>RedNumberColor</code>, <code>BlackNumberColor</code>, <code>ZeroLabelColor</code> and <code>OutsideLabelColor</code> are gone. <code>RedBoxColor</code> and friends are new properties, not renames, and <b>no core redirect is added on purpose</b>.</p><p>A redirect would carry a numeral colour into a box colour. Those mean different things &mdash; one was ink on a grey felt, the other is the felt &mdash; so a value that was tuned for the first is wrong for the second. If <code>BP_Felt</code> overrode any of the four, that override is correctly dropped and the new defaults apply.</p><p>The reverse case is <code>bDrawDebugLayout</code>, whose C++ default changed from true to false. A default is not an override: a Blueprint that already saved <code>true</code> keeps it, and you have to uncheck it by hand. Step 10.</p>'},
{t:'h',x:'The audit learns to check boxes'},
{t:'p',x:'<code>HasardAuditLayout</code> has proved the 2.70% edge on every position since module 2. It now also proves that no two boxes overlap and that none escapes the felt bounds.'},
{t:'p',x:'Overlap looks like a cosmetic check and is not. <code>BoxSize</code> and <code>ResolvePosition</code> read the same measurements, so two boxes drawn over each other is also two regions whose clicks land somewhere unintended. <b>The visible half is ugly and the invisible half takes money for the wrong bet</b>, and only the first half is obvious.'},
{t:'p',x:'The check lives in the audit rather than in the felt because it is a property of the layout asset &mdash; true or false before anything is drawn, on a machine with no felt in the level. Same reason the edge check lives there.'},
{t:'chk',q:'Adjacent cells share an edge exactly. Why does the overlap test not report every pair of neighbours?',a:'<p><b>Because both boxes are shrunk by a hair before comparing.</b> The test asks whether the interiors intersect, not whether the closures touch:</p><pre><code>Min.X &lt; OtherMax.X - Shrink &amp;&amp; Max.X &gt; OtherMin.X + Shrink</code></pre><p>Without it, 36 cells sharing edges would produce dozens of failures on a perfectly correct layout, and an audit that cries wolf is an audit nobody reads. The tolerance is 0.01 cm &mdash; far below any real overlap and far above float noise on numbers this size.</p>'},
{t:'warn',lab:'When a build succeeds and nothing changes',x:'<p>This module is where you are most likely to meet it, because it changes a header and a material at the same time and both fail silently.</p><p>UBT decides what to recompile by comparing timestamps. If the <code>.obj</code> under <code>Intermediate/Build/</code> looks newer than your <code>.cpp</code>, it skips the file and still reports <b>Build: 1 succeeded</b>. Every signal says you are fine &mdash; the build passes, the DLL is freshly stamped, the source on disk is visibly correct &mdash; and the game runs code you deleted an hour ago.</p><p><b>Suspect it when a rebuild changes nothing twice in a row.</b> Once is a mistake, twice is the toolchain. Confirm it by putting a <code>UE_LOG</code> in the function you changed: if it does not print, the code is not running, and that is the whole diagnosis. Fix it with <b>Rebuild</b> rather than Build &mdash; right-click the <code>Hasard</code> project &rarr; Rebuild, which ignores timestamps. A rebuild that finishes in six seconds did nothing.</p><p>Turn <b>Live Coding</b> off as well (Editor Preferences &rarr; General). With it on, a build either fails outright with <code>Unable to build while Live Coding is active</code>, or the editor keeps running a patched process that ignores the DLL you just built. This project edits headers most modules, which is exactly what Live Coding cannot handle.</p>'},
{t:'srcs',x:[['Instanced Static Mesh Component','https://dev.epicgames.com/documentation/en-us/unreal-engine/instanced-static-mesh-component-in-unreal-engine'],['Instancing and draw calls','https://dev.epicgames.com/documentation/en-us/unreal-engine/mesh-drawing-pipeline-in-unreal-engine'],['Dynamic material instances','https://dev.epicgames.com/documentation/en-us/unreal-engine/instanced-materials-in-unreal-engine'],['Core redirects','https://dev.epicgames.com/documentation/en-us/unreal-engine/core-redirects-in-unreal-engine'],['VR performance basics','https://dev.epicgames.com/documentation/en-us/unreal-engine/xr-performance-features-in-unreal-engine']]},
{t:'build',title:'Print the felt',file:'Source/Hasard/ - six files, none new',x:'<p><b>Phase 1 &mdash; Visual Studio.</b> Six files, none new. Every one complete, marked against where modules 3, 4 and 6 left them.</p><p><b>1.</b> <code>HasardTypes.h</code>. One field on the position:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"             // int32, uint8, TArray, FVector2D, the logging macros\n#include "HasardTypes.generated.h"   // ALWAYS LAST\n\n/** One category for the whole project. Defined once, in HasardGameMode.cpp. */\nDECLARE_LOG_CATEGORY_EXTERN(LogHasard, Log, All);\n\nUENUM(BlueprintType)\nenum class EHasardBetType : uint8\n{\n	StraightUp  UMETA(DisplayName = "Straight Up"),\n	Split       UMETA(DisplayName = "Split"),\n	Street      UMETA(DisplayName = "Street"),\n	Trio        UMETA(DisplayName = "Trio"),\n	Corner      UMETA(DisplayName = "Corner"),\n	Basket      UMETA(DisplayName = "Basket"),\n	SixLine     UMETA(DisplayName = "Six Line"),\n	Column      UMETA(DisplayName = "Column"),\n	Dozen       UMETA(DisplayName = "Dozen"),\n	Red         UMETA(DisplayName = "Red"),\n	Black       UMETA(DisplayName = "Black"),\n	Even        UMETA(DisplayName = "Even"),\n	Odd         UMETA(DisplayName = "Odd"),\n	Low         UMETA(DisplayName = "Low 1-18"),\n	High        UMETA(DisplayName = "High 19-36")\n};\n\n/**\n * One place a chip can legally sit, and everything that follows from it.\n *\n * Generated from the layout asset, never authored by hand. A bet stores the\n * PositionId and nothing else, so a bet cannot describe a position that does not exist.\n */\nUSTRUCT(BlueprintType)\nstruct FHasardBetPosition\n{\n	GENERATED_BODY()\n\n	/**\n	 * Index into the generated array, stamped from its own position on append.\n	 * The array is append-only for that reason: a sort or a remove leaves every\n	 * id pointing at the wrong position, and nothing would report it.\n	 */\n	UPROPERTY(BlueprintReadOnly, Category = "Hasard|Layout")\n	int32 PositionId = INDEX_NONE;\n\n	UPROPERTY(BlueprintReadOnly, Category = "Hasard|Layout")\n	EHasardBetType BetType = EHasardBetType::StraightUp;\n\n	/** Every pocket this position pays on, ascending. The audit checks this count against the payout rule. */\n	UPROPERTY(BlueprintReadOnly, Category = "Hasard|Layout")\n	TArray&lt;int32&gt; CoveredNumbers;\n\n	/** Where the chip sits, in the felt\'s local 2D space, in centimeters. */\n	UPROPERTY(BlueprintReadOnly, Category = "Hasard|Layout")\n	FVector2D ChipLocation = FVector2D::ZeroVector;\n\n	/**\n	 * The rectangle this position is printed as, centered on ChipLocation, in centimeters.\n	 *\n-|	 * Zero for the 83 line bets, and that is the test rather than a separate flag: a split\n+|	 * Zero for the 108 line bets, and that is the test rather than a separate flag: a split\n	 * sits on a boundary and a corner on an intersection, so neither owns any area to print.\n	 * "Has a box" and "is drawn" are therefore the same question, asked of one field.\n	 *\n	 * Generated here rather than derived in the felt. A felt that computed its own\n	 * rectangles from CellSizeX would be a second copy of the layout arithmetic, which is\n	 * the thing ChipLocation exists to avoid - and a picture that disagrees with the hit\n	 * test is worse than no picture, because it looks authoritative.\n	 */\n	UPROPERTY(BlueprintReadOnly, Category = "Hasard|Layout")\n	FVector2D BoxSize = FVector2D::ZeroVector;\n\n	/** What the hover readout shows the player. FText because a player reads it. */\n	UPROPERTY(BlueprintReadOnly, Category = "Hasard|Layout")\n	FText DisplayName;\n};\n\n/**\n * A chip on the felt: which position, and how much.\n *\n * BetType and the covered numbers are not stored here. They belong to the position,\n * and duplicating them would let a bet disagree with the table it was placed on.\n * Settlement looks the position up by id, so an id that does not exist is a loud\n-| * error rather than a bet that quietly never wins. The stake is already taken by\n-| * then, which is why PlaceBet is where a bad id has to be refused.\n+| * error rather than a bet that quietly never wins - but the stake is already taken\n+| * by then. Ids come from ResolvePosition, which returns a generated id or\n+| * INDEX_NONE and nothing else. PlaceBet refuses only INDEX_NONE, so an id\n+| * synthesized anywhere else is the one route to a paid bet that cannot win.\n */\nUSTRUCT(BlueprintType)\nstruct FHasardBet\n{\n	GENERATED_BODY()\n\n	/** Index into the layout\'s generated positions. INDEX_NONE is not a bet. */\n	UPROPERTY(BlueprintReadOnly, Category = "Hasard|Bet")\n	int32 PositionId = INDEX_NONE;\n\n	UPROPERTY(BlueprintReadOnly, Category = "Hasard|Bet")\n	int32 Stake = 0;\n};</code></pre><p><b>2.</b> <code>HasardTableLayout.h</code>. <code>AddPosition</code> takes the size last, with a default:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"                       // int32, TArray, FVector2D, the core macros\n#include "Engine/DataAsset.h"                  // UDataAsset, the base class\n#include "HasardTypes.h"                       // EHasardBetType, FHasardBetPosition\n#include "HasardTableLayout.generated.h"       // ALWAYS LAST\n\n/**\n * Every measurement of the felt, in one asset.\n *\n * The visible layout and the click detection are both generated from these numbers,\n * so they cannot disagree with each other. Nothing else in the project may hard-code\n * a cell size or a grid origin.\n */\nUCLASS(BlueprintType)\nclass HASARD_API UHasardTableLayout : public UDataAsset\n{\n	GENERATED_BODY()\n\npublic:\n	/** The number at a grid cell. Column 0 row 0 is 1; column 0 row 2 is 3; column 1 row 0 is 4. */\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	int32 GetNumberAt(int32 Column, int32 Row) const;\n\n	/** Grid column holding a number, 0-11. INDEX_NONE for zero or an out-of-range number. */\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	int32 GetColumnOf(int32 Number) const;\n\n	/** Grid row holding a number, 0-2. INDEX_NONE for zero or an out-of-range number. */\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	int32 GetRowOf(int32 Number) const;\n\n	/** Center of one cell, in the felt\'s local 2D space. */\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	FVector2D GetCellCenter(int32 Column, int32 Row) const;\n\n	/** Far corner of the number grid. Not the felt - the zero box and the outside bands extend past it. */\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	FVector2D GetGridExtent() const;\n\n	/**\n	 * The whole felt, including the zero box and both outside bands.\n	 *\n	 * Every caller that needs a size asks for it here rather than adding the parts up,\n	 * because a felt drawn from one sum and traced against another is a felt where\n	 * clicks land in the wrong place near the edges.\n	 */\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	void GetFeltBounds(FVector2D&amp; OutMin, FVector2D&amp; OutMax) const;\n\n	/**\n	 * All 157 positions, built once and reused.\n	 *\n	 * Derived data, so it is deliberately not a UPROPERTY: serializing it would put a\n	 * stale copy in the .uasset that could disagree with the numbers above it.\n	 */\n	const TArray&lt;FHasardBetPosition&gt;&amp; GetPositions() const;\n\n	/** One position by id, or null. Null means the id was never valid, which is worth logging. */\n	const FHasardBetPosition* GetPositionById(int32 PositionId) const;\n\n	/**\n	 * Which position a chip at this felt-local point means, or INDEX_NONE for nowhere.\n	 *\n	 * This is the croupier reading the felt, and it is the only place that decides what\n	 * a click means. LineTolerance is what makes a point near a boundary a line bet.\n	 */\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	int32 ResolvePosition(const FVector2D&amp; LocalPoint) const;\n\n	/** True for the eighteen red numbers on a single-zero wheel. */\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	bool IsRedNumber(int32 Number) const;\n\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	int32 GetNumberColumns() const { return NumberColumns; }\n\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	int32 GetNumberRows() const { return NumberRows; }\n\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	float GetLineTolerance() const { return LineTolerance; }\n\n	/** Raw values, exposed so a caller drawing grid lines need not rebuild them from cell centers. */\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	FVector2D GetGridOrigin() const { return GridOrigin; }\n\n	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n	FVector2D GetCellSize() const { return FVector2D(CellSizeX, CellSizeY); }\n\n	/** Builds all 157 bet positions. Deterministic: same asset in, same array out, same order. */\n	void BuildPositions(TArray&lt;FHasardBetPosition&gt;&amp; OutPositions) const;\n\n#if WITH_EDITOR\n	/** Editing any measurement invalidates the cache, or the felt keeps drawing the old numbers. */\n	virtual void PostEditChangeProperty(FPropertyChangedEvent&amp; PropertyChangedEvent) override;\n#endif\n\nprivate:\n	/**\n	 * Adds one position and stamps its PositionId from the array index.\n	 *\n-|	 * BoxSize defaults to zero because most positions have none: 83 of the 157 are lines\n-|	 * and corners. Omitting the argument is therefore the common case and says the right\n-|	 * thing, rather than making every line bet pass a zero it does not care about.\n+|	 * BoxSize defaults to zero because most positions have none: 108 of the 157 sit on a\n+|	 * boundary or an intersection. Omitting the argument is therefore the common case and\n+|	 * says the right thing, rather than making every line bet pass a zero it does not care about.\n	 */\n	void AddPosition(TArray&lt;FHasardBetPosition&gt;&amp; OutPositions, EHasardBetType BetType,\n		const TArray&lt;int32&gt;&amp; Covered, const FVector2D&amp; ChipLocation, const FText&amp; DisplayName,\n		const FVector2D&amp; BoxSize = FVector2D::ZeroVector) const;\n\n	/** Finds a generated position by type and covered set. Used only by ResolvePosition. */\n	int32 FindPositionId(EHasardBetType BetType, const TArray&lt;int32&gt;&amp; Covered) const;\n\n	/** Built on first request, cleared when a property changes. Never serialized. */\n	mutable TArray&lt;FHasardBetPosition&gt; CachedPositions;\n\n	/** Twelve columns of three. Editable only because a future variant may differ. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n		meta = (AllowPrivateAccess = "true", ClampMin = "1"))\n	int32 NumberColumns = 12;\n\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n		meta = (AllowPrivateAccess = "true", ClampMin = "1"))\n	int32 NumberRows = 3;\n\n	/** Size of one number cell in centimeters, along the twelve columns. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n		meta = (AllowPrivateAccess = "true", ClampMin = "1.0"))\n	float CellSizeX = 24.0f;\n\n	/** Size of one number cell in centimeters, across the three rows. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n		meta = (AllowPrivateAccess = "true", ClampMin = "1.0"))\n	float CellSizeY = 24.0f;\n\n	/** Felt-local position of the near corner of cell (0,0). Everything is measured from here. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n		meta = (AllowPrivateAccess = "true"))\n	FVector2D GridOrigin = FVector2D::ZeroVector;\n\n	/** Width of the zero box, which sits at negative X of the grid and spans all three rows. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n		meta = (AllowPrivateAccess = "true", ClampMin = "1.0"))\n	float ZeroBoxWidth = 24.0f;\n\n	/** Depth of each outside-bet band. Dozens sit against the grid, even-money beyond them. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n		meta = (AllowPrivateAccess = "true", ClampMin = "1.0"))\n	float OutsideBandDepth = 24.0f;\n\n	/**\n	 * How close to a line counts as being on it, as a fraction of a cell.\n	 * 0.15 means the middle 70% of a cell is a straight up and the rest is a line bet.\n	 */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n		meta = (AllowPrivateAccess = "true", ClampMin = "0.05", ClampMax = "0.45"))\n	float LineTolerance = 0.15f;\n};</code></pre><p><b>3.</b> <code>HasardTableLayout.cpp</code>. Five of the twelve rules now pass a box, and the dozens get their real names:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#include "HasardTableLayout.h"   // the class this file defines\n#include "HasardTypes.h"         // EHasardBetType, FHasardBetPosition\n\n#define LOCTEXT_NAMESPACE "Hasard"\n\nint32 UHasardTableLayout::GetNumberAt(int32 Column, int32 Row) const\n{\n	if (Column &lt; 0 || Column &gt;= NumberColumns || Row &lt; 0 || Row &gt;= NumberRows)\n	{\n		return INDEX_NONE;\n	}\n\n	return Column * NumberRows + Row + 1;\n}\n\nint32 UHasardTableLayout::GetColumnOf(int32 Number) const\n{\n	if (Number &lt; 1 || Number &gt; NumberColumns * NumberRows)\n	{\n		return INDEX_NONE;\n	}\n\n	return (Number - 1) / NumberRows;\n}\n\nint32 UHasardTableLayout::GetRowOf(int32 Number) const\n{\n	if (Number &lt; 1 || Number &gt; NumberColumns * NumberRows)\n	{\n		return INDEX_NONE;\n	}\n\n	return (Number - 1) % NumberRows;\n}\n\nFVector2D UHasardTableLayout::GetCellCenter(int32 Column, int32 Row) const\n{\n	return FVector2D(\n		GridOrigin.X + (static_cast&lt;float&gt;(Column) + 0.5f) * CellSizeX,\n		GridOrigin.Y + (static_cast&lt;float&gt;(Row) + 0.5f) * CellSizeY);\n}\n\nFVector2D UHasardTableLayout::GetGridExtent() const\n{\n	return FVector2D(\n		GridOrigin.X + NumberColumns * CellSizeX,\n		GridOrigin.Y + NumberRows * CellSizeY);\n}\n\nvoid UHasardTableLayout::GetFeltBounds(FVector2D&amp; OutMin, FVector2D&amp; OutMax) const\n{\n	// Two bands sit below the grid: dozens against it, even-money beyond them.\n	OutMin = FVector2D(\n		GridOrigin.X - ZeroBoxWidth,\n		GridOrigin.Y - OutsideBandDepth * 2.0f);\n	OutMax = FVector2D(\n		GridOrigin.X + NumberColumns * CellSizeX + OutsideBandDepth,\n		GridOrigin.Y + NumberRows * CellSizeY);\n}\n\nconst TArray&lt;FHasardBetPosition&gt;&amp; UHasardTableLayout::GetPositions() const\n{\n	if (CachedPositions.Num() == 0)\n	{\n		BuildPositions(CachedPositions);\n	}\n\n	return CachedPositions;\n}\n\nconst FHasardBetPosition* UHasardTableLayout::GetPositionById(int32 PositionId) const\n{\n	// PositionId is the array index by construction, so this is a bounds check, not a search.\n	const TArray&lt;FHasardBetPosition&gt;&amp; Positions = GetPositions();\n	return Positions.IsValidIndex(PositionId) ? &amp;Positions[PositionId] : nullptr;\n}\n\nint32 UHasardTableLayout::FindPositionId(EHasardBetType BetType, const TArray&lt;int32&gt;&amp; Covered) const\n{\n	TArray&lt;int32&gt; Wanted = Covered;\n	Wanted.Sort(); \n\n	for (const FHasardBetPosition&amp; Position : GetPositions())\n	{\n		if (Position.BetType == BetType &amp;&amp; Position.CoveredNumbers == Wanted)\n		{\n			return Position.PositionId;\n		}\n	}\n\n	return INDEX_NONE;\n}\n\nint32 UHasardTableLayout::ResolvePosition(const FVector2D&amp; LocalPoint) const\n{\n	FVector2D FeltMin, FeltMax;\n	GetFeltBounds(FeltMin, FeltMax);\n\n	if (LocalPoint.X &lt; FeltMin.X || LocalPoint.X &gt; FeltMax.X ||\n		LocalPoint.Y &lt; FeltMin.Y || LocalPoint.Y &gt; FeltMax.Y)\n	{\n		return INDEX_NONE;   // off the felt: not a bet, and not an error either\n	}\n\n	// Nearest chip location among the positions a filter allows. Used only for the\n	// outside bets, which are discrete boxes with no lines to sit on.\n	const auto NearestWhere = [this, &amp;LocalPoint](auto&amp;&amp; Filter) -&gt; int32\n	{\n		int32 BestId = INDEX_NONE;\n		float BestDistSq = TNumericLimits&lt;float&gt;::Max();\n\n		for (const FHasardBetPosition&amp; Position : GetPositions())\n		{\n			if (!Filter(Position))\n			{\n				continue;\n			}\n\n			const float DistSq = FVector2D::DistSquared(LocalPoint, Position.ChipLocation);\n			if (DistSq &lt; BestDistSq)\n			{\n				BestDistSq = DistSq;\n				BestId = Position.PositionId;\n			}\n		}\n\n		return BestId;\n	};\n\n	const float GridFarX = GridOrigin.X + NumberColumns * CellSizeX;\n\n	// Region 1 - the bands below the grid. Dozens against the numbers, even-money beyond.\n	if (LocalPoint.Y &lt; GridOrigin.Y)\n	{\n		const bool bDozenBand = LocalPoint.Y &gt; GridOrigin.Y - OutsideBandDepth;\n\n		return NearestWhere([bDozenBand](const FHasardBetPosition&amp; Position)\n		{\n			if (bDozenBand)\n			{\n				return Position.BetType == EHasardBetType::Dozen;\n			}\n\n			return Position.BetType == EHasardBetType::Low\n				|| Position.BetType == EHasardBetType::High\n				|| Position.BetType == EHasardBetType::Even\n				|| Position.BetType == EHasardBetType::Odd\n				|| Position.BetType == EHasardBetType::Red\n				|| Position.BetType == EHasardBetType::Black;\n		});\n	}\n\n	// Region 2 - the three column boxes, past the last cell.\n	if (LocalPoint.X &gt; GridFarX)\n	{\n		return NearestWhere([](const FHasardBetPosition&amp; Position)\n		{\n			return Position.BetType == EHasardBetType::Column;\n		});\n	}\n\n	const float FracY = (LocalPoint.Y - GridOrigin.Y) / CellSizeY;\n	const int32 Row = FMath::Clamp(FMath::FloorToInt(FracY), 0, NumberRows - 1);\n	const float OffsetY = FracY - (static_cast&lt;float&gt;(Row) + 0.5f);\n\n	const bool bNearHorizontal = FMath::Abs(OffsetY) &gt; (0.5f - LineTolerance);\n	const bool bFarEdge = bNearHorizontal &amp;&amp; OffsetY &gt; 0.0f &amp;&amp; Row == NumberRows - 1;\n\n	// Region 3 - the zero seam. A chip on the line x = GridOrigin.X is not a bet on\n	// column one: it pairs zero with whatever it is beside. Five different answers\n	// share this one line, which is why a plain "is it left of the grid" test is wrong.\n	if (FMath::Abs(LocalPoint.X - GridOrigin.X) &lt;= LineTolerance * CellSizeX)\n	{\n		if (bFarEdge)\n		{\n			return FindPositionId(EHasardBetType::Basket, { 0, 1, 2, 3 });\n		}\n\n		if (bNearHorizontal)\n		{\n			const int32 AdjacentRow = Row + (OffsetY &gt; 0.0f ? 1 : -1);\n			if (AdjacentRow &gt;= 0 &amp;&amp; AdjacentRow &lt; NumberRows)\n			{\n				const int32 LowerRow = FMath::Min(Row, AdjacentRow);\n				return FindPositionId(EHasardBetType::Trio,\n					{ 0, GetNumberAt(0, LowerRow), GetNumberAt(0, LowerRow + 1) });\n			}\n		}\n\n		return FindPositionId(EHasardBetType::Split, { 0, GetNumberAt(0, Row) });\n	}\n\n	// Region 4 - inside the zero box itself.\n	if (LocalPoint.X &lt; GridOrigin.X)\n	{\n		return FindPositionId(EHasardBetType::StraightUp, { 0 });\n	}\n\n	// Region 5 - the number grid.\n	const float FracX = (LocalPoint.X - GridOrigin.X) / CellSizeX;\n	const int32 Column = FMath::Clamp(FMath::FloorToInt(FracX), 0, NumberColumns - 1);\n	const float OffsetX = FracX - (static_cast&lt;float&gt;(Column) + 0.5f);\n\n	const bool bNearVertical = FMath::Abs(OffsetX) &gt; (0.5f - LineTolerance);\n\n	const int32 AdjacentColumn = Column + (OffsetX &gt; 0.0f ? 1 : -1);\n	const int32 AdjacentRow = Row + (OffsetY &gt; 0.0f ? 1 : -1);\n	const bool bColumnInRange = AdjacentColumn &gt;= 0 &amp;&amp; AdjacentColumn &lt; NumberColumns;\n	const bool bRowInRange = AdjacentRow &gt;= 0 &amp;&amp; AdjacentRow &lt; NumberRows;\n\n	// The far edge carries the streets and the six lines, so it is answered before the\n	// corner test. A chip up there is never a corner - there is no fourth cell above it.\n	if (bFarEdge)\n	{\n		if (bNearVertical &amp;&amp; bColumnInRange)\n		{\n			const int32 BaseColumn = FMath::Min(Column, AdjacentColumn);\n\n			TArray&lt;int32&gt; Covered;\n			for (int32 Offset = 0; Offset &lt; 2; ++Offset)\n			{\n				for (int32 CoveredRow = 0; CoveredRow &lt; NumberRows; ++CoveredRow)\n				{\n					Covered.Add(GetNumberAt(BaseColumn + Offset, CoveredRow));\n				}\n			}\n\n			return FindPositionId(EHasardBetType::SixLine, Covered);\n		}\n\n		TArray&lt;int32&gt; Covered;\n		for (int32 CoveredRow = 0; CoveredRow &lt; NumberRows; ++CoveredRow)\n		{\n			Covered.Add(GetNumberAt(Column, CoveredRow));\n		}\n\n		return FindPositionId(EHasardBetType::Street, Covered);\n	}\n\n	if (bNearVertical &amp;&amp; bNearHorizontal &amp;&amp; bColumnInRange &amp;&amp; bRowInRange)\n	{\n		return FindPositionId(EHasardBetType::Corner, {\n			GetNumberAt(Column, Row), GetNumberAt(AdjacentColumn, Row),\n			GetNumberAt(Column, AdjacentRow), GetNumberAt(AdjacentColumn, AdjacentRow) });\n	}\n\n	if (bNearVertical &amp;&amp; bColumnInRange)\n	{\n		return FindPositionId(EHasardBetType::Split,\n			{ GetNumberAt(Column, Row), GetNumberAt(AdjacentColumn, Row) });\n	}\n\n	if (bNearHorizontal &amp;&amp; bRowInRange)\n	{\n		return FindPositionId(EHasardBetType::Split,\n			{ GetNumberAt(Column, Row), GetNumberAt(Column, AdjacentRow) });\n	}\n\n	return FindPositionId(EHasardBetType::StraightUp, { GetNumberAt(Column, Row) });\n}\n\nbool UHasardTableLayout::IsRedNumber(int32 Number) const\n{\n	// The eighteen reds on a single-zero wheel. Not derivable from the number:\n	// the sequence alternates within each half but breaks at 10/11 and 28/29.\n	static const TSet&lt;int32&gt; RedNumbers = {\n		1, 3, 5, 7, 9, 12, 14, 16, 18,\n		19, 21, 23, 25, 27, 30, 32, 34, 36 };\n\n	return RedNumbers.Contains(Number);\n}\n\nvoid UHasardTableLayout::AddPosition(TArray&lt;FHasardBetPosition&gt;&amp; OutPositions,\n	EHasardBetType BetType, const TArray&lt;int32&gt;&amp; Covered,\n	const FVector2D&amp; ChipLocation, const FText&amp; DisplayName, const FVector2D&amp; BoxSize) const\n{\n	FHasardBetPosition Position;\n	Position.PositionId = OutPositions.Num();   // the index is the id, so they cannot drift\n	Position.BetType = BetType;\n	Position.CoveredNumbers = Covered;\n	Position.CoveredNumbers.Sort();\n	Position.ChipLocation = ChipLocation;\n	Position.DisplayName = DisplayName;\n	Position.BoxSize = BoxSize;\n\n	OutPositions.Add(MoveTemp(Position));\n}\n\nvoid UHasardTableLayout::BuildPositions(TArray&lt;FHasardBetPosition&gt;&amp; OutPositions) const\n{\n	OutPositions.Reset();\n	OutPositions.Reserve(157);\n\n	const float GridFarY = GridOrigin.Y + NumberRows * CellSizeY;\n	const float ZeroCenterX = GridOrigin.X - ZeroBoxWidth * 0.5f;\n	const float ZeroCenterY = GridOrigin.Y + NumberRows * CellSizeY * 0.5f;\n\n	// 1. Zero, then one straight up per cell. Zero\'s box spans all three rows, which is\n	//    why it is the one straight up that is not a single cell.\n	AddPosition(OutPositions, EHasardBetType::StraightUp, { 0 },\n		FVector2D(ZeroCenterX, ZeroCenterY), LOCTEXT("Zero", "0"),\n		FVector2D(ZeroBoxWidth, NumberRows * CellSizeY));\n\n	for (int32 Column = 0; Column &lt; NumberColumns; ++Column)\n	{\n		for (int32 Row = 0; Row &lt; NumberRows; ++Row)\n		{\n			const int32 Number = GetNumberAt(Column, Row);\n			AddPosition(OutPositions, EHasardBetType::StraightUp, { Number },\n				GetCellCenter(Column, Row), FText::AsNumber(Number),\n				FVector2D(CellSizeX, CellSizeY));\n		}\n	}\n\n	// 2. Splits within a column: the chip sits on the line between two stacked cells.\n	for (int32 Column = 0; Column &lt; NumberColumns; ++Column)\n	{\n		for (int32 Row = 0; Row &lt; NumberRows - 1; ++Row)\n		{\n			const int32 Low = GetNumberAt(Column, Row);\n			const int32 High = GetNumberAt(Column, Row + 1);\n			AddPosition(OutPositions, EHasardBetType::Split, { Low, High },\n				FVector2D(GetCellCenter(Column, Row).X,\n					GridOrigin.Y + (Row + 1) * CellSizeY),\n				FText::Format(LOCTEXT("SplitFmt", "{0}/{1}"),\n					FText::AsNumber(Low), FText::AsNumber(High)));\n		}\n	}\n\n	// 3. Splits across columns: the chip sits on the line between two side-by-side cells.\n	for (int32 Column = 0; Column &lt; NumberColumns - 1; ++Column)\n	{\n		for (int32 Row = 0; Row &lt; NumberRows; ++Row)\n		{\n			const int32 Left = GetNumberAt(Column, Row);\n			const int32 Right = GetNumberAt(Column + 1, Row);\n			AddPosition(OutPositions, EHasardBetType::Split, { Left, Right },\n				FVector2D(GridOrigin.X + (Column + 1) * CellSizeX,\n					GetCellCenter(Column, Row).Y),\n				FText::Format(LOCTEXT("SplitFmt", "{0}/{1}"),\n					FText::AsNumber(Left), FText::AsNumber(Right)));\n		}\n	}\n\n	// 4. The three splits that pair zero with the first column.\n	for (int32 Row = 0; Row &lt; NumberRows; ++Row)\n	{\n		const int32 Number = GetNumberAt(0, Row);\n		AddPosition(OutPositions, EHasardBetType::Split, { 0, Number },\n			FVector2D(GridOrigin.X, GetCellCenter(0, Row).Y),\n			FText::Format(LOCTEXT("ZeroSplitFmt", "0/{0}"), FText::AsNumber(Number)));\n	}\n\n	// 5. Streets: one whole column of three, chip on the far edge.\n	for (int32 Column = 0; Column &lt; NumberColumns; ++Column)\n	{\n		TArray&lt;int32&gt; Covered;\n		for (int32 Row = 0; Row &lt; NumberRows; ++Row)\n		{\n			Covered.Add(GetNumberAt(Column, Row));\n		}\n\n		AddPosition(OutPositions, EHasardBetType::Street, Covered,\n			FVector2D(GetCellCenter(Column, 0).X, GridFarY),\n			FText::Format(LOCTEXT("StreetFmt", "Street {0}-{1}"),\n				FText::AsNumber(Covered[0]), FText::AsNumber(Covered.Last())));\n	}\n\n	// 6. The two trios. Three numbers for 11:1, same as a street, and the only\n	//    other way to reach zero with three.\n	AddPosition(OutPositions, EHasardBetType::Trio, { 0, 1, 2 },\n		FVector2D(GridOrigin.X, GridOrigin.Y + CellSizeY), LOCTEXT("Trio012", "Trio 0/1/2"));\n	AddPosition(OutPositions, EHasardBetType::Trio, { 0, 2, 3 },\n		FVector2D(GridOrigin.X, GridOrigin.Y + 2 * CellSizeY), LOCTEXT("Trio023", "Trio 0/2/3"));\n\n	// 7. Corners: the chip sits where four cells meet.\n	for (int32 Column = 0; Column &lt; NumberColumns - 1; ++Column)\n	{\n		for (int32 Row = 0; Row &lt; NumberRows - 1; ++Row)\n		{\n			const TArray&lt;int32&gt; Covered = {\n				GetNumberAt(Column, Row), GetNumberAt(Column, Row + 1),\n				GetNumberAt(Column + 1, Row), GetNumberAt(Column + 1, Row + 1) };\n\n			AddPosition(OutPositions, EHasardBetType::Corner, Covered,\n				FVector2D(GridOrigin.X + (Column + 1) * CellSizeX,\n					GridOrigin.Y + (Row + 1) * CellSizeY),\n				FText::Format(LOCTEXT("CornerFmt", "Corner {0}"),\n					FText::AsNumber(GetNumberAt(Column, Row))));\n		}\n	}\n\n	// 8. The basket. Four numbers for 8:1 on a single-zero wheel, which is why\n	//    the shared-edge audit still passes. The American five-number bet does not.\n	AddPosition(OutPositions, EHasardBetType::Basket, { 0, 1, 2, 3 },\n		FVector2D(GridOrigin.X, GridFarY), LOCTEXT("Basket", "Basket 0/1/2/3"));\n\n	// 9. Six lines: two adjacent streets, chip on the far edge between them.\n	for (int32 Column = 0; Column &lt; NumberColumns - 1; ++Column)\n	{\n		TArray&lt;int32&gt; Covered;\n		for (int32 Offset = 0; Offset &lt; 2; ++Offset)\n		{\n			for (int32 Row = 0; Row &lt; NumberRows; ++Row)\n			{\n				Covered.Add(GetNumberAt(Column + Offset, Row));\n			}\n		}\n\n		AddPosition(OutPositions, EHasardBetType::SixLine, Covered,\n			FVector2D(GridOrigin.X + (Column + 1) * CellSizeX, GridFarY),\n			FText::Format(LOCTEXT("SixLineFmt", "Six line {0}-{1}"),\n				FText::AsNumber(Covered[0]), FText::AsNumber(Covered.Last())));\n	}\n\n	// 10. Column bets. A grid row is a 2:1 column: the box sits past the last cell.\n	for (int32 Row = 0; Row &lt; NumberRows; ++Row)\n	{\n		TArray&lt;int32&gt; Covered;\n		for (int32 Column = 0; Column &lt; NumberColumns; ++Column)\n		{\n			Covered.Add(GetNumberAt(Column, Row));\n		}\n\n		AddPosition(OutPositions, EHasardBetType::Column, Covered,\n			FVector2D(GridOrigin.X + NumberColumns * CellSizeX + OutsideBandDepth * 0.5f,\n				GetCellCenter(0, Row).Y),\n			FText::Format(LOCTEXT("ColumnFmt", "Column {0}"), FText::AsNumber(Row + 1)),\n			FVector2D(OutsideBandDepth, CellSizeY));\n	}\n\n	// 11. Dozens. Four grid columns each, in the band on the near side.\n	for (int32 Dozen = 0; Dozen &lt; 3; ++Dozen)\n	{\n		TArray&lt;int32&gt; Covered;\n		for (int32 Number = Dozen * 12 + 1; Number &lt;= Dozen * 12 + 12; ++Number)\n		{\n			Covered.Add(Number);\n		}\n\n		// "1st 12" rather than "Dozen 1": it is what a real felt prints, and unlike the\n		// column boxes it still names which dozen, so the log and the readout keep working.\n		static const FText DozenNames[3] = {\n			LOCTEXT("Dozen1", "1st 12"), LOCTEXT("Dozen2", "2nd 12"), LOCTEXT("Dozen3", "3rd 12") };\n\n		AddPosition(OutPositions, EHasardBetType::Dozen, Covered,\n			FVector2D(GridOrigin.X + (Dozen * 4 + 2) * CellSizeX,\n				GridOrigin.Y - OutsideBandDepth * 0.5f),\n			DozenNames[Dozen],\n			FVector2D(4 * CellSizeX, OutsideBandDepth));\n	}\n\n	// 12. The six even-money bets, in the band beyond the dozens.\n	const float EvenMoneyY = GridOrigin.Y - OutsideBandDepth * 1.5f;\n	const float EvenMoneySpan = NumberColumns * CellSizeX / 6.0f;\n\n	TArray&lt;int32&gt; Low, High, Even, Odd, Red, Black;\n	for (int32 Number = 1; Number &lt;= NumberColumns * NumberRows; ++Number)\n	{\n		(Number &lt;= 18 ? Low : High).Add(Number);\n		(Number % 2 == 0 ? Even : Odd).Add(Number);\n		(IsRedNumber(Number) ? Red : Black).Add(Number);\n	}\n\n	const TArray&lt;EHasardBetType&gt; EvenMoneyTypes = {\n		EHasardBetType::Low, EHasardBetType::Even, EHasardBetType::Red,\n		EHasardBetType::Black, EHasardBetType::Odd, EHasardBetType::High };\n\n	const TArray&lt;TArray&lt;int32&gt;&gt; EvenMoneySets = { Low, Even, Red, Black, Odd, High };\n\n	const TArray&lt;FText&gt; EvenMoneyNames = {\n		LOCTEXT("Low", "1-18"), LOCTEXT("Even", "Even"), LOCTEXT("Red", "Red"),\n		LOCTEXT("Black", "Black"), LOCTEXT("Odd", "Odd"), LOCTEXT("High", "19-36") };\n\n	for (int32 Index = 0; Index &lt; EvenMoneyTypes.Num(); ++Index)\n	{\n		AddPosition(OutPositions, EvenMoneyTypes[Index], EvenMoneySets[Index],\n			FVector2D(GridOrigin.X + (Index + 0.5f) * EvenMoneySpan, EvenMoneyY),\n			EvenMoneyNames[Index],\n			FVector2D(EvenMoneySpan, OutsideBandDepth));\n	}\n}\n\n#if WITH_EDITOR\nvoid UHasardTableLayout::PostEditChangeProperty(FPropertyChangedEvent&amp; PropertyChangedEvent)\n{\n	Super::PostEditChangeProperty(PropertyChangedEvent);\n	// Any measurement moves every position, so the cache is thrown away rather than\n	// patched. Rebuilding 157 entries costs nothing next to getting one of them wrong.\n	CachedPositions.Reset();\n}\n#endif\n\n#undef LOCTEXT_NAMESPACE</code></pre><p><b>4.</b> <code>HasardFelt.h</code>. Six components and the surface tuning:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"\n#include "GameFramework/Actor.h"\n#include "HasardInteractable.h"\n#include "HasardFelt.generated.h"\n\nclass AHasardChip;\nclass UBoxComponent;\nclass UHasardBettingComponent;\n-|class UHasardPayoutTable;\nclass UHasardTableLayout;\nclass UInstancedStaticMeshComponent;\nclass UMaterialInstanceDynamic;\nclass UMaterialInterface;\nclass UStaticMesh;\nclass UStaticMeshComponent;\nclass UTextRenderComponent;\nstruct FHasardBetPosition;\n\n/**\n * The betting surface. One actor for all 157 positions.\n *\n * There is deliberately no actor per bet: 83 of the 157 positions are lines and corners\n * between cells, so they have no area of their own and nothing to own a collision volume.\n * Instead this is a single box the trace can hit, and the layout asset turns the impact\n * point into a position id. The felt draws itself from the same numbers, so the picture\n * and the hit test cannot disagree.\n */\nUCLASS()\nclass HASARD_API AHasardFelt : public AActor, public IHasardInteractable\n{\n	GENERATED_BODY()\n	\npublic:	\n	AHasardFelt();\n\n	virtual void OnPlayerInteract_Implementation(APawn* InstigatorPawn,\n		const FVector&amp; HitLocation) override;\n-|\n-|	virtual void OnPlayerHover_Implementation(APawn* InstigatorPawn,\n-|		const FVector&amp; HitLocation) override;\n-|\n-|	virtual void OnPlayerEndHover_Implementation(APawn* InstigatorPawn) override;\n\n	/** Redraws the debug overlay. A details-panel button: an actor gets no exec routing. */\n	UFUNCTION(CallInEditor, Category = "Hasard|Felt")\n	void DrawFelt();\n\n	/** Rebuilds the felt labels after editing the layout or a color. Same button treatment. */\n	UFUNCTION(CallInEditor, Category = "Hasard|Felt")\n	void RebuildLabels();\n\n	/** Reprints the cloth, the lines and every colored box. Same button treatment. */\n	UFUNCTION(CallInEditor, Category = "Hasard|Felt")\n	void RebuildSurface();\n\nprotected:\n	virtual void BeginPlay() override;\n	virtual void EndPlay(const EEndPlayReason::Type EndPlayReason) override;\n	virtual void OnConstruction(const FTransform&amp; Transform) override;\n\nprivate:	\n	/** World point to the felt\'s local 2D space, in centimeters. Z is discarded. */\n	FVector2D WorldToFeltLocal(const FVector&amp; WorldPoint) const;\n\n	/** Felt-local 2D back to world, on the surface. The inverse of the above. */\n	FVector FeltLocalToWorld(const FVector2D&amp; LocalPoint) const;\n\n	/** Resizes the collision box to whatever the layout says the felt measures. */\n	void SyncBoxToLayout();\n\n	/** Persistent debug lines for the grid, the bands, and every chip location. */\n	void DrawDebugLayout() const;\n\n	/**\n	 * Destroys every existing label, then makes one per bet the player reads by name.\n	 *\n	 * Called from BeginPlay rather than OnConstruction: OnConstruction runs on every\n	 * property edit and on every level load, and creating components there means\n	 * managing their destruction against a construction script that may not have run.\n	 */\n	void BuildLabels();\n\n	/**\n	 * Prints the whole felt: cloth, then a white plate per box, then the color inset on it.\n	 *\n-|	 * Called from BeginPlay and from the button, never from OnConstruction. It creates\n-|	 * material instances, and OnConstruction runs on every property edit - one dynamic\n-|	 * instance per nudge of a color slider is churn with nothing to show for it.\n+|	 * Called from OnConstruction as well as BeginPlay, and it has to be. An instanced\n+|	 * component builds its render state when it registers, and one registered without a\n+|	 * mesh does not pick up a mesh or a material assigned later - the values are stored\n+|	 * and the renderer keeps drawing the default. The cost is a dynamic material instance\n+|	 * per property edit in the editor, which is churn worth paying to have the felt draw.\n	 */\n	void BuildSurface();\n\n	/** Points a component at BoxMesh and SurfaceMaterial, and returns its color instance. */\n	UMaterialInstanceDynamic* PrepareSurface(UStaticMeshComponent* Component,\n		const FColor&amp; Color) const;\n\n	/**\n	 * Which instanced component prints this box, which is the same question as what color\n	 * it is: the components are split by color, so routing and coloring cannot disagree.\n	 *\n	 * Zero is not routed here. It is one quad with its own component, because it is the\n	 * one box whose color is a statement about the odds rather than a decoration.\n	 */\n	UInstancedStaticMeshComponent* BoxesFor(const FHasardBetPosition&amp; Position,\n		const UHasardTableLayout&amp; Layout) const;\n\n	/** A box centered on a felt-local point, laid flat at the given height. */\n	FTransform BoxTransform(const FVector2D&amp; Center, const FVector2D&amp; Size, float Height) const;\n\n	/**\n	 * What a position is printed as, which is not always what it is called.\n	 *\n	 * A real layout prints the three column boxes as "2 to 1" rather than naming them,\n	 * so the felt says that. DisplayName still says "Column 2", because a click log and\n	 * the bet readout have to name which one - "2 to 1" identifies a payout, not a bet.\n	 */\n	FText LabelTextFor(const FHasardBetPosition&amp; Position) const;\n\n	/** Which of the two rotations a position reads at. See LabelRotationTurned. */\n	FRotator LabelRotationFor(const FHasardBetPosition&amp; Position) const;\n\n	/** Puts one chip on a position, on top of whatever is already there. */\n	void SpawnChip(const FHasardBetPosition&amp; Position);\n\n	/** Destroys every chip and forgets every stack height. */\n	void ClearChips();\n\n	/** Bound to the betting component\'s OnBetsCleared. No UFUNCTION: not a dynamic delegate. */\n	void HandleBetsCleared();\n\n	/** The chip a click would place, or null. Its value is what a click costs. */\n	const AHasardChip* GetChipDefault() const;\n-|\n-|	/**\n-|	 * Puts the ghost chip and the readout on a position. Safe to call every frame with\n-|	 * the same position: it only rebuilds the text when the position actually changed.\n-|	 */\n-|	void ShowPreview(const FHasardBetPosition&amp; Position);\n-|\n-|	/** Hides both. Every path that stops previewing goes through here. */\n-|	void HidePreview();\n-|\n-|	/**\n-|	 * What the readout says: the bet, what it costs, and what it returns if it wins.\n-|	 *\n-|	 * The return is computed with the same expression settlement uses,\n-|	 * Stake * (PayoutRatio + 1), rather than a second one that means the same thing.\n-|	 * A readout that promised a different number than the bankroll pays would be a lie\n-|	 * told at exactly the moment the player is deciding.\n-|	 */\n-|	FText ReadoutTextFor(const FHasardBetPosition&amp; Position, const AHasardChip&amp; Chip) const;\n\n	/** Fixed origin. Everything else is measured and offset from here. */\n	UPROPERTY(VisibleAnywhere, Category = "Hasard|Felt")\n	TObjectPtr&lt;USceneComponent&gt; Root;\n\n	/** The trace target. Sized from the layout, never authored by hand. */\n	UPROPERTY(VisibleAnywhere, Category = "Hasard|Felt")\n	TObjectPtr&lt;UBoxComponent&gt; Surface;\n\n	/** The green cloth the whole layout is printed on. One quad, sized from the bounds. */\n	UPROPERTY(VisibleAnywhere, Category = "Hasard|Surface")\n	TObjectPtr&lt;UStaticMeshComponent&gt; Cloth;\n\n	/**\n	 * The white plate behind every box, one instance per box at full size.\n	 *\n	 * There is no separate line geometry. Each colored box is inset by BorderWidth on\n	 * every side, so the plate showing round its edge *is* the printed line - which means\n	 * a line can never be drawn somewhere a box is not, and the two cannot drift apart.\n	 */\n	UPROPERTY(VisibleAnywhere, Category = "Hasard|Surface")\n	TObjectPtr&lt;UInstancedStaticMeshComponent&gt; Lines;\n\n	/**\n	 * The colored faces, split by color rather than by bet type.\n	 *\n	 * Three components and about 120 instances for the whole felt, against one component\n	 * per box. That is a draw-call decision made now because it is nearly free now: at\n	 * VR framerates the same table has to render twice per frame, and sixty-odd separate\n	 * primitives is the kind of thing that is painful to unpick after the fact.\n	 */\n	UPROPERTY(VisibleAnywhere, Category = "Hasard|Surface")\n	TObjectPtr&lt;UInstancedStaticMeshComponent&gt; RedBoxes;\n\n	UPROPERTY(VisibleAnywhere, Category = "Hasard|Surface")\n	TObjectPtr&lt;UInstancedStaticMeshComponent&gt; BlackBoxes;\n\n	/** Every outside bet. Green is the table\'s own color, not an absence of one. */\n	UPROPERTY(VisibleAnywhere, Category = "Hasard|Surface")\n	TObjectPtr&lt;UInstancedStaticMeshComponent&gt; GreenBoxes;\n\n	/**\n	 * Zero, alone, on its own component.\n	 *\n	 * One quad does not need instancing, and putting it on the outside-bet component\n	 * would have made zero the same color as a dozen box by construction. It is a single\n	 * pocket with a color that means something, so it gets a mesh that can only be it.\n	 */\n	UPROPERTY(VisibleAnywhere, Category = "Hasard|Surface")\n	TObjectPtr&lt;UStaticMeshComponent&gt; ZeroBox;\n\n	/**\n	 * Assigned on BP_Felt, and it must be the same asset the GameMode holds.\n	 * Two different layouts would put the chip somewhere the settlement does not expect.\n	 */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Felt",\n		meta = (AllowPrivateAccess = "true"))\n	TObjectPtr&lt;UHasardTableLayout&gt; TableLayout;\n\n	/**\n-|	 * The same payout asset the GameMode settles with. Read only to state what a bet\n-|	 * pays before it is placed.\n-|	 *\n-|	 * The felt does not pay anyone and must never start. It holds this so the player can\n-|	 * be told the price of a bet while they can still decline it - which is the whole\n-|	 * reason this module exists, and the reason a ghost chip on its own would have been\n-|	 * the wrong feature.\n-|	 */\n-|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Felt",\n-|		meta = (AllowPrivateAccess = "true"))\n-|	TObjectPtr&lt;UHasardPayoutTable&gt; PayoutTable;\n-|\n-|	/**\n	 * Draws the grid and all 157 chip locations on BeginPlay. Debug builds only.\n	 *\n	 * Off by default since the felt prints itself: the debug lines and the printed lines\n	 * are drawn from the same numbers, so leaving both on shows one picture twice and\n	 * makes a real disagreement harder to see rather than easier.\n	 */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Felt",\n		meta = (AllowPrivateAccess = "true"))\n	bool bDrawDebugLayout = false;\n\n	/** Height of the collision box. The felt is flat; this is just enough to trace against. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Felt",\n		meta = (AllowPrivateAccess = "true", ClampMin = "0.1"))\n	float SurfaceThickness = 2.0f;\n\n	/** Every label this actor made. UPROPERTY so the collector can see them. */\n	UPROPERTY()\n	TArray&lt;TObjectPtr&lt;UTextRenderComponent&gt;&gt; Labels;\n\n	/**\n	 * The chip a click places. Assigned on BP_Felt.\n	 *\n	 * The class carries the stake, the mesh, the scale and the color together, so the\n	 * felt never holds a stake of its own to disagree with. Swapping this for a ten\n	 * changes what a click costs and what it looks like in one edit.\n	 */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Chips",\n		meta = (AllowPrivateAccess = "true"))\n	TSubclassOf&lt;AHasardChip&gt; ChipClass;\n\n	/** Every chip currently on the felt. UPROPERTY so the collector can see them. */\n	UPROPERTY()\n	TArray&lt;TObjectPtr&lt;AHasardChip&gt;&gt; Chips;\n\n	/**\n	 * How many chips already sit on each position, keyed by PositionId.\n	 *\n	 * Not a UPROPERTY: two ints per entry and no UObject in sight, so there is nothing\n	 * for the collector to track and nothing worth serializing into the map.\n	 */\n	TMap&lt;int32, int32&gt; StackCounts;\n\n	/**\n	 * The component this felt is listening to. Weak, because the pawn owns it and can\n	 * be destroyed first - a raw pointer here would be a dangling unbind in EndPlay.\n	 */\n	TWeakObjectPtr&lt;UHasardBettingComponent&gt; BoundBetting;\n\n-|	/**\n-|	 * The ghost chip under the aim. Spawned once and moved, never once bet with.\n-|	 *\n-|	 * It is an AHasardChip of the same ChipClass a click would place, so its size,\n-|	 * height and colour are the real thing by construction rather than by being kept\n-|	 * in step. Only its material differs.\n-|	 */\n-|	UPROPERTY()\n-|	TObjectPtr&lt;AHasardChip&gt; PreviewChip;\n-|\n-|	/** Which position the preview is showing, or INDEX_NONE when it is hidden. */\n-|	int32 PreviewPositionId = INDEX_NONE;\n-|\n-|	/** Names the bet under the aim and what it pays. Positioned on the player\'s edge. */\n-|	UPROPERTY(VisibleAnywhere, Category = "Hasard|Preview")\n-|	TObjectPtr&lt;UTextRenderComponent&gt; Readout;\n-|\n-|	/**\n-|	 * The see-through material the ghost chip wears. Assigned on BP_Felt.\n-|	 *\n-|	 * Without one the preview is a solid chip indistinguishable from a placed bet, so\n-|	 * the felt refuses to preview at all rather than show a chip that looks paid for.\n-|	 */\n-|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Preview",\n-|		meta = (AllowPrivateAccess = "true"))\n-|	TObjectPtr&lt;UMaterialInterface&gt; PreviewMaterial;\n-|\n-|	/**\n-|	 * Where the readout sits, in the felt\'s local 2D space.\n-|	 *\n-|	 * A fixed spot rather than following the aim. A caption that moves with the cursor\n-|	 * has to be re-found every time it changes, and the player is reading it at the\n-|	 * moment they are deciding whether to spend - so it goes in one place they learn.\n-|	 */\n-|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Preview",\n-|		met
