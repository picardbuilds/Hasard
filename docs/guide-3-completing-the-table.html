<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);

nav .grp{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#5b6779;margin:18px 20px 6px}
#main{flex:1;min-width:0;padding:46px 56px 120px;max-width:920px}
.kicker{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.1em;text-transform:uppercase}
h2.title{font-size:31px;line-height:1.2;margin:6px 0 6px;letter-spacing:-.01em}
.lede{color:var(--dim);font-size:15px;margin:0 0 30px;padding-bottom:22px;border-bottom:1px solid var(--line)}

p{margin:0 0 14px}
ul{margin:0 0 14px;padding-left:22px}li{margin:6px 0}
code{font-family:var(--mono);font-size:.87em;background:var(--panel2);padding:1px 5px;border-radius:4px;color:#c8d6ea}

table{width:100%;border-collapse:collapse;margin:0 0 18px;font-size:14px}

.chk .q{margin:0 0 12px}
.chk button{background:none;border:1px solid #3a4a66;color:var(--accent);font:inherit;font-size:13px;padding:5px 13px;border-radius:6px;cursor:pointer}

.chk .ans{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed #2c3a52;color:#cbd6e6;font-size:15px}
.chk.open .ans{display:block}.chk.open button{display:none}
.quiz{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:24px 26px;margin:36px 0 0}
.quiz h4{margin:0 0 4px;font-size:17px}
.quiz .hint{color:var(--dim);font-size:13px;margin:0 0 20px}
.qi{margin:0 0 22px;padding:0 0 18px;border-bottom:1px solid var(--line)}
.qi:last-of-type{border-bottom:0}
.qi .qt{font-weight:600;margin:0 0 11px}
.qi .qt .num{font-family:var(--mono);color:var(--accent);font-size:13px;margin-right:8px}
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);
  color:var(--text);font:inherit;font-size:14.5px;padding:10px 14px;border-radius:7px;margin:0 0 8px;cursor:pointer}
.opt:hover:not(:disabled){border-color:#3e5170}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:#12261f;color:#bff3dc}
.opt.wrong{border-color:var(--bad);background:#2a1517;color:#ffc9c9}
.why{display:none;font-size:14px;color:#b9c6d8;background:#101722;border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:7px;padding:11px 14px;margin-top:6px}
.why.show{display:block}
.score{margin-top:8px;padding:14px 16px;border-radius:8px;background:var(--panel2);font-size:14.5px;display:none}
.score.show{display:block}
.pager{display:flex;justify-content:space-between;gap:14px;margin-top:48px;padding-top:26px;border-top:1px solid var(--line)}
.pager button{background:var(--panel2);border:1px solid var(--line);color:var(--text);font:inherit;font-size:14px;padding:11px 20px;border-radius:8px;cursor:pointer}
.pager button:hover{border-color:var(--accent);color:var(--accent)}
.pager button:disabled{opacity:.3;cursor:default}
.pager button.primary{background:var(--accent);color:#08111e;border-color:var(--accent);font-weight:600}
@media(max-width:900px){#wrap{flex-direction:column}#side{width:100%;flex:none;height:auto;position:static}#main{padding:28px 20px 80px}}
</style>

<script>
const COURSE = [

/* ---------------------------------------------------------- 0 */
{
grp:"Orientation",
title:"What the table is missing",
lede:"Guide 2 shipped a wheel you can prove and a felt with three bet spots. This guide turns three into 157.",
blocks:[
{t:'h',x:'Where guide 2 left you'},
{t:'p',x:'You have a wheel that broadcasts a pocket, a bankroll that cannot go negative, a HUD that shows the cost of playing, a payout table computed from data rather than literals, and a distribution test that proves the odds display is not lying. That is a complete vertical slice, and it is honest.</p><p>What it is not yet is roulette. You can back a single number, and you can back two or three other things, because three bet spots is what fits in a level by hand.'},
{t:'h',x:'What a full felt actually is'},
{t:'p',x:'A European table has <b>157 distinct places a chip can sit</b>, and every one of them is a different bet. Not 157 numbers &mdash; 157 <i>positions</i>, most of which sit on a line or a corner rather than inside a box.'},
{t:'table',head:['Bet','Positions','Covers','Pays'],rows:[
['Straight up','37','1 number','35:1'],
['Split','60','2 numbers','17:1'],
['Street','12','3 numbers','11:1'],
['Trio (with zero)','2','3 numbers','11:1'],
['Corner','22','4 numbers','8:1'],
['Basket (0/1/2/3)','1','4 numbers','8:1'],
['Six line','11','6 numbers','5:1'],
['Column','3','12 numbers','2:1'],
['Dozen','3','12 numbers','2:1'],
['Red, Black, Even, Odd, 1-18, 19-36','6','18 numbers','1:1'],
['<b>Total</b>','<b>157</b>','','']]},
{t:'p',x:'Sixty of those are splits, and a split is not a box you can click &mdash; it is the <i>line between</i> two boxes. That single fact decides the architecture of this guide.'},
{t:'chk',q:'Why can a split not be a clickable box like a straight up?',a:'<b>Because it is not a box.</b> A split is the line shared by two adjacent numbers, and a corner is the point where four meet. Their positions exist only in relation to the boxes around them. Build the felt as a set of clickable boxes and the 83 line and corner bets have nowhere to live &mdash; you would have to add 83 more invisible boxes overlapping the first 37, which is the point at which the approach admits it was the wrong one.'},

{t:'h',x:'The decision that shapes this guide'},
{t:'rg',lab:'The bet is where the chip sits',x:'<p>On a real table nobody presses a button. The croupier reads the bet off the felt: a chip in the middle of a box is that number, a chip on a line is those two numbers, a chip on a corner is those four. <b>The position of the chip is the bet.</b></p><p>So Hasard does not get 157 buttons. It gets one felt, and a function that turns a point on that felt into a bet. That is more faithful, it is far less to maintain, and it is the only version that survives contact with VR &mdash; when the player picks up a physical chip and puts it down on a line, that <i>is</i> a split, with no extra code. Buttons are a thing you would build twice and throw away once.</p>'},
{t:'p',x:'Two consequences follow, and both are worth stating before you write anything.'},
{t:'list',x:[
'<b>The felt draws itself from the same numbers the clicking uses.</b> One cell size, one grid origin, one asset. If the picture and the hit test come from different places they will disagree, and you will not be able to tell which of the two is wrong.',
'<b>A bet stores a position, not a number.</b> Your <code>FHasardBet</code> holds a single <code>PrimaryNumber</code>, which cannot express a split. It becomes a position id into a generated table, so a bet can never describe a position that does not exist.']},
{t:'aside',lab:'Why this guide comes before saves',x:'Module 14 of guide 2 suggested subsystems and then save systems next. This work jumped the queue for one reason: it changes <code>FHasardBet</code>, and a save system is a thing that writes <code>FHasardBet</code> to disk. Persist the old shape first and you will be writing a migration for a format that lasted a week. Data model before persistence, every time.'},

{t:'h',x:'What you will build'},
{t:'list',x:[
'<b>Module 1</b> &mdash; every measurement of the felt in one data asset, and the grid arithmetic that turns a number into a place.',
'<b>Module 2</b> &mdash; all 157 positions generated from that asset, with an audit that proves each one pays the house exactly 2.70%.']},
{t:'p',x:'Later modules draw the felt from the layout, turn a trace hit into a position, show the player what they are about to back before they commit, and settle bets against covered numbers. Every one of them reads the asset you build in module 1.'},
{t:'h',x:'Reading the build-along code'},
{t:'p',x:'Every code block in a Build panel is a <b>complete file</b>, and the changes are marked in the gutter so you can see what moved without diffing by eye. Module 1 is marked against where guide 2 left the project; module 2 is marked against module 1.'},
{t:'code',x:'	int32 UnchangedLine = 0;      // no marker - leave it alone\n+|	int32 AddedLine = 0;          // type this one in\n~|	int32 ChangedLine = 157;      // was 3 - the line existed, the line is different\n-|	int32 RemovedLine = 0;        // shown so you can find it and delete it'},
{t:'list',x:[
'<b>Green, <code>+</code></b> &mdash; type this line in. It was not there before.',
'<b>Amber, <code>~</code></b> &mdash; this line existed but is not the same line. Often only a comment moved; read it before you assume nothing did.',
'<b>Red, struck through, <code>-</code></b> &mdash; <b>context only, do not type it.</b> It is shown so you can find and remove it. Struck-through lines are excluded from text selection, so selecting a whole block and copying gives you the file as it should end up rather than the file plus the lines you were meant to delete.']},
{t:'aside',lab:'Why the marker and not just the color',x:'The gutter glyph carries the meaning and the color reinforces it, rather than the other way round. Roughly one man in twelve cannot reliably separate the green from the amber, and a build-along guide where a third of the readers cannot tell &ldquo;add this&rdquo; from &ldquo;change this&rdquo; is a guide that wastes their evening. The same reasoning applies to the felt you are about to build: red and black are the two colors in roulette, and module 3 will need a second signal for them too.'},
{t:'srcs',x:[['Data Assets','https://dev.epicgames.com/documentation/en-us/unreal-engine/data-assets-in-unreal-engine'],['Structs','https://dev.epicgames.com/documentation/en-us/unreal-engine/structs-in-unreal-engine']]}
],
quiz:[
{q:'How many distinct bet positions does a single-zero table have?',
 opts:['37, one per pocket','49','157','Depends on the casino'],
 c:2,why:'37 straight ups, 60 splits, 14 streets and trios, 23 corners and the basket, 11 six lines, 3 columns, 3 dozens and 6 even-money bets. The count is fixed by the geometry of the felt, not by house rules.'},
{q:'The main argument against one clickable actor per bet position is:',
 opts:['157 actors is unmaintainable, and line bets have no box to be','Performance','Unreal caps actors per level','Blueprint cannot handle it'],
 c:0,why:'157 hand-placed actors would need replacing every time the felt moved, and splits and corners are lines and points rather than boxes, so they have no natural actor to be. Performance is not the problem; 157 actors is nothing.'},
{q:'Why must the felt visual and the click detection share one source of numbers?',
 opts:['To save memory','It is an Unreal requirement','Blueprint cannot read two assets','Because when they disagree there is no way to tell which one is wrong'],
 c:3,why:'A click that lands one box away from what the player sees is a bug with two possible causes and no way to distinguish them. One source of truth removes the class of bug entirely rather than making it easier to find.'},
{q:'Why does the betting layout come before a save system?',
 opts:['Saving is harder','It changes FHasardBet, which is what a save system writes to disk','Saving needs a subsystem first','It does not, either order works'],
 c:1,why:'Persist a data format you are about to change and you inherit a migration for no reason. Settle the shape of a bet, then teach it to survive a restart.'},
{q:'A chip sitting on the line between 17 and 20 is:',
 opts:['An invalid bet','Two separate straight-up bets','Whichever number is nearer','A split, paying 17:1'],
 c:3,why:'Line bets are the majority of the felt: 60 of the 157 positions are splits. Treating a line as ambiguous rather than meaningful is what forces the button approach.'}
]
},

/* ---------------------------------------------------------- 1 */
{
grp:"Part I \u2014 The Felt as Data",
title:"Every measurement in one asset",
lede:"Cell size, grid origin, tolerance. One asset that the picture and the hit test both read, so they cannot drift apart.",
blocks:[
{t:'h',x:'One source of truth, and it is not the mesh'},
{t:'p',x:'The temptation is to model a felt, look at it, and then type numbers into code until the clicking lines up. That works right up until you nudge the mesh, and then it fails in a way that is genuinely hard to debug: the player clicks 17 and backs 20, and nothing in the log is wrong.'},
{t:'p',x:'So the measurements come first and everything else reads them. A <code>UDataAsset</code> holds the cell size, the grid origin and the tolerance band; module 3 will draw the felt from those numbers, and module 4 will hit-test against the same ones. <b>Neither is allowed to hard-code a measurement.</b> That is the whole design, and it is one asset.'},
{t:'aside',lab:'Why a data asset and not a config file or constants',x:'You already met this pattern in guide 2, module 12: the payout table is a <code>UDataAsset</code> so payouts never come from a literal. Same argument, same reason. A designer can open it, it is versioned with the project, it shows up in the reference viewer, and a Blueprint can read it. Constants in a header would need a recompile and would be invisible to everyone who is not a programmer.'},

{t:'h',x:'The grid is arithmetic'},
{t:'p',x:'The 36 numbers sit in a grid of <b>12 columns by 3 rows</b>. Column 0 holds 1, 2 and 3; column 1 holds 4, 5 and 6; and so on to column 11, which holds 34, 35 and 36. Zero has its own box beside the grid, spanning all three rows, which is why it has no column or row of its own.'},
{t:'p',x:'That gives you the two formulas the entire guide rests on:'},
{t:'code',x:`// Number at a cell:
Number = Column * NumberRows + Row + 1;

// Cell holding a number:
Column = (Number - 1) / NumberRows;   // integer division
Row    = (Number - 1) % NumberRows;

// 17 - 1 = 16.  16 / 3 = 5 remainder 1.  So 17 is column 5, row 1.`},
{t:'p',x:'Everything else in module 2 &mdash; splits, corners, streets, six lines, columns &mdash; is expressed in terms of those two, which is why they are worth getting exactly right before anything is drawn.'},
{t:'chk',q:'Using <code>Number = Column * 3 + Row + 1</code>, which cell holds 30, and what is the number two columns to its right in the same row?',a:'<b>30 is column 9, row 2.</b> 30 - 1 = 29; 29 / 3 = 9 remainder 2. Two columns right in the same row is column 11, row 2, which is 11 * 3 + 2 + 1 = <b>36</b>. Note that moving one column sideways adds 3 to the number, and moving one row adds 1 &mdash; those two steps are the whole of what a split is.'},
{t:'warn',lab:'The rows are not the number rows a player sees',x:'<p>A grid <i>row</i> in this code is one of the three long lines running the length of the felt &mdash; row 0 is 1, 4, 7 &hellip; 34. That is a <b>column bet</b> on a real table, because the felt is printed with the long axis running away from the player, so what the code calls a row the felt calls a column.</p><p>This is not a mistake to fix, it is a collision between two vocabularies, and the code has to pick one. It picks the grid&rsquo;s. <b>Grid row = the 2:1 column bet. Grid column = the street of three.</b> Keep that straight and module 2 reads easily; get it backwards and every bet with more than two numbers will be wrong in a way that still compiles.'},

{t:'h',x:'What a position will need'},
{t:'p',x:'Module 2 generates the positions, but the struct that holds one is added now, because <code>HasardTypes.h</code> is being opened anyway. A position carries its id, its bet type, the numbers it pays on, where its chip sits, and what to call it on screen.'},
{t:'p',x:'The enum needs two new entries at the same time. <b>Trio</b> is the three-number bet that includes zero (0/1/2 and 0/2/3), and <b>Basket</b> is 0/1/2/3. Both already have a payout twin &mdash; a trio pays 11:1 like a street, a basket 8:1 like a corner &mdash; but they get their own entries so the readout can name them correctly and so the payout table can hold a row for each.'},
{t:'chk',q:'Why is <code>DisplayName</code> on the position an <code>FText</code> rather than an <code>FString</code>?',a:'<b>Because a player reads it.</b> Epic&rsquo;s rule is that anything user-facing is <code>FText</code>, which is the only one of the three string types that can be localised. <code>FString</code> is for construction and parsing, <code>FName</code> for identifiers and lookup keys. The hover readout in a later module puts this string in front of the player, which settles it.'},

{t:'build',title:'The layout asset',file:'Source/Hasard/HasardTypes.h, HasardTableLayout.h + .cpp, HasardGameMode.h + .cpp',x:'<p><b>Phase 1 &mdash; create the class.</b></p> <p><b>1.</b> With the editor open: <b>Tools &rarr; New C++ Class</b>. In the class picker the parent you want is not on the common list, so tick <b>All Classes</b> at the top right and type <code>DataAsset</code> into the search box. Select <b>DataAsset</b> and press <b>Next</b>.</p> <p><b>2.</b> Name it <code>HasardTableLayout</code>. Confirm the module dropdown reads <b>Hasard (Runtime)</b> and the path is <code>Source/Hasard/</code>. Press <b>Create Class</b>. Visual Studio opens the two new files and the editor offers to recompile &mdash; <b>decline it</b> and close the editor instead, because four headers are about to change and Live Coding cannot handle those.</p> <p><b>Phase 2 &mdash; Visual Studio.</b> Five files, all shown complete, marked against where guide 2 left the project: <b>+</b> new, <b>~</b> changed, <b>-</b> struck through means delete it. Replace what is on disk rather than merging by eye &mdash; the markers are there so you can see what you changed, not so you can hand-apply them.</p> <p><b>3.</b> <code>HasardTypes.h</code>, complete. The log category and <code>FHasardBet</code> are guide 2 unchanged; the two enum entries and <code>FHasardBetPosition</code> are new:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n~|#include "CoreMinimal.h"             // int32, uint8, TArray, FVector2D, the logging macros\n~|#include "HasardTypes.generated.h"   // ALWAYS LAST\n\n/** One category for the whole project. Defined once, in HasardGameMode.cpp. */\nDECLARE_LOG_CATEGORY_EXTERN(LogHasard, Log, All);\n\nUENUM(BlueprintType)\nenum class EHasardBetType : uint8\n{\n~|	StraightUp  UMETA(DisplayName = "Straight Up"),   // 1 number,  pays 35:1\n~|	Split       UMETA(DisplayName = "Split"),         // 2 numbers, pays 17:1\n~|	Street      UMETA(DisplayName = "Street"),        // 3 numbers, pays 11:1\n+|	Trio        UMETA(DisplayName = "Trio"),          // 3 numbers, pays 11:1 - the two that include zero\n~|	Corner      UMETA(DisplayName = "Corner"),        // 4 numbers, pays  8:1\n+|	Basket      UMETA(DisplayName = "Basket"),        // 4 numbers, pays  8:1 - 0/1/2/3\n~|	SixLine     UMETA(DisplayName = "Six Line"),      // 6 numbers, pays  5:1\n~|	Column      UMETA(DisplayName = "Column"),        // 12 numbers, pays 2:1\n~|	Dozen       UMETA(DisplayName = "Dozen"),         // 12 numbers, pays 2:1\n~|	Red         UMETA(DisplayName = "Red"),           // 18 numbers, pays 1:1\n	Black       UMETA(DisplayName = "Black"),\n	Even        UMETA(DisplayName = "Even"),\n	Odd         UMETA(DisplayName = "Odd"),\n	Low         UMETA(DisplayName = "Low 1-18"),\n	High        UMETA(DisplayName = "High 19-36")\n+|};\n+|\n+|/**\n+| * One place a chip can legally sit, and everything that follows from it.\n+| *\n+| * Generated from the layout asset, never authored by hand. A bet stores the\n+| * PositionId and nothing else, so a bet cannot describe a position that does not exist.\n+| */\n+|USTRUCT(BlueprintType)\n+|struct FHasardBetPosition\n+|{\n+|	GENERATED_BODY()\n+|\n+|	/**\n+|	 * Index into the generated array, stamped from its own position on append.\n+|	 * The array is append-only for that reason: a sort or a remove leaves every\n+|	 * id pointing at the wrong position, and nothing would report it.\n+|	 */\n+|	UPROPERTY(BlueprintReadOnly, Category = "Hasard|Layout")\n+|	int32 PositionId = INDEX_NONE;\n+|\n+|	UPROPERTY(BlueprintReadOnly, Category = "Hasard|Layout")\n+|	EHasardBetType BetType = EHasardBetType::StraightUp;\n+|\n+|	/** Every pocket this position pays on, ascending. The audit checks this count against the payout rule. */\n+|	UPROPERTY(BlueprintReadOnly, Category = "Hasard|Layout")\n+|	TArray&lt;int32&gt; CoveredNumbers;\n+|\n+|	/** Where the chip sits, in the felt\'s local 2D space, in centimeters. */\n+|	UPROPERTY(BlueprintReadOnly, Category = "Hasard|Layout")\n+|	FVector2D ChipLocation = FVector2D::ZeroVector;\n+|\n+|	/** What the hover readout shows the player. FText because a player reads it. */\n+|	UPROPERTY(BlueprintReadOnly, Category = "Hasard|Layout")\n+|	FText DisplayName;\n};\n\nUSTRUCT(BlueprintType)\nstruct FHasardBet\n{\n	GENERATED_BODY()\n\n	UPROPERTY(BlueprintReadOnly, Category = "Hasard|Bet")\n	EHasardBetType BetType = EHasardBetType::StraightUp;\n\n	UPROPERTY(BlueprintReadOnly, Category = "Hasard|Bet")\n	int32 PrimaryNumber = 0;\n\n	UPROPERTY(BlueprintReadOnly, Category = "Hasard|Bet")\n	int32 Stake = 0;\n};\n</code></pre><p><code>FHasardBetPosition</code> has no <code>Edit</code> specifier anywhere on it, only <code>BlueprintReadOnly</code>. Nothing hand-authors a position &mdash; they are generated, all 157 of them, and a field a designer could type into would be a field that could disagree with the generator.</p> <p><b>4.</b> <code>HasardTableLayout.h</code>, complete. Delete everything the wizard wrote and use this:</p><pre><code>+|// Copyright Picardbuilds. All Rights Reserved.\n+|\n+|#pragma once\n+|\n+|#include "CoreMinimal.h"                       // int32, TArray, FVector2D, the core macros\n+|#include "Engine/DataAsset.h"                  // UDataAsset, the base class\n+|#include "HasardTypes.h"                       // EHasardBetType\n+|#include "HasardTableLayout.generated.h"       // ALWAYS LAST\n+|\n+|/**\n+| * Every measurement of the felt, in one asset.\n+| *\n+| * The visible layout and the click detection are both generated from these numbers,\n+| * so they cannot disagree with each other. Nothing else in the project may hard-code\n+| * a cell size or a grid origin.\n+| */\n+|UCLASS(BlueprintType)\n+|class HASARD_API UHasardTableLayout : public UDataAsset\n+|{\n+|	GENERATED_BODY()\n+|\n+|public:\n+|	/** The number at a grid cell. Column 0 row 0 is 1; column 0 row 2 is 3; column 1 row 0 is 4. */\n+|	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n+|	int32 GetNumberAt(int32 Column, int32 Row) const;\n+|\n+|	/** Grid column holding a number, 0-11. INDEX_NONE for zero or an out-of-range number. */\n+|	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n+|	int32 GetColumnOf(int32 Number) const;\n+|\n+|	/** Grid row holding a number, 0-2. INDEX_NONE for zero or an out-of-range number. */\n+|	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n+|	int32 GetRowOf(int32 Number) const;\n+|\n+|	/** Center of one cell, in the felt\'s local 2D space. */\n+|	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n+|	FVector2D GetCellCenter(int32 Column, int32 Row) const;\n+|\n+|	/** Far corner of the number grid, so callers can size the felt without repeating the sum. */\n+|	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n+|	FVector2D GetGridExtent() const;\n+|\n+|	/** True for the eighteen red numbers on a single-zero wheel. */\n+|	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n+|	bool IsRedNumber(int32 Number) const;\n+|\n+|	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n+|	int32 GetNumberColumns() const { return NumberColumns; }\n+|\n+|	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n+|	int32 GetNumberRows() const { return NumberRows; }\n+|\n+|	UFUNCTION(BlueprintPure, Category = "Hasard|Layout")\n+|	float GetLineTolerance() const { return LineTolerance; }\n+|\n+|private:\n+|	/** Twelve columns of three. Editable only because a future variant may differ. */\n+|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n+|		meta = (AllowPrivateAccess = "true", ClampMin = "1"))\n+|	int32 NumberColumns = 12;\n+|\n+|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n+|		meta = (AllowPrivateAccess = "true", ClampMin = "1"))\n+|	int32 NumberRows = 3;\n+|\n+|	/** Size of one number cell in centimeters, along the twelve columns. */\n+|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n+|		meta = (AllowPrivateAccess = "true", ClampMin = "1.0"))\n+|	float CellSizeX = 12.0f;\n+|\n+|	/** Size of one number cell in centimeters, across the three rows. */\n+|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n+|		meta = (AllowPrivateAccess = "true", ClampMin = "1.0"))\n+|	float CellSizeY = 12.0f;\n+|\n+|	/** Felt-local position of the near corner of cell (0,0). Everything is measured from here. */\n+|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n+|		meta = (AllowPrivateAccess = "true"))\n+|	FVector2D GridOrigin = FVector2D::ZeroVector;\n+|\n+|	/** Width of the zero box, which sits at negative X of the grid and spans all three rows. */\n+|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n+|		meta = (AllowPrivateAccess = "true", ClampMin = "1.0"))\n+|	float ZeroBoxWidth = 12.0f;\n+|\n+|	/** Depth of each outside-bet band. Dozens sit against the grid, even-money beyond them. */\n+|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n+|		meta = (AllowPrivateAccess = "true", ClampMin = "1.0"))\n+|	float OutsideBandDepth = 12.0f;\n+|\n+|	/**\n+|	 * How close to a line counts as being on it, as a fraction of a cell.\n+|	 * 0.22 means the middle 56% of a cell is a straight up and the rest is a line bet.\n+|	 */\n+|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Layout",\n+|		meta = (AllowPrivateAccess = "true", ClampMin = "0.05", ClampMax = "0.45"))\n+|	float LineTolerance = 0.22f;\n+|};\n</code></pre><p>Every measurement is <code>private</code> with a <code>BlueprintPure</code> accessor where something outside needs to read it, which is the guide 2 module 3 rule unchanged. All seven numbers carry a <code>ClampMin</code>, because every one of them is nonsense at zero and a designer can type into all of them.</p> <p><code>LineTolerance</code> is the one that is not a measurement of anything physical. It is how close to a line counts as being on it, as a fraction of a cell. At <code>0.22</code> the middle 56% of a cell is a straight up and the outer band is a line bet, which is roughly how much of a real box a real chip leaves uncovered. You will tune it in module 4 when you can see it.</p> <p><b>5.</b> <code>HasardTableLayout.cpp</code>, complete:</p><pre><code>+|// Copyright Picardbuilds. All Rights Reserved.\n+|\n+|#include "HasardTableLayout.h"   // the class this file defines\n+|#include "HasardTypes.h"         // EHasardBetType\n+|\n+|#define LOCTEXT_NAMESPACE "Hasard"\n+|\n+|int32 UHasardTableLayout::GetNumberAt(int32 Column, int32 Row) const\n+|{\n+|	if (Column &lt; 0 || Column &gt;= NumberColumns || Row &lt; 0 || Row &gt;= NumberRows)\n+|	{\n+|		return INDEX_NONE;\n+|	}\n+|\n+|	return Column * NumberRows + Row + 1;\n+|}\n+|\n+|int32 UHasardTableLayout::GetColumnOf(int32 Number) const\n+|{\n+|	if (Number &lt; 1 || Number &gt; NumberColumns * NumberRows)\n+|	{\n+|		return INDEX_NONE;\n+|	}\n+|\n+|	return (Number - 1) / NumberRows;\n+|}\n+|\n+|int32 UHasardTableLayout::GetRowOf(int32 Number) const\n+|{\n+|	if (Number &lt; 1 || Number &gt; NumberColumns * NumberRows)\n+|	{\n+|		return INDEX_NONE;\n+|	}\n+|\n+|	return (Number - 1) % NumberRows;\n+|}\n+|\n+|FVector2D UHasardTableLayout::GetCellCenter(int32 Column, int32 Row) const\n+|{\n+|	return FVector2D(\n+|		GridOrigin.X + (static_cast&lt;float&gt;(Column) + 0.5f) * CellSizeX,\n+|		GridOrigin.Y + (static_cast&lt;float&gt;(Row) + 0.5f) * CellSizeY);\n+|}\n+|\n+|FVector2D UHasardTableLayout::GetGridExtent() const\n+|{\n+|	return FVector2D(\n+|		GridOrigin.X + NumberColumns * CellSizeX,\n+|		GridOrigin.Y + NumberRows * CellSizeY);\n+|}\n+|\n+|bool UHasardTableLayout::IsRedNumber(int32 Number) const\n+|{\n+|	// The eighteen reds on a single-zero wheel. Not derivable from the number:\n+|	// the sequence alternates within each half but breaks at 10/11 and 28/29.\n+|	static const TSet&lt;int32&gt; RedNumbers = {\n+|		1, 3, 5, 7, 9, 12, 14, 16, 18,\n+|		19, 21, 23, 25, 27, 30, 32, 34, 36 };\n+|\n+|	return RedNumbers.Contains(Number);\n+|}\n+|\n+|#undef LOCTEXT_NAMESPACE\n</code></pre><p><code>GetColumnOf</code> and <code>GetRowOf</code> both return <code>INDEX_NONE</code> for zero, and that is correct rather than a gap: zero genuinely has no column or row, and returning 0 would put it on top of the number 1. <code>INDEX_NONE</code> is Unreal&rsquo;s <code>-1</code>, and every caller has to decide what to do about it &mdash; which is the point.</p> <p><code>IsRedNumber</code> is a lookup and not a formula on purpose. The reds alternate within each half of the wheel but the pattern breaks twice, at 10/11 and at 28/29, so any arithmetic you write for it will be wrong for four numbers. The eighteen are listed because listing them is the honest version.</p> <p><b>6.</b> <code>HasardGameMode.h</code>, complete. Two additions to guide 2: the layout asset pointer and one exec to look at it:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n~|#include "CoreMinimal.h"                   // int32, TObjectPtr, the core macros\n~|#include "GameFramework/GameModeBase.h"    // AGameModeBase, the base class\n~|#include "HasardGameMode.generated.h"      // ALWAYS LAST\n\n~|class AHasardWheel;         // pointer only, so a forward declaration is enough\n~|class UHasardPayoutTable;   // pointer only\n+|class UHasardTableLayout;   // pointer only\n\nUENUM(BlueprintType)\nenum class EHasardRoundPhase : uint8\n{\n	Betting  UMETA(DisplayName = "Betting"),\n	Spinning UMETA(DisplayName = "Spinning"),\n	Settling UMETA(DisplayName = "Settling")\n};\n\nUCLASS()\nclass HASARD_API AHasardGameMode : public AGameModeBase\n{\n	GENERATED_BODY()\n\npublic:\n	AHasardGameMode();\n\n	/** Console: HasardTestDistribution 370000 */\n	UFUNCTION(Exec)\n	void HasardTestDistribution(int32 SpinCount);\n\n+|	/** Console: HasardShowCell 17 */\n+|	UFUNCTION(Exec)\n+|	void HasardShowCell(int32 Number);\n+|\n	/** Settles one round against the payout table. */\n	UFUNCTION(BlueprintCallable, Category = "Hasard|Round")\n	void ResolveRound(int32 WinningPocket);\n\n	/** The HUD reads odds through this. Const: nothing may edit the table at runtime. */\n	const UHasardPayoutTable* GetPayoutTable() const { return PayoutTable; }\n+|\n+|	/** The felt reads its measurements through this. Const for the same reason. */\n+|	const UHasardTableLayout* GetTableLayout() const { return TableLayout; }\n\nprotected:\n	virtual void BeginPlay() override;\n	virtual void EndPlay(const EEndPlayReason::Type EndPlayReason) override;\n\nprivate:\n	/** Bound to the wheel delegate in BeginPlay. UFUNCTION is what AddDynamic resolves by name. */\n	UFUNCTION()\n	void HandleBallSettled(int32 WinningPocket);\n\n	/** Cached so EndPlay unbinds from the same wheel BeginPlay bound to. */\n	UPROPERTY()\n	TObjectPtr&lt;AHasardWheel&gt; BoundWheel;\n\n	/** Assigned on BP_HasardGameMode. Payouts never come from a literal. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Round",\n		meta = (AllowPrivateAccess = "true"))\n	TObjectPtr&lt;UHasardPayoutTable&gt; PayoutTable;\n\n+|	/** Assigned on BP_HasardGameMode. Measurements never come from a literal either. */\n+|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Round",\n+|		meta = (AllowPrivateAccess = "true"))\n+|	TObjectPtr&lt;UHasardTableLayout&gt; TableLayout;\n+|\n	UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category = "Hasard|Round",\n		meta = (AllowPrivateAccess = "true"))\n	EHasardRoundPhase CurrentPhase = EHasardRoundPhase::Betting;\n\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Round",\n		meta = (AllowPrivateAccess = "true", ClampMin = "1.0"))\n	float BettingWindowSeconds = 30.0f;\n};\n</code></pre><p><b>7.</b> <code>HasardGameMode.cpp</code>, complete:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n~|#include "HasardGameMode.h"           // the class this file defines\n~|#include "HasardBettingComponent.h"   // SettleRound\n~|#include "HasardPayoutTable.h"        // PayoutTable-&gt;Rules, FindRule, GetHouseEdge\n~|#include "HasardPlayerController.h"   // AHasardPlayerController::StaticClass()\n~|#include "HasardPlayerState.h"        // AHasardPlayerState::StaticClass()\n+|#include "HasardTableLayout.h"        // GetColumnOf, GetRowOf, GetCellCenter\n~|#include "HasardTypes.h"              // LogHasard\n~|#include "HasardWheel.h"              // DetermineWinningPocket, GetPocketCount\n~|#include "GameFramework/Pawn.h"       // APawn, and FindComponentByClass on it\n~|#include "Kismet/GameplayStatics.h"   // GetActorOfClass, GetPlayerPawn\n~|#include "Engine/World.h"             // UWorld, complete for the WorldContextObject parameter\n\nDEFINE_LOG_CATEGORY(LogHasard);\n\nAHasardGameMode::AHasardGameMode()\n{\n	PlayerControllerClass = AHasardPlayerController::StaticClass();\n	PlayerStateClass = AHasardPlayerState::StaticClass();\n}\n\nvoid AHasardGameMode::BeginPlay()\n{\n	Super::BeginPlay();\n\n	UE_LOG(LogHasard, Warning, TEXT("GameMode BeginPlay - phase %s, betting window: %.1fs"),\n		*UEnum::GetValueAsString(CurrentPhase), BettingWindowSeconds);\n\n	AActor* Found = UGameplayStatics::GetActorOfClass(GetWorld(), AHasardWheel::StaticClass());\n\n	if (AHasardWheel* Wheel = Cast&lt;AHasardWheel&gt;(Found))\n	{\n		Wheel-&gt;OnBallSettled.AddDynamic(this, &amp;AHasardGameMode::HandleBallSettled);\n		BoundWheel = Wheel;\n+|	}\n+|	else\n+|	{\n+|		UE_LOG(LogHasard, Error, TEXT("GameMode: no wheel in the level - rounds will never resolve"));\n+|	}\n+|\n+|	if (!TableLayout)\n+|	{\n+|		UE_LOG(LogHasard, Error, TEXT("GameMode: no table layout on BP_HasardGameMode"));\n	}\n\n	if (!PayoutTable)\n	{\n		UE_LOG(LogHasard, Error, TEXT("GameMode: no payout table on BP_HasardGameMode"));\n		return;\n	}\n\n~|	// The audit. Fifteen rows, one line each, and the edge column is the claim\n~|	// this project exists to make - so the game states it out loud on every run.\n	for (const FHasardPayoutRule&amp; Rule : PayoutTable-&gt;Rules)\n	{\n		UE_LOG(LogHasard, Warning,\n			TEXT("Payout audit: %s pays %d:1, covers %d/%d, true odds %.2f:1, edge %.2f%%"),\n			*Rule.DisplayName.ToString(), Rule.PayoutRatio, Rule.CoveredNumbers,\n			PayoutTable-&gt;PocketCount, PayoutTable-&gt;GetTrueOdds(Rule),\n			PayoutTable-&gt;GetHouseEdge(Rule) * 100.0f);\n	}\n\n	float SharedEdge = 0.0f;\n	if (!PayoutTable-&gt;TryGetSharedHouseEdge(SharedEdge))\n	{\n		UE_LOG(LogHasard, Error,\n			TEXT("Payout audit: the rows do not share one edge. A row is wrong."));\n	}\n}\n\nvoid AHasardGameMode::EndPlay(const EEndPlayReason::Type EndPlayReason)\n{\n	// The rule the PlayerController already follows: whoever binds, unbinds.\n	if (BoundWheel)\n	{\n		BoundWheel-&gt;OnBallSettled.RemoveDynamic(this, &amp;AHasardGameMode::HandleBallSettled);\n		BoundWheel = nullptr;\n	}\n\n	Super::EndPlay(EndPlayReason);\n}\n\nvoid AHasardGameMode::HandleBallSettled(int32 WinningPocket)\n{\n	UE_LOG(LogHasard, Warning, TEXT("Ball settled in pocket %d"), WinningPocket);\n	ResolveRound(WinningPocket);\n}\n\nvoid AHasardGameMode::ResolveRound(int32 WinningPocket)\n{\n	CurrentPhase = EHasardRoundPhase::Settling;\n\n	APawn* PlayerPawn = UGameplayStatics::GetPlayerPawn(GetWorld(), 0);\n	UHasardBettingComponent* Betting =\n		PlayerPawn ? PlayerPawn-&gt;FindComponentByClass&lt;UHasardBettingComponent&gt;() : nullptr;\n\n	if (!PayoutTable)\n	{\n		UE_LOG(LogHasard, Error, TEXT("ResolveRound: no payout table on BP_HasardGameMode"));\n	}\n	else if (!Betting)\n	{\n		UE_LOG(LogHasard, Warning, TEXT("ResolveRound: no betting component to settle"));\n	}\n	else\n	{\n		Betting-&gt;SettleRound(WinningPocket, PayoutTable);\n	}\n\n	// Whatever happened above, the table reopens. A round that cannot settle must\n	// not strand the game in Settling forever.\n	CurrentPhase = EHasardRoundPhase::Betting;\n}\n\nvoid AHasardGameMode::HasardTestDistribution(int32 SpinCount)\n{\n	if (SpinCount &lt;= 0)\n	{\n		UE_LOG(LogHasard, Error, TEXT("SpinCount must be positive"));\n		return;\n	}\n\n	AHasardWheel* Wheel = Cast&lt;AHasardWheel&gt;(\n		UGameplayStatics::GetActorOfClass(this, AHasardWheel::StaticClass()));\n	if (!Wheel)\n	{\n		UE_LOG(LogHasard, Error, TEXT("No wheel in the level"));\n		return;\n	}\n\n	const int32 PocketCount = Wheel-&gt;GetPocketCount();\n\n	TArray&lt;int32&gt; Counts;\n	Counts.Init(0, PocketCount);\n\n~|	for (int32 i = 0; i &lt; SpinCount; ++i)\n	{\n		Counts[Wheel-&gt;DetermineWinningPocket()]++;\n	}\n\n	const float Expected = static_cast&lt;float&gt;(SpinCount) / PocketCount;\n\n	for (int32 Pocket = 0; Pocket &lt; PocketCount; ++Pocket)\n	{\n		const float Deviation = (Counts[Pocket] - Expected) / Expected * 100.0f;\n		UE_LOG(LogHasard, Display, TEXT("Pocket %2d: %5d hits (%+.1f%% from expected)"),\n			Pocket, Counts[Pocket], Deviation);\n	}\n}\n+|\n+|void AHasardGameMode::HasardShowCell(int32 Number)\n+|{\n+|	if (!TableLayout)\n+|	{\n+|		UE_LOG(LogHasard, Error, TEXT("No table layout on BP_HasardGameMode"));\n+|		return;\n+|	}\n+|\n+|	if (Number == 0)\n+|	{\n+|		UE_LOG(LogHasard, Display, TEXT("0 has its own box beside the grid, so it has no column or row"));\n+|		return;\n+|	}\n+|\n+|	const int32 Column = TableLayout-&gt;GetColumnOf(Number);\n+|	const int32 Row = TableLayout-&gt;GetRowOf(Number);\n+|\n+|	if (Column == INDEX_NONE || Row == INDEX_NONE)\n+|	{\n+|		UE_LOG(LogHasard, Error, TEXT("%d is not a number on this grid"), Number);\n+|		return;\n+|	}\n+|\n+|	const FVector2D Center = TableLayout-&gt;GetCellCenter(Column, Row);\n+|\n+|	UE_LOG(LogHasard, Display, TEXT("%d is column %d, row %d - center (%.1f, %.1f), %s"),\n+|		Number, Column, Row, Center.X, Center.Y,\n+|		TableLayout-&gt;IsRedNumber(Number) ? TEXT("red") : TEXT("black"));\n+|}\n</code></pre><p><code>HasardShowCell</code> exists so that module 1 ends in something you can look at. It is also the fastest way to catch a wrong <code>GridOrigin</code> later, so it stays.</p> <p><b>Phase 3 &mdash; build and wire it up.</b></p> <p><b>8.</b> Save everything with <code>Ctrl+Shift+S</code>. With <b>the editor closed</b>, build with <code>Ctrl+Shift+B</code> and confirm the Output window ends with <code>Build: 1 succeeded, 0 failed</code>. Reopen the editor.</p> <p><b>9.</b> <b>Create the asset.</b> Content Browser &rarr; navigate to <code>Content/Data</code> &rarr; right-click in the empty space &rarr; <b>Miscellaneous &rarr; Data Asset</b>. A picker appears asking which class: type <code>HasardTableLayout</code>, select it, <b>Select</b>. Name the asset <code>DA_HasardTableLayout</code>.</p> <p><b>10.</b> Double-click it. Every field should already show its default &mdash; 12 columns, 3 rows, cell size 12 by 12, tolerance 0.22. <b>Change nothing yet.</b> Close the asset editor and press <code>Ctrl+S</code> to save it.</p> <p><b>11.</b> <b>Assign it.</b> Content Browser &rarr; <code>Content/Blueprints</code> &rarr; double-click <code>BP_HasardGameMode</code>. In the Details panel find <b>Hasard | Round &rarr; Table Layout</b> and pick <code>DA_HasardTableLayout</code> from the dropdown. <b>Compile</b>, then <b>Save</b>. This is the same step you did for the payout table in guide 2 module 12, and it fails the same silent way if you skip it &mdash; except this time <code>BeginPlay</code> logs an error at you, which is why that error was added.</p> <p><b>Phase 4 &mdash; observe.</b></p> <p><b>12.</b> Open <code>L_RouletteTest</code>. <b>Window &rarr; Output Log</b>, filter on <code>LogHasard</code>. Press <b>Play</b>, then <code>~</code> for the console, and run:</p> <pre><code>HasardShowCell 17</code></pre> <p><b>13.</b> One line comes back:</p> <pre><code>LogHasard: Display: 17 is column 5, row 1 - center (66.0, 18.0), black</code></pre> <p>Check the arithmetic by hand once, because everything downstream trusts it. 17 - 1 = 16; 16 / 3 = 5 remainder 1, so column 5, row 1. The center is <code>(5 + 0.5) x 12 = 66</code> across and <code>(1 + 0.5) x 12 = 18</code> up. And 17 is black.</p> <p><b>14.</b> Try <code>HasardShowCell 0</code> and <code>HasardShowCell 40</code>. The first tells you zero has its own box; the second reports that 40 is not on the grid. <b>Both should say something.</b> A guard that returns quietly is a guard you cannot tell apart from a broken command.</p> <p><b>If nothing prints at all</b>, the exec is not being reached &mdash; confirm <b>Project Settings &rarr; Maps &amp; Modes &rarr; Default GameMode</b> is <code>BP_HasardGameMode</code>, the Blueprint and not the C++ class. <b>If it says there is no table layout</b>, step 11 did not take: reopen <code>BP_HasardGameMode</code> and check the dropdown actually shows the asset name rather than <code>None</code>.</p>'},

quiz:[
{q:'Which cell holds the number 23?',
 opts:['Column 7, row 1','Column 23, row 0','Column 1, row 7','Column 8, row 2'],
 c:0,why:'23 - 1 = 22. 22 / 3 = 7 remainder 1. Moving one column adds 3 to the number and moving one row adds 1, which is worth internalising now because every multi-number bet in module 2 is built from those two steps.'},
{q:'<code>GetColumnOf(0)</code> returns <code>INDEX_NONE</code>. That is:',
 opts:['A bug to fix by returning 0','An Unreal limitation','Correct, because zero has its own box and no grid cell','Only true in a packaged build'],
 c:2,why:'Zero sits beside the grid spanning all three rows. Returning 0 would place it on top of the number 1, which compiles, runs, and quietly puts two different bets in the same place.'},
{q:'Why is <code>DisplayName</code> on a bet position an <code>FText</code>?',
 opts:['It is faster than FString','FName cannot hold spaces','A player reads it, and only FText can be localised','UPROPERTY requires it'],
 c:2,why:'Epic&rsquo;s rule: FText for anything user-facing, FString for construction and parsing, FName for identifiers and lookup keys. The hover readout puts this in front of the player.'},
{q:'The measurements live in a data asset rather than as constants in a header because:',
 opts:['Headers cannot hold floats','It is faster at runtime','C++ cannot read constants in Blueprint','A designer can edit it, and it changes without a recompile'],
 c:3,why:'Same reasoning as the payout table in guide 2. It is also versioned with the project and visible in the reference viewer, neither of which a constant in a header manages.'},
{q:'<code>LineTolerance</code> is 0.22. What does that mean?',
 opts:['The outer 22% of a cell on each side counts as being on a line','22 centimeters','22% of clicks are rejected','The felt is 22% transparent'],
 c:0,why:'It is a fraction of a cell, not a distance, so it survives any change to cell size. The middle 56% stays a straight up and the bands either side become line bets.'},
{q:'What does the code call the three long lines of twelve running the length of the felt?',
 opts:['Streets','Grid rows','Dozens','Grid columns'],
 c:1,why:'Grid row 0 is 1, 4, 7 and so on. Confusingly the felt calls that a <i>column</i> bet, because the printed layout runs the long axis away from the player. The code uses the grid vocabulary throughout; a grid column is the street of three.'}
]

/* -------------------------------------------------------- 1.5 */
{
grp:"Part I \u2014 The Felt as Data",
num:"1.5",
title:"Fifteen types, thirteen rules",
lede:"Module 1 added two bet types to the enum. Nothing else in the project noticed, which is the interesting part.",
blocks:[
{t:'h',x:'What module 1 quietly broke'},
{t:'p',x:'Adding <code>Trio</code> and <code>Basket</code> to <code>EHasardBetType</code> was two lines in a header. It compiled, the editor loaded, the wheel span, and nothing reported a problem. Three things are now wrong, and not one of them will tell you.'},
{t:'table',head:['Where','What is wrong','How you would find out'],rows:[['<code>BetCoversPocket</code>','Thirteen cases, fifteen enumerators. A trio falls past the switch to <code>return false</code>.','A player backs a trio, pays for it, and never wins. No log, no warning, no crash.'],['<code>DA_EuropeanPayouts</code>','Thirteen rules. <code>FindRule</code> returns <code>nullptr</code> for the two new types.','One error line during settlement &mdash; but only if a trio ever wins, which it cannot.'],['<code>IsRedPocket</code>','A second copy of the eighteen red numbers, beside <code>IsRedNumber</code> on the layout.','Nothing. They agree today. They will not always.']]},
{t:'rg',lab:'The stake is the part that matters',x:'<p>The first row is not a missing feature. The component takes the money in <code>PlaceBet</code> and decides whether the bet won in <code>SettleRound</code>, and those are different functions. So a bet type the first one accepts and the second one cannot evaluate is a bet that is <b>paid for and cannot be won</b>. That is the shape of the thing this project exists to argue against, and module 1 introduced it by accident in two lines.</p><p>The fix is not to make trios work &mdash; that needs module 2. The fix is to stop taking the stake.</p>'},
{t:'h',x:'Why an unhandled enumerator is worse than a crash'},
{t:'p',x:'A crash has a stack trace, a line number and a bug report. An unhandled <code>case</code> has a <code>return false</code>, which is a completely reasonable answer to \'did this bet win\'. The code is not malformed and no tool objects: MSVC only warns about an unhandled enumerator at warning levels Unreal does not ship with, and a <code>default:</code> label &mdash; the usual reflex &mdash; makes even that impossible.'},
{t:'aside',lab:'Why the switch has no default label',x:'A <code>default:</code> case is how a switch stops being checkable. It tells the compiler every value is accounted for, so the one tool that could have caught a missing enumerator goes quiet permanently. Listing every case and leaving no default is the version a compiler can reason about. The <code>return false</code> after the switch is there because the language requires a return, not because the compiler needs a fallback &mdash; and the <code>static_assert</code> is what keeps it unreachable.'},
{t:'p',x:'So the guard is a <code>static_assert</code> on the last enumerator\'s value. Insert anything into the middle of the enum and <code>High</code> stops being 14, the assert fires, and the message names the two places that need editing. It is three lines and it converts a silent settlement bug into a build failure.'},
{t:'code',x:`static_assert(static_cast&lt;uint8&gt;(EHasardBetType::High) == 14,
	"EHasardBetType changed. Add a case to BetCoversPocket, add a rule to "
	"DA_EuropeanPayouts, then update this count.");`},
{t:'warn',lab:'What this assert does not catch',x:'It fires on an insertion anywhere <i>before</i> <code>High</code>, which is exactly how <code>Trio</code> and <code>Basket</code> arrived. It does not fire on an <i>append</i> after <code>High</code>, because <code>High</code> would still be 14. Keeping <code>High</code> last is therefore load-bearing, and the comment above the assert says so. A guard whose limits are undocumented is a guard people will trust past its edges.'},
{t:'chk',q:'Why refuse <code>Trio</code> in <code>PlaceBet</code> rather than just returning false for it in <code>BetCoversPocket</code>?',a:'<b>Because <code>BetCoversPocket</code> runs after the money is gone.</b> <code>PlaceBet</code> calls <code>TryStake</code>, so by the time settlement asks whether the bet won, the stake has already left the balance. Returning false there is the bug, stated politely. The refusal has to happen before the first line that moves money &mdash; which is why it sits above <code>FindBankroll</code> and not below it.'},
{t:'h',x:'Two rules, and the arithmetic that has to hold'},
{t:'p',x:'Trio and Basket are the two bets that include zero. Both share the European edge, which is worth checking rather than assuming:'},
{t:'table',head:['Bet','Pays','Covers','True odds','Edge'],rows:[['Trio &mdash; 0/1/2 or 0/2/3','11:1','3','11.33:1','2.70%'],['Basket &mdash; 0/1/2/3','8:1','4','8.25:1','2.70%']]},
{t:'p',x:'Both land on <code>1/37</code> exactly, like the other thirteen. That is not a coincidence and it is not luck in the choice of payout: on a single-zero wheel every bet whose payout is <code>(36 / covered) - 1</code> gives the same edge, and all fifteen rows satisfy it. This is the American basket\'s reputation in one line &mdash; 0/00/1/2/3 at 6:1 is <b>7.89%</b>, nearly three times the rest of that table, and it is the one bet a single-zero wheel does not have.'},
{t:'h',x:'One red list'},
{t:'p',x:'<code>IsRedPocket</code> in the betting component and <code>IsRedNumber</code> on the layout hold the same eighteen numbers. They are identical today, and the audit cannot tell you when they stop being identical &mdash; it checks that red pays 1:1 at 2.70%, which stays true whichever list is wrong.'},
{t:'rg',lab:'Two lists, one of them wrong',x:'A red list that disagrees with the felt pays the wrong player on some spins and not others. It is not a crash and it is not visible in a summary line; it is a slow, plausible-looking wrongness that a player would experience as bad luck. The layout asset already owns every other fact about the felt, so it owns this one. The copy in the component goes.'},
{t:'aside',lab:'Why the layout is passed in, not looked up',x:'<code>SettleRound</code> could reach the GameMode and ask for the layout itself. It does not, for the same reason it does not fetch the payout table: a component that fetches its own dependencies cannot be tested without a world, and cannot be told to settle against a different layout. Two pointers in the signature is the cheaper design, and it makes the requirement visible at every call site.'},
{t:'chk',q:'<code>BetCoversPocket</code> takes the layout by reference, not by pointer. Why is that safe?',a:'<b>Because <code>SettleRound</code> already refused the round if the asset is null.</b> By the time the loop runs, the pointer has been checked once, so the inner function can state the precondition in its signature instead of re-checking it 157 times. A reference parameter is a null check the caller has already done &mdash; and the compiler will not let a caller forget.'},
{t:'build',title:'Close the gap',file:'Source/Hasard/HasardBettingComponent.h + .cpp, HasardGameMode.cpp, DA_EuropeanPayouts',x:'<p><b>Phase 1 &mdash; Visual Studio.</b> Three files, all shown complete and marked against where module 1 left them. No new classes, so the editor stays closed the whole way.</p> <p><b>1.</b> <code>HasardBettingComponent.h</code>, complete. A forward declaration and one extra parameter:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"\n#include "Components/ActorComponent.h"\n#include "HasardTypes.h"\n#include "HasardBettingComponent.generated.h"\n\nclass UHasardPayoutTable;\n+|class UHasardTableLayout;\n\nUCLASS(ClassGroup=(Hasard), meta=(BlueprintSpawnableComponent))\nclass HASARD_API UHasardBettingComponent : public UActorComponent\n{\n	GENERATED_BODY()\n\npublic:\n	UHasardBettingComponent();\n\n~|	/** Records a bet. Returns false if the stake is not positive, or the type unsettleable. */\n	UFUNCTION(BlueprintCallable, Category = "Hasard|Betting")\n	bool PlaceBet(EHasardBetType BetType, int32 PrimaryNumber, int32 Stake);\n\n	/** Drops every active bet. Called between rounds. */\n	UFUNCTION(BlueprintCallable, Category = "Hasard|Betting")\n	void ClearAllBets();\n\n	/**\n	 * Pays every winning bet against the table, then clears the round.\n~|	 * The GameMode owns both assets and passes them in; the component owns the bets.\n+|	 * The layout is what says which pockets are red, so red and black cannot be\n+|	 * settled without it.\n	 */\n	UFUNCTION(BlueprintCallable, Category = "Hasard|Betting")\n~|	void SettleRound(int32 WinningPocket, const UHasardPayoutTable* PayoutTable,\n+|		const UHasardTableLayout* TableLayout);\n\n	UFUNCTION(BlueprintPure, Category = "Hasard|Betting")\n	int32 GetTotalStaked() const;\n\nprivate:\n	/** UPROPERTY so the array serializes and Blueprint can read it. */\n	UPROPERTY(BlueprintReadOnly, Category = "Hasard|Betting",\n		meta = (AllowPrivateAccess = "true"))\n	TArray&lt;FHasardBet&gt; ActiveBets;\n};\n</code></pre><p>The layout joins the signature rather than being fetched inside, for the reason the payout table already is: the component owns the bets and nothing else. Two assets in, no lookups, and the function can be called with a test layout the day you write a test.</p> <p><b>2.</b> <code>HasardBettingComponent.cpp</code>, complete. This is the whole module: the second red list goes, <code>Trio</code> and <code>Basket</code> get refused, and the assert arrives.</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#include "HasardBettingComponent.h"\n#include "HasardTypes.h"\n#include "HasardBankrollComponent.h"\n#include "HasardPayoutTable.h"\n#include "HasardPlayerState.h"\n+|#include "HasardTableLayout.h"\n#include "GameFramework/Pawn.h"\n\n/**\n * The bankroll lives on the PlayerState, not on this component. Both PlaceBet and\n * SettleRound need it, so the walk is written once. File-static: no header entry.\n */\nstatic UHasardBankrollComponent* FindBankroll(const UActorComponent* Self)\n{\n	APawn* OwnerPawn = Self ? Cast&lt;APawn&gt;(Self-&gt;GetOwner()) : nullptr;\n	AHasardPlayerState* PS = OwnerPawn ? OwnerPawn-&gt;GetPlayerState&lt;AHasardPlayerState&gt;() : nullptr;\n	return PS ? PS-&gt;FindComponentByClass&lt;UHasardBankrollComponent&gt;() : nullptr;\n}\n\n/**\n-| * Red pockets on a European wheel. Not derivable from the number - which pockets\n+| * Trio and Basket both include zero, and PrimaryNumber cannot say which trio a\n-| * are red is a fact about the physical wheel, so it is a table, not arithmetic.\n+| * chip on 0/1/2 means as against one on 0/2/3. Neither is settleable from this\n+| * struct, so neither may be accepted. Module 2 replaces PrimaryNumber with a\n+| * position id and both become ordinary.\n */\n~|static bool IsSettleableBetType(EHasardBetType BetType)\n{\n-|	static const TSet&lt;int32&gt; RedPockets = {\n+|	return BetType != EHasardBetType::Trio &amp;&amp; BetType != EHasardBetType::Basket;\n-|		1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36 };\n-|	return RedPockets.Contains(Pocket);\n}\n+|\n+|/**\n+| * Inserting an enumerator into EHasardBetType without adding a case below produces\n+| * a bet that takes the stake and can never win, and nothing reports it - no compiler\n+| * warning, no log line, no failed test. This assert is what turns that into a build\n+| * failure. It catches an insertion anywhere before High, which is how Trio and Basket\n+| * arrived; it does not catch an append after High, so keep High last.\n+| */\n+|static_assert(static_cast&lt;uint8&gt;(EHasardBetType::High) == 14,\n+|	"EHasardBetType changed. Add a case to BetCoversPocket, add a rule to "\n+|	"DA_EuropeanPayouts, then update this count.");\n\n/**\n * Does this bet cover the winning pocket?\n *\n * PrimaryNumber is the lowest number of the group, and the groups follow the felt\'s\n * three-column layout: a street is P, P+1, P+2 along a row; a corner is P, P+1, P+3,\n * P+4; a six line is P through P+5. Splits are the horizontal kind only, because\n * FHasardBet carries a single number and a vertical split cannot be expressed in one.\n *\n * Zero is deliberately excluded from every outside bet. That one pocket is the entire\n * house edge, and writing it as a special case is more honest than hiding it in a range.\n+| *\n+| * Layout is a reference, not a pointer: SettleRound has already refused the round if\n+| * the asset is missing, so there is nothing to check for here.\n */\n~|static bool BetCoversPocket(const FHasardBet&amp; Bet, int32 Pocket,\n+|	const UHasardTableLayout&amp; Layout)\n{\n	const int32 P = Bet.PrimaryNumber;\n\n	switch (Bet.BetType)\n	{\n	case EHasardBetType::StraightUp: return Pocket == P;\n	case EHasardBetType::Split:      return Pocket == P || Pocket == P + 1;\n	case EHasardBetType::Street:     return Pocket &gt;= P &amp;&amp; Pocket &lt;= P + 2;\n	case EHasardBetType::Corner:     return Pocket == P || Pocket == P + 1\n		                                 || Pocket == P + 3 || Pocket == P + 4;\n	case EHasardBetType::SixLine:    return Pocket &gt;= P &amp;&amp; Pocket &lt;= P + 5;\n	case EHasardBetType::Column:     return Pocket != 0 &amp;&amp; (Pocket % 3) == (P % 3);\n	case EHasardBetType::Dozen:      return Pocket &gt;= P &amp;&amp; Pocket &lt;= P + 11;\n~|	case EHasardBetType::Red:        return Pocket != 0 &amp;&amp; Layout.IsRedNumber(Pocket);\n~|	case EHasardBetType::Black:      return Pocket != 0 &amp;&amp; !Layout.IsRedNumber(Pocket);\n	case EHasardBetType::Even:       return Pocket != 0 &amp;&amp; (Pocket % 2) == 0;\n	case EHasardBetType::Odd:        return Pocket != 0 &amp;&amp; (Pocket % 2) == 1;\n	case EHasardBetType::Low:        return Pocket &gt;= 1 &amp;&amp; Pocket &lt;= 18;\n	case EHasardBetType::High:       return Pocket &gt;= 19 &amp;&amp; Pocket &lt;= 36;\n+|\n+|	case EHasardBetType::Trio:\n+|	case EHasardBetType::Basket:\n+|		// PlaceBet refuses these, so arriving here means one got in another way.\n+|		// Say so rather than returning a quiet no.\n+|		UE_LOG(LogHasard, Error, TEXT("BetCoversPocket: %s cannot be settled from PrimaryNumber"),\n+|			*UEnum::GetValueAsString(Bet.BetType));\n+|		return false;\n	}\n+|\n+|	// Unreachable while the assert above holds. Kept because the compiler requires a\n~|	// return, and it is the line a missing case would fall through to.\n	return false;\n}\n\nUHasardBettingComponent::UHasardBettingComponent()\n{\n	PrimaryComponentTick.bCanEverTick = false;\n}\n\nbool UHasardBettingComponent::PlaceBet(EHasardBetType BetType, int32 PrimaryNumber, int32 Stake)\n{\n	if (Stake &lt;= 0)\n	{\n+|		return false;\n+|	}\n+|\n+|	// Refuse before the money moves. A stake taken for a bet that cannot win is the\n+|	// worst failure this component has, and it is the one that reports nothing.\n+|	if (!IsSettleableBetType(BetType))\n+|	{\n+|		UE_LOG(LogHasard, Error,\n+|			TEXT("PlaceBet refused: %s needs a bet position, which arrives in module 2"),\n+|			*UEnum::GetValueAsString(BetType));\n		return false;\n	}\n\n	UHasardBankrollComponent* Bank = FindBankroll(this);\n\n	// Take the money FIRST. A bet that was never paid for must never enter the array.\n	if (!Bank || !Bank-&gt;TryStake(Stake))\n	{\n		UE_LOG(LogHasard, Warning, TEXT("PlaceBet refused: stake of %d not available"), Stake);\n		return false;\n	}\n\n	// Named fields, not FHasardBet{ ... } - the Module 9 warning still applies.\n	FHasardBet Bet;\n	Bet.BetType       = BetType;\n	Bet.PrimaryNumber = PrimaryNumber;\n	Bet.Stake         = Stake;\n\n	ActiveBets.Add(Bet);\n\n	UE_LOG(LogHasard, Warning, TEXT("Bets: %d, total staked: %d"),\n		ActiveBets.Num(), GetTotalStaked());\n\n	return true;\n}\n\n-|void UHasardBettingComponent::ClearAllBets() \n-|{\n-|	ActiveBets.Empty();\n-|	UE_LOG(LogHasard, Warning, TEXT("ClearAllBets"));\n-|}\n-|\nvoid UHasardBettingComponent::SettleRound(int32 WinningPocket,\n~|	const UHasardPayoutTable* PayoutTable, const UHasardTableLayout* TableLayout)\n{\n	const int32 Placed = ActiveBets.Num();\n	int32 Won = 0;\n	int32 Returned = 0;\n\n	if (!PayoutTable)\n	{\n		// Refuse to guess. Paying from a literal is the thing this module removes.\n		UE_LOG(LogHasard, Error, TEXT("SettleRound: no payout table, paying nobody"));\n+|		ActiveBets.Empty();\n+|		return;\n+|	}\n+|\n+|	if (!TableLayout)\n+|	{\n+|		// The same refusal. Without the layout there is no red list, so a red bet\n+|		// would settle as black - silently, and only on half the spins.\n+|		UE_LOG(LogHasard, Error, TEXT("SettleRound: no table layout, paying nobody"));\n		ActiveBets.Empty();\n		return;\n	}\n\n	UHasardBankrollComponent* Bank = FindBankroll(this);\n\n	if (!Bank)\n	{\n		// The same refusal as the missing table. A summary line reporting money\n		// returned when nothing was credited is worse than no summary at all.\n		UE_LOG(LogHasard, Error, TEXT("SettleRound: no bankroll, paying nobody"));\n		ActiveBets.Empty();\n		return;\n	}\n\n	for (const FHasardBet&amp; Bet : ActiveBets)\n	{\n~|		if (!BetCoversPocket(Bet, WinningPocket, *TableLayout))\n		{\n			continue;\n		}\n\n		const FHasardPayoutRule* Rule = PayoutTable-&gt;FindRule(Bet.BetType);\n		if (!Rule)\n		{\n			UE_LOG(LogHasard, Error, TEXT("SettleRound: no rule for %s, bet not paid"),\n				*UEnum::GetValueAsString(Bet.BetType));\n			continue;\n		}\n\n		// Stake back plus winnings: TryStake already took the stake when the bet\n		// was placed, so a 35:1 winner returns 36 times it, not 35.\n		const int32 Payout = Bet.Stake * (Rule-&gt;PayoutRatio + 1);\n		Bank-&gt;CreditWinnings(Payout);\n\n		++Won;\n		Returned += Payout;\n	}\n+|\n	ActiveBets.Empty();\n\n	UE_LOG(LogHasard, Warning, TEXT("SettleRound on %d: %d placed, %d won, %d returned"),\n		WinningPocket, Placed, Won, Returned);\n+|}\n+|\n+|void UHasardBettingComponent::ClearAllBets()\n+|{\n+|	ActiveBets.Empty();\n+|	UE_LOG(LogHasard, Warning, TEXT("ClearAllBets"));\n}\n\nint32 UHasardBettingComponent::GetTotalStaked() const\n{\n	int32 Total = 0;\n	for (const FHasardBet&amp; Bet : ActiveBets)\n	{\n		Total += Bet.Stake;\n	}\n	return Total;\n}\n</code></pre><p><b>The struck-through block is the one to delete.</b> <code>IsRedPocket</code> and its comment go, and <code>Red</code> and <code>Black</code> now ask the layout. That is eighteen numbers written once instead of twice.</p> <p><b>3.</b> <code>HasardGameMode.cpp</code>, complete. Four lines: the layout guard in <code>ResolveRound</code>, and the argument.</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#include "HasardGameMode.h"\n#include "HasardBettingComponent.h"\n#include "HasardPayoutTable.h"\n#include "HasardPlayerController.h"\n#include "HasardPlayerState.h"\n#include "HasardTableLayout.h"\n#include "HasardTypes.h"\n#include "HasardWheel.h"\n#include "GameFramework/Pawn.h"\n#include "Kismet/GameplayStatics.h"\n#include "Engine/World.h"\n\nDEFINE_LOG_CATEGORY(LogHasard);\n\nAHasardGameMode::AHasardGameMode()\n{\n	PlayerControllerClass = AHasardPlayerController::StaticClass();\n	PlayerStateClass = AHasardPlayerState::StaticClass();\n}\n\nvoid AHasardGameMode::BeginPlay()\n{\n	Super::BeginPlay();\n\n	UE_LOG(LogHasard, Warning, TEXT("GameMode BeginPlay - phase %s, betting window: %.1fs"),\n		*UEnum::GetValueAsString(CurrentPhase), BettingWindowSeconds);\n\n	AActor* Found = UGameplayStatics::GetActorOfClass(GetWorld(), AHasardWheel::StaticClass());\n\n	if (AHasardWheel* Wheel = Cast&lt;AHasardWheel&gt;(Found))\n	{\n		Wheel-&gt;OnBallSettled.AddDynamic(this, &amp;AHasardGameMode::HandleBallSettled);\n		BoundWheel = Wheel;\n	}\n	else\n	{\n		UE_LOG(LogHasard, Error, TEXT("GameMode: no wheel in the level - rounds will never resolve"));\n	}\n\n	if (!TableLayout)\n	{\n		UE_LOG(LogHasard, Error, TEXT("GameMode: no table layout on BP_HasardGameMode"));\n	}\n\n	if (!PayoutTable)\n	{\n		UE_LOG(LogHasard, Error, TEXT("GameMode: no payout table on BP_HasardGameMode"));\n		return;\n	}\n\n	// The audit. Fifteen rows, one line each, and the edge column is the claim\n	// this project exists to make - so the game states it out loud on every run.\n	for (const FHasardPayoutRule&amp; Rule : PayoutTable-&gt;Rules)\n	{\n		UE_LOG(LogHasard, Warning,\n			TEXT("Payout audit: %s pays %d:1, covers %d/%d, true odds %.2f:1, edge %.2f%%"),\n			*Rule.DisplayName.ToString(), Rule.PayoutRatio, Rule.CoveredNumbers,\n			PayoutTable-&gt;PocketCount, PayoutTable-&gt;GetTrueOdds(Rule),\n			PayoutTable-&gt;GetHouseEdge(Rule) * 100.0f);\n	}\n\n	float SharedEdge = 0.0f;\n	if (!PayoutTable-&gt;TryGetSharedHouseEdge(SharedEdge))\n	{\n		UE_LOG(LogHasard, Error,\n			TEXT("Payout audit: the rows do not share one edge. A row is wrong."));\n	}\n}\n\nvoid AHasardGameMode::EndPlay(const EEndPlayReason::Type EndPlayReason)\n{\n	// The rule the PlayerController already follows: whoever binds, unbinds.\n	if (BoundWheel)\n	{\n		BoundWheel-&gt;OnBallSettled.RemoveDynamic(this, &amp;AHasardGameMode::HandleBallSettled);\n		BoundWheel = nullptr;\n	}\n\n	Super::EndPlay(EndPlayReason);\n}\n\nvoid AHasardGameMode::HandleBallSettled(int32 WinningPocket)\n{\n	UE_LOG(LogHasard, Warning, TEXT("Ball settled in pocket %d"), WinningPocket);\n	ResolveRound(WinningPocket);\n}\n\nvoid AHasardGameMode::ResolveRound(int32 WinningPocket)\n{\n	CurrentPhase = EHasardRoundPhase::Settling;\n\n	APawn* PlayerPawn = UGameplayStatics::GetPlayerPawn(GetWorld(), 0);\n	UHasardBettingComponent* Betting =\n		PlayerPawn ? PlayerPawn-&gt;FindComponentByClass&lt;UHasardBettingComponent&gt;() : nullptr;\n\n	if (!PayoutTable)\n	{\n		UE_LOG(LogHasard, Error, TEXT("ResolveRound: no payout table on BP_HasardGameMode"));\n	}\n+|	else if (!TableLayout)\n+|	{\n+|		UE_LOG(LogHasard, Error, TEXT("ResolveRound: no table layout on BP_HasardGameMode"));\n+|	}\n	else if (!Betting)\n	{\n		UE_LOG(LogHasard, Warning, TEXT("ResolveRound: no betting component to settle"));\n	}\n	else\n	{\n~|		Betting-&gt;SettleRound(WinningPocket, PayoutTable, TableLayout);\n	}\n\n	// Whatever happened above, the table reopens. A round that cannot settle must\n	// not strand the game in Settling forever.\n	CurrentPhase = EHasardRoundPhase::Betting;\n}\n\nvoid AHasardGameMode::HasardTestDistribution(int32 SpinCount)\n{\n	if (SpinCount &lt;= 0)\n	{\n		UE_LOG(LogHasard, Error, TEXT("SpinCount must be positive"));\n		return;\n	}\n\n	AHasardWheel* Wheel = Cast&lt;AHasardWheel&gt;(\n		UGameplayStatics::GetActorOfClass(this, AHasardWheel::StaticClass()));\n	if (!Wheel)\n	{\n		UE_LOG(LogHasard, Error, TEXT("No wheel in the level"));\n		return;\n	}\n\n	const int32 PocketCount = Wheel-&gt;GetPocketCount();\n\n	TArray&lt;int32&gt; Counts;\n	Counts.Init(0, PocketCount);\n\n	for (int32 i = 0; i &lt; SpinCount; ++i)\n	{\n		Counts[Wheel-&gt;DetermineWinningPocket()]++;\n	}\n\n	const float Expected = static_cast&lt;float&gt;(SpinCount) / PocketCount;\n\n	for (int32 Pocket = 0; Pocket &lt; PocketCount; ++Pocket)\n	{\n		const float Deviation = (Counts[Pocket] - Expected) / Expected * 100.0f;\n		UE_LOG(LogHasard, Display, TEXT("Pocket %2d: %5d hits (%+.1f%% from expected)"),\n			Pocket, Counts[Pocket], Deviation);\n	}\n}\n\nvoid AHasardGameMode::HasardShowCell(int32 Number)\n{\n	if (!TableLayout)\n	{\n		UE_LOG(LogHasard, Error, TEXT("No table layout on BP_HasardGameMode"));\n		return;\n	}\n\n	if (Number == 0)\n	{\n		UE_LOG(LogHasard, Display, TEXT("0 has its own box beside the grid, so it has no column or row"));\n		return;\n	}\n\n	const int32 Column = TableLayout-&gt;GetColumnOf(Number);\n	const int32 Row = TableLayout-&gt;GetRowOf(Number);\n\n	if (Column == INDEX_NONE || Row == INDEX_NONE)\n	{\n		UE_LOG(LogHasard, Error, TEXT("%d is not a number on this grid"), Number);\n		return;\n	}\n\n	const FVector2D Center = TableLayout-&gt;GetCellCenter(Column, Row);\n\n	UE_LOG(LogHasard, Display, TEXT("%d is column %d, row %d - center (%.1f, %.1f), %s"),\n		Number, Column, Row, Center.X, Center.Y,\n		TableLayout-&gt;IsRedNumber(Number) ? TEXT("red") : TEXT("black"));\n}\n</code></pre><p>The guard goes <i>before</i> the betting-component check on purpose. A missing asset is a setup mistake you fix in one click; a missing component is a structural problem. Report the cheap one first.</p> <p><b>Phase 2 &mdash; build.</b></p> <p><b>4.</b> <code>Ctrl+Shift+B</code> with the editor closed. Expect <code>Build: 1 succeeded, 0 failed</code>.</p> <p><b>Phase 3 &mdash; the two missing rules.</b></p> <p><b>5.</b> Reopen the editor. <code>Content/Data</code> &rarr; double-click <code>DA_EuropeanPayouts</code>. The <b>Rules</b> array has thirteen entries. Add two:</p><pre><code>Trio     PayoutRatio 11   CoveredNumbers 3   DisplayName "Trio"\nBasket   PayoutRatio  8   CoveredNumbers 4   DisplayName "Basket"</code></pre><p>Set <b>Bet Type</b> on each from the dropdown &mdash; it reads the <code>UMETA(DisplayName)</code> values, so you are picking <b>Trio</b> and <b>Basket</b> by name and cannot pick the wrong number. <code>Ctrl+S</code>.</p> <p><b>6.</b> Press Play and read the payout audit. <b>Fifteen rows now, every one ending <code>edge 2.70%</code></b>, and no line saying the rows do not share one edge. If a row reads anything else, that row is wrong &mdash; the arithmetic does not negotiate.</p> <p><b>7.</b> <b>Confirm the refusal.</b> No new code needed &mdash; <code>AHasardBetSpot::BetType</code> is <code>EditInstanceOnly</code> and feeds straight into <code>PlaceBet</code>. Place a fourth <code>BP_BetSpot</code> on the felt, set its <b>Bet Type</b> to <b>Trio</b> in the Details panel, and click it. The log should read <code>PlaceBet refused: EHasardBetType::Trio needs a bet position</code>, and <b>the balance must not move</b>. Watch the balance, not the log line &mdash; the log was never the bug.</p> <p>Leave that spot in the level. It is the thing that will start working when module 2 lands, which makes it a better regression test than a comment saying to remember to check.</p> <p><b>8.</b> Place a red bet and spin until red comes up. It still pays 1:1. You have swapped the source of the red list without changing the answer, which is what a refactor is supposed to look like.</p> <p><b>9.</b> Commit.</p><pre><code>git add -A\ngit commit -m "Refuse unsettleable bets; single source for red" -m "Trio and Basket include zero and cannot be expressed by PrimaryNumber, so PlaceBet refuses them rather than taking a stake that can never win. static_assert on the enum turns the next insertion into a build failure instead of a silent one."</code></pre>'},

grp:"Part I \u2014 The Felt as Data",
