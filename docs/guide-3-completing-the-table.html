{
grp:"Part III \u2014 The Table the Player Sees",
num:'04',
title:"Print the table",
lede:"A hundred and fifty-seven positions and not one of them says what it is. Forty-nine labels, generated from the same numbers the resolver reads.",
blocks:[
{t:'h',x:'A felt with no writing on it'},
{t:'p',x:'Module 3 gave you a table that resolves a click into any of 157 bets correctly. It also gave you a rectangle of grey boxes. You can back number 17, and the only way to know you did is to read the log.</p><p>That is fine for proving the arithmetic and useless for playing. This module prints the table.'},
{t:'p',x:'Forty-nine labels: the 37 numbers, the three dozens, the three columns, and the six even-money bets. All of them generated at runtime from <code>GetPositions()</code>, none of them authored by hand.'},
{t:'h',x:'Why not just paint a texture'},
{t:'p',x:'A real felt is printed. One texture on the surface material would be one draw call, would look exactly right, and would need no code at all. It is the obvious answer and it is the wrong one <i>here</i>, for a reason worth being precise about.'},
{t:'p',x:'The label positions would become a second copy of the layout arithmetic &mdash; drawn in an image editor, where <code>CellSizeX</code> is a number somebody typed into a ruler guide. Change <code>CellSizeX</code> from 12 to 24 in the data asset and the resolver moves, the collision box moves, the chip locations move, and the printed numbers stay exactly where they were. The table would then <i>read</i> one way and <i>pay</i> another, with no error anywhere.'},
{t:'aside',lab:'The texture is still the right answer eventually',x:'<p>Forty-nine <code>TextRenderComponent</code>s are forty-nine draw calls. At this scale that is free; on a shipping table with reflections and a real material it will not be.</p><p>The fix when it matters is not to hand-author the texture after all &mdash; it is to <b>bake it from the generated positions</b>, so the single source survives the optimization. That is a different module and it needs the felt to have a material worth baking into first.</p>'},
{t:'h',x:'Which bets get a name'},
{t:'p',x:'Not all of them, and the omissions are the interesting part.'},
{t:'table',head:['Bet','Labeled','Why'],rows:[
['Straight up','37','Each has a box of its own. The number goes in it.'],
['Dozen','3','A box in the near band.'],
['Column','3','A box past the last cell.'],
['Red, Black, Even, Odd, 1-18, 19-36','6','Boxes in the far band.'],
['Split, Street, Trio, Corner, Basket, Six line','&mdash;','No box. Their position <i>is</i> a line or a point between boxes.'],
]},
{t:'p',x:'That is 37 + 3 + 3 + 6 = <b>49</b>. The 108 line bets stay unlabeled, which is also how a real layout looks: nothing on a casino felt says <i>17/18</i> next to the line between 17 and 18. Module 5 names those in the preview, at the moment you are pointing at one.'},
{t:'warn',lab:'The switch has no default, and must not get one',x:'<p><code>IsNamedOnFelt</code> lists all fifteen enumerators and has no <code>default:</code>. Add a sixteenth bet type and the compiler stops the build until you have decided which side of that switch it belongs on.</p><p>Give it a <code>default: return false;</code> and the same new bet type silently arrives on the felt with no name on it &mdash; placeable, payable, and unreadable. That is the same shape as every other quiet failure in this project: nothing is wrong, something is just missing.</p>'},
{t:'p',x:'This is also why the <code>static_assert</code> in <code>HasardBettingComponent.cpp</code> does <b>not</b> gain a third line about labels. The assert exists for the obligations the compiler cannot see &mdash; a data asset row, a generator block. A defaultless switch needs no reminder because it is already enforced.'},
{t:'h',x:'Zero is not a black number'},
{t:'p',x:'On a European wheel zero is green, and it is green everywhere: on the wheel, on the felt, in the chip trays. That is not decoration.'},
{t:'rg',lab:'One pocket is the entire house edge',x:'<p>Thirty-seven pockets, and every bet on the table is priced as though there were thirty-six. Zero is the difference. It is the 2.70% the HUD already shows, in physical form.</p><p>So zero gets <code>ZeroLabelColor</code> rather than being printed in the same ink as the blacks. A player who cannot pick zero out of the layout cannot see the thing that makes the game profitable, and <b>a house edge you have to be told about is not a visible one</b>.</p><p>Concretely: <code>LabelColorFor</code> tests for zero <i>before</i> it asks <code>IsRedNumber</code>. Reverse those two and zero comes back black, because it is not in the red set. Right answer by the letter, wrong table.</p>'},
{t:'h',x:'Components made after the constructor'},
{t:'p',x:'Everything up to now has created its components in the constructor, where <code>CreateDefaultSubobject</code> does all the work. Forty-nine labels cannot be built that way: the count comes from the layout asset, and the asset is not assigned yet when the constructor runs.'},
{t:'p',x:'So they are made at runtime, and three details matter in a way they never did before:'},
{t:'list',x:['<b>Mobility before registration.</b> A component created with <code>NewObject</code> is static by default. Set the transform on a registered static component and UE logs a warning and ignores you, so <code>SetMobility(EComponentMobility::Movable)</code> comes first.','<b>Register, then attach.</b> <code>SetupAttachment</code> is a constructor-time call. At runtime it is <code>RegisterComponent()</code> followed by <code>AttachToComponent</code>.','<b>UPROPERTY on the array.</b> Nothing else holds a reference to these components, so without <code>UPROPERTY()</code> on <code>Labels</code> the collector is entitled to take them.']},
{t:'p',x:'Note that <code>Labels</code> carries a bare <code>UPROPERTY()</code> &mdash; no <code>EditDefaultsOnly</code>, no <code>BlueprintReadOnly</code>, no category. That combination means exactly one thing: <i>this exists so the garbage collector can see it</i>. It is not for the details panel and not for Blueprint.'},
{t:'h',x:'Destroy first, then build'},
{t:'p',x:'<code>BuildLabels</code> begins by destroying every label it made last time, before it checks whether it should build any. Both orderings compile. Only one of them is safe.'},
{t:'chk',q:'BuildLabels is called on BeginPlay and again from the Rebuild Labels button. What happens if it only adds?',a:'<p><b>Every number gets printed twice, in exactly the same place.</b> Two <code>TextRenderComponent</code>s at identical transforms with identical text do not look like a bug &mdash; they look like slightly heavier type, if you notice at all.</p><p>Press the button four times and you have 196 components rendering 49 numbers, all of them agreeing. Nothing logs, nothing errors, the count in the log line even goes up honestly. You would find it by profiling, months later.</p><p>This is why the destroy loop runs unconditionally and before the <code>bShowLabels</code> check: turning labels <i>off</i> and rebuilding has to remove them, which it cannot do if the early return happens first.</p>'},
{t:'srcs',x:[['Text Render Component','https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Components/TextRender'],['Creating components at runtime','https://dev.epicgames.com/documentation/en-us/unreal-engine/components-in-unreal-engine'],['Unreal Object Handling and the garbage collector','https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-object-handling']]},
{t:'build',title:'Print the table',file:'Source/Hasard/ - three files, none new',x:'<p><b>Phase 1 &mdash; Visual Studio.</b> No new class this time. Every file complete, marked against where module 3 left it.</p><p><b>1.</b> <code>HasardFelt.h</code>. One button, one builder, one color helper, and the label tuning:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"\n#include "GameFramework/Actor.h"\n#include "HasardInteractable.h"\n#include "HasardFelt.generated.h"\n\nclass UBoxComponent;\nclass UHasardTableLayout;\n+|class UTextRenderComponent;\n+|struct FHasardBetPosition;\n\n/**\n * The betting surface. One actor for all 157 positions.\n *\n * There is deliberately no actor per bet: 83 of the 157 positions are lines and corners\n * between cells, so they have no area of their own and nothing to own a collision volume.\n * Instead this is a single box the trace can hit, and the layout asset turns the impact\n * point into a position id. The felt draws itself from the same numbers, so the picture\n * and the hit test cannot disagree.\n */\nUCLASS()\nclass HASARD_API AHasardFelt : public AActor, public IHasardInteractable\n{\n	GENERATED_BODY()\n\npublic:\n	AHasardFelt();\n\n	virtual void OnPlayerInteract_Implementation(APawn* InstigatorPawn,\n		const FVector&amp; HitLocation) override;\n\n	/** Redraws the debug overlay. A details-panel button: an actor gets no exec routing. */\n	UFUNCTION(CallInEditor, Category = "Hasard|Felt")\n	void DrawFelt();\n\n+|	/** Rebuilds the felt labels after editing the layout or a color. Same button treatment. */\n+|	UFUNCTION(CallInEditor, Category = "Hasard|Felt")\n+|	void RebuildLabels();\n+|\nprotected:\n	virtual void BeginPlay() override;\n	virtual void OnConstruction(const FTransform&amp; Transform) override;\n\nprivate:\n	/** World point to the felt\'s local 2D space, in centimeters. Z is discarded. */\n	FVector2D WorldToFeltLocal(const FVector&amp; WorldPoint) const;\n\n	/** Felt-local 2D back to world, on the surface. The inverse of the above. */\n	FVector FeltLocalToWorld(const FVector2D&amp; LocalPoint) const;\n\n	/** Resizes the collision box to whatever the layout says the felt measures. */\n	void SyncBoxToLayout();\n\n	/** Persistent debug lines for the grid, the bands, and every chip location. */\n	void DrawDebugLayout() const;\n+|\n+|	/**\n+|	 * Destroys every existing label, then makes one per bet the player reads by name.\n+|	 *\n+|	 * Called from BeginPlay rather than OnConstruction: OnConstruction runs on every\n+|	 * property edit and on every level load, and creating components there means\n+|	 * managing their destruction against a construction script that may not have run.\n+|	 */\n+|	void BuildLabels();\n+|\n+|	/** The color a number is printed in. Zero is not black, and that is the point. */\n+|	FColor LabelColorFor(const FHasardBetPosition&amp; Position,\n+|		const UHasardTableLayout&amp; Layout) const;\n\n	/** Fixed origin. Everything else is measured and offset from here. */\n	UPROPERTY(VisibleAnywhere, Category = "Hasard|Felt")\n	TObjectPtr&lt;USceneComponent&gt; Root;\n\n	/** The trace target. Offset against Root, so resizing it never moves the actor. */\n	UPROPERTY(VisibleAnywhere, Category = "Hasard|Felt")\n	TObjectPtr&lt;UBoxComponent&gt; Surface;\n\n	/**\n	 * Assigned on BP_Felt, and it must be the same asset the GameMode holds.\n	 * Two different layouts would put the chip somewhere the settlement does not expect.\n	 */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Felt",\n		meta = (AllowPrivateAccess = "true"))\n	TObjectPtr&lt;UHasardTableLayout&gt; TableLayout;\n\n	/**\n	 * What one click stakes. A single value until chip denominations exist; it is a\n	 * property rather than a literal so the number is visible and tunable meanwhile.\n	 */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Felt",\n		meta = (AllowPrivateAccess = "true", ClampMin = "1"))\n	int32 StakePerClick = 5;\n\n	/** Draws the grid and all 157 chip locations on BeginPlay. Debug builds only. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Felt",\n		meta = (AllowPrivateAccess = "true"))\n	bool bDrawDebugLayout = true;\n\n	/** Height of the collision box. The felt is flat; this is just enough to trace against. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Felt",\n		meta = (AllowPrivateAccess = "true", ClampMin = "0.1"))\n	float SurfaceThickness = 2.0f;\n+|\n+|	/** Every label this actor made. UPROPERTY so the collector can see them. */\n+|	UPROPERTY()\n+|	TArray&lt;TObjectPtr&lt;UTextRenderComponent&gt;&gt; Labels;\n+|\n+|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Labels",\n+|		meta = (AllowPrivateAccess = "true"))\n+|	bool bShowLabels = true;\n+|\n+|	/** Cap height in centimeters. A 24 cm cell takes about 14 before it crowds the lines. */\n+|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Labels",\n+|		meta = (AllowPrivateAccess = "true", ClampMin = "0.5"))\n+|	float LabelTextSize = 14.0f;\n+|\n+|	/** Lifts the text off the felt so it does not z-fight with the surface. */\n+|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Labels",\n+|		meta = (AllowPrivateAccess = "true", ClampMin = "0.0"))\n+|	float LabelZOffset = 0.2f;\n+|\n+|	/**\n+|	 * Lays the text flat and decides which side of the table it reads from.\n+|	 * If the numbers come out mirrored, add 180 to Yaw - that is the only axis at issue.\n+|	 */\n+|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Labels",\n+|		meta = (AllowPrivateAccess = "true"))\n+|	FRotator LabelRotation = FRotator(90.0f, 180.0f, 0.0f);\n+|\n+|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Labels",\n+|		meta = (AllowPrivateAccess = "true"))\n+|	FColor RedNumberColor = FColor(255, 0, 0);\n+|\n+|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Labels",\n+|		meta = (AllowPrivateAccess = "true"))\n+|	FColor BlackNumberColor = FColor(0, 0, 0);\n+|\n+|	/**\n+|	 * Zero gets its own color because zero is the entire house edge. It is not one of\n+|	 * the blacks and must never be printed as though it were.\n+|	 */\n+|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Labels",\n+|		meta = (AllowPrivateAccess = "true"))\n+|	FColor ZeroLabelColor = FColor(0, 170, 70);\n+|\n+|	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Labels",\n+|		meta = (AllowPrivateAccess = "true"))\n+|	FColor OutsideLabelColor = FColor(0, 0, 0);\n};\n</code></pre><p><b>2.</b> <code>HasardFelt.cpp</code>. <code>IsNamedOnFelt</code> goes above the constructor so the switch sits next to nothing else; <code>BuildLabels</code> and <code>LabelColorFor</code> go between <code>DrawFelt</code> and <code>DrawDebugLayout</code>:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#include "HasardFelt.h"\n#include "HasardBettingComponent.h"\n#include "HasardTableLayout.h"\n#include "HasardTypes.h"\n#include "Components/BoxComponent.h"\n#include "Components/SceneComponent.h"\n+|#include "Components/TextRenderComponent.h"\n#include "DrawDebugHelpers.h"\n#include "Engine/World.h"\n#include "GameFramework/Pawn.h"\n+|\n+|/**\n+| * Which bets get their name printed on the felt.\n+| *\n+| * The line bets do not, and that is not an omission: a split has no box of its own, so\n+| * "17/18" would have to be printed on the line between two numbers. A real layout leaves\n+| * those unlabeled too - the preview names them instead.\n+| *\n+| * No default case, deliberately. Adding an enumerator without deciding whether it is\n+| * named on the felt then fails the build rather than shipping a bet nobody can read.\n+| */\n+|static bool IsNamedOnFelt(EHasardBetType BetType)\n+|{\n+|	switch (BetType)\n+|	{\n+|	case EHasardBetType::StraightUp:\n+|	case EHasardBetType::Dozen:\n+|	case EHasardBetType::Column:\n+|	case EHasardBetType::Red:\n+|	case EHasardBetType::Black:\n+|	case EHasardBetType::Even:\n+|	case EHasardBetType::Odd:\n+|	case EHasardBetType::Low:\n+|	case EHasardBetType::High:\n+|		return true;\n+|\n+|	case EHasardBetType::Split:\n+|	case EHasardBetType::Street:\n+|	case EHasardBetType::Trio:\n+|	case EHasardBetType::Corner:\n+|	case EHasardBetType::Basket:\n+|	case EHasardBetType::SixLine:\n+|		return false;\n+|	}\n+|\n+|	// Unreachable while every enumerator is listed above. Kept because the compiler\n+|	// requires a return, and it is the line a missing case would fall through to.\n+|	return false;\n+|}\n\nAHasardFelt::AHasardFelt()\n{\n	PrimaryActorTick.bCanEverTick = false;\n\n	Root = CreateDefaultSubobject&lt;USceneComponent&gt;(TEXT("Root"));\n	SetRootComponent(Root);\n\n	Surface = CreateDefaultSubobject&lt;UBoxComponent&gt;(TEXT("Surface"));\n	Surface-&gt;SetupAttachment(Root);\n\n	// Visibility is the channel the interaction trace sweeps on.\n	Surface-&gt;SetCollisionEnabled(ECollisionEnabled::QueryOnly);\n	Surface-&gt;SetCollisionResponseToAllChannels(ECR_Ignore);\n	Surface-&gt;SetCollisionResponseToChannel(ECC_Visibility, ECR_Block);\n}\n\nvoid AHasardFelt::OnConstruction(const FTransform&amp; Transform)\n{\n	Super::OnConstruction(Transform);\n\n	// Resized here as well as in BeginPlay, so assigning the asset in the editor\n	// shows the right box immediately rather than after the next Play.\n	SyncBoxToLayout();\n}\n\nvoid AHasardFelt::BeginPlay()\n{\n	Super::BeginPlay();\n\n	if (!TableLayout)\n	{\n		UE_LOG(LogHasard, Error, TEXT("Felt: no table layout on BP_Felt - clicks cannot resolve"));\n		return;\n	}\n\n	SyncBoxToLayout();\n\n+|	BuildLabels();\n+|\n	const int32 Count = TableLayout-&gt;GetPositions().Num();\n-|	UE_LOG(LogHasard, Warning, TEXT("Felt: %d positions, stake %d per click"),\n-|		Count, StakePerClick);\n+|	UE_LOG(LogHasard, Warning, TEXT("Felt: %d positions, %d labels, stake %d per click"),\n+|		Count, Labels.Num(), StakePerClick);\n\n	if (bDrawDebugLayout)\n	{\n		DrawDebugLayout();\n	}\n}\n\nvoid AHasardFelt::SyncBoxToLayout()\n{\n	if (!TableLayout || !Surface)\n	{\n		return;\n	}\n\n	FVector2D Min, Max;\n	TableLayout-&gt;GetFeltBounds(Min, Max);\n\n	const FVector2D Size = Max - Min;\n	const FVector2D Center = (Max + Min) * 0.5f;\n\n	// Offset against Root, never against the actor. If Surface were the root component,\n	// setting its relative location would move the actor and shift every coordinate.\n	Surface-&gt;SetBoxExtent(FVector(Size.X * 0.5f, Size.Y * 0.5f, SurfaceThickness * 0.5f));\n	Surface-&gt;SetRelativeLocation(FVector(Center.X, Center.Y, 0.0f));\n}\n\nFVector2D AHasardFelt::WorldToFeltLocal(const FVector&amp; WorldPoint) const\n{\n	// Relative to the actor, not to the box: the box moves with GridOrigin, and the\n	// layout\'s coordinates are measured from the actor\'s own origin.\n	const FVector Local = GetActorTransform().InverseTransformPosition(WorldPoint);\n	return FVector2D(Local.X, Local.Y);\n}\n\nFVector AHasardFelt::FeltLocalToWorld(const FVector2D&amp; LocalPoint) const\n{\n	return GetActorTransform().TransformPosition(FVector(LocalPoint.X, LocalPoint.Y, 0.0f));\n}\n\nvoid AHasardFelt::OnPlayerInteract_Implementation(APawn* InstigatorPawn,\n	const FVector&amp; HitLocation)\n{\n	if (!InstigatorPawn || !TableLayout)\n	{\n		return;\n	}\n\n	UHasardBettingComponent* Betting =\n		InstigatorPawn-&gt;FindComponentByClass&lt;UHasardBettingComponent&gt;();\n	if (!Betting)\n	{\n		UE_LOG(LogHasard, Warning, TEXT("Felt: %s has no betting component"),\n			*GetNameSafe(InstigatorPawn));\n		return;\n	}\n\n	const FVector2D Local = WorldToFeltLocal(HitLocation);\n	const int32 PositionId = TableLayout-&gt;ResolvePosition(Local);\n\n	if (PositionId == INDEX_NONE)\n	{\n		// A miss is not an error, but it is not silent either: the coordinate is the\n		// only way to tell "clicked the margin" from "the resolver is wrong".\n		UE_LOG(LogHasard, Warning, TEXT("Felt: (%.1f, %.1f) is not a bet position"),\n			Local.X, Local.Y);\n		return;\n	}\n\n	const FHasardBetPosition* Position = TableLayout-&gt;GetPositionById(PositionId);\n	if (!Position)\n	{\n		UE_LOG(LogHasard, Error, TEXT("Felt: resolved id %d has no position"), PositionId);\n		return;\n	}\n\n	UE_LOG(LogHasard, Warning, TEXT("Felt: (%.1f, %.1f) -&gt; id %d, %s"),\n		Local.X, Local.Y, PositionId, *Position-&gt;DisplayName.ToString());\n\n	if (!Betting-&gt;PlaceBet(PositionId, StakePerClick))\n	{\n		// Refused, so no stake was taken. Nothing may be drawn as though one was.\n		return;\n	}\n\n	// Where the chip actually went, not where the player clicked. If these two are ever\n	// far apart the resolver picked a neighbor, and seeing it is how you notice.\n	if (const UWorld* World = GetWorld())\n	{\n		DrawDebugSphere(World, FeltLocalToWorld(Position-&gt;ChipLocation),\n			2.0f, 8, FColor::Yellow, false, 4.0f);\n	}\n}\n\nvoid AHasardFelt::DrawFelt()\n{\n	if (!TableLayout)\n	{\n		UE_LOG(LogHasard, Error, TEXT("Felt: no table layout on BP_Felt"));\n		return;\n	}\n\n	DrawDebugLayout();\n}\n\n+|void AHasardFelt::RebuildLabels()\n+|{\n+|	if (!TableLayout)\n+|	{\n+|		UE_LOG(LogHasard, Error, TEXT("Felt: no table layout on BP_Felt"));\n+|		return;\n+|	}\n+|\n+|	BuildLabels();\n+|	UE_LOG(LogHasard, Warning, TEXT("Felt: built %d labels"), Labels.Num());\n+|}\n+|\n+|void AHasardFelt::BuildLabels()\n+|{\n+|	// Destroy first, unconditionally. BeginPlay and the button can both land here, and a\n+|	// pass that only added would print every number twice at the same spot.\n+|	for (const TObjectPtr&lt;UTextRenderComponent&gt;&amp; Existing : Labels)\n+|	{\n+|		if (Existing)\n+|		{\n+|			Existing-&gt;DestroyComponent();\n+|		}\n+|	}\n+|	Labels.Reset();\n+|\n+|	if (!TableLayout || !Root || !bShowLabels)\n+|	{\n+|		return;\n+|	}\n+|\n+|	// One pass over the generated positions, so a label cannot sit anywhere the resolver\n+|	// disagrees with. There is no second list of numbers and no second set of coordinates.\n+|	for (const FHasardBetPosition&amp; Position : TableLayout-&gt;GetPositions())\n+|	{\n+|		if (!IsNamedOnFelt(Position.BetType))\n+|		{\n+|			continue;\n+|		}\n+|\n+|		UTextRenderComponent* Label = NewObject&lt;UTextRenderComponent&gt;(this);\n+|\n+|		// Movable before registering, or setting the transform afterwards warns and is\n+|		// ignored: a component created at runtime defaults to static.\n+|		Label-&gt;SetMobility(EComponentMobility::Movable);\n+|		Label-&gt;RegisterComponent();\n+|		Label-&gt;AttachToComponent(Root, FAttachmentTransformRules::KeepRelativeTransform);\n+|\n+|		Label-&gt;SetRelativeLocation(\n+|			FVector(Position.ChipLocation.X, Position.ChipLocation.Y, LabelZOffset));\n+|		Label-&gt;SetRelativeRotation(LabelRotation);\n+|\n+|		Label-&gt;SetText(Position.DisplayName);\n+|		Label-&gt;SetWorldSize(LabelTextSize);\n+|		Label-&gt;SetHorizontalAlignment(EHTA_Center);\n+|		Label-&gt;SetVerticalAlignment(EVRTA_TextCenter);\n+|		Label-&gt;SetTextRenderColor(LabelColorFor(Position, *TableLayout));\n+|\n+|		Labels.Add(Label);\n+|	}\n+|}\n+|\n+|FColor AHasardFelt::LabelColorFor(const FHasardBetPosition&amp; Position,\n+|	const UHasardTableLayout&amp; Layout) const\n+|{\n+|	if (Position.BetType != EHasardBetType::StraightUp)\n+|	{\n+|		return OutsideLabelColor;\n+|	}\n+|\n+|	// A straight up covers exactly one pocket. Reading past that would be reading a\n+|	// position this function was not given.\n+|	const int32 Number = Position.CoveredNumbers.Num() == 1\n+|		? Position.CoveredNumbers[0] : INDEX_NONE;\n+|\n+|	if (Number == 0)\n+|	{\n+|		return ZeroLabelColor;\n+|	}\n+|\n+|	return Layout.IsRedNumber(Number) ? RedNumberColor : BlackNumberColor;\n+|}\n+|\nvoid AHasardFelt::DrawDebugLayout() const\n{\n	const UWorld* World = GetWorld();\n	if (!World || !TableLayout)\n	{\n		return;\n	}\n\n	FlushPersistentDebugLines(World);\n\n	FVector2D Min, Max;\n	TableLayout-&gt;GetFeltBounds(Min, Max);\n\n	const int32 Columns = TableLayout-&gt;GetNumberColumns();\n	const int32 Rows = TableLayout-&gt;GetNumberRows();\n\n	// Outline of the whole felt, including the zero box and both outside bands.\n	const FVector2D Corners[4] = {\n		FVector2D(Min.X, Min.Y), FVector2D(Max.X, Min.Y),\n		FVector2D(Max.X, Max.Y), FVector2D(Min.X, Max.Y) };\n\n	for (int32 Index = 0; Index &lt; 4; ++Index)\n	{\n		DrawDebugLine(World, FeltLocalToWorld(Corners[Index]),\n			FeltLocalToWorld(Corners[(Index + 1) % 4]),\n			FColor::White, true, -1.0f, 0, 0.6f);\n	}\n\n	// Cell boundaries, drawn from the layout\'s own origin and cell size. The grid and the\n	// resolver therefore read the same two numbers - a grid drawn from a second copy of\n	// the arithmetic would look correct and still send clicks to the wrong cell.\n	const FVector2D Origin = TableLayout-&gt;GetGridOrigin();\n	const FVector2D Cell = TableLayout-&gt;GetCellSize();\n	const float GridFarX = Origin.X + Columns * Cell.X;\n	const float GridFarY = Origin.Y + Rows * Cell.Y;\n\n	for (int32 Column = 0; Column &lt;= Columns; ++Column)\n	{\n		const float LineX = Origin.X + Column * Cell.X;\n		DrawDebugLine(World, FeltLocalToWorld(FVector2D(LineX, Origin.Y)),\n			FeltLocalToWorld(FVector2D(LineX, GridFarY)),\n			FColor(90, 90, 90), true, -1.0f, 0, 0.3f);\n	}\n\n	for (int32 Row = 0; Row &lt;= Rows; ++Row)\n	{\n		const float LineY = Origin.Y + Row * Cell.Y;\n		DrawDebugLine(World, FeltLocalToWorld(FVector2D(Origin.X, LineY)),\n			FeltLocalToWorld(FVector2D(GridFarX, LineY)),\n			FColor(90, 90, 90), true, -1.0f, 0, 0.3f);\n	}\n\n	// The zero box, which is the one cell that is not part of the grid.\n	DrawDebugLine(World, FeltLocalToWorld(FVector2D(Min.X, Origin.Y)),\n		FeltLocalToWorld(FVector2D(Min.X, GridFarY)), FColor(90, 90, 90), true, -1.0f, 0, 0.3f);\n	DrawDebugLine(World, FeltLocalToWorld(FVector2D(Min.X, GridFarY)),\n		FeltLocalToWorld(FVector2D(Origin.X, GridFarY)), FColor(90, 90, 90), true, -1.0f, 0, 0.3f);\n	DrawDebugLine(World, FeltLocalToWorld(FVector2D(Min.X, Origin.Y)),\n		FeltLocalToWorld(FVector2D(Origin.X, Origin.Y)), FColor(90, 90, 90), true, -1.0f, 0, 0.3f);\n\n	// Every chip location. Color carries the type only as a hint; the log is the record.\n	for (const FHasardBetPosition&amp; Position : TableLayout-&gt;GetPositions())\n	{\n		const bool bInside = Position.CoveredNumbers.Num() &lt;= 6;\n		DrawDebugPoint(World, FeltLocalToWorld(Position.ChipLocation), 6.0f,\n			bInside ? FColor::Cyan : FColor::Orange, true, -1.0f);\n	}\n\n	UE_LOG(LogHasard, Warning, TEXT("Felt: drew %d chip locations, felt is %.0f x %.0f cm"),\n		TableLayout-&gt;GetPositions().Num(), Max.X - Min.X, Max.Y - Min.Y);\n}\n</code></pre><p><b>3.</b> <code>HasardBettingComponent.cpp</code>. A comment only &mdash; the assert now says why the new switch is not on its list:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#include "HasardBettingComponent.h"\n#include "HasardTypes.h"\n#include "HasardBankrollComponent.h"\n#include "HasardPayoutTable.h"\n#include "HasardPlayerState.h"\n#include "HasardTableLayout.h"\n#include "GameFramework/Pawn.h"\n\n/**\n * The bankroll lives on the PlayerState, not on this component. Both PlaceBet and\n * SettleRound need it, so the walk is written once. File-static: no header entry.\n */\nstatic UHasardBankrollComponent* FindBankroll(const UActorComponent* Self)\n{\n	APawn* OwnerPawn = Self ? Cast&lt;APawn&gt;(Self-&gt;GetOwner()) : nullptr;\n	AHasardPlayerState* PS = OwnerPawn ? OwnerPawn-&gt;GetPlayerState&lt;AHasardPlayerState&gt;() : nullptr;\n	return PS ? PS-&gt;FindComponentByClass&lt;UHasardBankrollComponent&gt;() : nullptr;\n}\n\n/**\n * Every bet type needs a row in the payout table and a block in BuildPositions, and\n * neither of those is checked by the compiler. This assert is what turns adding an\n * enumerator into a build failure rather than a bet that quietly never pays.\n *\n * It fires on an insertion anywhere before High, which is how Trio and Basket arrived.\n * It does not fire on an append after High, so keep High last.\n+| *\n+| * IsNamedOnFelt is not listed here because it needs no reminder: its switch has no\n+| * default, so the compiler refuses a new enumerator on its own.\n */\nstatic_assert(static_cast&lt;uint8&gt;(EHasardBetType::High) == 14,\n	"EHasardBetType changed. Add a rule to DA_EuropeanPayouts, add a block to "\n	"UHasardTableLayout::BuildPositions, then update this count.");\n\nUHasardBettingComponent::UHasardBettingComponent()\n{\n	PrimaryComponentTick.bCanEverTick = false;\n}\n\nbool UHasardBettingComponent::PlaceBet(int32 PositionId, int32 Stake)\n{\n	if (Stake &lt;= 0 || PositionId == INDEX_NONE)\n	{\n		return false;\n	}\n\n	UHasardBankrollComponent* Bank = FindBankroll(this);\n\n	// Take the money FIRST. A bet that was never paid for must never enter the array.\n	if (!Bank || !Bank-&gt;TryStake(Stake))\n	{\n		UE_LOG(LogHasard, Warning, TEXT("PlaceBet refused: stake of %d not available"), Stake);\n		return false;\n	}\n\n	// Named fields, not FHasardBet{ ... } - the Module 9 warning still applies.\n	FHasardBet Bet;\n	Bet.PositionId = PositionId;\n	Bet.Stake      = Stake;\n\n	ActiveBets.Add(Bet);\n\n	UE_LOG(LogHasard, Warning, TEXT("Bets: %d, total staked: %d"),\n		ActiveBets.Num(), GetTotalStaked());\n\n	return true;\n}\n\nvoid UHasardBettingComponent::SettleRound(int32 WinningPocket,\n	const UHasardPayoutTable* PayoutTable, const UHasardTableLayout* TableLayout)\n{\n	const int32 Placed = ActiveBets.Num();\n	int32 Won = 0;\n	int32 Returned = 0;\n\n	if (!PayoutTable)\n	{\n		// Refuse to guess. Paying from a literal is the thing this module removes.\n		UE_LOG(LogHasard, Error, TEXT("SettleRound: no payout table, paying nobody"));\n		ActiveBets.Empty();\n		return;\n	}\n\n	if (!TableLayout)\n	{\n		// Without the layout a stored id means nothing, so no bet can be evaluated.\n		UE_LOG(LogHasard, Error, TEXT("SettleRound: no table layout, paying nobody"));\n		ActiveBets.Empty();\n		return;\n	}\n\n	UHasardBankrollComponent* Bank = FindBankroll(this);\n\n	if (!Bank)\n	{\n		// The same refusal as the missing table. A summary line reporting money\n		// returned when nothing was credited is worse than no summary at all.\n		UE_LOG(LogHasard, Error, TEXT("SettleRound: no bankroll, paying nobody"));\n		ActiveBets.Empty();\n		return;\n	}\n\n	for (const FHasardBet&amp; Bet : ActiveBets)\n	{\n		const FHasardBetPosition* Position = TableLayout-&gt;GetPositionById(Bet.PositionId);\n		if (!Position)\n		{\n			// A stored id with no position means the layout changed under a live bet.\n			UE_LOG(LogHasard, Error, TEXT("SettleRound: bet on id %d, which is not a position"),\n				Bet.PositionId);\n			continue;\n		}\n\n		// The whole of what used to be a thirteen-case switch. A position knows the\n		// numbers it covers, so zero needs no special case and no bet type does either.\n		if (!Position-&gt;CoveredNumbers.Contains(WinningPocket))\n		{\n			continue;\n		}\n\n		const FHasardPayoutRule* Rule = PayoutTable-&gt;FindRule(Position-&gt;BetType);\n		if (!Rule)\n		{\n			UE_LOG(LogHasard, Error, TEXT("SettleRound: no rule for %s, bet not paid"),\n				*UEnum::GetValueAsString(Position-&gt;BetType));\n			continue;\n		}\n\n		// Stake back plus winnings: TryStake already took the stake when the bet\n		// was placed, so a 35:1 winner returns 36 times it, not 35.\n		const int32 Payout = Bet.Stake * (Rule-&gt;PayoutRatio + 1);\n		Bank-&gt;CreditWinnings(Payout);\n\n		++Won;\n		Returned += Payout;\n	}\n\n	ActiveBets.Empty();\n\n	UE_LOG(LogHasard, Warning, TEXT("SettleRound on %d: %d placed, %d won, %d returned"),\n		WinningPocket, Placed, Won, Returned);\n}\n\nvoid UHasardBettingComponent::ClearAllBets()\n{\n	ActiveBets.Empty();\n	UE_LOG(LogHasard, Warning, TEXT("ClearAllBets"));\n}\n\nint32 UHasardBettingComponent::GetTotalStaked() const\n{\n	int32 Total = 0;\n	for (const FHasardBet&amp; Bet : ActiveBets)\n	{\n		Total += Bet.Stake;\n	}\n	return Total;\n}\n</code></pre><p><b>4.</b> <kbd>Ctrl+Shift+B</kbd> with the editor closed. Expect <b>Build: 1 succeeded, 0 failed</b>.</p><p><b>Phase 2 &mdash; read the table.</b></p><p><b>5.</b> Press <b>Play</b>. The log should read <code>Felt: 157 positions, 49 labels, stake 5 per click</code>. Forty-nine is 37 straight ups plus 3 dozens plus 3 columns plus the 6 even-money bets &mdash; if you get 157 the filter is inverted, and if you get 0 the layout asset is unset on <code>BP_Felt</code>.</p><p><b>6.</b> Look down at the grid and <b>read a number</b>. If they are mirrored, select <code>BP_Felt</code>, find <b>Hasard | Labels &rarr; Label Rotation</b>, and add 180 to <b>Yaw</b>. That is the only axis that can be wrong: pitch already has the text lying flat, or you would be seeing it edge-on.</p><p><b>7.</b> Find <b>0</b>. It must be green, and it must not look like one of the blacks. Then check 1, 3, 5 are red and 2, 4, 6 are black &mdash; the reds are a table in <code>IsRedNumber</code>, not arithmetic, so this is the first time anything has read it back to you.</p><p><b>8.</b> Read the bands. Against the grid: <code>Dozen 1</code>, <code>Dozen 2</code>, <code>Dozen 3</code>. Beyond them: <code>1-18</code>, <code>Even</code>, <code>Red</code>, <code>Black</code>, <code>Odd</code>, <code>19-36</code>. Past the last cell: <code>Column 1</code>, <code>Column 2</code>, <code>Column 3</code>.</p><p><b>9.</b> Now confirm the rebuild is idempotent, which is the thing that would bite silently. Select <code>BP_Felt</code> in the World Outliner while still playing and press <b>Rebuild Labels</b> in the details panel. The log says <code>Felt: built 49 labels</code> and the felt looks <i>identical</i>. Press it three more times. Still 49, still identical &mdash; a builder that only added would now be printing every number four times in the same place, which reads as slightly bolder text and nothing else.</p><p><b>10.</b> Untick <b>Show Labels</b> and press <b>Rebuild Labels</b>. Log says <code>Felt: built 0 labels</code> and the writing is gone. Tick it back on, press again, 49 return.</p><p><b>11.</b> Commit.</p><pre><code>git add -A\ngit commit -m "Print the table labels from the layout" -m "Forty-nine TextRenderComponents built from the generated positions, so a\nlabel cannot sit where the resolver disagrees with it. Zero is colored\nseparately because one pocket is the whole house edge."</code></pre>'}
],
quiz:[
{q:'Why are the labels built in <code>BeginPlay</code> rather than the constructor?',
 opts:['Constructors cannot create components','TextRenderComponent is runtime only','The count comes from the layout asset, which is not assigned when the constructor runs','To keep the constructor short'],
 c:2,why:'CreateDefaultSubobject needs to know how many components to make. Forty-nine is a fact about DA_HasardTableLayout, and the asset arrives after the constructor.'},
{q:'<code>IsNamedOnFelt</code> deliberately has no <code>default:</code> case. Adding a sixteenth bet type therefore:',
 opts:['Fails the build until you decide whether it is named','Silently gets no label','Silently gets a label','Throws at runtime'],
 c:0,why:'A switch over an enum with every enumerator listed and no default makes a new enumerator a compile error. A default would turn that into a bet the player cannot read.'},
{q:'<code>LabelColorFor</code> tests for zero before calling <code>IsRedNumber</code>. Reversing the two would:',
 opts:['Crash on zero','Return an uninitialised color','Make no difference','Print zero in the black ink, because zero is not in the red set'],
 c:3,why:'Correct by the letter of the red list and wrong about the table. The one pocket that is the house edge would be printed as though it were an ordinary black.'},
{q:'<code>BuildLabels</code> destroys before it checks <code>bShowLabels</code>. Checking first would mean:',
 opts:['Labels are built twice','Turning labels off and rebuilding leaves the old ones on the felt','Nothing changes','The array leaks'],
 c:1,why:'The early return would skip the destroy loop, so the off switch could add nothing and remove nothing.'},
{q:'<code>SetMobility(EComponentMobility::Movable)</code> is called before <code>RegisterComponent</code> because:',
 opts:['Registration fails otherwise','It is required for attachment','A component made with NewObject is static, and moving a registered static component is warned about and ignored','TextRender needs it to render'],
 c:2,why:'Constructor subobjects inherit sensible mobility. One made at runtime does not, and the transform set afterwards would be dropped with a log warning.'},
{q:'The strongest argument against painting the labels into a texture instead is:',
 opts:['Textures cost more memory','The label positions become a second copy of the layout arithmetic, and nothing checks it against the resolver','TextRender looks better','You cannot color a texture per number'],
 c:1,why:'Change CellSizeX and the resolver, the collision box and the chip locations all move together. Hand-painted numbers stay put, and the table then reads one way and pays another.'},
]
},


{
grp:"Part III \u2014 The Table the Player Sees",
num:'05',
title:"Move around the table",
lede:"Every bet so far has been a long shot from a fixed spot. Twenty lines of movement, and aiming stops being luck.",
blocks:[
{t:'h',x:'Standing still is most of why aiming is hard'},
{t:'p',x:'The pawn has had a camera and a look axis since guide 2 and no way to move at all. That was fine while the felt was three boxes. It is not fine now: you are picking one 24 cm cell out of 157 from wherever the pawn happens to have spawned, at whatever distance that turned out to be.'},
{t:'p',x:'Being able to walk up to the part of the table you want is worth more than any aiming aid. This module is short and it is the one that makes the previous four usable.'},
{t:'h',x:'Not a Character'},
{t:'p',x:'The reflex in Unreal is to reach for <code>ACharacter</code>. It is the wrong tool here, and the reason is worth stating because it applies to a lot of Unreal decisions.'},
{t:'table',head:['','ACharacter','Pawn + FloatingPawnMovement'],rows:[
['Collision','Capsule you must size and maintain','None you did not ask for'],
['Gravity','On. You will be turning it off','Not a concept'],
['Crouch, jump, swim, fly','All present, all to be ignored','Absent'],
['Animation','Expects a mesh and a state machine','Expects nothing'],
['What you configure','A dozen properties to disable things','Three: speed, acceleration, deceleration'],
]},
{t:'p',x:'A player standing at a roulette table does not jump, crouch, fall or animate. <code>UFloatingPawnMovement</code> slides a pawn around and stops, which is the entire requirement. Choosing the smaller class is not laziness &mdash; every feature you inherit and disable is a thing the next reader has to check is really disabled.'},
{t:'aside',lab:'Why the speed defaults change',x:'<p><code>UFloatingPawnMovement</code> ships at <code>MaxSpeed = 1200</code> uu/s. The felt is 336 cm across at <code>CellSizeX = 24</code>, so the default crosses the whole table in under three tenths of a second.</p><p>250 uu/s is a walk. It is set in the constructor rather than left at the default because the default is wrong for <i>this</i> game, and a value that is wrong by default is a value the next person has to rediscover.</p>'},
{t:'h',x:'Yaw only, and this one bites'},
{t:'p',x:'Movement has to follow where you are facing, so the input vector gets rotated by the control rotation. The obvious version uses all of it:'},
{t:'code',x:'AddMovementInput(GetControlRotation().RotateVector(FVector::ForwardVector), Input.Y);'},
{t:'warn',lab:'That version walks you into the floor',x:'<p>The control rotation includes <b>pitch</b>. You spend this entire game looking down at a table, so <code>ForwardVector</code> rotated by the full control rotation points down at the felt &mdash; and holding W drives the pawn into the floor rather than across it.</p><p>Because <code>UFloatingPawnMovement</code> has no gravity and no floor collision, nothing stops it. You sink through the level, the felt goes out of reach above you, and there is no error. Construct a yaw-only rotator and the problem does not exist:</p><pre><code>const FRotator YawOnly(0.0f, GetControlRotation().Yaw, 0.0f);</code></pre>'},
{t:'chk',q:'The pawn has no gravity and no collision. So what actually stops it leaving the level?',a:'<p><b>Nothing does, and that is deliberate for now.</b> There is no floor to collide with because the pawn has no collision component, and no gravity pulling it to one.</p><p>What keeps you at the table is that <code>Move</code> only ever produces horizontal input, so Z never changes from wherever the pawn spawned. That is a constraint by construction rather than by a wall &mdash; the same shape as <code>PositionId</code> being the array index rather than a checked field.</p><p>It will need revisiting when the table has real geometry and a player who can walk behind the wheel. Right now a bounded box would be five properties and a clamp guarding against a problem nobody has.</p>'},
{t:'h',x:'The reality check has to block this too'},
{t:'rg',lab:'A suppression with a hole in it is not a suppression',x:'<p><code>IMC_RealityCheck</code> is pushed at priority 10 when the check appears, and it maps the look and bet keys to <code>IA_Blocked</code> so the table stops responding. The point is that the check is an interruption, not a notification you can play through.</p><p>Add movement and forget to add it to that list, and the player can walk around the table while the check is on screen. The message is still up, so nothing looks broken &mdash; the interruption has simply stopped interrupting.</p><p><b>Every new input action is also a line in IMC_RealityCheck.</b> Nothing in the code enforces that, which is exactly why it is written down here.</p>'},
{t:'srcs',x:[['Floating Pawn Movement','https://dev.epicgames.com/documentation/en-us/unreal-engine/API/Runtime/Engine/GameFramework/UFloatingPawnMovement'],['Enhanced Input modifiers','https://dev.epicgames.com/documentation/en-us/unreal-engine/enhanced-input-in-unreal-engine'],['Adding movement input','https://dev.epicgames.com/documentation/en-us/unreal-engine/API/Runtime/Engine/GameFramework/APawn/AddMovementInput']]},
{t:'build',title:'Walk to the table',file:'Source/Hasard/ - two files, none new',x:'<p><b>Phase 1 &mdash; Visual Studio.</b> Both files complete. <code>HasardPlayerPawn</code> has not been shown whole since guide 2, so these are marked against what is on disk.</p><p><b>1.</b> <code>HasardPlayerPawn.h</code>:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"\n#include "GameFramework/Pawn.h"\n#include "HasardPlayerPawn.generated.h"\n\nclass USceneComponent;\nclass USpringArmComponent;\nclass UCameraComponent;\n+|class UFloatingPawnMovement;\nclass UInputMappingContext;\nclass UInputAction;\nclass UHasardBettingComponent;\nclass UHasardInteractionComponent;\nstruct FInputActionValue;\n\nUCLASS()\nclass HASARD_API AHasardPlayerPawn : public APawn\n{\n	GENERATED_BODY()\n\npublic:\n	AHasardPlayerPawn();\n\n	/** Console: SettleRound 17 */\n	UFUNCTION(Exec)\n	void SettleRound(int32 WinningPocket);\n\nprotected:\n	virtual void BeginPlay() override;\n	virtual void OnConstruction(const FTransform&amp; Transform) override;\n	virtual void SetupPlayerInputComponent(UInputComponent* PlayerInputComponent) override;\n\nprivate:\n	/** Distance from the table. Applied in OnConstruction, so edits apply right away. */\n	UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Camera",\n		meta = (AllowPrivateAccess = "true"))\n	float CameraDistance = 250.0f;\n\n	UPROPERTY(VisibleAnywhere, Category = "Hasard|Camera")\n	TObjectPtr&lt;USceneComponent&gt; ViewRoot;\n\n	UPROPERTY(VisibleAnywhere, Category = "Hasard|Camera")\n	TObjectPtr&lt;USpringArmComponent&gt; CameraBoom;\n\n	UPROPERTY(VisibleAnywhere, Category = "Hasard|Camera")\n	TObjectPtr&lt;UCameraComponent&gt; TableCamera;\n\n+|	/**\n+|	 * Movement without a Character. A Character brings a capsule, gravity, crouching and\n+|	 * a whole animation contract; a player at a table needs none of it and would have to\n+|	 * be told to ignore all of it. This slides a pawn about and stops.\n+|	 */\n+|	UPROPERTY(VisibleAnywhere, Category = "Hasard|Movement")\n+|	TObjectPtr&lt;UFloatingPawnMovement&gt; Movement;\n+|\n	UPROPERTY(VisibleAnywhere, Category = "Hasard|Betting")\n	TObjectPtr&lt;UHasardBettingComponent&gt; BettingComp;\n\n	UPROPERTY(VisibleAnywhere, Category = "Hasard|Interaction")\n	TObjectPtr&lt;UHasardInteractionComponent&gt; InteractionComp;\n\n	UPROPERTY(EditDefaultsOnly, Category = "Hasard|Input")\n	TObjectPtr&lt;UInputMappingContext&gt; TableMappingContext;\n\n	UPROPERTY(EditDefaultsOnly, Category = "Hasard|Input")\n	TObjectPtr&lt;UInputAction&gt; LookAction;\n\n+|	/** Axis2D. X is strafe, Y is forward - the mapping in IMC_Table decides which key is which. */\n+|	UPROPERTY(EditDefaultsOnly, Category = "Hasard|Input")\n+|	TObjectPtr&lt;UInputAction&gt; MoveAction;\n+|\n	UPROPERTY(EditDefaultsOnly, Category = "Hasard|Input")\n	TObjectPtr&lt;UInputAction&gt; PlaceBetAction;\n\n	UPROPERTY(EditDefaultsOnly, Category = "Hasard|Input")\n	TObjectPtr&lt;UInputAction&gt; SpinAction;\n\n	void Look(const FInputActionValue&amp; Value);\n+|	void Move(const FInputActionValue&amp; Value);\n	void PlaceBet();\n	void RequestSpin();\n};</code></pre><p><b>2.</b> <code>HasardPlayerPawn.cpp</code>:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#include "HasardPlayerPawn.h"\n#include "Camera/CameraComponent.h"\n#include "Components/SceneComponent.h"\n#include "Engine/LocalPlayer.h"\n#include "Engine/World.h"\n#include "EnhancedInputComponent.h"\n#include "EnhancedInputSubsystems.h"\n#include "GameFramework/PlayerController.h"\n+|#include "GameFramework/FloatingPawnMovement.h"\n#include "GameFramework/SpringArmComponent.h"\n#include "HasardBettingComponent.h"\n#include "InputActionValue.h"\n#include "InputMappingContext.h"\n#include "HasardGameMode.h"\n#include "HasardInteractionComponent.h"\n#include "HasardInteractable.h"\n#include "HasardWheel.h"\n#include "HasardTypes.h"\n#include "Kismet/GameplayStatics.h"\n\nAHasardPlayerPawn::AHasardPlayerPawn()\n{\n	PrimaryActorTick.bCanEverTick = false;\n\n	ViewRoot = CreateDefaultSubobject&lt;USceneComponent&gt;(TEXT("ViewRoot"));\n	RootComponent = ViewRoot;\n\n	CameraBoom = CreateDefaultSubobject&lt;USpringArmComponent&gt;(TEXT("CameraBoom"));\n	CameraBoom-&gt;SetupAttachment(ViewRoot);\n	CameraBoom-&gt;bUsePawnControlRotation = true;\n	CameraBoom-&gt;bDoCollisionTest = false;\n\n	TableCamera = CreateDefaultSubobject&lt;UCameraComponent&gt;(TEXT("TableCamera"));\n	TableCamera-&gt;SetupAttachment(CameraBoom, USpringArmComponent::SocketName);\n	TableCamera-&gt;bUsePawnControlRotation = false;\n+|\n+|	Movement = CreateDefaultSubobject&lt;UFloatingPawnMovement&gt;(TEXT("Movement"));\n+|\n+|	// A walk, not a sprint. The defaults are 1200 uu/s, which crosses the whole felt in\n+|	// under a second and makes aiming at a 24 cm cell a matter of luck.\n+|	Movement-&gt;MaxSpeed = 250.0f;\n+|	Movement-&gt;Acceleration = 1200.0f;\n+|	Movement-&gt;Deceleration = 2400.0f;\n\n	BettingComp = CreateDefaultSubobject&lt;UHasardBettingComponent&gt;(TEXT("BettingComp"));\n\n	InteractionComp =\n		CreateDefaultSubobject&lt;UHasardInteractionComponent&gt;(TEXT("InteractionComp"));\n}\n\nvoid AHasardPlayerPawn::OnConstruction(const FTransform&amp; Transform)\n{\n	Super::OnConstruction(Transform);\n\n	// HERE, not in the constructor: Blueprint overrides land afterwards.\n	if (CameraBoom)\n	{\n		CameraBoom-&gt;TargetArmLength = CameraDistance;\n	}\n}\n\nvoid AHasardPlayerPawn::BeginPlay()\n{\n	Super::BeginPlay();\n}\n\nvoid AHasardPlayerPawn::SetupPlayerInputComponent(UInputComponent* PlayerInputComponent)\n{\n	Super::SetupPlayerInputComponent(PlayerInputComponent);\n\n	if (const APlayerController* PC = Cast&lt;APlayerController&gt;(Controller))\n	{\n		if (UEnhancedInputLocalPlayerSubsystem* Subsystem =\n			ULocalPlayer::GetSubsystem&lt;UEnhancedInputLocalPlayerSubsystem&gt;(PC-&gt;GetLocalPlayer()))\n		{\n			if (TableMappingContext)\n			{\n				Subsystem-&gt;AddMappingContext(TableMappingContext, 0);\n			}\n		}\n	}\n\n	if (UEnhancedInputComponent* EIC = Cast&lt;UEnhancedInputComponent&gt;(PlayerInputComponent))\n	{\n		EIC-&gt;BindAction(LookAction,     ETriggerEvent::Triggered, this, &amp;AHasardPlayerPawn::Look);\n+|		EIC-&gt;BindAction(MoveAction,     ETriggerEvent::Triggered, this, &amp;AHasardPlayerPawn::Move);\n		EIC-&gt;BindAction(PlaceBetAction, ETriggerEvent::Started,   this, &amp;AHasardPlayerPawn::PlaceBet);\n		EIC-&gt;BindAction(SpinAction,     ETriggerEvent::Started,   this, &amp;AHasardPlayerPawn::RequestSpin);\n	}\n	else\n	{\n		UE_LOG(LogHasard, Error, TEXT("Not on EnhancedInputComponent"));\n	}\n}\n\nvoid AHasardPlayerPawn::Look(const FInputActionValue&amp; Value)\n{\n	const FVector2D Input = Value.Get&lt;FVector2D&gt;();\n	AddControllerYawInput(Input.X);\n	AddControllerPitchInput(Input.Y);\n+|}\n+|\n+|void AHasardPlayerPawn::Move(const FInputActionValue&amp; Value)\n+|{\n+|	const FVector2D Input = Value.Get&lt;FVector2D&gt;();\n+|\n+|	// Yaw only. Pitch belongs to the camera: looking down at the felt must not mean\n+|	// walking into the floor, and looking up must not lift you off it.\n+|	const FRotator YawOnly(0.0f, GetControlRotation().Yaw, 0.0f);\n+|\n+|	AddMovementInput(YawOnly.RotateVector(FVector::ForwardVector), Input.Y);\n+|	AddMovementInput(YawOnly.RotateVector(FVector::RightVector), Input.X);\n}\n\nvoid AHasardPlayerPawn::PlaceBet()\n{\n	if (!InteractionComp)\n	{\n		return;\n	}\n\n	FHitResult Hit;\n	if (!InteractionComp-&gt;TraceForInteractable(Hit))\n	{\n		return;\n	}\n\n	AActor* HitActor = Hit.GetActor();\n	if (HitActor &amp;&amp; HitActor-&gt;Implements&lt;UHasardInteractable&gt;())\n	{\n		// ImpactPoint, not the actor location: on the felt the point is the bet.\n		IHasardInteractable::Execute_OnPlayerInteract(HitActor, this, Hit.ImpactPoint);\n	}\n}\n\nvoid AHasardPlayerPawn::RequestSpin()\n{\n	AActor* Found = UGameplayStatics::GetActorOfClass(GetWorld(), AHasardWheel::StaticClass());\n	if (AHasardWheel* Wheel = Cast&lt;AHasardWheel&gt;(Found))\n	{\n		Wheel-&gt;StartSpin();\n	}\n	else\n	{\n		UE_LOG(LogHasard, Warning, TEXT("Spin requested, but there is no wheel in the level"));\n	}\n}\n\nvoid AHasardPlayerPawn::SettleRound(int32 WinningPocket)\n{\n	// Through the GameMode now, because the GameMode owns the payout table. The\n	// console test and the wheel therefore travel the same path.\n	if (AHasardGameMode* GM = GetWorld()-&gt;GetAuthGameMode&lt;AHasardGameMode&gt;())\n	{\n		GM-&gt;ResolveRound(WinningPocket);\n	}\n}</code></pre><p><b>3.</b> <kbd>Ctrl+Shift+B</kbd> with the editor closed. Expect <b>Build: 1 succeeded, 0 failed</b>. Reopen the editor.</p><p><b>Phase 2 &mdash; the input assets.</b> Enhanced Input needs an action and four mappings; none of this is code.</p><p><b>4.</b> In <code>Content/Input</code>, right-click &rarr; <b>Input &rarr; Input Action</b>, name it <code>IA_Move</code>. Open it and set <b>Value Type</b> to <b>Axis2D (Vector2D)</b>. A 1D axis cannot carry strafe and forward at once.</p><p><b>5.</b> Open <code>IMC_Table</code>. Add a mapping for <code>IA_Move</code>, then add the four keys under it. The modifiers are what turn one key press into the right component of a 2D vector:</p><pre><code>Key   Modifiers                                    Result\nW     Swizzle Input Axis Values (order YXZ)        Y = +1   forward\nS     Swizzle Input Axis Values (YXZ), then Negate Y = -1   back\nA     Negate                                       X = -1   left\nD     (none)                                       X = +1   right</code></pre><p>A key press arrives as a scalar in <b>X</b>. Swizzling to <code>YXZ</code> moves it to <b>Y</b>, which is why W and S need it and A and D do not. Get this wrong and you will strafe when you meant to walk &mdash; harmless, obvious, and fixed in the asset rather than the code.</p><p><b>6.</b> Open <code>IMC_RealityCheck</code>. Add <b>W, A, S and D</b>, all mapped to <code>IA_Blocked</code>. This is the same suppression the look and bet keys already have, and it is not optional &mdash; see the panel above.</p><p><b>7.</b> Open <code>BP_PlayerPawn</code> &rarr; <b>Class Defaults</b> &rarr; <b>Hasard | Input</b> and set <b>Move Action</b> to <code>IA_Move</code>. Compile and save. Leaving it empty is a silent no-op: <code>BindAction</code> with a null action binds nothing and logs nothing.</p><p><b>Phase 3 &mdash; walk.</b></p><p><b>8.</b> Press <b>Play</b>. WASD moves, the mouse still looks. You should cross the felt in about two seconds, not half of one.</p><p><b>9.</b> <b>Look straight down at the felt and hold W.</b> You must travel forwards along the floor and stay at the same height. If you sink or climb, <code>Move</code> is rotating the whole control rotation instead of yaw alone.</p><p><b>10.</b> Walk to the near edge of the felt and click a number you are standing over. The log should name that number &mdash; the first time you have been able to aim at a specific cell rather than pick one out of a distant blur.</p><p><b>11.</b> Stand still and wait for the reality check. While it is up, press WASD. <b>Nothing moves.</b> Dismiss it and WASD works again.</p><p><b>12.</b> Commit.</p><pre><code>git add -A\ngit commit -m "Add WASD movement to the table pawn" -m "FloatingPawnMovement rather than a Character: no capsule, no gravity, no\nanimation contract to ignore. Move rotates yaw only, so looking down at the\nfelt does not walk the player into the floor."</code></pre>'}
],
quiz:[
{q:'Why <code>UFloatingPawnMovement</code> on a Pawn rather than <code>ACharacter</code>?',
 opts:['Character cannot be used without a mesh','A player at a table needs none of what Character brings, and every inherited feature is one more thing to prove is disabled','Character is deprecated','FloatingPawnMovement is faster'],
 c:1,why:'Capsule, gravity, crouch, jump and an animation contract are all things you would spend properties turning off.'},
{q:'<code>Move</code> builds a yaw-only rotator instead of using <code>GetControlRotation()</code> whole because:',

];

/* ============================================================
   RENDER ENGINE
   ============================================================ */
const done = new Set();
let cur = 0;
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const TOKENS = new RegExp([
  '(\\/\\*[\\s\\S]*?\\*\\/|\\/\\/[^\\n]*)',
  '("[^"\\n]*")',
  '\\b(UPROPERTY|UFUNCTION|UCLASS|USTRUCT|UENUM|UINTERFACE|UMETA|GENERATED_BODY|UE_LOG|' +
    'DEFINE_LOG_CATEGORY_STATIC|DEFINE_LOG_CATEGORY|DECLARE_LOG_CATEGORY_EXTERN|' +
    'DECLARE_DYNAMIC_MULTICAST_DELEGATE(?:_\\w+)?|DECLARE_DELEGATE(?:_\\w+)?|TEXT|' +
    'check|ensure(?:Always)?)\\b',
  '\\b(class|struct|enum|void|float|double|bool|const|public|private|protected|if|else|' +
    'for|while|return|new|static|virtual|override|template|namespace|true|false|nullptr|' +
    'this|int32|uint8|int16|uint16|string)\\b',
  '\\b([UAFTIEG][A-Z]\\w*)\\b'
].join('|'), 'g');

function hi(code){
  return esc(code).replace(TOKENS, (m, cm, st, mc, kw, ty) => {
    const cls = cm ? 'cm' : st ? 'st' : mc ? 'mc' : kw ? 'kw' : ty ? 'ty' : null;
    return cls ? '<span class="' + cls + '">' + m + '</span>' : m;
  });
}

/* ---- line-level diff markers -------------------------------------------
   Inside a <pre><code> block a line may open with one of three two-character
   markers: "+|" added, "~|" changed, "-|" deleted (shown for context only).
   A line with no marker is unchanged. C++ never legitimately opens a line
   with one of these tokens, so there is no ambiguity.                      */
const LNCLASS = {'+|':'add', '~|':'chg', '-|':'del'};

/* hi() now runs per line rather than over the whole block, which would break a
   C-style comment token spanning several lines. An unmarked block containing
   one falls back to whole-string highlighting. */
const MULTILINE_COMMENT = /\/\*[^]*?\n[^]*?\*\//;

function hiLines(code, preEscaped){
  const lines = code.split('\n');
  const hasMarkers = lines.some(l => LNCLASS[l.substring(0,2)] !== undefined);
  if(!hasMarkers && !preEscaped && MULTILINE_COMMENT.test(code)) return hi(code);
  let out = '';
  for(let i = 0; i < lines.length; i++){
    const cls  = LNCLASS[lines[i].substring(0,2)];
    const body = cls ? lines[i].substring(2) : lines[i];
    out += '<span class="ln' + (cls ? ' ' + cls : '') + '">' +
           (preEscaped ? body : hi(body)) + '</span>';
  }
  return out;
}

/* Panels carry their code as already-escaped HTML, so mark the lines without
   re-escaping or re-highlighting them. */
function markCode(html){
  return html.replace(/<pre><code>([\s\S]*?)<\/code><\/pre>/g,
    (m, body) => '<pre><code>' + hiLines(body, true) + '</code></pre>');
}

function buildNav(){
  const nav = document.getElementById('nav');
  let html = '', lastGrp = '';
  COURSE.forEach((m,i)=>{
    if(m.grp !== lastGrp){ html += '<div class="grp">'+m.grp+'</div>'; lastGrp = m.grp; }
    html += '<button data-i="'+i+'"><span class="n">'+(m.num||String(i).padStart(2,'0'))+'</span>'+m.title+'<span class="dot">&#10003;</span></button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
}

function refreshNav(){
  document.querySelectorAll('#nav button').forEach(b=>{
    const i = +b.dataset.i;
    b.classList.toggle('on', i===cur);
    b.classList.toggle('done', done.has(i));
  });
  const pct = Math.round(done.size/COURSE.length*100);
  document.querySelector('#prog>i').style.width = pct+'%';
  document.getElementById('progtxt').textContent =
    done.size+' of '+COURSE.length+' modules complete'+(done.size===COURSE.length?'  — course finished':'');
}

function renderBlocks(bl){
  return bl.map(b=>{
    switch(b.t){
      case 'h': return '<h3>'+b.x+'</h3>';
      case 'p': return '<p>'+b.x+'</p>';
      case 'code': return '<pre><code>'+hiLines(b.x,false)+'</code></pre>';
      case 'aside': return '<div class="aside"><div class="lab">'+(b.lab||'Why it works')+'</div>'+markCode(b.x.trim().startsWith('<p')?b.x:'<p>'+b.x+'</p>')+'</div>';
      case 'warn': return '<div class="warn"><div class="lab">'+(b.lab||'Careful')+'</div>'+markCode(b.x.trim().startsWith('<p')?b.x:'<p>'+b.x+'</p>')+'</div>';
      case 'rg': return '<div class="rg"><div class="lab">'+(b.lab||'Responsible gaming')+'</div>'+markCode(b.x.trim().startsWith('<p')?b.x:'<p>'+b.x+'</p>')+'</div>';
      case 'build': return '<div class="build"><div class="lab">&#9654; Build &mdash; '+b.title+'</div>'+
        (b.file?'<div class="file">'+b.file+'</div>':'')+markCode(b.x.trim().startsWith('<p')?b.x:'<p>'+b.x+'</p>')+'</div>';
      case 'srcs': return '<div class="srcs"><div class="lab">Epic documentation for this module</div>'+
        b.x.map(s=>'<a href="'+s[1]+'" target="_blank" rel="noopener">'+s[0]+'</a>').join('')+'</div>';
      case 'list': return '<ul>'+b.x.map(li=>'<li>'+li+'</li>').join('')+'</ul>';
      case 'table': return '<table><thead><tr>'+b.head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+
        b.rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
      case 'chk': return '<div class="chk"><div class="lab">Check yourself</div><p class="q">'+b.q+'</p>'+
        '<button onclick="this.parentNode.classList.add(\'open\')">Reveal answer</button>'+
        '<div class="ans">'+b.a+'</div></div>';
    }
    return '';
  }).join('');
}

function renderQuiz(m, idx){
  const isExam = COURSE[idx].grp === 'Assessment';
  let h = '<div class="quiz"><h4>'+(isExam?'Final Examination':'Module '+idx+' Quiz')+'</h4>'+
    '<p class="hint">'+m.quiz.length+' questions. Pick one answer per question; reasoning appears immediately.</p>';
  m.quiz.forEach((q,qi)=>{
    h += '<div class="qi" data-q="'+qi+'"><p class="qt"><span class="num">Q'+(qi+1)+'</span>'+q.q+'</p>';
    q.opts.forEach((o,oi)=>{ h += '<button class="opt" data-q="'+qi+'" data-o="'+oi+'">'+o+'</button>'; });
    h += '<div class="why" data-why="'+qi+'"></div></div>';
  });
  h += '<div class="score" id="score"></div></div>';
  return h;
}

function go(i){
  cur = i;
  const m = COURSE[i];
  const isExam = COURSE[i].grp === 'Assessment';
  const main = document.getElementById('main');
  main.innerHTML =
    '<div class="kicker">'+(isExam?'Assessment':'Module '+(m.num?m.num.replace(/^0/,''):i))+' &middot; '+m.grp+'</div>'+
    '<h2 class="title">'+m.title+'</h2>'+
    '<p class="lede">'+m.lede+'</p>'+
    renderBlocks(m.blocks)+
    renderQuiz(m,i)+
    '<div class="pager">'+
      '<button id="prev" '+(i===0?'disabled':'')+'>&larr; Previous</button>'+
      '<button id="next" class="primary" '+(i===COURSE.length-1?'disabled':'')+'>Next module &rarr;</button>'+
    '</div>';
  window.scrollTo(0,0);

  const answered = {}; let correct = 0;
  main.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick = ()=>{
      const qi = +btn.dataset.q, oi = +btn.dataset.o;
      if(answered[qi]!==undefined) return;
      answered[qi] = oi;
      const q = m.quiz[qi];
      main.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(b=>{
        b.disabled = true;
        if(+b.dataset.o === q.c) b.classList.add('right');
        else if(+b.dataset.o === oi) b.classList.add('wrong');
      });
      if(oi === q.c) correct++;
      const why = main.querySelector('.why[data-why="'+qi+'"]');
      why.innerHTML = (oi===q.c?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q.why;
      why.classList.add('show');
      if(Object.keys(answered).length === m.quiz.length){
        const sc = document.getElementById('score');
        const pct = Math.round(correct/m.quiz.length*100);
        let verdict;
        if(isExam) verdict = correct>=12 ? ' — pass. Go package the build.' : ' — below the pass mark of 12. Revisit the modules named above.';
        else verdict = pct===100 ? ' — clean sweep.' : pct>=60 ? ' — solid. Reread what you missed, then do the Build step.' : ' — reread this module before building.';
        sc.innerHTML = '<b>Score: '+correct+' / '+m.quiz.length+' ('+pct+'%)</b>'+verdict;
        sc.classList.add('show');
        done.add(i); refreshNav();
      }
    };
  });
  const p = document.getElementById('prev'), n = document.getElementById('next');
  if(p) p.onclick = ()=>go(i-1);
  if(n) n.onclick = ()=>go(i+1);
  refreshNav();
}

buildNav(); go(0);
</script>
