/* ---------------------------------------------------------- 7 */
{
grp:"Part III — Playing the Table",
title:"Components: the betting system",
lede:"The most useful structural habit in Unreal. Instead of a deeper class hierarchy, build capabilities you can attach to anything.",
blocks:[
{t:'h',x:'The problem components solve'},
{t:'p',x:'Betting logic could live on the pawn. But then a spectator pawn, an AI player, or a second seat at the table would each need to inherit from your player pawn — which is absurd. Put it in a <b>component</b> and anything that bets attaches one.'},
{t:'p',x:'Guide 1 raised this at the end of the Interfaces module: interfaces say <i>"you can be asked to do this"</i>, components say <i>"you have this capability, and here is how it works"</i>. This project uses both — a component that places bets, an interface that bet spots implement.'},

{t:'h',x:'Creating an ActorComponent'},
{t:'code',x:`// HasardBettingComponent.h
#pragma once

#include "CoreMinimal.h"
#include "Components/ActorComponent.h"
#include "HasardBettingComponent.generated.h"

UCLASS(ClassGroup=(Hasard), meta=(BlueprintSpawnableComponent))
class HASARD_API UHasardBettingComponent : public UActorComponent
{
  GENERATED_BODY()

public:
  UHasardBettingComponent();

  UFUNCTION(BlueprintCallable, Category = "Hasard|Betting")
  bool PlaceBet(EHasardBetType BetType, int32 PrimaryNumber, int32 Stake);

  UFUNCTION(BlueprintCallable, Category = "Hasard|Betting")
  void ClearAllBets();

protected:
  UPROPERTY(EditDefaultsOnly, Category = "Hasard|Betting")
  int32 ChipDenomination = 5;
};`},
{t:'p',x:'Two specifiers earn their place. <code>ClassGroup=(Hasard)</code> groups it in the editor. <code>meta=(BlueprintSpawnableComponent)</code> is the one that matters: <b>without it, designers cannot add your component to a Blueprint actor</b> via Add Component. A frequent and confusing omission.'},
{t:'chk',q:'Your component compiles but does not appear in the Add Component dropdown. Why?',a:'Missing <code>meta=(BlueprintSpawnableComponent)</code> on the <code>UCLASS</code>. The class exists and is perfectly usable from C++, but the editor will not offer it as something to add to a Blueprint without that metadata.'},

{t:'h',x:'SceneComponent vs ActorComponent'},
{t:'table',head:['Base','Has a transform?','Use for'],rows:[
['<code>UActorComponent</code>','No','Pure logic: betting, bankroll, session tracking'],
['<code>USceneComponent</code>','Yes','Anything needing a position: attachment points, chip stack anchors'],
['<code>UPrimitiveComponent</code>','Yes, plus rendering and collision','Meshes, collision shapes, the bet-spot volumes']]},
{t:'p',x:'Choose the lightest that works. A betting component has no position of its own, so <code>UActorComponent</code> is correct. Giving it a transform it never uses is the same category of error as making the wheel an <code>ACharacter</code>.'},

{t:'h',x:'A bet, as data'},
{t:'code',x:`UENUM(BlueprintType)
enum class EHasardBetType : uint8
{
  StraightUp  UMETA(DisplayName = "Straight Up"),   // 1 number,  pays 35:1
  Split       UMETA(DisplayName = "Split"),         // 2 numbers, pays 17:1
  Street      UMETA(DisplayName = "Street"),        // 3 numbers, pays 11:1
  Corner      UMETA(DisplayName = "Corner"),        // 4 numbers, pays  8:1
  SixLine     UMETA(DisplayName = "Six Line"),      // 6 numbers, pays  5:1
  Column      UMETA(DisplayName = "Column"),        // 12 numbers, pays 2:1
  Dozen       UMETA(DisplayName = "Dozen"),         // 12 numbers, pays 2:1
  Red         UMETA(DisplayName = "Red"),           // 18 numbers, pays 1:1
  Black       UMETA(DisplayName = "Black"),
  Even        UMETA(DisplayName = "Even"),
  Odd         UMETA(DisplayName = "Odd"),
  Low         UMETA(DisplayName = "Low 1-18"),
  High        UMETA(DisplayName = "High 19-36")
};

USTRUCT(BlueprintType)
struct FHasardBet
{
  GENERATED_BODY()

  UPROPERTY(BlueprintReadOnly, Category = "Bet")
  EHasardBetType BetType = EHasardBetType::StraightUp;

  UPROPERTY(BlueprintReadOnly, Category = "Bet")
  int32 PrimaryNumber = 0;

  UPROPERTY(BlueprintReadOnly, Category = "Bet")
  int32 Stake = 0;
};`},
{t:'aside',lab:'Every one of those bets has the same house edge',x:'<p>Straight up pays 35:1 with a 1/37 chance. Red pays 1:1 with an 18/37 chance. Work either through and you get the same expected value: <b>&minus;1/37, or &minus;2.70%</b>. Every bet on the table, without exception.</p><p>That fact is the single most useful thing an honest-odds display can tell a player, because it dissolves the entire premise of "systems" and "better bets". You will surface it in Module 12.</p>'},
{t:'chk',q:'Why is <code>FHasardBet</code> a <code>USTRUCT</code> rather than a <code>UCLASS</code>?',a:'It is pure data with no behaviour and no identity — a value you copy around, store in arrays, and throw away. That is exactly what structs are for (Guide 1, Module 8: <code>F</code> prefix, value semantics, accessed with <code>.</code>). Making it a UObject would add allocation, garbage collection and reference tracking for no benefit.'},

{t:'build',title:'Create the betting component',file:'Source/Hasard/',x:'<p><b>Phase 1 &mdash; editor.</b></p> <p><b>1.</b> New C++ Class &rarr; <b>Actor Component</b> &rarr; <code>HasardBettingComponent</code>. Close the editor.</p> <p><b>Phase 2 &mdash; Visual Studio.</b></p> <p><b>2.</b> Create a new file <code>Source/Hasard/HasardTypes.h</code> by hand (VS: right-click the Hasard folder &rarr; Add &rarr; New Item &rarr; Header File). It holds the shared enum and struct so the bet spot, the betting component and the payout table can all use them:</p> <pre><code>#pragma once\n\n#include "CoreMinimal.h"\n#include "HasardTypes.generated.h"</code></pre> <p>Then the <code>UENUM</code> and <code>USTRUCT</code> from the lecture above.</p> <p><b>3.</b> Right-click <code>Hasard.uproject</code> &rarr; <b>Generate Visual Studio project files</b>. A hand-created file will not appear in the solution until you do, and Unreal Header Tool needs to see it to produce <code>HasardTypes.generated.h</code>.</p> <p><b>4.</b> <code>HasardBettingComponent.h</code> &mdash; include the types header, add the <code>UCLASS</code> specifiers and the members:</p> <pre><code>#include "HasardTypes.h"\n#include "HasardBettingComponent.generated.h"\n\nUCLASS(ClassGroup=(Hasard), meta=(BlueprintSpawnableComponent))\nclass HASARD_API UHasardBettingComponent : public UActorComponent</code></pre> <p>plus <code>PlaceBet</code>, <code>ClearAllBets</code> and <code>ChipDenomination</code> as shown in the lecture.</p> <p><b>5.</b> <code>HasardBettingComponent.cpp</code> &mdash; includes, then stub the two functions with logs for now:</p> <pre><code>#include "HasardBettingComponent.h"\n#include "HasardTypes.h"      // EHasardBetType, FHasardBet</code></pre> <pre><code>bool UHasardBettingComponent::PlaceBet(EHasardBetType BetType, int32 PrimaryNumber, int32 Stake)\n{\n  UE_LOG(LogHasard, Warning, TEXT("PlaceBet: type %s on %d for %d"),\n         *UEnum::GetValueAsString(BetType), PrimaryNumber, Stake);\n  return true;\n}</code></pre> <p><b>6.</b> <code>HasardPlayerPawn.h</code> &mdash; forward declare and add the component:</p> <pre><code>class UHasardBettingComponent;\n\nUPROPERTY(VisibleAnywhere, Category = "Hasard|Betting")\nTObjectPtr&lt;UHasardBettingComponent&gt; BettingComp;</code></pre> <p><b>7.</b> <code>HasardPlayerPawn.cpp</code> &mdash; include it, create it in the constructor, and call it from the input handler:</p> <pre><code>BettingComp = CreateDefaultSubobject&lt;UHasardBettingComponent&gt;(TEXT("BettingComp"));</code></pre> <pre><code>void AHasardPlayerPawn::PlaceBet()\n{\n  if (BettingComp)\n  {\n    BettingComp-&gt;PlaceBet(EHasardBetType::StraightUp, 17, 5);\n  }\n}</code></pre> <p><b>Phase 3 &mdash; build and test.</b></p> <p><b>8.</b> <code>Ctrl+Shift+B</code>, reopen, Play, click. The log should show a straight-up bet on 17.</p> <p><b>9.</b> Commit.</p> <pre><code>git add -A\ngit commit -m "Add betting component and shared Hasard types" -m "EHasardBetType and FHasardBet live in HasardTypes.h so the bet spot, betting component and payout table can share them. Betting is a component so anything that bets can have one, without inheriting from the player pawn."</code></pre>'},
{t:'srcs',x:[['Components','https://dev.epicgames.com/documentation/en-us/unreal-engine/components-in-unreal-engine']]}
],

{q:'<code>FHasardBet</code> is a USTRUCT rather than a UCLASS because:',

{
grp:"Part III — Playing the Table",
title:"Collision and tracing: clicking the felt",
lede:"How to ask the world what the player is looking at. Line traces, channels, and why your trace hits nothing.",
blocks:[
{t:'h',x:'Traces versus overlaps'},
{t:'table',head:['Mechanism','Question','Cost'],rows:[
['<b>Line trace</b>','What is under my crosshair right now?','Cheap, on demand'],
['<b>Sweep</b>','What does this shape hit as it moves?','Slightly more, on demand'],
['<b>Overlap event</b>','Tell me when something enters me','Free until it happens']]},
{t:'p',x:'Use traces when <i>you</i> ask the question — the player clicks and you need to know which bet square. Use overlap events when the <i>world</i> should tell you.'},

{t:'h',x:'A line trace from the camera'},
{t:'code',x:`AHasardBetSpot* UHasardInteractionComponent::TraceForBetSpot() const
{
  APawn* OwnerPawn = Cast<APawn>(GetOwner());
  if (!OwnerPawn) return nullptr;

  FVector EyeLocation;
  FRotator EyeRotation;
  OwnerPawn->GetActorEyesViewPoint(EyeLocation, EyeRotation);

  const FVector End = EyeLocation + (EyeRotation.Vector() * TraceDistance);

  FCollisionQueryParams Params;
  Params.AddIgnoredActor(OwnerPawn);      // do not hit yourself

  FHitResult Hit;
  const bool bHit = GetWorld()->LineTraceSingleByChannel(
      Hit, EyeLocation, End, ECC_Visibility, Params);

  DrawDebugLine(GetWorld(), EyeLocation, End,
      bHit ? FColor::Green : FColor::Red, false, 1.0f, 0, 1.5f);

  return bHit ? Cast<AHasardBetSpot>(Hit.GetActor()) : nullptr;
}`},
{t:'p',x:'Points worth noting: <code>FHitResult</code> is a struct, so you access it with <code>.</code> (Guide 1, Module 2). <code>AddIgnoredActor</code> saves you from hitting your own pawn at distance zero. And the <code>Cast</code> returning null for a non-bet-spot is Guide 1 Module 5 — safe, checked, no crash.'},

{t:'h',x:'Collision channels'},
{t:'p',x:'Every trace runs against a <b>channel</b>, and every component decides per channel whether it blocks, overlaps or ignores.'},
{t:'warn',lab:'Why your trace hits nothing',x:'<p>Three causes, in order of frequency:</p><p><b>1.</b> The target\'s collision preset ignores your channel. Check the component\'s <b>Collision Presets</b> — <code>NoCollision</code> and <code>OverlapAll</code> will not produce a blocking hit.<br><b>2.</b> You traced from inside your own pawn and hit yourself. Add <code>AddIgnoredActor</code>.<br><b>3.</b> Start and end are the same point, usually from a zero-length direction vector.</p>'},
{t:'chk',q:'Your trace never reports a hit on the bet spot you placed. First thing to check?',a:'The collision preset on its mesh or box component. Many meshes default to <code>NoCollision</code> or <code>OverlapAll</code>, neither of which blocks a <code>Visibility</code> trace. Set it to <code>BlockAll</code> (or a custom preset that blocks Visibility) and trace again.'},

{t:'h',x:'The interface, put to work'},
{t:'p',x:'A bet spot on the felt and the wheel itself both respond to being clicked, but differently. That is exactly the interface case from Guide 1 Module 6.'},
{t:'code',x:`// Check - uses the U-prefixed class
if (HitActor->Implements<UHasardInteractable>())
{
  // Call - uses the I-prefixed class, Execute_ prefix, target as first arg
  IHasardInteractable::Execute_OnPlayerInteract(HitActor, OwnerPawn);
}`},
{t:'p',x:'<code>Implements&lt;T&gt;()</code> returns a <b>bool</b> — it is a question, not a cast. <code>Execute_</code> is a static function generated by <code>GENERATED_BODY()</code>, which is why the target is passed as an argument rather than used with <code>-&gt;</code>.'},
{t:'rg',lab:'No near-miss, starting here',x:'<p>When the ball settles, a bet spot one pocket away from the winner gets <b>no special treatment</b>. No highlight, no "so close", no sound. It is a loss and it reads as a loss.</p><p>This is the easiest place in the whole project to accidentally build a dark pattern, because highlighting adjacent numbers feels like helpful feedback. It is not — it is the single most studied manipulative mechanic in gambling design.</p>'},

{t:'build',title:'Make the felt clickable',file:'Source/Hasard/',x:'<p><b>Phase 1 &mdash; editor. Create all three classes before closing.</b></p> <p><b>1.</b> New C++ Class &rarr; <b>All Classes</b> &rarr; search <b>Unreal Interface</b> &rarr; name it <code>HasardInteractable</code>.</p> <p><b>2.</b> New C++ Class &rarr; <b>Actor</b> &rarr; <code>HasardBetSpot</code>.</p> <p><b>3.</b> New C++ Class &rarr; <b>Actor Component</b> &rarr; <code>HasardInteractionComponent</code>. Close the editor.</p> <p><b>Phase 2 &mdash; Visual Studio.</b></p> <p><b>4.</b> <code>HasardInteractable.h</code> &mdash; add one function to the <b>I-prefixed</b> class:</p> <pre><code>UFUNCTION(BlueprintCallable, BlueprintNativeEvent, Category = "Hasard|Interaction")\nvoid OnPlayerInteract(APawn* InstigatorPawn);</code></pre> <p>Leave the <code>U</code>-prefixed class exactly as generated.</p> <p><b>5.</b> <code>HasardBetSpot.h</code> &mdash; inherit from both, and add the bet data:</p> <pre><code>class HASARD_API AHasardBetSpot : public AActor, public IHasardInteractable\n{\n  GENERATED_BODY()\n\npublic:\n  AHasardBetSpot();\n\n  virtual void OnPlayerInteract_Implementation(APawn* InstigatorPawn) override;\n\nprotected:\n  UPROPERTY(VisibleAnywhere, Category = "Hasard|BetSpot")\n  TObjectPtr&lt;UBoxComponent&gt; SpotBounds;\n\n  UPROPERTY(EditInstanceOnly, BlueprintReadOnly, Category = "Hasard|BetSpot")\n  EHasardBetType BetType = EHasardBetType::StraightUp;\n\n  UPROPERTY(EditInstanceOnly, BlueprintReadOnly, Category = "Hasard|BetSpot")\n  int32 PrimaryNumber = 0;\n};</code></pre> <p>Note <code>_Implementation</code> on the override — required by <code>BlueprintNativeEvent</code>. And <code>EditInstanceOnly</code>: this is the one place per-instance editing is correct, since every square on the felt is a different bet.</p> <p><b>6.</b> <code>HasardBetSpot.cpp</code> &mdash; create the box in the constructor, and log in the implementation.</p> <pre><code>#include "HasardBetSpot.h"\n#include "Components/BoxComponent.h"   // CreateDefaultSubobject&lt;UBoxComponent&gt;</code></pre> <p>The header forward declares <code>class UBoxComponent;</code> — it only holds a pointer. The <code>.cpp</code> constructs one, so it needs the definition.</p> <p><b>7.</b> <code>HasardInteractionComponent.h/.cpp</code> &mdash; the trace from the lecture, plus <code>TraceDistance</code> and <code>TraceRadius</code> as <code>EditDefaultsOnly</code> floats.</p> <pre><code>#include "HasardInteractionComponent.h"\n#include "Engine/World.h"         // LineTraceSingleByChannel lives on UWorld\n#include "CollisionQueryParams.h"  // FCollisionQueryParams\n#include "DrawDebugHelpers.h"      // DrawDebugLine\n#include "GameFramework/Pawn.h"    // the instigator you pass along</code></pre> <p><b>8.</b> Add the interaction component to the pawn, and rewrite <code>PlaceBet()</code> to trace, check, and call:</p> <pre><code>void AHasardPlayerPawn::PlaceBet()\n{\n  AActor* Hit = InteractionComp-&gt;TraceForBetSpot();\n  if (Hit &amp;&amp; Hit-&gt;Implements&lt;UHasardInteractable&gt;())\n  {\n    IHasardInteractable::Execute_OnPlayerInteract(Hit, this);\n  }\n}</code></pre> <p><b>Phase 3 &mdash; build, then place the felt.</b></p> <p><b>9.</b> <code>Ctrl+Shift+B</code>, reopen.</p> <p><b>10.</b> Create <code>BP_BetSpot</code>. Give its box a visible mesh if you like, and set <b>Collision Presets</b> to <code>BlockAll</code> — otherwise the trace passes straight through it.</p> <p><b>11.</b> Place three in the level and set each one differently in the Details panel: Straight Up on 17, Red, Even.</p> <p><b>12.</b> Play. Look at each, click, and confirm the right bet type logs. Aim at the sky and confirm a red debug line and no hit.</p> <p><b>13.</b> Commit. <b>This is Guide 1 Module 6 working end to end.</b></p> <pre><code>git add -A\ngit commit -m "Add interaction trace and IHasardInteractable bet spots" -m "Component traces and asks; the actor decides what interacting means. Execute_ rather than casting to the interface, so Blueprint-added implementations also work."</code></pre>'},
{t:'srcs',x:[['Collision in Unreal Engine','https://dev.epicgames.com/documentation/en-us/unreal-engine/collision-in-unreal-engine'],['Traces with Raycasts','https://dev.epicgames.com/documentation/en-us/unreal-engine/traces-with-raycasts-in-unreal-engine']]}
],
quiz:[

 opts:['Its mobility is Static','Its collision preset is NoCollision or OverlapAll','It has no material','It is too far away'],

{q:'<code>Implements&lt;UHasardInteractable&gt;()</code> returns:',

{
grp:"Part III — Playing the Table",
title:"Containers: holding the bets",
lede:"TArray is the one you will use constantly. Here is the API that matters and the two mistakes that cause crashes.",
blocks:[
{t:'h',x:'The active bets'},
{t:'code',x:`// HasardBettingComponent.h
UPROPERTY(BlueprintReadOnly, Category = "Hasard|Betting")
TArray<FHasardBet> ActiveBets;`},
{t:'code',x:`bool UHasardBettingComponent::PlaceBet(EHasardBetType BetType, int32 PrimaryNumber, int32 Stake)
{
  if (Stake <= 0) return false;

  ActiveBets.Emplace(FHasardBet{ BetType, PrimaryNumber, Stake });
  return true;
}

int32 UHasardBettingComponent::GetTotalStaked() const
{
  int32 Total = 0;
  for (const FHasardBet& Bet : ActiveBets)   // ranged-for, const ref, no copies
  {
    Total += Bet.Stake;
  }
  return Total;
}`},
{t:'aside',lab:'Add versus Emplace',x:'<p>Both append. <code>Add</code> copies or moves an existing instance in; <code>Emplace</code> constructs the element <b>directly in place</b> from the arguments you give it.</p><p>Epic\'s rule of thumb: <b><code>Add</code> for trivial types, <code>Emplace</code> otherwise.</b> <code>Emplace</code> is never slower; <code>Add</code> sometimes reads better.</p>'},
{t:'p',x:'Note <code>const FHasardBet&amp;</code> in the loop — Guide 1 Module 3. A reference avoids copying each struct; the <code>const</code> promises you will not modify them.'},

{t:'h',x:'The working subset'},
{t:'code',x:`ActiveBets.Num();                      // count
ActiveBets.IsEmpty();                  // clearer than Num() == 0
ActiveBets.Empty();                    // clear all - end of round
ActiveBets.RemoveAt(Index);            // remove one
ActiveBets.IsValidIndex(Index);        // guard before indexing
ActiveBets.Contains(SomeBet);          // needs operator== on FHasardBet
ActiveBets.Find(SomeBet);              // index, or INDEX_NONE`},
{t:'warn',lab:'Two ways to crash with TArray',x:'<p><b>1. Out-of-range access.</b> <code>ActiveBets[5]</code> on a four-element array crashes. Guard with <code>IsValidIndex</code> or use a ranged-for.</p><p><b>2. Modifying while iterating.</b> Removing elements inside a ranged-for invalidates the iteration. Iterate backwards by index instead:</p><p><code>for (int32 i = ActiveBets.Num() - 1; i >= 0; --i)</code></p><p>Going backwards means removals do not disturb the indices you have yet to visit.</p>'},
{t:'chk',q:'Settling a round removes losing bets as it goes. Why iterate backwards?',a:'Removing element <code>i</code> shifts every later element down by one. Going forwards, you skip the bet that moved into slot <code>i</code> — so some losing bets would survive and some winning ones would never be paid. Going backwards, everything you have yet to visit sits at a lower index and is unaffected.'},

{t:'h',x:'TMap for the payout lookup'},
{t:'code',x:`// Which numbers does each bet type cover, for a given primary number?
TMap<EHasardBetType, int32> PayoutRatios;

PayoutRatios.Add(EHasardBetType::StraightUp, 35);
PayoutRatios.Add(EHasardBetType::Split,      17);
PayoutRatios.Add(EHasardBetType::Red,         1);

// Safe lookup - returns nullptr if absent
if (const int32* Ratio = PayoutRatios.Find(BetType))
{
  Winnings = Bet.Stake * (*Ratio);
}`},
{t:'warn',lab:'Operator[] on a TMap',x:'<code>PayoutRatios[BetType]</code> on a missing key <b>crashes</b>. It does not silently insert a default. Use <code>Find</code> (pointer, null if absent) or <code>FindRef</code> (value copy, default if absent).'},

{t:'h',x:'UPROPERTY and containers'},
{t:'code',x:`// The UPROPERTY tracks every element for garbage collection
UPROPERTY()
TArray<TObjectPtr<AHasardBetSpot>> HighlightedSpots;`},
{t:'p',x:'A <code>TArray</code> of raw UObject pointers without <code>UPROPERTY()</code> has the Guide 1 Module 12 problem multiplied by the element count: none of those references are visible to the garbage collector.'},

{t:'build',title:'Track the bets',file:'Source/Hasard/HasardBettingComponent.*',x:'<p><b>Visual Studio only</b>, then test in the editor.</p> <p><b>1.</b> Add the array and the query function to the header:</p> <pre><code>UPROPERTY(BlueprintReadOnly, Category = "Hasard|Betting")\nTArray&lt;FHasardBet&gt; ActiveBets;\n\nUFUNCTION(BlueprintPure, Category = "Hasard|Betting")\nint32 GetTotalStaked() const;</code></pre> <p><b>2.</b> Replace the stubbed <code>PlaceBet</code> with the real one, and implement the rest:</p> <pre><code>bool UHasardBettingComponent::PlaceBet(EHasardBetType BetType, int32 PrimaryNumber, int32 Stake)\n{\n  if (Stake &lt;= 0) return false;\n\n  ActiveBets.Emplace(FHasardBet{ BetType, PrimaryNumber, Stake });\n\n  UE_LOG(LogHasard, Warning, TEXT("Bets: %d, total staked: %d"),\n         ActiveBets.Num(), GetTotalStaked());\n  return true;\n}\n\nint32 UHasardBettingComponent::GetTotalStaked() const\n{\n  int32 Total = 0;\n  for (const FHasardBet&amp; Bet : ActiveBets)\n  {\n    Total += Bet.Stake;\n  }\n  return Total;\n}\n\nvoid UHasardBettingComponent::ClearAllBets()\n{\n  ActiveBets.Empty();\n}</code></pre> <p><b>3.</b> Have <code>AHasardBetSpot::OnPlayerInteract_Implementation</code> call <code>PlaceBet</code> on the instigator pawn\'s betting component, passing its own <code>BetType</code> and <code>PrimaryNumber</code>. Clicking a square now places that square\'s bet. <code>HasardBetSpot.cpp</code> gains one include for that:</p> <pre><code>#include "HasardBettingComponent.h"   // calling PlaceBet needs the full type</code></pre> <p><b>4.</b> Build, reopen, Play. Click the three spots repeatedly and watch the total climb.</p> <p><b>5.</b> <b>The experiment.</b> Write a throwaway <code>SettleRound</code> that loops <b>forwards</b> and removes every losing bet:</p> <pre><code>for (int32 i = 0; i &lt; ActiveBets.Num(); ++i)\n{\n  if (!BetWins(ActiveBets[i], WinningPocket))\n  {\n    ActiveBets.RemoveAt(i);   // BUG\n  }\n}</code></pre> <p>Place three losing bets and run it. One survives. Now change the loop to <code>for (int32 i = ActiveBets.Num() - 1; i &gt;= 0; --i)</code> and run it again. None survive. Ten seconds of work for a bug class you will now never ship.</p> <p><b>6.</b> Commit.</p> <pre><code>git add -A\ngit commit -m "Track active bets in a TArray with running stake total" -m "Removal iterates backwards: removing forwards skips the element that shifts into the visited slot, so some losing bets survive and some winners never pay."</code></pre>'},
{t:'srcs',x:[['Containers in Unreal Engine','https://dev.epicgames.com/documentation/en-us/unreal-engine/containers-in-unreal-engine'],['TArray: Arrays in Unreal Engine','https://dev.epicgames.com/documentation/en-us/unreal-engine/array-containers-in-unreal-engine']]}
],
quiz:[
{q:'Removing elements from a TArray while looping forwards causes:',
 opts:['Skipped elements, because later items shift down into visited slots','A compile error','Automatic reallocation','Nothing, it is safe'],
 c:0,why:'Iterate backwards by index when removing, so pending indices are undisturbed.'},
{q:'<code>PayoutRatios[BetType]</code> where the key is absent:',
 opts:['Returns nullptr','Returns a default-constructed value','Inserts the key silently','Crashes'],
 c:3,why:'Use Find (pointer, null if absent) or FindRef (value, default if absent) instead.'},
{q:'<code>for (const FHasardBet& Bet : ActiveBets)</code> — why the const reference?',
 opts:['Structs cannot be copied','It is required by ranged-for','To avoid copying each struct, while promising not to modify them','To allow removal during iteration'],
 c:2,why:'Guide 1, Module 3. The reference avoids the copy; the const documents intent.'},
{q:'Epic\'s rule of thumb on Add versus Emplace:',
 opts:['Always use Add','Add for trivial types, Emplace otherwise','Always use Emplace','They are identical'],
 c:1,why:'Emplace constructs in place and is never slower; Add sometimes reads better for simple types.'},
{q:'<code>TArray&lt;AHasardBetSpot*&gt;</code> as a member without UPROPERTY():',
 opts:['Works fine, arrays are tracked automatically','Will not compile','Is automatically replicated','Leaves every element invisible to the garbage collector'],
 c:3,why:'The Guide 1 dangling-pointer problem, once per element.'}
]
},

{
grp:"Part IV — The Responsible Gaming Layer",
title:"The bankroll, and telling the world",
lede:"Guide 1 explained delegates in theory. Here you build the component that made the theory worth learning — and it is the heart of the project's thesis.",
blocks:[
{t:'h',x:'The design'},
{t:'p',x:'The bankroll lives in a component on the PlayerState. Nothing outside it may write the balance directly — that is Guide 1 Module 4\'s encapsulation lesson, and it is what makes the event reliable. All changes route through one function, which validates, applies, and broadcasts.'},
{t:'rg',lab:'Why this component is the thesis',x:'A conventional implementation tracks a balance. This one tracks <b>balance, total staked this session, and total lost this session</b> — because the last two are what a player actually needs to see and what commercial products reliably hide. The extra two integers are the entire difference between a roulette game and a responsible-gaming demonstration.'},
{t:'code',x:`// HasardBankrollComponent.h
DECLARE_DYNAMIC_MULTICAST_DELEGATE_ThreeParams(FOnBankrollChanged,
    int32, NewBalance,
    int32, Delta,
    int32, SessionNetChange);

UCLASS(ClassGroup=(Hasard), meta=(BlueprintSpawnableComponent))
class HASARD_API UHasardBankrollComponent : public UActorComponent
{
  GENERATED_BODY()

public:
  UPROPERTY(BlueprintAssignable, Category = "Hasard|Bankroll")
  FOnBankrollChanged OnBankrollChanged;

  UFUNCTION(BlueprintCallable, Category = "Hasard|Bankroll")
  bool TryStake(int32 Amount);

  UFUNCTION(BlueprintCallable, Category = "Hasard|Bankroll")
  void CreditWinnings(int32 Amount);

  UFUNCTION(BlueprintPure, Category = "Hasard|Bankroll")
  int32 GetSessionNetChange() const { return TotalWon - TotalStaked; }

protected:
  UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Bankroll")
  int32 StartingBalance = 500;

  UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category = "Hasard|Bankroll")
  int32 Balance = 500;

  UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category = "Hasard|Bankroll")
  int32 TotalStaked = 0;

  UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category = "Hasard|Bankroll")
  int32 TotalWon = 0;
};`},
{t:'p',x:'Count the commas in that macro: three parameters means six entries after the name, alternating type and variable name. Guide 1 warned about this and it remains the most common macro error.'},
{t:'code',x:`bool UHasardBankrollComponent::TryStake(int32 Amount)
{
  if (Amount <= 0 || Amount > Balance)
  {
    return false;     // cannot bet what you do not have
  }

  Balance     -= Amount;
  TotalStaked += Amount;

  OnBankrollChanged.Broadcast(Balance, -Amount, GetSessionNetChange());
  return true;
}

void UHasardBankrollComponent::CreditWinnings(int32 Amount)
{
  if (Amount <= 0) return;

  Balance  += Amount;
  TotalWon += Amount;

  OnBankrollChanged.Broadcast(Balance, Amount, GetSessionNetChange());
}`},
{t:'rg',lab:'A loss must read as a loss',x:'<p>Consider a player who stakes 100 across several bets and wins 40 back. Balance moved by &minus;60. A commercial product would fire a win animation on the 40 and stay silent on the 100 — that is a <b>loss disguised as a win</b>, and it is why <code>SessionNetChange</code> is broadcast alongside the delta.</p><p>The UI in Module 11 shows the net, not the last event. If the session is down, the player can see that it is down, at all times.</p>'},
{t:'chk',q:'Why is <code>Balance</code> <code>VisibleAnywhere</code> rather than <code>EditAnywhere</code>?',a:'Writing it directly would bypass <code>TryStake</code> and skip both the validation and the broadcast. You want to <i>see</i> the value while debugging, never to hand-edit it. <code>StartingBalance</code>, by contrast, is a tuning value and is correctly <code>EditDefaultsOnly</code>.'},
{t:'chk',q:'<code>TryStake</code> returns bool. Why does that matter more here than in most systems?',a:'Because the caller must not place a bet it cannot pay for. If <code>TryStake</code> returned void, <code>PlaceBet</code> would happily add a bet to <code>ActiveBets</code> whose stake was never deducted — and the player would win money they never risked. The return value is what couples the two systems safely.'},

{t:'h',x:'Listening'},
{t:'code',x:`// HasardPlayerController.h
UFUNCTION()      // REQUIRED for AddDynamic
void HandleBankrollChanged(int32 NewBalance, int32 Delta, int32 SessionNetChange);

// HasardPlayerController.cpp
void AHasardPlayerController::BeginPlay()
{
  Super::BeginPlay();

  if (AHasardPlayerState* PS = GetPlayerState<AHasardPlayerState>())
  {
    if (UHasardBankrollComponent* Bank = PS->FindComponentByClass<UHasardBankrollComponent>())
    {
      Bank->OnBankrollChanged.AddDynamic(this, &AHasardPlayerController::HandleBankrollChanged);
    }
  }
}`},
{t:'p',x:'Three Guide 1 rules converge: bound in <code>BeginPlay</code> not the constructor; the function marked <code>UFUNCTION()</code>; the signature matching the delegate exactly. Break any one and it fails silently.'},

{t:'h',x:'The wheel announces its result the same way'},
{t:'code',x:`// HasardWheel.h
DECLARE_DYNAMIC_MULTICAST_DELEGATE_OneParam(FOnBallSettled, int32, WinningPocket);

UPROPERTY(BlueprintAssignable, Category = "Hasard|Wheel")
FOnBallSettled OnBallSettled;

// ...and when the spin timer elapses
OnBallSettled.Broadcast(WinningPocket);`},
{t:'p',x:'The wheel has no idea the GameMode, the HUD and the bankroll are all listening. That ignorance is the design.'},

{t:'build',title:'Build the bankroll',file:'Source/Hasard/HasardBankrollComponent.*',x:'<p><b>Phase 1 &mdash; editor.</b></p> <p><b>1.</b> New C++ Class &rarr; <b>Actor Component</b> &rarr; <code>HasardBankrollComponent</code>. Close the editor.</p> <p><b>Phase 2 &mdash; Visual Studio.</b></p> <p><b>2.</b> <code>HasardBankrollComponent.h</code> &mdash; the delegate declaration above the class, then the properties and functions from the lecture.</p> <p><b>3.</b> <code>HasardBankrollComponent.cpp</code> &mdash; <code>TryStake</code>, <code>CreditWinnings</code>, and set <code>Balance = StartingBalance</code> in <code>BeginPlay</code>. Only its own header is needed here.</p> <p><b>4.</b> <code>HasardPlayerState.h/.cpp</code> &mdash; forward declare, add a <code>TObjectPtr&lt;UHasardBankrollComponent&gt; BankrollComp;</code> property and create it in the constructor.</p> <pre><code>// HasardPlayerState.h\nclass UHasardBankrollComponent;   // pointer only - forward declare\n\n// HasardPlayerState.cpp\n#include "HasardBankrollComponent.h"   // CreateDefaultSubobject needs the definition</code></pre> <p><b>5.</b> <code>HasardPlayerController.h</code> &mdash; declare the handler. <b>The <code>UFUNCTION()</code> is not optional:</b></p> <pre><code>UFUNCTION()\nvoid HandleBankrollChanged(int32 NewBalance, int32 Delta, int32 SessionNetChange);</code></pre> <p><b>6.</b> <code>HasardPlayerController.cpp</code> &mdash; bind in <code>BeginPlay</code> and log all three values, as in the lecture.</p> <pre><code>#include "HasardPlayerController.h"\n#include "HasardPlayerState.h"          // to reach the bankroll component\n#include "HasardBankrollComponent.h"    // AddDynamic on its delegate</code></pre> <p><b>7.</b> <b>Couple betting to the bankroll.</b> In <code>UHasardBettingComponent::PlaceBet</code>, take the stake <i>before</i> recording the bet, and bail out if it fails:</p> <pre><code>UHasardBankrollComponent* Bank = /* from the owning pawn\'s PlayerState */;\nif (!Bank || !Bank-&gt;TryStake(Stake))\n{\n  return false;   // cannot afford it - the bet must not enter the array\n}\n\nActiveBets.Emplace(FHasardBet{ BetType, PrimaryNumber, Stake });\nreturn true;</code></pre> <p>This is why <code>TryStake</code> returns <code>bool</code>. Without the check, a player places bets they never paid for and wins money they never risked.</p> <p><b>8.</b> <code>HasardWheel.h/.cpp</code> &mdash; add the <code>OnBallSettled</code> delegate and broadcast a random pocket when the spin timer elapses:</p> <pre><code>const int32 WinningPocket = FMath::RandRange(0, PocketCount - 1);\nOnBallSettled.Broadcast(WinningPocket);</code></pre> <p>The spin uses a timer, so <code>HasardWheel.cpp</code> needs the same pair Module 4 introduced:</p> <pre><code>#include "Engine/World.h"\n#include "TimerManager.h"</code></pre> <p><b>The spin timer uses <code>SpinDuration</code> unmodified — no padding.</b> A settle beat, if you want one, is a second named property and a second timer, never a fudge added to the first. Two numbers describing one spin will drift the moment someone retunes it. And note the spin is a <i>gameplay</i> duration, so unlike the session clock it correctly runs on world time.</p> <p><b>Phase 3 &mdash; build and test.</b></p> <p><b>9.</b> <code>Ctrl+Shift+B</code>, reopen, Play. Place bets until you run out. Confirm the balance never goes negative and the log shows session net change.</p> <p><b>10.</b> <b>Deliberately break it.</b> Remove the <code>UFUNCTION()</code> from <code>HandleBankrollChanged</code>, rebuild, place a bet. It compiles, it runs, and the callback never fires — no error anywhere. Put it back. You have now <i>seen</i> the failure mode instead of reading about it, and you will recognise it at 2am.</p> <p><b>11.</b> Commit.</p> <pre><code>git add -A\ngit commit -m "Add bankroll component with OnBankrollChanged delegate" -m "Tracks TotalStaked and TotalWon separately from Balance so session cost is visible, not just the current number. TryStake returns bool so a bet whose stake was not deducted can never enter the array."</code></pre>'},
{t:'srcs',x:[['Delegates and Lambda Functions','https://dev.epicgames.com/documentation/en-us/unreal-engine/delegates-and-lambda-functions-in-unreal-engine']]}
],

{t:'h',x:'The division of labour'},

{t:'list',x:[
'<b>Blueprint widget</b> — layout, styling, animation. Designed visually in UMG.',

{t:'h',x:'Creating the HUD from C++'},
{t:'code',x:`// HasardPlayerController.h
#include "Blueprint/UserWidget.h"

UPROPERTY(EditDefaultsOnly, Category = "Hasard|UI")
TSubclassOf<UUserWidget> HUDWidgetClass;

UPROPERTY()
TObjectPtr<UUserWidget> HUDWidget;`},
{t:'code',x:`void AHasardPlayerController::BeginPlay()
{
  Super::BeginPlay();

  if (HUDWidgetClass)
  {
    HUDWidget = CreateWidget<UUserWidget>(this, HUDWidgetClass);
    if (HUDWidget)
    {
      HUDWidget->AddToViewport();
    }
  }
}`},
{t:'p',x:'<code>TSubclassOf&lt;UUserWidget&gt;</code> is Guide 1 Module 9 doing real work: C++ owns <i>when</i> the HUD appears, a designer chooses <i>which</i>. Note the <code>UPROPERTY()</code> on the instance — without it the widget is invisible to the garbage collector.'},
{t:'chk',q:'Why <code>TSubclassOf&lt;UUserWidget&gt;</code> rather than <code>UUserWidget*</code>?',a:'Because you want the <b>class</b>, not an instance — no widget exists yet. <code>CreateWidget</code> takes the class and produces the instance. A pointer would mean pointing at an already-created widget, which is not what you have.'},

{t:'h',x:'Getting data in'},
{t:'code',x:`// C++ declares it; Blueprint implements it. No C++ body at all.
UFUNCTION(BlueprintImplementableEvent, Category = "Hasard|UI")
void UpdateBankroll(int32 Balance, int32 TotalStaked, int32 SessionNetChange);

UFUNCTION(BlueprintImplementableEvent, Category = "Hasard|UI")
void ShowRealityCheck(int32 MinutesElapsed, int32 TotalStaked, int32 SessionNetChange);`},
{t:'table',head:['Specifier','C++ body?','Blueprint may…'],rows:[
['<code>BlueprintCallable</code>','Yes','call it'],
['<code>BlueprintNativeEvent</code>','Yes, as <code>_Implementation</code>','override or extend it'],
['<code>BlueprintImplementableEvent</code>','<b>No</b> — you write none','implement it entirely']]},

{t:'rg',lab:'What the HUD must always show',x:'<p>Four things, permanently visible, not behind a menu:</p><p><b>Balance</b> — the obvious one.<br><b>Total staked this session</b> — the number commercial products bury.<br><b>Session net change</b> — signed, so a losing session reads as negative rather than as a balance that happens to be smaller.<br><b>Session duration</b> — a quiet clock.</p><p>The design test from the project\'s CLAUDE.md applies literally here: <b>if it takes a menu dive, it is hidden.</b></p>'},
{t:'aside',lab:'Where the delegate finally pays off',x:'The chain now runs end to end: a click calls <code>PlaceBet</code> &rarr; which calls <code>TryStake</code> &rarr; which broadcasts <code>OnBankrollChanged</code> &rarr; the bound <code>UFUNCTION</code> fires &rarr; it calls <code>UpdateBankroll</code> on the widget &rarr; the Blueprint sets three text blocks. Nothing polls. Nothing ticks. Every link is something you learned in Guide 1 and have now built.'},

{t:'h',x:'The reality check'},
{t:'p',x:'The timer from Module 4 now has something to do. When it fires, the controller calls <code>ShowRealityCheck</code>, and pushes an input mapping context that suppresses betting until dismissed.'},
{t:'code',x:`void AHasardPlayerController::HandleRealityCheck(int32 MinutesElapsed)
{
  if (!HUDWidget) return;

  // Suppress table input while the check is up - Module 6's contexts
  if (UEnhancedInputLocalPlayerSubsystem* Subsystem =
      ULocalPlayer::GetSubsystem<UEnhancedInputLocalPlayerSubsystem>(GetLocalPlayer()))
  {
    Subsystem->AddMappingContext(RealityCheckContext, 10);   // higher priority
  }

  ShowRealityCheck(MinutesElapsed, GetTotalStaked(), GetSessionNetChange());
}`},
{t:'chk',q:'Why push a mapping context instead of a <code>bRealityCheckActive</code> flag checked in every input handler?',a:'Because you will eventually add a handler and forget the check. A context pushed at higher priority suppresses the table bindings <i>structurally</i> — there is no handler to forget. It is the same instinct as routing all balance changes through one function: make the safe thing the only path rather than a rule everyone has to remember.'},

{t:'build',title:'A HUD that shows the cost',file:'Content/UI/ + HasardPlayerController',x:'<p><b>Phase 1 &mdash; editor. Create the assets first.</b></p> <p><b>1.</b> Content Browser &rarr; folder <code>UI</code> &rarr; right-click &rarr; <b>User Interface &rarr; Widget Blueprint</b> &rarr; parent <b>User Widget</b> &rarr; <code>WBP_HUD</code>.</p> <p><b>2.</b> Open it and add four <b>Text Blocks</b> to the canvas: Balance, Staked, Net, Time. Name them so you can find them in the graph.</p> <p><b>3.</b> Right-click &rarr; <b>Input &rarr; Input Mapping Context</b> &rarr; <code>IMC_RealityCheck</code>. Leave it <b>empty</b> — an empty context at higher priority is what suppresses the table bindings.</p> <p><b>4.</b> Close the editor.</p> <p><b>Phase 2 &mdash; Visual Studio.</b></p> <p><b>5.</b> <code>Hasard.Build.cs</code> &mdash; add <code>"UMG"</code> to the dependency list:</p> <pre><code>PublicDependencyModuleNames.AddRange(new string[] {\n    "Core", "CoreUObject", "Engine", "InputCore", "EnhancedInput", "UMG" });</code></pre> <p>A missing module gives you an <b>unresolved external symbol</b> at link time, not a missing-include error — the header is found, the compiled code is not. If you later use Slate types directly, add <code>"Slate"</code> and <code>"SlateCore"</code> as well; <code>UUserWidget</code> alone does not need them.</p> <p><b>6.</b> <code>HasardPlayerController.h</code> &mdash; the widget class property, the instance, the reality-check context, and the two <code>BlueprintImplementableEvent</code>s from the lecture. Remember <code>#include "Blueprint/UserWidget.h"</code>.</p> <p><b>7.</b> <code>HasardPlayerController.cpp</code> &mdash; create the widget in <code>BeginPlay</code> and add it to the viewport. Then have <code>HandleBankrollChanged</code> call <code>UpdateBankroll</code> instead of only logging.</p> <pre><code>#include "HasardPlayerController.h"\n#include "Blueprint/UserWidget.h"        // CreateWidget, AddToViewport\n#include "EnhancedInputSubsystems.h"     // pushing IMC_RealityCheck\n#include "InputMappingContext.h"\n#include "HasardPlayerState.h"\n#include "HasardBankrollComponent.h"</code></pre> <p><b>8.</b> Route the PlayerState\'s <code>RealityCheck()</code> to the controller: push <code>IMC_RealityCheck</code> at priority 10 and call <code>ShowRealityCheck</code>. The elapsed figure it displays comes from <code>GetSessionElapsedSeconds()</code> — the wall-clock accessor from Module 4. <b>Do not recompute it from <code>GetTimeSeconds()</code> here</b>, or the HUD will quietly disagree with the log.</p> <p><b>Phase 3 &mdash; build.</b></p> <p><b>9.</b> <code>Ctrl+Shift+B</code>. Regenerate project files if the <code>.Build.cs</code> change is not picked up. Reopen.</p> <p><b>Phase 4 &mdash; wire and verify.</b></p> <p><b>10.</b> Create <code>BP_HasardPlayerController</code>, assign <code>WBP_HUD</code> and <code>IMC_RealityCheck</code>, and set it as <b>Player Controller Class</b> in <code>BP_HasardGameMode</code>.</p> <p><b>11.</b> In <code>WBP_HUD</code>, implement the <code>UpdateBankroll</code> event to set the three text blocks, and <code>ShowRealityCheck</code> to display a panel with a dismiss button that pops the context back off.</p> <p><b>12.</b> <b>Verify the thing that matters:</b> stake 100 across several bets, win 40 back, and confirm the HUD reads <b>&minus;60</b>. If it shows a win, the loss is disguised and the module has failed.</p> <p><b>13.</b> Confirm clicking does nothing while the reality check is up.</p> <p><b>14.</b> Commit.</p> <pre><code>git add -A\ngit commit -m "Add HUD showing balance, session stake and net change" -m "Net change is signed and always visible, so a losing session reads as negative rather than as a balance that happens to be smaller. Reality check suppresses table input by pushing a higher-priority mapping context rather than a bool flag, so there is no handler left to forget."</code></pre>'},

{
grp:"Part IV — The Responsible Gaming Layer",
title:"Data-driven payouts and honest odds",
lede:"Move the payout table out of code — and in doing so, make the house edge something the game can state rather than something it hides.",
blocks:[
{t:'h',x:'Why this matters at your scale'},
{t:'p',x:'Every hardcoded number is a rebuild every time you want to try a different one. At two minutes a build, twenty tuning passes is forty minutes of waiting. But here there is a second reason, and it is the more important one.'},

{t:'h',x:'The payout table as a Data Asset'},
{t:'code',x:`USTRUCT(BlueprintType)
struct FHasardPayoutRule
{
  GENERATED_BODY()

  UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Payout")
  EHasardBetType BetType = EHasardBetType::StraightUp;

  UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Payout")
  int32 PayoutRatio = 35;          // pays 35 to 1

  UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Payout")
  int32 CoveredNumbers = 1;        // out of 37

  UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Payout")
  FText DisplayName;               // player-facing - FText, Guide 1 Module 9
};

UCLASS(BlueprintType)
class HASARD_API UHasardPayoutTable : public UPrimaryDataAsset
{
  GENERATED_BODY()

public:
  UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Payout")
  TArray<FHasardPayoutRule> Rules;

  UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Payout")
  int32 PocketCount = 37;
};`},
{t:'chk',q:'Why <code>FText</code> for DisplayName but <code>int32</code> for PayoutRatio?',a:'<code>DisplayName</code> is read by a player, so it must be localisable — Guide 1 Module 9\'s rule, and the mistake that is expensive to undo. In Quebec that is not hypothetical: a French-first product with English-only <code>FString</code> labels is a rewrite. <code>PayoutRatio</code> is never displayed raw; you format it into an <code>FText</code> at the point of display.'},

{t:'h',x:'The two numbers that tell the truth'},
{t:'p',x:'With <code>CoveredNumbers</code> and <code>PocketCount</code> in the data, the game can compute and state the things a casino never volunteers:'},
{t:'code',x:`float UHasardPayoutTable::GetWinProbability(const FHasardPayoutRule& Rule) const
{
  return static_cast<float>(Rule.CoveredNumbers) / static_cast<float>(PocketCount);
}

// True odds against, expressed as "X to 1"
float UHasardPayoutTable::GetTrueOdds(const FHasardPayoutRule& Rule) const
{
  const int32 Losing = PocketCount - Rule.CoveredNumbers;
  return static_cast<float>(Losing) / static_cast<float>(Rule.CoveredNumbers);
}

// The house edge, as a fraction. Identical for every bet on a fair wheel.
float UHasardPayoutTable::GetHouseEdge(const FHasardPayoutRule& Rule) const
{
  const float P = GetWinProbability(Rule);
  return 1.0f - (P * (Rule.PayoutRatio + 1));
}`},
{t:'table',head:['Bet','Pays','Covers','True odds','House edge'],rows:[
['Straight Up','35:1','1 / 37','36 to 1','2.70%'],
['Split','17:1','2 / 37','17.5 to 1','2.70%'],
['Corner','8:1','4 / 37','8.25 to 1','2.70%'],
['Dozen','2:1','12 / 37','2.08 to 1','2.70%'],
['Red','1:1','18 / 37','1.06 to 1','2.70%']]},
{t:'rg',lab:'The most useful thing you can tell a player',x:'<p>Look down that last column. <b>Every bet on the table has an identical house edge.</b> There is no better bet, no clever combination, no system. The straight-up that pays 35:1 and the red that pays 1:1 cost the player exactly the same per dollar staked over time.</p><p>That single fact dissolves the entire premise of gambling "strategy", and almost no commercial product states it — because the illusion of skill is what keeps people at the table. Displaying it is the strongest single thing this project does.</p>'},
{t:'chk',q:'A player asks which bet gives them the best chance. What does your game tell them?',a:'That straight-up wins 1 time in 37 and red wins 18 times in 37 — so red wins far more often — but that <b>both cost 2.70% of everything staked</b>, so neither is "better" in the sense they mean. The honest answer is that the choice changes the shape of the outcomes, not the expected cost. Being able to say that clearly, in a game, is the portfolio piece.'},

{t:'h',x:'Three levels of getting numbers out of code'},
{t:'table',head:['Mechanism','Use for'],rows:[
['<code>EditDefaultsOnly</code> property','One value on one class — <code>SpinDuration</code>, <code>StartingBalance</code>'],
['<b>Data Asset</b>','A bundle of values with many named variants — the payout table'],
['<code>UDeveloperSettings</code>','Genuinely global values that belong in Project Settings']]},

{t:'build',title:'Build the payout table',file:'Source/Hasard/HasardPayoutTable.*',x:'<p><b>Phase 1 &mdash; editor.</b></p> <p><b>1.</b> New C++ Class &rarr; <b>All Classes</b> &rarr; search <code>PrimaryDataAsset</code> &rarr; name it <code>HasardPayoutTable</code>. Close the editor.</p> <p><b>Phase 2 &mdash; Visual Studio.</b></p> <p><b>2.</b> <code>HasardPayoutTable.h</code> &mdash; the <code>FHasardPayoutRule</code> struct, the <code>Rules</code> array, <code>PocketCount</code>, and the three calculation functions from the lecture. Mark them <code>UFUNCTION(BlueprintPure)</code> so the HUD can call them.</p> <p><b>3.</b> <code>HasardPayoutTable.cpp</code> &mdash; implement <code>GetWinProbability</code>, <code>GetTrueOdds</code> and <code>GetHouseEdge</code>. Add a lookup helper:</p> <pre><code>// HasardPayoutTable.h\n#include "Engine/DataAsset.h"   // UPrimaryDataAsset\n#include "HasardTypes.h"        // EHasardBetType\n#include "HasardPayoutTable.generated.h"</code></pre> <pre><code>const FHasardPayoutRule* UHasardPayoutTable::FindRule(EHasardBetType BetType) const\n{\n  return Rules.FindByPredicate(\n      [BetType](const FHasardPayoutRule&amp; R){ return R.BetType == BetType; });\n}</code></pre> <p><b>4.</b> Give <code>AHasardGameMode</code> a <code>TObjectPtr&lt;UHasardPayoutTable&gt; PayoutTable;</code> as <code>EditDefaultsOnly</code>, and have <code>ResolveRound</code> read payouts from it rather than any hardcoded value.</p> <p><b>Phase 3 &mdash; build, then author the data.</b></p> <p><b>5.</b> <code>Ctrl+Shift+B</code>, reopen.</p> <p><b>6.</b> Right-click in the Content Browser &rarr; <b>Miscellaneous &rarr; Data Asset</b> &rarr; pick <code>HasardPayoutTable</code> &rarr; name it <code>DA_EuropeanPayouts</code>. Set <code>PocketCount</code> to <b>37</b>.</p> <p><b>7.</b> Add all thirteen rules. Payout ratio and covered numbers:</p> <pre><code>StraightUp  35:1   covers 1      Split   17:1  covers 2\nStreet      11:1   covers 3      Corner   8:1  covers 4\nSixLine      5:1   covers 6      Column   2:1  covers 12\nDozen        2:1   covers 12     Red      1:1  covers 18\nBlack        1:1   covers 18     Even     1:1  covers 18\nOdd          1:1   covers 18     Low      1:1  covers 18\nHigh         1:1   covers 18</code></pre> <p><b>8.</b> Assign <code>DA_EuropeanPayouts</code> to <code>BP_HasardGameMode</code>.</p> <p><b>9.</b> Add a HUD element showing the <b>true odds and house edge</b> of whichever bet spot the player is looking at, read from the data asset.</p> <p><b>10.</b> <b>Verify the claim.</b> Check every bet reports <b>2.70%</b>. If one differs, that row is wrong — the arithmetic is unforgiving, which is exactly why it is worth doing.</p> <p><b>11.</b> Change a payout ratio in the asset and press Play. The display updates with no compile. That gap is the point of the module.</p> <p><b>12.</b> <b>Optional, and worth ten minutes:</b> duplicate the asset as <code>DA_AmericanPayouts</code> and set <code>PocketCount = 38</code>. Same payouts, one extra pocket. Watch every house edge jump to <b>5.26%</b>. You have now demonstrated in data the decision you made in Module 0.</p> <p><b>13.</b> Commit.</p> <pre><code>git add -A\ngit commit -m "Move payouts to a data asset and compute honest odds" -m "Storing CoveredNumbers alongside PayoutRatio lets the game compute true odds and house edge rather than only paying out. Every bet on a European wheel is 2.70 percent, which is the single most useful thing an honest odds display can tell a player."</code></pre>'},

],

{
grp:"Part V — Proving It and Shipping",
title:"Verifying the wheel, then packaging",
lede:"An honest-odds display is a claim about the distribution. This module makes you prove the claim, then ship the thing.",
blocks:[
{t:'h',x:'The claim you have made'},
{t:'p',x:'Module 12 puts "1 in 37" and "2.70%" on screen. Both are true <b>only if your wheel actually produces a uniform distribution across 37 pockets.</b> If it does not, the display is a false statement dressed up as transparency — which is worse than saying nothing.'},
{t:'rg',lab:'This is why the spin-result decision matters',x:'<p>Your project has an open decision: is the winning pocket <b>predetermined</b> and then animated to, or does it <b>emerge from ball physics</b>?</p><p>Predetermined with <code>FMath::RandRange(0, 36)</code> gives a provably uniform distribution, frame-rate independent, testable in seconds. Physics gives a more interesting simulation, but proving uniformity is genuinely hard — real wheels have bias, and a naive sim will have far more.</p><p>Whichever you choose, this module makes you measure it. A claim you have not measured is a guess.</p>'},

{t:'h',x:'Measuring it'},
{t:'code',x:`// A test function you can call from the console
UFUNCTION(Exec)
void HasardTestDistribution(int32 SpinCount);

void AHasardWheel::HasardTestDistribution(int32 SpinCount)
{
  TArray<int32> Counts;
  Counts.Init(0, PocketCount);       // 37 zeroes

  for (int32 i = 0; i < SpinCount; ++i)
  {
    const int32 Pocket = DetermineWinningPocket();
    Counts[Pocket]++;
  }

  const float Expected = static_cast<float>(SpinCount) / PocketCount;

  for (int32 Pocket = 0; Pocket < PocketCount; ++Pocket)
  {
    const float Deviation = (Counts[Pocket] - Expected) / Expected * 100.0f;
    UE_LOG(LogHasard, Log, TEXT("Pocket %2d: %5d hits (%+.1f%% from expected)"),
           Pocket, Counts[Pocket], Deviation);
  }
}`},
{t:'p',x:'Run <code>HasardTestDistribution 370000</code> from the console. Each pocket should land near 10,000, and deviations should be small and unsigned — scattered either side of zero rather than clustered.'},
{t:'chk',q:'You run 370,000 spins and pocket 0 comes up 14,200 times while the rest average 9,880. What have you learned?',a:'That your wheel is biased toward zero by about 44%, and that every odds figure on your HUD is currently a lie. It also tells you <i>where</i> to look: a bias at exactly one end of the range usually means an off-by-one or an inclusive/exclusive bound error in the random call — <code>RandRange</code> is inclusive at both ends, which people routinely get wrong.'},
{t:'aside',lab:'This is portfolio material',x:'"I displayed the odds, then wrote a test that ran 370,000 spins to confirm the distribution actually matched what I was claiming" is a far stronger thing to say in an interview than any amount of polish. It demonstrates that you understood the display was a <i>claim</i>, not a decoration. For a regulated operator, that instinct is the whole job.'},

{t:'h',x:'Logging and debugging'},

DECLARE_LOG_CATEGORY_EXTERN(LogHasard, Log, All);

// In one .cpp
DEFINE_LOG_CATEGORY(LogHasard);

// Log values, not milestones
UE_LOG(LogHasard, Log, TEXT("Settled pocket %d, %d bets, net %+d"),
       WinningPocket, ActiveBets.Num(), NetChange);`},
{t:'p',x:'Remember the <code>*</code> on <code>FString</code> arguments — the operator overload from Guide 1 Module 10, not a dereference.'},

['<code>stat fps</code>','Frame rate'],

{t:'p',x:'Do this now, while the project is small. The first package always surfaces problems, and surfacing them on a wheel and three bet spots is far cheaper than on a finished game.'},
{t:'list',x:[
'<b>1.</b> <b>Project Settings &rarr; Maps &amp; Modes</b>: set <b>Game Default Map</b>. A packaged build with no default map opens to a black screen — the single most common first-package failure.',
'<b>2.</b> <b>Project Settings &rarr; Packaging</b>: use <b>Development</b> first. It keeps logging and asserts, so a failure is diagnosable. Switch to <b>Shipping</b> once it works.',

'<b>5.</b> Run the .exe. If you can look at the table, place a bet and see the HUD update, you have shipped something.']},
{t:'warn',lab:'Keep build output out of the repository',x:'Packaged builds are hundreds of megabytes. Your <code>.gitignore</code> already excludes <code>Binaries/</code>, <code>Intermediate/</code>, <code>Saved/</code> and <code>DerivedDataCache/</code> — but packaging to a folder inside the repo is a fast way to push a very large accidental commit, and with Git LFS configured, an expensive one.'},

{t:'build',title:'Prove it, then ship it',file:'C:/UE5/Hasard',x:'<p><b>Phase 1 &mdash; Visual Studio: the distribution test.</b></p> <p><b>1.</b> Add an exec function to <code>AHasardWheel</code>:</p> <pre><code>UFUNCTION(Exec)\nvoid HasardTestDistribution(int32 SpinCount);</code></pre> <p><b>2.</b> Implement it as in the lecture, and extract the pocket selection into its own function so the test and real play share one code path:</p> <pre><code>int32 AHasardWheel::DetermineWinningPocket() const\n{\n  return FMath::RandRange(0, PocketCount - 1);\n}</code></pre> <p>If the test calls different code from the game, it proves nothing.</p> <p><b>3.</b> Promote the log category to a shared header so every class uses one: <code>DECLARE_LOG_CATEGORY_EXTERN(LogHasard, Log, All);</code> in <code>HasardTypes.h</code>, <code>DEFINE_LOG_CATEGORY(LogHasard);</code> in exactly one .cpp, and delete the per-file <code>DEFINE_LOG_CATEGORY_STATIC</code> lines.</p> <p><b>Every .cpp that logs then needs <code>#include "HasardTypes.h"</code></b> — the ones that previously defined their own category had no reason to include it. Miss one and it fails to compile on <code>LogHasard</code> being undeclared, which is at least a loud failure. Sweep them in one pass:</p> <pre><code>HasardWheel.cpp  HasardGameMode.cpp  HasardPlayerState.cpp\nHasardPlayerController.cpp  HasardPlayerPawn.cpp\nHasardBettingComponent.cpp  HasardBankrollComponent.cpp\nHasardBetSpot.cpp  HasardInteractionComponent.cpp</code></pre> <p><b>Phase 2 &mdash; build and measure.</b></p> <p><b>4.</b> <code>Ctrl+Shift+B</code>, reopen, Play, and open the console with <b>~</b>. Run:</p> <pre><code>HasardTestDistribution 370000</code></pre> <p><b>5.</b> Each pocket should land near <b>10,000</b>, with deviations small and scattered either side of zero rather than clustered. Save the output into <code>docs/distribution-test.md</code> — that log is evidence, and evidence is what a regulated operator cares about.</p> <p><b>6.</b> <b>If it is not flat, stop and fix it.</b> Your HUD is currently making a claim you cannot support. Bias at exactly one end of the range almost always means an inclusive/exclusive bounds error: <code>RandRange</code> is inclusive at <i>both</i> ends, so <code>RandRange(0, PocketCount)</code> would give 38 outcomes on a 37-pocket wheel.</p> <p><b>Phase 3 &mdash; package.</b></p> <p><b>7.</b> <b>Project Settings &rarr; Maps &amp; Modes</b>: confirm <b>Game Default Map</b> is <code>L_RouletteTest</code>. Unset is the most common reason a packaged build opens to a black screen.</p> <p><b>8.</b> <b>Project Settings &rarr; Packaging</b>: set Build Configuration to <b>Development</b> for the first attempt — it keeps logging and asserts, so a failure is diagnosable.</p> <p><b>9.</b> <b>Platforms &rarr; Windows &rarr; Package Project</b>. Output to <code>C:/Builds/Hasard/</code> — <b>outside the repo</b>.</p> <p><b>10.</b> Watch the Output Log. The real error is usually near the <b>first</b> <code>Error:</code> line, not the last.</p> <p><b>11.</b> Run the .exe. Look at the table, place a bet, spin, watch the HUD.</p> <p><b>12.</b> Fix whatever broke — something will have. Repackage in <b>Shipping</b>.</p> <p><b>13.</b> Commit and tag.</p> <pre><code>git add -A\ngit commit -m "Add spin distribution test; package first playable build"\ngit tag v0.1-playable\ngit push --tags</code></pre> <p>You now have a packaged roulette table with responsible-gaming mechanics and a measurement backing its odds display. That is a portfolio piece.</p>'},
{t:'srcs',x:[['Packaging and Cooking Games','https://dev.epicgames.com/documentation/en-us/unreal-engine/packaging-and-cooking-games-in-unreal-engine'],['Logging in Unreal Engine','https://dev.epicgames.com/documentation/en-us/unreal-engine/logging-in-unreal-engine'],['Asserts','https://dev.epicgames.com/documentation/en-us/unreal-engine/asserts-in-unreal-engine']]}

/* ============================================================
   RENDER ENGINE
   ============================================================ */
const done = new Set();
let cur = 0;
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const TOKENS = new RegExp([
  '(\\/\\*[\\s\\S]*?\\*\\/|\\/\\/[^\\n]*)',
  '("[^"\\n]*")',
  '\\b(UPROPERTY|UFUNCTION|UCLASS|USTRUCT|UENUM|UINTERFACE|UMETA|GENERATED_BODY|UE_LOG|' +
    'DEFINE_LOG_CATEGORY_STATIC|DEFINE_LOG_CATEGORY|DECLARE_LOG_CATEGORY_EXTERN|' +
    'DECLARE_DYNAMIC_MULTICAST_DELEGATE(?:_\\w+)?|DECLARE_DELEGATE(?:_\\w+)?|TEXT|' +
    'check|ensure(?:Always)?)\\b',
  '\\b(class|struct|enum|void|float|double|bool|const|public|private|protected|if|else|' +
    'for|while|return|new|static|virtual|override|template|namespace|true|false|nullptr|' +
    'this|int32|uint8|int16|uint16|string)\\b',
  '\\b([UAFTIEG][A-Z]\\w*)\\b'
].join('|'), 'g');

function hi(code){
  return esc(code).replace(TOKENS, (m, cm, st, mc, kw, ty) => {
    const cls = cm ? 'cm' : st ? 'st' : mc ? 'mc' : kw ? 'kw' : ty ? 'ty' : null;
    return cls ? '<span class="' + cls + '">' + m + '</span>' : m;
  });
}

function buildNav(){
  const nav = document.getElementById('nav');
  let html = '', lastGrp = '';
  COURSE.forEach((m,i)=>{
    if(m.grp !== lastGrp){ html += '<div class="grp">'+m.grp+'</div>'; lastGrp = m.grp; }
    html += '<button data-i="'+i+'"><span class="n">'+String(i).padStart(2,'0')+'</span>'+m.title+'<span class="dot">&#10003;</span></button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
}

function refreshNav(){
  document.querySelectorAll('#nav button').forEach(b=>{
    const i = +b.dataset.i;
    b.classList.toggle('on', i===cur);
    b.classList.toggle('done', done.has(i));
  });
  const pct = Math.round(done.size/COURSE.length*100);
  document.querySelector('#prog>i').style.width = pct+'%';
  document.getElementById('progtxt').textContent =
    done.size+' of '+COURSE.length+' modules complete'+(done.size===COURSE.length?'  — course finished':'');
}

function renderBlocks(bl){
  return bl.map(b=>{
    switch(b.t){
      case 'h': return '<h3>'+b.x+'</h3>';
      case 'p': return '<p>'+b.x+'</p>';
      case 'code': return '<pre><code>'+hi(b.x)+'</code></pre>';
      case 'aside': return '<div class="aside"><div class="lab">'+(b.lab||'Why it works')+'</div>'+(b.x.trim().startsWith('<p')?b.x:'<p>'+b.x+'</p>')+'</div>';
      case 'warn': return '<div class="warn"><div class="lab">'+(b.lab||'Careful')+'</div>'+(b.x.trim().startsWith('<p')?b.x:'<p>'+b.x+'</p>')+'</div>';
      case 'rg': return '<div class="rg"><div class="lab">'+(b.lab||'Responsible gaming')+'</div>'+(b.x.trim().startsWith('<p')?b.x:'<p>'+b.x+'</p>')+'</div>';
      case 'build': return '<div class="build"><div class="lab">&#9654; Build &mdash; '+b.title+'</div>'+
        (b.file?'<div class="file">'+b.file+'</div>':'')+(b.x.trim().startsWith('<p')?b.x:'<p>'+b.x+'</p>')+'</div>';
      case 'srcs': return '<div class="srcs"><div class="lab">Epic documentation for this module</div>'+
        b.x.map(s=>'<a href="'+s[1]+'" target="_blank" rel="noopener">'+s[0]+'</a>').join('')+'</div>';
      case 'list': return '<ul>'+b.x.map(li=>'<li>'+li+'</li>').join('')+'</ul>';
      case 'table': return '<table><thead><tr>'+b.head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+
        b.rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
      case 'chk': return '<div class="chk"><div class="lab">Check yourself</div><p class="q">'+b.q+'</p>'+
        '<button onclick="this.parentNode.classList.add(\'open\')">Reveal answer</button>'+
        '<div class="ans">'+b.a+'</div></div>';
    }
    return '';
  }).join('');
}

function renderQuiz(m, idx){
  const isExam = idx === COURSE.length-1;
  let h = '<div class="quiz"><h4>'+(isExam?'Final Examination':'Module '+idx+' Quiz')+'</h4>'+
    '<p class="hint">'+m.quiz.length+' questions. Pick one answer per question; reasoning appears immediately.</p>';
  m.quiz.forEach((q,qi)=>{
    h += '<div class="qi" data-q="'+qi+'"><p class="qt"><span class="num">Q'+(qi+1)+'</span>'+q.q+'</p>';
    q.opts.forEach((o,oi)=>{ h += '<button class="opt" data-q="'+qi+'" data-o="'+oi+'">'+o+'</button>'; });
    h += '<div class="why" data-why="'+qi+'"></div></div>';
  });
  h += '<div class="score" id="score"></div></div>';
  return h;
}

function go(i){
  cur = i;
  const m = COURSE[i];
  const isExam = i === COURSE.length-1;
  const main = document.getElementById('main');
  main.innerHTML =
    '<div class="kicker">'+(isExam?'Assessment':'Module '+i)+' &middot; '+m.grp+'</div>'+
    '<h2 class="title">'+m.title+'</h2>'+
    '<p class="lede">'+m.lede+'</p>'+
    renderBlocks(m.blocks)+
    renderQuiz(m,i)+
    '<div class="pager">'+
      '<button id="prev" '+(i===0?'disabled':'')+'>&larr; Previous</button>'+
      '<button id="next" class="primary" '+(i===COURSE.length-1?'disabled':'')+'>Next module &rarr;</button>'+
    '</div>';
  window.scrollTo(0,0);

  const answered = {}; let correct = 0;
  main.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick = ()=>{
      const qi = +btn.dataset.q, oi = +btn.dataset.o;
      if(answered[qi]!==undefined) return;
      answered[qi] = oi;
      const q = m.quiz[qi];
      main.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(b=>{
        b.disabled = true;
        if(+b.dataset.o === q.c) b.classList.add('right');
        else if(+b.dataset.o === oi) b.classList.add('wrong');
      });
      if(oi === q.c) correct++;
      const why = main.querySelector('.why[data-why="'+qi+'"]');
      why.innerHTML = (oi===q.c?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q.why;
      why.classList.add('show');
      if(Object.keys(answered).length === m.quiz.length){
        const sc = document.getElementById('score');
        const pct = Math.round(correct/m.quiz.length*100);
        let verdict;
        if(isExam) verdict = correct>=12 ? ' — pass. Go package the build.' : ' — below the pass mark of 12. Revisit the modules named above.';
        else verdict = pct===100 ? ' — clean sweep.' : pct>=60 ? ' — solid. Reread what you missed, then do the Build step.' : ' — reread this module before building.';
        sc.innerHTML = '<b>Score: '+correct+' / '+m.quiz.length+' ('+pct+'%)</b>'+verdict;
        sc.classList.add('show');
        done.add(i); refreshNav();
      }
    };
  });
  const p = document.getElementById('prev'), n = document.getElementById('next');
  if(p) p.onclick = ()=>go(i-1);
  if(n) n.onclick = ()=>go(i+1);
  refreshNav();
}

buildNav(); go(0);
</script>
