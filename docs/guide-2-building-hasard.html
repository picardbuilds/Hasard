<script>
const COURSE = [

/* ---------------------------------------------------------- 0 */
{
grp:"Orientation",
title:"What We Are Building",
lede:"A European roulette table you can bet on, spin, and get paid out from — with responsible-gaming mechanics built into the design rather than bolted on. Packaged by the end.",
blocks:[
{t:'h',x:'The finished thing'},
{t:'p',x:'Fourteen modules, each ending in a green <b>Build</b> block containing real code for <code>C:\\UE5\\Hasard</code>. By Module 13 you will have:'},
{t:'list',x:[
'A wheel that spins and reports which pocket the ball settled in',
'A felt layout whose bet squares you can look at and click',
'A bankroll that tracks stakes and pays out from a data-driven payout table',
'A HUD showing your running spend, the session timer, and the true odds of whatever bet you are about to place',
'A packaged build you can hand to someone']},
{t:'warn',lab:'Type it, do not paste it',x:'You will be tempted to copy the code blocks. Resist, at least early. Typing forces you through every token — which is exactly where the misreadings surface (<code>HASARD_API</code> is not a class, <code>GENERATED_BODY()</code> is not a function, <code>UFUNCTION</code> decorates the one line below it). Compiler errors from typos are cheap and instructive.'},

{t:'h',x:'The governing principle'},
{t:'rg',lab:'Responsible gaming',x:'<p>This project exists to demonstrate responsible-gaming design. The roulette table is the vehicle. Every design decision gets checked against one question: <b>does this respect the player, or exploit them?</b></p><p>When those conflict, respecting the player wins, even at the cost of the thing feeling less exciting. That tradeoff <i>is</i> the portfolio piece — a thrilling roulette table demonstrates nothing, because the industry solved that problem exploitatively decades ago.</p>'},
{t:'p',x:'Concretely, four things get built in rather than added later, and you will meet each one in a specific module:'},
{t:'table',head:['Mechanic','Where it lands'],rows:[
['Session timer with an in-world reality check','Module 4 (timers), Module 11 (UI)'],
['Running spend visible in the play space, not in a menu','Module 10 (bankroll), Module 11 (UI)'],
['True odds and the house edge shown honestly','Module 12 (payout data asset)'],
['No near-miss feedback; a loss reads as a loss','Module 8, and enforced throughout']]},
{t:'chk',q:'Why build the responsible-gaming mechanics in from Module 4 rather than adding them at the end?',a:'Because bolted-on limits are exactly what the industry already does, and it shows. A session timer added in the last week is a dialog box; a session timer designed in from the start shapes the round structure, the UI layout and the pacing. The distinction is visible in the finished thing, and it is the difference between a project that <i>claims</i> a stance and one that <i>demonstrates</i> it.'},

{t:'h',x:'Why European, not American'},
{t:'p',x:'A European wheel has 37 pockets: 0 through 36. An American wheel adds a second zero, making 38. That single pocket changes everything:'},
{t:'table',head:['Wheel','Pockets','House edge'],rows:[
['European (single zero)','37','<b>2.70%</b>'],
['American (double zero)','38','5.26%']]},
{t:'p',x:'A straight-up bet pays <b>35 to 1</b> on both wheels. But the true odds against you are 36 to 1 on a European wheel and 37 to 1 on an American one. The house edge is precisely that gap — and on the American wheel it is nearly double.'},
{t:'rg',lab:'Your first responsible-gaming decision',x:'Choosing the single-zero wheel is not a technical preference, it is an ethical one, and you made it before writing a line of code. Worth saying out loud in a portfolio conversation: the same game, the same code, the same amount of work, and one version takes twice as much money from the player.'},

{t:'h',x:'Project conventions'},
{t:'table',head:['Thing','Convention','Example'],rows:[
['Project prefix','<code>Hasard</code>','<code>AHasardWheel</code>, <code>UHasardBankrollComponent</code>'],
['Class prefix','Standard Unreal (Guide 1, Module 8)','<code>A</code> Actor, <code>U</code> UObject, <code>F</code> struct, <code>E</code> enum'],
['File name','Class name minus the type prefix','<code>AHasardWheel</code> &rarr; <code>HasardWheel.h</code> / <code>.cpp</code>'],
['Module API macro','<code>HASARD_API</code>','<code>class HASARD_API AHasardWheel</code>']]},

{t:'h',x:'The compile loop'},
{t:'table',head:['Method','Use when','Cost'],rows:[
['<b>Live Coding</b> (Ctrl+Alt+F11 in editor)','Changing function <i>bodies</i> in .cpp','Seconds. Editor stays open.'],
['<b>Build in Visual Studio</b>','Changing headers, adding members, adding classes','Tens of seconds to minutes. Close the editor first.'],
['<b>Rebuild</b>','Changing <code>Hasard.Build.cs</code>, or when things get strange','Minutes. Last resort.']]},
{t:'warn',lab:'Live Coding cannot add members',x:'Live Coding patches function bodies. Add a <code>UPROPERTY</code>, change a class declaration, or add a new class, and it will either fail or — worse — appear to succeed and behave oddly. Rule: <b>touched a header? close the editor and build properly.</b> A large share of "Unreal is broken" moments are this.'},
{t:'chk',q:'You added <code>UPROPERTY(EditDefaultsOnly) float SpinDuration;</code> to a header. Live Coding or full build?',a:'<b>Full build, editor closed.</b> You changed the class layout and the reflection data. Live Coding only patches function bodies; a new reflected property needs Unreal Header Tool to regenerate code and the editor to reload the class.'},

{t:'h',x:'Building: the three things that trip everyone'},
{t:'p',x:'<b>1. Build with <code>Ctrl+Shift+B</code>, not the green Play button.</b> The Play arrow is <i>Start Debugging</i> (F5) — it builds <i>and</i> launches the editor with a debugger attached. It works, it is just slower and heavier than you need.'},
{t:'table',head:['Want','Press'],rows:[
['Build only','<code>Ctrl+Shift+B</code>'],
['Build and launch with debugger','<code>F5</code>'],
['Build and launch without debugger','<code>Ctrl+F5</code>']]},
{t:'warn',lab:'2. A class compiled while the editor is open is invisible to it',x:'<p>Unreal loads its class list at startup. Compile a new class while the editor is running and the editor will not know it exists — it will not appear in the Blueprint parent-class picker, and you will conclude the build failed when it succeeded.</p><p>Worse, the editor holds a lock on the binaries, so the build may half-apply or fail outright. <b>Close the editor before building. Reopen after.</b> This is the single most confusing failure in early Unreal work, because nothing anywhere reports an error.</p>'},
{t:'warn',lab:'3. Red squiggles are not compiler errors',x:'<p>Visual Studio\'s IntelliSense does not run Unreal Header Tool, so it cannot resolve <code>GENERATED_BODY()</code>, <code>Super::</code>, or anything else produced by macro expansion. It will report errors on code that compiles perfectly.</p><p><b>Trust the Output window (Sortie) after a build. Ignore the Error List and the squiggles.</b> Chasing IntelliSense in an Unreal project costs days. A successful build ends with something like <code>Build: 1 succeeded, 0 failed</code>.</p>'},

{t:'h',x:'Editor setup, once'},
{t:'p',x:'Four settings that will otherwise waste an hour each. Do them before Module 1.'},
{t:'table',head:['Setting','Where','Why'],rows:[
['<b>Show Engine Content</b>','Content Browser gear, or the gear inside any asset picker','Cube, Sphere, Cylinder live in engine content and are hidden by default. Without this, mesh dropdowns return nothing.'],
['<b>Show C++ Classes</b>','Content Browser gear','Adds a C++ Classes section, so you can right-click a class and create a Blueprint from it directly. Also the fastest check that the editor has loaded your code.'],
['<b>A small test level</b>','File &rarr; New Level &rarr; <b>Basic</b>','See below.'],
['<b>Editor Startup Map</b>','Project Settings &rarr; Maps &amp; Modes','Stops you loading the wrong level on every launch.']]},
{t:'warn',lab:'Do not build on the landscape template',x:'<p>The default open-world map has 138 actors, terrain streaming, sky, and atmospheric fog. None of it serves a table game, and it makes every Play press slow. You will press Play several hundred times before this project is done.</p><p><b>File &rarr; New Level &rarr; Basic</b> — it comes with a floor, Directional Light, Sky Light, sky and a Player Start already. Save it as <code>L_RouletteTest</code> in <code>Content/Maps/</code>. Choose <i>Basic</i> rather than <i>Empty</i>; Empty is a black void you then furnish by hand, and a Directional Light with no Sky Light makes everything look broken.</p>'},
{t:'aside',lab:'Naming, while it is cheap',x:'<code>L_RouletteTest</code>, not <code>Casino</code>. What you are making is a blockout that loads in a second so you can iterate — not the casino floor. Name the scratch level for what it is and keep <code>L_Casino</code> free for when there is something to put on it. Unreal\'s convention is a type prefix plus PascalCase, the same family as <code>BP_Wheel</code>, <code>IA_Look</code>, <code>DA_EuropeanPayouts</code>.<br><br>Renaming assets is cheap — right-click &rarr; <b>Rename</b> and Unreal fixes every reference. But do it <b>in the editor, never in Explorer</b>: renaming a <code>.umap</code> on disk breaks every reference and there is no Core Redirect to save you. Afterwards, right-click the folder &rarr; <b>Fix Up Redirectors in Folder</b> to clean up.'},

{t:'h',x:'Includes are part of the step'},
{t:'p',x:'Every Build step in this course names the <code>#include</code> lines the code needs. If a step shows you code and does not list an include for a type it uses, that is a bug in the guide — not something you are expected to already know.'},
{t:'p',x:'Unreal builds with <b>IWYU</b> (Include What You Use), so <code>CoreMinimal.h</code> is deliberately thin. It gives you <code>FString</code>, <code>TArray</code>, <code>FVector</code> and the macros, and almost nothing else. Everything engine-side is a separate include.'},
{t:'table',head:['You wrote','You need','Otherwise'],rows:[
['<code>GetWorldTimerManager()</code>, <code>SetTimer</code>','<code>TimerManager.h</code>','Incomplete type — the error never says "timer"'],
['<code>GetWorld()-&gt;</code> anything','<code>Engine/World.h</code>','Incomplete type <code>UWorld</code>'],
['<code>CreateDefaultSubobject&lt;UStaticMeshComponent&gt;</code>','<code>Components/StaticMeshComponent.h</code>','Incomplete type'],
['<code>UBoxComponent</code> constructed','<code>Components/BoxComponent.h</code>','Incomplete type'],
['<code>USpringArmComponent</code>, <code>UCameraComponent</code>','<code>GameFramework/SpringArmComponent.h</code>, <code>Camera/CameraComponent.h</code>','Incomplete type'],
['<code>BindAction</code>, <code>AddMappingContext</code>','<code>EnhancedInputComponent.h</code>, <code>EnhancedInputSubsystems.h</code>, <code>InputActionValue.h</code>','Undeclared identifier'],
['<code>CreateWidget</code>, <code>AddToViewport</code>','<code>Blueprint/UserWidget.h</code> <b>and</b> <code>"UMG"</code> in <code>Hasard.Build.cs</code>','Unresolved external symbol at link'],
['<code>LineTraceSingleByChannel</code>, <code>DrawDebugLine</code>','<code>Engine/World.h</code>, <code>DrawDebugHelpers.h</code>','Undeclared identifier'],
['<code>UPrimaryDataAsset</code>','<code>Engine/DataAsset.h</code>','Unknown base class']]},
{t:'warn',lab:'Two different failures, two different fixes',x:'<p>A <b>missing include</b> fails at compile time: incomplete type, undeclared identifier, unknown base class. A <b>missing module</b> in <code>Hasard.Build.cs</code> fails at <b>link</b> time: <i>unresolved external symbol</i>, with the header found and the compiled code absent.</p><p>If the error is an unresolved external and the include is clearly there, stop editing includes and go look at <code>Hasard.Build.cs</code>. This course adds two modules to it: <code>"EnhancedInput"</code> in Module 6 and <code>"UMG"</code> in Module 11.</p>'},
{t:'aside',lab:'Header thin, source fat',x:'The rule that decides where an include goes: if the header only <i>names</i> a type — a pointer, a reference, a return type — forward declare it. If code <i>touches</i> the type, calling a member or constructing it, that translation unit needs the real include. Headers stay light, compile times stay tolerable, and you avoid circular includes almost for free. Guide 1, Module 4.'},
{t:'chk',q:'You get <code>unresolved external symbol</code> on <code>CreateWidget</code>, and <code>Blueprint/UserWidget.h</code> is definitely included. What is wrong?',a:'The include is not the problem — the linker found the declaration and could not find the implementation. <code>"UMG"</code> is missing from <code>PublicDependencyModuleNames</code> in <code>Hasard.Build.cs</code>. Add it, and regenerate project files if Visual Studio does not pick the change up.'},

{t:'h',x:'Batch your work, or you will lose hours'},
{t:'p',x:'Every switch between the editor and Visual Studio costs a close-build-reopen cycle. Doing that four times in one module is several minutes of waiting for no reason. <b>Read the whole Build step before starting</b>, then work in this order:'},
{t:'table',head:['Phase','Do all of it at once'],rows:[
['<b>1. Editor</b>','Create every C++ class the module needs via the wizard. They compile as empty stubs.'],
['<b>2. Close the editor</b>','Non-negotiable — it holds a lock on the binaries.'],
['<b>3. Visual Studio</b>','Write <i>all</i> the code. Every header and every source file for the module.'],
['<b>4. Build once</b>','<code>Ctrl+Shift+B</code>. Check the Output window.'],
['<b>5. Reopen the editor</b>','Blueprints, Project Settings, press Play, verify.']]},
{t:'p',x:'The Build steps in this course are written in that order. Where one says "log this and press Play", the logging belongs in phase 3 with the rest of the C++, not after the editor work.'},

{t:'h',x:'Viewport navigation'},
{t:'p',x:'You will misread geometry constantly until these are muscle memory. A flattened cylinder viewed straight down the Z axis looks identical to an unflattened one.'},
{t:'table',head:['Action','Control'],rows:[
['Look around','Hold <b>right mouse</b>, drag'],
['Fly while looking','Right mouse held + <b>WASD</b>'],
['Orbit the selection','<b>Alt</b> + left-drag'],
['Frame the selection','Select it, press <b>F</b>']]},

{t:'h',x:'What is deliberately excluded'},
{t:'p',x:'No multiplayer, no Gameplay Ability System, no AI, no async asset loading. Those are real and worth learning later. Module 14 lists them with entry points. The constraint here is one interesting mechanic, packaged early — and the interesting mechanic is the wheel, the ball, and the pocket.'}
],
quiz:[
{q:'A straight-up bet pays 35:1. On a European wheel the true odds against you are:',
 opts:['35 to 1','36 to 1','37 to 1','38 to 1'],
 c:1,why:'37 pockets means 36 losing outcomes to 1 winning one. The house edge is precisely the gap between the 36:1 truth and the 35:1 payout.'},
{q:'The house edge on a single-zero wheel is:',
 opts:['2.70%','1.35%','0%','5.26%'],
 c:0,why:'1/37 = 2.70%. The double-zero American wheel is 5.26% — nearly double, for an identical-looking game.'},
{q:'You changed only the body of an existing function in a .cpp. Fastest correct action?',
 opts:['Delete Binaries and Intermediate, then rebuild','Restart the editor','Full rebuild from Visual Studio','Live Coding — it patches function bodies in seconds'],
 c:3,why:'Bodies are exactly what Live Coding handles. Save the full build for header changes.'},
{q:'Why does this course build the responsible-gaming mechanics early rather than last?',
 opts:['They are quicker to implement first','They cannot be added after packaging','Bolted-on limits look bolted-on; designed-in ones shape the round structure and pacing','Unreal requires UI before gameplay'],
 c:2,why:'The difference between claiming a stance and demonstrating one is visible in the finished artifact.'},
{q:'You compiled a new C++ class successfully, but it does not appear in the Blueprint parent-class picker. Why?',
 opts:['The class needs BlueprintType','The editor was open during the build, so it never loaded the new class','The class must be placed in a Public folder','You must restart Windows'],
 c:1,why:'Unreal loads its class list at startup. Nothing reports an error — which is exactly what makes this confusing. Close the editor, rebuild, reopen.'},
{q:'Visual Studio shows red squiggles under <code>GENERATED_BODY()</code> and <code>Super::</code>. This means:',
 opts:['Your includes are wrong','The code will not compile','IntelliSense cannot run Unreal Header Tool, so it misreports macro-generated code','The engine version is mismatched'],
 c:2,why:'Trust the Output window after a build; ignore the Error List. Chasing IntelliSense in an Unreal project costs days.'},
{q:'A mesh dropdown returns no results when you search for "Cylinder". Fix:',

/* ---------------------------------------------------------- 1 */
{
grp:"Part I — Foundations",
title:"Gameplay Classes: building the wheel",
lede:"Every gameplay class is a header/source pair with specific boilerplate in a specific order. Your first one is the centrepiece of the whole project.",
blocks:[
{t:'h',x:'The anatomy'},
{t:'p',x:'Epic\'s reference is blunt about the requirements: the generated header must be included, and <code>GENERATED_BODY()</code> must be at the very beginning of the class body.'},
{t:'code',x:`#pragma once

#include "CoreMinimal.h"
#include "GameFramework/Actor.h"
#include "HasardWheel.generated.h"   // ALWAYS LAST

UCLASS()
class HASARD_API AHasardWheel : public AActor
{
  GENERATED_BODY()      // must be first inside the body

public:
  AHasardWheel();
};`},
{t:'warn',lab:'.generated.h must be the last include',x:'<p>This is not style. Unreal Header Tool generates code that depends on everything above it having been seen already. Put another <code>#include</code> after it and you get errors pointing at the generated file — a file you did not write and cannot fix.</p><p>Memorise the symptom: <b>unexplained errors inside <code>*.generated.h</code> almost always mean an include sits below it.</b></p>'},
{t:'chk',q:'Why <code>AActor</code> for the wheel rather than <code>ACharacter</code>?',a:'The Actor ladder from Guide 1 Module 8. A wheel needs a transform and a place in the world — that is <code>AActor</code>. It is never possessed by a controller and never walks, so <code>APawn</code> and <code>ACharacter</code> would hand it a movement component, a capsule and possession machinery it will never touch. Pick the lowest rung that gives you what you need.'},

{t:'h',x:'UCLASS specifiers worth knowing now'},
{t:'table',head:['Specifier','Effect','When'],rows:[
['<code>Blueprintable</code>','Class can be used as a Blueprint parent','Almost always — it is how you configure meshes and materials without recompiling'],
['<code>BlueprintType</code>','Class usable as a Blueprint <i>variable type</i>','When Blueprint graphs hold references to it'],
['<code>Abstract</code>','Cannot be placed in a level directly','Base classes meaningless on their own'],
['<code>MinimalAPI</code>','Export type info only, not function bodies','Compile-time saving; you met it on interfaces in Guide 1']]},
{t:'aside',lab:'The default is more restrictive than you expect',x:'<code>NotBlueprintable</code> is the default and it is <b>inherited by subclasses</b>. If you cannot create a Blueprint from your C++ class, this is nearly always why. <code>AActor</code> is already Blueprintable, so classes deriving from it inherit that — which is why the wheel will work without you thinking about it, and your first hand-written <code>UObject</code> subclass will not.'},

{t:'h',x:'The constructor and the CDO'},
{t:'p',x:'You met the Class Default Object in Guide 1 as something to read from. Here is the other half: <b>your constructor initialises the CDO</b>, and every instance is cloned from it.'},
{t:'code',x:`AHasardWheel::AHasardWheel()
{
  PrimaryActorTick.bCanEverTick = false;   // the wheel does not need every frame yet

  // A plain SceneComponent as root, with both meshes as SIBLINGS.
  // Components created here become part of the CDO and are cloned
  // into every instance spawned afterwards.
  WheelRoot = CreateDefaultSubobject<USceneComponent>(TEXT("WheelRoot"));
  RootComponent = WheelRoot;

  WheelMesh = CreateDefaultSubobject<UStaticMeshComponent>(TEXT("WheelMesh"));
  WheelMesh->SetupAttachment(WheelRoot);

  BallMesh = CreateDefaultSubobject<UStaticMeshComponent>(TEXT("BallMesh"));
  BallMesh->SetupAttachment(WheelRoot);
}`},
{t:'warn',lab:'Why not attach the ball to the wheel mesh',x:'<p>The obvious shape is <code>RootComponent = WheelMesh</code> with the ball attached to it. It breaks, for two reasons.</p><p><b>Scale propagates to children.</b> The wheel mesh gets scaled to <code>2.0, 2.0, 0.2</code> to flatten it into a disc. A ball attached to it inherits that: its location is multiplied (X 80 becomes 160, outside the rim), and its uniform <code>0.15</code> scale becomes <code>0.3, 0.3, 0.03</code> — a squashed ellipsoid. Non-uniform parent scale distorts every child.</p><p><b>And roulette specifically needs them independent.</b> The ball spins counter to the wheel and settles into a pocket. Parenting it to the wheel\'s rotation is wrong for the mechanic, not just inconvenient.</p><p>A plain <code>USceneComponent</code> root at scale 1 fixes both: siblings inherit nothing from each other, and each rotates independently.</p>'},
{t:'chk',q:'Why does the actor need a root component at all?',a:'Every Actor\'s transform lives on its root. A freshly created Actor has none until you assign one, and anything you attach must hang off something. Using a plain <code>USceneComponent</code> rather than a mesh gives you an attachment point with no geometry and no scale of its own — moving the actor moves everything, and nothing inherits a distortion.'},
{t:'chk',q:'You scale a parent component non-uniformly and its child looks wrong. What is happening?',a:'The child inherits the parent\'s scale, applied to both its own scale <i>and</i> its relative location. A child at local X 80 under a parent scaled 2.0 sits at world X 160. This is the single most common transform surprise in Unreal, and the fix is almost always to make the two components siblings under a neutral root rather than parent and child.'},

{t:'h',x:'The numbers, worked out'},
{t:'p',x:'The engine primitives are all <b>100 units</b> in every dimension, centred on their own origin. Everything else follows from that:'},
{t:'table',head:['','Base size','Scale','Result'],rows:[
['<b>Cylinder</b> (wheel)','100 wide, 100 tall','<code>2.0, 2.0, 0.2</code>','Radius <b>100</b>, spans Z <b>&minus;10 to +10</b>. Top surface at <b>Z = 10</b>.'],
['<b>Sphere</b> (ball)','100 across','<code>0.15</code> uniform','Radius <b>7.5</b>']]},
{t:'p',x:'So for the ball to rest <i>on</i> the surface rather than sunk into it: <code>10 + 7.5</code> = <b>Z 17.5</b>. And X 85 puts it near the rim with 15 units of margin. Final: <b>Location <code>85, 0, 17.5</code>, Scale <code>0.15</code></b>.'},
{t:'aside',lab:'Work the arithmetic once, not by dragging',x:'It is tempting to nudge the gizmo until it looks right. Two minutes with the numbers gives you values you can reason about later — and when the wheel scale changes in Module 4, you will know immediately what the ball position should become. Dragged-until-it-looked-right values are unreadable to future-you.'},

{t:'build',title:'Create the wheel',file:'Source/Hasard/HasardWheel.h + .cpp',x:'<p><b>1.</b> Editor: <b>Tools &rarr; New C++ Class</b> &rarr; parent <b>Actor</b> &rarr; name it <code>HasardWheel</code>. Confirm the module dropdown reads <b>Hasard (Runtime)</b> and the path is <code>Source/Hasard/</code>.</p><p><b>2.</b> In the header, forward declare and add three component pointers:</p><pre><code>class USceneComponent;\nclass UStaticMeshComponent;\n\nprotected:\n  UPROPERTY(VisibleAnywhere, Category = "Hasard|Wheel")\n  TObjectPtr&lt;USceneComponent&gt; WheelRoot;\n\n  UPROPERTY(VisibleAnywhere, Category = "Hasard|Wheel")\n  TObjectPtr&lt;UStaticMeshComponent&gt; WheelMesh;\n\n  UPROPERTY(VisibleAnywhere, Category = "Hasard|Wheel")\n  TObjectPtr&lt;UStaticMeshComponent&gt; BallMesh;</code></pre><p><b>3.</b> In the .cpp, add <code>#include "Components/StaticMeshComponent.h"</code> and the constructor body above.</p><p><b>4.</b> <b>Close the editor.</b> Build with <code>Ctrl+Shift+B</code>. Confirm the Output window says succeeded — ignore any red squiggles.</p><p><b>5.</b> Reopen the editor. In the Content Browser, right-click empty space &rarr; <b>Blueprint Class</b> &rarr; expand <b>All Classes</b> at the bottom &rarr; search <code>HasardWheel</code> &rarr; <b>Select</b>. Name it <code>BP_Wheel</code>.<br><i>If HasardWheel does not appear, the editor was open during your build. Close it, rebuild, reopen.</i></p><p><b>6.</b> Open <code>BP_Wheel</code>. Confirm the Components panel shows <code>WheelRoot</code> as root with <code>WheelMesh</code> and <code>BallMesh</code> as <b>siblings beneath it</b> — that hierarchy is your constructor made visible.</p><p><b>7.</b> Select <b>WheelMesh</b> &rarr; Static Mesh &rarr; <code>Cylinder</code>. Scale <code>2.0, 2.0, 0.2</code>.<br>Select <b>BallMesh</b> &rarr; Static Mesh &rarr; <code>Sphere</code>. Location <code>85, 0, 17.5</code>, Scale <code>0.15</code>.</p><p><b>8.</b> <b>Compile</b>, <b>Save</b>, then drag <code>BP_Wheel</code> into <code>L_RouletteTest</code>. Press <b>F</b> to frame it and <b>Alt+drag</b> to orbit — from directly above, a flat disc and a solid cylinder look identical.</p><p><b>9.</b> Commit. This is your first binary asset commit, exercising the Git LFS setup.</p><pre><code>git add -A\ngit commit -m "Add AHasardWheel with scene root and mesh components"</code></pre>'},
{t:'warn',lab:'It is a grey disc. Stop there.',x:'Nudging primitive placement feels like progress because it is visible and there is always an obvious "better". It is the easiest place in this whole project to lose an hour. The achievement in this module is the C++ — a constructor that builds a component hierarchy, instantiated through a Blueprint. The geometry is a placeholder that real art will replace entirely.'},
{t:'srcs',x:[['Gameplay Classes','https://dev.epicgames.com/documentation/en-us/unreal-engine/gameplay-classes-in-unreal-engine'],['Using the C++ Class Wizard','https://dev.epicgames.com/documentation/en-us/unreal-engine/using-the-cplusplus-class-wizard-in-unreal-engine']]}
],
quiz:[
{q:'Where must <code>HasardWheel.generated.h</code> appear?',
 opts:['Anywhere in the include block','First, before all other includes','Last, after every other include','Inside the class body'],
 c:2,why:'The generated code assumes everything else has been seen. Errors inside the generated file usually mean something was included below it.'},
{q:'The wheel derives from AActor rather than ACharacter because:',
 opts:['Actors compile faster','It needs a transform and a place in the world, and nothing from Pawn or Character','ACharacter cannot hold a static mesh','Only Actors can be placed in a level'],
 c:1,why:'Pick the lowest rung on the ladder that gives you what you need. A movement component and possession machinery would be pure overhead.'},
{q:'What does a class constructor primarily initialise?',
 opts:['The first spawned instance only','The level','The Blueprint asset','The Class Default Object, from which instances are cloned'],
 c:3,why:'The CDO is the template. Anything set in the constructor propagates to every instance created afterwards.'},
{q:'Why is world access unsafe in a constructor?',
 opts:['The CDO is constructed at engine startup, with no level loaded','World access requires a UPROPERTY','GetWorld is deprecated','Constructors run on a background thread'],
 c:0,why:'No world exists yet at CDO construction time. Anything world-dependent belongs in BeginPlay.'},
{q:'Your new UObject-derived class cannot be used as a Blueprint parent. Most likely:',
 opts:['You forgot the HASARD_API macro','It is missing GENERATED_BODY()','The class is Abstract','NotBlueprintable is the default and you did not add Blueprintable'],
 c:3,why:'The default is NotBlueprintable, and it is inherited. Classes derived from AActor appear to "just work" because their parents already opted in.'},
{q:'Why attach both meshes to a plain SceneComponent root instead of making WheelMesh the root?',
 opts:['Scale propagates to children, so flattening the wheel would distort the ball — and roulette needs them to rotate independently anyway','A mesh cannot be a root component','SceneComponents render faster','Blueprint requires a SceneComponent root'],
 c:0,why:'Both reasons matter. Non-uniform parent scale multiplies a child\'s location and distorts its shape, and the ball must spin counter to the wheel.'},
{q:'A child component sits at local X 80 under a parent scaled 2.0. Where is it in world space?',
 opts:['X 80','X 160','X 82','X 40'],
 c:1,why:'Parent scale multiplies a child\'s relative location as well as its scale. The most common transform surprise in Unreal.'}
]
},

/* ---------------------------------------------------------- 2 */
{
grp:"Part I — Foundations",
title:"Reflection: exposing the wheel's numbers",
lede:"Guide 1 told you UPROPERTY makes things visible to the engine. This is what is actually happening, and which specifiers you will really use.",
blocks:[
{t:'h',x:'What Unreal Header Tool does'},
{t:'p',x:'Before the C++ compiler runs, <b>Unreal Header Tool</b> parses your headers looking for the macros. For every <code>UCLASS</code>, <code>USTRUCT</code>, <code>UENUM</code>, <code>UPROPERTY</code> and <code>UFUNCTION</code> it finds, it generates C++ that registers that type and its members with the engine at runtime.'},
{t:'aside',lab:'What reflection actually buys',x:'Standard C++ throws away member names at compile time — you cannot ask an object what its fields are called. Unreal needs exactly that to draw a details panel, serialize a level, replicate a variable, expose a function to Blueprint, or garbage collect. Reflection is the layer that gives C++ the introspection those systems require. Every capability you associate with "the Unreal way" traces back to it.'},
{t:'chk',q:'A member without <code>UPROPERTY()</code> — what does it lose?',a:'Everything reflection provides: details panel visibility, save/load with the level, replication, Blueprint access, and — most dangerously — <b>garbage collection tracking</b>. It becomes a plain C++ variable the engine cannot see, which is how you end up holding a pointer to a collected object.'},

{t:'h',x:'The specifiers you will actually use'},
{t:'table',head:['Specifier','Meaning'],rows:[
['<code>EditAnywhere</code>','Editable on class defaults <i>and</i> per placed instance'],
['<code>EditDefaultsOnly</code>','Editable on class defaults only — not per instance'],
['<code>EditInstanceOnly</code>','Editable per placed instance only'],
['<code>VisibleAnywhere</code>','Shown, never editable. The normal choice for components.'],
['<code>BlueprintReadOnly</code>','Blueprint graphs may read it'],
['<code>BlueprintReadWrite</code>','Blueprint graphs may read and write it'],
['<code>Category = "Name"</code>','Groups it in the details panel']]},
{t:'code',x:`// The wheel's defining constant. 37 pockets = single zero = 2.70% edge.
UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Wheel")
int32 PocketCount = 37;

// How long the spin animation runs before the result is revealed
UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Wheel")
float SpinDuration = 6.0f;

// Component: visible for inspection, never hand-assigned
UPROPERTY(VisibleAnywhere, Category = "Hasard|Wheel")
TObjectPtr<UStaticMeshComponent> WheelMesh;`},
{t:'warn',lab:'Prefer EditDefaultsOnly for rules',x:'<code>EditAnywhere</code> on <code>PocketCount</code> would let someone place a second wheel in a level and quietly set it to 38. You would then have two wheels in the same game with different house edges, and a bug that reproduces in exactly one level. Rules are not per-instance decorations. Reach for <code>EditDefaultsOnly</code> unless per-instance variation is genuinely the point.'},
{t:'chk',q:'Why is <code>int32</code> rather than <code>int</code> used for <code>PocketCount</code>?',a:'Plain <code>int</code> changes size across platforms, and a serialized property whose width varies between platforms is a corruption bug waiting to happen. Unreal supplies explicitly sized types — <code>int32</code> is your default integer. Guide 1, Module 9.'},

{t:'h',x:'UFUNCTION, and the one that bites'},
{t:'warn',lab:'Reference only — do not add these yet',x:'<p>The three functions below are the forms you will meet, shown together so you can compare them. <b>They are not part of this module\'s Build step</b>, which adds two properties and nothing else.</p><p>You could not add them now even if you wanted to: <b>a <code>UFUNCTION</code> declared without a definition fails to link.</b> UHT generates registration code that references the function, so unlike a plain C++ declaration you cannot leave it dangling. They arrive with their bodies in Module 4 (<code>StartSpin</code>) and Module 10 (<code>HandleBallSettled</code>).</p>'},
{t:'code',x:`// Blueprint can call this
UFUNCTION(BlueprintCallable, Category = "Hasard|Wheel")
void StartSpin();

// C++ default, Blueprint may override. Body takes _Implementation.
UFUNCTION(BlueprintNativeEvent, Category = "Hasard|Wheel")
void OnSpinStarted();

// Required for delegate binding, even with no Blueprint exposure
UFUNCTION()
void HandleBallSettled(int32 PocketNumber);`},
{t:'p',x:'That third case is the trap. <code>AddDynamic</code> stores the function\'s <b>name as a string</b> and looks it up through reflection at broadcast time. Without <code>UFUNCTION()</code> the name resolves to nothing, the binding silently fails, and the compiler cannot warn you — because the address you handed it was perfectly valid.'},
{t:'warn',lab:'BlueprintNativeEvent changes the function name you define',x:'The middle example declares <code>OnSpinStarted()</code>, but the body you write in the <code>.cpp</code> must be <code>OnSpinStarted_Implementation()</code>. UHT generates the plain-named version to handle Blueprint dispatch. Define the plain name yourself and you get a duplicate-symbol linker error; define neither and you get an unresolved one. Neither message mentions <code>_Implementation</code>.'},

{t:'build',title:'Expose the wheel\'s rules',file:'Source/Hasard/HasardWheel.h',x:'<p><b>Visual Studio only.</b> No new classes, no editor work until the build.</p> <p><b>1.</b> In <code>HasardWheel.h</code>, under <code>protected:</code>, add:</p> <pre><code>UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Wheel")\nint32 PocketCount = 37;\n\nUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Wheel")\nfloat SpinDuration = 6.0f;</code></pre> <p>Nothing goes in the <code>.cpp</code> — both are declarations with default member initializers, complete in the header.</p> <p><b>2.</b> Save, close the editor, <code>Ctrl+Shift+B</code>. Reopen.</p> <p><b>3.</b> Open <code>BP_Wheel</code>. Both properties should appear under <b>Hasard &rarr; Wheel</b> in the Details panel. The pipe in the category string created that nesting.</p> <p><b>4.</b> <b>The experiment — this is the module.</b> In the header, delete only the <code>UPROPERTY(...)</code> line above <code>PocketCount</code>, leaving <code>int32 PocketCount = 37;</code> intact. Close the editor, rebuild, reopen, and look at <code>BP_Wheel</code> again.</p> <p>The property is gone from the Details panel entirely. The variable still exists and still works from C++ — the engine simply cannot see it. That is what <code>UPROPERTY</code> does, and it is the same registration that grants serialization, replication, Blueprint access and garbage collection tracking.</p> <p><b>5.</b> Put the line back. Rebuild. Confirm it returns.</p> <p><b>6.</b> Commit.</p> <pre><code>git add -A\ngit commit -m "Expose wheel tuning properties on AHasardWheel" -m "PocketCount = 37 (European single-zero wheel, 2.70 percent house edge). SpinDuration = 6.0s. Both EditDefaultsOnly: rules of the game, not per-instance settings."</code></pre>'},
{t:'srcs',x:[['Reflection System','https://dev.epicgames.com/documentation/en-us/unreal-engine/reflection-system-in-unreal-engine'],['Metadata Specifiers','https://dev.epicgames.com/documentation/en-us/unreal-engine/metadata-specifiers-in-unreal-engine']]}
],
quiz:[
{q:'When does Unreal Header Tool run?',
 opts:['When you open the editor','Only when packaging','At runtime, when the class is first spawned','Before the C++ compiler, parsing your headers'],
 c:3,why:'It is a pre-compile step generating the registration code that GENERATED_BODY() inserts.'},
{q:'<code>PocketCount</code> should be EditDefaultsOnly rather than EditAnywhere because:',
 opts:['int32 cannot be edited per instance','EditAnywhere is deprecated','It is a rule, not a decoration — per-instance editing would allow two wheels with different house edges','Blueprint cannot read EditAnywhere properties'],
 c:2,why:'Rules of the game are not per-placement settings. That is a bug reproducing in exactly one level.'},
{q:'You bind a function with AddDynamic and it never fires, but everything compiles. First suspect?',
 opts:['Missing UFUNCTION() on the bound function','Wrong Category string','The delegate is not BlueprintAssignable','You bound in BeginPlay instead of the constructor'],
 c:0,why:'Dynamic delegates resolve by name through reflection. No UFUNCTION means no reflected name to find, and the address you passed was valid so the compiler said nothing.'},
{q:'The most dangerous thing an unmarked member loses is:',
 opts:['Details panel visibility','Garbage collection tracking','Blueprint access','Category grouping'],
 c:1,why:'The others are inconveniences. Losing GC tracking means the object can be collected while you still hold the pointer.'},
{q:'<code>Category = "Hasard|Wheel"</code> produces:',
 opts:['Two separate top-level categories','A compile error','A category literally named Hasard|Wheel','A Wheel group nested inside a Hasard group'],
 c:3,why:'The pipe nests categories in the details panel — worth using once you have more than a handful of properties.'}
]
},

/* ---------------------------------------------------------- 3 */
{
grp:"Part II — The Gameplay Framework",
title:"The Framework Map: who owns the round",
lede:"GameMode, GameState, PlayerController, PlayerState, Pawn. Putting code in the wrong one is the most common structural mistake in first projects — and for a casino game the wrong choice loses the player's money.",
blocks:[
{t:'h',x:'The cast list'},
{t:'table',head:['Class','Owns','Lifetime'],rows:[
['<code>AGameModeBase</code>','The <b>rules</b>. Round flow: betting &rarr; spin &rarr; settle &rarr; payout.','One per level'],
['<code>AGameStateBase</code>','Game-wide state everyone needs. Current round phase, last winning number.','One per level'],
['<code>APlayerController</code>','The player\'s <b>intent</b>. Input, camera, UI ownership.','One per player, persists'],
['<code>APlayerState</code>','Per-player <b>data that outlives the pawn</b>. Bankroll, session totals.','One per player'],
['<code>APawn</code>','The physical presence at the table.','Can be destroyed and respawned']]},
{t:'aside',lab:'The question that resolves most placement decisions',x:'<p><b>"Does this survive the pawn being destroyed?"</b></p><p>If yes, it does not belong on the pawn. In a casino game that question has an obvious answer: the player\'s <b>bankroll</b> must survive absolutely everything. Put it on the pawn and any respawn, level transition or camera swap silently resets the player\'s money.</p>'},
{t:'chk',q:'Where does the bankroll live?',a:'<code>APlayerState</code>. It is per-player data that must outlive the pawn. This is not a style preference — putting money on a destructible actor is how you ship a game that occasionally deletes someone\'s balance.'},
{t:'chk',q:'Where does "a round is 30 seconds of betting, then the spin" live?',a:'<code>AGameModeBase</code>. It is a <i>rule</i>. The GameMode owns round flow, win/lose conditions, and which pawn and controller classes the game uses.'},

{t:'h',x:'Round flow belongs to the GameMode'},
{t:'code',x:`UENUM(BlueprintType)
enum class EHasardRoundPhase : uint8
{
  Betting     UMETA(DisplayName = "Betting"),
  Spinning    UMETA(DisplayName = "Spinning"),
  Settling    UMETA(DisplayName = "Settling")
};`},
{t:'p',x:'The <code>E</code> prefix marks an enum (Guide 1, Module 8). <code>uint8</code> is the required underlying type for a <code>BlueprintType</code> enum. <code>UMETA(DisplayName=...)</code> controls what a designer sees in the editor dropdown.'},
{t:'code',x:`// HasardGameMode.h
UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Round")
float BettingWindowSeconds = 30.0f;

UFUNCTION(BlueprintCallable, Category = "Hasard|Round")
void BeginBettingPhase();

UFUNCTION(BlueprintCallable, Category = "Hasard|Round")
void ResolveRound(int32 WinningPocket);`},

{t:'h',x:'Choosing specifiers: state versus tuning'},
{t:'p',x:'Those two properties sit next to each other and get different specifiers, for a reason worth stating plainly:'},
{t:'table',head:['Property','Specifier','Because'],rows:[
['<code>BettingWindowSeconds</code>','<code>EditDefaultsOnly</code>','A <b>tuning knob</b>. A designer should be able to try 20 seconds without a programmer.'],
['<code>CurrentPhase</code>','<code>VisibleAnywhere</code>','<b>Runtime state.</b> The GameMode decides it while playing. Setting it in the editor would be meaningless.']]},
{t:'p',x:'Both are <code>BlueprintReadOnly</code> rather than <code>BlueprintReadWrite</code>. Blueprint needs to <i>read</i> the phase — to show "betting closes in 12s", or grey out the spin button. But changing the phase has consequences: close betting, start the wheel, settle bets. Those must route through a function, or you get a Blueprint somewhere assigning the phase directly and half the round silently never happening.'},
{t:'aside',lab:'The same shape, three times',x:'This is the encapsulation pattern from Guide 1 Module 4 appearing for the third time. <code>PocketCount</code> is a rule, so it is not per-instance. <code>CurrentPhase</code> has side effects, so it is not writable. In Module 10, <code>Health</code> will be <code>VisibleAnywhere</code> for exactly the same reason. Any value whose change must trigger something cannot be publicly writable — the setter is the only place to hang the event.'},
{t:'chk',q:'You added the enum and both properties, and nothing went into the <code>.cpp</code>. Is that right?',a:'<b>Yes.</b> Both are declarations with default member initializers, which are complete in the header — the same thing you saw in Module 2. The <code>.cpp</code> gets involved when you add <i>behaviour</i> (a function body) or something needing construction logic. The constructor below is this module\'s first <code>.cpp</code> work.'},
{t:'warn',lab:'If you make an exposed property private',x:'<code>protected</code> plus <code>BlueprintReadOnly</code> works as written. But a <b>private</b> property exposed to Blueprint is rejected by Unreal Header Tool unless you add <code>meta=(AllowPrivateAccess="true")</code>. That requirement is part of why <code>protected</code> is the usual choice for exposed members in Unreal code.'},

{t:'h',x:'Writing the constructor yourself'},
{t:'p',x:'The Game Mode Base wizard does <b>not</b> generate a constructor — unlike the Actor wizard, which does. So to set which classes the game uses, you add both halves yourself.'},
{t:'code',x:`// HasardGameMode.h - declare it, above protected:
public:
  AHasardGameMode();`},
{t:'code',x:`// HasardGameMode.cpp
#include "HasardGameMode.h"
#include "HasardPlayerController.h"
#include "HasardPlayerState.h"

AHasardGameMode::AHasardGameMode()
{
  PlayerControllerClass = AHasardPlayerController::StaticClass();
  PlayerStateClass      = AHasardPlayerState::StaticClass();
}`},
{t:'warn',lab:'Those two includes are required',x:'Calling <code>StaticClass()</code> needs the <b>complete definition</b> of each type, not a forward declaration. So they are real <code>#include</code>s — and they go in the <code>.cpp</code>, not the header, because nothing in your header mentions either type. Guide 1 Module 4: forward declare in the header, include in the source. Here there is nothing to forward declare, so the header stays clean entirely.'},
{t:'chk',q:'<code>PlayerControllerClass = AHasardPlayerController::StaticClass();</code> — what is being assigned?',a:'The <b>class</b>, not an instance. <code>StaticClass()</code> returns a <code>UClass*</code> — the same idea as <code>TSubclassOf</code> from Guide 1 Module 9. The GameMode is naming which class to spawn later, not spawning anything now. Which it could not do anyway: constructors run for the CDO with no world (Module 1).'},

{t:'h',x:'Controller and Pawn: possession'},
{t:'p',x:'The controller is a non-physical actor. It takes control of a pawn via <code>Possess()</code> and releases with <code>UnPossess()</code>. That separation is what lets identity survive the body.'},
{t:'code',x:`// From a pawn, reach the controller
if (APlayerController* PC = Cast<APlayerController>(GetController()))
{
}

// From a controller, reach the player state and the money
if (AHasardPlayerState* PS = GetPlayerState<AHasardPlayerState>())
{
}`},
{t:'p',x:'That first cast is Guide 1\'s downcast pattern in its commonest real form — you hold the base <code>AController*</code> and need something only <code>APlayerController</code> declares.'},

{t:'build',title:'Create the framework classes',file:'Source/Hasard/',x:'<p><b>1.</b> New C++ Class &rarr; <b>Game Mode Base</b> &rarr; <code>HasardGameMode</code>.</p><p><b>2.</b> New C++ Class &rarr; <b>Player Controller</b> &rarr; <code>HasardPlayerController</code>.</p><p><b>3.</b> New C++ Class &rarr; <b>Player State</b> &rarr; <code>HasardPlayerState</code>.</p><p><b>4.</b> <b>Header only</b> — in <code>HasardGameMode.h</code>, add the <code>UENUM</code> <i>above</i> the <code>UCLASS</code> and <i>below</i> the <code>.generated.h</code> include, then both properties:</p><pre><code>UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category = "Hasard|Round")\nEHasardRoundPhase CurrentPhase = EHasardRoundPhase::Betting;\n\nUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Round")\nfloat BettingWindowSeconds = 30.0f;</code></pre><p><b>5.</b> <b>Declare the constructor</b> in the header — the Game Mode Base wizard does not create one:</p><pre><code>public:\n  AHasardGameMode();</code></pre><p><b>6.</b> <b>Define it in the .cpp</b>, with both includes. Missing these is the most likely error in this module:</p><pre><code>#include "HasardGameMode.h"\n#include "HasardPlayerController.h"\n#include "HasardPlayerState.h"\n\nAHasardGameMode::AHasardGameMode()\n{\n  PlayerControllerClass = AHasardPlayerController::StaticClass();\n  PlayerStateClass      = AHasardPlayerState::StaticClass();\n}</code></pre><p><b>7.</b> Still in Visual Studio — add the <code>BeginPlay</code> override now, so this module needs only one build. Header, under <code>protected:</code>:</p><pre><code>virtual void BeginPlay() override;</code></pre><p>And in the .cpp, with a log category at the top of the file:</p><pre><code>DEFINE_LOG_CATEGORY_STATIC(LogHasard, Log, All);\n\nvoid AHasardGameMode::BeginPlay()\n{\n  Super::BeginPlay();\n\n  UE_LOG(LogHasard, Warning, TEXT("GameMode BeginPlay - phase: %s, window: %.1fs"),\n         *UEnum::GetValueAsString(CurrentPhase), BettingWindowSeconds);\n}</code></pre><p><code>UEnum::GetValueAsString</code> prints <code>EHasardRoundPhase::Betting</code> rather than <code>0</code> — it works on any UENUM precisely because reflection registered the value names in Module 2. The <code>*</code> in front is the FString operator overload from Guide 1 Module 10, not a dereference.</p><p><b>8.</b> Close the editor. <code>Ctrl+Shift+B</code>. Check the Output window. Reopen.</p><p><b>9.</b> Create <code>BP_HasardGameMode</code> from <code>AHasardGameMode</code>. Set it as <b>Default GameMode</b> in <b>Project Settings &rarr; Maps &amp; Modes</b>, and set both map entries to <code>L_RouletteTest</code> while you are there.</p><p><b>10.</b> Press Play and filter the Output Log to <code>LogHasard</code>. If nothing appears, your GameMode is not the one running — a GameMode you created but never set in Project Settings is a <b>silent no-op that looks exactly like broken code</b>.</p><p><b>11.</b> Commit.</p><pre><code>git commit -m "Add GameMode, PlayerController and PlayerState with round phases"</code></pre>'},

],

/* ---------------------------------------------------------- 4 */
{
grp:"Part II — The Gameplay Framework",
title:"Actor Lifecycle, and the session timer",
lede:"Six moments in an actor's life. Almost every 'why is this null?' bug is code running at the wrong one — and one of them is where your first responsible-gaming mechanic goes.",
blocks:[
{t:'h',x:'The order'},
{t:'table',head:['Stage','When','Put here'],rows:[
['<b>Constructor</b>','CDO at startup, then per instance','Component creation, defaults. <b>No world access.</b>'],
['<b>OnConstruction</b>','After construction, and on every editor edit','Editor-time procedural setup'],
['<b>PostInitializeComponents</b>','Components exist and are registered','Component wiring, delegate binding'],
['<b>BeginPlay</b>','Gameplay starts for this actor','Timers, spawning, world queries, input contexts'],
['<b>Tick</b>','Every frame','Only what genuinely must run per frame'],
['<b>EndPlay</b> / <b>Destroyed</b>','Removal or level end','Cleanup, unbinding if needed']]},
{t:'aside',lab:'The rule that resolves most of it',x:'<b>Constructor = "what am I made of". BeginPlay = "the world exists, go".</b> If the code needs anything outside the actor itself — the world, other actors, the player controller, a timer — it cannot be in the constructor, because the constructor also runs for the Class Default Object at engine startup when none of those exist.'},
{t:'chk',q:'Why is <code>PostInitializeComponents</code> preferred over the constructor for binding component delegates?',a:'Two reasons. The components exist and are registered by then, whereas in the constructor they are only just being created. And — the Guide 1 reason — constructor bindings get <b>serialized into Blueprint assets</b> and keep firing even after you remove the binding from C++.'},

{t:'h',x:'Timers'},
{t:'code',x:`// HasardPlayerState.h
FTimerHandle SessionTimerHandle;    // member, so you can cancel it

// HasardPlayerState.cpp
#include "Engine/World.h"
#include "TimerManager.h"           // GetTimerManager() is inline - needs the full type

void AHasardPlayerState::BeginPlay()
{
  Super::BeginPlay();

  SessionStartRealTime = FPlatformTime::Seconds();   // wall clock, not world time

  GetWorldTimerManager().SetTimer(
      SessionTimerHandle, this, &AHasardPlayerState::RealityCheck,
      RealityCheckIntervalSeconds,   // e.g. 300.0f
      true);                         // loop
}`},
{t:'p',x:'Hold the <code>FTimerHandle</code> as a member — you need it to cancel. And note <code>&amp;AHasardPlayerState::RealityCheck</code>: the address operator from Guide 1, identical in shape to input binding and delegate binding.'},
{t:'warn',lab:'The include that bites',x:'<p><code>CoreMinimal.h</code> does not pull in <code>TimerManager.h</code>. <code>UWorld::GetTimerManager()</code> is declared <b>inline</b>, so calling it needs the complete <code>FTimerManager</code> type, not a forward declaration. Without the include you get an incomplete-type error that never mentions timers.</p><p><code>GetWorldTimerManager()</code> is the shorter form — <code>AActor</code> provides it, and it needs the same include.</p>'},

{t:'h',x:'Which clock'},
{t:'p',x:'Unreal gives you three sources of elapsed time, and they disagree the moment anything unusual happens:'},
{t:'table',head:['Source','Pauses?','Dilates?','Use for'],rows:[
['<code>GetTimeSeconds()</code>','Yes','Yes','Gameplay durations — a spin, a cooldown'],
['<code>GetRealTimeSeconds()</code>','No','No','Elapsed since the level began, ignoring pause'],
['<code>FPlatformTime::Seconds()</code>','No','No','Wall clock, independent of any world']]},
{t:'aside',lab:'Gameplay time and honest time are different questions',x:'A six-second spin should slow down if the game slows down — it is a gameplay duration, so <code>GetTimeSeconds()</code> is right for it. How long the player has been sitting there is not a gameplay duration. It is a fact about a person, and no in-game state may alter it.'},
{t:'warn',lab:'Store it in a double, and Epic will tell you why',x:'<p><code>FPlatformTime::Seconds()</code> returns a <code>double</code>. Storing it in a <code>float</code> compiles silently and breaks the clock.</p><pre><code>double FWindowsPlatformTime::Seconds()\n{\n  LARGE_INTEGER Cycles;\n  QueryPerformanceCounter(&amp;Cycles);\n  // add big number to make bugs apparent where return value is being passed to float\n  return Cycles.QuadPart * GetSecondsPerCycle() + 16777216.0;\n}</code></pre><p>That comment is Epic\'s, and the constant is 2<sup>24</sup>. A <code>float</code> carries 24 bits of mantissa, so at that magnitude the gap between representable values is exactly <b>one second</b> — your session length quantises to whole seconds straight away and gets coarser as the number grows. The engine adds the offset deliberately so the mistake shows up immediately instead of six months later.</p><p>The <code>static_cast&lt;float&gt;</code> on the way out is fine: by then you are holding a small elapsed value, not a huge absolute stamp.</p>'},
{t:'chk',q:'Why is <code>GetTimeSeconds()</code> the wrong clock for the session timer, but the right one for the spin?',a:'World time stops on pause and scales with dilation. That is exactly what you want for a spin — it is part of the simulation. For a session length it means a player who pauses for ten minutes is told they have been playing ten minutes less than they have, and the reality check is pushed back by the same amount. The number is not the simulation, it is a claim about the player.'},

{t:'rg',lab:'Responsible gaming — the reality check',x:'<p>A <b>reality check</b> is a periodic, unavoidable interruption telling the player how long they have been playing and how much they have staked. It is standard in regulated markets and it is deliberately inconvenient.</p><p>Three design choices separate a real one from a decorative one: it must <b>interrupt</b> rather than appear in a corner, dismissing it must require a deliberate action rather than a click anywhere, and <b>the number it reports must be true</b>. A clock that quietly stops counting is the same failure as a hidden spend total — it understates the cost without ever stating anything false, which is precisely the shape of omission this project refuses. The timer you start here is the mechanism; Module 11 builds what it shows.</p>'},
{t:'chk',q:'Why does the session timer start in <code>BeginPlay</code> rather than the constructor?',a:'It needs a world — <code>GetWorld()->GetTimerManager()</code> would be operating on nothing at CDO construction time. More broadly: a session begins when play begins, and the constructor runs at engine startup for a template object that is not playing anything.'},

{t:'h',x:'Tick is not free'},
{t:'code',x:`AHasardWheel::AHasardWheel()
{
  PrimaryActorTick.bCanEverTick = true;   // the wheel does need to spin
  PrimaryActorTick.TickInterval = 0.0f;   // every frame, while spinning
}`},
{t:'warn',lab:'Prefer events and timers over Tick',x:'<p>The wheel genuinely needs Tick while it is spinning — smooth rotation is per-frame work. Almost nothing else in this project does. Checking "has the ball stopped yet" every frame is 60 checks per second to detect one event; a delegate fires once, when it happens.</p><p>Before writing anything in <code>Tick</code>, ask whether a delegate, an overlap event, or a timer would do.</p>'},

{t:'build',title:'Observe the lifecycle, then start the session clock',file:'HasardWheel + HasardPlayerState',x:'<p><b>Phase 1 &mdash; Visual Studio.</b> No new classes needed; both already exist.</p> <p><b>1.</b> <code>HasardWheel.h</code>, under <code>protected:</code>, add two more overrides beside the existing <code>BeginPlay</code>:</p> <pre><code>virtual void PostInitializeComponents() override;\nvirtual void EndPlay(const EEndPlayReason::Type EndPlayReason) override;</code></pre> <p><b>2.</b> <code>HasardWheel.cpp</code> &mdash; add a log category at the top, then the three bodies. <b>Call <code>Super::</code> first in every one.</b></p> <pre><code>DEFINE_LOG_CATEGORY_STATIC(LogHasard, Log, All);\n\nvoid AHasardWheel::PostInitializeComponents()\n{\n  Super::PostInitializeComponents();\n  UE_LOG(LogHasard, Warning, TEXT("Wheel: PostInitializeComponents"));\n}\n\nvoid AHasardWheel::BeginPlay()\n{\n  Super::BeginPlay();\n  UE_LOG(LogHasard, Warning, TEXT("Wheel: BeginPlay"));\n}\n\nvoid AHasardWheel::EndPlay(const EEndPlayReason::Type EndPlayReason)\n{\n  UE_LOG(LogHasard, Warning, TEXT("Wheel: EndPlay"));\n  Super::EndPlay(EndPlayReason);\n}</code></pre> <p><b>3.</b> Add one line to the constructor so you can see it fire:</p> <pre><code>UE_LOG(LogHasard, Warning, TEXT("Wheel: Constructor"));</code></pre> <p><b>4.</b> <code>HasardPlayerState.h</code> &mdash; add the timer members and functions:</p> <pre><code>public:\n  /** Real seconds elapsed this session. Unaffected by pause or time dilation. */\n  UFUNCTION(BlueprintPure, Category = "Hasard|Session")\n  float GetSessionElapsedSeconds() const;\n\nprotected:\n  virtual void BeginPlay() override;\n  virtual void EndPlay(const EEndPlayReason::Type EndPlayReason) override;\n\n  UPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Session")\n  float RealityCheckIntervalSeconds = 15.0f;\n\n  /** Wall clock at session start. Deliberately not world time - see "Which clock" above. */\n  double SessionStartRealTime = 0.0;\n\n  FTimerHandle SessionTimerHandle;\n\n  void RealityCheck();</code></pre> <p>Note <code>SessionTimerHandle</code> has no <code>UPROPERTY</code> — <code>FTimerHandle</code> is a plain struct, not a UObject, so there is nothing for the garbage collector to track. <code>SessionStartRealTime</code> has none either: it is bookkeeping, and the thing Blueprint should ask for is the elapsed value from <code>GetSessionElapsedSeconds()</code>, not the raw start stamp.</p> <p><b>5.</b> <code>HasardPlayerState.cpp</code>:</p> <pre><code>#include "Engine/World.h"\n#include "TimerManager.h"\n\nDEFINE_LOG_CATEGORY_STATIC(LogHasard, Log, All);\n\nvoid AHasardPlayerState::BeginPlay()\n{\n  Super::BeginPlay();\n\n  SessionStartRealTime = FPlatformTime::Seconds();\n\n  GetWorldTimerManager().SetTimer(\n      SessionTimerHandle, this, &amp;AHasardPlayerState::RealityCheck,\n      RealityCheckIntervalSeconds,\n      true);   // loop\n}\n\nvoid AHasardPlayerState::EndPlay(const EEndPlayReason::Type EndPlayReason)\n{\n  GetWorldTimerManager().ClearTimer(SessionTimerHandle);\n  Super::EndPlay(EndPlayReason);\n}\n\nfloat AHasardPlayerState::GetSessionElapsedSeconds() const\n{\n  return static_cast&lt;float&gt;(FPlatformTime::Seconds() - SessionStartRealTime);\n}\n\nvoid AHasardPlayerState::RealityCheck()\n{\n  UE_LOG(LogHasard, Warning, TEXT("REALITY CHECK - %.0f seconds this session"),\n         GetSessionElapsedSeconds());\n}</code></pre> <p>The handle exists so you can cancel — <code>EndPlay</code> is where you use it. Clearing before <code>Super::</code> follows the teardown rule: outward on the way up, inward on the way down.</p> <p><b>Phase 2 &mdash; build.</b></p> <p><b>6.</b> Save all, close the editor, <code>Ctrl+Shift+B</code>, reopen.</p> <p><b>Phase 3 &mdash; observe.</b></p> <p><b>7.</b> Open the Output Log and filter to <code>LogHasard</code>. <b>The constructor line is already there, before you pressed Play.</b> That is the Class Default Object, constructed at editor startup. It is the concrete reason world access in a constructor is illegal.</p> <p><b>8.</b> Press Play. Watch the order: <code>Constructor</code> (for the instance) &rarr; <code>PostInitializeComponents</code> &rarr; <code>BeginPlay</code>. Wait 15 seconds for the reality check. Press Stop and watch <code>EndPlay</code>.</p> <p><b>9.</b> Prove the clock. Press Play, wait for one reality check, then hit <b>Pause</b> in the editor toolbar for about 20 seconds and resume. The next reported figure includes the paused time. Swap <code>FPlatformTime::Seconds()</code> for <code>GetWorld()-&gt;GetTimeSeconds()</code>, rebuild, repeat, and watch the same 20 seconds vanish. That gap is the bug this module exists to avoid.</p> <p><b>10.</b> Commit.</p> <pre><code>git add -A\ngit commit -m "Log actor lifecycle; start session timer on PlayerState" -m "Session clock uses wall time, not world time: pause and dilation must not understate how long the player has been playing."</code></pre>'},
{t:'srcs',x:[['Gameplay Timers','https://dev.epicgames.com/documentation/en-us/unreal-engine/gameplay-timers-in-unreal-engine'],['Using Timers','https://dev.epicgames.com/documentation/en-us/unreal-engine/using-timers-in-unreal-engine']]}
],

 opts:['EndPlay','OnConstruction','The constructor','BeginPlay'],

{q:'Why does the constructor log appear before you press Play?',
 opts:['The editor pre-spawns one instance','The Class Default Object is constructed at class load time','Live Coding runs it early','It is a logging bug'],

{q:'The FTimerHandle is stored as a member because:',

{q:'What makes a reality check meaningful rather than decorative?',
 opts:['Bright colours','It logs to file','It interrupts, and dismissing it requires a deliberate action','It appears only after a big loss'],
 c:2,why:'A corner notification that clears on any click is a compliance checkbox. Interruption plus deliberate dismissal is the mechanic actually doing something.'},
{q:'The session clock uses FPlatformTime::Seconds() rather than GetTimeSeconds() because:',

{q:'Why does HasardPlayerState.cpp need #include "TimerManager.h"?',

/* ---------------------------------------------------------- 5 */
{
grp:"Part II — The Gameplay Framework",
title:"A camera at the table",
lede:"No walking character, no jump. A pawn that sits at the table and looks around it — which is both the right design and considerably less code.",
blocks:[
{t:'h',x:'Why a Pawn, not a Character'},
{t:'p',x:'The Actor ladder again. <code>ACharacter</code> gives you a capsule, a skeletal mesh and a <code>CharacterMovementComponent</code> tuned for walking, jumping and crouching. A player standing at a roulette table does none of those things.'},
{t:'table',head:['Base','Gives you','Right for'],rows:[
['<code>AActor</code>','Transform, spawn, tick','The wheel, the table, bet spots'],
['<code>APawn</code>','All of the above, plus possession and input','<b>The player at the table</b>'],
['<code>ACharacter</code>','All of the above, plus capsule, mesh, walking','A player walking a casino floor — later, if VR']]},
{t:'aside',lab:'A decision you can defend',x:'"I used a Pawn rather than a Character because the player never locomotes" is exactly the kind of small, correct scoping choice that reads well in a portfolio review. Reaching for <code>ACharacter</code> by reflex — because every tutorial does — and carrying an unused movement component is the opposite signal.'},

{t:'h',x:'The camera rig'},
{t:'code',x:`// HasardPlayerPawn.h
class USpringArmComponent;    // forward declare - Guide 1, Module 4
class UCameraComponent;

UCLASS()
class HASARD_API AHasardPlayerPawn : public APawn
{
  GENERATED_BODY()

public:
  AHasardPlayerPawn();

protected:
  UPROPERTY(VisibleAnywhere, Category = "Hasard|Camera")
  TObjectPtr<USceneComponent> ViewRoot;

  UPROPERTY(VisibleAnywhere, Category = "Hasard|Camera")
  TObjectPtr<USpringArmComponent> CameraBoom;

  UPROPERTY(VisibleAnywhere, Category = "Hasard|Camera")
  TObjectPtr<UCameraComponent> TableCamera;
};`},
{t:'code',x:`// HasardPlayerPawn.cpp - the real includes go HERE
#include "HasardPlayerPawn.h"
#include "GameFramework/SpringArmComponent.h"
#include "Camera/CameraComponent.h"

AHasardPlayerPawn::AHasardPlayerPawn()
{
  PrimaryActorTick.bCanEverTick = false;

  ViewRoot = CreateDefaultSubobject<USceneComponent>(TEXT("ViewRoot"));
  RootComponent = ViewRoot;

  CameraBoom = CreateDefaultSubobject<USpringArmComponent>(TEXT("CameraBoom"));
  CameraBoom->SetupAttachment(ViewRoot);
  CameraBoom->TargetArmLength = 250.0f;
  CameraBoom->bUsePawnControlRotation = true;   // the arm follows the mouse
  CameraBoom->bDoCollisionTest = false;         // no walls to push through

  TableCamera = CreateDefaultSubobject<UCameraComponent>(TEXT("TableCamera"));
  TableCamera->SetupAttachment(CameraBoom, USpringArmComponent::SocketName);
  TableCamera->bUsePawnControlRotation = false; // the camera rides the arm
}`},
{t:'aside',lab:'Forward declare in the header, include in the source',x:'The header only declares <i>pointers</i>, so a forward declaration suffices. The .cpp calls <code>SetupAttachment</code> and sets <code>TargetArmLength</code>, so it needs the full definitions. Guide 1 Module 4 in production form — and it is why UE codebases compile as fast as they do.'},
{t:'chk',q:'Why <code>bUsePawnControlRotation</code> true on the boom but false on the camera?',a:'Only one thing should respond to mouse input, or you get double rotation. The <b>boom</b> rotates with the controller, swinging around the view root. The <b>camera</b> is rigidly attached to the end of the arm and inherits that rotation. Setting it on both makes the camera rotate relative to an already-rotating arm.'},
{t:'chk',q:'Why <code>bDoCollisionTest = false</code> here, when a third-person game would leave it on?',a:'Collision testing exists to pull the camera in when a wall comes between it and the character. At a fixed table there is nothing to collide with, and leaving it on means the camera can jitter against the table mesh itself. Turning it off is the correct call <i>for this situation</i> — which is the point: the defaults are tuned for walking games.'},

{t:'build',title:'Put a camera at the table',file:'Source/Hasard/HasardPlayerPawn.*',x:'<p><b>Phase 1 &mdash; editor.</b></p> <p><b>1.</b> <b>Tools &rarr; New C++ Class</b> &rarr; parent <b>Pawn</b> &rarr; name it <code>HasardPlayerPawn</code>. Confirm module <b>Hasard (Runtime)</b>. Then close the editor.</p> <p><b>Phase 2 &mdash; Visual Studio.</b></p> <p><b>2.</b> <code>HasardPlayerPawn.h</code> — forward declarations above <code>UCLASS()</code>, properties under <code>protected:</code>:</p> <pre><code>class USpringArmComponent;\nclass UCameraComponent;</code></pre> <pre><code>UPROPERTY(VisibleAnywhere, Category = "Hasard|Camera")\nTObjectPtr&lt;USceneComponent&gt; ViewRoot;\n\nUPROPERTY(VisibleAnywhere, Category = "Hasard|Camera")\nTObjectPtr&lt;USpringArmComponent&gt; CameraBoom;\n\nUPROPERTY(VisibleAnywhere, Category = "Hasard|Camera")\nTObjectPtr&lt;UCameraComponent&gt; TableCamera;</code></pre> <p><b>3.</b> <code>HasardPlayerPawn.cpp</code> — includes first, then the constructor body from the lecture above.</p> <pre><code>#include "HasardPlayerPawn.h"\n#include "GameFramework/SpringArmComponent.h"\n#include "Camera/CameraComponent.h"</code></pre> <p>The header forward declares both types because it only names them. The <code>.cpp</code> calls <code>SetupAttachment</code> and sets <code>TargetArmLength</code>, so it needs the complete definitions.</p> <p><b>Phase 3 &mdash; build.</b></p> <p><b>4.</b> <code>Ctrl+Shift+B</code>. Check the Output window. Reopen the editor.</p> <p><b>Phase 4 &mdash; wire it up.</b></p> <p><b>5.</b> Create <code>BP_PlayerPawn</code> from <code>AHasardPlayerPawn</code>.</p> <p><b>6.</b> Open <code>BP_HasardGameMode</code> &rarr; set <b>Default Pawn Class</b> to <code>BP_PlayerPawn</code>. Compile, Save.</p> <p><b>7.</b> In <code>L_RouletteTest</code>, place a <b>Player Start</b> about 250 units from <code>BP_Wheel</code>, rotated to face it. Add it from the toolbar <b>Add</b> button &rarr; <b>Basic &rarr; Player Start</b>.</p> <p><b>8.</b> Press Play. You should be looking at the wheel. Mouse does nothing yet — input is Module 6.</p> <p><b>9.</b> Commit.</p> <pre><code>git add -A\ngit commit -m "Add AHasardPlayerPawn with spring arm and table camera" -m "Pawn rather than Character: the player never locomotes, so the capsule and movement component would be unused overhead."</code></pre>'},
{t:'srcs',x:[['Parrot: Pawn, Player Controller and Character Movement','https://dev.epicgames.com/documentation/en-us/unreal-engine/parrot-pawn-player-controller-and-character-movement-in-unreal-engine'],['Components','https://dev.epicgames.com/documentation/en-us/unreal-engine/components-in-unreal-engine']]}
],

{
grp:"Part III — Playing the Table",
title:"Enhanced Input",
lede:"Look around the table, click to place a bet, press a key to spin. UE5's input system — and a correction to Guide 1.",
blocks:[
{t:'warn',lab:'Correction to Guide 1',x:'<p>Guide 1 Module 3 showed <code>PlayerInputComponent-&gt;BindAxis("MoveForward", this, &amp;ARogueCharacter::MoveForward);</code>, taken from Looman\'s guide.</p><p>That is the <b>legacy input system</b>. It still functions in 5.8 but is deprecated and is not what templates or Epic\'s docs use. The <i>lesson</i> — the address operator, passing a function to be called later — is unchanged. Only the API moved. Enhanced Input uses the identical <code>&amp;Class::Function</code> shape.</p>'},

{t:'h',x:'The three pieces'},
{t:'table',head:['Asset / type','Role'],rows:[
['<b>Input Action</b> (<code>UInputAction</code>)','An abstract verb: "Look", "Place Bet", "Spin". Knows its value type, not its key.'],
['<b>Input Mapping Context</b> (<code>UInputMappingContext</code>)','Maps physical keys to actions. Layered and swappable at runtime.'],
['<b>Enhanced Input Component</b>','Binds actions to your C++ functions.']]},
{t:'rg',lab:'Where contexts earn their keep here',x:'Mapping contexts can be pushed and popped with priorities. That is exactly how the reality-check interruption in Module 11 will work: push a context that suppresses betting input while the check is on screen, pop it when dismissed. Without contexts you would be scattering <code>if (bRealityCheckActive) return;</code> through every input handler — and eventually missing one.'},

{t:'h',x:'Wiring it up'},
{t:'p',x:'First the module dependency — Guide 1 Module 11 arriving in practice:'},
{t:'code',x:`// Source/Hasard/Hasard.Build.cs
PublicDependencyModuleNames.AddRange(new string[] {
    "Core", "CoreUObject", "Engine", "InputCore", "EnhancedInput" });`},
{t:'warn',lab:'Editing Hasard.Build.cs requires a full rebuild',x:'Not Live Coding, not an incremental build — close the editor and rebuild. If Visual Studio does not notice, regenerate project files.'},
{t:'code',x:`// HasardPlayerPawn.h
class UInputMappingContext;
class UInputAction;
struct FInputActionValue;

protected:
  UPROPERTY(EditDefaultsOnly, Category = "Hasard|Input")
  TObjectPtr<UInputMappingContext> TableMappingContext;

  UPROPERTY(EditDefaultsOnly, Category = "Hasard|Input")
  TObjectPtr<UInputAction> LookAction;

  UPROPERTY(EditDefaultsOnly, Category = "Hasard|Input")
  TObjectPtr<UInputAction> PlaceBetAction;

  UPROPERTY(EditDefaultsOnly, Category = "Hasard|Input")
  TObjectPtr<UInputAction> SpinAction;

  void Look(const FInputActionValue& Value);
  void PlaceBet();
  void RequestSpin();

  virtual void SetupPlayerInputComponent(UInputComponent* PlayerInputComponent) override;`},
{t:'code',x:`// HasardPlayerPawn.cpp
#include "EnhancedInputComponent.h"
#include "EnhancedInputSubsystems.h"
#include "InputActionValue.h"

void AHasardPlayerPawn::BeginPlay()
{
  Super::BeginPlay();

  if (APlayerController* PC = Cast<APlayerController>(Controller))
  {
    if (UEnhancedInputLocalPlayerSubsystem* Subsystem =
        ULocalPlayer::GetSubsystem<UEnhancedInputLocalPlayerSubsystem>(PC->GetLocalPlayer()))
    {
      Subsystem->AddMappingContext(TableMappingContext, 0);   // 0 = priority
    }
  }
}

void AHasardPlayerPawn::SetupPlayerInputComponent(UInputComponent* PlayerInputComponent)
{
  Super::SetupPlayerInputComponent(PlayerInputComponent);

  if (UEnhancedInputComponent* EIC = Cast<UEnhancedInputComponent>(PlayerInputComponent))
  {
    EIC->BindAction(LookAction,     ETriggerEvent::Triggered, this, &AHasardPlayerPawn::Look);
    EIC->BindAction(PlaceBetAction, ETriggerEvent::Started,   this, &AHasardPlayerPawn::PlaceBet);
    EIC->BindAction(SpinAction,     ETriggerEvent::Started,   this, &AHasardPlayerPawn::RequestSpin);
  }
}

void AHasardPlayerPawn::Look(const FInputActionValue& Value)
{
  const FVector2D Input = Value.Get<FVector2D>();
  AddControllerYawInput(Input.X);
  AddControllerPitchInput(Input.Y);
}`},

{t:'h',x:'Trigger events'},
{t:'table',head:['Event','Fires'],rows:[
['<code>Started</code>','Once, when trigger evaluation begins — the first press'],
['<code>Ongoing</code>','While evaluation continues but has not succeeded — a hold in progress'],
['<code>Triggered</code>','All conditions met. With no explicit trigger configured this fires <b>every tick</b> the input is active.'],
['<code>Completed</code>','Once, when evaluation finishes'],
['<code>Canceled</code>','The trigger aborted — a hold released before its threshold']]},
{t:'chk',q:'Why is Look bound to <code>Triggered</code> but Place Bet to <code>Started</code>?',a:'Look is a <b>continuous state</b> — you want it applied every frame the mouse is moving. Placing a bet is an <b>event</b> — it should happen once per click, not sixty times a second while the button is down. Binding Place Bet to <code>Triggered</code> would drain the player\'s bankroll in under a second, which is a very literal demonstration of why this distinction matters here.'},

{t:'build',title:'Look, click, spin',file:'Content/Input/ + HasardPlayerPawn',x:'<p><b>Phase 1 &mdash; editor. Create the input assets first, so they exist to assign later.</b></p> <p><b>1.</b> Content Browser &rarr; new folder <code>Input</code>.</p> <p><b>2.</b> Right-click &rarr; <b>Input &rarr; Input Action</b>, three times:</p> <ul><li><code>IA_Look</code> &mdash; Value Type <b>Axis2D (Vector2D)</b></li><li><code>IA_PlaceBet</code> &mdash; Value Type <b>Digital (bool)</b></li><li><code>IA_Spin</code> &mdash; Value Type <b>Digital (bool)</b></li></ul> <p><b>3.</b> Right-click &rarr; <b>Input &rarr; Input Mapping Context</b> &rarr; <code>IMC_Table</code>. Open it and add three mappings: <b>Mouse XY 2D-Axis</b> &rarr; IA_Look, <b>Left Mouse Button</b> &rarr; IA_PlaceBet, <b>Spacebar</b> &rarr; IA_Spin.</p> <p><b>4.</b> Close the editor.</p> <p><b>Phase 2 &mdash; Visual Studio.</b></p> <p><b>5.</b> <code>Source/Hasard/Hasard.Build.cs</code> &mdash; add <code>"EnhancedInput"</code>:</p> <pre><code>PublicDependencyModuleNames.AddRange(new string[] {\n    "Core", "CoreUObject", "Engine", "InputCore", "EnhancedInput" });</code></pre> <p><b>6.</b> <code>HasardPlayerPawn.h</code> &mdash; the forward declarations, four asset properties, three handlers and the <code>SetupPlayerInputComponent</code> override from the lecture. Also add <code>virtual void BeginPlay() override;</code>.</p> <p><b>7.</b> <code>HasardPlayerPawn.cpp</code> &mdash; includes first:</p> <pre><code>#include "HasardPlayerPawn.h"\n#include "EnhancedInputComponent.h"       // CastChecked&lt;UEnhancedInputComponent&gt;, BindAction\n#include "EnhancedInputSubsystems.h"      // UEnhancedInputLocalPlayerSubsystem\n#include "InputActionValue.h"             // FInputActionValue in the handlers\n#include "InputMappingContext.h"          // AddMappingContext takes the full type\n#include "GameFramework/PlayerController.h"</code></pre> <p>Then <code>BeginPlay</code> with <code>AddMappingContext</code>, <code>SetupPlayerInputComponent</code> with the three <code>BindAction</code> calls, and <code>Look()</code>. Stub the other two:</p> <pre><code>void AHasardPlayerPawn::PlaceBet()\n{\n  UE_LOG(LogHasard, Warning, TEXT("PlaceBet pressed"));\n}\n\nvoid AHasardPlayerPawn::RequestSpin()\n{\n  UE_LOG(LogHasard, Warning, TEXT("Spin requested"));\n}</code></pre> <p><b>Phase 3 &mdash; build.</b></p> <p><b>8.</b> <code>Ctrl+Shift+B</code>. A <code>.Build.cs</code> change sometimes needs project files regenerating — if VS does not pick it up, right-click <code>Hasard.uproject</code> &rarr; Generate Visual Studio project files, then rebuild.</p> <p><b>Phase 4 &mdash; assign and test.</b></p> <p><b>9.</b> Open <code>BP_PlayerPawn</code> and assign all four assets to the properties you exposed. Compile, Save.</p> <p><b>10.</b> Play. Mouse look should work; clicking and spacebar should log.</p> <p><b>11.</b> Commit &mdash; this is the first genuinely interactive state.</p> <pre><code>git add -A\ngit commit -m "Add Enhanced Input: look, place bet, spin" -m "Look binds to Triggered (continuous); PlaceBet and Spin bind to Started (one per press). Binding PlaceBet to Triggered would fire every tick and drain the bankroll instantly."</code></pre>'},
{t:'srcs',x:[['Enhanced Input','https://dev.epicgames.com/documentation/en-us/unreal-engine/enhanced-input-in-unreal-engine']]}
],
