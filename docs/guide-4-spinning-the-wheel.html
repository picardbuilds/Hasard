/* --------------------------------------------------------- 06 */
{
grp:"Part III \u2014 Leaving",
num:"06",
title:"A menu you can leave from",
lede:"The first way out of this game that is not closing the process - and a menu that suppresses input rather than time, because the alternative hands the player an off switch for the reality check.",
blocks:[
{t:'h',x:'There has never been a way out'},
{t:'p',x:'Nine modules of table and the only way to stop playing has been to close the process. That is not a missing feature so much as an unexamined one, and <code>CLAUDE.md</code> has had an opinion about it the whole time:'},
{t:'rg',lab:'Leaving is always one clear action away',x:'<p><i>&ldquo;No confirmation gauntlet, no parting offer, no flow that makes stopping more effort than continuing.&rdquo;</i></p><p>Read what that does and does not forbid. It does not forbid a menu &mdash; pressing a key and clicking <b>Quit</b> is two actions and is how every game works. What it forbids is anything <i>between</i> the decision and the exit: an &ldquo;are you sure?&rdquo;, a summary of what you are walking away from, a countdown, an offer of chips to stay, a fade you have to sit through.</p><p>The test is not the number of clicks. It is whether any step exists whose purpose is to change the player&rsquo;s mind. In this build there is exactly one path from Quit to the process ending, and it is one statement long.</p>'},
{t:'h',x:'The menu does not pause the game'},
{t:'p',x:'The obvious implementation is <code>SetPause(true)</code>. It is wrong here, and the reason is a chain worth following.'},
{t:'p',x:'The session clock is <b>wall time</b> &mdash; <code>FPlatformTime::Seconds()</code>, chosen in guide 2 precisely because a clock that stops when the game stops understates the sitting. Pausing the world does not pause it. Everything else, though, is a world timer: the HUD&rsquo;s one-second clock update, and the reality-check timer on the PlayerState.'},
{t:'p',x:'So <code>SetPause(true)</code> produces this: the counted time keeps running, the displayed time freezes, and <b>the reality check cannot fire</b>. A player who leaves the menu open for twenty minutes has been playing for twenty minutes by the game&rsquo;s own measure and has not been interrupted once.'},
{t:'warn',lab:'A reality check with an off switch is not a reality check',x:'<p>It is worth being precise about how bad that is. The reality check is <i>the</i> mechanic this project exists to demonstrate. A pause menu that suspends it hands the player a button labelled something else that switches it off, and does so while the clock the check is measured against keeps counting.</p><p>Nobody would ship that on purpose. It arrives by reaching for <code>SetPause</code> because that is what a pause menu does, and it would pass every test anyone would think to write.</p>'},
{t:'p',x:'So the menu suppresses <b>input</b> and leaves the world alone &mdash; which is the same thing the reality check and the start screen have each done already. This is the third use of a pattern that was built in guide 3 module 5, at a priority above both.'},
{t:'chk',q:'If the world is not paused, the wheel keeps turning and a spin can settle while the menu is open. Is that a problem?',a:'<p><b>No, and it is the honest behaviour.</b> The round was already paid for; the bet was taken when the chip went down. A spin that stops resolving because a menu is open would be a game where opening a menu can change what a bet is worth.</p><p>The reality check can also fire over the menu, and must be allowed to. Give it the higher Z-order in <code>WBP_HUD</code> so it draws on top &mdash; two panels at once looks untidy, and untidy is a much smaller problem than suppressible.</p>'},
{t:'h',x:'Where the key is bound, and why not on the pawn'},
{t:'p',x:'Every other input in this game is bound in <code>AHasardPlayerPawn::SetupPlayerInputComponent</code>. The pause key is bound on the <b>controller</b> instead, in <code>SetupInputComponent</code>.'},
{t:'p',x:'A menu is not a pawn&rsquo;s business. The controller owns every screen in this project already &mdash; the HUD, the reality check, the start screen &mdash; and it outlives any pawn it possesses. Binding the key on the pawn would mean the way out of the game stops working the moment the pawn is replaced.'},
{t:'warn',lab:'The suppression context must not map the pause key',x:'<p><code>IMC_PauseMenu</code> is a duplicate of <code>IMC_RealityCheck</code> and blocks the table keys the same way. Do not add the pause key to it, or the key that opened the menu becomes the one key that cannot close it.</p><p>The other half of the same idea: <code>IA_PauseMenu</code> lives in <code>IMC_Table</code>, which the reality check and the start screen do <i>not</i> block, because they only map the keys they care about. That is not a loophole &mdash; it is required. You must be able to leave during a reality check.</p>'},
{t:'chk',q:'Why must the menu be reachable while the reality check is on screen?',a:'<p><b>Because the reality check exists to give the player a moment to consider stopping.</b> A screen that says <i>you have been playing for twenty minutes and are down sixty</i>, while removing the means to act on it, is worse than not showing it at all &mdash; it has told the player something true and then made the obvious response harder than carrying on.</p><p>That is the &ldquo;flow that makes stopping more effort than continuing&rdquo; clause almost exactly, arrived at by omission rather than intent.</p>'},
{t:'h',x:'Quit is one statement'},
{t:'code',x:'void AHasardPlayerController::HandleQuitChosen()\n{\n    UE_LOG(LogHasard, Warning, TEXT("Quit chosen"));\n\n    UKismetSystemLibrary::QuitGame(this, this, EQuitPreference::Quit, false);\n}'},
{t:'p',x:'Nothing before it and nothing after it. The record is written on the way out by <code>CommitSave</code> from <code>EndPlay</code>, which module 10 of guide 3 put at the top of that function for exactly this kind of exit &mdash; and the menu commits again when it opens, because a player who is looking at a Quit button may well close the window instead of pressing it.'},
{t:'build',title:'A menu, and the time that keeps running behind it',file:'Source/Hasard/HasardHUDWidget.h + .cpp, HasardPlayerController.h + .cpp, WBP_HUD, IA_PauseMenu, IMC_PauseMenu',x:'<p><b>Phase 1 &mdash; Visual Studio.</b> Four files, all complete.</p> <p><b>1.</b> <code>HasardHUDWidget.h</code>, complete. Two delegates, two events, two notifies &mdash; the same shape as the start screen in guide 3 module 9:</p> <pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"\n#include "Blueprint/UserWidget.h"\n#include "HasardHUDWidget.generated.h"\n\nclass UTextBlock;\n\n/**\n * Broadcast when the player dismisses the reality check.\n * Non-dynamic: only C++ binds to it, so there is no reason to pay for reflection.\n */\nDECLARE_MULTICAST_DELEGATE(FOnRealityCheckDismissed);\n\n/** True to continue the last sitting, false to start a new one. Same reasoning: C++ only. */\nDECLARE_MULTICAST_DELEGATE_OneParam(FOnSessionStartChosen, bool bContinuePrevious);\n\n+|/** The player wants the table back. */\n+|DECLARE_MULTICAST_DELEGATE(FOnResumeChosen);\n+|\n+|/** The player wants to leave. Nothing may stand between this and the process ending. */\n+|DECLARE_MULTICAST_DELEGATE(FOnQuitChosen);\n+|\n/**\n * The HUD\'s C++ half. Layout and styling are authored in WBP_HUD; this class owns\n * the contract between the controller and those widgets.\n *\n * Abstract, because the BindWidget properties can only be satisfied by a\n * Blueprint subclass. Instantiating this class directly would leave them null.\n */\nUCLASS(Abstract)\nclass HASARD_API UHasardHUDWidget : public UUserWidget\n{\n\tGENERATED_BODY()\n\npublic:\n\t/** Bound by the controller in BeginPlay, unbound in EndPlay. */\n\tFOnRealityCheckDismissed OnRealityCheckDismissed;\n\n\t/** Same. The controller cannot start the session until this says how. */\n\tFOnSessionStartChosen OnSessionStartChosen;\n+|\n+|\t/** Bound by the controller in BeginPlay, unbound in EndPlay. */\n+|\tFOnResumeChosen OnResumeChosen;\n+|\n+|\t/** Same. */\n+|\tFOnQuitChosen OnQuitChosen;\n\n\tvoid SetBankroll(int32 Balance, int32 SessionStaked, int32 SessionNetChange);\n\n\tvoid SetSessionTime(float ElapsedSeconds);\n\n\t/**\n\t * What every sitting has cost, this one included.\n\t *\n\t * Beside the session figures rather than replacing them. Either one alone is a true\n\t * number that leaves a false impression - the session hides what came before it, and\n\t * the lifetime hides what is happening right now.\n\t */\n\tvoid SetLifetime(int32 LifetimeStaked, int32 LifetimeNetChange);\n\n\t/** Blueprint owns the panel entirely - C++ never touches layout. */\n\tUFUNCTION(BlueprintImplementableEvent, Category = "Hasard|UI")\n\tvoid ShowRealityCheck(int32 MinutesElapsed, int32 TotalStaked, int32 SessionNetChange);\n\n\t/** The panel\'s dismiss button calls this; the controller pops the context. */\n\tUFUNCTION(BlueprintCallable, Category = "Hasard|UI")\n\tvoid NotifyRealityCheckDismissed();\n\n\t/**\n\t * The start screen, with last sitting\'s figures so the choice is an informed one.\n\t *\n\t * bHasSave false means there is nothing to continue, and the panel is expected to\n\t * offer only a new session rather than a disabled button the player can wonder about.\n\t */\n\tUFUNCTION(BlueprintImplementableEvent, Category = "Hasard|UI")\n\tvoid ShowStartScreen(bool bHasSave, int32 SavedBalance, int32 LifetimeStaked,\n\t\tint32 LifetimeNetChange);\n\n\tUFUNCTION(BlueprintImplementableEvent, Category = "Hasard|UI")\n\tvoid HideStartScreen();\n\n\t/** Both start-screen buttons call this; the bool is which one. */\n\tUFUNCTION(BlueprintCallable, Category = "Hasard|UI")\n\tvoid NotifySessionStartChosen(bool bContinuePrevious);\n\n+|\t/**\n+|\t * The pause menu, carrying this session\'s figures.\n+|\t *\n+|\t * The same three numbers the reality check shows, for the same reason: a screen the\n+|\t * player opened to think about stopping is a screen that should say what stopping\n+|\t * would be stopping. They are on the HUD as well - CLAUDE.md is explicit that a total\n+|\t * reachable only by a menu dive is a hidden total, so this is a second sighting of\n+|\t * them and never the only one.\n+|\t */\n+|\tUFUNCTION(BlueprintImplementableEvent, Category = "Hasard|UI")\n+|\tvoid ShowPauseMenu(int32 MinutesElapsed, int32 SessionStaked, int32 SessionNetChange);\n+|\n+|\tUFUNCTION(BlueprintImplementableEvent, Category = "Hasard|UI")\n+|\tvoid HidePauseMenu();\n+|\n+|\t/** The Resume button calls this. */\n+|\tUFUNCTION(BlueprintCallable, Category = "Hasard|UI")\n+|\tvoid NotifyResumeChosen();\n+|\n+|\t/**\n+|\t * The Quit button calls this, and it is the only thing it calls.\n+|\t *\n+|\t * No confirmation, no second screen, no parting figure. See the anti-patterns in\n+|\t * CLAUDE.md: leaving is always one clear action away.\n+|\t */\n+|\tUFUNCTION(BlueprintCallable, Category = "Hasard|UI")\n+|\tvoid NotifyQuitChosen();\n+|\n\t/** The one figure that is true of every bet on the table. */\n\tvoid SetHouseEdge(float EdgePercent);\n\n\t/** Rows disagree, so no single figure is true. Say that rather than quoting one. */\n\tvoid SetHouseEdgeUnknown();\n\n\t/** The bet under the aim, priced. Written every time the aim moves to a new position. */\n\tvoid SetBetPreview(const FText&amp; InPreviewText);\n\n\t/** No bet under the aim. Blank, never the last price. */\n\tvoid ClearBetPreview();\n\nprivate:\n\t/** Each name must match a Text Block of that name in WBP_HUD, or the Blueprint refuses to compile. */\n\tUPROPERTY(meta = (BindWidget))\n\tTObjectPtr&lt;UTextBlock&gt; BalanceText;\n\n\tUPROPERTY(meta = (BindWidget))\n\tTObjectPtr&lt;UTextBlock&gt; StakedText;\n\n\tUPROPERTY(meta = (BindWidget))\n\tTObjectPtr&lt;UTextBlock&gt; NetText;\n\n\tUPROPERTY(meta = (BindWidget))\n\tTObjectPtr&lt;UTextBlock&gt; TimeText;\n\n\tUPROPERTY(meta = (BindWidget))\n\tTObjectPtr&lt;UTextBlock&gt; OddsText;\n\n\tUPROPERTY(meta = (BindWidget))\n\tTObjectPtr&lt;UTex ior(EMouseLockMode::DoNotLock)\n\t\t.SetHideCursorDuringCapture(false));\n\n\tHUDWidget-&gt;ShowStartScreen(LoadedSave != nullptr,\n\t\tLoadedSave ? LoadedSave-&gt;Balance : 0,\n\t\tLoadedSave ? LoadedSave-&gt;LifetimeStaked : 0,\n\t\tLoadedSave ? LoadedSave-&gt;LifetimeWon - LoadedSave-&gt;LifetimeStaked : 0);\n\n}\n\nvoid AHasardPlayerController::HandleSessionStartChosen(bool bContinuePrevious)\n{\n\tif (StartScreenContext)\n\t{\n\t\tif (UEnhancedInputLocalPlayerSubsystem* Subsystem =\n\t\t\tULocalPlayer::GetSubsystem&lt;UEnhancedInputLocalPlayerSubsystem&gt;(GetLocalPlayer()))\n\t\t{\n\t\t\tSubsystem-&gt;RemoveMappingContext(StartScreenContext);\n\t\t}\n\t}\n\n\tSetShowMouseCursor(false);\n\tSetInputMode(FInputModeGameOnly());\n\n\tif (HUDWidget)\n\t{\n\t\tHUDWidget-&gt;HideStartScreen();\n\t}\n\n\t// No save is not an error. It is a first sitting, and the defaults already describe\n\t// one - which is why there is no separate branch here for it.\n\tif (LoadedSave &amp;&amp; BoundBankroll)\n\t{\n\t\tBoundBankroll-&gt;ApplySave(*LoadedSave, bContinuePrevious);\n\t}\n\n\tif (AHasardPlayerState* PS = GetPlayerState&lt;AHasardPlayerState&gt;())\n\t{\n\t\tPS-&gt;StartSession(LoadedSave ? LoadedSave-&gt;LifetimeSeconds : 0.0f);\n\t}\n\n\tUE_LOG(LogHasard, Warning, TEXT("Sessions started -%s"),\n\t\tbContinuePrevious ? TEXT("continuing the last one") : TEXT("new"));\n\n\t// After StartSession, never before it: CommitSave refuses to write until the clock\n\t// has been stamped, so the order of these two lines is the difference between the\n\t// sitting being counted and the sitting being lost.\n\tCommitSave();\n}\n\nvoid AHasardPlayerController::HandleBankrollChanged(int32 NewBalance, int32 Delta,\n\tint32 SessionNetChange)\n{\n\tUE_LOG(LogHasard, Warning, TEXT("Bankroll: balance %d (%+d), session net %+d"),\n\t\tNewBalance, Delta, SessionNetChange);\n\n\tif (HUDWidget &amp;&amp; BoundBankroll)\n\t{\n\t\tHUDWidget-&gt;SetBankroll(NewBalance, BoundBankroll-&gt;GetSessionStaked(), SessionNetChange);\n\n\t\tHUDWidget-&gt;SetLifetime(BoundBankroll-&gt;GetLifetimeStaked(),\n\t\t\tBoundBankroll-&gt;GetLifetimeNetChange());\n\t}\n\n\t// Every stake and every credit. The record is never more than one money movement\n\t// behind what the HUD is showing, which is the only relationship between them worth\n\t// guaranteeing.\n\tCommitSave();\n}\n\nvoid AHasardPlayerController::UpdateSessionTime()\n{\n\tif (!HUDWidget)\n\t{\n\t\treturn;\n\t}\n\n\t// The same accessor the log uses, so the clock and the log cannot disagree.\n\tif (const AHasardPlayerState* PS = GetPlayerState&lt;AHasardPlayerState&gt;())\n\t{\n\t\tHUDWidget-&gt;SetSessionTime(PS-&gt;GetSessionElapsedSeconds());\n\t}\n}\n\nvoid AHasardPlayerController::CommitSave()\n{\n\tconst AHasardPlayerState* PS = GetPlayerState&lt;AHasardPlayerState&gt;();\n\n\t// Nothing is written before the player has chosen. Until that choice the bankroll\n\t// holds StartingBalance rather than the record, so a write here would replace a real\n\t// saved balance with 500 for somebody who opened the game and read the start screen.\n\tif (!PS || !PS-&gt;IsSessionStarted())\n\t{\n\t\treturn;\n\t}\n\n\tif (!BoundBankroll)\n\t{\n\t\t// Refused rather than written short. A stale record is merely old; a record with\n\t\t// a zero in it is a false statement about what playing cost.\n\t\tUE_LOG(LogHasard, Error, TEXT("CommitSave: no bankroll - nothing written"));\n\t\treturn;\n\t}\n\n\tUHasardSaveGame* Save = Cast&lt;UHasardSaveGame&gt;(\n\t\tUGameplayStatics::CreateSaveGameObject(UHasardSaveGame::StaticClass()));\n\n\tif (!Save)\n\t{\n\t\tUE_LOG(LogHasard, Error, TEXT("CommitSave: could not create the save object"));\n\t\treturn;\n\t}\n\n\tSave-&gt;Version         = UHasardSaveGame::CurrentVersion;\n\tSave-&gt;Balance         = BoundBankroll-&gt;GetBalance();\n\tSave-&gt;LifetimeStaked  = BoundBankroll-&gt;GetLifetimeStaked();\n\tSave-&gt;LifetimeWon     = BoundBankroll-&gt;GetLifetimeWon();\n\tSave-&gt;LifetimeSeconds = PS-&gt;GetLifeTimeSeconds();\n\n\t// Counted from what was read, not from what was last written, so the value is stable\n\t// however many times this function runs in one sitting. A sitting the player started\n\t// fresh is still a sitting, so nothing here ever counts down.\n\tSave-&gt;SessionsPlayed = (LoadedSave ? LoadedSave-&gt;SessionsPlayed : 0) + 1;\n\n\tif (!UGameplayStatics::SaveGameToSlot(Save, UHasardSaveGame::SlotName,\n\t\tUHasardSaveGame::UserIndex))\n\t{\n\t\tUE_LOG(LogHasard, Error, TEXT("CommitSave: SaveGameToSlot refused to write"));\n\t}\n}\n\nvoid AHasardPlayerController::SetBetPreview(const FText&amp; PreviewText)\n{\n\tif (HUDWidget)\n\t{\n\t\tHUDWidget-&gt;SetBetPreview(PreviewText);\n\t}\n}\n\nvoid AHasardPlayerController::ClearBetPreview()\n{\n\tif (HUDWidget)\n\t{\n\t\tHUDWidget-&gt;ClearBetPreview();\n\t}\n}\n\nvoid AHasardPlayerController::HandleRealityCheck(int32 MinutesElapsed)\n{\n\t// First, and above the guard below. The clock advances whether or not the money does,\n\t// and whether or not the widget exists - so the one call site that commits elapsed\n\t// time must not be behind a check for a HUD.\n\tCommitSave();\n\n\tif (!HUDWidget || !BoundBankroll)\n\t{\n\t\treturn;\n\t}\n\n\tif (RealityCheckContext)\n\t{\n\t\t// Suppress table input while the check is up - Module 6\'s contexts\n\t\tif (UEnhancedInputLocalPlayerSubsystem* Subsystem =\n\t\t\tULocalPlayer::GetSubsystem&lt;UEnhancedInputLocalPlayerSubsystem&gt;(GetLocalPlayer()))\n\t\t{\n\t\t\tSubsystem-&gt;AddMappingContext(RealityCheckContext, 10);\n\t\t}\n\t}\n\n\t// The context stops gameplay input; this hands the mouse to Slate so the\n\t// dismiss button can actually be clicked. Two different jobs.\n\tSetShowMouseCursor(true);\n\tSetInputMode(FInputModeGameAndUI()\n\t\t.SetLockMouseToViewportBehavior(EMouseLockMode::DoNotLock)\n\t\t.SetHideCursorDuringCapture(false));\n\n\tHUDWidget-&gt;ShowRealityCheck(MinutesElapsed,\n\t\tBoundBankroll-&gt;GetSessionStaked(),\n\t\tBoundBankroll-&gt;GetSessionNetChange());\n}\n\nvoid AHasardPlayerController::HandleRealityCheckDismissed()\n{\n\tif (RealityCheckContext)\n\t{\n\t\tif (UEnhancedInputLocalPlayerSubsystem* Subsystem =\n\t\t\tULocalPlayer::GetSubsystem&lt;UEnhancedInputLocalPlayerSubsystem&gt;(GetLocalPlayer()))\n\t\t{\n\t\t\tSubsystem-&gt;RemoveMappingContext(RealityCheckContext);\n\t\t}\n\t}\n\n\tSetShowMouseCursor(false);\n\tSetInputMode(FInputModeGameOnly());\n}\n+|\n+|void AHasardPlayerController::TogglePauseMenu()\n+|{\n+|\tif (bPauseMenuOpen)\n+|\t{\n+|\t\tClosePauseMenu();\n+|\t}\n+|\telse\n+|\t{\n+|\t\tOpenPauseMenu();\n+|\t}\n+|}\n+|\n+|void AHasardPlayerController::OpenPauseMenu()\n+|{\n+|\tif (!HUDWidget)\n+|\t{\n+|\t\treturn;\n+|\t}\n+|\n+|\tbPauseMenuOpen = true;\n+|\n+|\t// The world is deliberately NOT paused. SetPause would stop the reality-check timer\n+|\t// and every other world timer, which would make this menu an off switch for the one\n+|\t// mechanic the project exists to demonstrate - while the session clock, which is wall\n+|\t// time, kept counting anyway. Input is suppressed the way it has been suppressed twice\n+|\t// already instead.\n+|\tif (PauseMenuContext)\n+|\t{\n+|\t\tif (UEnhancedInputLocalPlayerSubsystem* Subsystem =\n+|\t\t\tULocalPlayer::GetSubsystem&lt;UEnhancedInputLocalPlayerSubsystem&gt;(GetLocalPlayer()))\n+|\t\t{\n+|\t\t\tSubsystem-&gt;AddMappingContext(PauseMenuContext, 30);\n+|\t\t}\n+|\t}\n+|\n+|\tSetShowMouseCursor(true);\n+|\tSetInputMode(FInputModeGameAndUI()\n+|\t\t.SetLockMouseToViewportBehavior(EMouseLockMode::DoNotLock)\n+|\t\t.SetHideCursorDuringCapture(false));\n+|\n+|\t// Cheap, and this is the last moment before a player who is thinking about leaving\n+|\t// might close the window rather than press the button.\n+|\tCommitSave();\n+|\n+|\tint32 MinutesElapsed = 0;\n+|\tif (const AHasardPlayerState* PS = GetPlayerState&lt;AHasardPlayerState&gt;())\n+|\t{\n+|\t\tMinutesElapsed = FMath::FloorToInt(PS-&gt;GetSessionElapsedSeconds() / 60.0f);\n+|\t}\n+|\n+|\tHUDWidget-&gt;ShowPauseMenu(MinutesElapsed,\n+|\t\tBoundBankroll ? BoundBankroll-&gt;GetSessionStaked() : 0,\n+|\t\tBoundBankroll ? BoundBankroll-&gt;GetSessionNetChange() : 0);\n+|}\n+|\n+|void AHasardPlayerController::ClosePauseMenu()\n+|{\n+|\tbPauseMenuOpen = false;\n+|\n+|\tif (PauseMenuContext)\n+|\t{\n+|\t\tif (UEnhancedInputLocalPlayerSubsystem* Subsystem =\n+|\t\t\tULocalPlayer::GetSubsystem&lt;UEnhancedInputLocalPlayerSubsystem&gt;(GetLocalPlayer()))\n+|\t\t{\n+|\t\t\tSubsystem-&gt;RemoveMappingContext(PauseMenuContext);\n+|\t\t}\n+|\t}\n+|\n+|\tSetShowMouseCursor(false);\n+|\tSetInputMode(FInputModeGameOnly());\n+|\n+|\tif (HUDWidget)\n+|\t{\n+|\t\tHUDWidget-&gt;HidePauseMenu();\n+|\t}\n+|}\n+|\n+|void AHasardPlayerController::HandleResumeChosen()\n+|{\n+|\tClosePauseMenu();\n+|}\n+|\n+|void AHasardPlayerController::HandleQuitChosen()\n+|{\n+|\t// One statement, and nothing before it. No confirmation, no summary of what is being\n+|\t// left behind, no offer. The record is written by CommitSave from EndPlay, which\n+|\t// QuitGame reaches on the way out.\n+|\tUE_LOG(LogHasard, Warning, TEXT("Quit chosen"));\n+|\n+|\tUKismetSystemLibrary::QuitGame(this, this, EQuitPreference::Quit, false);\n+|}\n+|</code></pre> <p><code>SetupInputComponent</code> runs before <code>BeginPlay</code>, which is why the missing-action error is logged there rather than left to fail silently later. If <code>PauseMenuAction</code> is unassigned you will read about it on the first line of the log rather than discover it by pressing a key that does nothing.</p> <p><b>Phase 2 &mdash; build, then the input assets.</b></p> <p><b>5.</b> Save all, close the editor, <code>Ctrl+Shift+B</code>, reopen.</p> <p><b>6.</b> Content Browser &rarr; <code>Content/Input</code> &rarr; right-click &rarr; <b>Input &rarr; Input Action</b>. Name it <code>IA_PauseMenu</code>. Open it and leave <b>Value Type</b> as <b>Digital (bool)</b>. Save.</p> <p><b>7.</b> Open <code>IMC_Table</code>. On <b>Mappings</b> press <b>+</b>, set the action to <code>IA_PauseMenu</code>, and bind it to <b>Tab</b>. Press <b>+</b> on that mapping&rsquo;s key list and add <b>Escape</b> as a second key. Save.</p> <p>Two keys deliberately. <b>Escape</b> is what a player expects and what the packaged build should use; in <b>Play In Editor</b> the editor takes Escape to stop the session before Enhanced Input ever sees it, so <b>Tab</b> is what you will actually test with.</p> <p><b>8.</b> Select <code>IMC_RealityCheck</code> and press <code>Ctrl+D</code>. Rename the copy <code>IMC_PauseMenu</code>. <b>Change nothing inside it</b> &mdash; it already maps the table keys to <code>IA_Blocked</code> and <code>IA_BlockedLook</code>, and it does not mention the pause key, which is exactly right.</p> <p><b>9.</b> Open <code>BP_HasardPlayerController</code> &rarr; <b>Class Defaults</b> &rarr; <b>Hasard | UI</b>. Set <b>Pause Menu Context</b> to <code>IMC_PauseMenu</code> and <b>Pause Menu Action</b> to <code>IA_PauseMenu</code>. <b>Compile</b>, <b>Save</b>.</p> <p><b>Phase 3 &mdash; the widget.</b></p> <p><b>10.</b> Open <code>WBP_HUD</code>. In the <b>Designer</b>, build a second panel exactly the way you built <code>StartScreenPanel</code> in guide 3 module 9: a <b>Border</b> on the Canvas Panel named <code>PauseMenuPanel</code>, anchors <b>Minimum 0,0 / Maximum 1,1</b> with all four offsets zeroed, a dark <b>Brush Color</b>, and one <b>Vertical Box</b> inside it.</p> <p><b>11.</b> Into that Vertical Box: a Text Block reading <code>Paused</code>; three Text Blocks named <code>PauseTimeText</code>, <code>PauseStakedText</code> and <code>PauseNetText</code> with <b>Is Variable</b> ticked; then two Buttons, <code>ResumeButton</code> and <code>QuitButton</code>, each with a Text Block child reading <code>Resume</code> and <code>Quit</code>.</p> <p><b>12.</b> Set <code>PauseMenuPanel</code>&rsquo;s <b>Visibility</b> to <b>Collapsed</b> &mdash; last, after you have finished looking at it, for the reason module 9 gave.</p> <p><b>13.</b> Select <code>RealityCheckPanel</code> and give its <b>Canvas Panel Slot</b> a higher <b>ZOrder</b> than <code>PauseMenuPanel</code>. The reality check draws over the menu, never under it.</p> <p><b>14.</b> <b>Graph</b> tab. <b>Override &rarr; Show Pause Menu</b>. Off its exec pin: set <code>PauseMenuPanel</code> visible, then three <code>Set Text</code> nodes fed by <code>Format Text</code> &mdash; <code>Minutes played: {Minutes}</code>, <code>Staked this session: {Staked}</code>, <code>Net: {Net}</code> &mdash; wired from the event&rsquo;s three pins.</p> <p><b>15.</b> <b>Override &rarr; Hide Pause Menu</b>: one node, <code>PauseMenuPanel</code> &rarr; Set Visibility &rarr; <b>Collapsed</b>.</p> <p><b>16.</b> Select <code>ResumeButton</code> &rarr; Details &rarr; <b>+ On Clicked</b> &rarr; call <b>Notify Resume Chosen</b>. Same for <code>QuitButton</code> &rarr; <b>Notify Quit Chosen</b>. <b>Nothing else on either.</b> No confirmation node, no second panel, no delay. <b>Compile</b>, <b>Save</b>.</p> <p><b>Phase 4 &mdash; the part that matters.</b></p> <p><b>17.</b> <b>Play</b>, start a session, press <b>Tab</b>. The menu appears, the cursor comes back, and the table stops responding to WASD and to clicks.</p> <p><b>18.</b> <b>Now watch the clock behind the menu.</b> It keeps counting. Press Tab again to close, and it has not jumped or reset &mdash; it was never stopped. That single observation is the whole of this module: the world was never paused, so nothing that measures the session was ever suspended.</p> <p><b>19.</b> Prove the reality check survives. Open <code>HasardPlayerState.h</code>, temporarily set <code>RealityCheckIntervalSeconds</code> back to <code>15.0f</code>, rebuild, and Play. Start a session, open the menu with Tab, and <b>wait</b>. The reality check fires over the menu. <b>Set it back to 300 and rebuild</b> &mdash; guide 3 module 11 put it there on purpose.</p> <p><b>20.</b> Place a bet, spin, and press Tab while the ball is travelling. The wheel keeps turning and the round settles normally with the menu up. The bet was paid for before the menu opened, and a menu that could suspend a round in flight would be a menu that changes what a bet is worth.</p> <p><b>21.</b> Press <b>Quit</b>. The game ends immediately &mdash; no prompt, nothing to dismiss. Relaunch and confirm the start screen offers <b>Continue last session</b> with the figures from the sitting you just left: <code>EndPlay</code> committed on the way out.</p> <p><b>22.</b> Commit.</p> <pre><code>git add -A\ngit commit -m "Add a pause menu that suppresses input, not time"</code></pre> <p><b>The failures worth recognising.</b> <b>Tab opens the menu and Tab will not close it</b> means <code>IA_PauseMenu</code> ended up inside <code>IMC_PauseMenu</code>. <b>The menu opens but the table still responds</b> means <b>Pause Menu Context</b> is empty on the Blueprint. <b>Nothing happens on Tab</b> and the log says the pause action is unbound means <b>Pause Menu Action</b> is empty &mdash; and you were told on the first line of the log rather than left guessing.</p>'},
{t:'srcs',x:[['Enhanced Input','https://dev.epicgames.com/documentation/en-us/unreal-engine/enhanced-input-in-unreal-engine'],['UMG UI Designer','https://dev.epicgames.com/documentation/en-us/unreal-engine/umg-ui-designer-quick-start-guide-in-unreal-engine'],['Gameplay Timers','https://dev.epicgames.com/documentation/en-us/unreal-engine/gameplay-timers-in-unreal-engine']]}
],
quiz:[
{q:'<code>SetPause(true)</code> is not used because:',
 opts:['It cannot be called from a PlayerController','It would stop the wheel mid-spin and corrupt the round','It would stop the HUD clock only, which is cosmetic','It stops every world timer, including the reality check, while the wall-clock session timer keeps counting'],
 c:3,why:'The player would be accruing session time, seeing a frozen clock, and could not be interrupted. A menu that suspends the reality check is an off switch for it under another name.'},
{q:'The pause key is bound on the controller rather than the pawn because:',
 opts:['<code>SetupPlayerInputComponent</code> cannot bind digital actions','A menu is not a pawn&rsquo;s business, and the controller outlives any pawn it possesses','The pawn is destroyed while the menu is open','Enhanced Input only routes to controllers'],
 c:1,why:'Every screen in the project is already the controller’s. Binding on the pawn would mean the way out stops working the moment the pawn is replaced.'},
{q:'<code>IA_PauseMenu</code> must live in <code>IMC_Table</code> and <b>not</b> in <code>IMC_PauseMenu</code> because:',
 opts:['Otherwise the key that opened the menu is the one key that cannot close it','<code>IMC_PauseMenu</code> is loaded later','Digital actions cannot appear in a blocking context','The priority would be wrong'],
 c:0,why:'And the same fact means the key survives the reality check’s suppression, which is required rather than incidental.'},
{q:'A reality check firing while the pause menu is open should be:',
 opts:['Deferred until the menu closes','Cancelled, since the player has already stopped playing','Allowed, and drawn above the menu','Prevented by pausing the world'],
 c:2,why:'The check must never be suppressible by another screen. Two panels at once is untidy; a check with an off switch is not a check.'},
{q:'A round settling while the menu is open is correct because:',
 opts:['The wheel cannot be stopped once started','Settlement runs on the GameMode, not the controller','The bet was paid for before the menu opened, and a menu that suspends a round is one that changes what a bet is worth','The save is committed when the menu opens'],
 c:2,why:'TryStake took the money at placement. Anything that lets a UI action alter a bet already made is a much bigger problem than an untidy screen.'},
{q:'The Quit button&rsquo;s On Clicked graph contains one node call and nothing else because:',
 opts:['Blueprint cannot chain nodes after QuitGame','The save would otherwise be written twice','<code>EndPlay</code> would not run','Anything between the decision and the exit whose purpose is to change the player&rsquo;s mind is the pattern CLAUDE.md forbids'],
 c:3,why:'The rule is not about click count - two actions to leave is normal. It is about whether any step exists to talk the player out of it.'}
]
},

/* --------------------------------------------------------- 07 */
{
grp:"Part IV \u2014 On Camera",
num:"07",
title:"A body, and the key that moves you into it",
lede:"The table has been filmed from two and a half metres behind the player since guide 2, and there has never been anybody in the shot. One component and one key fix that - and neither of them is allowed to change what the player is told.",
blocks:[
{t:'h',x:'What is missing is not the camera'},
{t:'p',x:'<code>AHasardPlayerPawn</code> already has the whole rig: a <code>ViewRoot</code>, a <code>USpringArmComponent</code> pulled back by <code>CameraDistance</code>, and a camera on the end of it. The shot has been third person since guide 2. There is simply nobody standing in it.'},
{t:'p',x:'So this module adds two things. A skeletal mesh, so there is a player to look at. And one key that moves the camera down the arm to the head and hides the body on the way, because a table game is easier to aim in from the eyes and easier to show off from behind.'},
{t:'h',x:'One component, and no asset path in the code'},
{t:'p',x:'<code>BodyMesh</code> is a <code>VisibleAnywhere</code> component and nothing more. The mesh, the animation class and the transform are all set on it in <code>BP_PlayerPawn</code>. There is no content path anywhere in <code>HasardPlayerPawn.cpp</code>, and that is deliberate rather than lazy.'},
{t:'aside',lab:'A path you cannot open is a guess',x:'<p>Content-pack paths move between engine versions and between packs. On a previous project, guesses at a Third Person pack&rsquo;s layout were wrong for three of four meshes and for both animation blueprints &mdash; <code>Anims</code> rather than <code>Animations</code>, meshes carrying a suffix nobody expected, one shared blueprint instead of one per mannequin.</p><p>A wrong path in C++ is a silent <code>None</code> at runtime and a rebuild to fix. The same assignment in the Blueprint is a dropdown, in front of somebody who can see what is actually in the folder. Put the decision where the eyes are.</p>'},
{t:'chk',q:'Why is <code>BodyMesh</code> given <code>NoCollision</code> in the constructor rather than left at the default?',a:'<p><b>Because the interaction component traces from the camera, and the body is in the way.</b> <code>UHasardInteractionComponent</code> fires a trace each frame to work out which bet position the player is looking at. A colliding body sitting between the camera and the felt is the first thing that trace hits, and the felt stops responding &mdash; in third person only, which makes it look like the view toggle broke betting.</p><p>It would also be pushed about by <code>UFloatingPawnMovement</code> and shove the camera. Neither is a body&rsquo;s job here: it exists to be looked at.</p>'},
{t:'h',x:'One function owns both halves'},
{t:'p',x:'The arm length and the body&rsquo;s visibility are not two settings. They are one decision with two consequences, so one function applies both and <code>bThirdPerson</code> is never read anywhere else.'},
{t:'code',x:'CameraBoom->TargetArmLength = bThirdPerson ? CameraDistance : 0.0f;\nBodyMesh->SetVisibility(bThirdPerson, true);'},
{t:'warn',lab:'Arm length zero with a visible body puts the camera inside the head',x:'<p>At <code>TargetArmLength = 0</code> the camera sits back at <code>ViewRoot</code>, which is where the mannequin&rsquo;s skull is. Leave the mesh visible and the near plane clips through it: you get the inside of a face, or a black screen, depending on where the camera lands.</p><p>Hiding one bone instead of the whole body is the usual fix in a shooter, where the arms have to stay. Nothing here needs the arms, so the whole mesh goes.</p><p>Separately: <code>CameraBoom</code> has <code>bDoCollisionTest = false</code>, set back in guide 2. In an empty level that is fine. The moment there are walls, a third-person camera will pass straight through them.</p>'},
{t:'rg',lab:'The view changes, the figures do not',x:'<p>The toggle moves a camera. It must not become a way to get a cleaner picture by losing the parts of the screen that say what this is costing.</p><p>So check it explicitly, in both views: the balance, the running spend and the session clock are all still there, and a reality check still lands on top. A cinematic mode that quietly drops the HUD would undo guide 3 module 9 for the sake of a nicer recording, and a recording is the one thing on this project that has no claim on the design.</p><p>It is worth saying plainly that this module exists to make a video. That is a legitimate reason to build something and a bad reason to change anything else.</p>'},
{t:'build',title:'A body to stand in, and a key to leave it',file:'Source/Hasard/HasardPlayerPawn.h + .cpp, BP_PlayerPawn, IA_ToggleView, the table mapping context',x:'<p><b>Phase 1 &mdash; Visual Studio.</b> Two files, complete, marked against the pawn as guide 3 left it.</p><p><b>1.</b> <code>HasardPlayerPawn.h</code>, complete:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"\n#include "GameFramework/Pawn.h"\n#include "HasardPlayerPawn.generated.h"\n\nclass USceneComponent;\n+|class USkeletalMeshComponent;\nclass USpringArmComponent;\nclass UCameraComponent;\nclass UFloatingPawnMovement;\nclass UInputMappingContext;\nclass UInputAction;\nclass UHasardBettingComponent;\nclass UHasardInteractionComponent;\nstruct FInputActionValue;\n\nUCLASS()\nclass HASARD_API AHasardPlayerPawn : public APawn\n{\n\tGENERATED_BODY()\n\npublic:\n\tAHasardPlayerPawn();\n\n\t/** Console: SettleRound 17 */\n\tUFUNCTION(Exec)\n\tvoid SettleRound(int32 WinningPocket);\n\nprotected:\n\tvirtual void BeginPlay() override;\n\tvirtual void OnConstruction(const FTransform&amp; Transform) override;\n\tvirtual void SetupPlayerInputComponent(UInputComponent* PlayerInputComponent) override;\n\nprivate:\n\t/** Distance from the table. Applied in OnConstruction, so edits apply right away. */\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Camera",\n\t\tmeta = (AllowPrivateAccess = "true"))\n\tfloat CameraDistance = 250.0f;\n\n+|\t/** Which view the round starts in. The table has been filmed from behind since guide 2. */\n+|\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Camera",\n+|\t\tmeta = (AllowPrivateAccess = "true"))\n+|\tbool bStartInThirdPerson = true;\n+|\n+|\t/** Current view. Never assigned outside ToggleView, and never read except by ApplyViewMode. */\n+|\tbool bThirdPerson = true;\n+|\n\tUPROPERTY(VisibleAnywhere, Category = "Hasard|Camera")\n\tTObjectPtr&lt;USceneComponent&gt; ViewRoot;\n\n\tUPROPERTY(VisibleAnywhere, Category = "Hasard|Camera")\n\tTObjectPtr&lt;USpringArmComponent&gt; CameraBoom;\n\n\tUPROPERTY(VisibleAnywhere, Category = "Hasard|Camera")\n\tTObjectPtr&lt;UCameraComponent&gt; TableCamera;\n+|\n+|\t/**\n+|\t * The player, seen from behind.\n+|\t *\n+|\t * The mesh, its animation class and its transform are all set on this component in\n+|\t * BP_PlayerPawn rather than in code. There is no path to a content pack anywhere in\n+|\t * this file, which is deliberate: an asset path an agent cannot open is a guess, and\n+|\t * a guess that compiles is worse than one that does not.\n+|\t */\n+|\tUPROPERTY(VisibleAnywhere, Category = "Hasard|Camera")\n+|\tTObjectPtr&lt;USkeletalMeshComponent&gt; BodyMesh;\n\n\t/**\n\t * Movement without a Character. A Character brings a capsule, gravity, crouching and\n\t * a whole animation contract; a player at a table needs none of it and would have to\n\t * be told to ignore all of it. This slides a pawn about and stops.\n\t */\n\tUPROPERTY(VisibleAnywhere, Category = "Hasard|Movement")\n\tTObjectPtr&lt;UFloatingPawnMovement&gt; Movement;\n\n\tUPROPERTY(VisibleAnywhere, Category = "Hasard|Betting")\n\tTObjectPtr&lt;UHasardBettingComponent&gt; BettingComp;\n\n\tUPROPERTY(VisibleAnywhere, Category = "Hasard|Interaction")\n\tTObjectPtr&lt;UHasardInteractionComponent&gt; InteractionComp;\n\n\tUPROPERTY(EditDefaultsOnly, Category = "Hasard|Input")\n\tTObjectPtr&lt;UInputMappingContext&gt; TableMappingContext;\n\n\tUPROPERTY(EditDefaultsOnly, Category = "Hasard|Input")\n\tTObjectPtr&lt;UInputAction&gt; LookAction;\n\n\t/** Axis2D. X is strafe, Y is forward - the mapping in IMC_Table decides which key is which. */\n\tUPROPERTY(EditDefaultsOnly, Category = "Hasard|Input")\n\tTObjectPtr&lt;UInputAction&gt; MoveAction;\n\n\tUPROPERTY(EditDefaultsOnly, Category = "Hasard|Input")\n\tTObjectPtr&lt;UInputAction&gt; PlaceBetAction;\n\n\tUPROPERTY(EditDefaultsOnly, Category = "Hasard|Input")\n\tTObjectPtr&lt;UInputAction&gt; SpinAction;\n\n+|\t/** Digital. Lives in IMC_Table, so the pause menu and the reality check both suppress it. */\n+|\tUPROPERTY(EditDefaultsOnly, Category = "Hasard|Input")\n+|\tTObjectPtr&lt;UInputAction&gt; ToggleViewAction;\n+|\n\tvoid Look(const FInputActionValue&amp; Value);\n\tvoid Move(const FInputActionValue&amp; Value);\n\tvoid PlaceBet();\n\tvoid RequestSpin();\n+|\tvoid ToggleView();\n+|\n+|\t/**\n+|\t * Puts the camera and the body where bThirdPerson says they go.\n+|\t *\n+|\t * One function decides both, because they are one decision. Two places setting the\n+|\t * arm length and the visibility separately is how you end up looking at the inside\n+|\t * of your own head.\n+|\t */\n+|\tvoid ApplyViewMode();\n};\n+|</code></pre><p><b>2.</b> <code>HasardPlayerPawn.cpp</code>, complete:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#include "HasardPlayerPawn.h"\n#include "Camera/CameraComponent.h"\n#include "Components/SceneComponent.h"\n+|#include "Components/SkeletalMeshComponent.h"\n#include "Engine/LocalPlayer.h"\n#include "Engine/World.h"\n#include "EnhancedInputComponent.h"\n#include "EnhancedInputSubsystems.h"\n#include "GameFramework/PlayerController.h"\n#include "GameFramework/FloatingPawnMovement.h"\n#include "GameFramework/SpringArmComponent.h"\n#include "HasardBettingComponent.h"\n#include "InputActionValue.h"\n#include "InputMappingContext.h"\n#include "HasardGameMode.h"\n#include "HasardInteractionComponent.h"\n#include "HasardInteractable.h"\n#include "HasardWheel.h"\n#include "HasardTypes.h"\n#include "Kismet/GameplayStatics.h"\n\nAHasardPlayerPawn::AHasardPlayerPawn()\n{\n\tPrimaryActorTick.bCanEverTick = false;\n\n\tViewRoot = CreateDefaultSubobject&lt;USceneComponent&gt;(TEXT("ViewRoot"));\n\tRootComponent = ViewRoot;\n\n\tCameraBoom = CreateDefaultSubobject&lt;USpringArmComponent&gt;(TEXT("CameraBoom"));\n\tCameraBoom-&gt;SetupAttachment(ViewRoot);\n\tCameraBoom-&gt;bUsePawnControlRotation = true;\n\tCameraBoom-&gt;bDoCollisionTest = false;\n\n\tTableCamera = CreateDefaultSubobject&lt;UCameraComponent&gt;(TEXT("TableCamera"));\n\tTableCamera-&gt;SetupAttachment(CameraBoom, USpringArmComponent::SocketName);\n\tTableCamera-&gt;bUsePawnControlRotation = false;\n\n+|\tBodyMesh = CreateDefaultSubobject&lt;USkeletalMeshComponent&gt;(TEXT("BodyMesh"));\n+|\tBodyMesh-&gt;SetupAttachment(ViewRoot);\n+|\n+|\t// No collision on the body. The pawn is moved by FloatingPawnMovement, and a colliding\n+|\t// mesh would both push the camera about and sit in front of every trace the interaction\n+|\t// component fires - which would mean aiming at the felt and hitting your own arm.\n+|\tBodyMesh-&gt;SetCollisionEnabled(ECollisionEnabled::NoCollision);\n+|\tBodyMesh-&gt;SetGenerateOverlapEvents(false);\n+|\n\tMovement = CreateDefaultSubobject&lt;UFloatingPawnMovement&gt;(TEXT("Movement"));\n\n\t// A walk, not a sprint. The defaults are 1200 uu/s, which crosses the whole felt in\n\t// under a second and makes aiming at a 24 cm cell a matter of luck.\n\tMovement-&gt;MaxSpeed = 250.0f;\n\tMovement-&gt;Acceleration = 1200.0f;\n\tMovement-&gt;Deceleration = 2400.0f;\n\n\tBettingComp = CreateDefaultSubobject&lt;UHasardBettingComponent&gt;(TEXT("BettingComp"));\n\n\tInteractionComp =\n\t\tCreateDefaultSubobject&lt;UHasardInteractionComponent&gt;(TEXT("InteractionComp"));\n}\n\nvoid AHasardPlayerPawn::OnConstruction(const FTransform&amp; Transform)\n{\n\tSuper::OnConstruction(Transform);\n\n-|\t// HERE, not in the constructor: Blueprint overrides land afterwards.\n-|\tif (CameraBoom)\n-|\t{\n-|\t\tCameraBoom-&gt;TargetArmLength = CameraDistance;\n-|\t}\n+|\t// HERE, not in the constructor: Blueprint overrides land afterwards. bStartInThirdPerson\n+|\t// is one of them, which is why the view is applied from this function and not that one.\n+|\tbThirdPerson = bStartInThirdPerson;\n+|\tApplyViewMode();\n}\n\nvoid AHasardPlayerPawn::BeginPlay()\n{\n\tSuper::BeginPlay();\n+|\n+|\t// Again here. OnConstruction gives the editor viewport the right picture; this is the\n+|\t// one that decides what the player starts the round looking at.\n+|\tbThirdPerson = bStartInThirdPerson;\n+|\tApplyViewMode();\n}\n\nvoid AHasardPlayerPawn::SetupPlayerInputComponent(UInputComponent* PlayerInputComponent)\n{\n\tSuper::SetupPlayerInputComponent(PlayerInputComponent);\n\n\tif (const APlayerController* PC = Cast&lt;APlayerController&gt;(Controller))\n\t{\n\t\tif (UEnhancedInputLocalPlayerSubsystem* Subsystem =\n\t\t\tULocalPlayer::GetSubsystem&lt;UEnhancedInputLocalPlayerSubsystem&gt;(PC-&gt;GetLocalPlayer()))\n\t\t{\n\t\t\tif (TableMappingContext)\n\t\t\t{\n\t\t\t\tSubsystem-&gt;AddMappingContext(TableMappingContext, 0);\n\t\t\t}\n\t\t}\n\t}\n\n\tif (UEnhancedInputComponent* EIC = Cast&lt;UEnhancedInputComponent&gt;(PlayerInputComponent))\n\t{\n\t\tEIC-&gt;BindAction(LookAction,     ETriggerEvent::Triggered, this, &amp;AHasardPlayerPawn::Look);\n\t\tEIC-&gt;BindAction(MoveAction,     ETriggerEvent::Triggered, this, &amp;AHasardPlayerPawn::Move);\n\t\tEIC-&gt;BindAction(PlaceBetAction, ETriggerEvent::Started,   this, &amp;AHasardPlayerPawn::PlaceBet);\n\t\tEIC-&gt;BindAction(SpinAction,     ETriggerEvent::Started,   this, &amp;AHasardPlayerPawn::RequestSpin);\n+|\t\tEIC-&gt;BindAction(ToggleViewAction, ETriggerEvent::Started, this, &amp;AHasardPlayerPawn::ToggleView);\n\t}\n\telse\n\t{\n\t\tUE_LOG(LogHasard, Error, TEXT("Not on EnhancedInputComponent"));\n+|\t}\n+|}\n+|\n+|void AHasardPlayerPawn::ToggleView()\n+|{\n+|\tbThirdPerson = !bThirdPerson;\n+|\tApplyViewMode();\n+|\n+|\tUE_LOG(LogHasard, Warning, TEXT("View: %s"),\n+|\t\tbThirdPerson ? TEXT("third person") : TEXT("first person"));\n+|}\n+|\n+|void AHasardPlayerPawn::ApplyViewMode()\n+|{\n+|\tif (CameraBoom)\n+|\t{\n+|\t\t// Zero puts the camera back at ViewRoot, which is where the head is. CameraDistance\n+|\t\t// pulls it to where this table has been filmed from since guide 2.\n+|\t\tCameraBoom-&gt;TargetArmLength = bThirdPerson ? CameraDistance : 0.0f;\n+|\t}\n+|\n+|\tif (BodyMesh)\n+|\t{\n+|\t\t// The whole body, not the head alone. At arm length zero the camera is inside the\n+|\t\t// skull, and hiding one bone to fix that is a longer argument than it is worth.\n+|\t\tBodyMesh-&gt;SetVisibility(bThirdPerson, true);\n\t}\n}\n\nvoid AHasardPlayerPawn::Look(const FInputActionValue&amp; Value)\n{\n\tconst FVector2D Input = Value.Get&lt;FVector2D&gt;();\n\tAddControllerYawInput(Input.X);\n\tAddControllerPitchInput(Input.Y);\n}\n\nvoid AHasardPlayerPawn::Move(const FInputActionValue&amp; Value)\n{\n\tconst FVector2D Input = Value.Get&lt;FVector2D&gt;();\n\n\t// Yaw only. Pitch belongs to the camera: looking down at the felt must not mean\n\t// walking into the floor, and looking up must not lift you off it.\n\tconst FRotator YawOnly(0.0f, GetControlRotation().Yaw, 0.0f);\n\n\tAddMovementInput(YawOnly.RotateVector(FVector::ForwardVector), Input.Y);\n\tAddMovementInput(YawOnly.RotateVector(FVector::RightVector), Input.X);\n}\n\nvoid AHasardPlayerPawn::PlaceBet()\n{\n\tif (!InteractionComp)\n\t{\n\t\treturn;\n\t}\n\n\t// This frame\'s hover, not a fresh trace. The two would almost always agree, and the\n\t// times they would not are the times it matters: a trace taken a frame after the one\n\t// that drew the preview can resolve to the neighboring position, and the player\n\t// would be charged for a bet other than the one they were looking at.\n\tFHitResult Hit;\n\tif (!InteractionComp-&gt;GetHoveredHit(Hit))\n\t{\n\t\treturn;\n\t}\n\n\tAActor* HitActor = Hit.GetActor();\n\tif (HitActor &amp;&amp; HitActor-&gt;Implements&lt;UHasardInteractable&gt;())\n\t{\n\t\t// ImpactPoint, not the actor location: on the felt the point is the bet.\n\t\tIHasardInteractable::Execute_OnPlayerInteract(HitActor, this, Hit.ImpactPoint);\n\t}\n}\n\nvoid AHasardPlayerPawn::RequestSpin()\n{\n\tAActor* Found = UGameplayStatics::GetActorOfClass(GetWorld(), AHasardWheel::StaticClass());\n\tif (AHasardWheel* Wheel = Cast&lt;AHasardWheel&gt;(Found))\n\t{\n\t\tWheel-&gt;StartSpin();\n\t}\n\telse\n\t{\n\t\tUE_LOG(LogHasard, Warning, TEXT("Spin requested, but there is no wheel in the level"));\n\t}\n}\n\nvoid AHasardPlayerPawn::SettleRound(int32 WinningPocket)\n{\n\t// Through the GameMode now, because the GameMode owns the payout table. The\n\t// console test and the wheel therefore travel the same path.\n\tif (AHasardGameMode* GM = GetWorld()-&gt;GetAuthGameMode&lt;AHasardGameMode&gt;())\n\t{\n\t\tGM-&gt;ResolveRound(WinningPocket);\n\t}\n}\n+|</code></pre><p><b>3.</b> Save all, close the editor, <code>Ctrl+Shift+B</code>, reopen. No <code>Build.cs</code> change is needed &mdash; <code>USkeletalMeshComponent</code> is in <b>Engine</b>, which is already a dependency.</p><p><b>Phase 2 &mdash; get a body into the project.</b></p><p><b>4.</b> Content Browser &rarr; the green <b>Add</b> button &rarr; <b>Add Feature or Content Pack&hellip;</b> &rarr; the <b>Blueprint Feature</b> tab &rarr; <b>Third Person</b> &rarr; <b>Add to Project</b>. It drops a folder of characters and animations into <code>Content/</code>. Ignore everything in it except the skeletal mesh and the animation blueprint.</p><p><b>5.</b> Open <code>BP_PlayerPawn</code>. In the <b>Components</b> panel select <b>BodyMesh</b>, then in Details:</p><p><b>Skeletal Mesh Asset</b> &mdash; open the picker and type <code>SKM_</code>. Pick the mannequin body. <b>Anim Class</b> &mdash; type <code>ABP_</code> and pick the one whose name matches the mesh you just chose.</p><p><b>The names differ between engine versions and between packs, so read them out of the picker rather than typing a path.</b> If no animation blueprint matches the skeleton, leave <b>Anim Class</b> as <b>None</b>: you get a body in a T-pose, which is ugly and still proves the framing. The view toggle does not depend on it.</p><p><b>6.</b> Still on <b>BodyMesh</b>, in <b>Transform</b>: set <b>Location Z</b> to roughly <code>-160</code> and adjust until the feet are on the floor rather than sunk into it or hovering. The pawn&rsquo;s origin is its eye point &mdash; that is where the camera boom sits &mdash; so the body hangs down from it. If the body faces sideways, <b>Rotation Z</b> of <code>-90</code> is the usual fix for the mannequin.</p><p><b>Phase 3 &mdash; the key.</b></p><p><b>7.</b> Content Browser, in the folder your other input assets live in: right-click &rarr; <b>Input</b> &rarr; <b>Input Action</b>. Name it <code>IA_ToggleView</code>. Open it and set <b>Value Type</b> to <b>Digital (bool)</b>. Save.</p><p><b>8.</b> Open <code>BP_PlayerPawn</code> &rarr; <b>Class Defaults</b> &rarr; <b>Hasard | Input</b> and note which asset is in <b>Table Mapping Context</b>. Open that asset.</p><p><b>9.</b> In it, <b>+</b> next to <b>Mappings</b>, set the action to <code>IA_ToggleView</code>, and bind the key to <b>V</b>. No triggers, no modifiers. Save.</p><p><b>It goes in that context and not a new one.</b> Everything the pause menu and the reality check suppress, they suppress by swapping contexts. A view toggle in its own context would be the one key that still worked while a reality check was on screen, which is exactly the sort of hole module 6 was built to close.</p><p><b>10.</b> Back in <code>BP_PlayerPawn</code> &rarr; <b>Class Defaults</b> &rarr; <b>Hasard | Input</b> &rarr; <b>Toggle View Action</b> = <code>IA_ToggleView</code>. Compile. Save.</p><p><b>Phase 4 &mdash; look at it.</b></p><p><b>11.</b> Play. You are behind a body at the table. Press <b>V</b>:</p><pre><code>LogHasard: Warning: View: first person\nLogHasard: Warning: View: third person</code></pre><p><b>12.</b> Check the three things that have to stay true in both views. The balance, the running spend and the session clock are all still on screen. A bet placed in first person costs the same as one placed in third. And a reality check, if one fires, still lands on top of whichever view you are in.</p><p><b>13.</b> Commit.</p><pre><code>git add Source/Hasard/HasardPlayerPawn.h Source/Hasard/HasardPlayerPawn.cpp\ngit add Content/BP_PlayerPawn.uasset\ngit commit -m &quot;Add a body and a first-person toggle&quot;</code></pre><p><b>The content pack is a large commit.</b> The Third Person folder is meshes, textures and animations, all of it LFS-tracked. Add it deliberately and in its own commit, and check what it costs you against the 10 GiB quota before you push.</p><p><b>The failures worth recognising.</b> <i>V does nothing and the log says nothing</i> means either <b>Toggle View Action</b> is empty on the Blueprint or the mapping went into a different context than the one the pawn adds &mdash; step 8 is how you tell which. <i>The body is there but frozen in a T-pose</i> is <b>Anim Class</b> unset, and is cosmetic. <i>Aiming at the felt stops working in third person</i> means collision came back on <code>BodyMesh</code> in the Blueprint; set it to <b>No Collision</b> there.</p>'},

/* ============================================================
   RENDER ENGINE
   ============================================================ */
const done = new Set();
let cur = 0;
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const TOKENS = new RegExp([
  '(\\/\\*[\\s\\S]*?\\*\\/|\\/\\/[^\\n]*)',
  '("[^"\\n]*")',
  '\\b(UPROPERTY|UFUNCTION|UCLASS|USTRUCT|UENUM|UINTERFACE|UMETA|GENERATED_BODY|UE_LOG|' +
    'DEFINE_LOG_CATEGORY_STATIC|DEFINE_LOG_CATEGORY|DECLARE_LOG_CATEGORY_EXTERN|' +
    'DECLARE_DYNAMIC_MULTICAST_DELEGATE(?:_\\w+)?|DECLARE_DELEGATE(?:_\\w+)?|TEXT|' +
    'check|ensure(?:Always)?)\\b',
  '\\b(class|struct|enum|void|float|double|bool|const|public|private|protected|if|else|' +
    'for|while|return|new|static|virtual|override|template|namespace|true|false|nullptr|' +
    'this|int32|uint8|int16|uint16|string)\\b',
  '\\b([UAFTIEG][A-Z]\\w*)\\b'
].join('|'), 'g');

function hi(code){
  return esc(code).replace(TOKENS, (m, cm, st, mc, kw, ty) => {
    const cls = cm ? 'cm' : st ? 'st' : mc ? 'mc' : kw ? 'kw' : ty ? 'ty' : null;
    return cls ? '<span class="' + cls + '">' + m + '</span>' : m;
  });
}

/* ---- line-level diff markers -------------------------------------------
   Inside a <pre><code> block a line may open with one of three two-character
   markers: "+|" added, "~|" changed, "-|" deleted (shown for context only).
   A line with no marker is unchanged. C++ never legitimately opens a line
   with one of these tokens, so there is no ambiguity.                      */
const LNCLASS = {'+|':'add', '~|':'chg', '-|':'del'};

/* hi() now runs per line rather than over the whole block, which would break a
   C-style comment token spanning several lines. An unmarked block containing
   one falls back to whole-string highlighting. */
const MULTILINE_COMMENT = /\/\*[^]*?\n[^]*?\*\//;

function hiLines(code, preEscaped){
  const lines = code.split('\n');
  const hasMarkers = lines.some(l => LNCLASS[l.substring(0,2)] !== undefined);
  if(!hasMarkers && !preEscaped && MULTILINE_COMMENT.test(code)) return hi(code);
  let out = '';
  for(let i = 0; i < lines.length; i++){
    const cls  = LNCLASS[lines[i].substring(0,2)];
    const body = cls ? lines[i].substring(2) : lines[i];
    out += '<span class="ln' + (cls ? ' ' + cls : '') + '">' +
           (preEscaped ? body : hi(body)) + '</span>';
  }
  return out;
}

/* Panels carry their code as already-escaped HTML, so mark the lines without
   re-escaping or re-highlighting them. */
function markCode(html){
  return html.replace(/<pre><code>([\s\S]*?)<\/code><\/pre>/g,
    (m, body) => '<pre><code>' + hiLines(body, true) + '</code></pre>');
}

function buildNav(){
  const nav = document.getElementById('nav');
  let html = '', lastGrp = '';
  COURSE.forEach((m,i)=>{
    if(m.grp !== lastGrp){ html += '<div class="grp">'+m.grp+'</div>'; lastGrp = m.grp; }
    html += '<button data-i="'+i+'"><span class="n">'+(m.num||String(i).padStart(2,'0'))+'</span>'+m.title+'<span class="dot">&#10003;</span></button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
}

function refreshNav(){
  document.querySelectorAll('#nav button').forEach(b=>{
    const i = +b.dataset.i;
    b.classList.toggle('on', i===cur);
    b.classList.toggle('done', done.has(i));
  });
  const pct = Math.round(done.size/COURSE.length*100);
  document.querySelector('#prog>i').style.width = pct+'%';
  document.getElementById('progtxt').textContent =
    done.size+' of '+COURSE.length+' modules complete'+(done.size===COURSE.length?'  — course finished':'');
}

function renderBlocks(bl){
  return bl.map(b=>{
    switch(b.t){
      case 'h': return '<h3>'+b.x+'</h3>';
      case 'p': return '<p>'+b.x+'</p>';
      case 'code': return '<pre><code>'+hiLines(b.x,false)+'</code></pre>';
      case 'aside': return '<div class="aside"><div class="lab">'+(b.lab||'Why it works')+'</div>'+markCode(b.x.trim().startsWith('<p')?b.x:'<p>'+b.x+'</p>')+'</div>';
      case 'warn': return '<div class="warn"><div class="lab">'+(b.lab||'Careful')+'</div>'+markCode(b.x.trim().startsWith('<p')?b.x:'<p>'+b.x+'</p>')+'</div>';
      case 'rg': return '<div class="rg"><div class="lab">'+(b.lab||'Responsible gaming')+'</div>'+markCode(b.x.trim().startsWith('<p')?b.x:'<p>'+b.x+'</p>')+'</div>';
      case 'build': return '<div class="build"><div class="lab">&#9654; Build &mdash; '+b.title+'</div>'+
        (b.file?'<div class="file">'+b.file+'</div>':'')+markCode(b.x.trim().startsWith('<p')?b.x:'<p>'+b.x+'</p>')+'</div>';
      case 'srcs': return '<div class="srcs"><div class="lab">Epic documentation for this module</div>'+
        b.x.map(s=>'<a href="'+s[1]+'" target="_blank" rel="noopener">'+s[0]+'</a>').join('')+'</div>';
      case 'list': return '<ul>'+b.x.map(li=>'<li>'+li+'</li>').join('')+'</ul>';
      case 'table': return '<table><thead><tr>'+b.head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+
        b.rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
      case 'chk': return '<div class="chk"><div class="lab">Check yourself</div><p class="q">'+b.q+'</p>'+
        '<button onclick="this.parentNode.classList.add(\'open\')">Reveal answer</button>'+
        '<div class="ans">'+b.a+'</div></div>';
    }
    return '';
  }).join('');
}

function renderQuiz(m, idx){
  const isExam = COURSE[idx].grp === 'Assessment';
  let h = '<div class="quiz"><h4>'+(isExam?'Final Examination':'Module '+idx+' Quiz')+'</h4>'+
    '<p class="hint">'+m.quiz.length+' questions. Pick one answer per question; reasoning appears immediately.</p>';
  m.quiz.forEach((q,qi)=>{
    h += '<div class="qi" data-q="'+qi+'"><p class="qt"><span class="num">Q'+(qi+1)+'</span>'+q.q+'</p>';
    q.opts.forEach((o,oi)=>{ h += '<button class="opt" data-q="'+qi+'" data-o="'+oi+'">'+o+'</button>'; });
    h += '<div class="why" data-why="'+qi+'"></div></div>';
  });
  h += '<div class="score" id="score"></div></div>';
  return h;
}

function go(i){
  cur = i;
  const m = COURSE[i];
  const isExam = COURSE[i].grp === 'Assessment';
  const main = document.getElementById('main');
  main.innerHTML =
    '<div class="kicker">'+(isExam?'Assessment':'Module '+(m.num?m.num.replace(/^0/,''):i))+' &middot; '+m.grp+'</div>'+
    '<h2 class="title">'+m.title+'</h2>'+
    '<p class="lede">'+m.lede+'</p>'+
    renderBlocks(m.blocks)+
    renderQuiz(m,i)+
    '<div class="pager">'+
      '<button id="prev" '+(i===0?'disabled':'')+'>&larr; Previous</button>'+
      '<button id="next" class="primary" '+(i===COURSE.length-1?'disabled':'')+'>Next module &rarr;</button>'+
    '</div>';
  window.scrollTo(0,0);

  const answered = {}; let correct = 0;
  main.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick = ()=>{
      const qi = +btn.dataset.q, oi = +btn.dataset.o;
      if(answered[qi]!==undefined) return;
      answered[qi] = oi;
      const q = m.quiz[qi];
      main.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(b=>{
        b.disabled = true;
        if(+b.dataset.o === q.c) b.classList.add('right');
        else if(+b.dataset.o === oi) b.classList.add('wrong');
      });
      if(oi === q.c) correct++;
      const why = main.querySelector('.why[data-why="'+qi+'"]');
      why.innerHTML = (oi===q.c?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q.why;
      why.classList.add('show');
      if(Object.keys(answered).length === m.quiz.length){
        const sc = document.getElementById('score');
        const pct = Math.round(correct/m.quiz.length*100);
        let verdict;
        if(isExam) verdict = correct>=12 ? ' — pass. Go package the build.' : ' — below the pass mark of 12. Revisit the modules named above.';
        else verdict = pct===100 ? ' — clean sweep.' : pct>=60 ? ' — solid. Reread what you missed, then do the Build step.' : ' — reread this module before building.';
        sc.innerHTML = '<b>Score: '+correct+' / '+m.quiz.length+' ('+pct+'%)</b>'+verdict;
        sc.classList.add('show');
        done.add(i); refreshNav();
      }
    };
  });
  const p = document.getElementById('prev'), n = document.getElementById('next');
  if(p) p.onclick = ()=>go(i-1);
  if(n) n.onclick = ()=>go(i+1);
  refreshNav();
}

buildNav(); go(0);
</script>
</body>
</html>
