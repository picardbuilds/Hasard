<script>
const COURSE = [

/* ---------------------------------------------------------- 0 */
{
grp:"Orientation",
title:"A six-second pause and a blank disk",
lede:"The wheel picks a number after waiting six seconds, and nothing on screen moves while it does. This guide gives the result a journey - and decides what that journey is not allowed to do.",
blocks:[
{t:'h',x:'What the wheel actually is'},
{t:'p',x:'Open <code>HasardWheel.cpp</code> and read <code>StartSpin</code>. It sets a timer for six seconds. <code>FinishSpin</code> then picks a number and broadcasts it. Between those two moments the code does nothing at all, because <code>PrimaryActorTick.bCanEverTick</code> is <code>false</code> and there is nothing to tick.'},
{t:'p',x:'The actor has a <code>WheelMesh</code> and a <code>BallMesh</code>. Neither has ever moved.'},
{t:'p',x:'That was the right call in guide 2. The number is the only part of a wheel that settlement cares about, and building the number first is why three guides of betting, payouts, felt and persistence could be built on top of it. But everything downstream is finished now, and the wheel is still a random number generator with a delay in front of it.'},
{t:'table',head:['What the player gets today','What this guide builds'],rows:[['Six seconds of nothing, then a number in the log','A rim that turns, a ball that slows, and a number you read off the wheel'],['A blank disk','Thirty-seven numerals in the order a real wheel uses'],['The result chosen when the six seconds run out','The result chosen before the first frame, and honoured by every frame after it'],['No way to stop except closing the process','A menu, one action away, that does not argue with you']]},
{t:'h',x:'The order of two lines has to change'},
{t:'p',x:'To animate a ball arriving somewhere, you have to know where before you start. So <code>DetermineWinningPocket()</code> moves out of <code>FinishSpin</code> and into <code>StartSpin</code>, and the six seconds stop being a wait and become a journey to a known destination.'},
{t:'p',x:'That sounds like it should be a fairness problem and it is the exact opposite. A result decided at <code>t = 0</code> cannot be influenced by frame rate, by a hitch, or by how long the animation happened to run. The distribution test still measures the same <code>FMath::RandRange</code> over the same range, so the 370,000-spin evidence in <code>docs/distribution-test.md</code> keeps its meaning without being re-run.'},
{t:'aside',lab:'The decision nobody wrote down',x:'Open decision 3 in <code>docs/leftover.md</code> is still <i>&ldquo;spin result: predetermined, or emergent from ball physics &mdash; undecided&rdquo;</i>, and <code>CLAUDE.md</code>&rsquo;s log entry for 2026-08-06 only notes that it had become partly a responsible-gaming question rather than a purely technical one. Guide 2 settled it in code &mdash; <code>FMath::RandRange</code> is a predetermined spin &mdash; and nobody ever recorded that. It has been the most consequential architectural decision in the project, load-bearing under three guides, and undocumented in both places that were supposed to hold it. Module 5 writes the decision-log entry that closes it. Worth noticing how quietly that happened.'},
{t:'h',x:'The rule this guide is built around'},
{t:'rg',lab:'The ball landing one pocket over is a loss',x:'<p><code>CLAUDE.md</code> lists this under <b>never implement</b>, and the wording is not general:</p><p><i>&ldquo;<b>Near-miss animations</b>, or any feedback that makes a loss feel close. The ball landing one pocket over is a loss and must read as a loss.&rdquo;</i></p><p>That sentence was written months before there was a ball. It is about the animation you are about to build, and it is the reason this guide is worth writing rather than following a spinning-wheel tutorial.</p><p>Here is the uncomfortable part. Deciding the result up front is what makes the animation fair, and it is <i>also</i> what makes the near miss possible: from the first frame the game knows the player has lost, and it has six seconds in which to make that feel like it nearly did not happen. Every commercial product on the market spends those six seconds exactly that way. You are about to create the gap deliberately, because there is no way to animate without it.</p>'},
{t:'chk',q:'If the near miss is such a hazard, why not sidestep it entirely &mdash; simulate a real ball and read off wherever it lands? Then nobody knows the answer in advance.',a:'<p><b>Because it trades a discipline problem for a fairness problem that cannot be fixed.</b> A simulated ball&rsquo;s landing distribution depends on the physics substep rate, the initial conditions, and the collision solver. It is not uniform, it is not measurable in advance, and it changes when the frame rate does.</p><p>The HUD says every bet here costs 2.70% of what you stake. That is a claim about the distribution over 37 pockets. With a simulated ball you could not make it, and <code>docs/distribution-test.md</code> could not be written &mdash; you would be showing a number you had no evidence for, which is the one thing this project exists not to do.</p><p>And it would not even remove the temptation. Nudging initial conditions is how a physical result gets steered, and it is far harder to audit than an animation, because there is no line of code that says <code>Target</code>. A predetermined result plus a stated refusal is honest and checkable. A simulated one is neither.</p>'},
{t:'h',x:'What you will build'},
{t:'list',x:['<b>Module 1</b> &mdash; the rim: thirty-seven numbers in their physical order, an audit that proves the list is still a wheel, and the arithmetic that turns a number into an angle.','<b>Module 2</b> &mdash; the numerals, generated from that order and coloured from the felt&rsquo;s own red list.','<b>Module 3</b> &mdash; the pockets: a coloured plate under every numeral, the numerals turned white, and an unscaled node so nothing on the rim comes out the wrong shape.','<b>Module 4</b> &mdash; the spin: the result decided first, the wheel and ball animated to reach it, frame-rate independent.','<b>Module 5</b> &mdash; what the animation is forbidden to do, and the audit that proves the pocket under the ball is the number that was broadcast.','<b>Module 6</b> &mdash; a menu you can leave from in one action, and the clock that must keep running while you look at it.','<b>Module 7</b> &mdash; a body to stand in and a key to step out of it, for the recording &mdash; and the figures that stay on screen in both views.']},
{t:'p',x:'Everything is generated from primitives. No new meshes, nothing through LFS, and the picture provably matches the data &mdash; the same argument that printed the felt in guide 3.'},
{t:'srcs',x:[['Actor Ticking','https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-ticking-in-unreal-engine'],['Timers','https://dev.epicgames.com/documentation/en-us/unreal-engine/gameplay-timers-in-unreal-engine'],['Array Containers: TArray','https://dev.epicgames.com/documentation/en-us/unreal-engine/array-containers-in-unreal-engine']]}
],
quiz:[
{q:'Moving <code>DetermineWinningPocket()</code> from <code>FinishSpin</code> to <code>StartSpin</code>:',
 opts:['Breaks the distribution test, which will need re-running','Makes the spin unfair, since the result exists before the animation','Keeps the result independent of frame rate, and leaves the distribution test valid','Requires the wheel to tick every frame from then on'],
 c:2,why:'The same RandRange over the same range runs, just earlier. Nothing about the distribution changes, and an outcome fixed at t = 0 cannot be nudged by a hitch or a slow frame.'},
{q:'The reason a simulated ball was rejected is:',
 opts:['Its landing distribution is not uniform, not measurable in advance, and changes with frame rate - so the 2.70% claim could not be supported','Unreal cannot simulate a ball accurately enough','Physics simulation is too expensive on the target machine','It would require a mesh, and Content/ is empty'],
 c:0,why:'The HUD makes a claim about the distribution over 37 pockets. Only a predetermined spin lets that claim be stated and tested.'},
{q:'<code>CLAUDE.md</code> says the ball landing one pocket over must read as a loss. The awkward fact about implementing that is:',
 opts:['The engine has no way to detect an adjacent pocket','It conflicts with the reality check','It cannot be enforced in a Shipping build','Deciding the result up front is what makes the animation fair, and is also exactly what makes a near miss possible'],
 c:3,why:'From frame one the game knows the outcome and has six seconds to dramatise it. The gap is unavoidable; what you do inside it is the whole discipline.'},
{q:'The spin-result decision - predetermined or physics - is currently recorded:',
 opts:['In CLAUDE.md&rsquo;s decision log, dated 2026-08-06','Nowhere. Guide 2 settled it in code and leftover.md still lists it as open','In docs/distribution-test.md','In guide 2&rsquo;s module 13'],
 c:1,why:'CLAUDE.md notes only that it had become a responsible-gaming question. The code answered it and neither document caught up - which is how a load-bearing decision goes three guides without an owner.'},
{q:'The wheel and its numerals are generated from primitives rather than imported as a mesh because:',
 opts:['Unreal cannot import a wheel mesh','Instanced meshes are faster than a single static mesh','The picture provably matches the data, and nothing goes through LFS','A mesh would not support 37 pockets'],
 c:2,why:'The same argument that printed the felt in guide 3 module 7. Hand-aligned numerals on an imported mesh are a second copy of the rim order, and nothing checks a second copy.'}
]
},

/* ---------------------------------------------------------- 1 */
{
grp:"Part I \u2014 The Wheel as Data",
num:"01",
title:"Thirty-seven numbers in the wrong order",
lede:"The wheel knows which number won and has no idea where that number is. This module gives it the rim, the arithmetic that turns a number into an angle, and an audit for the one typo nobody can see.",
blocks:[
{t:'h',x:'A number is not a position'},
{t:'p',x:'<code>DetermineWinningPocket()</code> returns 0 to 36, and that value <i>is</i> the number: <code>SettleRound</code> asks <code>Position-&gt;CoveredNumbers.Contains(WinningPocket)</code> and the whole settlement path works on that basis. Nothing about it needs to change.'},
{t:'p',x:'It is useless for an animation. To land a ball on 17 you need to know where 17 <b>is</b>, and the rim of a roulette wheel is not in numeric order:'},
{t:'code',x:'// Clockwise from zero, on a single-zero wheel:\n0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5,\n24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26\n\n// 17 is the ninth entry, so rim slot 8, at 8 x (360 / 37) = 77.84 degrees.'},
{t:'p',x:'The order is not decoration. Reds and blacks alternate around the rim, and the high and low numbers are distributed so that no arc of the wheel is worth more than any other. It is a design, and like most designs it is not reducible to a formula.'},
{t:'warn',lab:'No arithmetic produces this list',x:'<p>You will be tempted, because the first ten entries look like they might follow a rule. They do not, and any formula you write will be right for most of the wheel and wrong for the rest &mdash; which is the worst possible failure mode, because it works when you test it.</p><p>It is listed for exactly the reason <code>UHasardTableLayout::IsRedNumber</code> lists its eighteen red numbers rather than computing them: the pattern breaks, and listing it is the honest version.</p>'},
{t:'chk',q:'The sequence is 37 entries typed by hand. What is the one kind of typo in it that no amount of playing would ever reveal?',a:'<p><b>A repeat paired with an omission</b> &mdash; say two 26s and no 13. The list is still 37 long, the wheel still spins, settlement is completely unaffected because settlement never reads the rim order at all. Thirty-six numbers animate to the right pocket.</p><p>The thirty-seventh lands the ball on somebody else&rsquo;s number while the log, the HUD and the payout all say something different. A player who noticed would be told they had misread the wheel.</p><p>That is why the sequence is audited on <code>BeginPlay</code> rather than trusted: it is a class of error that a human cannot see in a block of 37 numbers and that gameplay cannot surface.</p>'},
{t:'h',x:'<code>PocketCount</code> stops being a number you can type'},
{t:'p',x:'Today the wheel carries <code>int32 PocketCount = 37</code> as an <code>EditDefaultsOnly</code> property with a <code>ClampMin</code> of 1. Type 38 into it and the wheel announces 38 pockets while the sequence holds 37 entries. <code>DetermineWinningPocket</code> would return a 37 that is not on any rim, and the audit that follows would have nothing to say about it.'},
{t:'p',x:'So the property is deleted, and <code>GetPocketCount()</code> returns <code>GetPocketSequence().Num()</code>. This is the third time the project has made this move &mdash; the lifetime total is computed rather than stored, <code>BoxSize</code> being zero <i>is</i> the fact that a position owns no area, and now the pocket count is the length of the rim rather than a claim about it.'},
{t:'p',x:'The version worth being able to say out loud: <b>an American wheel is not <code>PocketCount = 38</code>.</b> It is a different rim order, a second green pocket, and a payout table whose five-number bet breaks the shared-edge audit at 7.89%. The number was never the thing that would have changed.'},
{t:'warn',lab:'Deleting a property deletes its override too',x:'<p>Guide 3 module 7 met the other half of this: a value already saved on a Blueprint is an override, and an override beats a changed C++ default. Removing the property removes the override with it, which is the clean outcome here rather than a loss.</p><p>What you will actually see is the <b>Pocket Count</b> row vanish from <code>BP_HasardWheel</code>&rsquo;s details panel after the rebuild, and possibly a note in the log about an unknown property while the Blueprint loads once. Both are correct. If instead the editor refuses to open the Blueprint, that is a stale <code>Intermediate/</code> rather than this change &mdash; close the editor, rebuild, reopen.</p>'},
{t:'chk',q:'<code>GetPocketCount()</code> now returns the rim length, but <code>UHasardPayoutTable</code> still has its own <code>PocketCount</code> of 37 that the house edge is computed against. Is that not the duplication this project keeps refusing?',a:'<p><b>It is duplication, and this one is legitimate &mdash; which is a different thing from harmless.</b> They are two genuinely separate facts: the wheel is the physical rim in the level, and the payout table is a data asset a designer may point at an American variant to see the audit fail on purpose. Forcing them to be one value would remove a test fixture the project deliberately keeps.</p><p>What is not acceptable is that they could disagree without anyone hearing about it, because the 2.70% on the HUD is computed from one of them and paid out against the other. So this module adds one line to the <code>BeginPlay</code> audit comparing them. <b>Duplication you have noticed and check is a different animal from duplication you have forgotten.</b></p>'},
{t:'h',x:'Degrees, and why the angle is a Try'},
{t:'p',x:'<code>360 / 37 = 9.7297</code> degrees per pocket. It is worth noticing that this is not a round number and never will be: any code that assumes pockets land on tidy angles, or that rounds an angle to find a pocket, is already wrong.'},
{t:'p',x:'The lookup is <code>TryGetPocketAngleDegrees</code> rather than a getter returning a float, because <b>zero sits at 0.0 degrees</b>. A getter that returned <code>0.0f</code> for &ldquo;not a pocket on this wheel&rdquo; would be handing back a correct-looking answer for the one number most likely to be special-cased wrong. The project already has this pattern in <code>TryGetSharedHouseEdge</code>, for the same reason.'},
{t:'h',x:'The audit that catches the typo'},
{t:'p',x:'<code>AuditPocketSequence</code> runs on <code>BeginPlay</code> and checks three things: every entry is in range for a wheel of this size, no number appears twice, and the count of distinct numbers equals the number of slots. A repeat and an omission fail the third check even when they leave the length correct.'},
{t:'p',x:'It logs one line, in the shape the payout audit established in guide 3 &mdash; the claim stated out loud on every run, rather than a test somebody has to remember to invoke.'},
{t:'build',title:'The rim, and the audit that proves it',file:'Source/Hasard/HasardWheel.h + .cpp, HasardGameMode.h + .cpp',x:'<p><b>Phase 1 &mdash; Visual Studio.</b> No new classes. Four files, all shown complete and marked against what is on disk: <b>+</b> new, <b>~</b> changed, <b>-</b> struck through means delete it.</p> <p><b>1.</b> <code>HasardWheel.h</code>, complete:</p> <pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"\n#include "Engine/EngineTypes.h"\n#include "GameFramework/Actor.h"\n#include "HasardWheel.generated.h"\n\nclass UStaticMeshComponent;\nclass USceneComponent;\n\n/** One parameter means two entries after the name: the type, then the variable name. */\nDECLARE_DYNAMIC_MULTICAST_DELEGATE_OneParam(FOnBallSettled, int32, WinningPocket);\n\nUCLASS()\nclass HASARD_API AHasardWheel : public AActor\n{\n\tGENERATED_BODY()\n\npublic:\n\tAHasardWheel();\n\n\t/** Fired once per spin, when the ball settles. The wheel does not know who listens. */\n\tUPROPERTY(BlueprintAssignable, Category = "Hasard|Wheel")\n\tFOnBallSettled OnBallSettled;\n\n\tUFUNCTION(BlueprintCallable, Category = "Hasard|Wheel")\n\tvoid StartSpin();\n\n+|\t/**\n+|\t * The physical order of the numbers around the rim, clockwise from zero.\n+|\t *\n+|\t * Not a setting and not a preference. This is what a single-zero wheel is, and\n+|\t * nothing else in the project may hold a second copy of it.\n+|\t */\n+|\tstatic const TArray&lt;int32&gt;&amp; GetPocketSequence();\n+|\n~|\t/** How many pockets. The length of the sequence, not a number anyone can type. */\n\tUFUNCTION(BlueprintPure, Category = "Hasard|Wheel")\n~|\tint32 GetPocketCount() const;\n+|\n+|\t/** The number sitting in rim slot RimIndex. INDEX_NONE if that slot does not exist. */\n+|\tUFUNCTION(BlueprintPure, Category = "Hasard|Wheel")\n+|\tint32 GetNumberAtRimIndex(int32 RimIndex) const;\n+|\n+|\t/** Which rim slot holds Number. INDEX_NONE if it is not a pocket on this wheel. */\n+|\tUFUNCTION(BlueprintPure, Category = "Hasard|Wheel")\n+|\tint32 GetRimIndexOf(int32 Number) const;\n+|\n+|\t/**\n+|\t * Degrees clockwise from the zero pocket to Number.\n+|\t *\n+|\t * Try rather than a plain getter because zero sits at 0.0 degrees - so a failed\n+|\t * lookup returning 0.0 would be indistinguishable from a correct answer.\n+|\t */\n+|\tUFUNCTION(BlueprintPure, Category = "Hasard|Wheel")\n+|\tbool TryGetPocketAngleDegrees(int32 Number, float&amp; OutDegrees) const;\n\n\t/** One spin, no animation. Public so the test and real play share one code path. */\n\tint32 DetermineWinningPocket() const;\n\nprotected:\n\tvirtual void PostInitializeComponents() override;\n\tvirtual void BeginPlay() override;\n\tvirtual void EndPlay(const EEndPlayReason::Type EndPlayReason) override;\n\nprivate:\n\t/** Timer callback. Nothing outside the wheel finishes a spin. */\n\tvoid FinishSpin();\n\n+|\t/** Walks the sequence on BeginPlay and says out loud whether it is still a wheel. */\n+|\tvoid AuditPocketSequence() const;\n+|\n\tUPROPERTY(VisibleAnywhere, Category = "Hasard|Wheel")\n\tTObjectPtr&lt;USceneComponent&gt; WheelRoot;\n\n\tUPROPERTY(VisibleAnywhere, Category = "Hasard|Wheel")\n\tTObjectPtr&lt;UStaticMeshComponent&gt; WheelMesh;\n\n\tUPROPERTY(VisibleAnywhere, Category = "Hasard|Wheel")\n\tTObjectPtr&lt;UStaticMeshComponent&gt; BallMesh;\n\n-|\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Wheel",\n-|\t\tmeta = (AllowPrivateAccess = "true", ClampMin = "1"))\n-|\tint32 PocketCount = 37;\n-|\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Wheel",\n\t\tmeta = (AllowPrivateAccess = "true", ClampMin = "0.1"))\n\tfloat SpinDuration = 6.0f;\n\n\t/** Plain struct, not a UObject: no UPROPERTY needed. */\n\tFTimerHandle SpinTimerHandle;\n};\n</code></pre> <p><code>GetPocketSequence()</code> is <code>static</code> and is not a <code>UFUNCTION</code>: it returns a reference to a container, which is C++ ergonomics rather than something a Blueprint should hold. Everything a Blueprint might reasonably want &mdash; the count, a number, a rim slot, an angle &mdash; has its own <code>BlueprintPure</code> accessor above it.</p> <p><b>2.</b> <code>HasardWheel.cpp</code>, complete:</p> <pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#include "HasardWheel.h"\n#include "HasardTypes.h"\n#include "Components/StaticMeshComponent.h"\n#include "Components/SceneComponent.h"\n#include "Engine/World.h"\n#include "TimerManager.h"\n\n+|const TArray&lt;int32&gt;&amp; AHasardWheel::GetPocketSequence()\n+|{\n+|\t// A single-zero wheel, clockwise from zero. Reds and blacks alternate and the high\n+|\t// and low numbers are spread, so that no arc of the rim is worth more than any other.\n+|\t// That is a design, not a pattern, which is why no arithmetic produces it - the same\n+|\t// reason UHasardTableLayout::IsRedNumber lists its eighteen numbers instead of\n+|\t// computing them.\n+|\tstatic const TArray&lt;int32&gt; PocketSequence = {\n+|\t\t 0, 32, 15, 19,  4, 21,  2, 25, 17, 34,\n+|\t\t 6, 27, 13, 36, 11, 30,  8, 23, 10,  5,\n+|\t\t24, 16, 33,  1, 20, 14, 31,  9, 22, 18,\n+|\t\t29,  7, 28, 12, 35,  3, 26 };\n+|\n+|\treturn PocketSequence;\n+|}\n+|\nAHasardWheel::AHasardWheel()\n{\n\tPrimaryActorTick.bCanEverTick = false;\n\n\tWheelRoot = CreateDefaultSubobject&lt;USceneComponent&gt;(TEXT("WheelRoot"));\n\tRootComponent = WheelRoot;\n\n\tWheelMesh = CreateDefaultSubobject&lt;UStaticMeshComponent&gt;(TEXT("WheelMesh"));\n\tWheelMesh-&gt;SetupAttachment(WheelRoot);\n\n\tBallMesh = CreateDefaultSubobject&lt;UStaticMeshComponent&gt;(TEXT("BallMesh"));\n\tBallMesh-&gt;SetupAttachment(WheelRoot);\n\n\tUE_LOG(LogHasard, Warning, TEXT("Wheel: Constructor - %s"),\n\t\t*GetName());\n}\n\nvoid AHasardWheel::PostInitializeComponents()\n{\n\tSuper::PostInitializeComponents();\n\tUE_LOG(LogHasard, Warning, TEXT("Wheel: PostInitializeComponents"));\n}\n\nvoid AHasardWheel::BeginPlay()\n{\n\tSuper::BeginPlay();\n\tUE_LOG(LogHasard, Warning, TEXT("Wheel: BeginPlay"));\n+|\n+|\tAuditPocketSequence();\n}\n\nvoid AHasardWheel::EndPlay(const EEndPlayReason::Type EndPlayReason)\n{\n\tUE_LOG(LogHasard, Warning, TEXT("Wheel: EndPlay"));\n\tGetWorldTimerManager().ClearTimer(SpinTimerHandle);\n\tSuper::EndPlay(EndPlayReason);\n}\n\nvoid AHasardWheel::StartSpin()\n{\n\tif (GetWorldTimerManager().IsTimerActive(SpinTimerHandle))\n\t{\n\t\tUE_LOG(LogHasard, Warning, TEXT("Wheel: StartSpin ignored - a spin is already running"));\n\t\treturn;\n\t}\n\n\tGetWorldTimerManager().SetTimer(SpinTimerHandle, this,\n\t\t&amp;AHasardWheel::FinishSpin, SpinDuration, false);\n}\n\nvoid AHasardWheel::FinishSpin()\n{\n\tconst int32 WinningPocket = DetermineWinningPocket();\n\tOnBallSettled.Broadcast(WinningPocket);\n}\n\nint32 AHasardWheel::DetermineWinningPocket() const\n{\n~|\treturn FMath::RandRange(0, GetPocketCount() - 1);\n}\n\n+|int32 AHasardWheel::GetPocketCount() const\n+|{\n+|\treturn GetPocketSequence().Num();\n+|}\n+|\n+|int32 AHasardWheel::GetNumberAtRimIndex(int32 RimIndex) const\n+|{\n+|\tconst TArray&lt;int32&gt;&amp; Sequence = GetPocketSequence();\n+|\treturn Sequence.IsValidIndex(RimIndex) ? Sequence[RimIndex] : INDEX_NONE;\n+|}\n+|\n+|int32 AHasardWheel::GetRimIndexOf(int32 Number) const\n+|{\n+|\t// IndexOfByKey already returns INDEX_NONE when it finds nothing, which is the\n+|\t// answer this function wants for a number that is not on the wheel.\n+|\treturn GetPocketSequence().IndexOfByKey(Number);\n+|}\n+|\n+|bool AHasardWheel::TryGetPocketAngleDegrees(int32 Number, float&amp; OutDegrees) const\n+|{\n+|\tconst int32 RimIndex = GetRimIndexOf(Number);\n+|\n+|\tif (RimIndex == INDEX_NONE)\n+|\t{\n+|\t\tOutDegrees = 0.0f;\n+|\t\treturn false;\n+|\t}\n+|\n+|\tOutDegrees = 360.0f * static_cast&lt;float&gt;(RimIndex) / static_cast&lt;float&gt;(GetPocketCount());\n+|\treturn true;\n+|}\n+|\n+|void AHasardWheel::AuditPocketSequence() const\n+|{\n+|\tconst TArray&lt;int32&gt;&amp; Sequence = GetPocketSequence();\n+|\tconst int32 Count = Sequence.Num();\n+|\n+|\tTSet&lt;int32&gt; Seen;\n+|\tint32 Offenders = 0;\n+|\n+|\tfor (int32 RimIndex = 0; RimIndex &lt; Count; ++RimIndex)\n+|\t{\n+|\t\tconst int32 Number = Sequence[RimIndex];\n+|\n+|\t\tif (Number &lt; 0 || Number &gt;= Count)\n+|\t\t{\n+|\t\t\tUE_LOG(LogHasard, Error,\n+|\t\t\t\tTEXT("Rim audit: slot %d holds %d, which is not a pocket on a wheel of %d"),\n+|\t\t\t\tRimIndex, Number, Count);\n+|\t\t\t++Offenders;\n+|\t\t\tcontinue;\n+|\t\t}\n+|\n+|\t\tbool bAlreadySeen = false;\n+|\t\tSeen.Add(Number, &amp;bAlreadySeen);\n+|\n+|\t\tif (bAlreadySeen)\n+|\t\t{\n+|\t\t\tUE_LOG(LogHasard, Error, TEXT("Rim audit: slot %d repeats %d"), RimIndex, Number);\n+|\t\t\t++Offenders;\n+|\t\t}\n+|\t}\n+|\n+|\t// The claim, stated on every run: this is a wheel. Every number present, once each,\n+|\t// none invented. A distinct count below the pocket count is a repeat and an omission\n+|\t// in the same list, which is the typo a person cannot see and a spin will not reveal.\n+|\tUE_LOG(LogHasard, Warning,\n+|\t\tTEXT("Rim audit: %d pockets, %d distinct, %d offenders, %.4f degrees each"),\n+|\t\tCount, Seen.Num(), Offenders, 360.0f / static_cast&lt;float&gt;(Count));\n+|}\n</code></pre> <p>The sequence is a function-local <code>static const</code>, constructed once on first use and shared thereafter &mdash; the same shape as the red set in <code>UHasardTableLayout::IsRedNumber</code>. It is laid out ten to a line so that counting it by eye against a photograph of a wheel is possible; the audit is what catches you when it is not.</p> <p><code>GetRimIndexOf</code> is a linear scan of 37 elements and that is the right implementation. A <code>TMap</code> would be a second copy of the sequence to keep in step, for a lookup that happens once per spin.</p> <p><b>3.</b> <code>HasardGameMode.h</code>, complete. One new exec:</p> <pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"\n#include "GameFramework/GameModeBase.h"\n#include "HasardGameMode.generated.h"\n\nclass AHasardWheel;\nclass UHasardPayoutTable;\nclass UHasardTableLayout;\n\nUENUM(BlueprintType)\nenum class EHasardRoundPhase : uint8\n{\n\tBetting  UMETA(DisplayName = "Betting"),\n\tSpinning UMETA(DisplayName = "Spinning"),\n\tSettling UMETA(DisplayName = "Settling")\n};\n\nUCLASS()\nclass HASARD_API AHasardGameMode : public AGameModeBase\n{\n\tGENERATED_BODY()\n\npublic:\n\tAHasardGameMode();\n\n\t/** Console: HasardTestDistribution 370000 */\n\tUFUNCTION(Exec)\n\tvoid HasardTestDistribution(int32 SpinCount);\n\n\t/** Console: HasardShowCell 17 */\n\tUFUNCTION(Exec)\n\tvoid HasardShowCell(int32 Number);\n\n\t/** Console: HasardAuditLayout */\n\tUFUNCTION(Exec)\n\tvoid HasardAuditLayout();\n\n+|\t/** Console: HasardShowPocket 17 */\n+|\tUFUNCTION(Exec)\n+|\tvoid HasardShowPocket(int32 Number);\n+|\n\n\t/** Settles one round against the payout table. */\n\tUFUNCTION(BlueprintCallable, Category = "Hasard|Round")\n\tvoid ResolveRound(int32 WinningPocket);\n\n\t/** The HUD reads odds through this. Const: nothing may edit the table at runtime. */\n\tconst UHasardPayoutTable* GetPayoutTable() const { return PayoutTable; }\n\n\t/** The felt reads its measurements through this. Const for the same reason. */\n\tconst UHasardTableLayout* GetTableLayout() const { return TableLayout; }\n\nprotected:\n\tvirtual void BeginPlay() override;\n\tvirtual void EndPlay(const EEndPlayReason::Type EndPlayReason) override;\n\nprivate:\n\t/** Bound to the wheel delegate in BeginPlay. UFUNCTION is what AddDynamic resolves by name. */\n\tUFUNCTION()\n\tvoid HandleBallSettled(int32 WinningPocket);\n\n\t/** Cached so EndPlay unbinds from the same wheel BeginPlay bound to. */\n\tUPROPERTY()\n\tTObjectPtr&lt;AHasardWheel&gt; BoundWheel;\n\n\t/** Assigned on BP_HasardGameMode. Payouts never come from a literal. */\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Round",\n\t\tmeta = (AllowPrivateAccess = "true"))\n\tTObjectPtr&lt;UHasardPayoutTable&gt; PayoutTable;\n\n\t/** Assigned on BP_HasardGameMode. Measurements never come from a literal either. */\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Round",\n\t\tmeta = (AllowPrivateAccess = "true"))\n\tTObjectPtr&lt;UHasardTableLayout&gt; TableLayout;\n\n\tUPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category = "Hasard|Round",\n\t\tmeta = (AllowPrivateAccess = "true"))\n\tEHasardRoundPhase CurrentPhase = EHasardRoundPhase::Betting;\n\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Round",\n\t\tmeta = (AllowPrivateAccess = "true", ClampMin = "1.0"))\n\tfloat BettingWindowSeconds = 30.0f;\n};\n</code></pre> <p><b>4.</b> <code>HasardGameMode.cpp</code>, complete. The pocket-count cross-check in <code>BeginPlay</code>, and <code>HasardShowPocket</code> at the end:</p> <pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#include "HasardGameMode.h"\n#include "HasardBettingComponent.h"\n#include "HasardPayoutTable.h"\n#include "HasardPlayerController.h"\n#include "HasardPlayerState.h"\n#include "HasardTableLayout.h"\n#include "HasardTypes.h"\n#include "HasardWheel.h"\n#include "GameFramework/Pawn.h"\n#include "Kismet/GameplayStatics.h"\n#include "Engine/World.h"\n\nDEFINE_LOG_CATEGORY(LogHasard);\n\nAHasardGameMode::AHasardGameMode()\n{\n\tPlayerControllerClass = AHasardPlayerController::StaticClass();\n\tPlayerStateClass = AHasardPlayerState::StaticClass();\n}\n\nvoid AHasardGameMode::BeginPlay()\n{\n\tSuper::BeginPlay();\n\n\tUE_LOG(LogHasard, Warning, TEXT("GameMode BeginPlay - phase %s, betting window: %.1fs"),\n\t\t*UEnum::GetValueAsString(CurrentPhase), BettingWindowSeconds);\n\n\tAActor* Found = UGameplayStatics::GetActorOfClass(GetWorld(), AHasardWheel::StaticClass());\n\n\tif (AHasardWheel* Wheel = Cast&lt;AHasardWheel&gt;(Found))\n\t{\n\t\tWheel-&gt;OnBallSettled.AddDynamic(this, &amp;AHasardGameMode::HandleBallSettled);\n\t\tBoundWheel = Wheel;\n\t}\n\telse\n\t{\n\t\tUE_LOG(LogHasard, Error, TEXT("GameMode: no wheel in the level - rounds will never resolve"));\n\t}\n\n\tif (!TableLayout)\n\t{\n\t\tUE_LOG(LogHasard, Error, TEXT("GameMode: no table layout on BP_HasardGameMode"));\n\t}\n\n\tif (!PayoutTable)\n\t{\n\t\tUE_LOG(LogHasard, Error, TEXT("GameMode: no payout table on BP_HasardGameMode"));\n\t\treturn;\n\t}\n\n\t// The audit. Fifteen rows, one line each, and the edge column is the claim\n\t// this project exists to make - so the game states it out loud on every run.\n\tfor (const FHasardPayoutRule&amp; Rule : PayoutTable-&gt;Rules)\n\t{\n\t\tUE_LOG(LogHasard, Warning,\n\t\t\tTEXT("Payout audit: %s pays %d:1, covers %d/%d, true odds %.2f:1, edge %.2f%%"),\n\t\t\t*Rule.DisplayName.ToString(), Rule.PayoutRatio, Rule.CoveredNumbers,\n\t\t\tPayoutTable-&gt;PocketCount, PayoutTable-&gt;GetTrueOdds(Rule),\n\t\t\tPayoutTable-&gt;GetHouseEdge(Rule) * 100.0f);\n\t}\n\n\tfloat SharedEdge = 0.0f;\n\tif (!PayoutTable-&gt;TryGetSharedHouseEdge(SharedEdge))\n\t{\n\t\tUE_LOG(LogHasard, Error,\n\t\t\tTEXT("Payout audit: the rows do not share one edge. A row is wrong."));\n\t}\n\n+|\t// Two objects hold a pocket count. The wheel is the physical rim; the payout table is\n+|\t// what the edge was priced against. They are genuinely separate facts - pointing the\n+|\t// GameMode at an American table is a thing a designer may legitimately do - so they\n+|\t// are allowed to differ. They are not allowed to differ *silently*, because the figure\n+|\t// on the HUD is computed from one of them and paid out against the other.\n+|\tif (BoundWheel &amp;&amp; BoundWheel-&gt;GetPocketCount() != PayoutTable-&gt;PocketCount)\n+|\t{\n+|\t\tUE_LOG(LogHasard, Error,\n+|\t\t\tTEXT("Pocket mismatch: the wheel has %d pockets, the payout table is priced for %d"),\n+|\t\t\tBoundWheel-&gt;GetPocketCount(), PayoutTable-&gt;PocketCount);\n+|\t}\n}\n\nvoid AHasardGameMode::EndPlay(const EEndPlayReason::Type EndPlayReason)\n{\n\t// The rule the PlayerController already follows: whoever binds, unbinds.\n\tif (BoundWheel)\n\t{\n\t\tBoundWheel-&gt;OnBallSettled.RemoveDynamic(this, &amp;AHasardGameMode::HandleBallSettled);\n\t\tBoundWheel = nullptr;\n\t}\n\n\tSuper::EndPlay(EndPlayReason);\n}\n\nvoid AHasardGameMode::HandleBallSettled(int32 WinningPocket)\n{\n\tUE_LOG(LogHasard, Warning, TEXT("Ball settled in pocket %d"), WinningPocket);\n\tResolveRound(WinningPocket);\n}\n\nvoid AHasardGameMode::ResolveRound(int32 WinningPocket)\n{\n\tCurrentPhase = EHasardRoundPhase::Settling;\n\n\tAPawn* PlayerPawn = UGameplayStatics::GetPlayerPawn(GetWorld(), 0);\n\tUHasardBettingComponent* Betting =\n\t\tPlayerPawn ? PlayerPawn-&gt;FindComponentByClass&lt;UHasardBettingComponent&gt;() : nullptr;\n\n\tif (!PayoutTable)\n\t{\n\t\tUE_LOG(LogHasard, Error, TEXT("ResolveRound: no payout table on BP_HasardGameMode"));\n\t}\n\telse if (!TableLayout)\n\t{\n\t\tUE_LOG(LogHasard, Error, TEXT("ResolveRound: no table layout on BP_HasardGameMode"));\n\t}\n\telse if (!Betting)\n\t{\n\t\tUE_LOG(LogHasard, Warning, TEXT("ResolveRound: no betting component to settle"));\n\t}\n\telse\n\t{\n\t\tBetting-&gt;SettleRound(WinningPocket, PayoutTable, TableLayout);\n\t}\n\n\t// Whatever happened above, the table reopens. A round that cannot settle must\n\t// not strand the game in Settling forever.\n\tCurrentPhase = EHasardRoundPhase::Betting;\n}\n\nvoid AHasardGameMode::HasardTestDistribution(int32 SpinCount)\n{\n\tif (SpinCount &lt;= 0)\n\t{\n\t\tUE_LOG(LogHasard, Error, TEXT("SpinCount must be positive"));\n\t\treturn;\n\t}\n\n\tAHasardWheel* Wheel = Cast&lt;AHasardWheel&gt;(\n\t\tUGameplayStatics::GetActorOfClass(this, AHasardWheel::StaticClass()));\n\tif (!Wheel)\n\t{\n\t\tUE_LOG(LogHasard, Error, TEXT("No wheel in the level"));\n\t\treturn;\n\t}\n\n\tconst int32 PocketCount = Wheel-&gt;GetPocketCount();\n\n\tTArray&lt;int32&gt; Counts;\n\tCounts.Init(0, PocketCount);\n\n\tfor (int32 i = 0; i &lt; SpinCount; ++i)\n\t{\n\t\tCounts[Wheel-&gt;DetermineWinningPocket()]++;\n\t}\n\n\tconst float Expected = static_cast&lt;float&gt;(SpinCount) / PocketCount;\n\n\tfor (int32 Pocket = 0; Pocket &lt; PocketCount; ++Pocket)\n\t{\n\t\tconst float Deviation = (Counts[Pocket] - Expected) / Expected * 100.0f;\n\t\tUE_LOG(LogHasard, Display, TEXT("Pocket %2d: %5d hits (%+.1f%% from expected)"),\n\t\t\tPocket, Counts[Pocket], Deviation);\n\t}\n}\n\nvoid AHasardGameMode::HasardShowCell(int32 Number)\n{\n\tif (!TableLayout)\n\t{\n\t\tUE_LOG(LogHasard, Error, TEXT("No table layout on BP_HasardGameMode"));\n\t\treturn;\n\t}\n\n\tif (Number == 0)\n\t{\n\t\tUE_LOG(LogHasard, Display, TEXT("0 has its own box beside the grid, so it has no column or row"));\n\t\treturn;\n\t}\n\n\tconst int32 Column = TableLayout-&gt;GetColumnOf(Number);\n\tconst int32 Row = TableLayout-&gt;GetRowOf(Number);\n\n\tif (Column == INDEX_NONE || Row == INDEX_NONE)\n\t{\n\t\tUE_LOG(LogHasard, Error, TEXT("%d is not a number on this grid"), Number);\n\t\treturn;\n\t}\n\n\tconst FVector2D Center = TableLayout-&gt;GetCellCenter(Column, Row);\n\n\tUE_LOG(LogHasard, Display, TEXT("%d is column %d, row %d - center (%.1f, %.1f), %s"),\n\t\tNumber, Column, Row, Center.X, Center.Y,\n\t\tTableLayout-&gt;IsRedNumber(Number) ? TEXT("red") : TEXT("black"));\n}\n\nvoid AHasardGameMode::HasardAuditLayout()\n{\n\tif (!TableLayout || !PayoutTable)\n\t{\n\t\tUE_LOG(LogHasard, Error,\n\t\t\tTEXT("Assign both TableLayout and PayoutTable on BP_HasardGameMode"));\n\t\treturn;\n\t}\n\n\tTArray&lt;FHasardBetPosition&gt; Positions;\n\tTableLayout-&gt;BuildPositions(Positions);\n\n\t// The claim being tested: every position on a single-zero table pays 2.70% to the house.\n\tconst float ExpectedEdge = 1.0f / static_cast&lt;float&gt;(PayoutTable-&gt;PocketCount);\n\n\tTMap&lt;EHasardBetType, int32&gt; CountByType;\n\tint32 Offenders = 0;\n\n\tfor (const FHasardBetPosition&amp; Position : Positions)\n\t{\n\t\tCountByType.FindOrAdd(Position.BetType)++;\n\n\t\tconst FHasardPayoutRule* Rule = PayoutTable-&gt;FindRule(Position.BetType);\n\t\tif (!Rule)\n\t\t{\n\t\t\tUE_LOG(LogHasard, Error, TEXT("Position %d (%s): no payout row for this bet type"),\n\t\t\t\tPosition.PositionId, *Position.DisplayName.ToString());\n\t\t\t++Offenders;\n\t\t\tcontinue;\n\t\t}\n\n\t\t// Two different CoveredNumbers: the position holds the actual numbers,\n\t\t// the payout row holds how many there are meant to be. They must agree.\n\t\tif (Position.CoveredNumbers.Num() != Rule-&gt;CoveredNumbers)\n\t\t{\n\t\t\tUE_LOG(LogHasard, Error,\n\t\t\t\tTEXT("Position %d (%s): covers %d numbers, payout row expects %d"),\n\t\t\t\tPosition.PositionId, *Position.DisplayName.ToString(),\n\t\t\t\tPosition.CoveredNumbers.Num(), Rule-&gt;CoveredNumbers);\n\t\t\t++Offenders;\n\t\t\tcontinue;\n\t\t}\n\n\t\tif (!FMath::IsNearlyEqual(PayoutTable-&gt;GetHouseEdge(*Rule), ExpectedEdge, 0.0001f))\n\t\t{\n\t\t\tUE_LOG(LogHasard, Error, TEXT("Position %d (%s): edge %.2f%%, expected %.2f%%"),\n\t\t\t\tPosition.PositionId, *Position.DisplayName.ToString(),\n\t\t\t\tPayoutTable-&gt;GetHouseEdge(*Rule) * 100.0f, ExpectedEdge * 100.0f);\n\t\t\t++Offenders;\n\t\t}\n\t}\n\n\t// The printed felt is generated from BoxSize, so a layout that overlaps two boxes\n\t// draws one over the other and looks merely odd. The same numbers feed ResolvePosition,\n\t// which means the odd-looking cell is also the cell whose clicks land somewhere else -\n\t// and that failure is silent. Checked here rather than in the felt because it is a\n\t// property of the layout asset, true or false before anything is drawn.\n\tFVector2D FeltMin, FeltMax;\n\tTableLayout-&gt;GetFeltBounds(FeltMin, FeltMax);\n\n\t// Neighboring boxes share an edge exactly. Shrink both sides of every comparison so\n\t// touching is not reported as overlapping - only a real intersection is.\n\tconst float Shrink = 0.01f;\n\tint32 Boxes = 0;\n\tint32 BoxOffenders = 0;\n\n\tfor (const FHasardBetPosition&amp; Position : Positions)\n\t{\n\t\tif (Position.BoxSize.IsNearlyZero())\n\t\t{\n\t\t\tcontinue;\n\t\t}\n\n\t\t++Boxes;\n\n\t\tconst FVector2D Min = Position.ChipLocation - Position.BoxSize * 0.5f;\n\t\tconst FVector2D Max = Position.ChipLocation + Position.BoxSize * 0.5f;\n\n\t\tif (Min.X &lt; FeltMin.X - Shrink || Min.Y &lt; FeltMin.Y - Shrink\n\t\t\t|| Max.X &gt; FeltMax.X + Shrink || Max.Y &gt; FeltMax.Y + Shrink)\n\t\t{\n\t\t\tUE_LOG(LogHasard, Error,\n\t\t\t\tTEXT("Position %d (%s): box runs outside the felt bounds"),\n\t\t\t\tPosition.PositionId, *Position.DisplayName.ToString());\n\t\t\t++BoxOffenders;\n\t\t}\n\n\t\tfor (const FHasardBetPosition&amp; Other : Positions)\n\t\t{\n\t\t\t// Ids ascend with the array, so the pair is only ever tested once.\n\t\t\tif (Other.PositionId &lt;= Position.PositionId || Other.BoxSize.IsNearlyZero())\n\t\t\t{\n\t\t\t\tcontinue;\n\t\t\t}\n\n\t\t\tconst FVector2D OtherMin = Other.ChipLocation - Other.BoxSize * 0.5f;\n\t\t\tconst FVector2D OtherMax = Other.ChipLocation + Other.BoxSize * 0.5f;\n\n\t\t\tconst bool bOverlaps =\n\t\t\t\tMin.X &lt; OtherMax.X - Shrink &amp;&amp; Max.X &gt; OtherMin.X + Shrink &amp;&amp;\n\t\t\t\tMin.Y &lt; OtherMax.Y - Shrink &amp;&amp; Max.Y &gt; OtherMin.Y + Shrink;\n\n\t\t\tif (bOverlaps)\n\t\t\t{\n\t\t\t\tUE_LOG(LogHasard, Error, TEXT("Positions %d (%s) and %d (%s): boxes overlap"),\n\t\t\t\t\tPosition.PositionId, *Position.DisplayName.ToString(),\n\t\t\t\t\tOther.PositionId, *Other.DisplayName.ToString());\n\t\t\t\t++BoxOffenders;\n\t\t\t}\n\t\t}\n\t}\n\n\tfor (const TPair&lt;EHasardBetType, int32&gt;&amp; Pair : CountByType)\n\t{\n\t\tUE_LOG(LogHasard, Display, TEXT("%s: %d positions"),\n\t\t\t*UEnum::GetDisplayValueAsText(Pair.Key).ToString(), Pair.Value);\n\t}\n\n\tUE_LOG(LogHasard, Display, TEXT("%d positions generated, %d failing the edge check"),\n\t\tPositions.Num(), Offenders);\n\n\tUE_LOG(LogHasard, Display, TEXT("%d of them are printed boxes, %d failing the box check"),\n\t\tBoxes, BoxOffenders);\n}\n+|\n+|void AHasardGameMode::HasardShowPocket(int32 Number)\n+|{\n+|\tAHasardWheel* Wheel = Cast&lt;AHasardWheel&gt;(\n+|\t\tUGameplayStatics::GetActorOfClass(this, AHasardWheel::StaticClass()));\n+|\n+|\tif (!Wheel)\n+|\t{\n+|\t\tUE_LOG(LogHasard, Error, TEXT("No wheel in the level"));\n+|\t\treturn;\n+|\t}\n+|\n+|\tconst int32 RimIndex = Wheel-&gt;GetRimIndexOf(Number);\n+|\n+|\tif (RimIndex == INDEX_NONE)\n+|\t{\n+|\t\tUE_LOG(LogHasard, Error, TEXT("%d is not a pocket on this wheel"), Number);\n+|\t\treturn;\n+|\t}\n+|\n+|\tfloat Degrees = 0.0f;\n+|\tWheel-&gt;TryGetPocketAngleDegrees(Number, Degrees);\n+|\n+|\tconst int32 Count = Wheel-&gt;GetPocketCount();\n+|\n+|\t// The two neighbours are printed because they are how you check this against a\n+|\t// photograph of a real wheel - and because they are the two numbers a near-miss\n+|\t// animation would want to linger on. Worth knowing their names early.\n+|\tconst int32 Before = Wheel-&gt;GetNumberAtRimIndex((RimIndex + Count - 1) % Count);\n+|\tconst int32 After = Wheel-&gt;GetNumberAtRimIndex((RimIndex + 1) % Count);\n+|\n+|\tUE_LOG(LogHasard, Display,\n+|\t\tTEXT("%d is rim slot %d at %.2f degrees, between %d and %d"),\n+|\t\tNumber, RimIndex, Degrees, Before, After);\n+|}\n</code></pre> <p>The exec lives on the GameMode rather than on the wheel because exec functions are only routed through a handful of classes &mdash; the player controller, the pawn, the game mode, the cheat manager. An <code>Exec</code> on an arbitrary actor compiles and is never reachable, which is why <code>HasardShowCell</code> and <code>HasardAuditLayout</code> live here too.</p> <p><b>Phase 2 &mdash; build.</b></p> <p><b>5.</b> Save all with <code>Ctrl+Shift+S</code>. A header changed, so <b>close the editor</b>, then <code>Ctrl+Shift+B</code> and confirm <code>Build: 1 succeeded, 0 failed</code>. Reopen.</p> <p><b>Phase 3 &mdash; observe.</b></p> <p><b>6.</b> Open <code>L_RouletteTest</code>, <b>Window &rarr; Output Log</b>, filter on <code>LogHasard</code>. Press <b>Play</b>. Among the startup lines:</p> <pre><code>LogHasard: Warning: Rim audit: 37 pockets, 37 distinct, 0 offenders, 9.7297 degrees each</code></pre> <p><b>37 and 37 and 0</b> are the three numbers that matter. A distinct count below 37 means a repeat, and the error lines above it name the slot.</p> <p><b>7.</b> Press <code>~</code> and check the arithmetic by hand, the way module 1 of guide 3 had you check <code>HasardShowCell</code>:</p> <pre><code>HasardShowPocket 17</code></pre> <p>One line comes back:</p> <pre><code>LogHasard: Display: 17 is rim slot 8 at 77.84 degrees, between 25 and 34</code></pre> <p>Verify it: 17 is the ninth number in the list, so slot 8; 8 x 9.7297 = 77.84; and the entries either side of it are 25 and 34. If you have a photograph of a European wheel to hand, 25-17-34 is a sequence you can find on it.</p> <p><b>8.</b> Try the edges. <code>HasardShowPocket 0</code> should report rim slot 0 at 0.00 degrees, between 26 and 32 &mdash; the rim wraps, which is the modulo in the neighbour lookup doing its job. <code>HasardShowPocket 37</code> should refuse: <code>37 is not a pocket on this wheel</code>.</p> <p><b>9.</b> Confirm the cross-check is live. Temporarily point <b>BP_HasardGameMode</b>&rsquo;s <b>Payout Table</b> at <code>DA_AmericanPayouts</code>, press Play, and read:</p> <pre><code>LogHasard: Error: Pocket mismatch: the wheel has 37 pockets, the payout table is priced for 38</code></pre> <p>Then put it back to <code>DA_EuropeanPayouts</code>. That asset has earned its keep three times now &mdash; guide 3 module 8 used it to make a missing payout row audible, and here it proves a check that would otherwise only ever print nothing.</p> <p><b>10.</b> Commit.</p> <pre><code>git add -A\ngit commit -m "Add the wheel rim sequence and its audit"</code></pre> <p><b>The failure worth recognising.</b> <code>0 pockets, 0 distinct</code> means <code>GetPocketSequence()</code> returned an empty array, which on a function-local static almost always means the braces of the initialiser list did not survive the paste. Everything downstream divides by that count, so the degrees column will read <code>inf</code> or <code>nan</code> &mdash; and that is the tell.</p>'},
{t:'srcs',x:[['Array Containers: TArray','https://dev.epicgames.com/documentation/en-us/unreal-engine/array-containers-in-unreal-engine'],['Set Containers: TSet','https://dev.epicgames.com/documentation/en-us/unreal-engine/set-containers-in-unreal-engine'],['Console Commands and Cheats','https://dev.epicgames.com/documentation/en-us/unreal-engine/console-commands-and-cheats-in-unreal-engine']]}
],
quiz:[
{q:'The rim sequence is a listed array rather than a computed one because:',
 opts:['A TArray is faster to read than arithmetic','The order is a design, and any formula would be right for part of the wheel and wrong for the rest','Blueprint cannot call arithmetic helpers','The order changes between casinos'],
 c:1,why:'The same reason IsRedNumber lists its eighteen numbers. A formula that works for the first ten entries and fails for four others is worse than no formula, because it passes the test you would think to write.'},
{q:'A typo that repeats one number and omits another would be caught by:',
 opts:['The compiler, since the array length would change','Settlement, which reads the rim order','Playing the game for long enough','The distinct-count check in the BeginPlay audit'],
 c:3,why:'The length stays 37 and settlement never reads the rim at all, so only a check comparing distinct entries against slots will see it. One number in 37 would animate to the wrong pocket, silently.'},
{q:'<code>PocketCount</code> is deleted as an editable property because:',
 opts:['A wheel of a different size is expressed by a different rim order, not by a different number','EditDefaultsOnly properties cannot be read at runtime','It was never used','ClampMin does not work on int32'],
 c:0,why:'An American wheel is a different sequence, a second green pocket and a payout table that fails the shared-edge audit. Typing 38 into a box would have produced a wheel with a pocket that is not on any rim.'},
{q:'<code>TryGetPocketAngleDegrees</code> uses the Try pattern rather than returning a float because:',
 opts:['Blueprint cannot return floats','The angle can exceed the range of a float','Zero sits at 0.0 degrees, so a failure value of 0.0 would look like a correct answer','It needs to report which rim slot was used'],
 c:2,why:'Exactly the shape of TryGetSharedHouseEdge. Returning a plausible number on failure is worse than returning nothing, and zero is the number most likely to be special-cased wrong.'},
{q:'The wheel and the payout table both hold a pocket count. The module&rsquo;s position on that is:',
 opts:['One of them must be deleted','They should be merged into the layout asset','It does not matter, since both are 37','They are separate facts and may differ - but not silently, so the audit compares them'],
 c:3,why:'Pointing the GameMode at DA_AmericanPayouts is a deliberate test fixture. What was missing was anything that noticed, given the HUD figure is computed from one and paid against the other.'},
{q:'<code>HasardShowPocket</code> is declared on the GameMode rather than on the wheel because:',
 opts:['The wheel has no access to the payout table','Exec functions are only routed through a few classes, and an arbitrary actor is not one of them','AActor cannot declare UFUNCTIONs','The wheel is spawned too late to register commands'],
 c:1,why:'An Exec on a plain actor compiles cleanly and is never reachable from the console. HasardShowCell and HasardAuditLayout live on the GameMode for the same reason.'}
]
},

/* --------------------------------------------------------- 02 */
{
grp:"Part I \u2014 The Wheel as Data",
num:"02",
title:"Numerals around the rim",
lede:"Thirty-seven numbers printed from the sequence the ball will use, coloured from the red list the felt already owns - and one attachment that decides how the next module works.",
blocks:[
{t:'h',x:'A rim with no writing on it'},
{t:'p',x:'The wheel now knows the order of its numbers and can put an angle on any of them. Nothing shows that to anyone. This module prints thirty-seven numerals around the rim, from the same sequence the ball will use, which is the wheel&rsquo;s version of what guide 3 module 4 did to the felt with its forty-nine labels.'},
{t:'p',x:'One line in it decides how the rim turns, and module 3 revisits it:'},
{t:'code',x:'Numeral->AttachToComponent(WheelMesh, FAttachmentTransformRules::KeepRelativeTransform);'},
{t:'p',x:'Attached to the rim rather than to the actor root, so that turning the rim turns the numbers with it. Module 3 gives them a better parent for it, and module 4 then rotates exactly one component with the numerals along for free. Attach them to the root instead and the wheel spins under a set of numbers that stay put, which looks almost right and is completely wrong.'},
{t:'warn',lab:'Movable before RegisterComponent, not after',x:'<p>A component made with <code>NewObject</code> is <b>static</b>. Register it first and every transform you set afterwards logs a warning and is then ignored, so all thirty-seven numerals stack at the hub.</p><p>The felt met this in guide 3 module 4 and the order there is the order here: <code>SetMobility</code>, then <code>RegisterComponent</code>, then <code>AttachToComponent</code>, then the transform.</p>'},
{t:'h',x:'The red list already exists, and it is not here'},
{t:'p',x:'Colouring a numeral needs to know whether its number is red, and the eighteen reds are already listed once, in <code>UHasardTableLayout::IsRedNumber</code>. The wheel needs that list and must not own a second copy of it.'},
{t:'p',x:'So the wheel asks the GameMode, which already holds the layout asset and already exposes a const getter for it. The PlayerController has read the payout table exactly this way since guide 3 module 12, so the route is established rather than invented.'},
{t:'code',x:'const AHasardGameMode* GM = GetWorld() ? GetWorld()->GetAuthGameMode<AHasardGameMode>() : nullptr;\nconst UHasardTableLayout* Layout = GM ? GM->GetTableLayout() : nullptr;'},
{t:'chk',q:'<code>BP_Felt</code> has its own <b>Table Layout</b> property. Why does <code>BP_WHEEL</code> not get one?',a:'<p><b>Because it would be a third assignment of one asset, and a third chance to forget one.</b> The GameMode holds it, the felt holds it, and adding the wheel means three details panels have to agree before the table is correct.</p><p>Being honest about it: the felt&rsquo;s own property is the odd one out, not the wheel. If the felt were written today it would ask the GameMode too. It is not worth changing now for its own sake &mdash; but it is worth knowing that the pattern you are copying here is the better of the two, and that the older one survives because it works rather than because it was chosen.</p>'},
{t:'rg',lab:'Zero is not a black number',x:'<p>The felt made this argument in guide 3 module 4 and the rim inherits it. Thirty-seven pockets, and every bet on the table is priced as though there were thirty-six. Zero is the difference &mdash; it is the entire 2.70% the HUD names &mdash; and on the rim its colour is the only thing that says so.</p><p>The ordering matters as much as the colour. <code>NumeralColorFor</code> tests <code>Number == 0</code> <b>before</b> calling <code>IsRedNumber</code>, because zero is not in the red set and a reversed test would quietly print it in the black ink, filed among the losers it takes money from.</p>'},
{t:'h',x:'One negation, in one place'},
{t:'p',x:'The rim sequence is described clockwise from zero. Unreal&rsquo;s yaw runs counter-clockwise. Something has to reconcile the two, and the only safe number of places for that to happen is one.'},
{t:'p',x:'<code>TryGetPocketYaw</code> is that place. It calls <code>TryGetPocketAngleDegrees</code> and negates it, and from here on everything that puts something on the rim or reads something off it goes through this function &mdash; the numerals in this module, the plates in module 3, the ball in module 4, the landing check in module 5.'},
{t:'chk',q:'Suppose the numerals used one sign and the ball used the other. What would you actually see?',a:'<p><b>A wheel that works, and a ball that lands on the wrong number every single time</b> &mdash; specifically on the mirror image of the right one about the zero pocket.</p><p>The trap is that nothing looks broken. The numerals are evenly spaced and in a plausible order, the ball travels smoothly and settles in a pocket, and the log names a real number. You would be looking at a correct animation of a mirrored wheel, and the natural diagnosis is &ldquo;the landing is off&rdquo; rather than &ldquo;the numbers are printed backwards&rdquo;. That is several hours of looking in the wrong file, avoided by one function.</p>'},
{t:'build',title:'Thirty-seven numerals, from the sequence',file:'Source/Hasard/HasardWheel.h + .cpp, BP_WHEEL',x:'<p><b>Phase 1 &mdash; Visual Studio.</b> Two files, both complete, marked against module 1: <b>+</b> new, <b>~</b> changed.</p> <p><b>1.</b> <code>HasardWheel.h</code>, complete:</p> <pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"\n#include "Engine/EngineTypes.h"\n#include "GameFramework/Actor.h"\n#include "HasardWheel.generated.h"\n\n+|class UHasardTableLayout;\nclass UStaticMeshComponent;\nclass USceneComponent;\n+|class UTextRenderComponent;\n\n/** One parameter means two entries after the name: the type, then the variable name. */\nDECLARE_DYNAMIC_MULTICAST_DELEGATE_OneParam(FOnBallSettled, int32, WinningPocket);\n\nUCLASS()\nclass HASARD_API AHasardWheel : public AActor\n{\n\tGENERATED_BODY()\n\npublic:\n\tAHasardWheel();\n\n\t/** Fired once per spin, when the ball settles. The wheel does not know who listens. */\n\tUPROPERTY(BlueprintAssignable, Category = "Hasard|Wheel")\n\tFOnBallSettled OnBallSettled;\n\n\tUFUNCTION(BlueprintCallable, Category = "Hasard|Wheel")\n\tvoid StartSpin();\n\n\t/**\n\t * The physical order of the numbers around the rim, clockwise from zero.\n\t *\n\t * Not a setting and not a preference. This is what a single-zero wheel is, and\n\t * nothing else in the project may hold a second copy of it.\n\t */\n\tstatic const TArray&lt;int32&gt;&amp; GetPocketSequence();\n\n\t/** How many pockets. The length of the sequence, not a number anyone can type. */\n\tUFUNCTION(BlueprintPure, Category = "Hasard|Wheel")\n\tint32 GetPocketCount() const;\n\n\t/** The number sitting in rim slot RimIndex. INDEX_NONE if that slot does not exist. */\n\tUFUNCTION(BlueprintPure, Category = "Hasard|Wheel")\n\tint32 GetNumberAtRimIndex(int32 RimIndex) const;\n\n\t/** Which rim slot holds Number. INDEX_NONE if it is not a pocket on this wheel. */\n\tUFUNCTION(BlueprintPure, Category = "Hasard|Wheel")\n\tint32 GetRimIndexOf(int32 Number) const;\n\n\t/**\n\t * Degrees clockwise from the zero pocket to Number.\n\t *\n\t * Try rather than a plain getter because zero sits at 0.0 degrees - so a failed\n\t * lookup returning 0.0 would be indistinguishable from a correct answer.\n\t */\n\tUFUNCTION(BlueprintPure, Category = "Hasard|Wheel")\n\tbool TryGetPocketAngleDegrees(int32 Number, float&amp; OutDegrees) const;\n\n+|\t/**\n+|\t * Local yaw of the pocket holding Number.\n+|\t *\n+|\t * The rim is described clockwise from zero; yaw runs counter-clockwise. The negation\n+|\t * that reconciles the two lives here and nowhere else, so the numerals and the ball\n+|\t * cannot end up disagreeing about which way round the wheel goes.\n+|\t */\n+|\tUFUNCTION(BlueprintPure, Category = "Hasard|Wheel")\n+|\tbool TryGetPocketYaw(int32 Number, float&amp; OutYaw) const;\n+|\n\t/** One spin, no animation. Public so the test and real play share one code path. */\n\tint32 DetermineWinningPocket() const;\n\nprotected:\n\tvirtual void PostInitializeComponents() override;\n\tvirtual void BeginPlay() override;\n\tvirtual void EndPlay(const EEndPlayReason::Type EndPlayReason) override;\n\nprivate:\n\t/** Timer callback. Nothing outside the wheel finishes a spin. */\n\tvoid FinishSpin();\n\n\t/** Walks the sequence on BeginPlay and says out loud whether it is still a wheel. */\n\tvoid AuditPocketSequence() const;\n\n+|\t/** Destroys any numerals and prints a fresh set from the rim sequence. */\n+|\tvoid BuildNumerals();\n+|\n+|\t/** Red, black, or green for zero. The felt owns the red list; this reads it. */\n+|\tFColor NumeralColorFor(int32 Number, const UHasardTableLayout* Layout) const;\n+|\n\tUPROPERTY(VisibleAnywhere, Category = "Hasard|Wheel")\n\tTObjectPtr&lt;USceneComponent&gt; WheelRoot;\n\n\tUPROPERTY(VisibleAnywhere, Category = "Hasard|Wheel")\n\tTObjectPtr&lt;UStaticMeshComponent&gt; WheelMesh;\n\n\tUPROPERTY(VisibleAnywhere, Category = "Hasard|Wheel")\n\tTObjectPtr&lt;UStaticMeshComponent&gt; BallMesh;\n\n+|\t/** Every numeral this actor made. UPROPERTY so the collector can see them. */\n+|\tUPROPERTY()\n+|\tTArray&lt;TObjectPtr&lt;UTextRenderComponent&gt;&gt; Numerals;\n+|\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Wheel",\n\t\tmeta = (AllowPrivateAccess = "true", ClampMin = "0.1"))\n\tfloat SpinDuration = 6.0f;\n+|\n+|\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Numerals",\n+|\t\tmeta = (AllowPrivateAccess = "true"))\n+|\tbool bShowNumerals = true;\n+|\n+|\t/** Distance from the hub to the middle of a numeral, in centimetres. */\n+|\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Numerals",\n+|\t\tmeta = (AllowPrivateAccess = "true", ClampMin = "1.0"))\n+|\tfloat NumeralRadius = 45.0f;\n+|\n+|\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Numerals",\n+|\t\tmeta = (AllowPrivateAccess = "true", ClampMin = "0.1"))\n+|\tfloat NumeralTextSize = 6.0f;\n+|\n+|\t/** Lifted off the rim so the numerals are not co-planar with whatever is under them. */\n+|\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Numerals",\n+|\t\tmeta = (AllowPrivateAccess = "true"))\n+|\tfloat NumeralZOffset = 0.5f;\n+|\n+|\t/**\n+|\t * Base orientation of a numeral before its own pocket yaw is added.\n+|\t *\n+|\t * Pitch 90 lays the text flat on a horizontal rim, exactly as LabelRotation does on\n+|\t * the felt. If the numerals come out mirrored or upside-down, this is the knob - the\n+|\t * felt needed the same tuning and for the same reason.\n+|\t */\n+|\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Numerals",\n+|\t\tmeta = (AllowPrivateAccess = "true"))\n+|\tFRotator NumeralRotation = FRotator(90.0f, 180.0f, 0.0f);\n+|\n+|\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Numerals",\n+|\t\tmeta = (AllowPrivateAccess = "true"))\n+|\tFColor RedNumeralColor = FColor(200, 32, 32);\n+|\n+|\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Numerals",\n+|\t\tmeta = (AllowPrivateAccess = "true"))\n+|\tFColor BlackNumeralColor = FColor(24, 24, 24);\n+|\n+|\t/** Zero is the house edge. It does not share a colour with anything else on the rim. */\n+|\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Numerals",\n+|\t\tmeta = (AllowPrivateAccess = "true"))\n+|\tFColor ZeroNumeralColor = FColor(16, 132, 72);\n\n\t/** Plain struct, not a UObject: no UPROPERTY needed. */\n\tFTimerHandle SpinTimerHandle;\n};\n</code></pre> <p>Every numeral property is <code>EditDefaultsOnly</code> with a clamp, because every one of them is a measurement a designer may reasonably want to nudge and none of them is meaningful at zero. <code>NumeralRotation</code> is the one that is not a measurement: it is the orientation the text starts from, before each numeral&rsquo;s own yaw is added to it.</p> <p><b>2.</b> <code>HasardWheel.cpp</code>, complete:</p> <pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#include "HasardWheel.h"\n+|#include "HasardGameMode.h"\n+|#include "HasardTableLayout.h"\n#include "HasardTypes.h"\n+|#include "Components/SceneComponent.h"\n#include "Components/StaticMeshComponent.h"\n~|#include "Components/TextRenderComponent.h"\n#include "Engine/World.h"\n#include "TimerManager.h"\n\nconst TArray&lt;int32&gt;&amp; AHasardWheel::GetPocketSequence()\n{\n\t// A single-zero wheel, clockwise from zero. Reds and blacks alternate and the high\n\t// and low numbers are spread, so that no arc of the rim is worth more than any other.\n\t// That is a design, not a pattern, which is why no arithmetic produces it - the same\n\t// reason UHasardTableLayout::IsRedNumber lists its eighteen numbers instead of\n\t// computing them.\n\tstatic const TArray&lt;int32&gt; PocketSequence = {\n\t\t 0, 32, 15, 19,  4, 21,  2, 25, 17, 34,\n\t\t 6, 27, 13, 36, 11, 30,  8, 23, 10,  5,\n\t\t24, 16, 33,  1, 20, 14, 31,  9, 22, 18,\n\t\t29,  7, 28, 12, 35,  3, 26 };\n\n\treturn PocketSequence;\n}\n\nAHasardWheel::AHasardWheel()\n{\n\tPrimaryActorTick.bCanEverTick = false;\n\n\tWheelRoot = CreateDefaultSubobject&lt;USceneComponent&gt;(TEXT("WheelRoot"));\n\tRootComponent = WheelRoot;\n\n\tWheelMesh = CreateDefaultSubobject&lt;UStaticMeshComponent&gt;(TEXT("WheelMesh"));\n\tWheelMesh-&gt;SetupAttachment(WheelRoot);\n\n\tBallMesh = CreateDefaultSubobject&lt;UStaticMeshComponent&gt;(TEXT("BallMesh"));\n\tBallMesh-&gt;SetupAttachment(WheelRoot);\n\n\tUE_LOG(LogHasard, Warning, TEXT("Wheel: Constructor - %s"),\n\t\t*GetName());\n}\n\nvoid AHasardWheel::PostInitializeComponents()\n{\n\tSuper::PostInitializeComponents();\n\tUE_LOG(LogHasard, Warning, TEXT("Wheel: PostInitializeComponents"));\n}\n\nvoid AHasardWheel::BeginPlay()\n{\n\tSuper::BeginPlay();\n\tUE_LOG(LogHasard, Warning, TEXT("Wheel: BeginPlay"));\n\n\tAuditPocketSequence();\n+|\tBuildNumerals();\n}\n\nvoid AHasardWheel::EndPlay(const EEndPlayReason::Type EndPlayReason)\n{\n\tUE_LOG(LogHasard, Warning, TEXT("Wheel: EndPlay"));\n\tGetWorldTimerManager().ClearTimer(SpinTimerHandle);\n\tSuper::EndPlay(EndPlayReason);\n}\n\nvoid AHasardWheel::StartSpin()\n{\n\tif (GetWorldTimerManager().IsTimerActive(SpinTimerHandle))\n\t{\n\t\tUE_LOG(LogHasard, Warning, TEXT("Wheel: StartSpin ignored - a spin is already running"));\n\t\treturn;\n\t}\n\n\tGetWorldTimerManager().SetTimer(SpinTimerHandle, this,\n\t\t&amp;AHasardWheel::FinishSpin, SpinDuration, false);\n}\n\nvoid AHasardWheel::FinishSpin()\n{\n\tconst int32 WinningPocket = DetermineWinningPocket();\n\tOnBallSettled.Broadcast(WinningPocket);\n}\n\nint32 AHasardWheel::DetermineWinningPocket() const\n{\n\treturn FMath::RandRange(0, GetPocketCount() - 1);\n}\n\nint32 AHasardWheel::GetPocketCount() const\n{\n\treturn GetPocketSequence().Num();\n}\n\nint32 AHasardWheel::GetNumberAtRimIndex(int32 RimIndex) const\n{\n\tconst TArray&lt;int32&gt;&amp; Sequence = GetPocketSequence();\n\treturn Sequence.IsValidIndex(RimIndex) ? Sequence[RimIndex] : INDEX_NONE;\n}\n\nint32 AHasardWheel::GetRimIndexOf(int32 Number) const\n{\n\t// IndexOfByKey already returns INDEX_NONE when it finds nothing, which is the\n\t// answer this function wants for a number that is not on the wheel.\n\treturn GetPocketSequence().IndexOfByKey(Number);\n}\n\nbool AHasardWheel::TryGetPocketAngleDegrees(int32 Number, float&amp; OutDegrees) const\n{\n\tconst int32 RimIndex = GetRimIndexOf(Number);\n\n\tif (RimIndex == INDEX_NONE)\n\t{\n\t\tOutDegrees = 0.0f;\n\t\treturn false;\n\t}\n\n\tOutDegrees = 360.0f * static_cast&lt;float&gt;(RimIndex) / static_cast&lt;float&gt;(GetPocketCount());\n\treturn true;\n}\n\n+|bool AHasardWheel::TryGetPocketYaw(int32 Number, float&amp; OutYaw) const\n+|{\n+|\tfloat Degrees = 0.0f;\n+|\n+|\tif (!TryGetPocketAngleDegrees(Number, Degrees))\n+|\t{\n+|\t\tOutYaw = 0.0f;\n+|\t\treturn false;\n+|\t}\n+|\n+|\t// The one negation in the project. Everything that places something on the rim, and\n+|\t// everything that reads something off it, goes through this function.\n+|\tOutYaw = -Degrees;\n+|\treturn true;\n+|}\n+|\nvoid AHasardWheel::AuditPocketSequence() const\n{\n\tconst TArray&lt;int32&gt;&amp; Sequence = GetPocketSequence();\n\tconst int32 Count = Sequence.Num();\n\n\tTSet&lt;int32&gt; Seen;\n\tint32 Offenders = 0;\n\n\tfor (int32 RimIndex = 0; RimIndex &lt; Count; ++RimIndex)\n\t{\n\t\tconst int32 Number = Sequence[RimIndex];\n\n\t\tif (Number &lt; 0 || Number &gt;= Count)\n\t\t{\n\t\t\tUE_LOG(LogHasard, Error,\n\t\t\t\tTEXT("Rim audit: slot %d holds %d, which is not a pocket on a wheel of %d"),\n\t\t\t\tRimIndex, Number, Count);\n\t\t\t++Offenders;\n\t\t\tcontinue;\n\t\t}\n\n\t\tbool bAlreadySeen = false;\n\t\tSeen.Add(Number, &amp;bAlreadySeen);\n\n\t\tif (bAlreadySeen)\n\t\t{\n\t\t\tUE_LOG(LogHasard, Error, TEXT("Rim audit: slot %d repeats %d"), RimIndex, Number);\n\t\t\t++Offenders;\n\t\t}\n\t}\n\n\t// The claim, stated on every run: this is a wheel. Every number present, once each,\n\t// none invented. A distinct count below the pocket count is a repeat and an omission\n\t// in the same list, which is the typo a person cannot see and a spin will not reveal.\n\tUE_LOG(LogHasard, Warning,\n\t\tTEXT("Rim audit: %d pockets, %d distinct, %d offenders, %.4f degrees each"),\n\t\tCount, Seen.Num(), Offenders, 360.0f / static_cast&lt;float&gt;(Count));\n}\n\n+|FColor AHasardWheel::NumeralColorFor(int32 Number, const UHasardTableLayout* Layout) const\n+|{\n+|\t// Zero first. It is not in the red set, so asking IsRedNumber first would print it in\n+|\t// the black ink - the same ordering trap the felt met in guide 3 module 4.\n+|\tif (Number == 0)\n+|\t{\n+|\t\treturn ZeroNumeralColor;\n+|\t}\n+|\n+|\treturn (Layout &amp;&amp; Layout-&gt;IsRedNumber(Number)) ? RedNumeralColor : BlackNumeralColor;\n+|}\n+|\n+|void AHasardWheel::BuildNumerals()\n+|{\n+|\t// Destroy first and unconditionally, before the bShowNumerals test. Turning numerals\n+|\t// off and rebuilding has to remove them, not leave the previous set standing.\n+|\tfor (const TObjectPtr&lt;UTextRenderComponent&gt;&amp; Existing : Numerals)\n+|\t{\n+|\t\tif (Existing)\n+|\t\t{\n+|\t\t\tExisting-&gt;DestroyComponent();\n+|\t\t}\n+|\t}\n+|\tNumerals.Reset();\n+|\n+|\tif (!bShowNumerals || !WheelMesh)\n+|\t{\n+|\t\treturn;\n+|\t}\n+|\n+|\t// The felt already owns the red list, and the GameMode already owns the felt\'s layout\n+|\t// asset. Asking for it here rather than adding a second assignment to BP_WHEEL keeps\n+|\t// the eighteen red numbers in exactly one place - which is the whole reason that list\n+|\t// is a list.\n+|\tconst AHasardGameMode* GM = GetWorld() ? GetWorld()-&gt;GetAuthGameMode&lt;AHasardGameMode&gt;() : nullptr;\n+|\tconst UHasardTableLayout* Layout = GM ? GM-&gt;GetTableLayout() : nullptr;\n+|\n+|\tif (!Layout)\n+|\t{\n+|\t\tUE_LOG(LogHasard, Error,\n+|\t\t\tTEXT("Wheel: no table layout on BP_HasardGameMode - numerals cannot be coloured"));\n+|\t}\n+|\n+|\tconst TArray&lt;int32&gt;&amp; Sequence = GetPocketSequence();\n+|\n+|\tfor (const int32 Number : Sequence)\n+|\t{\n+|\t\tfloat Yaw = 0.0f;\n+|\t\tif (!TryGetPocketYaw(Number, Yaw))\n+|\t\t{\n+|\t\t\tcontinue;\n+|\t\t}\n+|\n+|\t\tUTextRenderComponent* Numeral = NewObject&lt;UTextRenderComponent&gt;(this);\n+|\n+|\t\t// Movable before registering. A component made with NewObject is static, and\n+|\t\t// moving a registered static component warns and is then ignored.\n+|\t\tNumeral-&gt;SetMobility(EComponentMobility::Movable);\n+|\t\tNumeral-&gt;RegisterComponent();\n+|\n+|\t\t// Attached to the rim rather than to the root, so that turning the rim turns the\n+|\t\t// numbers with it. Module 3 moves them to an unscaled rim node, and module 4 rotates exactly one component because of it.\n+|\t\tNumeral-&gt;AttachToComponent(WheelMesh, FAttachmentTransformRules::KeepRelativeTransform);\n+|\n+|\t\tconst FRotator Facing(0.0f, Yaw, 0.0f);\n+|\t\tNumeral-&gt;SetRelativeLocation(\n+|\t\t\tFacing.RotateVector(FVector(NumeralRadius, 0.0f, NumeralZOffset)));\n+|\t\tNumeral-&gt;SetRelativeRotation(\n+|\t\t\tFRotator(NumeralRotation.Pitch, NumeralRotation.Yaw + Yaw, NumeralRotation.Roll));\n+|\n+|\t\tNumeral-&gt;SetText(FText::AsNumber(Number));\n+|\t\tNumeral-&gt;SetWorldSize(NumeralTextSize);\n+|\t\tNumeral-&gt;SetHorizontalAlignment(EHTA_Center);\n+|\t\tNumeral-&gt;SetVerticalAlignment(EVRTA_TextCenter);\n+|\t\tNumeral-&gt;SetTextRenderColor(NumeralColorFor(Number, Layout));\n+|\n+|\t\tNumerals.Add(Numeral);\n+|\t}\n+|\n+|\tUE_LOG(LogHasard, Warning, TEXT("Wheel: printed %d numerals"), Numerals.Num());\n+|}\n+|</code></pre> <p><code>BuildNumerals</code> destroys before it checks <code>bShowNumerals</code>, for the reason the felt&rsquo;s <code>BuildLabels</code> does: turning numerals off and rebuilding has to <i>remove</i> them, and a function that returns early on the flag would leave the previous set standing.</p> <p><b>Phase 2 &mdash; build.</b></p> <p><b>3.</b> Save all, <b>close the editor</b>, <code>Ctrl+Shift+B</code>, expect <code>Build: 1 succeeded, 0 failed</code>. Reopen.</p> <p><b>Phase 3 &mdash; look at it.</b></p> <p><b>4.</b> Open <code>L_RouletteTest</code>, press <b>Play</b>, and find the wheel. Thirty-seven numerals stand around the rim. The log confirms the count:</p> <pre><code>LogHasard: Warning: Wheel: printed 37 numerals</code></pre> <p><b>5.</b> They will almost certainly be the wrong size, at the wrong radius, or facing the wrong way on the first attempt. That is expected &mdash; the felt needed the same pass. Stop, open <code>BP_WHEEL</code>, and tune <b>Hasard | Numerals</b>:</p> <p><b>Numeral Radius</b> until they sit on the rim rather than in the hub or off the edge. <b>Numeral Text Size</b> until they are legible from the player&rsquo;s seat. If the numerals read mirrored or upside-down, <b>Numeral Rotation</b> is the knob &mdash; try <code>(90, 0, 0)</code> and <code>(90, 90, 0)</code> before anything else. Compile and Play after each change.</p> <p><b>6.</b> Now check the arithmetic against the picture. Press <code>~</code> and run:</p> <pre><code>HasardShowPocket 17</code></pre> <p>It reports rim slot 8 at 77.84 degrees, between 25 and 34. Find 17 on the wheel and confirm that 25 and 34 are the numerals either side of it. <b>This is the module.</b> The console and the rim are reading the same list, and you have just checked one against the other by eye.</p> <p><b>7.</b> Try zero. <code>HasardShowPocket 0</code> reports slot 0 between 26 and 32, and zero should be the only green numeral on the wheel.</p> <p><b>8.</b> Commit.</p> <pre><code>git add -A\ngit commit -m "Print the numerals around the wheel rim"</code></pre> <p><b>The two failures worth recognising.</b> <b>All thirty-seven numerals stacked at the hub</b> means <code>SetMobility</code> landed after <code>RegisterComponent</code> &mdash; the log will be full of warnings about moving a static component. <b>Every numeral black, including zero</b> means the layout came back null: the log says so, and the fix is the <b>Table Layout</b> slot on <code>BP_HasardGameMode</code>, not anything in this module.</p>'},

quiz:[
{q:'The numerals attach to <code>WheelMesh</code> rather than to the actor root because:',
 opts:['<code>NewObject</code> cannot attach to a scene component','The root is reserved for the ball','Module 4 rotates the rim, and the numbers have to turn with it','Text components require a static mesh parent'],
 c:2,why:'Attach them to the root and the rim spins under numbers that stay put - which looks nearly right, which is what makes it expensive.'},
{q:'A component created with <code>NewObject</code> and registered before <code>SetMobility</code> will:',
 opts:['Warn on every transform and then ignore it, stacking every numeral at the hub','Fail to compile','Crash on the first tick','Work, but only in a packaged build'],
 c:0,why:'Runtime components default to static. The felt hit this in guide 3 module 4 and the ordering is the same here: mobility, register, attach, transform.'},
{q:'The wheel reads <code>IsRedNumber</code> through the GameMode rather than holding its own layout asset because:',
 opts:['The wheel cannot hold a <code>UPROPERTY</code> pointer','A third assignment of one asset is a third chance to leave a slot empty','<code>IsRedNumber</code> is private to the GameMode','The felt would otherwise release the asset first'],
 c:1,why:'The PlayerController has read the payout table this way since guide 3. The felt owning its own copy is the older pattern, and the odd one out.'},
{q:'<code>NumeralColorFor</code> tests for zero before calling <code>IsRedNumber</code>. Reversing the two would:',
 opts:['Crash on the zero pocket','Colour every number green','Have no effect, since zero is not red','Print zero in the black ink, filed among the numbers it takes money from'],
 c:3,why:'Zero is not in the red set, so a red test reached first returns false and falls through to black. The same ordering trap the felt met, and the same reason it matters.'},
{q:'Everything that places something on the rim goes through <code>TryGetPocketYaw</code> because:',
 opts:['Blueprint cannot negate a float','The reconciliation between a clockwise rim and counter-clockwise yaw must happen in exactly one place','The angle is expensive to compute twice','<code>TryGetPocketAngleDegrees</code> is private'],
 c:1,why:'Two copies of that negation is two chances to get the sign wrong, and a mirrored wheel is nearly invisible - the ball lands smoothly, on a real number, that happens to be the wrong one.'},
{q:'If the numerals were placed with one sign and the ball with the other, the symptom would be:',
 opts:['A visible jump on the last frame of the spin','The numerals stacking at the hub','The ball landing on the mirror image of the right number, every time, with nothing looking broken','A compile error about mismatched rotators'],
 c:2,why:'A correct animation of a mirrored wheel. The natural first diagnosis is that the landing is off, which sends you looking in the wrong file.'}
]
