/* --------------------------------------------------------- 04 */
{
grp:"Part II \u2014 The Spin",
num:"04",
title:"Deciding before you animate",
lede:"The result moves to the start of the spin and the wheel starts ticking. The ball is then built backwards from the pocket it has to reach, so the arrival is exact rather than corrected.",
blocks:[
{t:'h',x:'Six seconds of waiting becomes six seconds of travel'},
{t:'p',x:'Two changes carry this module. <code>DetermineWinningPocket()</code> moves from <code>FinishSpin</code> to <code>StartSpin</code>, and the actor starts ticking. The timer goes away entirely: a timer is for waiting, and the wheel is no longer waiting.'},
{t:'p',x:'The result is now chosen before the first frame of animation runs, and every frame after it is told where to go. Nothing about the animation, the frame rate, or a hitch can move the destination.'},
{t:'h',x:'Position from elapsed time, never from accumulation'},
{t:'p',x:'The obvious way to spin something is to add a little rotation each frame. Do not.'},
{t:'code',x:'// Wrong. Two machines running this land in different places.\nWheelYaw += SpinSpeed * DeltaSeconds;\n\n// Right. Position is a function of how far through the spin you are.\nconst float Alpha = FMath::Clamp(SpinElapsed / SpinDuration, 0.0f, 1.0f);'},
{t:'warn',lab:'An accumulated rotation is a result that depends on the hardware',x:'<p>Adding per-frame increments accumulates floating-point error, and worse, it makes the total travelled depend on how many frames happened. A 30 fps machine and a 144 fps machine take a different number of steps to cross six seconds and arrive at different angles.</p><p>Computing the position from total elapsed time removes the question. The three frame rates below were checked against the exact formulas in <code>ApplySpin</code>, and all three land on the same pocket at the same angle to six decimal places:</p><pre><code>30 fps  -> pocket 17, relative yaw -77.837838\n60 fps  -> pocket 17, relative yaw -77.837838\n144 fps -> pocket 17, relative yaw -77.837838</code></pre><p>This matters more here than in most animations, because the endpoint <i>is</i> the result the player is paid on.</p>'},
{t:'h',x:'The arrival is exact by construction'},
{t:'p',x:'The ball&rsquo;s path is not built forwards from where it starts. It is built backwards from where it has to end.'},
{t:'code',x:'WheelYaw          = WheelSweepDegrees * Eased;\nSettledBallYaw    = WheelSweepDegrees + PocketYaw;      // where the ball must be at Eased = 1\nBallYaw           = SettledBallYaw - BallSweepDegrees * (1 - Eased);\n\n// So the angle between ball and rim is:\n//   BallYaw - WheelYaw = PocketYaw + (WheelSweep - BallSweep) * (1 - Eased)\n// which is PocketYaw exactly, and only, when Eased reaches 1.'},
{t:'p',x:'Read the last line again, because it is the whole design. The gap between the ball and the pocket is the remaining distance multiplied by <code>(1 - Eased)</code>. When <code>Eased</code> is 1 that term is zero and the ball is in the pocket &mdash; not near it, not snapped to it, <i>at</i> it, with no final correction anywhere in the code.'},
{t:'chk',q:'Why not animate the ball however you like and simply snap it to the pocket on the last frame?',a:'<p><b>Because a snap makes the animation and the result two different things.</b> Once they are two things they can disagree, and the disagreement is invisible: the ball jumps a few degrees on the final frame, which reads as a physical settle rather than as a bug, and the size of the jump is exactly the size of the error you are hiding.</p><p>Composing the path from its destination means there is nothing to reconcile. If <code>BallSweepDegrees</code> were wrong the ball would take a visibly wrong <i>path</i> &mdash; too many revolutions, or the wrong direction &mdash; and still land correctly. The failure shows up where you can see it rather than where you cannot.</p>'},
{t:'h',x:'The easing curve, and the one that was rejected'},
{t:'p',x:'Any monotonic curve from 0 to 1 lands correctly, so the choice is entirely about how it looks. Cubic ease-out was the first attempt and is wrong:'},
{t:'table',head:['Curve','Last 3.0s','Last 1.5s','Last 0.6s','Last 0.18s'],rows:[['<code>1 - (1-a)&sup3;</code>','405&deg;','50.6&deg;','3.2&deg;','0.1&deg;'],['<code>1 - (1-a)&sup2;</code>','810&deg;','202.5&deg;','32.4&deg;','2.9&deg;']]},
{t:'p',x:'Cubic spends its last half-second covering three degrees &mdash; under a third of one pocket. On screen the ball stops, and then creeps. That reads as something being nudged into place, which is the shape of the exact behaviour the next module is about refusing, arrived at by accident rather than by design.'},
{t:'p',x:'Quadratic still decelerates to a stop, still lands exactly, and is still monotonic, but the last fifth of a second covers three degrees instead of a tenth of one. It is the curve in the code.'},
{t:'aside',lab:'A curve is a claim about the ball',x:'It is worth noticing that this was a visual decision with an integrity consequence, arrived at from the numbers rather than from taste. Nobody would have called the cubic version dishonest &mdash; it just looked wrong. But &ldquo;the ball appears to hesitate before it lands&rdquo; is a sentence a regulator recognises, and the fact that it happened here by accident is a fair illustration of how easily it happens on purpose.'},
{t:'h',x:'Reading the landing back off the transforms'},
{t:'p',x:'<code>FinishSpin</code> does not simply broadcast the number it was carrying. It works out which pocket the ball is <i>actually</i> sitting in, from the angles that were actually applied, and compares.'},
{t:'code',x:'const int32 Landed = GetPocketAtYaw(BallYaw - WheelYaw);\n\nif (Landed != WinningPocket)\n{\n    UE_LOG(LogHasard, Error,\n        TEXT("Spin landed the ball on %d and is broadcasting %d"), Landed, WinningPocket);\n}'},
{t:'chk',q:'Both sides of that comparison come from <code>PendingPocket</code>. Is the check not circular?',a:'<p><b>No, because the two sides took different routes.</b> One is the number itself. The other went number &rarr; rim index &rarr; degrees &rarr; negated to yaw &rarr; through the sweep arithmetic &rarr; into a transform &rarr; back out &rarr; wrapped into range &rarr; divided &rarr; rounded &rarr; number. A round trip through two sign conversions, a subtraction and a rounding step.</p><p>What it catches: a sign error, a wrong sweep, an off-by-one in the rim lookup, a rounding fault at the wrap. What it cannot catch: <code>DetermineWinningPocket</code> being biased &mdash; that is what the 370,000-spin distribution test is for, and the two tests are not substitutes for one another.</p>'},
{t:'build',title:'The spin, and the pocket it was always going to',file:'Source/Hasard/HasardWheel.h + .cpp',x:'<p><b>Phase 1 &mdash; Visual Studio.</b> Two files, complete, marked against module 3.</p> <p><b>1.</b> <code>HasardWheel.h</code>, complete:</p> <pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"\n#include "Engine/EngineTypes.h"\n#include "GameFramework/Actor.h"\n#include "HasardWheel.generated.h"\n\nclass UHasardTableLayout;\nclass UInstancedStaticMeshComponent;\nclass UMaterialInterface;\nclass USceneComponent;\nclass UStaticMesh;\nclass UStaticMeshComponent;\nclass UTextRenderComponent;\n\n/** One parameter means two entries after the name: the type, then the variable name. */\nDECLARE_DYNAMIC_MULTICAST_DELEGATE_OneParam(FOnBallSettled, int32, WinningPocket);\n\nUCLASS()\nclass HASARD_API AHasardWheel : public AActor\n{\n\tGENERATED_BODY()\n\npublic:\n\tAHasardWheel();\n\n\t/** Fired once per spin, when the ball settles. The wheel does not know who listens. */\n\tUPROPERTY(BlueprintAssignable, Category = "Hasard|Wheel")\n\tFOnBallSettled OnBallSettled;\n\n\tUFUNCTION(BlueprintCallable, Category = "Hasard|Wheel")\n\tvoid StartSpin();\n\n\t/**\n\t * The physical order of the numbers around the rim, clockwise from zero.\n\t *\n\t * Not a setting and not a preference. This is what a single-zero wheel is, and\n\t * nothing else in the project may hold a second copy of it.\n\t */\n\tstatic const TArray&lt;int32&gt;&amp; GetPocketSequence();\n\n\t/** How many pockets. The length of the sequence, not a number anyone can type. */\n\tUFUNCTION(BlueprintPure, Category = "Hasard|Wheel")\n\tint32 GetPocketCount() const;\n\n\t/** The number sitting in rim slot RimIndex. INDEX_NONE if that slot does not exist. */\n\tUFUNCTION(BlueprintPure, Category = "Hasard|Wheel")\n\tint32 GetNumberAtRimIndex(int32 RimIndex) const;\n\n\t/** Which rim slot holds Number. INDEX_NONE if it is not a pocket on this wheel. */\n\tUFUNCTION(BlueprintPure, Category = "Hasard|Wheel")\n\tint32 GetRimIndexOf(int32 Number) const;\n\n\t/**\n\t * Degrees clockwise from the zero pocket to Number.\n\t *\n\t * Try rather than a plain getter because zero sits at 0.0 degrees - so a failed\n\t * lookup returning 0.0 would be indistinguishable from a correct answer.\n\t */\n\tUFUNCTION(BlueprintPure, Category = "Hasard|Wheel")\n\tbool TryGetPocketAngleDegrees(int32 Number, float&amp; OutDegrees) const;\n\n\t/**\n\t * Local yaw of the pocket holding Number.\n\t *\n\t * The rim is described clockwise from zero; yaw runs counter-clockwise. The negation\n\t * that reconciles the two lives here and nowhere else, so the numerals and the ball\n\t * cannot end up disagreeing about which way round the wheel goes.\n\t */\n\tUFUNCTION(BlueprintPure, Category = "Hasard|Wheel")\n\tbool TryGetPocketYaw(int32 Number, float&amp; OutYaw) const;\n\n+|\t/**\n+|\t * The pocket a yaw points at - the inverse of TryGetPocketYaw.\n+|\t *\n+|\t * Used to read the landing back off the transforms rather than off the variable that\n+|\t * produced them, which is what makes the check in FinishSpin worth having.\n+|\t */\n+|\tUFUNCTION(BlueprintPure, Category = "Hasard|Wheel")\n+|\tint32 GetPocketAtYaw(float Yaw) const;\n+|\n+|\t/** True from StartSpin until the ball settles. */\n+|\tUFUNCTION(BlueprintPure, Category = "Hasard|Wheel")\n+|\tbool IsSpinning() const { return bIsSpinning; }\n+|\n\t/** One spin, no animation. Public so the test and real play share one code path. */\n\tint32 DetermineWinningPocket() const;\n\nprotected:\n\tvirtual void PostInitializeComponents() override;\n\tvirtual void BeginPlay() override;\n\tvirtual void EndPlay(const EEndPlayReason::Type EndPlayReason) override;\n\tvirtual void OnConstruction(const FTransform&amp; Transform) override;\n+|\tvirtual void Tick(float DeltaSeconds) override;\n\nprivate:\n~|\t/** Ends the spin and broadcasts. Nothing outside the wheel finishes a spin. */\n\tvoid FinishSpin();\n+|\n+|\t/** Places the rim and the ball for one point on the eased curve, 0 to 1. */\n+|\tvoid ApplySpin(float Eased);\n\n\t/** Walks the sequence on BeginPlay and says out loud whether it is still a wheel. */\n\tvoid AuditPocketSequence() const;\n\n\t/**\n\t * Prints the thirty-seven coloured plates.\n\t *\n\t * Called from OnConstruction as well as BeginPlay, and it has to be, for the reason\n\t * AHasardFelt::BuildSurface records: an instanced component builds its render state\n\t * when it registers, and one registered without a mesh never picks up a mesh assigned\n\t * afterwards - the value is stored and the renderer keeps drawing the default.\n\t */\n\tvoid BuildPockets();\n\n\t/**\n\t * Destroys any numerals and prints a fresh set from the rim sequence.\n\t *\n\t * BeginPlay only, matching AHasardFelt::BuildLabels. These are a component each rather\n\t * than instances, and OnConstruction runs on every property edit in the editor.\n\t */\n\tvoid BuildNumerals();\n\n\t/** Points a component at PocketMesh and PocketMaterial and tints it. */\n\tvoid PreparePockets(UInstancedStaticMeshComponent* Component, const FColor&amp; Color) const;\n\n\t/**\n\t * Which instanced component prints this pocket, which is the same question as what\n\t * colour it is: the components are split by colour, so routing and colouring cannot\n\t * disagree. The felt owns the red list; this reads it.\n\t */\n\tUInstancedStaticMeshComponent* PocketsFor(int32 Number,\n\t\tconst UHasardTableLayout* Layout) const;\n\n\tUPROPERTY(VisibleAnywhere, Category = "Hasard|Wheel")\n\tTObjectPtr&lt;USceneComponent&gt; WheelRoot;\n\n\t/**\n\t * The turning part of the wheel, and the parent of everything printed on it.\n\t *\n\t * It exists to carry no scale. A parent\'s scale is applied to a child component\n\t * axis by axis in the child\'s own frame, without being rotated into it, so a rim\n\t * mesh flattened to (2, 2, 0.2) squashes a numeral\'s glyph height by 0.2 while\n\t * stretching its width by 2. Hanging the rim\'s contents off an unscaled node and\n\t * letting only WheelMesh carry the flattening removes the whole class of problem.\n\t */\n\tUPROPERTY(VisibleAnywhere, Category = "Hasard|Wheel")\n\tTObjectPtr&lt;USceneComponent&gt; RimRoot;\n\n\tUPROPERTY(VisibleAnywhere, Category = "Hasard|Wheel")\n\tTObjectPtr&lt;UStaticMeshComponent&gt; WheelMesh;\n\n\tUPROPERTY(VisibleAnywhere, Category = "Hasard|Wheel")\n\tTObjectPtr&lt;UStaticMeshComponent&gt; BallMesh;\n\n\tUPROPERTY(VisibleAnywhere, Category = "Hasard|Pockets")\n\tTObjectPtr&lt;UInstancedStaticMeshComponent&gt; RedPockets;\n\n\tUPROPERTY(VisibleAnywhere, Category = "Hasard|Pockets")\n\tTObjectPtr&lt;UInstancedStaticMeshComponent&gt; BlackPockets;\n\n\t/** Zero has its own component. Its colour is a statement about the odds. */\n\tUPROPERTY(VisibleAnywhere, Category = "Hasard|Pockets")\n\tTObjectPtr&lt;UInstancedStaticMeshComponent&gt; ZeroPocket;\n\n\t/** Every numeral this actor made. UPROPERTY so the collector can see them. */\n\tUPROPERTY()\n\tTArray&lt;TObjectPtr&lt;UTextRenderComponent&gt;&gt; Numerals;\n\n\t/**\n\t * The same asset BP_Felt holds, assigned again here.\n\t *\n\t * Module 2 read it off the GameMode to avoid a second slot. That worked while the only\n\t * thing it fed was BeginPlay. The plates are printed from OnConstruction, where there\n\t * is no GameMode at all, so the wheel needs the asset in its own hand. This is not a\n\t * second copy of the red list - that list lives once, in UHasardTableLayout.\n\t */\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Wheel",\n\t\tmeta = (AllowPrivateAccess = "true"))\n\tTObjectPtr&lt;UHasardTableLayout&gt; TableLayout;\n\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Wheel",\n\t\tmeta = (AllowPrivateAccess = "true", ClampMin = "0.1"))\n\tfloat SpinDuration = 6.0f;\n\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Pockets",\n\t\tmeta = (AllowPrivateAccess = "true"))\n\tbool bShowPockets = true;\n\n\t/** A unit quad in centimetres. The same mesh BP_Felt prints its boxes from. */\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Pockets",\n\t\tmeta = (AllowPrivateAccess = "true"))\n\tTObjectPtr&lt;UStaticMesh&gt; PocketMesh;\n\n\t/** Needs a vector parameter named by ColorParameterName. The felt\'s material has one. */\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Pockets",\n\t\tmeta = (AllowPrivateAccess = "true"))\n\tTObjectPtr&lt;UMaterialInterface&gt; PocketMaterial;\n\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Pockets",\n\t\tmeta = (AllowPrivateAccess = "true"))\n\tFName ColorParameterName = TEXT("Color");\n\n\t/** Distance from the hub to the middle of a plate, in centimetres. */\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Pockets",\n\t\tmeta = (AllowPrivateAccess = "true", ClampMin = "1.0"))\n\tfloat PocketRadius = 45.0f;\n\n\t/** How far a plate reaches in and out from that radius. */\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Pockets",\n\t\tmeta = (AllowPrivateAccess = "true", ClampMin = "0.1"))\n\tfloat PocketLength = 20.0f;\n\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Pockets",\n\t\tmeta = (AllowPrivateAccess = "true"))\n\tfloat PocketZOffset = 0.4f;\n\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Pockets",\n\t\tmeta = (AllowPrivateAccess = "true"))\n\tFColor RedPocketColor = FColor(178, 26, 30);\n\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Pockets",\n\t\tmeta = (AllowPrivateAccess = "true"))\n\tFColor BlackPocketColor = FColor(22, 22, 24);\n\n\t/** Zero is the house edge. It does not share a colour with anything else on the rim. */\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Pockets",\n\t\tmeta = (AllowPrivateAccess = "true"))\n\tFColor ZeroPocketColor = FColor(20, 130, 60);\n\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Numerals",\n\t\tmeta = (AllowPrivateAccess = "true"))\n\tbool bShowNumerals = true;\n\n\t/** Distance from the hub to the middle of a numeral. Sits on the plate, so match it. */\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Numerals",\n\t\tmeta = (AllowPrivateAccess = "true", ClampMin = "1.0"))\n\tfloat NumeralRadius = 45.0f;\n\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Numerals",\n\t\tmeta = (AllowPrivateAccess = "true", ClampMin = "0.1"))\n\tfloat NumeralTextSize = 6.0f;\n\n\t/** Must stay above PocketZOffset, or the numerals sink into their own plates. */\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Numerals",\n\t\tmeta = (AllowPrivateAccess = "true"))\n\tfloat NumeralZOffset = 0.8f;\n\n\t/**\n\t * Base orientation of a numeral before its own pocket yaw is added.\n\t *\n\t * Pitch 90 lays the text flat on a horizontal rim, exactly as LabelRotation does on\n\t * the felt. If the numerals come out mirrored or upside-down, this is the knob - the\n\t * felt needed the same tuning and for the same reason.\n\t */\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Numerals",\n\t\tmeta = (AllowPrivateAccess = "true"))\n\tFRotator NumeralRotation = FRotator(90.0f, 180.0f, 0.0f);\n\n\t/**\n\t * One colour for all thirty-seven.\n\t *\n\t * A real wheel prints white on a coloured pocket, and so does this one now. The colour\n\t * of a number is a fact about the pocket, stated once, by the plate under it.\n\t */\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Numerals",\n\t\tmeta = (AllowPrivateAccess = "true"))\n\tFColor NumeralColor = FColor(245, 245, 240);\n\n-|\t/** Plain struct, not a UObject: no UPROPERTY needed. */\n-|\tFTimerHandle SpinTimerHandle;\n+|\t/** How far the rim turns over the whole spin. Presentation only. */\n+|\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Spin",\n+|\t\tmeta = (AllowPrivateAccess = "true"))\n+|\tfloat WheelSweepDegrees = 1080.0f;\n+|\n+|\t/** How far the ball travels over the whole spin, in the opposite sense to the rim. */\n+|\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Spin",\n+|\t\tmeta = (AllowPrivateAccess = "true"))\n+|\tfloat BallSweepDegrees = -2160.0f;\n+|\n+|\t/** Where the ball rides at the start of the spin. */\n+|\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Spin",\n+|\t\tmeta = (AllowPrivateAccess = "true", ClampMin = "1.0"))\n+|\tfloat BallOuterRadius = 58.0f;\n+|\n+|\t/** Where the ball sits once it is in a pocket. Match this to PocketRadius. */\n+|\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Spin",\n+|\t\tmeta = (AllowPrivateAccess = "true", ClampMin = "1.0"))\n+|\tfloat BallPocketRadius = 45.0f;\n+|\n+|\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Spin",\n+|\t\tmeta = (AllowPrivateAccess = "true"))\n+|\tfloat BallHeight = 2.0f;\n+|\n+|\t/** The pocket this spin is travelling to. Decided in StartSpin, before a frame runs. */\n+|\tint32 PendingPocket = INDEX_NONE;\n+|\n+|\tbool bIsSpinning = false;\n+|\n+|\t/** Seconds since StartSpin. The animation is a function of this and nothing else. */\n+|\tfloat SpinElapsed = 0.0f;\n+|\n+|\t/** Last applied angles, kept so FinishSpin can read the landing off the result. */\n+|\tfloat WheelYaw = 0.0f;\n+|\tfloat BallYaw = 0.0f;\n};</code></pre> <p><code>FTimerHandle SpinTimerHandle</code> is struck through and gone. So is <code>TimerManager.h</code> in the <code>.cpp</code>: nothing in the wheel waits any more.</p> <p>The five <code>Hasard | Spin</code> properties are all presentation. <code>WheelSweepDegrees</code> and <code>BallSweepDegrees</code> have opposite signs because a rim and a ball turn against each other; change either and the ball takes a different route to the same pocket.</p> <p><b>2.</b> <code>HasardWheel.cpp</code>, complete:</p> <pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#include "HasardWheel.h"\n#include "HasardTableLayout.h"\n#include "HasardTypes.h"\n#include "Components/InstancedStaticMeshComponent.h"\n#include "Components/SceneComponent.h"\n#include "Components/StaticMeshComponent.h"\n#include "Components/TextRenderComponent.h"\n#include "Engine/StaticMesh.h"\n#include "Engine/World.h"\n#include "Materials/MaterialInstanceDynamic.h"\n#include "Materials/MaterialInterface.h"\n-|#include "TimerManager.h"\n\nconst TArray&lt;int32&gt;&amp; AHasardWheel::GetPocketSequence()\n{\n\t// A single-zero wheel, clockwise from zero. Reds and blacks alternate and the high\n\t// and low numbers are spread, so that no arc of the rim is worth more than any other.\n\t// That is a design, not a pattern, which is why no arithmetic produces it - the same\n\t// reason UHasardTableLayout::IsRedNumber lists its eighteen numbers instead of\n\t// computing them.\n\tstatic const TArray&lt;int32&gt; PocketSequence = {\n\t\t 0, 32, 15, 19,  4, 21,  2, 25, 17, 34,\n\t\t 6, 27, 13, 36, 11, 30,  8, 23, 10,  5,\n\t\t24, 16, 33,  1, 20, 14, 31,  9, 22, 18,\n\t\t29,  7, 28, 12, 35,  3, 26 };\n\n\treturn PocketSequence;\n}\n\nAHasardWheel::AHasardWheel()\n{\n~|\tPrimaryActorTick.bCanEverTick = true;\n\n\tWheelRoot = CreateDefaultSubobject&lt;USceneComponent&gt;(TEXT("WheelRoot"));\n\tRootComponent = WheelRoot;\n\n\t// Unscaled, and everything that has to stay square hangs off it.\n\tRimRoot = CreateDefaultSubobject&lt;USceneComponent&gt;(TEXT("RimRoot"));\n\tRimRoot-&gt;SetupAttachment(WheelRoot);\n\n\t// The flattening lives here and goes no further, because nothing is parented to it.\n\tWheelMesh = CreateDefaultSubobject&lt;UStaticMeshComponent&gt;(TEXT("WheelMesh"));\n\tWheelMesh-&gt;SetupAttachment(RimRoot);\n\n\tRedPockets = CreateDefaultSubobject&lt;UInstancedStaticMeshComponent&gt;(TEXT("RedPockets"));\n\tRedPockets-&gt;SetupAttachment(RimRoot);\n\n\tBlackPockets = CreateDefaultSubobject&lt;UInstancedStaticMeshComponent&gt;(TEXT("BlackPockets"));\n\tBlackPockets-&gt;SetupAttachment(RimRoot);\n\n\tZeroPocket = CreateDefaultSubobject&lt;UInstancedStaticMeshComponent&gt;(TEXT("ZeroPocket"));\n\tZeroPocket-&gt;SetupAttachment(RimRoot);\n\n\t// Not on the rim. The ball crosses the pockets rather than turning with them.\n\tBallMesh = CreateDefaultSubobject&lt;UStaticMeshComponent&gt;(TEXT("BallMesh"));\n\tBallMesh-&gt;SetupAttachment(WheelRoot);\n\n\tUE_LOG(LogHasard, Warning, TEXT("Wheel: Constructor - %s"),\n\t\t*GetName());\n}\n\nvoid AHasardWheel::PostInitializeComponents()\n{\n\tSuper::PostInitializeComponents();\n\tUE_LOG(LogHasard, Warning, TEXT("Wheel: PostInitializeComponents"));\n}\n\nvoid AHasardWheel::OnConstruction(const FTransform&amp; Transform)\n{\n\tSuper::OnConstruction(Transform);\n\n\t// Printed here as well as in BeginPlay, and it has to be. PocketMesh and PocketMaterial\n\t// are EditDefaultsOnly, so they do not exist until the Blueprint has written its\n\t// defaults - after the constructor and before this. Printing only from BeginPlay left\n\t// the instanced components registered with no mesh, and a material assigned to them\n\t// afterwards was stored but never reached the renderer. The felt met this in guide 3.\n\tBuildPockets();\n}\n\nvoid AHasardWheel::BeginPlay()\n{\n\tSuper::BeginPlay();\n\tUE_LOG(LogHasard, Warning, TEXT("Wheel: BeginPlay"));\n\n\tAuditPocketSequence();\n\tBuildPockets();\n\tBuildNumerals();\n}\n\nvoid AHasardWheel::EndPlay(const EEndPlayReason::Type EndPlayReason)\n{\n\tUE_LOG(LogHasard, Warning, TEXT("Wheel: EndPlay"));\n-|\tGetWorldTimerManager().ClearTimer(SpinTimerHandle);\n\tSuper::EndPlay(EndPlayReason);\n}\n\nvoid AHasardWheel::StartSpin()\n{\n~|\tif (bIsSpinning)\n\t{\n\t\tUE_LOG(LogHasard, Warning, TEXT("Wheel: StartSpin ignored - a spin is already running"));\n\t\treturn;\n\t}\n\n-|\tGetWorldTimerManager().SetTimer(SpinTimerHandle, this,\n-|\t\t&amp;AHasardWheel::FinishSpin, SpinDuration, false);\n+|\t// Decided here, before a single frame of animation has run. The animation is told\n+|\t// where to go; it does not get a vote, and neither does the frame rate.\n+|\tPendingPocket = DetermineWinningPocket();\n+|\tSpinElapsed = 0.0f;\n+|\tbIsSpinning = true;\n+|\n+|\tApplySpin(0.0f);\n+|\n+|\tUE_LOG(LogHasard, Warning, TEXT("Wheel: spin started, %.1fs"), SpinDuration);\n+|\tUE_LOG(LogHasard, Verbose, TEXT("Wheel: this spin is going to pocket %d"), PendingPocket);\n+|}\n+|\n+|void AHasardWheel::Tick(float DeltaSeconds)\n+|{\n+|\tSuper::Tick(DeltaSeconds);\n+|\n+|\tif (!bIsSpinning)\n+|\t{\n+|\t\treturn;\n+|\t}\n+|\n+|\tSpinElapsed += DeltaSeconds;\n+|\n+|\t// Position from total elapsed time over the duration - never by adding this frame\'s\n+|\t// movement to last frame\'s. An accumulated rotation drifts with the frame rate, and a\n+|\t// wheel that lands a fraction of a pocket out on a slower machine is a wheel whose\n+|\t// result depends on the hardware.\n+|\tconst float Alpha = FMath::Clamp(SpinElapsed / SpinDuration, 0.0f, 1.0f);\n+|\n+|\t// Quadratic ease-out: monotonic, decelerating throughout, and exactly 1 at Alpha 1.\n+|\t// Cubic was tried first and rejected - it spends the last half second covering under\n+|\t// two degrees, which reads as a ball that has stopped and is being nudged home. That\n+|\t// is the shape of a hover, and module 5 is about not building one by accident.\n+|\tconst float Eased = 1.0f - FMath::Square(1.0f - Alpha);\n+|\n+|\tApplySpin(Eased);\n+|\n+|\tif (Alpha &gt;= 1.0f)\n+|\t{\n+|\t\tFinishSpin();\n+|\t}\n+|}\n+|\n+|void AHasardWheel::ApplySpin(float Eased)\n+|{\n+|\tfloat PocketYaw = 0.0f;\n+|\tTryGetPocketYaw(PendingPocket, PocketYaw);\n+|\n+|\tWheelYaw = WheelSweepDegrees * Eased;\n+|\n+|\t// Where the ball must be when Eased reaches 1: the pocket, carried round by the rim\n+|\t// it sits in. Everything before that is the same point minus the distance still to\n+|\t// travel, so the arrival is exact by construction rather than by a final correction.\n+|\tconst float SettledBallYaw = WheelSweepDegrees + PocketYaw;\n+|\tBallYaw = SettledBallYaw - BallSweepDegrees * (1.0f - Eased);\n+|\n+|\t// One component turns, and everything printed on the rim is parented to it. That is\n+|\t// the whole reason RimRoot exists.\n+|\tif (RimRoot)\n+|\t{\n+|\t\tRimRoot-&gt;SetRelativeRotation(FRotator(0.0f, WheelYaw, 0.0f));\n+|\t}\n+|\n+|\tif (BallMesh)\n+|\t{\n+|\t\tconst float Radius = FMath::Lerp(BallOuterRadius, BallPocketRadius, Eased);\n+|\t\tconst FRotator Facing(0.0f, BallYaw, 0.0f);\n+|\t\tBallMesh-&gt;SetRelativeLocation(Facing.RotateVector(FVector(Radius, 0.0f, BallHeight)));\n+|\t}\n}\n\nvoid AHasardWheel::FinishSpin()\n{\n-|\tconst int32 WinningPocket = DetermineWinningPocket();\n+|\tbIsSpinning = false;\n+|\n+|\tconst int32 WinningPocket = PendingPocket;\n+|\tPendingPocket = INDEX_NONE;\n+|\n+|\t// The invariant the animation exists to keep. Read back off the transforms that were\n+|\t// actually applied, not off the number that produced them - so a sign error, a wrong\n+|\t// sweep or a rounding fault is caught here rather than by a player who is told they\n+|\t// lost while looking at their own number under the ball.\n+|\tconst int32 Landed = GetPocketAtYaw(BallYaw - WheelYaw);\n+|\n+|\tif (Landed != WinningPocket)\n+|\t{\n+|\t\tUE_LOG(LogHasard, Error,\n+|\t\t\tTEXT("Spin landed the ball on %d and is broadcasting %d"), Landed, WinningPocket);\n+|\t}\n+|\n+|\tUE_LOG(LogHasard, Warning, TEXT("Wheel: ball settled in pocket %d"), WinningPocket);\n+|\n\tOnBallSettled.Broadcast(WinningPocket);\n}\n\nint32 AHasardWheel::DetermineWinningPocket() const\n{\n\treturn FMath::RandRange(0, GetPocketCount() - 1);\n}\n\nint32 AHasardWheel::GetPocketCount() const\n{\n\treturn GetPocketSequence().Num();\n}\n\nint32 AHasardWheel::GetNumberAtRimIndex(int32 RimIndex) const\n{\n\tconst TArray&lt;int32&gt;&amp; Sequence = GetPocketSequence();\n\treturn Sequence.IsValidIndex(RimIndex) ? Sequence[RimIndex] : INDEX_NONE;\n}\n\nint32 AHasardWheel::GetRimIndexOf(int32 Number) const\n{\n\t// IndexOfByKey already returns INDEX_NONE when it finds nothing, which is the\n\t// answer this function wants for a number that is not on the wheel.\n\treturn GetPocketSequence().IndexOfByKey(Number);\n}\n\nbool AHasardWheel::TryGetPocketAngleDegrees(int32 Number, float&amp; OutDegrees) const\n{\n\tconst int32 RimIndex = GetRimIndexOf(Number);\n\n\tif (RimIndex == INDEX_NONE)\n\t{\n\t\tOutDegrees = 0.0f;\n\t\treturn false;\n\t}\n\n\tOutDegrees = 360.0f * static_cast&lt;float&gt;(RimIndex) / static_cast&lt;float&gt;(GetPocketCount());\n\treturn true;\n}\n\nbool AHasardWheel::TryGetPocketYaw(int32 Number, float&amp; OutYaw) const\n{\n\tfloat Degrees = 0.0f;\n\n\tif (!TryGetPocketAngleDegrees(Number, Degrees))\n\t{\n\t\tOutYaw = 0.0f;\n\t\treturn false;\n\t}\n\n\t// The one negation in the project. Everything that places something on the rim, and\n\t// everything that reads something off it, goes through this function.\n\tOutYaw = -Degrees;\n\treturn true;\n+|}\n+|\n+|int32 AHasardWheel::GetPocketAtYaw(float Yaw) const\n+|{\n+|\tconst int32 Count = GetPocketCount();\n+|\n+|\tif (Count &lt;= 0)\n+|\t{\n+|\t\treturn INDEX_NONE;\n+|\t}\n+|\n+|\t// Back through the negation, then wrapped into [0, 360). Fmod alone keeps the sign of\n+|\t// its argument, so a negative yaw needs the second pass to land in range.\n+|\tconst float Degrees = FMath::Fmod(FMath::Fmod(-Yaw, 360.0f) + 360.0f, 360.0f);\n+|\tconst float DegreesPerPocket = 360.0f / static_cast&lt;float&gt;(Count);\n+|\n+|\t// Round, not truncate: a yaw a hair short of a pocket centre belongs to that pocket,\n+|\t// not to the one behind it. The modulo catches the wrap at the top of the last pocket.\n+|\tconst int32 RimIndex = FMath::RoundToInt(Degrees / DegreesPerPocket) % Count;\n+|\n+|\treturn GetNumberAtRimIndex(RimIndex);\n}\n\nvoid AHasardWheel::AuditPocketSequence() const\n{\n\tconst TArray&lt;int32&gt;&amp; Sequence = GetPocketSequence();\n\tconst int32 Count = Sequence.Num();\n\n\tTSet&lt;int32&gt; Seen;\n\tint32 Offenders = 0;\n\n\tfor (int32 RimIndex = 0; RimIndex &lt; Count; ++RimIndex)\n\t{\n\t\tconst int32 Number = Sequence[RimIndex];\n\n\t\tif (Number &lt; 0 || Number &gt;= Count)\n\t\t{\n\t\t\tUE_LOG(LogHasard, Error,\n\t\t\t\tTEXT("Rim audit: slot %d holds %d, which is not a pocket on a wheel of %d"),\n\t\t\t\tRimIndex, Number, Count);\n\t\t\t++Offenders;\n\t\t\tcontinue;\n\t\t}\n\n\t\tbool bAlreadySeen = false;\n\t\tSeen.Add(Number, &amp;bAlreadySeen);\n\n\t\tif (bAlreadySeen)\n\t\t{\n\t\t\tUE_LOG(LogHasard, Error, TEXT("Rim audit: slot %d repeats %d"), RimIndex, Number);\n\t\t\t++Offenders;\n\t\t}\n\t}\n\n\t// The claim, stated on every run: this is a wheel. Every number present, once each,\n\t// none invented. A distinct count below the pocket count is a repeat and an omission\n\t// in the same list, which is the typo a person cannot see and a spin will not reveal.\n\tUE_LOG(LogHasard, Warning,\n\t\tTEXT("Rim audit: %d pockets, %d distinct, %d offenders, %.4f degrees each"),\n\t\tCount, Seen.Num(), Offenders, 360.0f / static_cast&lt;float&gt;(Count));\n}\n\nvoid AHasardWheel::PreparePockets(UInstancedStaticMeshComponent* Component,\n\tconst FColor&amp; Color) const\n{\n\tif (!Component || !PocketMesh || !PocketMaterial)\n\t{\n\t\treturn;\n\t}\n\n\tComponent-&gt;SetStaticMesh(PocketMesh);\n\n\tUMaterialInstanceDynamic* Instance =\n\t\tComponent-&gt;CreateDynamicMaterialInstance(0, PocketMaterial);\n\n\tif (Instance &amp;&amp; !ColorParameterName.IsNone())\n\t{\n\t\t// FromSRGBColor, not the FLinearColor constructor: these are authored as sRGB in\n\t\t// the details panel, and treating those bytes as linear washes every one of them\n\t\t// out. The felt learned this the same way.\n\t\tInstance-&gt;SetVectorParameterValue(ColorParameterName, FLinearColor::FromSRGBColor(Color));\n\t}\n}\n\nUInstancedStaticMeshComponent* AHasardWheel::PocketsFor(int32 Number,\n\tconst UHasardTableLayout* Layout) const\n{\n\t// Zero first. It is not in the red set, so asking IsRedNumber first would print it in\n\t// the black plate - the same ordering trap the felt met in guide 3 module 4.\n\tif (Number == 0)\n\t{\n\t\treturn ZeroPocket;\n\t}\n\n\treturn (Layout &amp;&amp; Layout-&gt;IsRedNumber(Number)) ? RedPockets : BlackPockets;\n}\n\nvoid AHasardWheel::BuildPockets()\n{\n\t// Clear first and unconditionally, before the bShowPockets test. OnConstruction runs\n\t// again on every property edit, and a pass that only added would stack a second rim\n\t// on the first.\n\tRedPockets-&gt;ClearInstances();\n\tBlackPockets-&gt;ClearInstances();\n\tZeroPocket-&gt;ClearInstances();\n\n\tUInstancedStaticMeshComponent* const Plates[] = { RedPockets, BlackPockets, ZeroPocket };\n\n\tfor (UInstancedStaticMeshComponent* Component : Plates)\n\t{\n\t\tComponent-&gt;SetVisibility(bShowPockets);\n\t}\n\n\tif (!bShowPockets)\n\t{\n\t\treturn;\n\t}\n\n\tif (!PocketMesh || !PocketMaterial)\n\t{\n\t\t// Loud, because the alternative is a wheel that still decides the result while\n\t\t// showing the player nothing to read it off.\n\t\tUE_LOG(LogHasard, Error,\n\t\t\tTEXT("Wheel: BP_WHEEL needs both Pocket Mesh and Pocket Material to print the rim"));\n\t\treturn;\n\t}\n\n\tif (!TableLayout)\n\t{\n\t\tUE_LOG(LogHasard, Error,\n\t\t\tTEXT("Wheel: BP_WHEEL has no Table Layout - the rim cannot be coloured"));\n\t}\n\n\tPreparePockets(RedPockets, RedPocketColor);\n\tPreparePockets(BlackPockets, BlackPocketColor);\n\tPreparePockets(ZeroPocket, ZeroPocketColor);\n\n\tconst int32 Count = GetPocketCount();\n\n\t// A plate is exactly as wide as the arc it owns, measured at its own radius, so the\n\t// thirty-seven meet without a gap and without overlapping. Typing a width instead\n\t// would be a second statement of how many pockets there are, and the rim already\n\t// says that once.\n\tconst float DegreesPerPocket = 360.0f / static_cast&lt;float&gt;(Count);\n\tconst float PlateWidth =\n\t\t2.0f * PocketRadius * FMath::Tan(FMath::DegreesToRadians(DegreesPerPocket * 0.5f));\n\n\t// PocketMesh is a unit quad measured in centimetres, so the scale is the size wanted\n\t// over the mesh\'s own. Read it from the asset rather than assuming 100: swapping in a\n\t// differently sized quad should change nothing the player sees.\n\tconst FVector MeshSize = PocketMesh-&gt;GetBounds().BoxExtent * 2.0f;\n\tconst float MeshX = FMath::IsNearlyZero(MeshSize.X) ? 1.0f : MeshSize.X;\n\tconst float MeshY = FMath::IsNearlyZero(MeshSize.Y) ? 1.0f : MeshSize.Y;\n\n\tfor (const int32 Number : GetPocketSequence())\n\t{\n\t\tfloat Yaw = 0.0f;\n\t\tif (!TryGetPocketYaw(Number, Yaw))\n\t\t{\n\t\t\tcontinue;\n\t\t}\n\n\t\tconst FRotator Facing(0.0f, Yaw, 0.0f);\n\n\t\tPocketsFor(Number, TableLayout)-&gt;AddInstance(FTransform(\n\t\t\tFacing,\n\t\t\tFacing.RotateVector(FVector(PocketRadius, 0.0f, PocketZOffset)),\n\t\t\tFVector(PocketLength / MeshX, PlateWidth / MeshY, 1.0f)));\n\t}\n\n\tUE_LOG(LogHasard, Warning,\n\t\tTEXT("Wheel: printed %d pockets - %d red, %d black, %d zero"),\n\t\tRedPockets-&gt;GetInstanceCount() + BlackPockets-&gt;GetInstanceCount()\n\t\t\t+ ZeroPocket-&gt;GetInstanceCount(),\n\t\tRedPockets-&gt;GetInstanceCount(), BlackPockets-&gt;GetInstanceCount(),\n\t\tZeroPocket-&gt;GetInstanceCount());\n}\n\nvoid AHasardWheel::BuildNumerals()\n{\n\t// Destroy first and unconditionally, before the bShowNumerals test. Turning numerals\n\t// off and rebuilding has to remove them, not leave the previous set standing.\n\tfor (const TObjectPtr&lt;UTextRenderComponent&gt;&amp; Existing : Numerals)\n\t{\n\t\tif (Existing)\n\t\t{\n\t\t\tExisting-&gt;DestroyComponent();\n\t\t}\n\t}\n\tNumerals.Reset();\n\n\tif (!bShowNumerals || !RimRoot)\n\t{\n\t\treturn;\n\t}\n\n\tfor (const int32 Number : GetPocketSequence())\n\t{\n\t\tfloat Yaw = 0.0f;\n\t\tif (!TryGetPocketYaw(Number, Yaw))\n\t\t{\n\t\t\tcontinue;\n\t\t}\n\n\t\tUTextRenderComponent* Numeral = NewObject&lt;UTextRenderComponent&gt;(this);\n\n\t\t// Movable before registering. A component made with NewObject is static, and\n\t\t// moving a registered static component warns and is then ignored.\n\t\tNumeral-&gt;SetMobility(EComponentMobility::Movable);\n\t\tNumeral-&gt;RegisterComponent();\n\n\t\t// Attached to the unscaled rim node rather than to the flattened mesh, so the rim\n\t\t// still carries the numbers round and nothing squashes them on the way.\n\t\tNumeral-&gt;AttachToComponent(RimRoot, FAttachmentTransformRules::KeepRelativeTransform);\n\n\t\tconst FRotator Facing(0.0f, Yaw, 0.0f);\n\t\tNumeral-&gt;SetRelativeLocation(\n\t\t\tFacing.RotateVector(FVector(NumeralRadius, 0.0f, NumeralZOffset)));\n\t\tNumeral-&gt;SetRelativeRotation(\n\t\t\tFRotator(NumeralRotation.Pitch, NumeralRotation.Yaw + Yaw, NumeralRotation.Roll));\n\n\t\tNumeral-&gt;SetText(FText::AsNumber(Number));\n\t\tNumeral-&gt;SetWorldSize(NumeralTextSize);\n\t\tNumeral-&gt;SetHorizontalAlignment(EHTA_Center);\n\t\tNumeral-&gt;SetVerticalAlignment(EVRTA_TextCenter);\n\n\t\t// One colour, every pocket. The plate under it says red, black or green.\n\t\tNumeral-&gt;SetTextRenderColor(NumeralColor);\n\n\t\tNumerals.Add(Numeral);\n\t}\n\n\tUE_LOG(LogHasard, Warning, TEXT("Wheel: printed %d numerals"), Numerals.Num());\n}</code></pre> <p>The winning pocket is logged at <code>Verbose</code> rather than <code>Warning</code>. It is genuinely useful to be able to see that the result existed before the animation did &mdash; that is the claim this module makes &mdash; but printing it at the normal level would put the answer in front of anyone watching the log six seconds early. <code>LogHasard Verbose</code> in the console turns it on when you want it.</p> <p><b>Phase 2 &mdash; build and spin.</b></p> <p><b>3.</b> Save all, close the editor, <code>Ctrl+Shift+B</code>, reopen, open <code>L_RouletteTest</code>.</p> <p><b>4.</b> Press <b>Play</b> and press your spin key. The rim turns three revolutions and slows; the ball travels the other way, six revolutions, dropping from the outer track to the pocket radius as it goes. Both stop together, and the ball is sitting in a numbered pocket.</p> <p><b>5.</b> Read the log:</p> <pre><code>LogHasard: Warning: Wheel: spin started, 6.0s\nLogHasard: Warning: Wheel: ball settled in pocket 17\nLogHasard: Warning: Ball settled in pocket 17</code></pre> <p>Now look at the wheel and check the number under the ball is the number in that line. <b>Do this several times.</b> It is the only verification in this module that a computer cannot do for you, and module 5 is about the fact that a machine cannot tell you whether an animation is honest.</p> <p><b>6.</b> Turn on the spoiler and watch the claim hold. In the console:</p> <pre><code>LogHasard Verbose</code></pre> <p>Spin again. The pocket is now printed the moment you press the key, six seconds before the ball arrives, and the ball arrives there. Set it back with <code>LogHasard Warning</code>.</p> <p><b>7.</b> Confirm the frame-rate claim rather than taking it on trust. Run <code>t.MaxFPS 20</code>, spin, and note the pocket; then <code>t.MaxFPS 0</code> and spin again. The ball travels visibly more jerkily at 20 fps and still lands cleanly centred in its pocket, because the position was never a sum of frames.</p> <p><b>8.</b> Commit.</p> <pre><code>git add -A\ngit commit -m "Animate the spin toward a pocket decided at the start"</code></pre> <p><b>The failures worth recognising.</b> <code>Spin landed the ball on X and is broadcasting Y</code> means the arithmetic and the transforms disagree &mdash; check the sign in <code>TryGetPocketYaw</code> first. <b>The ball orbits but the numerals do not move</b> means module 3&rsquo;s numerals attached to the root instead of to <code>RimRoot</code>. <b>Nothing moves at all</b> and no errors means <code>bCanEverTick</code> is still <code>false</code>.</p>'},

quiz:[
{q:'The spin position is computed from <code>SpinElapsed / SpinDuration</code> rather than by adding to a rotation each frame because:',
 opts:['An accumulated rotation makes the landing angle depend on how many frames elapsed','<code>FRotator</code> cannot be added to safely','Tick is not called at a fixed rate','It uses less memory'],
 c:0,why:'Two machines cross six seconds in a different number of steps. Position as a function of elapsed time removes the question, which matters here because the endpoint is the result the player is paid on.'},
{q:'The ball&rsquo;s path is composed from its destination backwards. The consequence is:',
 opts:['The ball can only travel clockwise','The animation cannot be interrupted','A wrong sweep value produces a wrong path and a correct landing','The spin duration must be a whole number of seconds'],
 c:2,why:'The gap is the remaining distance times (1 - Eased), which is exactly zero at the end whatever the sweeps are. Errors surface as a visibly odd route rather than as a wrong result.'},
{q:'Cubic ease-out was rejected in favour of quadratic because:',
 opts:['Cubic is more expensive to compute','<code>FMath::Pow</code> is not available in shipping builds','Cubic does not reach exactly 1 at Alpha 1','Cubic covers three degrees in its last half second, so the ball appears to stop and then creep'],
 c:3,why:'Both land correctly; the difference is entirely visual. A ball that hesitates before settling is the shape of a near miss arrived at by accident.'},
{q:'<code>FinishSpin</code> computes <code>GetPocketAtYaw(BallYaw - WheelYaw)</code> and compares it to the pocket it is about to broadcast. That check catches:',
 opts:['A biased random number generator','A payout row with the wrong ratio','A sign error, a wrong sweep, or a rounding fault at the wrap','A missing table layout'],
 c:2,why:'It is a round trip through the transforms that were actually applied. Bias in DetermineWinningPocket is the distribution test’s job, and the two are not substitutes.'},
{q:'The winning pocket is logged at <code>Verbose</code> at the start of the spin because:',
 opts:['<code>Warning</code> is stripped from Development builds','The evidence that the result predates the animation is worth having on demand, but not worth spoiling every spin','Verbose logs are written to a separate file','It would otherwise appear twice'],
 c:1,why:'LogHasard Verbose turns it on when you want to demonstrate the claim, and leaves the answer out of the log the rest of the time.'},
{q:'The spin timer was deleted rather than kept alongside the tick because:',
 opts:['<code>FTimerHandle</code> cannot coexist with <code>Tick</code>','Timers do not fire while an actor is ticking','The timer would fire in a packaged build only','A timer is for waiting, and two things deciding when the spin ends is one too many'],
 c:3,why:'Tick already knows when Alpha reaches 1. Leaving the timer in place would give the spin two possible endings, and the interesting bugs are the ones where they disagree.'}

title:"What the animation must not do",
lede:"Six seconds in which the game knows and the player does not. Five things that are deliberately not in the code, one of them enforced by the shape of the class - and the arithmetic that proves the ball lands where the log says.",
blocks:[
{t:'h',x:'The gap you just built'},
{t:'p',x:'Module 4 created six seconds in which the game knows the answer and the player does not. That gap is not a side effect to be tolerated &mdash; it is load-bearing, because it is what makes the result independent of the animation. It is also the most valuable six seconds in commercial gambling design, and every technique for exploiting it is well documented and widely shipped.'},
{t:'rg',lab:'The rule, written before there was a ball',x:'<p><code>CLAUDE.md</code>, under <b>never implement</b>:</p><p><i>&ldquo;<b>Near-miss animations</b>, or any feedback that makes a loss feel close. The ball landing one pocket over is a loss and must read as a loss.&rdquo;</i></p><p>Also on that list, and relevant here: <i>losses disguised as wins</i>, and <i>dark patterns that extend a session</i>. A spin is where all three meet, because a spin is the only moment in this game with a built-in dramatic structure.</p><p>The list is described in that file as <b>not tunable, not negotiable</b>, including a softened version &ldquo;just to see how it feels&rdquo;. This module is where that stops being a policy and becomes a set of lines that are not in the code.</p>'},
{t:'h',x:'Five refusals, and exactly where each one would have gone'},
{t:'p',x:'Refusals are hard to see, because the evidence for them is an absence. So here is where each would live if it existed:'},
{t:'table',head:['Refused','Where it would go','What it would do'],rows:[['Slow motion on approach','<code>Tick</code>, scaling <code>DeltaSeconds</code> as <code>Alpha</code> passes ~0.85','Stretches the last second so the outcome arrives slowly. The classic, and the easiest to add - four characters.'],['A hover before the pocket','the easing curve','A curve that flattens near 1 and then completes. Module 4 met this one <i>by accident</i> with cubic easing and rejected it on the numbers.'],['A bounce through the neighbours','<code>ApplySpin</code>, adding a decaying oscillation to <code>BallYaw</code>','Visits the pockets either side before settling. <code>HasardShowPocket</code> prints those two neighbours - that output is a near-miss author&rsquo;s shopping list, which is why the module that added it said so.'],['An extra revolution when the player has a bet nearby','<code>StartSpin</code>, after asking the betting component what was staked','The expensive one, because it is the only one that is <i>targeted</i>. It needs to know what the player backed.'],['Camera work keyed to the outcome','the pawn, on <code>OnBallSettled</code>','A push-in on the losing pocket. Sits outside the wheel entirely, which is why it is worth naming here.']]},
{t:'p',x:'The fourth is the one worth dwelling on, because refusing it is <b>structural rather than disciplinary</b>.'},
{t:'p',x:'<code>AHasardWheel</code> includes nothing about bets. It has no reference to the betting component, no reference to the bankroll, and no way to reach either. The flow of a round runs one way &mdash; wheel broadcasts, GameMode resolves, betting component settles &mdash; and the wheel is upstream of all of it. A targeted near miss needs to know what the player backed, and the class that decides where the ball goes cannot find out.'},
{t:'p',x:'That is not an accident of the guide-2 design, but it was not deliberate then either. It is deliberate now, and the useful version of this module is being able to say so: <b>the wheel must not be given a way to learn what was bet, and any future change that hands it one is the change to argue about.</b>'},
{t:'warn',lab:'There is no HasardSpinTo, and there will not be',x:'<p>A console command that spins to a chosen pocket would be genuinely useful for this module. It would let you verify the landing for all 37 numbers by eye in two minutes instead of waiting for them to come up, and testing is a completely legitimate reason to want it.</p><p>It is also a rigging tool. It picks the outcome and then pays out against it, which is the entire mechanism a fixed wheel needs, sitting in the build behind a name that sounds like a debug command. &ldquo;It was convenient for testing&rdquo; is exactly how such things arrive, and &ldquo;it is only in Development builds&rdquo; is not much of an answer when the Development build is the one you hand to an interviewer.</p><p>The landing is verified by arithmetic instead. It is a better test and it ships nothing.</p>'},
{t:'h',x:'What is tested, and the difference between a check and a test'},
{t:'p',x:'There are now two guards on the landing and they do different jobs.'},
{t:'list',x:['<b><code>FinishSpin</code>&rsquo;s comparison</b> runs on every real spin and checks the pocket that actually came up. It is an assertion: it protects the player in front of you, and it only ever exercises the numbers that happen to occur.','<b><code>HasardTestLanding</code></b> walks all 37 pockets deterministically and checks each one at its centre and at nine tenths of a half-pocket either side. It is a test: it exercises every number in one command, including the ones that will not come up for a hundred spins.']},
{t:'chk',q:'If <code>FinishSpin</code> already checks every spin, what does the nudge test add? The arrival is exact, so the ball never stops off centre.',a:'<p><b>It is exact <i>today</i>.</b> The nudge test is not about the current code &mdash; it is about the next person to touch it, including you in three months.</p><p>Add a settle animation, a bounce, a physical drop into the pocket, or replace the easing with something that overshoots slightly, and the ball starts arriving a fraction off centre. If half a pocket of slack does not resolve to the same number, that change silently starts paying the wrong pocket at the boundaries. The test states the tolerance the rest of the wheel is allowed to assume, so that the change which breaks it fails loudly instead of paying quietly.</p>'},
{t:'h',x:'Closing an open decision'},
{t:'p',x:'<code>docs/leftover.md</code> has carried this since 2026-08-06:'},
{t:'code',x:'3. Spin result: predetermined, or emergent from ball physics. Undecided, and it\n   decides whether the physics drives the outcome or merely presents it - so decide\n   before the wheel is built.'},
{t:'p',x:'The wheel is now built, and the decision has been implicit in the code since guide 2. This module writes it down, because a decision that only exists as an implementation is a decision nobody can be held to.'},
{t:'build',title:'The landing test, and the decision',file:'Source/Hasard/HasardGameMode.h + .cpp, docs/spin-test.md, CLAUDE.md',x:'<p><b>Phase 1 &mdash; Visual Studio.</b> Two files. The wheel does not change: the refusals above are things that are not in it.</p> <p><b>1.</b> <code>HasardGameMode.h</code>, complete. One new exec:</p> <pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"\n#include "GameFramework/GameModeBase.h"\n#include "HasardGameMode.generated.h"\n\nclass AHasardWheel;\nclass UHasardPayoutTable;\nclass UHasardTableLayout;\n\nUENUM(BlueprintType)\nenum class EHasardRoundPhase : uint8\n{\n\tBetting  UMETA(DisplayName = "Betting"),\n\tSpinning UMETA(DisplayName = "Spinning"),\n\tSettling UMETA(DisplayName = "Settling")\n};\n\nUCLASS()\nclass HASARD_API AHasardGameMode : public AGameModeBase\n{\n\tGENERATED_BODY()\n\npublic:\n\tAHasardGameMode();\n\n\t/** Console: HasardTestDistribution 370000 */\n\tUFUNCTION(Exec)\n\tvoid HasardTestDistribution(int32 SpinCount);\n\n\t/** Console: HasardShowCell 17 */\n\tUFUNCTION(Exec)\n\tvoid HasardShowCell(int32 Number);\n\n\t/** Console: HasardAuditLayout */\n\tUFUNCTION(Exec)\n\tvoid HasardAuditLayout();\n\n\t/** Console: HasardShowPocket 17 */\n\tUFUNCTION(Exec)\n\tvoid HasardShowPocket(int32 Number);\n\n+|\t/** Console: HasardTestLanding */\n+|\tUFUNCTION(Exec)\n+|\tvoid HasardTestLanding();\n+|\n\n\t/** Settles one round against the payout table. */\n\tUFUNCTION(BlueprintCallable, Category = "Hasard|Round")\n\tvoid ResolveRound(int32 WinningPocket);\n\n\t/** The HUD reads odds through this. Const: nothing may edit the table at runtime. */\n\tconst UHasardPayoutTable* GetPayoutTable() const { return PayoutTable; }\n\n\t/** The felt reads its measurements through this. Const for the same reason. */\n\tconst UHasardTableLayout* GetTableLayout() const { return TableLayout; }\n\nprotected:\n\tvirtual void BeginPlay() override;\n\tvirtual void EndPlay(const EEndPlayReason::Type EndPlayReason) override;\n\nprivate:\n\t/** Bound to the wheel delegate in BeginPlay. UFUNCTION is what AddDynamic resolves by name. */\n\tUFUNCTION()\n\tvoid HandleBallSettled(int32 WinningPocket);\n\n\t/** Cached so EndPlay unbinds from the same wheel BeginPlay bound to. */\n\tUPROPERTY()\n\tTObjectPtr&lt;AHasardWheel&gt; BoundWheel;\n\n\t/** Assigned on BP_HasardGameMode. Payouts never come from a literal. */\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Round",\n\t\tmeta = (AllowPrivateAccess = "true"))\n\tTObjectPtr&lt;UHasardPayoutTable&gt; PayoutTable;\n\n\t/** Assigned on BP_HasardGameMode. Measurements never come from a literal either. */\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Round",\n\t\tmeta = (AllowPrivateAccess = "true"))\n\tTObjectPtr&lt;UHasardTableLayout&gt; TableLayout;\n\n\tUPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category = "Hasard|Round",\n\t\tmeta = (AllowPrivateAccess = "true"))\n\tEHasardRoundPhase CurrentPhase = EHasardRoundPhase::Betting;\n\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Round",\n\t\tmeta = (AllowPrivateAccess = "true", ClampMin = "1.0"))\n\tfloat BettingWindowSeconds = 30.0f;\n};\n</code></pre> <p><b>2.</b> <code>HasardGameMode.cpp</code>, complete:</p> <pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#include "HasardGameMode.h"\n#include "HasardBettingComponent.h"\n#include "HasardPayoutTable.h"\n#include "HasardPlayerController.h"\n#include "HasardPlayerState.h"\n#include "HasardTableLayout.h"\n#include "HasardTypes.h"\n#include "HasardWheel.h"\n#include "GameFramework/Pawn.h"\n#include "Kismet/GameplayStatics.h"\n#include "Engine/World.h"\n\nDEFINE_LOG_CATEGORY(LogHasard);\n\nAHasardGameMode::AHasardGameMode()\n{\n\tPlayerControllerClass = AHasardPlayerController::StaticClass();\n\tPlayerStateClass = AHasardPlayerState::StaticClass();\n}\n\nvoid AHasardGameMode::BeginPlay()\n{\n\tSuper::BeginPlay();\n\n\tUE_LOG(LogHasard, Warning, TEXT("GameMode BeginPlay - phase %s, betting window: %.1fs"),\n\t\t*UEnum::GetValueAsString(CurrentPhase), BettingWindowSeconds);\n\n\tAActor* Found = UGameplayStatics::GetActorOfClass(GetWorld(), AHasardWheel::StaticClass());\n\n\tif (AHasardWheel* Wheel = Cast&lt;AHasardWheel&gt;(Found))\n\t{\n\t\tWheel-&gt;OnBallSettled.AddDynamic(this, &amp;AHasardGameMode::HandleBallSettled);\n\t\tBoundWheel = Wheel;\n\t}\n\telse\n\t{\n\t\tUE_LOG(LogHasard, Error, TEXT("GameMode: no wheel in the level - rounds will never resolve"));\n\t}\n\n\tif (!TableLayout)\n\t{\n\t\tUE_LOG(LogHasard, Error, TEXT("GameMode: no table layout on BP_HasardGameMode"));\n\t}\n\n\tif (!PayoutTable)\n\t{\n\t\tUE_LOG(LogHasard, Error, TEXT("GameMode: no payout table on BP_HasardGameMode"));\n\t\treturn;\n\t}\n\n\t// The audit. Fifteen rows, one line each, and the edge column is the claim\n\t// this project exists to make - so the game states it out loud on every run.\n\tfor (const FHasardPayoutRule&amp; Rule : PayoutTable-&gt;Rules)\n\t{\n\t\tUE_LOG(LogHasard, Warning,\n\t\t\tTEXT("Payout audit: %s pays %d:1, covers %d/%d, true odds %.2f:1, edge %.2f%%"),\n\t\t\t*Rule.DisplayName.ToString(), Rule.PayoutRatio, Rule.CoveredNumbers,\n\t\t\tPayoutTable-&gt;PocketCount, PayoutTable-&gt;GetTrueOdds(Rule),\n\t\t\tPayoutTable-&gt;GetHouseEdge(Rule) * 100.0f);\n\t}\n\n\tfloat SharedEdge = 0.0f;\n\tif (!PayoutTable-&gt;TryGetSharedHouseEdge(SharedEdge))\n\t{\n\t\tUE_LOG(LogHasard, Error,\n\t\t\tTEXT("Payout audit: the rows do not share one edge. A row is wrong."));\n\t}\n\n\t// Two objects hold a pocket count. The wheel is the physical rim; the payout table is\n\t// what the edge was priced against. They are genuinely separate facts - pointing the\n\t// GameMode at an American table is a thing a designer may legitimately do - so they\n\t// are allowed to differ. They are not allowed to differ *silently*, because the figure\n\t// on the HUD is computed from one of them and paid out against the other.\n\tif (BoundWheel &amp;&amp; BoundWheel-&gt;GetPocketCount() != PayoutTable-&gt;PocketCount)\n\t{\n\t\tUE_LOG(LogHasard, Error,\n\t\t\tTEXT("Pocket mismatch: the wheel has %d pockets, the payout table is priced for %d"),\n\t\t\tBoundWheel-&gt;GetPocketCount(), PayoutTable-&gt;PocketCount);\n\t}\n}\n\nvoid AHasardGameMode::EndPlay(const EEndPlayReason::Type EndPlayReason)\n{\n\t// The rule the PlayerController already follows: whoever binds, unbinds.\n\tif (BoundWheel)\n\t{\n\t\tBoundWheel-&gt;OnBallSettled.RemoveDynamic(this, &amp;AHasardGameMode::HandleBallSettled);\n\t\tBoundWheel = nullptr;\n\t}\n\n\tSuper::EndPlay(EndPlayReason);\n}\n\nvoid AHasardGameMode::HandleBallSettled(int32 WinningPocket)\n{\n\tUE_LOG(LogHasard, Warning, TEXT("Ball settled in pocket %d"), WinningPocket);\n\tResolveRound(WinningPocket);\n}\n\nvoid AHasardGameMode::ResolveRound(int32 WinningPocket)\n{\n\tCurrentPhase = EHasardRoundPhase::Settling;\n\n\tAPawn* PlayerPawn = UGameplayStatics::GetPlayerPawn(GetWorld(), 0);\n\tUHasardBettingComponent* Betting =\n\t\tPlayerPawn ? PlayerPawn-&gt;FindComponentByClass&lt;UHasardBettingComponent&gt;() : nullptr;\n\n\tif (!PayoutTable)\n\t{\n\t\tUE_LOG(LogHasard, Error, TEXT("ResolveRound: no payout table on BP_HasardGameMode"));\n\t}\n\telse if (!TableLayout)\n\t{\n\t\tUE_LOG(LogHasard, Error, TEXT("ResolveRound: no table layout on BP_HasardGameMode"));\n\t}\n\telse if (!Betting)\n\t{\n\t\tUE_LOG(LogHasard, Warning, TEXT("ResolveRound: no betting component to settle"));\n\t}\n\telse\n\t{\n\t\tBetting-&gt;SettleRound(WinningPocket, PayoutTable, TableLayout);\n\t}\n\n\t// Whatever happened above, the table reopens. A round that cannot settle must\n\t// not strand the game in Settling forever.\n\tCurrentPhase = EHasardRoundPhase::Betting;\n}\n\nvoid AHasardGameMode::HasardTestDistribution(int32 SpinCount)\n{\n\tif (SpinCount &lt;= 0)\n\t{\n\t\tUE_LOG(LogHasard, Error, TEXT("SpinCount must be positive"));\n\t\treturn;\n\t}\n\n\tAHasardWheel* Wheel = Cast&lt;AHasardWheel&gt;(\n\t\tUGameplayStatics::GetActorOfClass(this, AHasardWheel::StaticClass()));\n\tif (!Wheel)\n\t{\n\t\tUE_LOG(LogHasard, Error, TEXT("No wheel in the level"));\n\t\treturn;\n\t}\n\n\tconst int32 PocketCount = Wheel-&gt;GetPocketCount();\n\n\tTArray&lt;int32&gt; Counts;\n\tCounts.Init(0, PocketCount);\n\n\tfor (int32 i = 0; i &lt; SpinCount; ++i)\n\t{\n\t\tCounts[Wheel-&gt;DetermineWinningPocket()]++;\n\t}\n\n\tconst float Expected = static_cast&lt;float&gt;(SpinCount) / PocketCount;\n\n\tfor (int32 Pocket = 0; Pocket &lt; PocketCount; ++Pocket)\n\t{\n\t\tconst float Deviation = (Counts[Pocket] - Expected) / Expected * 100.0f;\n\t\tUE_LOG(LogHasard, Display, TEXT("Pocket %2d: %5d hits (%+.1f%% from expected)"),\n\t\t\tPocket, Counts[Pocket], Deviation);\n\t}\n}\n\nvoid AHasardGameMode::HasardShowCell(int32 Number)\n{\n\tif (!TableLayout)\n\t{\n\t\tUE_LOG(LogHasard, Error, TEXT("No table layout on BP_HasardGameMode"));\n\t\treturn;\n\t}\n\n\tif (Number == 0)\n\t{\n\t\tUE_LOG(LogHasard, Display, TEXT("0 has its own box beside the grid, so it has no column or row"));\n\t\treturn;\n\t}\n\n\tconst int32 Column = TableLayout-&gt;GetColumnOf(Number);\n\tconst int32 Row = TableLayout-&gt;GetRowOf(Number);\n\n\tif (Column == INDEX_NONE || Row == INDEX_NONE)\n\t{\n\t\tUE_LOG(LogHasard, Error, TEXT("%d is not a number on this grid"), Number);\n\t\treturn;\n\t}\n\n\tconst FVector2D Center = TableLayout-&gt;GetCellCenter(Column, Row);\n\n\tUE_LOG(LogHasard, Display, TEXT("%d is column %d, row %d - center (%.1f, %.1f), %s"),\n\t\tNumber, Column, Row, Center.X, Center.Y,\n\t\tTableLayout-&gt;IsRedNumber(Number) ? TEXT("red") : TEXT("black"));\n}\n\nvoid AHasardGameMode::HasardAuditLayout()\n{\n\tif (!TableLayout || !PayoutTable)\n\t{\n\t\tUE_LOG(LogHasard, Error,\n\t\t\tTEXT("Assign both TableLayout and PayoutTable on BP_HasardGameMode"));\n\t\treturn;\n\t}\n\n\tTArray&lt;FHasardBetPosition&gt; Positions;\n\tTableLayout-&gt;BuildPositions(Positions);\n\n\t// The claim being tested: every position on a single-zero table pays 2.70% to the house.\n\tconst float ExpectedEdge = 1.0f / static_cast&lt;float&gt;(PayoutTable-&gt;PocketCount);\n\n\tTMap&lt;EHasardBetType, int32&gt; CountByType;\n\tint32 Offenders = 0;\n\n\tfor (const FHasardBetPosition&amp; Position : Positions)\n\t{\n\t\tCountByType.FindOrAdd(Position.BetType)++;\n\n\t\tconst FHasardPayoutRule* Rule = PayoutTable-&gt;FindRule(Position.BetType);\n\t\tif (!Rule)\n\t\t{\n\t\t\tUE_LOG(LogHasard, Error, TEXT("Position %d (%s): no payout row for this bet type"),\n\t\t\t\tPosition.PositionId, *Position.DisplayName.ToString());\n\t\t\t++Offenders;\n\t\t\tcontinue;\n\t\t}\n\n\t\t// Two different CoveredNumbers: the position holds the actual numbers,\n\t\t// the payout row holds how many there are meant to be. They must agree.\n\t\tif (Position.CoveredNumbers.Num() != Rule-&gt;CoveredNumbers)\n\t\t{\n\t\t\tUE_LOG(LogHasard, Error,\n\t\t\t\tTEXT("Position %d (%s): covers %d numbers, payout row expects %d"),\n\t\t\t\tPosition.PositionId, *Position.DisplayName.ToString(),\n\t\t\t\tPosition.CoveredNumbers.Num(), Rule-&gt;CoveredNumbers);\n\t\t\t++Offenders;\n\t\t\tcontinue;\n\t\t}\n\n\t\tif (!FMath::IsNearlyEqual(PayoutTable-&gt;GetHouseEdge(*Rule), ExpectedEdge, 0.0001f))\n\t\t{\n\t\t\tUE_LOG(LogHasard, Error, TEXT("Position %d (%s): edge %.2f%%, expected %.2f%%"),\n\t\t\t\tPosition.PositionId, *Position.DisplayName.ToString(),\n\t\t\t\tPayoutTable-&gt;GetHouseEdge(*Rule) * 100.0f, ExpectedEdge * 100.0f);\n\t\t\t++Offenders;\n\t\t}\n\t}\n\n\t// The printed felt is generated from BoxSize, so a layout that overlaps two boxes\n\t// draws one over the other and looks merely odd. The same numbers feed ResolvePosition,\n\t// which means the odd-looking cell is also the cell whose clicks land somewhere else -\n\t// and that failure is silent. Checked here rather than in the felt because it is a\n\t// property of the layout asset, true or false before anything is drawn.\n\tFVector2D FeltMin, FeltMax;\n\tTableLayout-&gt;GetFeltBounds(FeltMin, FeltMax);\n\n\t// Neighboring boxes share an edge exactly. Shrink both sides of every comparison so\n\t// touching is not reported as overlapping - only a real intersection is.\n\tconst float Shrink = 0.01f;\n\tint32 Boxes = 0;\n\tint32 BoxOffenders = 0;\n\n\tfor (const FHasardBetPosition&amp; Position : Positions)\n\t{\n\t\tif (Position.BoxSize.IsNearlyZero())\n\t\t{\n\t\t\tcontinue;\n\t\t}\n\n\t\t++Boxes;\n\n\t\tconst FVector2D Min = Position.ChipLocation - Position.BoxSize * 0.5f;\n\t\tconst FVector2D Max = Position.ChipLocation + Position.BoxSize * 0.5f;\n\n\t\tif (Min.X &lt; FeltMin.X - Shrink || Min.Y &lt; FeltMin.Y - Shrink\n\t\t\t|| Max.X &gt; FeltMax.X + Shrink || Max.Y &gt; FeltMax.Y + Shrink)\n\t\t{\n\t\t\tUE_LOG(LogHasard, Error,\n\t\t\t\tTEXT("Position %d (%s): box runs outside the felt bounds"),\n\t\t\t\tPosition.PositionId, *Position.DisplayName.ToString());\n\t\t\t++BoxOffenders;\n\t\t}\n\n\t\tfor (const FHasardBetPosition&amp; Other : Positions)\n\t\t{\n\t\t\t// Ids ascend with the array, so the pair is only ever tested once.\n\t\t\tif (Other.PositionId &lt;= Position.PositionId || Other.BoxSize.IsNearlyZero())\n\t\t\t{\n\t\t\t\tcontinue;\n\t\t\t}\n\n\t\t\tconst FVector2D OtherMin = Other.ChipLocation - Other.BoxSize * 0.5f;\n\t\t\tconst FVector2D OtherMax = Other.ChipLocation + Other.BoxSize * 0.5f;\n\n\t\t\tconst bool bOverlaps =\n\t\t\t\tMin.X &lt; OtherMax.X - Shrink &amp;&amp; Max.X &gt; OtherMin.X + Shrink &amp;&amp;\n\t\t\t\tMin.Y &lt; OtherMax.Y - Shrink &amp;&amp; Max.Y &gt; OtherMin.Y + Shrink;\n\n\t\t\tif (bOverlaps)\n\t\t\t{\n\t\t\t\tUE_LOG(LogHasard, Error, TEXT("Positions %d (%s) and %d (%s): boxes overlap"),\n\t\t\t\t\tPosition.PositionId, *Position.DisplayName.ToString(),\n\t\t\t\t\tOther.PositionId, *Other.DisplayName.ToString());\n\t\t\t\t++BoxOffenders;\n\t\t\t}\n\t\t}\n\t}\n\n\tfor (const TPair&lt;EHasardBetType, int32&gt;&amp; Pair : CountByType)\n\t{\n\t\tUE_LOG(LogHasard, Display, TEXT("%s: %d positions"),\n\t\t\t*UEnum::GetDisplayValueAsText(Pair.Key).ToString(), Pair.Value);\n\t}\n\n\tUE_LOG(LogHasard, Display, TEXT("%d positions generated, %d failing the edge check"),\n\t\tPositions.Num(), Offenders);\n\n\tUE_LOG(LogHasard, Display, TEXT("%d of them are printed boxes, %d failing the box check"),\n\t\tBoxes, BoxOffenders);\n}\n\nvoid AHasardGameMode::HasardShowPocket(int32 Number)\n{\n\tAHasardWheel* Wheel = Cast&lt;AHasardWheel&gt;(\n\t\tUGameplayStatics::GetActorOfClass(this, AHasardWheel::StaticClass()));\n\n\tif (!Wheel)\n\t{\n\t\tUE_LOG(LogHasard, Error, TEXT("No wheel in the level"));\n\t\treturn;\n\t}\n\n\tconst int32 RimIndex = Wheel-&gt;GetRimIndexOf(Number);\n\n\tif (RimIndex == INDEX_NONE)\n\t{\n\t\tUE_LOG(LogHasard, Error, TEXT("%d is not a pocket on this wheel"), Number);\n\t\treturn;\n\t}\n\n\tfloat Degrees = 0.0f;\n\tWheel-&gt;TryGetPocketAngleDegrees(Number, Degrees);\n\n\tconst int32 Count = Wheel-&gt;GetPocketCount();\n\n\t// The two neighbours are printed because they are how you check this against a\n\t// photograph of a real wheel - and because they are the two numbers a near-miss\n\t// animation would want to linger on. Worth knowing their names early.\n\tconst int32 Before = Wheel-&gt;GetNumberAtRimIndex((RimIndex + Count - 1) % Count);\n\tconst int32 After = Wheel-&gt;GetNumberAtRimIndex((RimIndex + 1) % Count);\n\n\tUE_LOG(LogHasard, Display,\n\t\tTEXT("%d is rim slot %d at %.2f degrees, between %d and %d"),\n\t\tNumber, RimIndex, Degrees, Before, After);\n}\n\n+|void AHasardGameMode::HasardTestLanding()\n+|{\n+|\tAHasardWheel* Wheel = Cast&lt;AHasardWheel&gt;(\n+|\t\tUGameplayStatics::GetActorOfClass(this, AHasardWheel::StaticClass()));\n+|\n+|\tif (!Wheel)\n+|\t{\n+|\t\tUE_LOG(LogHasard, Error, TEXT("No wheel in the level"));\n+|\t\treturn;\n+|\t}\n+|\n+|\tconst int32 Count = Wheel-&gt;GetPocketCount();\n+|\n+|\tif (Count &lt;= 0)\n+|\t{\n+|\t\tUE_LOG(LogHasard, Error, TEXT("Landing test: the wheel has no pockets"));\n+|\t\treturn;\n+|\t}\n+|\n+|\t// Half a pocket either side of centre, less a hair so the boundary itself is not the\n+|\t// thing under test. A ball that stops fractionally off centre must still be in its own\n+|\t// number; if it is not, the wheel is a fraction of a pocket out and nobody would see it\n+|\t// until it mattered.\n+|\tconst float HalfPocket = 180.0f / static_cast&lt;float&gt;(Count);\n+|\tconst float Nudge = HalfPocket * 0.9f;\n+|\n+|\tint32 Offenders = 0;\n+|\n+|\tfor (int32 RimIndex = 0; RimIndex &lt; Count; ++RimIndex)\n+|\t{\n+|\t\tconst int32 Number = Wheel-&gt;GetNumberAtRimIndex(RimIndex);\n+|\n+|\t\tfloat Yaw = 0.0f;\n+|\t\tif (!Wheel-&gt;TryGetPocketYaw(Number, Yaw))\n+|\t\t{\n+|\t\t\tUE_LOG(LogHasard, Error, TEXT("Landing test: %d has no yaw"), Number);\n+|\t\t\t++Offenders;\n+|\t\t\tcontinue;\n+|\t\t}\n+|\n+|\t\tconst int32 Centre = Wheel-&gt;GetPocketAtYaw(Yaw);\n+|\n+|\t\tif (Centre != Number)\n+|\t\t{\n+|\t\t\tUE_LOG(LogHasard, Error,\n+|\t\t\t\tTEXT("Landing test: %d sits at %.4f degrees, which reads back as %d"),\n+|\t\t\t\tNumber, Yaw, Centre);\n+|\t\t\t++Offenders;\n+|\t\t\tcontinue;\n+|\t\t}\n+|\n+|\t\tif (Wheel-&gt;GetPocketAtYaw(Yaw + Nudge) != Number\n+|\t\t\t|| Wheel-&gt;GetPocketAtYaw(Yaw - Nudge) != Number)\n+|\t\t{\n+|\t\t\tUE_LOG(LogHasard, Error,\n+|\t\t\t\tTEXT("Landing test: %d does not hold its pocket under a %.2f degree nudge"),\n+|\t\t\t\tNumber, Nudge);\n+|\t\t\t++Offenders;\n+|\t\t}\n+|\t}\n+|\n+|\tUE_LOG(LogHasard, Display,\n+|\t\tTEXT("Landing test: %d pockets, %d failing - %.4f degrees each, +/- %.4f tolerated"),\n+|\t\tCount, Offenders, 360.0f / static_cast&lt;float&gt;(Count), Nudge);\n+|}\n+|</code></pre> <p>The nudge is nine tenths of a half-pocket rather than a half-pocket exactly, because the boundary itself is not the thing under test &mdash; a yaw sitting precisely on the line between two pockets may legitimately go either way, and asserting on it would be asserting on a rounding convention.</p> <p><b>Phase 2 &mdash; build and test.</b></p> <p><b>3.</b> Save all, close the editor, <code>Ctrl+Shift+B</code>, reopen, open <code>L_RouletteTest</code>, <b>Play</b>, <code>~</code>:</p> <pre><code>HasardTestLanding</code></pre> <p><b>4.</b> One line, and both numbers matter:</p> <pre><code>LogHasard: Display: Landing test: 37 pockets, 0 failing - 9.7297 degrees each, +/- 4.3784 tolerated</code></pre> <p><b>5.</b> Prove the test can fail, the way module 1 proved the pocket-count check could. In <code>TryGetPocketYaw</code>, temporarily change <code>OutYaw = -Degrees;</code> to <code>OutYaw = Degrees;</code>, rebuild, and run it again. Thirty-five of the thirty-seven pockets now fail &mdash; only 0 and its opposite survive a mirror &mdash; and the numerals on the rim visibly run the other way. <b>Put it back.</b></p> <p>That is worth doing once, because it is the exact bug module 2 warned about and this is the only way to see what it looks like from the outside.</p> <p><b>6.</b> Spin twenty times and watch the ball. You are checking something no command can check for you: that the deceleration is even, that the ball does not pause or hesitate near the end, that it does not linger beside a pocket before moving on, and that a loss looks exactly like a win until the moment it stops.</p> <p><b>Phase 3 &mdash; write both things down.</b></p> <p><b>7.</b> Create <code>docs/spin-test.md</code>: today&rsquo;s date, the <code>HasardTestLanding</code> output, and a note that twenty spins were watched for the five refusals above. The fifth evidence file, beside <code>distribution-test.md</code>, <code>layout-audit.md</code>, <code>save-test.md</code> and <code>package-notes.md</code>.</p> <p><b>8.</b> Add the decision to <code>CLAUDE.md</code>&rsquo;s decision log, and mark open decision 3 in <code>docs/leftover.md</code> as closed. Suggested wording:</p> <pre><code>### 2026-08-28 - The spin result is predetermined\n\nDetermineWinningPocket picks with FMath::RandRange over a uniform range, at the\nSTART of the spin. The animation is told where to go and does not produce the\nresult.\n\nTwo reasons. A predetermined result is uniform by construction, measurable in\nadvance, and independent of frame rate - docs/distribution-test.md records 370,000\nspins against it. And the HUD claims every bet costs 2.70% of what you stake, which\nis a claim about the distribution over 37 pockets; with a simulated ball that\ndistribution depends on the physics substep rate and could not be stated, let alone\nevidenced.\n\nKnowing the outcome before the animation runs is also what makes a near-miss\npossible. See guide 4 module 5 for the five refusals that follow, and note that the\nstrongest of them is structural: AHasardWheel has no reference to the betting\ncomponent and must not be given one.\n\nCloses open decision 3 in docs/leftover.md, open since 2026-08-06.</code></pre> <p><b>9.</b> Commit.</p> <pre><code>git add -A\ngit commit -m "Add the landing test; record the spin decision"</code></pre>'},

quiz:[
{q:'The strongest of the five refusals is structural rather than disciplinary. Which, and why?',
 opts:['The targeted extra revolution - the wheel has no reference to the betting component and cannot learn what was staked','The camera push-in, because the camera is on the pawn','Slow motion, because <code>DeltaSeconds</code> is const','The hover, because the easing curve is a data asset'],
 c:0,why:'The other four require someone to choose not to write them. That one requires someone to first give the wheel a dependency it does not have - which is a visible change worth arguing about.'},
{q:'There is deliberately no <code>HasardSpinTo</code> command because:',
 opts:['Exec functions cannot take a parameter','It would not work in a packaged build','A command that picks the outcome and then pays against it is a rigging tool, however it is labelled','The wheel is not reachable from the GameMode'],
 c:2,why:'It would genuinely help with testing, which is exactly how such things arrive in builds. The landing is verified by arithmetic instead, which is a better test and ships nothing.'},
{q:'<code>HasardTestLanding</code> checks a nudge either side of each pocket centre. Given the arrival is currently exact, that guards against:',
 opts:['Floating-point drift in <code>Tick</code>','A biased random number generator','A packaged build rounding differently','A future settle animation, bounce or overshoot that stops the ball fractionally off centre'],
 c:3,why:'It states the tolerance the rest of the wheel may assume, so the change that breaks it fails loudly rather than paying the wrong pocket at the boundaries.'},
{q:'Cubic easing was rejected in module 4 on visual grounds. In this module it reads as:',
 opts:['An optimisation that was not needed','A near miss arrived at by accident - a ball that appears to hesitate before landing','A frame-rate dependency','A rounding error at the pocket boundary'],
 c:1,why:'Nobody would have called it dishonest; it just looked wrong. Which is a fair illustration of how small the gap is between a curve chosen carelessly and one chosen to exploit.'},
{q:'<code>FinishSpin</code>&rsquo;s comparison and <code>HasardTestLanding</code> differ in that:',
 opts:['One runs in Shipping and one does not','One checks the payout and the other checks the angle','The first only ever exercises numbers that actually come up; the second exercises all 37 on demand','The first is a UFUNCTION and the second is not'],
 c:2,why:'An assertion protects the player in front of you. A test tells you the thing is right before anyone plays. Neither replaces the other.'},
{q:'The spin-result decision is being written into <code>CLAUDE.md</code> now because:',
 opts:['A decision that exists only as an implementation is one nobody can be held to','The compiler requires it','leftover.md is deleted at the end of guide 4','Packaging reads the decision log'],
 c:0,why:'It has been true in code since guide 2 and open in two documents the whole time. The wheel being built is the moment it stops being deferrable.'}
