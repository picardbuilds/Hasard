/* --------------------------------------------------------- 03 */
{
grp:"Part I \u2014 The Wheel as Data",
num:"03",
title:"A white number on a coloured pocket",
lede:"The colour of a number is a fact about the pocket, not about the digit. Thirty-seven plates, printed from the sequence the numerals already use and coloured from the red list the felt already owns - and an unscaled node between them and the rim.",
blocks:[
{t:'h',x:'What a real wheel prints'},
{t:'p',x:'Module 2 coloured the glyph. Look at a photograph of a European wheel and that is not what you see: the numerals are white, and the pocket behind each one is red, black, or green. The colour is a property of the pocket. Painting it onto the digit was the cheapest thing that carried the information, and it was always going to be temporary.'},
{t:'p',x:'It also reads badly. A red digit on a grey rim at two centimetres is hard to pick out; white on red is not. The fix for the realism and the fix for the legibility are the same fix.'},
{t:'h',x:'Three components, not thirty-seven'},
{t:'p',x:'Each plate could be its own <code>UStaticMeshComponent</code>, the way each numeral is its own <code>UTextRenderComponent</code>. Do not. Thirty-seven components is thirty-seven draw calls for a shape that differs only in where it sits, and the felt already settled this question in guide 3: <code>UInstancedStaticMeshComponent</code>, one per colour, an instance per box.'},
{t:'p',x:'The wheel copies that exactly, down to the names. <code>RedPockets</code>, <code>BlackPockets</code>, and <code>ZeroPocket</code> on its own, because zero&rsquo;s colour is a statement about the odds rather than a decoration.'},
{t:'aside',lab:'Splitting by colour means routing cannot disagree with colouring',x:'<p>The components are split <i>by colour</i>, and the only decision the loop makes is which component a number goes into. There is no second step that then tints it. A number cannot end up in the red component and be drawn black, because being in the red component is what being drawn red means.</p><p>This is the same shape as <code>AHasardFelt::BoxesFor</code>, and it is why both can be read in one sitting.</p>'},
{t:'chk',q:'Why is the plate&rsquo;s width computed rather than exposed as a property to tune?',a:'<p><b>Because a typed width is a second statement of how many pockets there are.</b> The plate is exactly as wide as the arc it owns at its own radius: <code>2 &times; PocketRadius &times; tan(180&deg; / 37)</code>. Change the radius and the plates still meet. Change the pocket count &mdash; which you cannot, but the arithmetic does not know that &mdash; and they still meet.</p><p>A <code>PocketWidth</code> knob would be correct at exactly one radius and quietly wrong at every other, and the symptom would be gaps or overlaps that look like a modelling problem rather than an arithmetic one.</p>'},
{t:'code',x:'// The arc each pocket owns, and the chord that spans it at the radius of the plate.\nconst float DegreesPerPocket = 360.0f / static_cast<float>(Count);\nconst float PlateWidth =\n    2.0f * PocketRadius * FMath::Tan(FMath::DegreesToRadians(DegreesPerPocket * 0.5f));\n\n// 37 pockets, radius 45: 9.7297 degrees each, 7.65 cm of chord. They meet, exactly.'},
{t:'h',x:'The parent that carries no scale'},
{t:'p',x:'Module 2 attached the numerals to <code>WheelMesh</code>, so that turning the rim would turn the numbers with it. That was the right instinct and the wrong component, and the reason is a piece of Unreal behaviour worth knowing before it costs you an evening.'},
{t:'warn',lab:'A parent&rsquo;s scale is applied in the child&rsquo;s axes, not in the parent&rsquo;s',x:'<p>Unreal does not rotate a parent&rsquo;s scale into the child&rsquo;s frame. It multiplies component-wise, axis by axis, in the child&rsquo;s own local space, whatever rotation sits between them.</p><p>A <code>UTextRenderComponent</code> draws in its local YZ plane: local Y is glyph width, local Z is glyph height. Lay it flat with a 90&deg; pitch and hang it off a rim flattened to <code>(2, 2, 0.2)</code>, and the glyphs come out twice as wide and a fifth as tall. Not squashed a little &mdash; ten to one. <code>Numeral Text Size</code> cannot fix it, because it scales both together.</p><p>The tell is specific and worth memorising: <b>the numbers are the wrong shape rather than the wrong size.</b> Anything that is the wrong shape under a rotation is this.</p>'},
{t:'p',x:'So the rim gets a node of its own. <code>RimRoot</code> is a bare <code>USceneComponent</code> under <code>WheelRoot</code>, at scale 1, and everything printed on the wheel hangs off it &mdash; <code>WheelMesh</code>, the three plate components, and the numerals. The flattening lives on <code>WheelMesh</code> and stops there, because nothing is parented to <code>WheelMesh</code> any more.'},
{t:'p',x:'<code>BallMesh</code> stays on <code>WheelRoot</code>. It crosses the pockets rather than turning with them, and module 4 depends on that.'},
{t:'chk',q:'You could have fixed the squashing in the Blueprint instead, by making <code>WheelMesh</code> uniform and putting the flattening on a child mesh under it. Why do it in code?',a:'<p><b>Because the Blueprint fix works and cannot be read.</b> Someone opening <code>HasardWheel.cpp</code> a month later sees numerals attached to a mesh component and no reason to think twice about it; the constraint that keeps them square is a scale value in an asset, three clicks away, with nothing pointing at it.</p><p><code>RimRoot</code> puts the constraint where the code is. It has a comment saying why it exists, it cannot be undone by editing a Blueprint, and the next thing printed on the rim inherits the fix for free.</p>'},
{t:'h',x:'Where the layout comes from now'},
{t:'p',x:'Module 2 read the table layout off the GameMode, to avoid a second asset slot on <code>BP_WHEEL</code>. That reasoning was sound and it has just expired.'},
{t:'p',x:'An instanced component builds its render state when it registers. One registered without a mesh never picks up a mesh assigned afterwards &mdash; the value is stored and the renderer keeps drawing the default. The felt hit this in guide 3 and drew <code>WorldGridMaterial</code> for an afternoon. The fix, there and here, is to print from <code>OnConstruction</code> as well as <code>BeginPlay</code>.'},
{t:'p',x:'And <code>OnConstruction</code> runs in the editor, where there is no GameMode at all. So the wheel takes the layout asset directly, in its own <code>TableLayout</code> slot, exactly as the felt does. This is not a second copy of the red list: that list lives once, in <code>UHasardTableLayout::IsRedNumber</code>. It is a second reference to the same asset, which is a different thing.'},
{t:'aside',lab:'The side effect is worth more than the fix',x:'<p>Printing from <code>OnConstruction</code> means the plates appear in the Blueprint viewport the moment you assign the mesh, and every tuning change shows immediately. No Compile, no Play, no stop.</p><p>The numerals still build in <code>BeginPlay</code> only, matching <code>AHasardFelt::BuildLabels</code> &mdash; they are a whole component each rather than instances, and <code>OnConstruction</code> runs on every property edit. Destroying and rebuilding 37 components on every keystroke is a cost the instanced plates do not pay.</p>'},
{t:'rg',lab:'Zero keeps a colour nobody else has',x:'<p>Zero is the house edge. It is the one pocket that is neither red nor black, and on this wheel it gets its own component and its own colour so that it cannot quietly be folded in with the others by a later change.</p><p>That matters more than it looks. Every even-money bet on the felt &mdash; red, black, odd, even, high, low &mdash; loses to zero, and that single pocket is the entire 2.70%. A wheel that draws zero like any other pocket is not lying, but it is not saying the one thing a player most needs to see either. The felt already prints its zero box with its own colour for the same reason.</p>'},
{t:'warn',lab:'Both Z offsets are measured from the actor, not from the top of the disc',x:'<p><code>PocketZOffset</code> and <code>NumeralZOffset</code> are relative to <code>RimRoot</code>, which sits at the actor&rsquo;s origin. If your disc mesh has its pivot at its centre, the top face is half the mesh height above that, scaled &mdash; so anything at a smaller Z is <i>inside</i> the disc and invisible, with no warning anywhere.</p><p>If the plates do not appear and there is no error in the log, this is why. Raise <code>Pocket Z Offset</code> until they surface, then put <code>Numeral Z Offset</code> just above it.</p>'},
{t:'build',title:'Coloured pockets, and a rim that carries no scale',file:'Source/Hasard/HasardWheel.h + .cpp, BP_WHEEL',x:'<p><b>Phase 1 &mdash; Visual Studio.</b> Two files, complete, marked against module 2.</p><p><b>1.</b> <code>HasardWheel.h</code>, complete:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#pragma once\n\n#include "CoreMinimal.h"\n#include "Engine/EngineTypes.h"\n#include "GameFramework/Actor.h"\n#include "HasardWheel.generated.h"\n\nclass UHasardTableLayout;\n+|class UInstancedStaticMeshComponent;\n+|class UMaterialInterface;\n+|class USceneComponent;\n+|class UStaticMesh;\nclass UStaticMeshComponent;\n-|class USceneComponent;\nclass UTextRenderComponent;\n\n/** One parameter means two entries after the name: the type, then the variable name. */\nDECLARE_DYNAMIC_MULTICAST_DELEGATE_OneParam(FOnBallSettled, int32, WinningPocket);\n\nUCLASS()\nclass HASARD_API AHasardWheel : public AActor\n{\n\tGENERATED_BODY()\n\npublic:\n\tAHasardWheel();\n\n\t/** Fired once per spin, when the ball settles. The wheel does not know who listens. */\n\tUPROPERTY(BlueprintAssignable, Category = "Hasard|Wheel")\n\tFOnBallSettled OnBallSettled;\n\n\tUFUNCTION(BlueprintCallable, Category = "Hasard|Wheel")\n\tvoid StartSpin();\n\n\t/**\n\t * The physical order of the numbers around the rim, clockwise from zero.\n\t *\n\t * Not a setting and not a preference. This is what a single-zero wheel is, and\n\t * nothing else in the project may hold a second copy of it.\n\t */\n\tstatic const TArray&lt;int32&gt;&amp; GetPocketSequence();\n\n\t/** How many pockets. The length of the sequence, not a number anyone can type. */\n\tUFUNCTION(BlueprintPure, Category = "Hasard|Wheel")\n\tint32 GetPocketCount() const;\n\n\t/** The number sitting in rim slot RimIndex. INDEX_NONE if that slot does not exist. */\n\tUFUNCTION(BlueprintPure, Category = "Hasard|Wheel")\n\tint32 GetNumberAtRimIndex(int32 RimIndex) const;\n\n\t/** Which rim slot holds Number. INDEX_NONE if it is not a pocket on this wheel. */\n\tUFUNCTION(BlueprintPure, Category = "Hasard|Wheel")\n\tint32 GetRimIndexOf(int32 Number) const;\n\n\t/**\n\t * Degrees clockwise from the zero pocket to Number.\n\t *\n\t * Try rather than a plain getter because zero sits at 0.0 degrees - so a failed\n\t * lookup returning 0.0 would be indistinguishable from a correct answer.\n\t */\n\tUFUNCTION(BlueprintPure, Category = "Hasard|Wheel")\n\tbool TryGetPocketAngleDegrees(int32 Number, float&amp; OutDegrees) const;\n\n\t/**\n\t * Local yaw of the pocket holding Number.\n\t *\n\t * The rim is described clockwise from zero; yaw runs counter-clockwise. The negation\n\t * that reconciles the two lives here and nowhere else, so the numerals and the ball\n\t * cannot end up disagreeing about which way round the wheel goes.\n\t */\n\tUFUNCTION(BlueprintPure, Category = "Hasard|Wheel")\n\tbool TryGetPocketYaw(int32 Number, float&amp; OutYaw) const;\n\n\t/** One spin, no animation. Public so the test and real play share one code path. */\n\tint32 DetermineWinningPocket() const;\n\nprotected:\n\tvirtual void PostInitializeComponents() override;\n\tvirtual void BeginPlay() override;\n\tvirtual void EndPlay(const EEndPlayReason::Type EndPlayReason) override;\n+|\tvirtual void OnConstruction(const FTransform&amp; Transform) override;\n\nprivate:\n\t/** Timer callback. Nothing outside the wheel finishes a spin. */\n\tvoid FinishSpin();\n\n\t/** Walks the sequence on BeginPlay and says out loud whether it is still a wheel. */\n\tvoid AuditPocketSequence() const;\n\n-|\t/** Destroys any numerals and prints a fresh set from the rim sequence. */\n+|\t/**\n+|\t * Prints the thirty-seven coloured plates.\n+|\t *\n+|\t * Called from OnConstruction as well as BeginPlay, and it has to be, for the reason\n+|\t * AHasardFelt::BuildSurface records: an instanced component builds its render state\n+|\t * when it registers, and one registered without a mesh never picks up a mesh assigned\n+|\t * afterwards - the value is stored and the renderer keeps drawing the default.\n+|\t */\n+|\tvoid BuildPockets();\n+|\n+|\t/**\n+|\t * Destroys any numerals and prints a fresh set from the rim sequence.\n+|\t *\n+|\t * BeginPlay only, matching AHasardFelt::BuildLabels. These are a component each rather\n+|\t * than instances, and OnConstruction runs on every property edit in the editor.\n+|\t */\n\tvoid BuildNumerals();\n\n-|\t/** Red, black, or green for zero. The felt owns the red list; this reads it. */\n-|\tFColor NumeralColorFor(int32 Number, const UHasardTableLayout* Layout) const;\n+|\t/** Points a component at PocketMesh and PocketMaterial and tints it. */\n+|\tvoid PreparePockets(UInstancedStaticMeshComponent* Component, const FColor&amp; Color) const;\n+|\n+|\t/**\n+|\t * Which instanced component prints this pocket, which is the same question as what\n+|\t * colour it is: the components are split by colour, so routing and colouring cannot\n+|\t * disagree. The felt owns the red list; this reads it.\n+|\t */\n+|\tUInstancedStaticMeshComponent* PocketsFor(int32 Number,\n+|\t\tconst UHasardTableLayout* Layout) const;\n\n\tUPROPERTY(VisibleAnywhere, Category = "Hasard|Wheel")\n\tTObjectPtr&lt;USceneComponent&gt; WheelRoot;\n+|\n+|\t/**\n+|\t * The turning part of the wheel, and the parent of everything printed on it.\n+|\t *\n+|\t * It exists to carry no scale. A parent\'s scale is applied to a child component\n+|\t * axis by axis in the child\'s own frame, without being rotated into it, so a rim\n+|\t * mesh flattened to (2, 2, 0.2) squashes a numeral\'s glyph height by 0.2 while\n+|\t * stretching its width by 2. Hanging the rim\'s contents off an unscaled node and\n+|\t * letting only WheelMesh carry the flattening removes the whole class of problem.\n+|\t */\n+|\tUPROPERTY(VisibleAnywhere, Category = "Hasard|Wheel")\n+|\tTObjectPtr&lt;USceneComponent&gt; RimRoot;\n\n\tUPROPERTY(VisibleAnywhere, Category = "Hasard|Wheel")\n\tTObjectPtr&lt;UStaticMeshComponent&gt; WheelMesh;\n\n\tUPROPERTY(VisibleAnywhere, Category = "Hasard|Wheel")\n\tTObjectPtr&lt;UStaticMeshComponent&gt; BallMesh;\n\n+|\tUPROPERTY(VisibleAnywhere, Category = "Hasard|Pockets")\n+|\tTObjectPtr&lt;UInstancedStaticMeshComponent&gt; RedPockets;\n+|\n+|\tUPROPERTY(VisibleAnywhere, Category = "Hasard|Pockets")\n+|\tTObjectPtr&lt;UInstancedStaticMeshComponent&gt; BlackPockets;\n+|\n+|\t/** Zero has its own component. Its colour is a statement about the odds. */\n+|\tUPROPERTY(VisibleAnywhere, Category = "Hasard|Pockets")\n+|\tTObjectPtr&lt;UInstancedStaticMeshComponent&gt; ZeroPocket;\n+|\n\t/** Every numeral this actor made. UPROPERTY so the collector can see them. */\n\tUPROPERTY()\n\tTArray&lt;TObjectPtr&lt;UTextRenderComponent&gt;&gt; Numerals;\n+|\n+|\t/**\n+|\t * The same asset BP_Felt holds, assigned again here.\n+|\t *\n+|\t * Module 2 read it off the GameMode to avoid a second slot. That worked while the only\n+|\t * thing it fed was BeginPlay. The plates are printed from OnConstruction, where there\n+|\t * is no GameMode at all, so the wheel needs the asset in its own hand. This is not a\n+|\t * second copy of the red list - that list lives once, in UHasardTableLayout.\n+|\t */\n+|\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Wheel",\n+|\t\tmeta = (AllowPrivateAccess = "true"))\n+|\tTObjectPtr&lt;UHasardTableLayout&gt; TableLayout;\n\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Wheel",\n\t\tmeta = (AllowPrivateAccess = "true", ClampMin = "0.1"))\n\tfloat SpinDuration = 6.0f;\n\n+|\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Pockets",\n+|\t\tmeta = (AllowPrivateAccess = "true"))\n+|\tbool bShowPockets = true;\n+|\n+|\t/** A unit quad in centimetres. The same mesh BP_Felt prints its boxes from. */\n+|\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Pockets",\n+|\t\tmeta = (AllowPrivateAccess = "true"))\n+|\tTObjectPtr&lt;UStaticMesh&gt; PocketMesh;\n+|\n+|\t/** Needs a vector parameter named by ColorParameterName. The felt\'s material has one. */\n+|\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Pockets",\n+|\t\tmeta = (AllowPrivateAccess = "true"))\n+|\tTObjectPtr&lt;UMaterialInterface&gt; PocketMaterial;\n+|\n+|\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Pockets",\n+|\t\tmeta = (AllowPrivateAccess = "true"))\n+|\tFName ColorParameterName = TEXT("Color");\n+|\n+|\t/** Distance from the hub to the middle of a plate, in centimetres. */\n+|\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Pockets",\n+|\t\tmeta = (AllowPrivateAccess = "true", ClampMin = "1.0"))\n+|\tfloat PocketRadius = 45.0f;\n+|\n+|\t/** How far a plate reaches in and out from that radius. */\n+|\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Pockets",\n+|\t\tmeta = (AllowPrivateAccess = "true", ClampMin = "0.1"))\n+|\tfloat PocketLength = 20.0f;\n+|\n+|\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Pockets",\n+|\t\tmeta = (AllowPrivateAccess = "true"))\n+|\tfloat PocketZOffset = 0.4f;\n+|\n+|\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Pockets",\n+|\t\tmeta = (AllowPrivateAccess = "true"))\n+|\tFColor RedPocketColor = FColor(178, 26, 30);\n+|\n+|\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Pockets",\n+|\t\tmeta = (AllowPrivateAccess = "true"))\n+|\tFColor BlackPocketColor = FColor(22, 22, 24);\n+|\n+|\t/** Zero is the house edge. It does not share a colour with anything else on the rim. */\n+|\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Pockets",\n+|\t\tmeta = (AllowPrivateAccess = "true"))\n+|\tFColor ZeroPocketColor = FColor(20, 130, 60);\n+|\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Numerals",\n\t\tmeta = (AllowPrivateAccess = "true"))\n\tbool bShowNumerals = true;\n\n~|\t/** Distance from the hub to the middle of a numeral. Sits on the plate, so match it. */\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Numerals",\n\t\tmeta = (AllowPrivateAccess = "true", ClampMin = "1.0"))\n\tfloat NumeralRadius = 45.0f;\n\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Numerals",\n\t\tmeta = (AllowPrivateAccess = "true", ClampMin = "0.1"))\n\tfloat NumeralTextSize = 6.0f;\n\n~|\t/** Must stay above PocketZOffset, or the numerals sink into their own plates. */\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Numerals",\n\t\tmeta = (AllowPrivateAccess = "true"))\n~|\tfloat NumeralZOffset = 0.8f;\n\n\t/**\n\t * Base orientation of a numeral before its own pocket yaw is added.\n\t *\n\t * Pitch 90 lays the text flat on a horizontal rim, exactly as LabelRotation does on\n\t * the felt. If the numerals come out mirrored or upside-down, this is the knob - the\n\t * felt needed the same tuning and for the same reason.\n\t */\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Numerals",\n\t\tmeta = (AllowPrivateAccess = "true"))\n\tFRotator NumeralRotation = FRotator(90.0f, 180.0f, 0.0f);\n\n+|\t/**\n+|\t * One colour for all thirty-seven.\n+|\t *\n+|\t * A real wheel prints white on a coloured pocket, and so does this one now. The colour\n+|\t * of a number is a fact about the pocket, stated once, by the plate under it.\n+|\t */\n\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Numerals",\n\t\tmeta = (AllowPrivateAccess = "true"))\n-|\tFColor RedNumeralColor = FColor(200, 32, 32);\n-|\n-|\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Numerals",\n-|\t\tmeta = (AllowPrivateAccess = "true"))\n-|\tFColor BlackNumeralColor = FColor(24, 24, 24);\n-|\n-|\t/** Zero is the house edge. It does not share a colour with anything else on the rim. */\n-|\tUPROPERTY(EditDefaultsOnly, BlueprintReadOnly, Category = "Hasard|Numerals",\n-|\t\tmeta = (AllowPrivateAccess = "true"))\n-|\tFColor ZeroNumeralColor = FColor(16, 132, 72);\n+|\tFColor NumeralColor = FColor(245, 245, 240);\n\n\t/** Plain struct, not a UObject: no UPROPERTY needed. */\n\tFTimerHandle SpinTimerHandle;\n};</code></pre><p>Four blocks of new properties and one new component. <code>RimRoot</code> is a bare <code>USceneComponent</code> and that is the point of it: it carries no scale, so nothing parented to it inherits one.</p><p><b>2.</b> <code>HasardWheel.cpp</code>, complete:</p><pre><code>// Copyright Picardbuilds. All Rights Reserved.\n\n#include "HasardWheel.h"\n-|#include "HasardGameMode.h"\n#include "HasardTableLayout.h"\n#include "HasardTypes.h"\n+|#include "Components/InstancedStaticMeshComponent.h"\n#include "Components/SceneComponent.h"\n#include "Components/StaticMeshComponent.h"\n#include "Components/TextRenderComponent.h"\n+|#include "Engine/StaticMesh.h"\n#include "Engine/World.h"\n+|#include "Materials/MaterialInstanceDynamic.h"\n+|#include "Materials/MaterialInterface.h"\n#include "TimerManager.h"\n\nconst TArray&lt;int32&gt;&amp; AHasardWheel::GetPocketSequence()\n{\n\t// A single-zero wheel, clockwise from zero. Reds and blacks alternate and the high\n\t// and low numbers are spread, so that no arc of the rim is worth more than any other.\n\t// That is a design, not a pattern, which is why no arithmetic produces it - the same\n\t// reason UHasardTableLayout::IsRedNumber lists its eighteen numbers instead of\n\t// computing them.\n\tstatic const TArray&lt;int32&gt; PocketSequence = {\n\t\t 0, 32, 15, 19,  4, 21,  2, 25, 17, 34,\n\t\t 6, 27, 13, 36, 11, 30,  8, 23, 10,  5,\n\t\t24, 16, 33,  1, 20, 14, 31,  9, 22, 18,\n\t\t29,  7, 28, 12, 35,  3, 26 };\n\n\treturn PocketSequence;\n}\n\nAHasardWheel::AHasardWheel()\n{\n\tPrimaryActorTick.bCanEverTick = false;\n\n\tWheelRoot = CreateDefaultSubobject&lt;USceneComponent&gt;(TEXT("WheelRoot"));\n\tRootComponent = WheelRoot;\n\n+|\t// Unscaled, and everything that has to stay square hangs off it.\n+|\tRimRoot = CreateDefaultSubobject&lt;USceneComponent&gt;(TEXT("RimRoot"));\n+|\tRimRoot-&gt;SetupAttachment(WheelRoot);\n+|\n+|\t// The flattening lives here and goes no further, because nothing is parented to it.\n\tWheelMesh = CreateDefaultSubobject&lt;UStaticMeshComponent&gt;(TEXT("WheelMesh"));\n~|\tWheelMesh-&gt;SetupAttachment(RimRoot);\n\n+|\tRedPockets = CreateDefaultSubobject&lt;UInstancedStaticMeshComponent&gt;(TEXT("RedPockets"));\n+|\tRedPockets-&gt;SetupAttachment(RimRoot);\n+|\n+|\tBlackPockets = CreateDefaultSubobject&lt;UInstancedStaticMeshComponent&gt;(TEXT("BlackPockets"));\n+|\tBlackPockets-&gt;SetupAttachment(RimRoot);\n+|\n+|\tZeroPocket = CreateDefaultSubobject&lt;UInstancedStaticMeshComponent&gt;(TEXT("ZeroPocket"));\n+|\tZeroPocket-&gt;SetupAttachment(RimRoot);\n+|\n+|\t// Not on the rim. The ball crosses the pockets rather than turning with them.\n\tBallMesh = CreateDefaultSubobject&lt;UStaticMeshComponent&gt;(TEXT("BallMesh"));\n\tBallMesh-&gt;SetupAttachment(WheelRoot);\n\n\tUE_LOG(LogHasard, Warning, TEXT("Wheel: Constructor - %s"),\n\t\t*GetName());\n}\n\nvoid AHasardWheel::PostInitializeComponents()\n{\n\tSuper::PostInitializeComponents();\n\tUE_LOG(LogHasard, Warning, TEXT("Wheel: PostInitializeComponents"));\n}\n\n+|void AHasardWheel::OnConstruction(const FTransform&amp; Transform)\n+|{\n+|\tSuper::OnConstruction(Transform);\n+|\n+|\t// Printed here as well as in BeginPlay, and it has to be. PocketMesh and PocketMaterial\n+|\t// are EditDefaultsOnly, so they do not exist until the Blueprint has written its\n+|\t// defaults - after the constructor and before this. Printing only from BeginPlay left\n+|\t// the instanced components registered with no mesh, and a material assigned to them\n+|\t// afterwards was stored but never reached the renderer. The felt met this in guide 3.\n+|\tBuildPockets();\n+|}\n+|\nvoid AHasardWheel::BeginPlay()\n{\n\tSuper::BeginPlay();\n\tUE_LOG(LogHasard, Warning, TEXT("Wheel: BeginPlay"));\n\n\tAuditPocketSequence();\n+|\tBuildPockets();\n\tBuildNumerals();\n}\n\nvoid AHasardWheel::EndPlay(const EEndPlayReason::Type EndPlayReason)\n{\n\tUE_LOG(LogHasard, Warning, TEXT("Wheel: EndPlay"));\n\tGetWorldTimerManager().ClearTimer(SpinTimerHandle);\n\tSuper::EndPlay(EndPlayReason);\n}\n\nvoid AHasardWheel::StartSpin()\n{\n\tif (GetWorldTimerManager().IsTimerActive(SpinTimerHandle))\n\t{\n\t\tUE_LOG(LogHasard, Warning, TEXT("Wheel: StartSpin ignored - a spin is already running"));\n\t\treturn;\n\t}\n\n\tGetWorldTimerManager().SetTimer(SpinTimerHandle, this,\n\t\t&amp;AHasardWheel::FinishSpin, SpinDuration, false);\n}\n\nvoid AHasardWheel::FinishSpin()\n{\n\tconst int32 WinningPocket = DetermineWinningPocket();\n\tOnBallSettled.Broadcast(WinningPocket);\n}\n\nint32 AHasardWheel::DetermineWinningPocket() const\n{\n\treturn FMath::RandRange(0, GetPocketCount() - 1);\n}\n\nint32 AHasardWheel::GetPocketCount() const\n{\n\treturn GetPocketSequence().Num();\n}\n\nint32 AHasardWheel::GetNumberAtRimIndex(int32 RimIndex) const\n{\n\tconst TArray&lt;int32&gt;&amp; Sequence = GetPocketSequence();\n\treturn Sequence.IsValidIndex(RimIndex) ? Sequence[RimIndex] : INDEX_NONE;\n}\n\nint32 AHasardWheel::GetRimIndexOf(int32 Number) const\n{\n\t// IndexOfByKey already returns INDEX_NONE when it finds nothing, which is the\n\t// answer this function wants for a number that is not on the wheel.\n\treturn GetPocketSequence().IndexOfByKey(Number);\n}\n\nbool AHasardWheel::TryGetPocketAngleDegrees(int32 Number, float&amp; OutDegrees) const\n{\n\tconst int32 RimIndex = GetRimIndexOf(Number);\n\n\tif (RimIndex == INDEX_NONE)\n\t{\n\t\tOutDegrees = 0.0f;\n\t\treturn false;\n\t}\n\n\tOutDegrees = 360.0f * static_cast&lt;float&gt;(RimIndex) / static_cast&lt;float&gt;(GetPocketCount());\n\treturn true;\n}\n\nbool AHasardWheel::TryGetPocketYaw(int32 Number, float&amp; OutYaw) const\n{\n\tfloat Degrees = 0.0f;\n\n\tif (!TryGetPocketAngleDegrees(Number, Degrees))\n\t{\n\t\tOutYaw = 0.0f;\n\t\treturn false;\n\t}\n\n\t// The one negation in the project. Everything that places something on the rim, and\n\t// everything that reads something off it, goes through this function.\n\tOutYaw = -Degrees;\n\treturn true;\n}\n\nvoid AHasardWheel::AuditPocketSequence() const\n{\n\tconst TArray&lt;int32&gt;&amp; Sequence = GetPocketSequence();\n\tconst int32 Count = Sequence.Num();\n\n\tTSet&lt;int32&gt; Seen;\n\tint32 Offenders = 0;\n\n\tfor (int32 RimIndex = 0; RimIndex &lt; Count; ++RimIndex)\n\t{\n\t\tconst int32 Number = Sequence[RimIndex];\n\n\t\tif (Number &lt; 0 || Number &gt;= Count)\n\t\t{\n\t\t\tUE_LOG(LogHasard, Error,\n\t\t\t\tTEXT("Rim audit: slot %d holds %d, which is not a pocket on a wheel of %d"),\n\t\t\t\tRimIndex, Number, Count);\n\t\t\t++Offenders;\n\t\t\tcontinue;\n\t\t}\n\n\t\tbool bAlreadySeen = false;\n\t\tSeen.Add(Number, &amp;bAlreadySeen);\n\n\t\tif (bAlreadySeen)\n\t\t{\n\t\t\tUE_LOG(LogHasard, Error, TEXT("Rim audit: slot %d repeats %d"), RimIndex, Number);\n\t\t\t++Offenders;\n\t\t}\n\t}\n\n\t// The claim, stated on every run: this is a wheel. Every number present, once each,\n\t// none invented. A distinct count below the pocket count is a repeat and an omission\n\t// in the same list, which is the typo a person cannot see and a spin will not reveal.\n\tUE_LOG(LogHasard, Warning,\n\t\tTEXT("Rim audit: %d pockets, %d distinct, %d offenders, %.4f degrees each"),\n\t\tCount, Seen.Num(), Offenders, 360.0f / static_cast&lt;float&gt;(Count));\n}\n\n-|FColor AHasardWheel::NumeralColorFor(int32 Number, const UHasardTableLayout* Layout) const\n+|void AHasardWheel::PreparePockets(UInstancedStaticMeshComponent* Component,\n+|\tconst FColor&amp; Color) const\n+|{\n+|\tif (!Component || !PocketMesh || !PocketMaterial)\n+|\t{\n+|\t\treturn;\n+|\t}\n+|\n+|\tComponent-&gt;SetStaticMesh(PocketMesh);\n+|\n+|\tUMaterialInstanceDynamic* Instance =\n+|\t\tComponent-&gt;CreateDynamicMaterialInstance(0, PocketMaterial);\n+|\n+|\tif (Instance &amp;&amp; !ColorParameterName.IsNone())\n+|\t{\n+|\t\t// FromSRGBColor, not the FLinearColor constructor: these are authored as sRGB in\n+|\t\t// the details panel, and treating those bytes as linear washes every one of them\n+|\t\t// out. The felt learned this the same way.\n+|\t\tInstance-&gt;SetVectorParameterValue(ColorParameterName, FLinearColor::FromSRGBColor(Color));\n+|\t}\n+|}\n+|\n+|UInstancedStaticMeshComponent* AHasardWheel::PocketsFor(int32 Number,\n+|\tconst UHasardTableLayout* Layout) const\n{\n\t// Zero first. It is not in the red set, so asking IsRedNumber first would print it in\n~|\t// the black plate - the same ordering trap the felt met in guide 3 module 4.\n\tif (Number == 0)\n\t{\n~|\t\treturn ZeroPocket;\n\t}\n\n-|\treturn (Layout &amp;&amp; Layout-&gt;IsRedNumber(Number)) ? RedNumeralColor : BlackNumeralColor;\n+|\treturn (Layout &amp;&amp; Layout-&gt;IsRedNumber(Number)) ? RedPockets : BlackPockets;\n+|}\n+|\n+|void AHasardWheel::BuildPockets()\n+|{\n+|\t// Clear first and unconditionally, before the bShowPockets test. OnConstruction runs\n+|\t// again on every property edit, and a pass that only added would stack a second rim\n+|\t// on the first.\n+|\tRedPockets-&gt;ClearInstances();\n+|\tBlackPockets-&gt;ClearInstances();\n+|\tZeroPocket-&gt;ClearInstances();\n+|\n+|\tUInstancedStaticMeshComponent* const Plates[] = { RedPockets, BlackPockets, ZeroPocket };\n+|\n+|\tfor (UInstancedStaticMeshComponent* Component : Plates)\n+|\t{\n+|\t\tComponent-&gt;SetVisibility(bShowPockets);\n+|\t}\n+|\n+|\tif (!bShowPockets)\n+|\t{\n+|\t\treturn;\n+|\t}\n+|\n+|\tif (!PocketMesh || !PocketMaterial)\n+|\t{\n+|\t\t// Loud, because the alternative is a wheel that still decides the result while\n+|\t\t// showing the player nothing to read it off.\n+|\t\tUE_LOG(LogHasard, Error,\n+|\t\t\tTEXT("Wheel: BP_WHEEL needs both Pocket Mesh and Pocket Material to print the rim"));\n+|\t\treturn;\n+|\t}\n+|\n+|\tif (!TableLayout)\n+|\t{\n+|\t\tUE_LOG(LogHasard, Error,\n+|\t\t\tTEXT("Wheel: BP_WHEEL has no Table Layout - the rim cannot be coloured"));\n+|\t}\n+|\n+|\tPreparePockets(RedPockets, RedPocketColor);\n+|\tPreparePockets(BlackPockets, BlackPocketColor);\n+|\tPreparePockets(ZeroPocket, ZeroPocketColor);\n+|\n+|\tconst int32 Count = GetPocketCount();\n+|\n+|\t// A plate is exactly as wide as the arc it owns, measured at its own radius, so the\n+|\t// thirty-seven meet without a gap and without overlapping. Typing a width instead\n+|\t// would be a second statement of how many pockets there are, and the rim already\n+|\t// says that once.\n+|\tconst float DegreesPerPocket = 360.0f / static_cast&lt;float&gt;(Count);\n+|\tconst float PlateWidth =\n+|\t\t2.0f * PocketRadius * FMath::Tan(FMath::DegreesToRadians(DegreesPerPocket * 0.5f));\n+|\n+|\t// PocketMesh is a unit quad measured in centimetres, so the scale is the size wanted\n+|\t// over the mesh\'s own. Read it from the asset rather than assuming 100: swapping in a\n+|\t// differently sized quad should change nothing the player sees.\n+|\tconst FVector MeshSize = PocketMesh-&gt;GetBounds().BoxExtent * 2.0f;\n+|\tconst float MeshX = FMath::IsNearlyZero(MeshSize.X) ? 1.0f : MeshSize.X;\n+|\tconst float MeshY = FMath::IsNearlyZero(MeshSize.Y) ? 1.0f : MeshSize.Y;\n+|\n+|\tfor (const int32 Number : GetPocketSequence())\n+|\t{\n+|\t\tfloat Yaw = 0.0f;\n+|\t\tif (!TryGetPocketYaw(Number, Yaw))\n+|\t\t{\n+|\t\t\tcontinue;\n+|\t\t}\n+|\n+|\t\tconst FRotator Facing(0.0f, Yaw, 0.0f);\n+|\n+|\t\tPocketsFor(Number, TableLayout)-&gt;AddInstance(FTransform(\n+|\t\t\tFacing,\n+|\t\t\tFacing.RotateVector(FVector(PocketRadius, 0.0f, PocketZOffset)),\n+|\t\t\tFVector(PocketLength / MeshX, PlateWidth / MeshY, 1.0f)));\n+|\t}\n+|\n+|\tUE_LOG(LogHasard, Warning,\n+|\t\tTEXT("Wheel: printed %d pockets - %d red, %d black, %d zero"),\n+|\t\tRedPockets-&gt;GetInstanceCount() + BlackPockets-&gt;GetInstanceCount()\n+|\t\t\t+ ZeroPocket-&gt;GetInstanceCount(),\n+|\t\tRedPockets-&gt;GetInstanceCount(), BlackPockets-&gt;GetInstanceCount(),\n+|\t\tZeroPocket-&gt;GetInstanceCount());\n}\n\nvoid AHasardWheel::BuildNumerals()\n{\n\t// Destroy first and unconditionally, before the bShowNumerals test. Turning numerals\n\t// off and rebuilding has to remove them, not leave the previous set standing.\n\tfor (const TObjectPtr&lt;UTextRenderComponent&gt;&amp; Existing : Numerals)\n\t{\n\t\tif (Existing)\n\t\t{\n\t\t\tExisting-&gt;DestroyComponent();\n\t\t}\n\t}\n\tNumerals.Reset();\n\n~|\tif (!bShowNumerals || !RimRoot)\n\t{\n\t\treturn;\n\t}\n\n-|\t// The felt already owns the red list, and the GameMode already owns the felt\'s layout\n-|\t// asset. Asking for it here rather than adding a second assignment to BP_WHEEL keeps\n-|\t// the eighteen red numbers in exactly one place - which is the whole reason that list\n-|\t// is a list.\n-|\tconst AHasardGameMode* GM = GetWorld() ? GetWorld()-&gt;GetAuthGameMode&lt;AHasardGameMode&gt;() : nullptr;\n-|\tconst UHasardTableLayout* Layout = GM ? GM-&gt;GetTableLayout() : nullptr;\n-|\n-|\tif (!Layout)\n-|\t{\n-|\t\tUE_LOG(LogHasard, Error,\n-|\t\t\tTEXT("Wheel: no table layout on BP_HasardGameMode - numerals cannot be coloured"));\n-|\t}\n-|\n-|\tconst TArray&lt;int32&gt;&amp; Sequence = GetPocketSequence();\n-|\n-|\tfor (const int32 Number : Sequence)\n+|\tfor (const int32 Number : GetPocketSequence())\n\t{\n\t\tfloat Yaw = 0.0f;\n\t\tif (!TryGetPocketYaw(Number, Yaw))\n\t\t{\n\t\t\tcontinue;\n\t\t}\n\n\t\tUTextRenderComponent* Numeral = NewObject&lt;UTextRenderComponent&gt;(this);\n\n\t\t// Movable before registering. A component made with NewObject is static, and\n\t\t// moving a registered static component warns and is then ignored.\n\t\tNumeral-&gt;SetMobility(EComponentMobility::Movable);\n\t\tNumeral-&gt;RegisterComponent();\n\n~|\t\t// Attached to the unscaled rim node rather than to the flattened mesh, so the rim\n~|\t\t// still carries the numbers round and nothing squashes them on the way.\n~|\t\tNumeral-&gt;AttachToComponent(RimRoot, FAttachmentTransformRules::KeepRelativeTransform);\n\n\t\tconst FRotator Facing(0.0f, Yaw, 0.0f);\n\t\tNumeral-&gt;SetRelativeLocation(\n\t\t\tFacing.RotateVector(FVector(NumeralRadius, 0.0f, NumeralZOffset)));\n\t\tNumeral-&gt;SetRelativeRotation(\n\t\t\tFRotator(NumeralRotation.Pitch, NumeralRotation.Yaw + Yaw, NumeralRotation.Roll));\n\n\t\tNumeral-&gt;SetText(FText::AsNumber(Number));\n\t\tNumeral-&gt;SetWorldSize(NumeralTextSize);\n\t\tNumeral-&gt;SetHorizontalAlignment(EHTA_Center);\n\t\tNumeral-&gt;SetVerticalAlignment(EVRTA_TextCenter);\n-|\t\tNumeral-&gt;SetTextRenderColor(NumeralColorFor(Number, Layout));\n+|\n+|\t\t// One colour, every pocket. The plate under it says red, black or green.\n+|\t\tNumeral-&gt;SetTextRenderColor(NumeralColor);\n\n\t\tNumerals.Add(Numeral);\n\t}\n\n\tUE_LOG(LogHasard, Warning, TEXT("Wheel: printed %d numerals"), Numerals.Num());\n}</code></pre><p><code>HasardGameMode.h</code> is gone from the includes. The wheel no longer asks anyone for the layout.</p><p><b>Phase 2 &mdash; the two assets, read off the felt rather than guessed.</b></p><p><b>3.</b> Open <code>BP_HasardFelt</code>. In <b>Class Defaults</b>, find <b>Hasard | Surface</b> and write down what is in <b>Box Mesh</b> and <b>Surface Material</b>, and under <b>Hasard | Felt</b> what is in <b>Table Layout</b>. Three asset names. Close it without saving.</p><p><b>4.</b> Open <code>BP_WHEEL</code> &rarr; <b>Class Defaults</b>. Assign all three: <b>Hasard | Pockets &rarr; Pocket Mesh</b> and <b>Pocket Material</b>, and <b>Hasard | Wheel &rarr; Table Layout</b>. The same assets, not copies of them.</p><p><b>5.</b> Still in <code>BP_WHEEL</code>, undo the workaround if you made one. <b>WheelMesh</b> gets its disc back and its flattened scale back &mdash; <code>(2, 2, 0.2)</code> or whatever yours was &mdash; and any extra visual component you added underneath it can be deleted. <code>RimRoot</code> does that job now, in code.</p><p><b>6.</b> <b>Multiply your tuned <code>Numeral Radius</code> by WheelMesh&rsquo;s X scale.</b> The numerals used to hang off <code>WheelMesh</code> and be scaled by it; they hang off <code>RimRoot</code> now and are not. A radius of 45 under a 2.0 parent was 90 cm on screen, and 45 under <code>RimRoot</code> is 45 cm. Set <b>Pocket Radius</b> to the same number.</p><p><b>Phase 3 &mdash; build and look.</b></p><p><b>7.</b> Save all, close the editor, <code>Ctrl+Shift+B</code>, reopen.</p><p><b>8.</b> Open <code>BP_WHEEL</code>. <b>The plates are already there in the Blueprint viewport</b>, before you press Play, because <code>BuildPockets</code> runs from <code>OnConstruction</code>. Every tuning change below shows up as you type it, which is what that function is for. The numerals are not there &mdash; they are built in <code>BeginPlay</code> and only appear in Play.</p><p><b>9.</b> Set <b>Pocket Z Offset</b> so the plates sit on top of the disc rather than inside it, then <b>Numeral Z Offset</b> a little above that. Then <b>Pocket Length</b> until the plates look like pockets rather than slivers. You never have to guess: the viewport updates on every edit.</p><p><b>10.</b> Press Play. The log:</p><pre><code>LogHasard: Warning: Wheel: printed 37 pockets - 18 red, 18 black, 1 zero\nLogHasard: Warning: Wheel: printed 37 numerals</code></pre><p><b>18, 18 and 1 are the three numbers that matter.</b> They are the same claim the felt makes about its own boxes, from the same list, and if either ever disagrees with the other one of them is reading a copy.</p><p><b>11.</b> Run <code>HasardShowPocket 17</code> and find 17 on the rim. It is white on black, 25 is white on red one side and 34 white on red the other. Then find zero: white on green, and the only green plate on the wheel.</p><p><b>12.</b> Commit.</p><pre><code>git add Source/Hasard/HasardWheel.h Source/Hasard/HasardWheel.cpp\ngit add Content/BP_WHEEL.uasset\ngit commit -m &quot;Print the rim as coloured pockets&quot;</code></pre><p><b>The failures worth recognising.</b> <i>Every plate black, including zero</i> means <b>Table Layout</b> is unset &mdash; the log says so in as many words. <i>Nothing on the rim at all and an error about Pocket Mesh</i> means one of the two asset slots is empty. <i>Plates invisible with no error</i> means they are under the disc, and <b>Pocket Z Offset</b> is the knob. <i>Numerals square but plates missing in the Blueprint viewport only</i> is normal on the first open &mdash; nudge any property to force a construction pass.</p>'},
{t:'srcs',x:[['Instanced Static Mesh Component','https://dev.epicgames.com/documentation/en-us/unreal-engine/instanced-static-mesh-component-in-unreal-engine'],['Material Instances','https://dev.epicgames.com/documentation/en-us/unreal-engine/instanced-materials-in-unreal-engine'],['Transforms','https://dev.epicgames.com/documentation/en-us/unreal-engine/transforms-in-unreal-engine'],['Construction Script','https://dev.epicgames.com/documentation/en-us/unreal-engine/construction-script-in-unreal-engine']]}

quiz:[
{q:'The plates use three <code>UInstancedStaticMeshComponent</code>s split by colour rather than one component per pocket because:',
 opts:['Routing a number to a component <i>is</i> colouring it, so the two cannot disagree - and it is three draw calls rather than thirty-seven','Instanced components are the only ones that can be rotated at runtime','A static mesh component cannot take a dynamic material','Thirty-seven components exceeds Unreal&rsquo;s per-actor limit'],
 c:0,why:'The same shape as the felt&rsquo;s RedBoxes / BlackBoxes / GreenBoxes. There is no second step that tints a plate after placing it, so there is no step that can be wrong.'},
{q:'<code>PlateWidth</code> is computed from <code>PocketRadius</code> and the pocket count rather than exposed as a tuning knob because:',
 opts:['<code>FMath::Tan</code> is cheaper than a property read','Instanced meshes cannot be non-uniformly scaled','A typed width would be a second statement of how many pockets there are, correct at one radius and quietly wrong at every other','Blueprint cannot edit floats below 1.0'],
 c:2,why:'Same argument as the rim sequence itself. Anything the wheel already knows is not restated somewhere a person can get it wrong.'},
{q:'Numerals hung off a <code>WheelMesh</code> scaled <code>(2, 2, 0.2)</code> come out ten times wider than they are tall because:',
 opts:['Unreal applies a parent&rsquo;s scale component-wise in the child&rsquo;s own axes, without rotating it into that frame','<code>SetWorldSize</code> ignores the Z axis','A pitched component loses its vertical extent','Text render components are always drawn in screen space'],
 c:0,why:'The text draws in its local YZ plane, so the parent&rsquo;s Z scale lands on glyph height whatever rotation sits between them. The tell is that the numbers are the wrong shape rather than the wrong size.'},
{q:'<code>BuildPockets</code> is called from <code>OnConstruction</code> as well as <code>BeginPlay</code> because:',
 opts:['<code>BeginPlay</code> does not run in a packaged build','An instanced component registered without a mesh never picks up one assigned afterwards - the value is stored and the renderer keeps drawing the default','<code>OnConstruction</code> is the only place <code>AddInstance</code> is legal','Otherwise the plates would not be saved into the level'],
 c:1,why:'Exactly what cost the felt an afternoon of WorldGridMaterial in guide 3. The useful side effect is that the rim tunes live in the Blueprint viewport.'},
{q:'The wheel now holds its own <code>TableLayout</code> reference instead of reading it off the GameMode. The reason is:',
 opts:['The GameMode reference was a circular dependency','<code>OnConstruction</code> runs in the editor, where there is no GameMode to ask','Data assets cannot be reached through <code>GetAuthGameMode</code>','It removes a copy of the eighteen red numbers'],
 c:1,why:'Not option 4 - there was never a second copy of the list, and there still is not. IsRedNumber is the one place those eighteen numbers exist; this is a second reference to the same asset.'},
{q:'The plates are invisible in Play and the Output Log shows no error at all. The first thing to check is:',
 opts:['Whether <code>Pocket Material</code> is assigned','Whether the layout asset is valid','Whether <code>bShowPockets</code> was compiled','Whether <code>Pocket Z Offset</code> puts them above the disc&rsquo;s top face rather than inside it'],
 c:3,why:'Both asset failures are logged loudly and by name. Geometry buried inside other geometry is the failure with no message, which is exactly why it is worth recognising by its silence.'}
]
