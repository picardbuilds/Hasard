// C++ provides the implementation; Blueprint may override or extend.
// Cannot be called from Blueprint.
UFUNCTION(BlueprintNativeEvent, Category = "Action")
void StartAction(AActor* Instigator);`},
{t:'p',x:'Beyond Blueprint exposure, the engine sometimes <i>requires</i> <code>UFUNCTION()</code> — most notably for any function bound to a dynamic delegate (Module 7).'},
{t:'chk',q:'Your delegate binding compiles but the callback never runs, and the function has no UFUNCTION() macro. Connected?',a:'<b>Directly.</b> <code>AddDynamic</code> looks the function up by name through reflection. Without <code>UFUNCTION()</code>, UHT never registered it, so there is nothing to find. The compiler cannot warn you because the macro-generated lookup is a string.'},

{t:'h',x:'UE_LOG'},
{t:'code',x:`UE_LOG(LogTemp, Log, TEXT("Just a simple log print"));

UE_LOG(LogAI, Warning, TEXT("X went wrong in Actor %s"), *GetName());`},
{t:'p',x:'Arguments are: <b>category</b> (LogTemp, LogAI, LogGame…), <b>verbosity</b> (Log, Warning, Error, Verbose), then a <code>TEXT()</code> format string and its arguments.'},
{t:'warn',lab:'That asterisk is not a pointer',x:'<code>*GetName()</code> looks like a dereference and is not. <code>GetName()</code> returns an <code>FString</code>; <code>FString</code> overloads <code>operator*</code> to yield the underlying character array, which is what the variadic macro requires. Any time you feed an <code>FString</code> into <code>UE_LOG</code>, it needs the <code>*</code>. Forgetting it produces a compile error that reads like nonsense.'},
{t:'p',x:'Log the <i>values</i>, not just the fact that you got somewhere. "Reached OnHealthChanged" tells you almost nothing; "OnHealthChanged: %s now at %f (delta %f)" tells you what actually went wrong.'}
],
quiz:[
{q:'What does GENERATED_BODY() do?',
 opts:['Injects engine boilerplate produced by Unreal Header Tool for reflection','Generates the constructor','Marks the class abstract','Exposes every member to Blueprint'],
 c:0,why:'It is the insertion point for UHT-generated reflection code — which is also why the .generated.h include must come last.'},
{q:'Which UPROPERTY specifier allows editing on class defaults but NOT on individual placed instances?',
 opts:['EditAnywhere','EditDefaultsOnly','VisibleAnywhere','EditInstanceOnly'],
 c:1,why:'EditDefaultsOnly locks per-instance editing, preventing one-off tweaks that only reproduce in a single level.'},
{q:'Why does <code>*GetName()</code> have an asterisk in a UE_LOG call?',
 opts:['GetName returns a pointer that must be dereferenced','It marks the argument as optional','FString overloads operator* to return the raw character array the macro needs','It prevents a copy of the string'],
 c:2,why:'It is an operator overload, not pointer dereferencing — a genuine source of confusion for people who know standard C++.'},
{q:'A member variable with no UPROPERTY() macro:',
 opts:['Behaves identically to one with it','Is automatically read-only','Will not compile','Is invisible to the editor, serialization, replication and garbage collection'],
 c:3,why:'The macro is what makes the member exist as far as the engine is concerned. Unmarked members are plain C++ the engine cannot track.'},
{q:'<code>BlueprintNativeEvent</code> on a function means Blueprint can:',
 opts:['Override or extend it but not call it','Call it but not override it','Neither','Both call and override it'],
 c:0,why:'Native implementation with Blueprint override capability. Add BlueprintCallable if you also want it callable.'}
]
},

/* ---------------------------------------------------------- 11 */
{
grp:"Part V — The Engine Layer",
title:"Modules",
lede:"Unreal is over a thousand modules. Yours is one of them, and eventually you will need to tell it about another.",
blocks:[
{t:'h',x:'What a module is'},
{t:'p',x:'A module is a unit of compilation and dependency with its own <code>YourModule.build.cs</code> describing what it needs. Your game code lives in one — or, as it grows, several. Engine modules live under your engine install (for example <code>Engine\\Source\\Runtime\\AIModule</code>).'},

{t:'h',x:'The problem you will actually hit'},
{t:'p',x:'Not every module is available by default. You write code using an AI class, and it will not compile — not because of a typo, but because your module has never declared a dependency on <code>AIModule</code>. The fix is in the build file:'},
{t:'code',x:`PublicDependencyModuleNames.AddRange(new string[] {
    "Core", "CoreUObject", "Engine", "InputCore",
    "AIModule", "GameplayTasks", "UMG", "GameplayTags",
    "OnlineSubsystem", "DeveloperSettings" });`},
{t:'p',x:'Note that <code>.build.cs</code> is C#, not C++, and is executed by Unreal Build Tool. Dependencies can also be added via the <code>.uproject</code> — the editor does this automatically under <code>AdditionalDependencies</code> when you create a class deriving from a module you do not yet reference.'},
{t:'chk',q:'You add a <code>UBehaviorTree</code> member and get "unresolved external symbol" or an unknown-type error. Is your code wrong?',a:'Probably not — you have most likely not added <b>AIModule</b> to <code>PublicDependencyModuleNames</code> in your <code>.build.cs</code>. This is one of the highest-frequency early stumbles in Unreal C++, and the error message rarely says "add a module dependency".'},

{t:'h',x:'Why AIModule, specifically'},
{t:'p',x:'That example list is not a settings menu of features to switch on. Each entry is there because the project genuinely uses something from it. <code>AIModule</code> is on the list because the AI classes physically live there:'},
{t:'list',x:[
'<code>AAIController</code> — the brain that possesses an enemy pawn',
'Behavior Trees — <code>UBehaviorTree</code>, <code>UBehaviorTreeComponent</code>, <code>UBTTaskNode</code>, <code>UBTService</code>, <code>UBTDecorator</code>',
'Blackboards — <code>UBlackboardComponent</code>, <code>UBlackboardData</code>',
'AI Perception — <code>UAIPerceptionComponent</code>, <code>UAISense_Sight</code>, <code>UAISense_Hearing</code>',
'EQS (Environment Query System) and <code>UPathFollowingComponent</code>']},
{t:'p',x:'Your game module starts with roughly <code>Core</code>, <code>CoreUObject</code>, <code>Engine</code> and <code>InputCore</code> — the minimum to be a game. Unreal also ships architectural visualisation, linear film work and motion graphics, none of which should pay compile time and link size for a behaviour tree system they never touch. So the default is lean and you opt in.'},
{t:'p',x:'Read the rest of that list the same way and it stops looking like boilerplate: <code>UMG</code> because the project has widgets, <code>GameplayTags</code> because it uses tags, <code>DeveloperSettings</code> because it defines project settings, <code>AIModule</code> because it has enemies. The dependency list is a genuine piece of documentation about what your game is made of.'},
{t:'warn',lab:'Two errors, one cause',x:'<p>A missing module dependency surfaces two different ways:</p><p><b>Compile</b> — "cannot open include file: BehaviorTree/BehaviorTree.h". The include paths were never added.<br><b>Link</b> — "unresolved external symbol". The header resolved through some transitive path, but the library itself is not linked.</p><p>Neither message says "add a module dependency", which is why this eats an afternoon the first time.</p>'},

{t:'h',x:'Public versus Private dependencies'},
{t:'table',head:['List','Meaning'],rows:[
['<code>PublicDependencyModuleNames</code>','Needed by your <b>headers</b>. Anything depending on your module inherits it.'],
['<code>PrivateDependencyModuleNames</code>','Needed only inside your <b>.cpp</b> files. Not propagated to dependents.']]},
{t:'p',x:'Prefer Private wherever the work allows.'},
{t:'aside',lab:'The same idea as forward declaration, one level up',x:'A header exposes its includes to everything downstream (Module 4). A public module dependency exposes itself to every module downstream. Both are the same instinct at different scales: keep your dependency surface as small as the job permits. If the type never appears in your public interface, nobody downstream needs to know it exists.'},
{t:'chk',q:'You use <code>UBehaviorTree</code> only inside your <code>.cpp</code>, never in a header. Public or Private?',a:'<b>Private.</b> Nothing in your public interface mentions the type, so no module depending on you needs to know about AIModule. Exactly the reasoning behind forward declaring in a header and including in the source.'},

{t:'h',x:'Why split into modules'},
{t:'list',x:[
'Encapsulation — enforced boundaries between systems rather than convention alone.',
'Reuse — lift a framework module into your next project intact.',
'Ship only what you use — editor-only functionality can be excluded from builds.',
'Faster compilation and linking.',
'Control over what loads and when.']},
{t:'aside',lab:'For a solo project',x:'You almost certainly do not need multiple modules yet. One game module is correct until you have a body of genuinely reusable framework code and a reason to keep it separate from game-specific content. What you <i>do</i> need immediately is the ability to recognise a missing-module error and know that <code>.build.cs</code> is where you fix it.'}
],
quiz:[
{q:'Where do you declare that your module depends on AIModule?',
 opts:['In the .uproject only','In DefaultEngine.ini','In YourModule.build.cs, in PublicDependencyModuleNames','In the class header'],
 c:2,why:'The build file is the primary place. The .uproject can also carry dependencies, and the editor adds some there automatically.'},
{q:'What language is a .build.cs file?',
 opts:['C++','C#','Python','JSON'],
 c:1,why:'C#, executed by Unreal Build Tool.'},
{q:'Which is NOT a stated benefit of splitting code into modules?',
 opts:['Faster compilation and linking','Reuse across projects','Shipping only the modules you use','Automatically better runtime frame rate'],
 c:3,why:'Modules are a build and organisation tool. They affect what is loaded and how fast you compile, not raw frame time.'},
{q:'A type appears only inside your <code>.cpp</code> files, never in a header. Which list should the module go in?',
 opts:['PrivateDependencyModuleNames','PublicDependencyModuleNames','Both lists, to be safe','Neither — .cpp usage needs no dependency'],
 c:0,why:'Nothing downstream needs to know the type exists. Same instinct as forward declaring in the header and including in the source.'},
{q:'Why is AIModule not enabled by default?',
 opts:['It is deprecated in UE5','It requires a separate licence','It conflicts with the Engine module','Plenty of Unreal projects — archviz, film, motion graphics — have no AI, and should not pay compile and link cost for it'],
 c:3,why:'The default game module is deliberately lean: Core, CoreUObject, Engine, InputCore. You opt into the rest.'}
]
},

/* ---------------------------------------------------------- 12 */
{
grp:"Part VI — Lifetime & Memory",
title:"Garbage Collection and Object Lifetime",
lede:"Unreal manages memory for UObjects — but only for the references it can see. Making your references visible is your job, and it is one line.",
blocks:[
{t:'h',x:'How GC works'},
{t:'p',x:'Unreal runs garbage collection roughly every 60 seconds by default, clearing objects nothing references any more. You do not <code>delete</code> UObjects.'},
{t:'p',x:'For this to work, the engine must be able to <b>find</b> your references. That is what <code>UPROPERTY()</code> does for a pointer — it enters the reference graph.'},
{t:'code',x:`UPROPERTY()
TObjectPtr<AActor> FocusedActor;`},
{t:'warn',lab:'The bug this prevents',x:'An unmarked pointer member is invisible to GC. Two failure modes follow: the object it points at may be collected out from under you while you still hold the pointer (you now hold garbage), and it will never be automatically nulled. Rule: <b>if a UObject pointer is a member of a class, it wants a UPROPERTY()</b> — even an empty one with no specifiers.'},
{t:'chk',q:'Why does a bare <code>UPROPERTY()</code> with no specifiers still matter?',a:'The specifiers control <i>editor and Blueprint</i> behaviour. The macro itself is what registers the property with the reflection and GC systems. An empty <code>UPROPERTY()</code> exposes nothing to anyone but makes the reference visible to the garbage collector — which is frequently the entire reason it is there.'},

{t:'h',x:'Automatic nulling — and its limits'},
{t:'p',x:'References to destroyed <b>Actors and ActorComponents</b> can be automatically nulled, provided the pointer is a <code>UPROPERTY()</code>. It does not extend to arbitrary UObjects.'},
{t:'p',x:'The timing matters. Ari Arnbjörnsson: <i>"Destroyed actors don\'t have references to them nulled until they\'re actually garbage collected. That\'s what IsValid(yourobject) is used for checking."</i>'},
{t:'p',x:'So between <code>Destroy()</code> and the next GC pass there is a window in which your pointer is non-null and the actor is dead. <code>IsValid()</code> covers that window; a bare null check does not.'},
{t:'warn',lab:'Changing in UE5',x:'<i>"This will be changing a bit in UE5. The GC will no longer clear UPROPERTY + RawPtr/TObjectPtr references (even for Actors) but instead mark them as garbage (MarkAsGarbage()) and not GC them. The only way to clear the memory will be to null the reference or use weak pointers."</i> — Ari Arnbjörnsson. Practical upshot: lean on <code>IsValid()</code> rather than <code>!= nullptr</code>, and reach for weak pointers where you genuinely do not want to own the object.'},
{t:'chk',q:'You destroyed an actor two frames ago and hold a UPROPERTY pointer to it. Is <code>if (MyActor)</code> safe?',a:'<b>Not reliably.</b> Nulling does not happen at destruction — it happens at collection, which may be up to a minute away. The pointer is still non-null while the actor is dead. Use <code>if (IsValid(MyActor))</code>, which checks both null and pending-kill/garbage state.'},

{t:'h',x:'TWeakObjectPtr&lt;T&gt;'},
{t:'p',x:'A weak pointer says: I want to reference this object, but I do not want to keep it alive. If everyone else lets go, it should be collected.'},
{t:'code',x:`TWeakObjectPtr<UGameAbility> MyReferencedAbility;

// Must resolve through .Get() before use
UGameAbility* Ability = MyReferencedAbility.Get();
if (Ability)
{
}`},
{t:'p',x:'<code>.Get()</code> either returns a valid object or <code>nullptr</code> if it has been destroyed. That safety is the point — you cannot accidentally use a stale weak pointer without going through the check.'},
{t:'chk',q:'A cached "last actor that damaged me" reference — hard UPROPERTY or weak pointer?',a:'<b>Weak pointer.</b> A cache is not ownership. A hard reference would keep a dead enemy in memory indefinitely just because you remembered it hit you once. A weak pointer lets it die and hands you null when you next ask for it.'},

{t:'h',x:'The Class Default Object'},
{t:'p',x:'Every class has a CDO — an automatically-created default instance used as the template for new instances. You can read from it without constructing anything:'},
{t:'code',x:`const URogueSaveGameSettings* Settings = GetDefault<URogueSaveGameSettings>();
CurrentSlotName = Settings->SaveSlotName;`},
{t:'warn',lab:'Do not write to the CDO',x:'Modifying the CDO bleeds into every instance created afterwards. Note the <code>const</code> in the example — that is deliberate, and it is the habit to copy.'},

{t:'h',x:'GC and frame time'},
{t:'p',x:'Collection is not free. Creating and destroying many objects at runtime — projectiles, impact effects, pickups — can produce visible hitches when a GC pass runs. The standard mitigation is <b>object pooling</b>: create a fixed set once, deactivate and reuse instead of destroying and respawning.'}
],
quiz:[
{q:'Why add UPROPERTY() to a UObject pointer member even with no specifiers?',
 opts:['To make the reference visible to the garbage collector','To expose it to Blueprint','To make it const','It has no effect without specifiers'],
 c:0,why:'The macro registers the property with reflection and GC. Specifiers are a separate concern layered on top.'},
{q:'You destroyed an actor. When is your UPROPERTY pointer to it nulled?',
 opts:['Immediately on Destroy()','At the end of the frame','When garbage collection actually runs','Never'],
 c:2,why:'Hence IsValid() rather than a plain null check — there is a real window where the pointer is non-null and the actor is dead.'},
{q:'What does TWeakObjectPtr express?',
 opts:['A reference that keeps the object alive','A reference that does not keep the object alive and may become invalid','A pointer that is thread-safe','A pointer to an asset on disk'],
 c:1,why:'Reference without ownership. Resolve with .Get() and check the result.'},
{q:'How do you safely use a TWeakObjectPtr?',
 opts:['Dereference it directly with -&gt;','Mark it UPROPERTY()','Cast it first','Call .Get() and null-check the result'],
 c:3,why:'.Get() returns the object or nullptr, which is exactly the check you need.'},
{q:'What is the risk of modifying a Class Default Object?',
 opts:['The change bleeds into every instance created afterwards','It crashes immediately','It is discarded on the next GC','It only affects Blueprint subclasses'],
 c:0,why:'The CDO is the template new instances are built from. Read it with GetDefault&lt;T&gt;() and treat it as const.'},
{q:'Frequent runtime spawning and destroying can cause:',
 opts:['Memory leaks Unreal cannot recover from','Replication failures','Blueprint compilation errors','GC hitches consuming a large chunk of frame time'],
 c:3,why:'Collection costs frame time. Object pooling is the usual answer for high-churn objects.'}
]
},

/* ---------------------------------------------------------- 13 */
{
grp:"Part VI — Lifetime & Memory",
title:"Asserts, and Core Redirects",
lede:"How to make broken states announce themselves immediately — and how to rename C++ without breaking every Blueprint that referenced it.",
blocks:[
{t:'h',x:'check and ensure'},
{t:'p',x:'This closes the loop opened in Module 1. When null is <i>not</i> an acceptable state, an assert is what you write instead of a silent guard.'},
{t:'code',x:`check(MyValue == 1);        // FATAL if false — halts execution
check(MyActorPointer);

if (ensure(MyActorPointer))  // non-fatal — logs, breaks in the debugger, continues
{
}`},
{t:'table',head:['','check','ensure'],rows:[
['On failure','Fatal — stops the game','Non-fatal — reports and continues'],
['Frequency','Every time','Once per session (<code>ensureAlways</code> for every time)'],
['Typical use','Truly unrecoverable state','Suspicious state you want reported but can survive'],
['In an if-statement','Not usually','Yes — <code>if (ensure(Ptr))</code> is idiomatic']]},
{t:'p',x:'Both are <b>compiled out of shipping builds</b> by default. They cost your players nothing, so there is no performance argument for omitting them during development.'},
{t:'chk',q:'What does <code>if (ensure(MyPointer))</code> give you that <code>if (MyPointer)</code> does not?',a:'A <b>report</b>. Both branch identically, but <code>ensure</code> also logs, generates a callstack and breaks in an attached debugger. The plain check fails silently and you learn nothing. Same control flow, vastly more information.'},
{t:'chk',q:'Should you assert when a designer forgot to assign an asset?',a:'Usually <b>no</b>. Looman\'s guidance: asserts are best for <i>coder</i> mistakes. To a designer without a debugger attached, an assert looks like an unexplained crash or a long stall while a minidump is written, and tells them nothing actionable. A screen message or log naming the missing asset is far more useful. (He notes he still uses asserts for content in solo or very small team projects — where the coder and the designer are the same person, which describes you.)'},
{t:'warn',lab:'Do not assert in hot paths',x:'An <code>ensureAlways</code> inside <code>Tick</code> will flood you with reports and can stall the editor generating dumps. Prefer <code>ensure</code> (once per session) for anything that might fire repeatedly.'},

{t:'h',x:'Core Redirects'},
{t:'p',x:'You rename a C++ class, function, property or enum value. Every Blueprint that referenced the old name now has a broken node. Core Redirects are the <code>.ini</code>-based mapping from old name to new one, and they save you from manually repairing dozens of assets.'},
{t:'p',x:'They cover classes, functions, properties, enums, structs and packages. Modern IDEs with real Unreal support — JetBrains Rider in particular — can generate them for you when you refactor Blueprint-exposed code.'},
{t:'aside',lab:'Why to learn this before you need it',x:'This is a rescue tool that only exists if you knew about it in advance. The moment you discover you need it is the moment you have already renamed something and are staring at forty broken Blueprints. Knowing the feature exists — and knowing that renaming a C++ symbol referenced by Blueprints is a non-trivial operation — is 90% of the benefit. Which is also an argument for settling on your project prefix (Module 8) now, while a rename is still cheap.'},
{t:'chk',q:'You renamed <code>ARogueCharacter</code> to <code>AHasardCharacter</code> and your Blueprints are broken. Options?',a:'Either repair each Blueprint by hand, or add a <b>Core Redirect</b> in your <code>.ini</code> mapping the old class name to the new one so existing assets resolve automatically. The redirect is faster, reversible, and does not risk missing a reference.'}
],
quiz:[
{q:'Difference between check() and ensure()?',
 opts:['check is for pointers, ensure for booleans','check is fatal; ensure reports and allows execution to continue','ensure is fatal; check is not','They are identical'],
 c:1,why:'Fatal versus non-fatal. ensure also fires only once per session unless you use ensureAlways.'},
{q:'Do asserts hurt shipping performance?',
 opts:['No — they are compiled out of shipping builds by default','Yes, significantly','Only check() does','Only in multiplayer'],
 c:0,why:'They cost nothing in a shipped build, so there is no reason to be sparing with them during development.'},
{q:'How often does ensure() trigger?',
 opts:['Every time the condition fails','Only in the editor','Once per level load','Once per session'],
 c:3,why:'Once per session. ensureAlways triggers every time — use it deliberately, not in hot paths.'},
{q:'What are Core Redirects for?',
 opts:['Redirecting network traffic','Redirecting log output to a file','Mapping old C++ names to new ones so existing Blueprints and assets keep resolving after a rename','Loading assets asynchronously'],
 c:2,why:'A refactoring tool configured in .ini files — the thing that makes renaming Blueprint-exposed C++ survivable.'},
{q:'Best practice when a designer has not assigned a required asset?',
 opts:['A log or on-screen message naming what is missing','check() so it fails hard','Silently do nothing','ensureAlways() in Tick'],
 c:0,why:'Asserts are for coder errors. A designer without a debugger just sees a crash; a message tells them what to fix.'}
]
},

{
grp:"Assessment",
title:"Final Examination",
lede:"Fifteen questions across the whole course. No hints in the text — answer, then read the reasoning. 12 or better is a pass.",
blocks:[
{t:'p',x:'Take this without scrolling back. If you score below 12, the explanations will tell you which modules to revisit — go back and reread those specifically rather than the whole course.'}
],
quiz:[
{q:'Forward declaring a class in a header rather than including it primarily improves what?',
 opts:['Runtime frame rate','Blueprint load times','Memory usage in shipping builds','Compile times and dependency coupling'],
 c:3,why:'Build-time only. Identical machine code — the win is that fewer files rebuild when something changes. [Module 4]'},
{q:'When should you NOT write a null check?',
 opts:['When the pointer is a UPROPERTY','When null represents a broken state the game should not silently continue from','When the pointer is const','Never — always check'],
 c:1,why:'Silent guards on impossible states hide bugs. Assert instead. [Module 1]'},
{q:'A Blueprint contains a Cast node in a branch that never executes. Is the target class loaded?',
 opts:['No, casts load lazily','Only if an instance exists in the level','Yes — it is a hard reference resolved when the Blueprint loads','Only in packaged builds'],
 c:2,why:'Load-time, not execution-time. This is why cast-heavy Blueprints balloon memory. [Module 5]'},
{q:'Which prefix does <code>Implements&lt;T&gt;()</code> take?',
 opts:['U','I','F','A'],
 c:0,why:'U for the reflection query, I for Execute_ calls. "U for does it, I for do it." [Module 6]'},
{q:'A function bound with AddDynamic silently never fires. Most likely cause?',
 opts:['It returns a value','It is not virtual','It is not marked UFUNCTION()','It is private'],
 c:2,why:'Dynamic delegates resolve by name through reflection; without UFUNCTION() there is nothing to find. [Modules 7, 10]'},
{q:'Where should delegates be bound?',
 opts:['The constructor','PostInitializeComponents() or BeginPlay()','Tick()','The class default object'],
 c:1,why:'Constructor bindings serialize into Blueprints and survive their own removal from C++. [Module 7]'},
{q:'Text a player will read on screen must be:',
 opts:['FString','FName','FString converted at display time','FText'],
 c:3,why:'FText is the only localisable type; anything else is a cleanup task deferred to your future self. [Module 9]'},
{q:'<code>TObjectPtr&lt;T&gt;</code> belongs where?',
 opts:['Header member properties only','Everywhere raw pointers appear','Function-local variables only','Only on asset references'],
 c:0,why:'Header members. Locals in .cpp gain nothing. In shipping builds it behaves as a raw pointer. [Module 1]'},
{q:'Why do many static engine functions require a WorldContextObject?',
 opts:['For thread safety','Static functions have no instance, so no world — and Unreal may host several','To enable replication','To support Blueprint'],
 c:1,why:'PIE sessions, editor previews and asset editors each have their own UWorld. [Module 2]'},
{q:'You destroyed an actor and still hold a UPROPERTY pointer. Which check is correct?',
 opts:['if (MyActor)','if (MyActor != nullptr)','if (IsValid(MyActor))','if (MyActor-&gt;IsActive())'],
 c:2,why:'Nulling happens at collection, not destruction. IsValid covers the gap. [Module 12]'},
{q:'The asterisk in <code>UE_LOG(LogTemp, Log, TEXT("%s"), *GetName())</code> is:',
 opts:['A pointer dereference','A multiplication','A format specifier','An FString operator overload returning the raw character array'],
 c:3,why:'Not pointer syntax at all — an overloaded operator. [Module 10]'},
{q:'You need a class-reference a designer can assign so your code can spawn it. Which type?',
 opts:['TSubclassOf&lt;AProjectileActor&gt;','AProjectileActor*','TWeakObjectPtr&lt;AProjectileActor&gt;','UClass* with no template'],
 c:0,why:'TSubclassOf holds a class, and the template argument filters the editor dropdown to valid subclasses. [Module 9]'},
{q:'ensure() versus check():',
 opts:['ensure is fatal, check is not','check is fatal; ensure reports once per session and continues','Both survive into shipping builds','Both are fatal'],
 c:1,why:'And both are compiled out of shipping. [Module 13]'},
{q:'Your AI class will not compile with an unknown-type error on UBehaviorTree. First thing to check?',
 opts:['Whether GENERATED_BODY is present','Whether the class is marked UCLASS','Whether AIModule is in PublicDependencyModuleNames in the .build.cs','Whether you forward declared it'],
 c:2,why:'Missing module dependency — the classic early stumble, with an error message that rarely says so. [Module 11]'},
{q:'A cached reference to "the last actor that damaged me" should be:',
 opts:['A TWeakObjectPtr','A hard UPROPERTY pointer','A raw pointer with no macro','A TSubclassOf'],
 c:0,why:'A cache is not ownership. A hard reference would keep a dead actor resident indefinitely. [Module 12]'}
]
}
];

/* ============================================================
   RENDER
   ============================================================ */
const done = new Set();
let cur = 0;

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* Single-pass tokenizer. Chained .replace() calls would re-scan the <span>
   markup emitted by earlier passes and mangle it, so every token class is
   matched in one alternation and emitted via a replacer function. */
const TOKENS = new RegExp([
  '(\\/\\*[\\s\\S]*?\\*\\/|\\/\\/[^\\n]*)',                       // 1 comment
  '("[^"\\n]*")',                                                 // 2 string
  '\\b(UPROPERTY|UFUNCTION|UCLASS|USTRUCT|UENUM|UINTERFACE|' +
    'GENERATED_BODY|UE_LOG|DECLARE_DYNAMIC_MULTICAST_DELEGATE' +
    '(?:_\\w+)?|DECLARE_DELEGATE(?:_\\w+)?|TEXT|check|ensure' +
    '(?:Always)?)\\b',                                            // 3 macro
  '\\b(class|struct|enum|void|float|double|bool|const|public|private|' +
    'protected|if|else|for|while|return|new|static|virtual|override|' +
    'template|namespace|true|false|nullptr|this|int32|uint8|int16|' +
    'uint16|string)\\b',                                          // 4 keyword
  '\\b([UAFTIEG][A-Z]\\w*)\\b'                                    // 5 UE type
].join('|'), 'g');

function hi(code){
  return esc(code).replace(TOKENS, (m, cm, st, mc, kw, ty) => {
    const cls = cm ? 'cm' : st ? 'st' : mc ? 'mc' : kw ? 'kw' : ty ? 'ty' : null;
    return cls ? '<span class="' + cls + '">' + m + '</span>' : m;
  });
}

function buildNav(){
  const nav = document.getElementById('nav');
  let html = '', lastGrp = '';
  COURSE.forEach((m,i)=>{
    if(m.grp !== lastGrp){ html += '<div class="grp">'+m.grp+'</div>'; lastGrp = m.grp; }
    html += '<button data-i="'+i+'"><span class="n">'+String(i).padStart(2,'0')+'</span>'+m.title+'<span class="dot">&#10003;</span></button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
}

function refreshNav(){
  document.querySelectorAll('#nav button').forEach(b=>{
    const i = +b.dataset.i;
    b.classList.toggle('on', i===cur);
    b.classList.toggle('done', done.has(i));
  });
  const pct = Math.round(done.size/COURSE.length*100);
  document.querySelector('#prog>i').style.width = pct+'%';
  document.getElementById('progtxt').textContent =
    done.size+' of '+COURSE.length+' modules complete'+(done.size===COURSE.length?'  — course finished':'');
}

function renderBlocks(bl){
  return bl.map(b=>{
    switch(b.t){
      case 'h': return '<h3>'+b.x+'</h3>';
      case 'p': return '<p>'+b.x+'</p>';
      case 'code': return '<pre><code>'+hi(b.x)+'</code></pre>';
      case 'aside': return '<div class="aside"><div class="lab">'+(b.lab||'Why it works')+'</div>'+(b.x.trim().startsWith('<p')?b.x:'<p>'+b.x+'</p>')+'</div>';
      case 'warn': return '<div class="warn"><div class="lab">'+(b.lab||'Careful')+'</div>'+(b.x.trim().startsWith('<p')?b.x:'<p>'+b.x+'</p>')+'</div>';
      case 'list': return '<ul>'+b.x.map(li=>'<li>'+li+'</li>').join('')+'</ul>';
      case 'table': return '<table><thead><tr>'+b.head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+
        b.rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
      case 'chk': return '<div class="chk"><div class="lab">Check yourself</div><p class="q">'+b.q+'</p>'+
        '<button onclick="this.parentNode.classList.add(\'open\')">Reveal answer</button>'+
        '<div class="ans">'+b.a+'</div></div>';
    }
    return '';
  }).join('');
}

function renderQuiz(m, idx){
  const isExam = idx === COURSE.length-1;
  let h = '<div class="quiz"><h4>'+(isExam?'Final Examination':'Module '+idx+' Quiz')+'</h4>'+
    '<p class="hint">'+m.quiz.length+' questions. Pick one answer per question; reasoning appears immediately.</p>';
  m.quiz.forEach((q,qi)=>{
    h += '<div class="qi" data-q="'+qi+'"><p class="qt"><span class="num">Q'+(qi+1)+'</span>'+q.q+'</p>';
    q.opts.forEach((o,oi)=>{
      h += '<button class="opt" data-q="'+qi+'" data-o="'+oi+'">'+o+'</button>';
    });
    h += '<div class="why" data-why="'+qi+'"></div></div>';
  });
  h += '<div class="score" id="score"></div></div>';
  return h;
}

function go(i){
  cur = i;
  const m = COURSE[i];
  const isExam = i === COURSE.length-1;
  const main = document.getElementById('main');
  main.innerHTML =
    '<div class="kicker">'+(isExam?'Assessment':'Module '+i)+' &middot; '+m.grp+'</div>'+
    '<h2 class="title">'+m.title+'</h2>'+
    '<p class="lede">'+m.lede+'</p>'+
    renderBlocks(m.blocks)+
    renderQuiz(m,i)+
    '<div class="pager">'+
      '<button id="prev" '+(i===0?'disabled':'')+'>&larr; Previous</button>'+
      '<button id="next" class="primary" '+(i===COURSE.length-1?'disabled':'')+'>Next module &rarr;</button>'+
    '</div>';
  window.scrollTo(0,0);

  const answered = {}; let correct = 0;
  main.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick = ()=>{
      const qi = +btn.dataset.q, oi = +btn.dataset.o;
      if(answered[qi]!==undefined) return;
      answered[qi] = oi;
      const q = m.quiz[qi];
      main.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(b=>{
        b.disabled = true;
        if(+b.dataset.o === q.c) b.classList.add('right');
        else if(+b.dataset.o === oi) b.classList.add('wrong');
      });
      if(oi === q.c) correct++;
      const why = main.querySelector('.why[data-why="'+qi+'"]');
      why.innerHTML = (oi===q.c?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q.why;
      why.classList.add('show');

      if(Object.keys(answered).length === m.quiz.length){
        const sc = document.getElementById('score');
        const pct = Math.round(correct/m.quiz.length*100);
        let verdict;
        if(isExam) verdict = correct>=12 ? ' — pass. You have the vocabulary to read engine source and Looman\'s Action Roguelike project without getting lost.'
                                         : ' — below the pass mark of 12. Revisit the modules named in the explanations above, then retake.';
        else verdict = pct===100 ? ' — clean sweep.' : pct>=60 ? ' — solid. Reread the explanations you missed before moving on.' : ' — worth rereading this module before continuing.';
        sc.innerHTML = '<b>Score: '+correct+' / '+m.quiz.length+' ('+pct+'%)</b>'+verdict;
        sc.classList.add('show');
        done.add(i); refreshNav();
      }
    };
  });

  const p = document.getElementById('prev'), n = document.getElementById('next');
  if(p) p.onclick = ()=>go(i-1);
  if(n) n.onclick = ()=>go(i+1);
  refreshNav();
}

buildNav(); go(0);
</script>
</body>
</html>
